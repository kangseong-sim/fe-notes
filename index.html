ong>블록 스코프<\/strong>. `for (let i...)`는 반복마다 새 바인딩이 생긴다\n- <strong>핵심:<\/strong> 스코프는 <strong>정의 위치(렉시컬)<\/strong> 로 정해지고 변수 탐색은 <strong>안쪽 → 바깥<\/strong> 한 방향이다. `this`만 예외로 호출 방식이 정한다(화살표 함수는 제외).\n- <strong>꼬리질문:<\/strong>\n  - \"`for (var i...)` 안의 `setTimeout`이 전부 같은 값을 찍는 이유?\" → `var`는 함수 스코프라 바인딩이 하나뿐이고, 콜백은 루프가 끝난 뒤 그 하나를 읽는다. `let`이면 반복마다 바인딩이 따로 생긴다.\n  - \"스코프 체인이 깊으면 느린가?\" → 엔진이 최적화해 실무에서 체감할 일은 거의 없다. 문제는 성능보다 <strong>가려짐(shadowing)<\/strong> 으로 인한 버그다.\n- <strong>출처:<\/strong> [MDN — Closures: Lexical scoping](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures#lexical_scoping) · [MDN — let](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let)\n\n### 호이스팅과 TDZ (Hoisting, Temporal Dead Zone)\n\n- <strong>뭐야:<\/strong> 호이스팅은 실행 전에 선언을 먼저 등록해서, 선언이 맨 위로 끌어올려진 것처럼 보이는 현상이다. TDZ는 `let`·`const`·`class`가 등록은 됐지만 아직 초기화되지 않아 접근하면 에러가 나는 구간이다.\n- <strong>왜:<\/strong> 선언 종류마다 초기화 시점이 달라 증상이 정반대로 나온다. 선언보다 위에서 변수를 썼는데 `undefined`가 나와 조용히 넘어가거나, 반대로 `ReferenceError: Cannot access 'x' before initialization`이 난다.\n- <strong>어떻게:<\/strong>\n  - 컨텍스트가 만들어질 때 선언을 먼저 등록한다 → \"끌어올려진 것처럼\" 보인다\n  - `var` — 등록과 동시에 `undefined`로 초기화 → 선언 전 접근이 <strong>조용히 `undefined`<\/strong>\n  - `let`·`const`·`class` — 등록은 되지만 <strong>초기화 전까지 접근 불가<\/strong> → 이 구간이 TDZ\n  - 함수 선언문은 <strong>본문까지 통째로<\/strong> 올라간다. 함수 표현식(`const f = () => {}`)은 변수 규칙을 따른다\n  ```js\n  console.log(a); // undefined\n  console.log(b); // ReferenceError (TDZ)\n  var a = 1;\n  let b = 2;\n  ```\n- <strong>핵심:<\/strong> 셋 다 호이스팅되지만 <strong>초기화 시점<\/strong>이 다르다. `var`는 <strong>`undefined`로 조용히<\/strong>, `let`·`const`는 <strong>TDZ로 시끄럽게<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"그럼 `let`은 호이스팅이 안 되는 건가?\" → 용어 문제다(MDN도 합의된 용어가 아니라고 적는다). 다만 선언이 스코프 전체에 영향을 주는 건 맞다. 안 그랬다면 바깥 같은 이름 변수가 보여야 하는데, 선언 전 접근이 TDZ 에러를 낸다. 참고로 TDZ 안에서는 `typeof`도 에러다.\n  - \"TDZ가 왜 좋은가?\" → 초기화 전 사용을 실행 시점에 바로 드러낸다. `var`처럼 `undefined`로 흘러가 엉뚱한 곳에서 터지는 걸 막는다.\n  - \"모듈 순환 import에서 TDZ가 나는 경우는?\" → A가 B를 import하고 B가 A의 `const`를 최상위에서 바로 읽으면, A가 아직 초기화 전이라 TDZ 에러가 난다.\n- <strong>출처:<\/strong> [MDN Glossary — Hoisting](https://developer.mozilla.org/en-US/docs/Glossary/Hoisting) · [MDN — let: TDZ](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let#temporal_dead_zone_tdz)\n\n### 클로저 (Closure)\n\n- <strong>뭐야:<\/strong> 함수가 만들어질 때 자신이 정의된 환경(바깥 변수들)에 대한 참조를 같이 들고 다니는 성질이다. 바깥 함수가 끝나도 안쪽 함수가 살아 있으면 그 변수들에 계속 접근할 수 있다.\n- <strong>왜:<\/strong> 이 성질 때문에 콜백·이벤트 핸들러·타이머가 만들어진 시점의 환경(변수 바인딩)을 계속 붙잡고 있어, 그 뒤 새로 만들어진 환경(React 렌더 등)의 최신 값을 못 보는 버그가 생긴다. 반대로 이 성질을 이용하면 상태를 외부에서 못 건드리게 숨길 수 있다.\n- <strong>어떻게:<\/strong>\n  - 함수는 생성될 때 <strong>자신이 정의된 렉시컬 환경에 대한 참조<\/strong>를 같이 들고 다닌다\n  - 바깥 함수가 끝나도 안쪽 함수가 살아 있으면 그 환경도 GC되지 않고 남는다\n  - 쓰임: 은닉 상태(카운터, 캐시), 팩토리, 부분 적용, 디바운스 구현(타이머 id를 클로저에 보관)\n  - 비용: 들고 있는 환경이 메모리에 남는다 → 큰 객체를 무심코 붙잡으면 누수\n- <strong>핵심:<\/strong> 클로저는 값의 복사가 아니라 <strong>환경에 대한 참조<\/strong>다. 그 환경이 <strong>어느 시점에 만들어졌느냐<\/strong>가 버그를 가른다.\n- <strong>꼬리질문:<\/strong>\n  - \"클로저가 값을 복사하나 참조하나?\" → 변수 바인딩을 참조한다. 같은 환경 안에서 `let` 값을 바꾸면 클로저도 바뀐 값을 본다. 문제는 <strong>환경 자체가 새로 만들어지는<\/strong> 경우(React 렌더마다)다.\n  - \"클로저 때문에 메모리가 새는 대표 경우는?\" → 큰 데이터를 참조하는 함수를 전역 리스너·타이머·캐시에 등록하고 해제를 안 할 때.\n- <strong>출처:<\/strong> [MDN — Closures](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures) · [MDN — Closures: 루프에서 만드는 클로저](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures#creating_closures_in_loops_a_common_mistake)\n\n### 커링과 부분 적용 (Currying, Partial Application)\n\n- <strong>뭐야:<\/strong> 커링은 인자 여러 개를 받는 함수를 인자를 하나씩 받는 함수 사슬(`f(a)(b)(c)`)로 바꾸는 것이고, 부분 적용은 인자 일부를 미리 고정한 새 함수를 만드는 것이다. 받은 인자는 클로저에 기억된다.\n- <strong>왜:<\/strong> 같은 인자(조직 ID, 로그 레벨)를 매번 넘기는 함수가 여기저기 복붙되는 걸 줄이려고 쓴다. `onClick={() => select(id)}` 같은 래퍼를 어떻게 일반화하느냐는 질문으로도 나온다.\n- <strong>어떻게:<\/strong>\n  - <strong>커링<\/strong> — `f(a, b, c)`를 `f(a)(b)(c)`로 바꿔, 인자를 하나씩 받는 함수 사슬로 만든다. 받은 인자는 <strong>클로저<\/strong>에 쌓인다\n  - <strong>부분 적용<\/strong> — 인자 일부를 미리 고정한 새 함수를 만든다. `fn.bind(null, a)`도 부분 적용이다(`this`까지 고정된다는 점이 다름)\n  - 범용 `curry`는 `fn.length`로 인자 수를 세서 다 모이면 실행한다 → <strong>나머지 매개변수(`...args`) 함수에는 안 통한다<\/strong>\n  ```js\n  const log = (level) => (scope) => (msg) => console[level](`[${scope}] ${msg}`);\n  const warnAuth = log(\"warn\")(\"auth\");\n  warnAuth(\"토큰 만료\"); // [auth] 토큰 만료\n  ```\n- <strong>핵심:<\/strong> 커링은 <strong>인자를 하나씩<\/strong>, 부분 적용은 <strong>일부를 먼저<\/strong> 고정. 둘 다 <strong>클로저로 인자를 기억<\/strong>하는 것이고, 목적은 <strong>설정과 실행의 분리<\/strong>다.\n- <strong>꼬리질문:<\/strong>\n  - \"남발하면?\" → 몇 번째 괄호가 무슨 뜻인지 안 보이고 스택 트레이스가 익명 함수로 덮인다. 옵션 객체를 받는 팩토리가 더 읽기 쉬울 때가 많다.\n  - \"핸들러 팩토리 `handle(id)`가 매 렌더 새 함수를 만들면?\" → `memo` 자식의 비교가 깨진다. 자식이 무거울 때만 `data-id` + 위임 등으로 바꾼다.\n- <strong>출처:<\/strong> [javascript.info — Currying](https://javascript.info/currying-partials) · [MDN — bind(): Partially applied functions](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/bind)\n\n### stale closure와 React (Stale Closure)\n\n- <strong>뭐야:<\/strong> 콜백이나 effect가 자신이 만들어진 렌더의 옛 값을 계속 붙잡고 있어 최신 값을 못 보는 현상이다. React 함수 컴포넌트는 렌더마다 새로 호출돼 렌더마다 새 스코프가 생기기 때문에 일어난다.\n- <strong>왜:<\/strong> 모르면 `useEffect` 안의 `setInterval`이 `count`를 계속 0으로 보거나, effect에서 등록한 이벤트 리스너가 첫 렌더의 props를 들고 있는 버그를 설명하지 못한다.\n- <strong>어떻게:<\/strong>\n  - React 함수 컴포넌트는 <strong>렌더마다 새로 호출<\/strong>된다 → 렌더마다 새 스코프, 새 `count`\n  - effect·콜백은 <strong>그것이 만들어진 렌더의 스코프<\/strong>를 클로저로 잡는다. 의존성 배열에서 빠지면 옛 렌더의 값을 계속 본다\n  - 해법: ① 의존성 배열을 정직하게 ② 함수형 업데이트 `setCount(c => c + 1)` ③ 최신값을 `useRef`에 담아 읽기 ④ 주의: `useEffectEvent`(React 19.2에서 안정화)\n  ```js\n  useEffect(() => {\n    const id = setInterval(() => setCount(count + 1), 1000); // 항상 0+1\n    return () => clearInterval(id);\n  }, []);\n  // 고침: setCount(c => c + 1)\n  ```\n- <strong>핵심:<\/strong> 렌더마다 <strong>스냅샷<\/strong>이 생기고 콜백은 <strong>자기 렌더의 스냅샷<\/strong>을 본다. 의존성 배열은 \"언제 다시 실행하나\"만이 아니라 \"<strong>어떤 렌더 값을 쓰나<\/strong>\"의 선언이다.\n- <strong>꼬리질문:<\/strong>\n  - \"그냥 의존성에 다 넣으면?\" → 타이머·구독이 렌더마다 해제·재등록된다. 소켓 구독처럼 재연결 비용이 크면 ref나 effect event로 \"읽기만 최신\"을 분리한다.\n  - \"ref로 최신값을 읽는 방식의 대가는?\" → ref 변경은 리렌더를 안 일으키므로 화면에 쓰면 안 된다. 콜백 안에서 읽는 용도로만.\n  - \"비동기 응답이 늦게 와서 옛 요청 결과가 덮는 건 stale closure인가?\" → 비슷하지만 경쟁 상태(race)다. 이전 요청을 취소하거나 응답 시점에 \"아직 최신 요청인가\"를 확인한다(AbortController 참고).\n- <strong>출처:<\/strong> [react.dev — useEffectEvent](https://react.dev/reference/react/useEffectEvent) · [react.dev — React 19.2](https://react.dev/blog/2025/10/01/react-19-2)\n\n> 한 줄 정리: 스코프는 정의 위치로, 초기화는 선언 종류로, 클로저는 환경 참조로 — 커링은 그 환경에 인자를 쌓는 것이고, React에서는 그 환경이 렌더마다 새로 생긴다.\n\n## 2. 객체 모델\n\n### this 바인딩 규칙 (this Binding)\n\n- <strong>뭐야:<\/strong> `this`는 함수가 실행될 때 정해지는 문맥 객체로, 정의한 위치가 아니라 호출하는 방식(`obj.f()`, `new`, `call` 등)으로 정해진다. 화살표 함수만 예외로 바깥의 `this`를 쓴다.\n- <strong>왜:<\/strong> 호출 방식이 바뀌면 `this`도 바뀐다. 클래스 메서드를 React 이벤트 핸들러로 그냥 넘기면 `this`가 `undefined`가 되고, `setTimeout`에 넘기면 `this`가 인스턴스가 아니라 `globalThis`가 되어 `Cannot read properties of undefined`가 나는 게 대표 경우다.\n- <strong>어떻게:<\/strong> `this`는 정의가 아니라 <strong>호출 방식<\/strong>으로 정해진다. 우선순위 높은 순:\n  - <strong>`new`<\/strong> — 새로 만든 객체\n  - <strong>명시적<\/strong> — `call`·`apply`·`bind`로 지정한 객체(`bind`는 영구 고정)\n  - <strong>암시적<\/strong> — `obj.method()`처럼 점 앞의 객체\n  - <strong>기본<\/strong> — 그냥 `fn()`이면 strict mode에서 `undefined`, 아니면 전역 객체. 모듈·클래스 본문은 기본이 strict\n  - <strong>화살표 함수<\/strong>는 자기 `this`가 없다. 정의된 곳 바깥의 `this`를 <strong>렉시컬하게<\/strong> 쓴다. `call`·`bind`로도 못 바꾼다\n- <strong>핵심:<\/strong> \"<strong>점 앞이 누구냐<\/strong>\"가 기본 규칙이고, 메서드를 <strong>변수에 꺼내 넘기는 순간 점이 사라진다.<\/strong> 화살표 함수는 `this`를 <strong>바깥에서 빌린다<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"객체 리터럴 메서드를 화살표로 쓰면?\" → 객체가 아니라 바깥(모듈이면 `undefined`) `this`를 본다. 메서드에 화살표를 쓰면 안 되는 대표 경우.\n  - \"클래스 필드에 화살표 함수를 쓰는 것의 대가는?\" → `this`는 고정되지만 프로토타입이 아니라 <strong>인스턴스마다<\/strong> 함수가 하나씩 생긴다. 인스턴스가 많으면 메모리가 늘고, 상속에서 `super.method()`로 못 부른다.\n- <strong>출처:<\/strong> [MDN — this](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/this) · [MDN — Function.prototype.bind()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/bind)\n\n### call·apply·bind (Explicit this Binding)\n\n- <strong>뭐야:<\/strong> 함수를 부를 때 `this`를 직접 지정하는 세 메서드다. `call`·`apply`는 지정한 `this`로 바로 호출하고(인자를 하나씩 / 배열로), `bind`는 `this`가 고정된 새 함수를 돌려준다.\n- <strong>왜:<\/strong> 메서드를 콜백으로 넘기면 원래 객체와의 연결이 끊겨 `this`가 `undefined`(strict mode)나 전역 객체로 바뀌는데, 이를 고정하거나 유사 배열에 배열 메서드를 빌려 쓸 때 필요하다. \"call과 apply 차이\"는 단골 질문이다.\n- <strong>어떻게:<\/strong>\n  - <strong>`call(thisArg, a, b)`<\/strong> — 즉시 호출, 인자를 <strong>하나씩<\/strong>\n  - <strong>`apply(thisArg, [a, b])`<\/strong> — 즉시 호출, 인자를 <strong>배열로<\/strong>. 요즘은 `fn(...arr)` 스프레드가 대부분 대체한다\n  - <strong>`bind(thisArg, a)`<\/strong> — 호출하지 않고 <strong>`this`가 고정된 새 함수<\/strong>를 반환. 앞 인자도 미리 고정할 수 있다(부분 적용)\n  - 비엄격 모드에서 `thisArg`가 `null`·`undefined`면 `globalThis`로, 원시값은 객체로 감싸진다. 엄격 모드는 그대로 둔다\n  - 한 번 `bind`한 함수는 다시 `bind`해도 `this`가 안 바뀐다. 단 `new`로 부르면 묶인 `this`는 무시된다. 화살표 함수는 셋 다로도 `this`를 못 바꾼다\n- <strong>핵심:<\/strong> <strong>call = 쉼표, apply = 배열, bind = 나중에 부를 새 함수<\/strong>. bind는 <strong>재바인딩 불가<\/strong>, `new`가 bind보다 우선.\n- <strong>꼬리질문:<\/strong>\n  - \"`bind`를 render 안에서 하면?\" → 매 렌더 새 함수라 자식 `memo`가 깨진다. 클래스 필드 화살표나 생성자에서 한 번만 bind한다.\n  - \"`Math.max.apply(null, bigArray)`나 `Math.max(...bigArray)`의 위험은?\" → 수만 개를 넘으면 엔진의 인자 개수 한계에 걸린다. 대부분 예외지만 조용히 잘릴 수도 있다(명세상 미정). 큰 배열은 `reduce`나 청크로.\n- <strong>출처:<\/strong> [MDN — Function.prototype.call()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/call) · [MDN — Function.prototype.apply()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/apply) · [MDN — Function.prototype.bind()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/bind)\n\n### 프로토타입 체인과 class (Prototype Chain)\n\n- <strong>뭐야:<\/strong> 모든 객체는 다른 객체(또는 `null`)를 가리키는 숨은 링크(`[[Prototype]]`)를 갖고, 속성을 못 찾으면 이 링크를 따라 올라가며 찾는다. 이 링크의 사슬이 <strong>프로토타입 체인<\/strong>이고, `class`는 이 구조 위의 문법이다.\n- <strong>왜:<\/strong> 체인을 모르면 `Object.create(null)` 객체에서 `obj.hasOwnProperty`가 없다는 에러가 나는 이유, `for...in`이 상속된 속성까지 도는 이유를 설명 못 한다. `class`를 써도 내부에서 무슨 일이 일어나는지 말하지 못한다.\n- <strong>어떻게:<\/strong>\n  - 모든 객체는 숨은 링크 `[[Prototype]]`을 가진다(`Object.getPrototypeOf`로 접근). 속성을 못 찾으면 이 링크를 따라 올라가고, `null`에서 끝나면 `undefined`\n  - 함수의 `.prototype` 속성 = `new`로 만든 인스턴스의 `[[Prototype]]`이 될 객체\n  - `class`는 이 구조의 문법. 메서드는 `Class.prototype`에, `extends`는 `Child.prototype.[[Prototype]] = Parent.prototype`\n  - 차이도 있다: class는 `new` 없이 호출하면 에러, 본문은 strict, 선언은 TDZ\n  - 쓰기는 체인을 타지 않는다. `child.x = 1`은 프로토타입이 아니라 <strong>자기 자신<\/strong>에 속성을 만든다(가려짐). 주의: 체인에 setter가 있으면 그 setter가 불린다\n- <strong>핵심:<\/strong> 읽기는 <strong>체인을 타고 올라가고<\/strong>, 쓰기는 <strong>자기 자신에<\/strong> 한다. `class`는 <strong>프로토타입 위의 문법 설탕<\/strong>에 가깝다.\n- <strong>꼬리질문:<\/strong>\n  - \"`instanceof`는 어떻게 판정하나?\" → 오른쪽 생성자의 `.prototype`이 왼쪽 객체의 체인 어딘가에 있는지 본다. iframe·다른 realm에서 온 배열은 `instanceof Array`가 거짓이라 `Array.isArray`를 쓴다.\n  - \"`Object.prototype`에 메서드를 추가하면?\" → 모든 객체에 퍼진다(프로토타입 오염). 외부 입력으로 `__proto__` 키를 병합하는 코드가 보안 취약점이 되는 이유.\n- <strong>출처:<\/strong> [MDN — Inheritance and the prototype chain](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Inheritance_and_the_prototype_chain)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 340\" role=\"img\" aria-label=\"인스턴스 rex에서 Dog.prototype, Animal.prototype, Object.prototype을 거쳐 null로 끝나는 프로토타입 체인과, 생성자 함수의 prototype 속성 연결\">\n  <defs>\n    <marker id=\"p1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--fig-line)\"/><\/marker>\n  <\/defs>\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"340\" fill=\"var(--fig-bg)\"/>\n  <rect x=\"20\" y=\"150\" width=\"130\" height=\"70\" rx=\"8\" fill=\"var(--fig-muted)\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"85\" y=\"175\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">rex<\/text>\n  <text x=\"85\" y=\"198\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">name: \"Rex\"<\/text>\n  <rect x=\"190\" y=\"150\" width=\"140\" height=\"70\" rx=\"8\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <text x=\"260\" y=\"175\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Dog.prototype<\/text>\n  <text x=\"260\" y=\"198\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">bark()<\/text>\n  <rect x=\"370\" y=\"150\" width=\"150\" height=\"70\" rx=\"8\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <text x=\"445\" y=\"175\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Animal.prototype<\/text>\n  <text x=\"445\" y=\"198\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">eat()<\/text>\n  <rect x=\"560\" y=\"150\" width=\"140\" height=\"70\" rx=\"8\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <text x=\"630\" y=\"175\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Object.prototype<\/text>\n  <text x=\"630\" y=\"198\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">toString()<\/text>\n  <line x1=\"150\" y1=\"185\" x2=\"188\" y2=\"185\" stroke=\"var(--fig-accent)\" stroke-width=\"2\" marker-end=\"url(#p1)\"/>\n  <line x1=\"330\" y1=\"185\" x2=\"368\" y2=\"185\" stroke=\"var(--fig-accent)\" stroke-width=\"2\" marker-end=\"url(#p1)\"/>\n  <line x1=\"520\" y1=\"185\" x2=\"558\" y2=\"185\" stroke=\"var(--fig-accent)\" stroke-width=\"2\" marker-end=\"url(#p1)\"/>\n  <line x1=\"630\" y1=\"220\" x2=\"630\" y2=\"268\" stroke=\"var(--fig-accent)\" stroke-width=\"2\" marker-end=\"url(#p1)\"/>\n  <text x=\"630\" y=\"290\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">null<\/text>\n  <text x=\"360\" y=\"140\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">[[Prototype]] 링크 — 읽을 때 못 찾으면 오른쪽으로<\/text>\n  <rect x=\"190\" y=\"30\" width=\"140\" height=\"50\" rx=\"8\" fill=\"var(--fig-accent2)\" stroke=\"var(--fig-line)\"/>\n  <text x=\"260\" y=\"60\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">class Dog<\/text>\n  <rect x=\"370\" y=\"30\" width=\"150\" height=\"50\" rx=\"8\" fill=\"var(--fig-accent2)\" stroke=\"var(--fig-line)\"/>\n  <text x=\"445\" y=\"60\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">class Animal<\/text>\n  <line x1=\"260\" y1=\"80\" x2=\"260\" y2=\"148\" stroke=\"var(--fig-line)\" stroke-dasharray=\"5 4\" marker-end=\"url(#p1)\"/>\n  <text x=\"268\" y=\"112\" font-size=\"13\" fill=\"currentColor\">.prototype<\/text>\n  <line x1=\"445\" y1=\"80\" x2=\"445\" y2=\"148\" stroke=\"var(--fig-line)\" stroke-dasharray=\"5 4\" marker-end=\"url(#p1)\"/>\n  <text x=\"453\" y=\"112\" font-size=\"13\" fill=\"currentColor\">.prototype<\/text>\n  <line x1=\"330\" y1=\"55\" x2=\"368\" y2=\"55\" stroke=\"var(--fig-line)\" marker-end=\"url(#p1)\"/>\n  <text x=\"349\" y=\"24\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">extends<\/text>\n  <text x=\"85\" y=\"260\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">rex.eat()<\/text>\n  <text x=\"85\" y=\"280\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">→ 자기 없음 → Dog 없음<\/text>\n  <text x=\"85\" y=\"300\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">→ Animal에서 찾음<\/text>\n<\/svg>\n<figcaption>class 문법 아래에는 [[Prototype]] 링크 체인이 있고, 속성 읽기는 이 체인을 따라 올라간다<\/figcaption>\n<\/figure>\n\n### 값과 참조, 불변성 (Value vs Reference, Immutability)\n\n- <strong>뭐야:<\/strong> 원시값(숫자·문자열 등)은 대입할 때 값 자체가 복사되고, 객체·배열은 같은 객체를 가리키는 참조(주소)가 복사된다. 불변성은 원본을 고치지 않고 바뀐 부분만 새로 만들어 쓰는 방식이다.\n- <strong>왜:<\/strong> 참조를 공유한 줄 모르고 원본을 고치면 변경이 엉뚱한 곳에 퍼지거나 감지되지 않는다. 상태 배열에 `push`했는데 화면이 안 바뀌거나, 폼 초기값 객체를 고쳤더니 원본 서버 데이터까지 바뀌어 \"취소\"가 안 먹는다.\n- <strong>어떻게:<\/strong>\n  - 원시값(`string`·`number`·`boolean`·`null`·`undefined`·`symbol`·`bigint`)은 <strong>값 자체<\/strong>가 복사된다\n  - 객체·배열·함수는 <strong>참조(주소)<\/strong> 가 복사된다. 두 변수가 같은 객체를 가리키면 한쪽 수정이 다른 쪽에 보인다\n  - React는 새 상태가 이전과 <strong>`Object.is`로 같으면<\/strong> 리렌더를 건너뛴다 → 원본을 고치면 참조가 같아 \"변경 없음\"으로 판단\n  - 불변 갱신: 바꿀 경로만 새로 만들고 나머지는 참조를 재사용(구조 공유). `[...arr, x]`, `{ ...obj, k: v }`, `toSorted`·`toSpliced`·`with`(주의: ES2023)\n  - `Object.freeze`는 <strong>얕게만<\/strong> 얼린다\n- <strong>핵심:<\/strong> 객체 대입은 <strong>참조 복사<\/strong>. React 상태는 <strong>새 참조를 만들어야<\/strong> 바뀐다. 원본 변경은 캐시·props·상태를 <strong>동시에<\/strong> 오염시킨다.\n- <strong>꼬리질문:<\/strong>\n  - \"`sort()`가 왜 위험한가?\" → 원본 배열을 제자리에서 바꾼다. 쿼리 캐시에서 받은 배열을 그대로 `sort`하면 캐시 자체가 바뀐다. 복사 후 정렬하거나 `toSorted`.\n  - \"불변성의 대가는?\" → 매번 새 객체 할당과 GC 부담. 깊은 중첩을 손으로 펼치면 코드가 길어져 Immer 같은 도구를 쓴다.\n- <strong>출처:<\/strong> [react.dev — Updating Arrays in State](https://react.dev/learn/updating-arrays-in-state) · [MDN — Object.freeze(): Deep freezing](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/freeze#deep_freezing) · [TC39 — Finished Proposals](https://github.com/tc39/proposals/blob/main/finished-proposals.md)\n\n### 얕은 복사·깊은 복사와 structuredClone (Shallow vs Deep Copy)\n\n- <strong>뭐야:<\/strong> 얕은 복사는 객체의 1단계만 새로 만들고 중첩된 객체는 원본과 참조를 공유하는 복사, 깊은 복사는 중첩까지 전부 새로 만드는 복사다. `structuredClone`은 깊은 복사를 해 주는 내장 함수다.\n- <strong>왜:<\/strong> 복사 방식마다 남는 것과 사라지는 것이 다르다. 스프레드로 복사했는데 중첩 객체 수정이 원본에 번지거나, `JSON.parse(JSON.stringify())`로 복사했더니 `Date`가 문자열이 되고 `undefined` 필드가 사라진다.\n- <strong>어떻게:<\/strong>\n  - <strong>얕은 복사<\/strong> — `{...obj}`, `Object.assign`, `arr.slice()`. 1단계만 새로, 중첩은 참조 공유\n  - <strong>`JSON` 왕복<\/strong> — `Date`→문자열, 객체 속성의 `undefined`·함수·`Symbol` 값은 빠지고(배열 안에선 `null`), Symbol 키 무시, `Map`·`Set`→`{}`, `NaN`·`Infinity`→`null`, 순환 참조면 `TypeError`\n  - <strong>`structuredClone`<\/strong> — `Date`·`Map`·`Set`·`RegExp`·`ArrayBuffer`·`Error`·<strong>순환 참조<\/strong>까지 보존. 함수·DOM 노드·Symbol은 `DataCloneError`. <strong>프로토타입 체인을 따라가지 않아<\/strong> 클래스 인스턴스는 일반 객체가 되고, getter·속성 descriptor·private 필드도 복제되지 않는다\n  - Web Worker `postMessage`도 같은 구조화 복제 알고리즘을 쓴다 (1파트 참고)\n- <strong>핵심:<\/strong> 스프레드는 <strong>1단계만<\/strong>. 깊은 복사는 <strong>`structuredClone`<\/strong>, 단 <strong>함수 불가·프로토타입 소실<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"깊은 복사를 자주 하면?\" → 큰 트리를 통째로 복사하면 비용이 크고, 모든 참조가 바뀌어 React 메모이제이션이 전부 깨진다. 필요한 경로만 새로 만드는 구조 공유가 낫다.\n  - \"부분 수정 요청(PATCH)을 만들 때 복사 말고 주의할 점은?\" → \"안 바꿈\"과 \"비움\"을 구분해야 한다. 키가 없으면 미변경, `null`이면 비움처럼 계약을 정하고 빌더 함수로 고정한다.\n- <strong>출처:<\/strong> [MDN — The structured clone algorithm](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Structured_clone_algorithm) · [MDN — JSON.stringify()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/stringify)\n\n### 동등성 비교 (==, ===, Object.is)\n\n- <strong>뭐야:<\/strong> 두 값이 같은지 판정하는 세 가지 방법이다. `==`는 타입을 변환한 뒤 비교하고, `===`는 변환 없이 비교하며, `Object.is`는 `===`에서 `NaN`과 `+0`·`-0` 두 예외만 고친 비교다.\n- <strong>왜:<\/strong> 방법마다 결과가 달라 조건문이 엇나간다. `0 == \"\"`가 참이라 빈 값 검사가 엉키거나, `NaN === NaN`이 거짓이라 \"값이 같으면 갱신 생략\" 로직이 매번 갱신한다.\n- <strong>어떻게:<\/strong>\n  - <strong>`==`<\/strong> — 타입이 다르면 변환 후 비교. `null == undefined`는 참, `null`·`undefined`는 서로와 자기 자신 외의 어떤 값과도 `==` 거짓\n  - <strong>`===`<\/strong> — 타입 변환 없음. 예외 두 개: `NaN === NaN`은 거짓, `+0 === -0`은 참\n  - <strong>`Object.is`<\/strong> — `===`에서 그 두 예외만 고친 것. `Object.is(NaN, NaN)` 참, `Object.is(0, -0)` 거짓\n  - 객체는 셋 다 <strong>참조 동일성<\/strong>만 본다. 내용 비교는 직접 구현하거나 라이브러리\n  - React `useState`·의존성 배열·`memo` 비교가 `Object.is` 기반이다. 참고로 `includes`·`Map`·`Set`은 `NaN`을 같게, `+0`·`-0`도 같게 보는 SameValueZero\n- <strong>핵심:<\/strong> 기본은 <strong>`===`<\/strong>. 유일한 실용적 `==`는 <strong>`x == null`<\/strong>(null·undefined 동시 검사). React는 <strong>`Object.is`로 참조를 비교<\/strong>한다.\n- <strong>꼬리질문:<\/strong>\n  - \"`??`와 `||`의 차이는?\" → `||`는 `0`·`\"\"`·`false`도 버리고, `??`는 `null`·`undefined`만 버린다. 숫자 0이 유효한 값이면 `??`.\n  - \"의존성 배열에 객체 리터럴을 넣으면?\" → 렌더마다 새 참조라 `Object.is`가 매번 거짓 → effect가 매 렌더 실행된다. 원시값으로 풀거나 `useMemo`로 참조를 고정.\n- <strong>출처:<\/strong> [MDN — Equality comparisons and sameness](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Equality_comparisons_and_sameness) · [react.dev — useState: set 함수 주의점](https://react.dev/reference/react/useState#setstate-caveats)\n\n> 한 줄 정리: `this`는 호출 방식(call·apply·bind로 지정), 속성 읽기는 프로토타입 체인, 대입은 참조 복사, 비교는 참조 동일성 — React는 그 마지막 규칙 위에 서 있다.\n\n## 3. 비동기\n\n### Promise와 async/await (Promise, async/await)\n\n- <strong>뭐야:<\/strong> Promise는 아직 끝나지 않은 비동기 작업의 결과를 나중에 받기로 한 약속 객체로, 대기 상태에서 성공 또는 실패로 한 번만 확정된다. `async`/`await`는 이 Promise를 동기 코드처럼 위에서 아래로 읽히게 쓰는 문법이다.\n- <strong>왜:<\/strong> 기다리는 위치를 잘못 잡으면 느려지거나 아예 안 기다린다. 순서 상관없는 요청 세 개를 `await`로 줄줄이 써서 세 요청 시간의 합만큼 걸리거나, `forEach` 안의 `await`가 기다려 주지 않아 저장이 끝나기 전에 화면이 넘어간다.\n- <strong>어떻게:<\/strong>\n  - Promise는 pending → fulfilled/rejected로 <strong>한 번만<\/strong> 확정된다. `then` 콜백은 확정 후 <strong>마이크로태스크<\/strong>로 실행\n  - `async` 함수는 항상 Promise를 반환. `await`는 그 지점에서 함수를 멈추고 나머지를 마이크로태스크로 재개\n  - 독립 요청은 <strong>`Promise.all`<\/strong> 로 병렬. 하나라도 실패하면 즉시 reject(나머지 요청은 취소되지 않고 계속 돈다)\n  - <strong>`allSettled`<\/strong>(전부 끝날 때까지, 성공·실패 목록) · <strong>`race`<\/strong>(먼저 확정된 것) · <strong>`any`<\/strong>(먼저 성공한 것)\n  - `forEach`는 콜백의 반환 Promise를 무시한다 → 순차는 `for...of` + `await`, 병렬은 `Promise.all(arr.map(...))`\n- <strong>핵심:<\/strong> <strong>독립이면 `Promise.all`<\/strong>, 부분 실패를 다뤄야 하면 <strong>`allSettled`<\/strong>. <strong>`forEach` + `await`는 기다리지 않는다.<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"같은 요청이 동시에 여러 번 나가면?\" → 진행 중인 Promise 하나를 공유(single-flight)해 나중 호출자가 그 결과를 기다리게 한다. 토큰 갱신처럼 한 번만 돌아야 하는 작업의 기본 패턴.\n  - \"응답이 영원히 안 오면?\" → Promise에는 기본 타임아웃이 없다. `Promise.race`로 타이머와 경쟁시키거나 `AbortSignal.timeout`을 건다. 타임아웃 시 무엇으로 폴백할지까지 정해야 한다.\n- <strong>출처:<\/strong> [MDN — Promise.all()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/all) · [MDN — async function](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function)\n\n### 비동기 에러 처리 (Error Handling)\n\n- <strong>뭐야:<\/strong> Promise가 실패(reject)했을 때 그 에러를 잡아 처리하는 방법이다. `await` + `try/catch`, `.catch`, 전역 `unhandledrejection` 이벤트가 있다.\n- <strong>왜:<\/strong> 잡는 위치와 던지는 값을 잘못 쓰면 에러가 새거나 뭉개진다. `try/catch`로 감쌌는데 에러가 안 잡히거나, 토스트에 `[object Object]`가 찍히거나, 콘솔에 `Uncaught (in promise)`만 남고 원인을 모른다.\n- <strong>어떻게:<\/strong>\n  - `try/catch`는 <strong>`await`한 Promise<\/strong>의 reject만 잡는다. `await` 없이 호출만 하면 못 잡는다\n  - `.then(ok, fail)`의 `fail`은 <strong>같은 `then`의 `ok`에서 난 에러<\/strong>를 못 잡는다 → 끝에 `.catch`\n  - 처리 안 된 reject는 `unhandledrejection` 이벤트로 전역 수집할 수 있다\n  - `throw`는 아무 값이나 던질 수 있다. 문자열·객체를 던지면 <strong>스택이 없고<\/strong>, 문자열 연결 시 `[object Object]`가 된다 → `instanceof Error`로 정규화하고 `cause`로 원인을 잇는다(`new Error(msg, { cause })`)\n  - `finally`는 성공·실패 모두 실행. 로딩 해제·잠금 해제에 쓴다\n- <strong>핵심:<\/strong> <strong>`await`해야 잡힌다.<\/strong> 던질 때는 <strong>`Error` 객체<\/strong>로. 에러는 \"<strong>재시도로 풀리나<\/strong>\"로 분류해야 처리가 정해진다.\n- <strong>꼬리질문:<\/strong>\n  - \"모든 에러를 재시도하면?\" → 권한 거절·검증 실패처럼 다시 해도 같은 에러는 무한 루프가 된다. 일시적(네트워크·5xx)과 영구적(4xx 대부분)을 나눠 영구적인 것은 즉시 사용자에게 보낸다.\n  - \"재시도할 때 서버에서 두 번 처리되면?\" → 멱등 키를 붙인다. 키는 <strong>재시도마다 바뀌면 안 되고<\/strong>, 같은 의도의 요청이면 같은 값이어야 한다.\n- <strong>출처:<\/strong> [MDN — unhandledrejection](https://developer.mozilla.org/en-US/docs/Web/API/Window/unhandledrejection_event) · [MDN — Error: cause](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Error/cause)\n\n### 마이크로태스크 순서 퀴즈 (Microtask Ordering)\n\n- <strong>뭐야:<\/strong> 동기 코드, 마이크로태스크(Promise 콜백·`await` 이후 재개), 태스크(`setTimeout` 등)가 섞여 있을 때 어떤 순서로 실행되는지 맞히는 문제다. 이벤트 루프 규칙을 실제 코드에 적용해 보는 연습이다.\n- <strong>왜:<\/strong> 단골 질문이고, 실무에서는 \"then 안에서 setTimeout을 걸었더니 예상보다 늦음\", \"`await` 다음 줄이 다른 콜백보다 늦게 실행됨\" 같은 형태로 나온다.\n- <strong>어떻게:<\/strong> 규칙 세 줄 — ① 동기 코드 끝까지 ② 마이크로태스크 큐를 <strong>빌 때까지<\/strong> ③ 태스크 하나, 그리고 다시 ② (1파트 이벤트 루프 참고)\n  ```js\n  console.log(1);\n  setTimeout(() => console.log(2));\n  Promise.resolve().then(() => console.log(3));\n  (async () => {\n    console.log(4);\n    await null;\n    console.log(5);\n  })();\n  queueMicrotask(() => console.log(6));\n  console.log(7);\n  // 1 4 7 3 5 6 2\n  ```\n  - `async` 함수 본문은 <strong>첫 `await` 전까지 동기<\/strong>로 돈다 → 4가 7보다 먼저\n  - `await null`도 마이크로태스크 한 번을 거친다 → 5는 등록 순서대로 3 다음\n  - Promise 생성자 콜백(`new Promise(fn)`의 `fn`)도 <strong>동기<\/strong> 실행\n- <strong>핵심:<\/strong> <strong>동기 → 마이크로태스크(등록 순) → 태스크.<\/strong> `async` 함수는 <strong>첫 `await`까지 동기<\/strong>, Promise 생성자 콜백도 <strong>동기<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"then 안에서 또 then을 등록하면?\" → 지금 비우고 있는 마이크로태스크 큐 뒤에 붙어 <strong>같은 바퀴 안에서<\/strong> 실행된다. 그래서 무한 체인은 렌더를 굶긴다.\n  - \"`await`한 값이 이미 resolve된 Promise면 바로 재개되나?\" → 아니다. 그래도 마이크로태스크를 거쳐 재개된다. 동기처럼 보여도 한 박자 늦다.\n- <strong>출처:<\/strong> [MDN — async function](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function) · [MDN — Using microtasks](https://developer.mozilla.org/en-US/docs/Web/API/HTML_DOM_API/Microtask_guide)\n\n### AbortController로 요청 취소 (AbortController)\n\n- <strong>뭐야:<\/strong> 진행 중인 `fetch` 같은 비동기 작업에 그만두라는 신호를 보내는 객체다. `signal`을 작업에 넘겨 두고 `abort()`를 부르면, 신호를 지원하는 작업(`fetch` 등)은 아직 끝나지 않았을 때 에러로 끝난다.\n- <strong>왜:<\/strong> 취소하지 않으면 경쟁 상태가 생긴다. 검색어를 빠르게 바꾸면 늦게 출발한 요청이 먼저 오고 이전 요청 결과가 나중에 덮어쓰거나, 화면을 떠났는데 요청이 끝나 상태를 건드린다.\n- <strong>어떻게:<\/strong>\n  - `const ac = new AbortController()` → `fetch(url, { signal: ac.signal })` → `ac.abort()`하면 fetch가 `name === \"AbortError\"`인 `DOMException`으로 reject. `abort(reason)`으로 이유를 넘기면 그 값으로 reject\n  - 취소는 <strong>클라이언트가 결과를 버리는 것<\/strong>이지, 이미 서버에 도착한 요청의 처리를 되돌리지는 않는다\n  - `addEventListener(type, fn, { signal })`로 리스너 여러 개를 한 번에 해제할 수 있다\n  - `AbortSignal.timeout(ms)`로 타임아웃 신호 — 이때 에러 이름은 <strong>`TimeoutError`<\/strong>다. `AbortSignal.any([...])`로 신호 합성(주의: 주요 브라우저 모두 지원은 2024년 3월부터)\n  - TanStack Query는 `queryFn`에 `signal`을 넘겨준다. 그걸 fetch에 전달해야 실제로 취소된다 (5파트 참고)\n- <strong>핵심:<\/strong> 경쟁 상태는 디바운스가 아니라 <strong>취소 또는 최신 요청 판별<\/strong>로 막는다. <strong>AbortError는 실패가 아니라 정상 흐름<\/strong>으로 걸러야 한다.\n- <strong>꼬리질문:<\/strong>\n  - \"취소하면 서버 쪽 결제·저장도 취소되나?\" → 아니다. 이미 도착한 요청은 처리된다. 변경 요청은 취소가 아니라 멱등 키와 서버 상태 재조회로 다룬다.\n  - \"AbortError에도 에러 토스트가 뜬다면?\" → 전역 에러 처리에서 `name === \"AbortError\"`를 걸러야 한다. 사용자가 일으킨 정상 취소다. 반대로 `TimeoutError`는 실패로 보여 줘야 하니 둘을 구분한다.\n- <strong>출처:<\/strong> [MDN — AbortController.abort()](https://developer.mozilla.org/en-US/docs/Web/API/AbortController/abort) · [MDN — AbortSignal.timeout()](https://developer.mozilla.org/en-US/docs/Web/API/AbortSignal/timeout_static) · [MDN — AbortSignal.any()](https://developer.mozilla.org/en-US/docs/Web/API/AbortSignal/any_static)\n\n> 한 줄 정리: 비동기는 \"언제 실행되나(마이크로태스크)\", \"어떻게 실패하나(await해야 잡힘)\", \"어떻게 그만두나(AbortController)\" 세 축으로 정리된다.\n\n## 4. 메모리와 모듈\n\n### 가비지 컬렉션과 메모리 누수 (GC, Memory Leaks)\n\n- <strong>뭐야:<\/strong> 가비지 컬렉션(GC)은 더 이상 닿을 수 없는 객체를 엔진이 자동으로 찾아 메모리를 회수하는 것이다. 메모리 누수는 안 쓰는데 아직 누군가 참조하고 있어 회수되지 못하는 객체가 쌓이는 상태다.\n- <strong>왜:<\/strong> 누수는 잠깐 쓰는 화면에선 안 보이다가 오래 켜 두면 드러난다. 키오스크·대시보드처럼 하루 종일 켜 두는 화면에서 몇 시간 뒤 느려지거나 탭이 죽고, 화면을 오갈수록 같은 요청이 배로 나간다.\n- <strong>어떻게:<\/strong>\n  - GC는 <strong>도달 가능성(reachability)<\/strong> 으로 판정한다. 루트(전역 객체 등)에서 참조를 따라 닿지 않는 객체를 회수(mark-and-sweep과 그 변형. 순환 참조도 회수된다)\n  - 누수는 \"안 쓰는데 <strong>아직 누가 참조<\/strong>하는\" 객체. 대표 패턴:\n    - <strong>리스너<\/strong> — `window`·`document`·소켓에 등록하고 해제 안 함\n    - <strong>타이머<\/strong> — `setInterval`·폴링을 언마운트·실패 후에도 계속 돌림\n    - <strong>클로저<\/strong> — 큰 데이터를 잡은 콜백을 전역 캐시·리스너에 보관\n    - <strong>분리된 DOM<\/strong> — 화면에서 지웠지만 JS 변수가 여전히 노드를 참조\n    - 무한히 커지는 `Map` 캐시\n  - 진단: DevTools Memory 탭 힙 스냅샷 두 장 비교, \"Detached\" 검색, Performance monitor의 JS heap·리스너 수 추이\n  - `WeakMap`·`WeakSet` — 키를 약하게 참조해 키가 사라지면 항목도 회수된다(아래 Map·WeakMap 참고)\n- <strong>핵심:<\/strong> 누수 = <strong>도달 가능하지만 안 쓰는 것<\/strong>. 등록한 것(<strong>리스너·타이머·구독<\/strong>)은 같은 생명주기에서 <strong>해제<\/strong>한다. React에서는 effect <strong>cleanup<\/strong>이 그 자리.\n- <strong>꼬리질문:<\/strong>\n  - \"실패한 요청 뒤의 폴링은?\" → 실패를 \"다음 주기에 다시\"로만 처리하면 인증이 끊긴 뒤에도 영원히 돈다. 복구 불가능한 실패에서는 폴링을 멈춰야 한다.\n  - \"WeakMap을 캐시로 쓰면 항상 좋은가?\" → 키가 객체(또는 등록 안 된 Symbol)여야 하고 순회·크기 확인이 안 된다. 문자열 키 캐시라면 크기 상한(LRU)을 둬야 한다.\n- <strong>출처:<\/strong> [MDN — Memory management](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Memory_management)\n\n### Map·Set과 WeakMap·WeakRef (Keyed Collections, Weak References)\n\n- <strong>뭐야:<\/strong> Map·Set은 키-값 쌍과 값 모음을 담는 전용 컬렉션으로, 객체를 포함해 아무 값이나 키로 쓸 수 있다. WeakMap은 키를, WeakRef는 대상을 약하게 참조해, 다른 곳에서 안 쓰이면 GC가 회수할 수 있게 둔다.\n- <strong>왜:<\/strong> 일반 객체를 사전처럼 쓰면 `\"__proto__\"` 같은 키가 충돌한다. 일반 Map으로 DOM 노드에 메타데이터를 붙여 두면 노드가 사라져도 캐시가 안 빈다.\n- <strong>어떻게:<\/strong>\n  - <strong>Map vs 객체<\/strong> — Map은 <strong>아무 값이나 키<\/strong>(객체·함수 포함), <strong>삽입 순서<\/strong> 보장, `size` 바로, 잦은 추가·삭제에 유리, 프로토타입 키 충돌 없음. 대신 `JSON.stringify` 기본 지원이 없다\n  - <strong>WeakMap·WeakSet<\/strong> — 키를 <strong>약하게<\/strong> 잡는다. 키 객체가 다른 곳에서 안 쓰이면 항목째 회수된다. 키는 <strong>객체 또는 등록 안 된 Symbol<\/strong>만, <strong>순회·`size` 불가<\/strong>(GC 시점을 관찰 못 하게)\n  - 쓰임: DOM 요소별 상태, 객체별 계산 캐시, 클래스 밖 비공개 데이터\n  - <strong>`WeakRef`<\/strong>(주의: ES2021) — 대상의 수명을 늘리지 않는 참조. `deref()`가 `undefined`일 수 있다. `FinalizationRegistry` 콜백은 <strong>언제 불릴지·불릴지조차 보장이 없다<\/strong>\n- <strong>핵심:<\/strong> 키가 <strong>객체이고 그 객체의 수명에 맞춰 사라져야 하면 WeakMap<\/strong>, 순회·크기가 필요하면 Map. WeakRef·Finalization은 <strong>GC 타이밍에 기대는 로직 금지<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"WeakMap에 넣었는데 메모리가 안 줄어든다?\" → 다른 곳(리스너·클로저·일반 Map)이 키를 아직 잡고 있으면 도달 가능해 회수되지 않는다. 회수 시점도 엔진이 정한다.\n  - \"그냥 `Object.create(null)`이면 되지 않나?\" → 키 충돌은 막지만 키가 문자열·Symbol로 제한되고 크기·순서 API가 없다. 동적 키 사전은 Map이 의도가 분명하다.\n- <strong>출처:<\/strong> [MDN — Map](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map) · [MDN — WeakMap](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/WeakMap) · [MDN — WeakRef](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/WeakRef)\n\n### 모듈: ESM vs CommonJS (ES Modules, CJS)\n\n- <strong>뭐야:<\/strong> JS 파일끼리 코드를 주고받는 두 가지 모듈 방식이다. ESM은 `import`/`export`로 실행 전에 의존 관계가 확정되고, CommonJS는 `require`/`module.exports`로 실행 중에 불러온다.\n- <strong>왜:<\/strong> 둘의 차이를 모르면 번들과 런타임에서 문제가 난다. 라이브러리 하나만 import했는데 번들이 통째로 들어오거나, 구버전 Node에서 CJS 코드가 ESM 패키지를 `require`해 SSR에서 `ERR_REQUIRE_ESM`이 난다.\n- <strong>어떻게:<\/strong>\n\n  | | ESM | CJS |\n  | --- | --- | --- |\n  | 문법 | `import`/`export` | `require`/`module.exports` |\n  | 해석 시점 | <strong>정적<\/strong>(실행 전 의존 그래프 확정) | <strong>동적<\/strong>(실행 중 `require`) |\n  | 바인딩 | <strong>라이브 바인딩<\/strong>(원본 변경이 보임) | 값 <strong>복사<\/strong>(객체면 참조) |\n  | 로딩 | 비동기 가능, top-level `await` | 동기 |\n  | `this`(최상위) | `undefined` | `module.exports` |\n\n  - 동적 로딩이 필요하면 ESM에서도 `import()` — Promise를 반환하고 코드 스플리팅의 경계가 된다\n  - 주의: Node.js에서 ESM이 CJS를 import하는 건 되지만, CJS에서 ESM을 `require`하는 건 <strong>Node 22.12·20.19부터 플래그 없이<\/strong> 된다(25.4에서 실험 딱지 제거). 단 top-level `await`가 있는 모듈은 `ERR_REQUIRE_ASYNC_MODULE` → `import()`를 써야 한다\n- <strong>핵심:<\/strong> ESM은 <strong>정적 구조<\/strong>라 번들러가 실행 없이 무엇이 쓰이는지 안다. 이게 <strong>tree shaking의 전제<\/strong>다.\n- <strong>꼬리질문:<\/strong>\n  - \"순환 의존이 생기면?\" → ESM은 라이브 바인딩이라 나중에 값이 채워지면 보이지만, 아직 평가 전인 `let`·`const`·`class` 바인딩을 최상위에서 즉시 읽으면 TDZ 에러가 난다. 레이어 규칙(상위→하위만 import)이 레이어 사이 순환을 구조적으로 막는다.\n  - \"import 경로를 상대경로로 아무 데나 쓰면?\" → 동작은 하지만 경계 검사 도구가 못 잡는다. 슬라이스 밖은 절대경로로 써야 의존 방향이 보인다.\n- <strong>출처:<\/strong> [MDN — JavaScript modules](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules) · [Node.js — require()로 ESM 불러오기](https://nodejs.org/api/modules.html#loading-ecmascript-modules-using-require)\n\n### tree shaking의 전제 (Tree Shaking, sideEffects)\n\n- <strong>뭐야:<\/strong> 번들러가 import/export 관계를 따라가 쓰이지 않는 export를 최종 번들에서 빼는 최적화다. 나무를 흔들어 마른 잎을 털어 내듯 안 쓰는 코드를 떨군다.\n- <strong>왜:<\/strong> 전제 조건(ESM, 부수효과 없음)이 깨지면 털리지 않는다. 그러면 아이콘 하나, 유틸 함수 하나 쓰는데 번들 분석기에 라이브러리 전체가 잡힌다.\n- <strong>어떻게:<\/strong>\n  - 번들러가 ESM의 정적 import/export를 따라가 <strong>쓰이지 않는 export를 제거<\/strong>한다\n  - 막히는 경우: CJS 패키지, `import * as` 후 동적 키 접근, 모듈 최상위에 <strong>부수효과<\/strong>(전역 등록, polyfill, CSS import)가 있는 경우\n  - `package.json`의 `\"sideEffects\": false`(또는 부수효과 있는 파일 목록)는 \"안 쓰면 통째로 빼도 된다\"는 <strong>약속<\/strong>. 틀리면 필요한 CSS·등록 코드가 빠진다 → CSS는 `[\"**/*.css\"]`처럼 명시\n  - 배럴 파일(`index.ts`에서 전부 re-export)은 번들러·설정에 따라 쓰지 않는 모듈까지 평가하게 만들 수 있다\n- <strong>핵심:<\/strong> 조건은 <strong>ESM + 부수효과 없음(또는 `sideEffects` 선언)<\/strong>. 확인은 추측 말고 <strong>번들 분석기<\/strong>로.\n- <strong>꼬리질문:<\/strong>\n  - \"배럴 파일을 다 없애야 하나?\" → 무조건은 아니다. 공개 API 경계로서의 가치가 있다. 문제가 측정되면 그 패키지만 직접 경로 import로 바꾸거나, 주의: Next.js `experimental.optimizePackageImports`(실험 옵션, `lucide-react`·`date-fns` 등은 기본 적용)를 쓴다.\n- <strong>출처:<\/strong> [webpack — Tree Shaking](https://webpack.js.org/guides/tree-shaking/) · [Next.js — optimizePackageImports](https://nextjs.org/docs/app/api-reference/config/next-config-js/optimizePackageImports)\n\n### 이터러블과 제너레이터 (Iterable, Generator)\n\n- <strong>뭐야:<\/strong> 이터러블은 `for...of`로 하나씩 꺼낼 수 있도록 약속(`Symbol.iterator`)을 지킨 객체이고, 제너레이터는 `yield`에서 멈췄다가 다음 요청 때 이어서 실행하는 함수다. 값을 한꺼번에가 아니라 필요할 때 하나씩 만든다.\n- <strong>왜:<\/strong> 커서 페이지네이션처럼 \"다음이 있으면 계속 가져오는\" 흐름을 루프로 짜면 상태 변수가 흩어진다. 스트리밍 응답을 조각 단위로 처리해야 할 때도 이 방식이 맞다.\n- <strong>어떻게:<\/strong>\n  - <strong>이터러블 프로토콜<\/strong> — `[Symbol.iterator]()`가 `{ next() → { value, done } }`를 반환하면 `for...of`·스프레드·구조 분해가 된다. 배열·문자열·`Map`·`Set`이 이터러블\n  - <strong>제너레이터<\/strong> `function*` — `yield`에서 멈추고 `next()`에서 재개. <strong>지연 평가<\/strong>라 무한 수열도 표현 가능\n  - <strong>비동기 제너레이터<\/strong> `async function*` + <strong>`for await...of`<\/strong> — 커서 페이지를 끝까지 따라가거나 `ReadableStream`을 조각 단위로 읽는 데 맞다\n  - 스트림을 텍스트로 읽을 때 멀티바이트 문자가 청크 경계에서 잘릴 수 있다 → `TextDecoder`에 `{ stream: true }`로 이어 붙여 디코딩\n- <strong>핵심:<\/strong> 이터러블은 <strong>`Symbol.iterator` 약속<\/strong>, 제너레이터는 <strong>멈췄다 재개하는 함수<\/strong>. 비동기 흐름은 <strong>`for await`<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"커서를 끝까지 다 받아 합산하는 방식의 위험은?\" → 건수가 커지면 요청 수·메모리가 늘어난다. 합계는 서버가 총계를 주는 게 맞고, 클라이언트 전량 조회는 상한과 진행 표시를 둔다.\n- <strong>출처:<\/strong> [MDN — Iteration protocols](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Iteration_protocols) · [MDN — function*](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/function*) · [MDN — TextDecoder.decode()](https://developer.mozilla.org/en-US/docs/Web/API/TextDecoder/decode)\n\n> 한 줄 정리: 메모리는 도달 가능성으로 회수되니 등록한 것은 해제하고(객체 수명을 따라야 하면 WeakMap), 모듈은 정적인 ESM이어야 흔들어 털 수 있으며, 흐름을 끊어 읽을 땐 이터러블·제너레이터를 쓴다.\n\n## 핵심 키워드 모음\n\n- <strong>실행 컨텍스트·스코프 체인<\/strong>: 정의 위치로 정해지는 렉시컬 스코프, 안→밖 탐색\n- <strong>호이스팅·TDZ<\/strong>: var는 undefined로 조용히, let·const·class는 TDZ로 에러\n- <strong>클로저<\/strong>: 값 복사가 아니라 환경 참조, 큰 데이터를 잡으면 누수\n- <strong>커링·부분 적용<\/strong>: f(a)(b)(c) vs 일부 인자 고정, 클로저로 기억, fn.length 기반이라 rest 함수엔 안 통함\n- <strong>stale closure<\/strong>: 렌더마다 스냅샷, 콜백은 자기 렌더 값을 봄. 함수형 업데이트·ref·의존성\n- <strong>this<\/strong>: new > 명시적(bind) > 암시적(점 앞) > 기본. 화살표는 바깥 this\n- <strong>call·apply·bind<\/strong>: 쉼표 / 배열 / 고정된 새 함수. bind 재바인딩 불가, new가 우선\n- <strong>프로토타입 체인<\/strong>: 읽기는 체인을 타고, 쓰기는 자기 자신에. class는 그 위의 문법\n- <strong>값/참조·불변성<\/strong>: 객체 대입은 참조 복사, React는 새 참조로 변경 감지\n- <strong>얕은/깊은 복사<\/strong>: 스프레드는 1단계, structuredClone은 함수 불가·프로토타입 소실\n- <strong>동등성<\/strong>: 기본 ===, `x == null`만 예외, React는 Object.is\n- <strong>Promise·async/await<\/strong>: 독립이면 Promise.all, forEach+await는 안 기다림, single-flight\n- <strong>에러 처리<\/strong>: await해야 잡힘, Error 객체로 던짐, 재시도 가능 여부로 분류, 멱등 키는 고정\n- <strong>마이크로태스크 순서<\/strong>: 동기 → 마이크로태스크 → 태스크, async는 첫 await까지 동기\n- <strong>AbortController<\/strong>: 경쟁 상태 취소, AbortError는 정상 흐름(timeout은 TimeoutError), 서버 처리는 안 되돌림\n- <strong>GC·누수<\/strong>: 도달 가능성 기준, 리스너·타이머·클로저·분리 DOM·무한 캐시\n- <strong>Map·WeakMap·WeakRef<\/strong>: Map은 아무 키·순서·size, WeakMap은 객체 키·순회 불가·키 따라 회수, WeakRef는 GC 타이밍 의존 금지\n- <strong>ESM vs CJS<\/strong>: 정적·라이브 바인딩 vs 동적·값 복사\n- <strong>tree shaking<\/strong>: ESM + 부수효과 없음, sideEffects는 약속, 번들 분석기로 확인\n- <strong>이터러블·제너레이터<\/strong>: Symbol.iterator, yield로 멈춤, for await로 비동기 흐름\n"}, {"id": "n03", "num": "3", "title": "React가 화면을 갱신하는 방식", "md": "# 3. React가 화면을 갱신하는 방식\n\n<strong>이 파트는 뭐냐:<\/strong> \"왜 이게 리렌더되지?\", \"왜 effect가 두 번 돌지?\", \"memo 걸었는데 왜 안 빨라지지?\" 같은 질문의 뿌리. React가 상태 변화 → 렌더 → 커밋으로 화면을 바꾸는 흐름을 잡고, 그 흐름 위에서 훅·메모이제이션·Context·동시성 기능이 각각 어디를 건드리는지 정리한다. 한 줄 요약: <strong>렌더는 계산, 커밋은 반영, 최적화는 \"계산을 건너뛸 근거\"를 만드는 일.<\/strong>\n\n## 1. 렌더링 파이프라인\n\n### 렌더와 커밋 단계 (Render & Commit Phase)\n\n- <strong>뭐야:<\/strong> React가 화면을 바꾸는 두 단계다. <strong>렌더<\/strong>는 컴포넌트 함수를 불러 새 UI 모습을 계산하고 이전과 비교하는 단계, 커밋은 달라진 부분만 실제 DOM에 반영하는 단계다. 설계도를 다시 그리는 일과 실제 공사를 하는 일의 차이와 같다\n- <strong>왜:<\/strong> \"렌더 = 화면에 그려짐\"으로 이해하면 렌더 중 부수효과 버그를 설명 못 한다. 컴포넌트 함수 본문에서 DOM을 읽거나 API를 쏘면 개발 모드의 Strict Mode에서 두 번 실행되고, 동시성 렌더링에서는 버려진 렌더에서도 실행된다\n- <strong>어떻게:<\/strong>\n  - <strong>트리거(Trigger)<\/strong>: 최초 마운트(`createRoot` → `root.render`) 또는 state 갱신\n  - <strong>렌더(Render)<\/strong>: 컴포넌트 함수를 호출해 새 엘리먼트 트리를 만들고 이전 트리와 비교(재조정). 순수 계산이라 <strong>중단·폐기·재실행될 수 있다<\/strong>\n  - <strong>커밋(Commit)<\/strong>: 이전 렌더와 달라진 DOM 노드만 건드린다. 한 번 시작하면 <strong>동기적으로 끝까지<\/strong> 간다. 이후 ref 연결 → `useLayoutEffect` → 브라우저 페인트 → `useEffect` 순(클릭 같은 상호작용이 일으킨 갱신이면 `useEffect`가 페인트 전에 돌 수도 있다)\n- <strong>핵심:<\/strong> 렌더 단계는 <strong>순수(pure)<\/strong>해야 한다. 부수효과(side effect)는 <strong>이벤트 핸들러나 effect<\/strong>로. \"리렌더 = DOM 갱신\"이 아니라 \"리렌더 = 함수 재호출 + 비교\"\n- <strong>꼬리질문:<\/strong>\n  - \"리렌더가 많으면 무조건 느린가요?\" → 아니다. 렌더 비용은 함수 호출과 비교라 대부분 싸다. 느려지는 건 렌더 자체가 무겁거나(큰 리스트·무거운 계산) 커밋에서 레이아웃이 크게 흔들릴 때다\n  - \"렌더 중에 setState를 부르면요?\" → 무한 루프 위험. 이전 값과 비교해 바뀐 경우에만 렌더 중인 컴포넌트 자신의 set을 부르는 패턴만 허용되고, 대부분은 렌더 중 계산(derived state)이 맞다\n- <strong>출처:<\/strong> [Render and Commit](https://react.dev/learn/render-and-commit) · [useState — 이전 렌더 정보 저장](https://react.dev/reference/react/useState#storing-information-from-previous-renders)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"setState가 렌더 단계와 커밋 단계를 거쳐 페인트되고 그 전후로 useLayoutEffect와 useEffect가 실행되는 순서\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <rect x=\"20\" y=\"60\" width=\"120\" height=\"70\" rx=\"10\" fill=\"none\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <text x=\"80\" y=\"92\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">트리거<\/text>\n  <text x=\"80\" y=\"114\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">setState·마운트<\/text>\n  <rect x=\"170\" y=\"40\" width=\"200\" height=\"110\" rx=\"10\" fill=\"var(--fig-accent)\" fill-opacity=\"0.15\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"270\" y=\"70\" text-anchor=\"middle\" font-size=\"16\" fill=\"currentColor\">렌더 단계<\/text>\n  <text x=\"270\" y=\"94\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">컴포넌트 함수 호출<\/text>\n  <text x=\"270\" y=\"114\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">이전 트리와 비교(재조정)<\/text>\n  <text x=\"270\" y=\"136\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-accent)\">중단·폐기·재실행 가능<\/text>\n  <rect x=\"400\" y=\"40\" width=\"160\" height=\"110\" rx=\"10\" fill=\"var(--fig-accent2)\" fill-opacity=\"0.15\" stroke=\"var(--fig-accent2)\" stroke-width=\"2\"/>\n  <text x=\"480\" y=\"70\" text-anchor=\"middle\" font-size=\"16\" fill=\"currentColor\">커밋 단계<\/text>\n  <text x=\"480\" y=\"94\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">DOM 변경 반영<\/text>\n  <text x=\"480\" y=\"114\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">ref 연결<\/text>\n  <text x=\"480\" y=\"136\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-accent2)\">동기·끝까지 실행<\/text>\n  <rect x=\"590\" y=\"60\" width=\"110\" height=\"70\" rx=\"10\" fill=\"none\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <text x=\"645\" y=\"92\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">브라우저<\/text>\n  <text x=\"645\" y=\"114\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">페인트<\/text>\n  <line x1=\"140\" y1=\"95\" x2=\"168\" y2=\"95\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <polygon points=\"168,90 168,100 176,95\" fill=\"var(--fig-line)\"/>\n  <line x1=\"370\" y1=\"95\" x2=\"398\" y2=\"95\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <polygon points=\"398,90 398,100 406,95\" fill=\"var(--fig-line)\"/>\n  <line x1=\"560\" y1=\"95\" x2=\"588\" y2=\"95\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <polygon points=\"588,90 588,100 596,95\" fill=\"var(--fig-line)\"/>\n  <line x1=\"40\" y1=\"230\" x2=\"700\" y2=\"230\" stroke=\"var(--fig-muted)\" stroke-width=\"2\"/>\n  <text x=\"40\" y=\"215\" font-size=\"13\" fill=\"var(--fig-muted)\">시간 →<\/text>\n  <circle cx=\"575\" cy=\"230\" r=\"7\" fill=\"var(--fig-accent2)\"/>\n  <text x=\"575\" y=\"262\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">useLayoutEffect<\/text>\n  <text x=\"575\" y=\"282\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-muted)\">페인트 전·동기<\/text>\n  <circle cx=\"680\" cy=\"230\" r=\"7\" fill=\"var(--fig-accent)\"/>\n  <text x=\"672\" y=\"314\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">useEffect<\/text>\n  <text x=\"652\" y=\"334\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-muted)\">보통 페인트 후<\/text>\n  <line x1=\"680\" y1=\"238\" x2=\"672\" y2=\"298\" stroke=\"var(--fig-line)\" stroke-width=\"1\"/>\n  <line x1=\"575\" y1=\"150\" x2=\"575\" y2=\"222\" stroke=\"var(--fig-line)\" stroke-dasharray=\"4 4\"/>\n  <line x1=\"680\" y1=\"130\" x2=\"680\" y2=\"222\" stroke=\"var(--fig-line)\" stroke-dasharray=\"4 4\"/>\n<\/svg>\n<figcaption>렌더는 계산이라 버려질 수 있고, 커밋은 한 번에 끝난다. layout effect는 페인트 전, effect는 보통 페인트 후.<\/figcaption>\n<\/figure>\n\n### 리렌더가 일어나는 조건 (Re-render Triggers)\n\n- <strong>뭐야:<\/strong> 리렌더는 React가 컴포넌트 함수를 다시 불러 UI를 새로 계산하는 일이다. 계기는 자기 state 변경, 부모 리렌더, 구독 중인 Context 값 변경 세 가지다\n- <strong>왜:<\/strong> 계기를 모르면 입력 한 글자마다 페이지 전체가 다시 렌더되거나, props가 그대로인데 자식이 리렌더된다는 리포트를 받았을 때 원인을 못 찾는다\n- <strong>어떻게:<\/strong>\n  - 기본 계기 세 가지: <strong>자기 state 변경<\/strong>, <strong>부모 리렌더<\/strong>, <strong>구독 중인 Context 값 변경<\/strong>\n  - \"props가 바뀌어서\"는 원인이 아니다. 부모가 리렌더되면 props가 같아도 자식은 기본적으로 다시 호출된다. props를 비교해 건너뛰게 하려면 `memo`가 필요하다(같은 엘리먼트 참조가 그대로 들어오는 children 패턴은 별개)\n  - set 함수에 이전과 `Object.is`로 같은 값을 넣으면 자식까지 건너뛴다. 단 React가 판단을 위해 해당 컴포넌트만 한 번 호출할 수는 있다\n  - 객체를 직접 변경(mutation)하고 같은 참조로 set하면 \"같은 값\"이라 화면이 안 바뀐다\n- <strong>핵심:<\/strong> 리렌더는 <strong>위에서 아래로<\/strong> 전파된다. 상태를 <strong>필요한 곳 가까이 내리거나(state colocation)<\/strong>, 무거운 자식을 <strong>children으로 넘겨<\/strong> 리렌더 경로 밖에 두는 게 memo보다 먼저다\n- <strong>꼬리질문:<\/strong>\n  - \"children으로 넘기면 왜 리렌더가 안 되나요?\" → children 엘리먼트는 바깥 컴포넌트가 만든 것이라, 상태를 가진 컴포넌트가 리렌더돼도 같은 엘리먼트 참조가 그대로 들어오고 React가 그 서브트리를 건너뛴다\n- <strong>출처:<\/strong> [useState — set 함수 주의점](https://react.dev/reference/react/useState#setstate-caveats) · [memo — props 변화 줄이기](https://react.dev/reference/react/memo#minimizing-props-changes)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"부모 상태 변경이 자식 전체로 전파되고 memo와 children 패턴이 전파를 끊는 지점\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <rect x=\"290\" y=\"20\" width=\"140\" height=\"50\" rx=\"10\" fill=\"var(--fig-accent)\" fill-opacity=\"0.2\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"360\" y=\"42\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">Page<\/text>\n  <text x=\"360\" y=\"60\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-accent)\">setState 발생<\/text>\n  <rect x=\"60\" y=\"130\" width=\"160\" height=\"50\" rx=\"10\" fill=\"var(--fig-accent)\" fill-opacity=\"0.2\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"140\" y=\"152\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">Header<\/text>\n  <text x=\"140\" y=\"170\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">리렌더<\/text>\n  <rect x=\"280\" y=\"130\" width=\"160\" height=\"50\" rx=\"10\" fill=\"none\" stroke=\"var(--fig-muted)\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/>\n  <text x=\"360\" y=\"152\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">memo(List)<\/text>\n  <text x=\"360\" y=\"170\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-muted)\">props 같으면 건너뜀<\/text>\n  <rect x=\"500\" y=\"130\" width=\"170\" height=\"50\" rx=\"10\" fill=\"none\" stroke=\"var(--fig-muted)\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/>\n  <text x=\"585\" y=\"152\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">{children}<\/text>\n  <text x=\"585\" y=\"170\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-muted)\">바깥이 만든 엘리먼트<\/text>\n  <rect x=\"60\" y=\"250\" width=\"160\" height=\"50\" rx=\"10\" fill=\"var(--fig-accent)\" fill-opacity=\"0.2\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"140\" y=\"280\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">Logo · 리렌더<\/text>\n  <rect x=\"280\" y=\"250\" width=\"160\" height=\"50\" rx=\"10\" fill=\"none\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <text x=\"360\" y=\"280\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">Row × 1000<\/text>\n  <rect x=\"500\" y=\"250\" width=\"170\" height=\"50\" rx=\"10\" fill=\"var(--fig-accent2)\" fill-opacity=\"0.2\" stroke=\"var(--fig-accent2)\" stroke-width=\"2\"/>\n  <text x=\"585\" y=\"270\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Context 구독자<\/text>\n  <text x=\"585\" y=\"288\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-accent2)\">memo 무시하고 리렌더<\/text>\n  <line x1=\"330\" y1=\"70\" x2=\"160\" y2=\"128\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <line x1=\"360\" y1=\"70\" x2=\"360\" y2=\"128\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <line x1=\"390\" y1=\"70\" x2=\"565\" y2=\"128\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <line x1=\"140\" y1=\"180\" x2=\"140\" y2=\"248\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <line x1=\"360\" y1=\"180\" x2=\"360\" y2=\"248\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <line x1=\"585\" y1=\"180\" x2=\"585\" y2=\"248\" stroke=\"var(--fig-accent2)\" stroke-width=\"2\"/>\n  <text x=\"360\" y=\"335\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-muted)\">실선 굵은 색 = 리렌더 전파 · 점선 = 전파가 끊기는 지점<\/text>\n<\/svg>\n<figcaption>리렌더는 부모에서 자식으로 내려간다. memo와 children 패턴이 끊고, Context 변경은 memo를 뚫는다.<\/figcaption>\n<\/figure>\n\n### 재조정과 key (Reconciliation & key)\n\n- <strong>뭐야:<\/strong> 재조정(Reconciliation)은 새 렌더 결과를 이전 트리와 비교해 무엇을 유지하고 무엇을 바꿀지 정하는 과정이고, <strong>key<\/strong>는 형제 항목 중 \"같은 항목\"을 알아보게 붙이는 이름표다. 상태는 컴포넌트가 아니라 트리의 위치에 붙는다\n- <strong>왜:<\/strong> key를 잘못 주면(인덱스 key 등) 리스트 중간 항목을 지웠을 때 항목 내용은 한 칸씩 올라오는데 입력값은 제자리에 남아 엉뚱한 항목에 붙거나, 탭을 바꿨는데 이전 탭의 폼 상태가 그대로 남는다\n- <strong>어떻게:<\/strong>\n  - 일반 트리 비교는 O(n³)이라, React는 두 가정으로 O(n) 휴리스틱을 쓴다: <strong>타입이 다르면 서브트리를 통째로 교체<\/strong>, <strong>형제 사이에선 key로 같은 항목을 식별<\/strong>\n  - 같은 위치·같은 타입이면 상태를 유지한다. 상태는 컴포넌트가 아니라 <strong>트리의 위치<\/strong>에 붙어 있다\n  - 인덱스 key는 정렬·삽입·삭제 시 \"다른 항목에 같은 key\"가 붙어 state·DOM(입력값, 포커스)이 엉뚱한 항목에 남는다\n  - 반대로 key를 일부러 바꾸면 <strong>상태 초기화<\/strong>가 된다: `<Form key={userId} />`\n- <strong>핵심:<\/strong> key는 <strong>형제 사이에서 안정적이고 고유한 id<\/strong>. 인덱스 key는 순서가 안 바뀌는 정적 리스트에서만. <strong>key 변경 = 리마운트 = 상태 리셋<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"인덱스 key가 정말 문제 되는 경우는?\" → 항목이 자체 state나 비제어 input을 갖고 순서가 바뀌거나 중간 삽입·삭제가 있을 때\n- <strong>출처:<\/strong> [Preserving and Resetting State](https://react.dev/learn/preserving-and-resetting-state) · [Reconciliation (legacy)](https://legacy.reactjs.org/docs/reconciliation.html)\n\n### Virtual DOM과 Fiber (Virtual DOM & Fiber)\n\n- <strong>뭐야:<\/strong> Virtual DOM은 UI의 \"있어야 할 모습\"을 메모리 객체로 두고 실제 DOM과 맞추는 방식이고, Fiber는 그 비교 작업을 잘게 쪼개 멈추고 재개할 수 있게 만든 React의 재조정 엔진이다\n- <strong>왜:<\/strong> Virtual DOM의 가치를 \"빠르다\"로만 알면 \"DOM 직접 조작보다 빠르냐\"는 꼬리에서 막힌다. 실제 가치는 선언형 모델이고, Fiber는 동시성 기능의 토대라 둘을 구분해 알아야 한다\n- <strong>어떻게:<\/strong>\n  - <strong>Virtual DOM<\/strong>: UI의 \"있어야 할 모습\"을 메모리에 객체로 두고, 실제 DOM과 맞추는(재조정) 패턴. 목적은 <strong>선언형 프로그래밍 모델<\/strong>이다. 개발자는 상태만 바꾸고, 어떤 DOM 연산이 필요한지는 React가 계산한다\n  - 비교 계산 자체가 추가 비용이라 최소 DOM 연산만 하는 손코드보다 <strong>본질적으로 빠를 수 없다<\/strong>. 이득은 \"충분히 빠르면서 실수 없는 갱신\"이다\n  - <strong>Fiber<\/strong>(React 16의 재조정 엔진): 렌더 작업을 컴포넌트 단위의 작은 작업 단위로 쪼개 <strong>멈췄다 재개·폐기·우선순위 지정<\/strong>이 가능하게 만든 구조. 18의 동시성 렌더링·transition·Suspense가 이 위에 올라간다\n- <strong>핵심:<\/strong> Virtual DOM의 가치는 속도가 아니라 <strong>선언형 + 충분한 성능<\/strong>. Fiber는 렌더를 <strong>쪼개고 끊을 수 있게<\/strong> 만든 엔진이라 동시성 기능의 토대다\n- <strong>꼬리질문:<\/strong>\n  - \"Virtual DOM 없는 프레임워크(Svelte·Solid)가 더 빠르지 않나요?\" → 컴파일 시점에 갱신 코드를 만들어 비교 비용을 없앤 접근이라 벤치마크에선 유리할 수 있다. React는 React Compiler로 불필요한 재계산을 줄이는 쪽을 택했다\n- <strong>출처:<\/strong> [Virtual DOM and Internals (legacy)](https://legacy.reactjs.org/docs/faq-internals.html) · [React v18 — Concurrent React](https://react.dev/blog/2022/03/29/react-v18#what-is-concurrent-react)\n\n> 한 줄 정리: 렌더는 버려질 수 있는 계산, 리렌더는 위에서 아래로, key는 상태의 주소, Fiber는 그 계산을 쪼개는 엔진이다.\n\n## 2. 상태와 훅\n\n### 상태 업데이트 배칭과 함수형 업데이트 (Batching & Updater Function)\n\n- <strong>뭐야:<\/strong> 배칭(batching)은 여러 setState를 모아 한 번만 리렌더하는 것이고, 함수형 업데이트는 `setCount(c => c + 1)`처럼 이전 값을 받아 다음 값을 돌려주는 함수를 넘기는 방식이다. state는 렌더 시점의 <strong>스냅샷<\/strong>이라 같은 핸들러 안에서는 값이 바뀌지 않는다\n- <strong>왜:<\/strong> 이걸 모르면 `setCount(count + 1)`을 세 번 불렀는데 1만 오르거나, setState 직후 값을 읽었는데 이전 값이 나오는 이유를 설명 못 한다\n- <strong>어떻게:<\/strong>\n  - state는 <strong>렌더 시점의 스냅샷<\/strong>이다. 같은 핸들러 안의 `count`는 끝까지 같은 값\n  - 여러 setState는 모아서(batch) 한 번만 리렌더한다. 주의: React 18(`createRoot`)부터 `setTimeout`·Promise·네이티브 이벤트 안에서도 <strong>자동 배칭(automatic batching)<\/strong>. 17까지는 React 이벤트 핸들러 안에서만 배칭\n  - 이전 값에 기반한 갱신은 <strong>함수형 업데이트<\/strong> `setCount(c => c + 1)`. 큐에 쌓여 순서대로 적용된다\n  - 배칭을 끊어야 하면(직후 DOM 측정) `flushSync`. 예외적으로만\n- <strong>핵심:<\/strong> state는 <strong>스냅샷<\/strong>, 업데이트는 <strong>큐<\/strong>. 이전 값 기반이면 <strong>updater 함수<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"함수형 업데이트가 stale closure도 막나요?\" → setState 쪽은 막는다. 콜백이 오래된 클로저여도 updater는 최신 state를 인자로 받으니 effect 의존성에서 state를 뺄 수 있다. 하지만 state를 읽어서 다른 일을 하는 코드는 못 막는다\n- <strong>출처:<\/strong> [React v18 — 자동 배칭](https://react.dev/blog/2022/03/29/react-v18#new-feature-automatic-batching) · [useState — 이전 state 기반 갱신](https://react.dev/reference/react/useState#updating-state-based-on-the-previous-state)\n\n### 훅 규칙과 호출 순서 (Rules of Hooks)\n\n- <strong>뭐야:<\/strong> React는 훅을 이름이 아니라 <strong>호출 순서<\/strong>로 구분한다. 그래서 훅은 컴포넌트·커스텀 훅의 최상위에서만, 매 렌더 같은 순서로 불러야 한다는 규칙이 있다\n- <strong>왜:<\/strong> 조건문 안에서 `useState`를 부르면 렌더마다 순서가 어긋나 \"Rendered more hooks than during the previous render\" 에러가 나거나, 상태가 다른 변수에 엉뚱하게 들어간다\n- <strong>어떻게:<\/strong>\n  - React는 훅을 이름이 아니라 <strong>호출 순서<\/strong>로 식별한다. 컴포넌트(Fiber)마다 훅 목록이 있고 n번째 호출 = n번째 슬롯\n  - 조건·반복·early return 뒤에서 훅을 부르면 렌더마다 순서가 달라져 슬롯이 어긋난다\n  - 규칙 두 개: <strong>최상위에서만 호출<\/strong>, <strong>React 함수(컴포넌트·커스텀 훅) 안에서만 호출<\/strong>. 이벤트 핸들러, `useMemo`·`useEffect`에 넘긴 함수 안, `try/catch` 블록 안도 금지\n  - 예외: 주의: React 19의 `use`는 조건문·반복문 안에서 호출 가능(그래도 컴포넌트·훅 안이어야 하고 `try/catch`로 감쌀 수 없다)\n- <strong>핵심:<\/strong> 훅의 정체성은 <strong>호출 순서<\/strong>. 그래서 <strong>조건부 호출 금지<\/strong>. 조건이 필요하면 훅 안쪽에서 분기하거나 컴포넌트를 쪼갠다\n- <strong>꼬리질문:<\/strong>\n  - \"왜 이름(key) 기반으로 안 만들었나요?\" → 커스텀 훅을 여러 번 조합하면 이름이 충돌한다. 순서 기반이라 같은 커스텀 훅을 두 번 불러도 독립 상태를 갖는다. 대가가 조건부 호출 금지다\n  - \"커스텀 훅은 상태를 공유하나요?\" → 아니다. 로직을 공유하고 상태는 호출한 컴포넌트마다 따로다. 공유하려면 상위 state·Context·외부 스토어\n- <strong>출처:<\/strong> [Rules of Hooks](https://react.dev/reference/rules/rules-of-hooks) · [use](https://react.dev/reference/react/use)\n\n### 로직 재사용: HOC·render props·커스텀 훅 (Logic Reuse Patterns)\n\n- <strong>뭐야:<\/strong> 여러 컴포넌트가 같은 상태 로직을 나눠 쓰는 방법들이다. HOC는 컴포넌트를 감싸는 함수, render props는 그릴 내용을 함수 prop으로 받는 컴포넌트, <strong>커스텀 훅<\/strong>은 `use`로 시작하는 함수로 로직만 꺼낸 것이다\n- <strong>왜:<\/strong> 방법을 모르면 여러 화면이 같은 구독·타이머·권한 판정 로직을 복붙하게 된다. 각 방식의 대가를 알아야 \"HOC와 훅 중 뭘 쓰겠냐\"는 질문에도 답할 수 있다\n- <strong>어떻게:<\/strong>\n  - <strong>HOC<\/strong>: 컴포넌트를 받아 감싼 새 컴포넌트를 돌려주는 함수(`withAuth(Page)`). 대가는 래퍼 중첩, props 이름 충돌, ref가 안쪽까지 안 가는 문제, 정적 메서드 복사\n  - <strong>render props<\/strong>: \"무엇을 그릴지\"를 함수 prop으로 받는 컴포넌트. 인라인 함수라 `memo` 비교가 매번 깨지고 JSX 중첩이 깊어진다\n  - <strong>커스텀 훅<\/strong>: `use`로 시작하는 함수로 <strong>상태 있는 로직<\/strong>을 꺼낸다. 트리에 래퍼가 추가되지 않고, 값을 그냥 반환하니 조합이 쉽다. 단 <strong>상태 자체는 공유하지 않고<\/strong> 호출한 컴포넌트마다 따로 생긴다\n  - 문서 권고: 훅을 안 부르는 함수엔 `use`를 안 붙이고, `useMount` 같은 생명주기 흉내 훅은 만들지 않는다\n- <strong>핵심:<\/strong> 기본은 <strong>커스텀 훅<\/strong>. HOC는 <strong>렌더 자체를 가로채야 할 때<\/strong>(권한 가드, 레거시 라이브러리)만. 커스텀 훅은 <strong>로직 공유, 상태 비공유<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"HOC가 아직 필요한 경우는요?\" → 컴포넌트를 아예 안 그리거나 다른 걸 그리게 하는 가드처럼 렌더 결정을 감싸야 할 때.\n- <strong>출처:<\/strong> [Reusing Logic with Custom Hooks](https://react.dev/learn/reusing-logic-with-custom-hooks) · [Higher-Order Components (legacy)](https://legacy.reactjs.org/docs/higher-order-components.html) · [Render Props (legacy)](https://legacy.reactjs.org/docs/render-props.html)\n\n### useEffect 의존성·클린업·Strict Mode 이중 실행 (Effect Dependencies & Cleanup)\n\n- <strong>뭐야:<\/strong> useEffect는 컴포넌트를 네트워크·소켓·타이머 같은 외부 시스템과 <strong>동기화<\/strong>하는 도구다. 의존성은 \"언제 다시 맞출지\", 클린업은 \"방금 맞춘 것을 어떻게 되돌릴지\"를 정한다\n- <strong>왜:<\/strong> 의존성·클린업을 틀리면 화면을 나갔는데 소켓·타이머·구독이 살아서 계속 돌거나, 빠르게 id를 바꿨을 때 늦게 온 이전 응답이 화면을 덮는 race condition이 생긴다. 개발 모드에서 effect가 두 번 도는 이유(클린업 검증)도 설명하지 못한다\n- <strong>어떻게:<\/strong>\n  - effect는 <strong>외부 시스템과의 동기화<\/strong> 수단. \"마운트 시 1회\"가 아니라 \"의존성 값이 이럴 때 외부를 이렇게 맞춘다\"\n  - 의존성은 effect 안에서 읽는 반응형 값(props·state·그로부터 파생된 값) <strong>전부<\/strong>. 빼면 오래된 값을 보고, 렌더 중에 만든 객체·함수를 넣으면 매 렌더 새 참조라 매번 돈다(객체는 effect 안에서 만드는 게 정석)\n  - 클린업은 <strong>다음 effect 실행 전<\/strong>과 <strong>언마운트 시<\/strong> 실행. 구독 해제·타이머 해제·`AbortController.abort()`·`ignore = true` 플래그로 race 차단\n  - 주의: React 18부터 <strong>Strict Mode(개발 모드)<\/strong>는 마운트 → 클린업 → 마운트를 한 번 더 돌린다. 클린업이 빠진 effect를 일부러 드러내려는 것. 운영 빌드에선 한 번\n- <strong>핵심:<\/strong> effect = <strong>동기화<\/strong>, 의존성 = <strong>읽는 값 전부<\/strong>, 클린업 = <strong>방금 한 일을 되돌리기<\/strong>. 이중 실행에서 깨지면 클린업이 틀린 것\n- <strong>꼬리질문:<\/strong>\n  - \"이중 실행이 싫어서 ref로 한 번만 돌게 막으면요?\" → 문서가 직접 금지하는 패턴이다. 증상만 숨기고 라우트 이동·Fast Refresh·주의: React 19.2 `<Activity>`(숨길 때 effect를 정리했다가 다시 보일 때 재실행)에서 같은 문제가 난다. 클린업을 고친다\n  - \"effect에서 데이터 페칭하면 뭐가 아쉽나요?\" → 서버에서 안 돌고, 워터폴(부모 렌더 후에야 자식 요청)이 생기고, 캐시·중복 제거·race 처리를 직접 해야 한다. 그래서 TanStack Query 같은 라이브러리나 서버 컴포넌트 페칭(4파트 참고)을 쓴다\n- <strong>출처:<\/strong> [Synchronizing with Effects — 개발 모드 이중 실행](https://react.dev/learn/synchronizing-with-effects#how-to-handle-the-effect-firing-twice-in-development) · [React v18 — Strict Mode 변경](https://react.dev/blog/2022/03/29/react-v18#new-strict-mode-behaviors)\n\n### stale closure와 latest ref 패턴 (Stale Closure & Latest Ref)\n\n- <strong>뭐야:<\/strong> stale closure는 함수가 만들어진 렌더의 값을 계속 붙잡고 있어 최신 state·props 대신 옛 값을 보는 현상이다. latest ref 패턴은 ref에 매번 최신 콜백을 넣어 두고 호출할 때 그걸 꺼내 쓰는 해법이다\n- <strong>왜:<\/strong> 모르면 `setInterval` 콜백에서 state를 읽을 때 계속 초기값이 나오거나, 마운트 때 한 번 등록한 소켓 리스너가 첫 렌더의 props만 보는 버그를 못 잡는다\n- <strong>어떻게:<\/strong>\n  - 함수는 <strong>만들어진 렌더의 값<\/strong>을 클로저로 잡는다. 의존성에서 빠진 effect·`useCallback` 안의 함수는 옛 렌더에 갇힌다\n  - 해결 1: 의존성에 제대로 넣는다(재구독이 괜찮다면 정석). 해결 2: setState만 필요하면 함수형 업데이트\n  - 해결 3: <strong>latest ref<\/strong> — 매 커밋마다 `ref.current = callback`으로 최신 함수를 넣고, 등록은 한 번만 하되 호출할 때 `ref.current()`를 부른다\n  - 주의: React 19.2부터 `useEffectEvent`가 공식 해법. effect 안의 \"비반응형 로직\"을 꺼내 최신 props·state를 읽는다. effect(또는 다른 Effect Event) 안에서만 호출하고, 의존성 배열에 넣거나 자식에게 넘기지 않는다\n- <strong>핵심:<\/strong> 클로저는 <strong>렌더 스냅샷<\/strong>을 잡는다. \"등록은 한 번, 값은 최신\"이 필요하면 <strong>ref에 최신 콜백<\/strong> 또는 <strong>useEffectEvent<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"latest ref를 렌더 중에 대입하면요?\" → 렌더는 버려질 수 있어서 커밋 안 된 값이 들어갈 수 있다. `useLayoutEffect`(또는 `useEffect`) 안에서 대입하는 게 안전하다\n  - \"그럼 모든 콜백을 ref·useEffectEvent로 감싸면 되지 않나요?\" → 의존성 추적을 끄는 것과 같다. 값이 바뀌었을 때 다시 동기화해야 하는 로직(예: roomId 바뀌면 재연결)까지 숨기게 된다.\n- <strong>출처:<\/strong> [useEffectEvent](https://react.dev/reference/react/useEffectEvent) · [React 19.2](https://react.dev/blog/2025/10/01/react-19-2)\n\n### 제어 컴포넌트와 비제어 컴포넌트 (Controlled vs Uncontrolled)\n\n- <strong>뭐야:<\/strong> 입력값을 누가 들고 있느냐의 차이다. 제어 컴포넌트는 React state가 값을 갖고(`value` + `onChange`), 비제어 컴포넌트는 DOM이 값을 갖고 있다가 필요할 때 ref나 `FormData`로 꺼낸다\n- <strong>왜:<\/strong> 둘을 섞으면 \"A component is changing an uncontrolled input to be controlled\" 경고가 나고, 필요 없는 곳까지 제어로 만들면 입력 하나에 폼 전체가 리렌더되고, 폼이 무거우면 타이핑이 버벅인다\n- <strong>어떻게:<\/strong>\n  - <strong>제어(controlled)<\/strong>: `value` + `onChange`. React state가 단일 진실 공급원(single source of truth). 입력마다 리렌더, 대신 즉시 검증·포맷팅·조건부 UI가 쉽다\n  - <strong>비제어(uncontrolled)<\/strong>: `defaultValue` + ref 또는 제출 시 `FormData`. DOM이 값을 가진다. 리렌더 없음, 대신 값 기반 실시간 UI가 번거롭다\n  - `value`가 `undefined`·`null` ↔ 문자열로 바뀌면 제어/비제어가 섞인다는 경고. 초기값을 `''`로 둔다. 한 input은 수명 중에 둘 사이를 오가면 안 된다\n  - 주의: React 19: `<form action={fn}>`의 액션이 성공하면 폼 안의 비제어 필드가 자동 리셋된다. `onSubmit` 핸들러로 처리할 때는 해당 없음\n- <strong>핵심:<\/strong> 값을 <strong>누가 소유하나<\/strong>의 문제. 입력마다 UI가 반응해야 하면 <strong>제어<\/strong>, 제출 시점에만 필요하면 <strong>비제어<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"제어 input을 `useTransition`으로 감싸 입력을 빠르게 할 수 있나요?\" → 안 된다. 문서가 명시한 제약으로, input의 value 갱신은 동기여야 한다. 입력 state는 즉시 갱신하고 그 값을 쓰는 무거운 결과 쪽을 transition이나 `useDeferredValue`로 미룬다\n- <strong>출처:<\/strong> [`<input>` — 제어 input](https://react.dev/reference/react-dom/components/input#controlling-an-input-with-a-state-variable) · [`<form>` — action prop](https://react.dev/reference/react-dom/components/form#handle-form-submission-with-an-action-prop)\n\n> 한 줄 정리: state는 렌더 스냅샷이고 훅은 호출 순서로 식별되며, 로직 재사용은 커스텀 훅으로, effect는 클린업까지가 한 세트다.\n\n## 3. 메모이제이션과 Context\n\n### useMemo·useCallback·React.memo가 안 먹히는 경우 (Memoization Pitfalls)\n\n- <strong>뭐야:<\/strong> `useMemo`는 계산 결과를, `useCallback`은 함수 참조를, `React.memo`는 props가 같을 때 컴포넌트 렌더를 재사용하는 메모이제이션 도구다. 셋 다 비교 대상이 이전과 같을 때만 효과가 있다\n- <strong>왜:<\/strong> 비교가 한 군데라도 깨지면 소용이 없어서, `memo`로 감쌌는데 Profiler에 계속 렌더가 찍히거나 useCallback을 도배했는데 체감 차이가 없는 일이 생긴다\n- <strong>어떻게:<\/strong>\n  - `memo`는 props를 prop마다 <strong>`Object.is`로 얕게 비교<\/strong>. 인라인 객체 `style={{}}`, 인라인 함수, `children` JSX가 하나라도 있으면 매번 실패\n  - `useCallback`은 <strong>memo된 자식에 넘기거나 다른 훅의 의존성에 들어갈 때<\/strong>만 의미가 있다. 일반 DOM 요소에 넘기면 비교할 주체가 없어 비용만 든다\n  - memo는 <strong>Context 변경<\/strong>과 <strong>자기 state 변경<\/strong>은 못 막는다\n  - `useMemo`는 성능 최적화일 뿐 의미 보장이 아니다. 개발 중 파일 수정, 최초 마운트 중 suspend 등에서 React가 캐시를 버릴 수 있다고 문서에 명시돼 있다\n  - 주의: React Compiler 1.0(2025-10-07)은 빌드 시점에 자동 메모이제이션을 넣는다(React 17 이상 지원). Next.js 16에서 `reactCompiler` 옵션이 stable이 됐지만 기본은 꺼져 있고, Babel 기반이라 빌드가 느려진다\n- <strong>핵심:<\/strong> memo는 <strong>사슬<\/strong>이다. 부모가 <strong>참조를 안정화<\/strong>하지 않으면 끊긴다. 먼저 <strong>구조(상태 내리기·children)<\/strong>로 풀고 남은 곳에만 측정 후 적용\n- <strong>꼬리질문:<\/strong>\n  - \"그럼 전부 memo하면 안전한가요?\" → 비교 비용·메모리·코드 복잡도가 늘고, 의존성 하나 빠뜨리면 stale 버그가 난다. 측정해서 비싼 곳에만\n  - \"memo에 custom 비교 함수를 넣으면?\" → 함수 props를 무시하도록 비교하면 오래된 콜백을 쓰는 버그가 생긴다. 비교 함수는 함수 포함 모든 prop을 봐야 하고, 깊은 비교는 오히려 느려질 수 있다\n  - \"컴파일러가 있으면 memo 지식이 필요 없나요?\" → 컴파일러는 Rules of React를 전제로 분석·검증하므로 규칙을 어긴 코드는 기대대로 최적화되지 않을 수 있다. 기본값이 꺼진 프로젝트도 많고, 왜 리렌더되는지 이해해야 결과를 검증할 수 있다\n- <strong>출처:<\/strong> [memo](https://react.dev/reference/react/memo) · [useMemo — 주의점](https://react.dev/reference/react/useMemo#caveats) · [React Compiler v1.0](https://react.dev/blog/2025/10/07/react-compiler-1)\n\n### Context 리렌더 범위와 쪼개기 (Context Re-render Scope)\n\n- <strong>뭐야:<\/strong> Context는 props를 여러 단계 거치지 않고 트리 아래 컴포넌트에 값을 바로 전달하는 통로다. Provider의 value가 바뀌면 그 Context를 읽는 컴포넌트가 전부 리렌더된다\n- <strong>왜:<\/strong> 범위를 모르고 전역 `AppContext` 하나에 user·theme·모달 상태를 다 넣으면, 모달 하나 열 때 user·theme만 읽는 컴포넌트까지 그 Context를 읽는 곳이 전부 리렌더된다\n- <strong>어떻게:<\/strong>\n  - Provider의 `value`가 `Object.is`로 바뀌면 그 Context를 읽는 <strong>모든 컴포넌트가 리렌더<\/strong>. 중간의 `memo`도 뚫는다\n  - Provider를 가진 컴포넌트가 리렌더될 때 `value={{ a, b }}`를 인라인으로 만들면 매번 새 객체 → 모든 구독자 리렌더. `useMemo`·`useCallback`으로 안정화\n  - <strong>쪼개기<\/strong>: 자주 바뀌는 값과 드문 값을 별도 Context로, <strong>state와 dispatch(setter)를 분리<\/strong>하면 setter만 쓰는 컴포넌트는 안 흔들린다\n  - Context엔 셀렉터가 없다. 일부 필드만 구독하려면 `useSyncExternalStore` 기반 외부 스토어(Zustand 등, 5파트 참고)\n- <strong>핵심:<\/strong> Context는 <strong>전달 수단<\/strong>이지 상태 관리 최적화 도구가 아니다. <strong>값이 바뀌면 구독자 전부<\/strong>. 빈도별로 <strong>쪼개고<\/strong>, 세밀한 구독은 <strong>외부 스토어<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"그럼 Redux·Zustand는 왜 덜 리렌더되나요?\" → 컴포넌트가 셀렉터로 필요한 조각만 구독하고, 그 조각이 바뀔 때만 리렌더되기 때문이다\n  - \"서버 상태도 Context에 넣어도 되나요?\" → 캐시·재검증·로딩 상태를 직접 관리해야 해서 TanStack Query 같은 서버 상태 도구에 맡기는 게 낫다\n- <strong>출처:<\/strong> [useContext — 리렌더 최적화](https://react.dev/reference/react/useContext#optimizing-re-renders-when-passing-objects-and-functions) · [React v19 — Context as provider](https://react.dev/blog/2024/12/05/react-19#context-as-a-provider)\n\n> 한 줄 정리: 메모이제이션은 참조 안정성의 사슬이라 구조로 먼저 풀고(컴파일러는 그 사슬을 자동화할 뿐), Context는 바뀌면 구독자 전부를 흔든다.\n\n## 4. DOM과 맞닿는 지점\n\n### useLayoutEffect vs useEffect\n\n- <strong>뭐야:<\/strong> 둘 다 커밋 뒤에 실행되는 effect인데 시점이 다르다. `useLayoutEffect`는 브라우저가 화면을 그리기(페인트) 전에, `useEffect`는 보통 그린 뒤에 실행된다\n- <strong>왜:<\/strong> 잘못 고르면 툴팁 위치를 effect에서 계산해 한 프레임 엉뚱한 자리에 보였다가 튀거나(flicker), 반대로 layout effect에 무거운 일을 넣어 화면이 늦게 뜬다\n- <strong>어떻게:<\/strong>\n  - `useLayoutEffect`: 커밋 직후 <strong>페인트 전에<\/strong> 실행. 안에서 setState하면 페인트 전에 동기로 다시 렌더해 사용자는 최종 결과만 본다\n  - `useEffect`: 보통 페인트 <strong>후<\/strong> 실행. 화면을 막지 않는다. 단 클릭 같은 상호작용이 일으킨 effect는 페인트 전에 돌 수 있다\n  - 레이아웃 측정(`getBoundingClientRect`) → 위치 보정처럼 <strong>보이기 전에 끝나야 하는 일<\/strong>만 layout effect. 문서도 \"가능하면 useEffect\"를 권한다\n  - 서버 렌더링에선 둘 다 실행되지 않는다. SSR에서 측정이 필요하면 클라이언트 전용으로 렌더하거나 측정 전 상태를 안전하게 그린다\n- <strong>핵심:<\/strong> <strong>측정 후 보정 = layout effect<\/strong>, <strong>그 외 전부 = effect<\/strong>. layout effect는 <strong>페인트를 막는다<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"마운트 시점에 폭이 0으로 나오는 건 왜죠?\" → 부모가 `display:none`이거나 아직 레이아웃이 확정 안 된 탭·애니메이션 안에서 측정했기 때문이다. ResizeObserver로 다시 재거나, 측정 자체가 필요 없게 CSS로 푸는 게 낫다\n- <strong>출처:<\/strong> [useLayoutEffect](https://react.dev/reference/react/useLayoutEffect)\n\n### 포털 (Portal)\n\n- <strong>뭐야:<\/strong> 포털은 컴포넌트를 DOM상 다른 위치(body 등)에 그리면서 React 트리상 부모 관계는 그대로 두는 기능이다(`createPortal`). 모달의 몸은 바깥에 두고 소속은 원래 부모에 남기는 셈이다\n- <strong>왜:<\/strong> 포털 없이 모달·드롭다운을 부모 안에 그리면 부모의 `overflow: hidden`에 잘리고, 부모의 `transform` 때문에 `position: fixed`가 뷰포트 기준이 아니게 된다. z-index를 아무리 올려도 다른 스태킹 컨텍스트 아래 깔리기도 한다\n- <strong>어떻게:<\/strong>\n  - `createPortal(children, domNode)`: <strong>DOM은 다른 곳(body 등)에<\/strong>, <strong>React 트리상 위치는 그대로<\/strong>\n  - 그래서 Context·state는 원래 부모 것을 그대로 쓴다\n  - 이벤트도 <strong>React 트리 기준으로 전파<\/strong>된다. 포털 안 클릭이 DOM상 부모가 아닌 React 부모의 `onClick`까지 올라간다. 막으려면 `stopPropagation`\n  - \"바깥 클릭 시 닫기\"를 DOM `contains`로 판정하면 포털 내용은 바깥으로 오판된다\n  - 접근성(포커스 트랩·`aria-modal`·ESC)은 WAI-ARIA 모달 패턴대로 챙기거나 라이브러리에 맡긴다\n- <strong>핵심:<\/strong> 포털은 <strong>DOM 위치만 옮기고 React 관계는 유지<\/strong>. 이벤트 전파는 <strong>React 트리 기준<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"z-index만 올리면 되지 않나요?\" → 스태킹 컨텍스트가 다르면 z-index는 그 컨텍스트 안에서만 비교된다. 층위를 올려서 해결하는 건 다른 겹침을 낳는다. 포털로 DOM 위치를 옮기는 게 근본 해법\n- <strong>출처:<\/strong> [createPortal](https://react.dev/reference/react-dom/createPortal)\n\n### 합성 이벤트와 이벤트 위임 (SyntheticEvent & Delegation)\n\n- <strong>뭐야:<\/strong> React 핸들러가 받는 `e`는 브라우저 이벤트를 감싸 브라우저 차이를 숨긴 <strong>합성 이벤트<\/strong>다. React는 노드마다 리스너를 달지 않고 루트 한 곳에서 이벤트를 받아 나눠 주는 위임 방식을 쓴다\n- <strong>왜:<\/strong> 이 구조를 모르면 React 핸들러의 `stopPropagation`과 `document`에 건 네이티브 리스너의 순서가 기대와 다를 때, 부모 `onScroll`에 자식 스크롤이 안 잡힐 때 원인을 못 찾는다\n- <strong>어떻게:<\/strong>\n  - 핸들러가 받는 `e`는 브라우저 이벤트를 감싼 <strong>합성 이벤트(SyntheticEvent)<\/strong>. W3C 이벤트 인터페이스(`target`·`preventDefault()` 등)를 맞춰 브라우저 차이를 숨기고, 원본은 `e.nativeEvent`\n  - React는 노드마다 리스너를 달지 않고 <strong>루트에서 위임(delegation)<\/strong>한다. 주의: React 17부터 위임 지점이 `document` → <strong>root 컨테이너<\/strong>로 바뀌었다(여러 React 버전 공존·외부 코드와의 충돌 완화)\n  - 주의: React 17에서 <strong>이벤트 풀링 제거<\/strong>: 비동기 콜백에서 `e`를 읽어도 되고 `e.persist()`가 필요 없다\n  - 브라우저와 다른 점: `onFocus`·`onBlur`는 React에선 버블링된다(내부적으로 `focusin`/`focusout`), `onScroll`은 버블링되지 않는다. 캡처 단계는 `onClickCapture`처럼 `Capture` 접미사\n- <strong>핵심:<\/strong> 합성 이벤트 = <strong>브라우저 차이를 숨긴 래퍼 + 루트 위임<\/strong>. 네이티브 리스너와 섞으면 <strong>전파 순서가 엇갈린다<\/strong>는 걸 기억한다\n- <strong>꼬리질문:<\/strong>\n  - \"React에서 stopPropagation하면 document 리스너도 막히나요?\" → React 17+에선 위임 지점이 root라, root 바깥(document)에 버블 단계로 단 네이티브 리스너보다 React 처리가 먼저 끝나고 거기서 멈춘다(`{ capture: true }`로 단 document 리스너는 먼저 받는다). 반대로 root 안쪽에 직접 단 네이티브 리스너는 React 핸들러보다 먼저 실행된다\n- <strong>출처:<\/strong> [React event object](https://react.dev/reference/react-dom/components/common#react-event-object) · [React v17 RC — 이벤트 위임 변경](https://legacy.reactjs.org/blog/2020/08/10/react-v17-rc.html#changes-to-event-delegation)\n\n> 한 줄 정리: 보이기 전 측정만 layout effect로, 갇힌 레이어는 포털로 옮기고, 이벤트는 루트에 위임된 합성 이벤트라 React 트리 기준으로 흐른다.\n\n## 5. 실패와 대기를 다루는 경계\n\n### 에러 바운더리 (Error Boundary)\n\n- <strong>뭐야:<\/strong> 에러 바운더리는 자식 트리의 렌더 중 에러를 잡아 그 영역만 대체 UI로 바꾸는 컴포넌트다. try/catch를 컴포넌트 트리 단위로 두는 것과 비슷하다\n- <strong>왜:<\/strong> 렌더 중 에러를 아무도 안 잡으면 React는 UI 전체를 화면에서 걷어낸다. 그래서 컴포넌트 하나가 `undefined.map`으로 터져도 앱 전체가 흰 화면이 된다\n- <strong>어떻게:<\/strong>\n  - 클래스 컴포넌트의 `static getDerivedStateFromError`(대체 UI)와 `componentDidCatch`(로깅). 함수형 대응물이 없어서 보통 `react-error-boundary`를 쓴다\n  - 잡는 것: 자식 트리의 <strong>렌더·라이프사이클<\/strong>에서 던진 에러. `startTransition` 안에서 던진 에러도 잡힌다\n  - 못 잡는 것: <strong>이벤트 핸들러<\/strong>, <strong>비동기 코드<\/strong>(setTimeout, rAF 콜백), SSR, 바운더리 자신의 에러. 이벤트 핸들러 에러는 try/catch하거나 state에 담아 렌더 중에 던진다\n  - 배치: 라우트·위젯 단위로 두면 한 영역만 대체 UI. 복구는 `resetKeys`나 key 변경\n  - 주의: React 19: `createRoot`·`hydrateRoot`에 `onCaughtError`(바운더리가 잡음)·`onUncaughtError`(아무도 못 잡음) 옵션이 생겼고, 렌더 에러를 다시 throw하지 않아 콘솔 중복이 줄었다\n- <strong>핵심:<\/strong> 에러 바운더리는 <strong>렌더 중 에러<\/strong>만 잡는다. <strong>이벤트·비동기는 못 잡음<\/strong>. 배치는 <strong>실패를 격리할 단위<\/strong>로\n- <strong>꼬리질문:<\/strong>\n  - \"TanStack Query 에러를 바운더리로 보내려면?\" → `throwOnError`(v5)로 렌더 중에 던지게 하고, `QueryErrorResetBoundary`와 묶어 재시도 시 쿼리를 리셋한다(5파트 참고)\n- <strong>출처:<\/strong> [Component — Error Boundary](https://react.dev/reference/react/Component#catching-rendering-errors-with-an-error-boundary) · [React v19 — 에러 리포팅](https://react.dev/blog/2024/12/05/react-19#error-handling)\n\n### Suspense와 lazy (Suspense & Code Splitting)\n\n- <strong>뭐야:<\/strong> Suspense는 자식이 \"아직 준비 안 됨\"을 알리면 그동안 fallback을 대신 보여주는 로딩 경계이고, lazy는 컴포넌트 코드를 동적 import로 따로 떼어 필요할 때 불러오는 함수다\n- <strong>왜:<\/strong> 없으면 차트·에디터 같은 무거운 라이브러리가 초기 번들에 다 들어가 첫 화면이 늦어진다. 컴포넌트마다 `isLoading` 분기가 흩어져 로딩 스피너가 여기저기서 따로 깜빡이기도 한다\n- <strong>어떻게:<\/strong>\n  - `<Suspense fallback>`: 자식이 <strong>\"아직 준비 안 됨\"을 알리면(suspend)<\/strong> 가장 가까운 Suspense의 fallback을 대신 보여준다. 로딩 상태를 선언적으로 위로 올리는 장치\n  - `lazy(() => import('./Chart'))`: 동적 import로 청크를 분리하고, 로딩 중엔 suspend\n  - 데이터로 suspend하려면 Suspense를 지원하는 소스가 필요하다: 프레임워크(Next.js 서버 컴포넌트), TanStack Query `useSuspenseQuery`, 주의: React 19 `use(promise)`. effect나 이벤트 핸들러 안 페칭은 Suspense를 트리거하지 않는다\n  - 이미 보이던 화면이 transition 안에서 다시 suspend되면 fallback으로 되돌리지 않고 <strong>이전 화면을 유지<\/strong>한다\n  - SSR에선 Suspense 경계가 <strong>스트리밍 단위<\/strong>가 된다(4파트 참고)\n- <strong>핵심:<\/strong> Suspense는 <strong>\"기다림의 경계\"<\/strong>. 경계 위치가 곧 <strong>로딩 UX 설계<\/strong>. lazy는 <strong>코드<\/strong>를, use·Suspense 쿼리는 <strong>데이터<\/strong>를 기다린다\n- <strong>꼬리질문:<\/strong>\n  - \"경계를 잘게 쪼개면 좋은가요?\" → 스피너가 따로 튀는 팝콘 현상이 생긴다. 함께 보여야 하는 영역은 한 경계로 묶는다\n  - \"use(promise)의 promise를 렌더 안에서 만들면?\" → 렌더마다 새 promise라 계속 suspend된다. 서버 컴포넌트에서 만든 promise를 넘기거나 캐시된 promise를 쓴다\n- <strong>출처:<\/strong> [Suspense](https://react.dev/reference/react/Suspense) · [use — promise 주의점](https://react.dev/reference/react/use#promise-caveats)\n\n### 동시성 렌더링: useTransition·useDeferredValue (Concurrent Rendering)\n\n- <strong>뭐야:<\/strong> 동시성 렌더링은 렌더를 중간에 끊을 수 있게 해서, 급한 업데이트(입력)를 급하지 않은 업데이트(결과 목록)보다 먼저 처리하는 방식이다. `useTransition`·`useDeferredValue`는 어떤 업데이트가 덜 급한지 React에 알려 주는 훅이다\n- <strong>왜:<\/strong> 모든 업데이트를 똑같이 급하게 처리하면 검색어 입력에 따라 수천 행을 필터링할 때 타이핑 자체가 버벅이고, 탭 전환에서 무거운 탭이 그려질 동안 클릭이 먹통이 된다\n- <strong>어떻게:<\/strong>\n  - 주의: React 18부터 렌더가 <strong>중단 가능(interruptible)<\/strong>해져 급한 업데이트(입력)가 급하지 않은 업데이트(결과 목록)를 끊고 먼저 처리된다\n  - `useTransition`: `startTransition(() => setTab(next))`로 <strong>업데이트를 낮은 우선순위로 표시<\/strong>. `isPending`으로 진행 표시. setter를 쥐고 있을 때 쓴다\n  - `useDeferredValue(value)`: <strong>값의 지연 사본<\/strong>. 급한 렌더는 옛 값으로 먼저 끝내고 뒤에서 새 값으로 다시 렌더. props로 값만 받는 쪽에서 쓴다. 주의: React 19에서 `initialValue` 인자 추가\n  - 디바운스와 차이: 고정 지연이 없다. 기기가 빠르면 바로, 느리면 입력이 우선. 단 <strong>네트워크 요청 수를 줄이진 않는다<\/strong>\n  - 주의: React 19부터 `startTransition`에 async 함수를 넘길 수 있다(Actions). 단 `await` 뒤의 set 호출은 transition으로 안 잡혀서 다시 `startTransition`으로 감싸야 한다\n- <strong>핵심:<\/strong> 계산을 <strong>빨리하는<\/strong> 게 아니라 <strong>양보하게<\/strong> 만든다. setter가 있으면 <strong>useTransition<\/strong>, 값만 있으면 <strong>useDeferredValue<\/strong>. useDeferredValue로 넘기는 무거운 자식은 <strong>memo<\/strong>로 감싸야 효과가 난다\n- <strong>꼬리질문:<\/strong>\n  - \"그럼 디바운스는 필요 없나요?\" → 요청 횟수를 줄이려면 여전히 필요하다. useDeferredValue는 렌더 비용용이다\n  - \"언제 안 통하나요?\" → 렌더 하나가 단일 컴포넌트 안에서 오래 걸리면(거대한 동기 계산) 중단 지점이 없다. 리스트 가상화나 계산 분리가 먼저다.\n- <strong>출처:<\/strong> [useTransition — input은 transition 불가](https://react.dev/reference/react/useTransition#updating-an-input-in-a-transition-doesnt-work) · [useDeferredValue — 디바운스와 차이](https://react.dev/reference/react/useDeferredValue#how-is-deferring-a-value-different-from-debouncing-and-throttling)\n\n> 한 줄 정리: 에러 바운더리와 Suspense는 실패와 대기의 경계를 선언하는 장치고, 동시성 기능은 무거운 렌더가 입력에 양보하게 만든다.\n\n## 6. 최신 변화\n\n### React 19 주요 변화 (React 19)\n\n- <strong>뭐야:<\/strong> React 19는 폼 제출 같은 비동기 변경(mutation)을 React가 직접 관리하도록 Actions·`useActionState`·`useOptimistic`·`use`를 들여오고, ref를 일반 prop으로 받게 바꾼 버전이다\n- <strong>왜:<\/strong> 이전에는 폼 제출마다 `isPending`·`error`·낙관적 업데이트·롤백 state를 손으로 짜고 `forwardRef`로 감싸야 했다. 라이브러리 업그레이드 시 깨지는 API를 설명할 때도 이 변화를 알아야 한다\n- <strong>어떻게:<\/strong> (주의: React 19, 2024-12-05 stable 기준)\n  - <strong>Actions<\/strong>: transition 안의 async 함수. pending·에러·낙관적 업데이트·순차 처리를 React가 관리. `<form action={fn}>`에 함수 전달 가능\n  - <strong>`useActionState`<\/strong>(canary 시절 `ReactDOM.useFormState`에서 이름 변경): 액션 결과 state와 pending을 묶어 반환. <strong>`useFormStatus`<\/strong>(react-dom): 부모 form의 pending을 자식 버튼이 Context처럼 읽음. <strong>`useOptimistic`<\/strong>: 요청 중 낙관적 값 표시, 끝나면 실제 값으로 수렴\n  - <strong>`use`<\/strong>: promise나 Context를 렌더 중에 읽는다. 조건문 안에서도 호출 가능\n  - <strong>ref를 일반 prop으로<\/strong>: 함수 컴포넌트가 `forwardRef` 없이 `ref` prop을 받는다(`forwardRef`는 이후 버전에서 deprecated 예정). ref 콜백이 클린업 함수를 반환할 수 있다. ref는 포커스·스크롤 같은 명령형 동작에만 쓰고, 노출 범위는 `useImperativeHandle`로 줄인다\n  - 그 밖에: `<Context>`를 Provider로, `<title>`·`<meta>`를 컴포넌트 안에 써도 `<head>`로 올림, 하이드레이션 에러 diff 표시\n  - 주의: React 19.2(2025-10-01): `useEffectEvent`, `<Activity>`(숨길 때 state·DOM은 유지하고 effect는 정리), `cacheSignal`(RSC), 부분 사전 렌더링 API\n- <strong>핵심:<\/strong> 19의 방향은 <strong>비동기 변경(mutation)을 React가 관리<\/strong>하는 것. <strong>Actions + useActionState + useOptimistic<\/strong>, 렌더 중 읽기는 <strong>use<\/strong>, <strong>ref는 prop<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"TanStack Query의 mutation이 있는데 Actions가 필요한가요?\" → 겹친다. 클라이언트 캐시 무효화·재시도가 중심이면 Query mutation, 서버 액션·폼 중심(점진적 향상 포함)이면 Actions가 자연스럽다. 한 화면에 섞으면 pending 출처가 두 개가 된다\n  - \"업그레이드 시 깨지는 건?\" → 주의: `propTypes`·함수 컴포넌트 `defaultProps` 제거, string ref·legacy context 제거, `ReactDOM.render`·`hydrate`·`findDOMNode`·`unmountComponentAtNode` 제거(`createRoot`·`hydrateRoot`만), UMD 빌드 제거. 공식 codemod가 있고, 의존 라이브러리 호환부터 확인한다\n- <strong>출처:<\/strong> [React v19](https://react.dev/blog/2024/12/05/react-19) · [React 19 Upgrade Guide](https://react.dev/blog/2024/04/25/react-19-upgrade-guide) · [forwardRef](https://react.dev/reference/react/forwardRef)\n\n> 한 줄 정리: React 19는 비동기 변경을 React가 관리하는 방향이고, 버전 경계(17 위임·18 배칭·19 Actions·19.2 useEffectEvent·컴파일러 1.0)를 같이 말한다.\n\n## 핵심 키워드 모음\n\n- <strong>렌더와 커밋<\/strong>: 렌더는 순수 계산(폐기 가능), 커밋은 바뀐 DOM만 반영(동기)\n- <strong>리렌더 조건<\/strong>: 자기 state · 부모 리렌더 · Context 값 변경. props 변경은 원인이 아님\n- <strong>재조정과 key<\/strong>: O(n) 휴리스틱, 타입 다르면 교체, key 변경 = 리마운트\n- <strong>Virtual DOM·Fiber<\/strong>: VDOM은 선언형용(최소 연산만 하는 직접 조작보다 빠르진 않음), Fiber는 렌더를 쪼개는 엔진\n- <strong>배칭·함수형 업데이트<\/strong>: state는 스냅샷, 업데이트는 큐. React 18부터 자동 배칭\n- <strong>훅 규칙<\/strong>: 호출 순서로 식별 → 조건부·핸들러·try/catch 안 금지 (`use`만 조건문 예외)\n- <strong>로직 재사용<\/strong>: HOC·render props → 커스텀 훅. 훅은 로직 공유, 상태 비공유\n- <strong>useEffect<\/strong>: 외부 동기화. 의존성 = 읽는 값 전부, Strict Mode 이중 실행은 클린업 검증\n- <strong>stale closure<\/strong>: 함수는 렌더 스냅샷을 잡음 → latest ref 또는 useEffectEvent(19.2)\n- <strong>제어/비제어<\/strong>: 값의 소유자가 state냐 DOM이냐. 19 action 성공 시 비제어 필드 리셋\n- <strong>메모이제이션 함정<\/strong>: 얕은 비교 사슬이 인라인 값에서 끊김. Context·자기 state는 못 막음. 컴파일러 1.0\n- <strong>Context 리렌더<\/strong>: 값 바뀌면 구독자 전부. 빈도별·state/dispatch 분리, 세밀하면 외부 스토어\n- <strong>useLayoutEffect<\/strong>: 페인트 전 실행, 측정 후 보정에만. SSR에선 안 돎\n- <strong>포털<\/strong>: DOM 위치만 이동, 이벤트 전파는 React 트리 기준\n- <strong>합성 이벤트<\/strong>: 래퍼 + 루트 위임(17부터 root 컨테이너), 풀링 제거, onScroll 비버블\n- <strong>에러 바운더리<\/strong>: 렌더 중 에러만. 이벤트·비동기는 못 잡음. 19에 onCaughtError·onUncaughtError\n- <strong>Suspense·lazy<\/strong>: 기다림의 경계, SSR에선 스트리밍 단위\n- <strong>useTransition·useDeferredValue<\/strong>: 빨리하는 게 아니라 양보. 요청 수 줄이기는 디바운스\n- <strong>React 19<\/strong>: Actions·useActionState·useFormStatus·useOptimistic·use·ref prop. 19.2에 useEffectEvent·Activity\n"}, {"id": "n04", "num": "4", "title": "Next.js와 렌더링 전략", "md": "# 4. Next.js와 렌더링 전략\n\n<strong>이 파트는 뭐냐:<\/strong> \"이 페이지는 어디서, 언제 HTML이 만들어지나\"를 고르는 문제. CSR·SSR·SSG·ISR의 선택, 서버 HTML이 클라이언트에서 살아나는 하이드레이션, App Router의 서버/클라이언트 컴포넌트 경계, 버전마다 바뀌어 온 캐싱, 그리고 미들웨어·환경 변수·런타임처럼 배포에서 터지는 지점까지. 한 줄 요약: <strong>렌더링 위치와 시점, 그리고 캐시의 수명을 고르는 일.<\/strong>\n\n> 주의: 이 파트의 버전 표기 기준: Next.js 13.4(2023-05, App Router stable) · 14(2023-10) · 15(2024-10) · 15.5(2025-08) · 16(2025-10-21) · 16.3(2026-08). 캐싱 기본값은 버전마다 반대로 바뀌었으니 설명할 때는 \"어느 버전 기준인지\"를 먼저 말한다.\n\n## 1. 렌더링 전략\n\n### CSR·SSR·SSG·ISR 비교와 선택 기준 (Rendering Strategies)\n\n- <strong>뭐야:<\/strong> 페이지 HTML을 어디서, 언제 만드느냐에 따른 네 가지 방식이다. CSR은 브라우저에서, SSR은 요청마다 서버에서, SSG는 빌드 때 만들고, ISR은 SSG 결과를 조건에 따라 다시 만든다\n- <strong>왜:<\/strong> 잘못 고르면 로그인 전 랜딩이 빈 화면으로 떠서 검색 노출·첫 화면이 느려지거나, 반대로 드물게 바뀌는 공용 페이지를 매 요청 SSR로 돌려 TTFB와 서버 비용만 늘린다\n- <strong>어떻게:<\/strong>\n  - <strong>CSR<\/strong>: 빈 HTML + JS 번들 → 브라우저에서 데이터 요청 후 렌더. 서버 부담이 적지만 앱이 커질수록 JS가 늘어 첫 화면·SEO·INP가 약해진다\n  - <strong>SSR<\/strong>: 요청마다 서버에서 HTML 생성. FCP가 빠르고 사용자별 데이터 가능, 대신 생성 시간만큼 <strong>TTFB가 늘고<\/strong> 매 요청 서버 비용\n  - <strong>SSG<\/strong>: 빌드 때 HTML 생성 → CDN에서 바로 서빙. TTFB·FCP 모두 유리하지만 데이터가 빌드 시점에 고정되고 URL을 미리 알아야 한다\n  - <strong>ISR<\/strong>: SSG + 재생성. 시간 기반이면 만료 후 첫 요청에 <strong>옛 페이지를 주고 뒤에서 재생성<\/strong>(stale-while-revalidate). `revalidatePath`·`revalidateTag`로 on-demand 무효화(다음 요청 때 재생성)\n- <strong>핵심:<\/strong> 공용·드물게 변경 → <strong>SSG/ISR<\/strong>, 사용자별·실시간 → <strong>SSR<\/strong> 또는 <strong>CSR<\/strong>, 로그인 뒤 앱 화면 → <strong>CSR(+서버 셸)<\/strong>도 충분하다. App Router에선 페이지 단위가 아니라 <strong>세그먼트·컴포넌트 단위<\/strong>로 섞인다\n- <strong>꼬리질문:<\/strong>\n  - \"ISR에서 사용자가 옛 데이터를 보는 건 괜찮나요?\" → 만료 직후 첫 요청자는 옛 페이지를 본다. 가격·재고처럼 틀리면 안 되는 값은 ISR에서 빼고 따로 조회하거나 on-demand 재검증을 건다\n  - \"App Router엔 getServerSideProps가 없는데 SSR/SSG를 어떻게 정하나요?\" → 라우트가 쓰는 API로 정해진다. `cookies()`·`headers()`·`searchParams` 같은 요청 시점 API나 캐시 안 된 데이터를 쓰면 요청 시 렌더, 아니면 빌드 시 사전 렌더. 주의: Cache Components를 안 켠 경우 `dynamic`·`revalidate` 세그먼트 설정으로 강제할 수 있다(16에서 켜면 이 설정들은 제거)\n- <strong>출처:<\/strong> [Rendering on the Web](https://web.dev/articles/rendering-on-the-web) · [ISR 가이드](https://nextjs.org/docs/app/guides/incremental-static-regeneration)\n\n### 하이드레이션 (Hydration)\n\n- <strong>뭐야:<\/strong> 하이드레이션은 서버가 보낸 HTML 위에서 브라우저가 JS로 같은 트리를 다시 렌더하며 이벤트 핸들러를 붙이는 과정이다. 그림만 있는 화면에 동작을 입히는 일이다\n- <strong>왜:<\/strong> 이 단계가 끝나기 전에는 화면이 보여도 동작하지 않아, SSR 화면이 이미 보이는데 버튼을 눌러도 반응이 없는 구간(uncanny valley)이 생긴다. 서버 HTML과 클라이언트 렌더 결과가 다르면 하이드레이션 에러가 난다\n- <strong>어떻게:<\/strong>\n  - 서버가 만든 HTML은 \"그림\"일 뿐이다. 브라우저가 JS를 받아 <strong>같은 트리를 다시 렌더하며 기존 DOM에 이벤트 핸들러를 붙이는 것<\/strong>이 하이드레이션(`hydrateRoot`)\n  - DOM을 새로 만들지 않고 <strong>재사용<\/strong>하기 때문에, 서버 출력과 클라이언트 첫 렌더가 <strong>같아야<\/strong> 한다\n  - JS 실행 전까지는 보이지만 동작하지 않는다 → JS가 클수록 상호작용이 늦다\n  - 주의: React 18부터 <strong>선택적 하이드레이션(selective hydration)<\/strong>: Suspense 경계 단위로 나눠 하이드레이션하고, 사용자가 상호작용한 영역을 먼저 처리\n  - 서버 컴포넌트 코드는 클라이언트로 안 가고 RSC Payload로 트리만 맞춘다. 하이드레이션되는 건 <strong>클라이언트 컴포넌트<\/strong>뿐\n- <strong>핵심:<\/strong> 하이드레이션 = <strong>서버 HTML에 동작을 입히기<\/strong>. 비용은 <strong>클라이언트 JS 양<\/strong>에 비례하고, 전제는 <strong>서버·클라이언트 첫 렌더가 같다<\/strong>는 것\n- <strong>꼬리질문:<\/strong>\n  - \"SSR이면 무조건 빨라지나요?\" → 첫 페인트는 빨라도 JS가 크면 상호작용은 오히려 늦을 수 있다. 서버 컴포넌트로 클라이언트 JS 자체를 줄이는 게 App Router의 답이다\n- <strong>출처:<\/strong> [Server and Client Components — first load](https://nextjs.org/docs/app/getting-started/server-and-client-components#on-the-client-first-load)\n\n### 하이드레이션 불일치 원인과 해결 (Hydration Mismatch)\n\n- <strong>뭐야:<\/strong> 하이드레이션 불일치는 서버가 만든 HTML과 클라이언트 첫 렌더 결과가 달라지는 상황이다. 시간·난수·브라우저 전용 값처럼 실행 환경마다 달라지는 값이 첫 렌더에 섞이면 생긴다\n- <strong>왜:<\/strong> 생기면 \"Text content does not match server-rendered HTML\" / \"Hydration failed\" 에러가 나고, 해당 영역이 클라이언트에서 다시 그려져 깜빡이거나 SSR 이점이 사라진다\n- <strong>어떻게:<\/strong>\n  - <strong>비결정적 값<\/strong>: `Date`, `toLocaleString()`, `Math.random()`, 렌더 중 생성한 id. 서버와 클라이언트의 <strong>시간대·로캘<\/strong>이 다르면 같은 시각도 다른 문자열이 된다\n  - <strong>환경 분기<\/strong>: `typeof window !== 'undefined'`로 렌더 결과를 바꾸거나, `localStorage`·`matchMedia` 값을 첫 렌더에 반영\n  - <strong>잘못된 HTML 중첩<\/strong>: `<p>` 안의 `<div>`·`<p>`, `<a>` 안의 `<a>`, `<button>` 안의 `<button>`. 브라우저 파서가 DOM을 고쳐버려 서버 HTML과 달라진다\n  - <strong>외부 수정<\/strong>: 번역·광고 차단 확장, HTML을 고치는 CDN(자동 압축 등), <strong>iOS의 전화번호·이메일 자동 링크 변환<\/strong>(`<meta name=\"format-detection\">`으로 끈다)\n  - 해결: 클라이언트 전용 값은 <strong>마운트 후 effect에서 state로<\/strong>, id는 <strong>`useId`<\/strong>, 클라이언트 전용 컴포넌트는 `next/dynamic`의 `ssr: false`(주의: 15부터 서버 컴포넌트에선 금지), 불가피한 텍스트 차이는 `suppressHydrationWarning`(한 단계만)\n- <strong>핵심:<\/strong> 원인은 <strong>첫 렌더가 환경에 따라 달라지는 것<\/strong>. 규칙은 <strong>첫 렌더는 서버와 동일하게, 차이는 마운트 후에<\/strong>. 시간은 <strong>타임존을 명시<\/strong>해 포맷한다\n- <strong>꼬리질문:<\/strong>\n  - \"`suppressHydrationWarning`을 루트에 걸면 끝 아닌가요?\" → 경고만 숨기고, React는 그 텍스트 차이를 고쳐주지도 않는다. 한 단계에만 적용되니 테마 클래스처럼 의도된 차이에만 쓴다\n  - \"마운트 후 state로 바꾸면 대가는?\" → 한 프레임 서버 값이 보였다가 바뀐다. 자리를 미리 잡아 레이아웃 흔들림을 막는다\n- <strong>출처:<\/strong> [Hydration error 안내](https://nextjs.org/docs/messages/react-hydration-error)\n\n> 한 줄 정리: 렌더링 전략은 \"데이터가 누구 것이고 얼마나 자주 바뀌나\"로 고르고, SSR을 고르면 TTFB 비용·하이드레이션 비용·첫 렌더 일치 의무가 따라온다.\n\n## 2. App Router의 컴포넌트 모델\n\n### 서버 컴포넌트 vs 클라이언트 컴포넌트 (Server & Client Components)\n\n- <strong>뭐야:<\/strong> App Router의 컴포넌트는 서버에서만 실행되고 결과만 보내는 서버 컴포넌트와, `\"use client\"`로 표시해 브라우저에서도 실행되는 클라이언트 컴포넌트로 나뉜다. 레이아웃·페이지의 기본값은 <strong>서버 컴포넌트<\/strong>다\n- <strong>왜:<\/strong> 구분을 모르면 마크다운 파서·날짜 라이브러리 같은 무거운 의존성이 단순 표시용인데도 클라이언트 번들에 들어가거나, 반대로 서버 컴포넌트에서 `useState`를 썼다가 빌드 에러가 난다\n- <strong>어떻게:<\/strong>\n  - App Router의 레이아웃·페이지 기본값은 <strong>서버 컴포넌트(RSC)<\/strong>. 서버에서만 실행되고 결과(RSC Payload)만 클라이언트로 간다. 코드·의존성이 <strong>번들에 포함되지 않는다<\/strong>\n  - 서버 컴포넌트에서 가능: `async` 컴포넌트로 직접 `await` 페칭, DB·비밀키 접근. 불가능: state·effect·이벤트 핸들러·브라우저 API·Context\n  - <strong>클라이언트 컴포넌트<\/strong>: `\"use client\"` 파일. 첫 로드 때 서버에서 HTML로도 사전 렌더되고 클라이언트에서 하이드레이션된다(= \"클라이언트에서만 실행\"이 아니다). 이후 내비게이션에선 클라이언트에서만 렌더\n  - 배치 원칙: 상호작용이 필요한 <strong>잎(leaf)만 클라이언트로<\/strong>, 데이터·레이아웃은 서버에 둔다\n  - 비밀 코드가 클라이언트로 새는 걸 막으려면 `import 'server-only'`로 빌드 타임에 차단\n- <strong>핵심:<\/strong> 기본은 <strong>서버<\/strong>, 상호작용이 있는 <strong>잎만 클라이언트<\/strong>. 서버 컴포넌트의 이득은 <strong>번들 0 + 데이터 근접<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"서버 컴포넌트와 SSR은 같은 건가요?\" → 다르다. SSR은 HTML을 서버에서 만드는 것이고, 클라이언트 컴포넌트도 SSR된다. 서버 컴포넌트는 코드가 아예 클라이언트로 안 가는 컴포넌트 종류다\n  - \"서버 컴포넌트에서 TanStack Query를 못 쓰면 클라이언트 캐시는요?\" → 서버에서 prefetch하고 `HydrationBoundary`로 dehydrate한 상태를 클라이언트 쿼리 캐시에 넘긴다(5파트 참고)\n- <strong>출처:<\/strong> [Server and Client Components](https://nextjs.org/docs/app/ge
