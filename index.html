tting-started/server-and-client-components)\n\n### \"use client\" 경계와 직렬화 가능한 props (Client Boundary & Serializable Props)\n\n- <strong>뭐야:<\/strong> `\"use client\"`는 컴포넌트 하나가 아니라 그 파일이 import하는 모듈까지 클라이언트 번들로 넣는 경계선이다. 이 경계를 넘어 서버에서 클라이언트로 가는 props는 <strong>직렬화<\/strong> 가능(네트워크로 보낼 수 있는 데이터)해야 한다\n- <strong>왜:<\/strong> 모르면 서버 컴포넌트에서 클라이언트 컴포넌트로 `onClick` 함수나 클래스 인스턴스를 넘겼다가 \"Functions cannot be passed directly to Client Components\" 에러가 난다. 상위 컴포넌트에 `\"use client\"`를 붙여 그 파일이 import하는 하위 컴포넌트까지 전부 클라이언트 번들로 들어가기도 한다\n- <strong>어떻게:<\/strong>\n  - `\"use client\"`는 컴포넌트 하나가 아니라 <strong>모듈 그래프의 경계<\/strong>다. 그 파일이 import하는 모듈과 직접 렌더하는 컴포넌트가 클라이언트 번들로 들어간다\n  - 서버 → 클라이언트 props는 <strong>직렬화 가능<\/strong>해야 한다. 원시값(전역 등록 `Symbol.for` 포함)·배열·`Map`·`Set`·TypedArray·`Date`·일반 객체·JSX·Promise·서버 함수는 가능, 일반 함수·클래스·클래스 인스턴스·null 프로토타입 객체·전역 등록 안 된 심볼은 불가\n  - 클라이언트 컴포넌트가 서버 컴포넌트를 <strong>import하면<\/strong> 그 컴포넌트도 클라이언트 모듈 그래프에 들어가 서버 컴포넌트로 동작하지 않는다. 대신 <strong>children·props 슬롯으로 받으면<\/strong> 서버에서 렌더된 결과를 끼워 넣을 수 있다(interleaving)\n  - Context Provider는 클라이언트 컴포넌트라, `providers.tsx`를 따로 만들어 레이아웃에서 children을 감싼다. 문서는 Provider를 가능한 한 깊게 두라고 한다\n- <strong>핵심:<\/strong> `\"use client\"`는 <strong>import 그래프에 긋는 선<\/strong>. 경계는 <strong>최대한 아래로<\/strong>, 넘기는 건 <strong>직렬화 가능한 데이터<\/strong>, 서버 UI는 <strong>children으로 꽂는다<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"클라이언트 컴포넌트 안에 서버 컴포넌트를 넣고 싶으면?\" → import 대신 부모 서버 컴포넌트에서 `<ClientShell><ServerList /><\/ClientShell>`처럼 children으로 넘긴다\n  - \"Promise를 넘기면 뭐가 좋나요?\" → 서버에서 await하지 않고 넘기면 클라이언트가 `use(promise)` + Suspense로 받아 스트리밍과 결합된다(3파트 참고)\n- <strong>출처:<\/strong> ['use client' — 직렬화 타입](https://react.dev/reference/rsc/use-client#serializable-types) · [Interleaving](https://nextjs.org/docs/app/getting-started/server-and-client-components#interleaving-server-and-client-components)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"서버 컴포넌트 트리 안에서 use client 경계 아래만 클라이언트 번들로 가고, 서버 컴포넌트는 children으로 클라이언트 컴포넌트 안에 끼워지는 구조\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <rect x=\"20\" y=\"20\" width=\"680\" height=\"320\" rx=\"14\" fill=\"var(--fig-accent)\" fill-opacity=\"0.08\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"40\" y=\"46\" font-size=\"15\" fill=\"var(--fig-accent)\">서버 (번들에 안 들어감 · await·DB·비밀키 가능)<\/text>\n  <rect x=\"290\" y=\"60\" width=\"140\" height=\"44\" rx=\"8\" fill=\"var(--fig-bg)\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"360\" y=\"87\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">layout.tsx<\/text>\n  <rect x=\"90\" y=\"140\" width=\"160\" height=\"44\" rx=\"8\" fill=\"var(--fig-bg)\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"170\" y=\"167\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">page.tsx (async)<\/text>\n  <rect x=\"400\" y=\"125\" width=\"280\" height=\"200\" rx=\"12\" fill=\"var(--fig-accent2)\" fill-opacity=\"0.12\" stroke=\"var(--fig-accent2)\" stroke-width=\"2\" stroke-dasharray=\"8 5\"/>\n  <text x=\"414\" y=\"148\" font-size=\"14\" fill=\"var(--fig-accent2)\">\"use client\" 경계 아래 = 클라이언트 번들<\/text>\n  <rect x=\"460\" y=\"160\" width=\"160\" height=\"44\" rx=\"8\" fill=\"var(--fig-bg)\" stroke=\"var(--fig-accent2)\" stroke-width=\"2\"/>\n  <text x=\"540\" y=\"187\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">FilterPanel<\/text>\n  <rect x=\"420\" y=\"250\" width=\"120\" height=\"44\" rx=\"8\" fill=\"var(--fig-bg)\" stroke=\"var(--fig-accent2)\" stroke-width=\"2\"/>\n  <text x=\"480\" y=\"277\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Button<\/text>\n  <rect x=\"560\" y=\"250\" width=\"110\" height=\"44\" rx=\"8\" fill=\"var(--fig-bg)\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"615\" y=\"270\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">{children}<\/text>\n  <text x=\"615\" y=\"286\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-accent)\">서버 렌더 결과<\/text>\n  <rect x=\"60\" y=\"230\" width=\"220\" height=\"44\" rx=\"8\" fill=\"var(--fig-bg)\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"170\" y=\"257\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">List (서버에서 데이터 조회)<\/text>\n  <line x1=\"330\" y1=\"104\" x2=\"190\" y2=\"138\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <line x1=\"390\" y1=\"104\" x2=\"520\" y2=\"158\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <line x1=\"170\" y1=\"184\" x2=\"170\" y2=\"228\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <line x1=\"520\" y1=\"204\" x2=\"485\" y2=\"248\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <line x1=\"560\" y1=\"204\" x2=\"610\" y2=\"248\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <text x=\"300\" y=\"130\" font-size=\"13\" fill=\"var(--fig-muted)\">props: 직렬화 가능한 값만<\/text>\n  <text x=\"60\" y=\"310\" font-size=\"13\" fill=\"var(--fig-muted)\">일반 함수·클래스 인스턴스는 경계를 못 넘음<\/text>\n<\/svg>\n<figcaption>\"use client\"는 import 그래프에 긋는 선이다. 서버 UI는 import가 아니라 children 슬롯으로 클라이언트 안에 꽂힌다.<\/figcaption>\n<\/figure>\n\n### 스트리밍·loading.tsx·Suspense (Streaming)\n\n- <strong>뭐야:<\/strong> 스트리밍은 준비된 HTML부터 먼저 보내고, Suspense 경계 안의 느린 부분은 fallback을 보냈다가 완료되면 같은 응답으로 이어서 보내는 방식이다. `loading.tsx`는 페이지를 Suspense로 감싸 주는 파일 규약이다\n- <strong>왜:<\/strong> 없으면 SSR이 가장 느린 조각을 기다린다. 페이지에 느린 API 하나(3초)와 빠른 API 여러 개가 섞여 있으면 화면 전체가 3초간 하얗게 비어 있게 된다\n- <strong>어떻게:<\/strong>\n  - 전통 SSR은 <strong>모든 데이터 → 전체 HTML → 전송 → 전체 하이드레이션<\/strong> 순차라 가장 느린 조각이 전체를 막는다\n  - 스트리밍: 준비된 부분 HTML을 먼저 보내고, `<Suspense>` 경계 안의 느린 부분은 fallback을 보냈다가 <strong>완료되면 같은 응답 스트림으로 이어서<\/strong> 보낸다\n  - `loading.tsx`: 같은 폴더의 `page`(와 하위 레이아웃·`not-found`)를 Suspense로 감싸는 파일 규약. 같은 세그먼트의 `layout`·`template`·`error`는 감싸지 않는다\n  - 세밀한 제어는 컴포넌트 단위 `<Suspense>`로 느린 위젯만 감싼다\n  - <strong>독립 요청은 병렬<\/strong>로. 순차 `await`하면 서버에서도 워터폴이 생긴다\n- <strong>핵심:<\/strong> 스트리밍은 <strong>Suspense 경계 = 전송 단위<\/strong>. 느린 조각을 <strong>경계로 격리<\/strong>하면 첫 화면이 가장 느린 API에 묶이지 않는다\n- <strong>꼬리질문:<\/strong>\n  - \"스트리밍 중에 404나 리다이렉트를 하면요?\" → 헤더가 이미 나가서 상태 코드는 200으로 고정된다. `notFound()`면 스트림 안에 `noindex` 메타를 넣어 색인은 막지만, 진짜 404 상태가 필요하면 Suspense 경계와 suspend되는 `await` 전에, 또는 proxy에서 판정한다\n  - \"레이아웃에서 `cookies()`를 읽으면 loading.tsx가 왜 안 보이죠?\" → loading은 레이아웃 아래에 있어서 레이아웃 자체의 요청 시점 데이터 대기는 못 덮는다. 그 부분을 별도 `<Suspense>`로 감싸거나 page로 내린다\n- <strong>출처:<\/strong> [loading.js](https://nextjs.org/docs/app/api-reference/file-conventions/loading) · [loading.js — Status Codes](https://nextjs.org/docs/app/api-reference/file-conventions/loading#status-codes)\n\n### 라우트 세그먼트와 레이아웃 유지 (Route Segments & Layouts)\n\n- <strong>뭐야:<\/strong> App Router에서는 폴더 하나가 URL 조각(세그먼트) 하나이고, 그 안의 `layout`·`page` 같은 특수 파일이 동작을 정한다. <strong>레이아웃<\/strong>은 이동해도 다시 렌더되지 않고 유지되며, 바뀐 세그먼트의 페이지만 교체된다\n- <strong>왜:<\/strong> 이 규칙을 모르면 탭 이동마다 사이드바의 스크롤 위치·열림 상태가 초기화되거나, 반대로 페이지를 옮겨도 이전 폼 상태가 남아 있어 당황한다\n- <strong>어떻게:<\/strong>\n  - 폴더 = URL 세그먼트. `layout`·`page`·`loading`·`error`·`not-found`·`template` 특수 파일로 동작을 정한다\n  - <strong>레이아웃은 내비게이션 간 다시 렌더되지 않는다<\/strong>. 바뀐 세그먼트만 렌더(partial rendering)하고 레이아웃의 state는 유지. 그래서 레이아웃은 `searchParams`·pathname을 받지 못한다(받으면 낡은 값이 된다)\n  - 매번 새로 마운트돼야 하면 <strong>`template.tsx`<\/strong>: 세그먼트마다 고유 key가 붙어 해당 세그먼트(동적 params 포함)가 바뀌면 리마운트. searchParams 변화로는 리마운트되지 않는다\n  - `error.tsx`는 세그먼트 단위 에러 바운더리(클라이언트 컴포넌트 필수). 같은 레벨 `layout`·`template`의 에러는 못 잡고 상위가 잡는다. 루트 레이아웃 에러는 `global-error.tsx`. 주의: 16.3에서 데이터까지 다시 가져오는 `retry` prop이 stable(기존 `reset`은 클라이언트 상태만 재시도)\n  - `(group)`은 URL 없이 레이아웃만 나누고, `_folder`는 라우팅 제외 비공개 폴더\n- <strong>핵심:<\/strong> <strong>레이아웃은 유지, 페이지는 교체<\/strong>. 리셋이 필요하면 <strong>template<\/strong> 또는 <strong>key<\/strong>. 에러·로딩도 <strong>세그먼트 단위<\/strong>로 격리된다\n- <strong>꼬리질문:<\/strong>\n  - \"레이아웃에서 경로에 따라 다르게 그리려면?\" → `usePathname`·`useSelectedLayoutSegment`를 쓰는 클라이언트 컴포넌트로 분리하거나, 경로별 데이터는 page에서 받는다\n  - \"레이아웃에서 인증 체크만 하면 충분한가요?\" → 레이아웃은 하위 이동 시 다시 실행되지 않고, 서버 액션·Route Handler는 레이아웃을 거치지 않는다. 데이터를 읽는 곳(페이지·데이터 함수·액션)에서도 확인한다\n- <strong>출처:<\/strong> [layout.js — Caveats](https://nextjs.org/docs/app/api-reference/file-conventions/layout#caveats) · [template.js](https://nextjs.org/docs/app/api-reference/file-conventions/template) · [error.js](https://nextjs.org/docs/app/api-reference/file-conventions/error)\n\n### 병렬 라우트와 인터셉트 라우트 (Parallel & Intercepting Routes)\n\n- <strong>뭐야:<\/strong> 병렬 라우트는 한 레이아웃 안에 `@slot` 폴더로 독립된 화면 칸을 여러 개 두는 것이고, 인터셉트 라우트는 링크로 이동할 때 다른 경로를 현재 화면 맥락(예: 모달)에 띄우는 것이다\n- <strong>왜:<\/strong> 사진을 누르면 모달로 열리되 URL은 공유 가능하고, 새로고침하면 상세 페이지가 뜨고, 뒤로 가기로 모달만 닫혀야 하는 요구를 맞추려면 필요하다. 대시보드 패널마다 로딩·에러를 따로 둘 때도 쓴다\n- <strong>어떻게:<\/strong>\n  - <strong>병렬 라우트<\/strong>: `@slot` 폴더가 부모 레이아웃의 prop으로 들어간다(`children`도 암묵적 슬롯). 슬롯은 URL 세그먼트가 아니고, 슬롯마다 loading·error를 따로 둔다\n  - 소프트 내비게이션에선 매칭 안 된 슬롯이 이전 화면을 유지하고, 새로고침(하드 내비게이션)에선 `default.js`를 그린다. 없으면 404. 주의: 16부터 모든 슬롯에 `default.js`가 없으면 빌드 실패\n  - <strong>인터셉트 라우트<\/strong>: `(.)`·`(..)`·`(..)(..)`·`(...)`로 다른 경로를 현재 레이아웃 안에 띄운다. 기준은 파일 시스템이 아니라 <strong>라우트 세그먼트<\/strong>(`@slot`은 세지 않음)\n  - 둘을 합치면 모달 패턴: 링크 클릭은 `@modal/(.)photo/[id]`로 가로채 모달, 직접 접속·새로고침은 실제 `/photo/[id]` 페이지\n- <strong>핵심:<\/strong> 병렬 라우트 = <strong>한 레이아웃 안의 독립 슬롯<\/strong>, 인터셉트 = <strong>소프트 내비게이션일 때만 다른 경로를 현재 맥락에 띄우기<\/strong>. 하드 내비게이션에선 원래 페이지\n- <strong>꼬리질문:<\/strong>\n  - \"역할별 슬롯을 레이아웃에서 골라 보여주면 권한 처리가 끝나나요?\" → 아니다. 문서에 따르면 고르지 않은 슬롯도 서버에서 렌더되고 결과가 응답에 포함된다. 슬롯 페이지나 데이터 계층에서 따로 인가한다\n  - \"모달이 다른 페이지로 가도 안 닫혀요\" → 소프트 내비게이션에서 매칭 안 된 슬롯은 유지되기 때문이다. `null`을 반환하는 `page`나 catch-all 슬롯을 둬서 닫는다\n- <strong>출처:<\/strong> [Parallel Routes](https://nextjs.org/docs/app/api-reference/file-conventions/parallel-routes) · [Intercepting Routes](https://nextjs.org/docs/app/api-reference/file-conventions/intercepting-routes)\n\n> 한 줄 정리: 서버 컴포넌트가 기본, \"use client\"는 import 그래프의 경계, Suspense 경계가 스트리밍 단위, 레이아웃은 유지되고 슬롯·인터셉트로 경로를 겹친다.\n\n## 3. 데이터와 변경\n\n### 데이터 페칭과 캐싱 계층 (Data Fetching & Caching Layers)\n\n- <strong>뭐야:<\/strong> Next.js는 같은 데이터를 다시 만들지 않으려고 여러 층에 캐시를 둔다(15 문서 기준). 렌더 1회 안의 중복 제거(Request Memoization), 서버 영속 저장(Data Cache), 렌더 결과 저장(Full Route Cache), 브라우저 메모리(Router Cache)가 각각 수명과 무효화 방법이 다르다\n- <strong>왜:<\/strong> 계층을 구분 못 하면 데이터를 수정했는데 새로고침해도 옛 값이 보일 때 어디를 비워야 할지 모른다. 같은 데이터를 레이아웃·페이지·컴포넌트가 각각 요청해 중복 호출되는 것처럼 보일 때도 판단이 안 된다\n- <strong>어떻게:<\/strong> (주의: 15 문서 기준 네 겹. 16의 Cache Components를 켜면 `\"use cache\"` 모델로 바뀐다)\n  - <strong>Request Memoization<\/strong>: 한 번의 서버 렌더 안에서 같은 URL·옵션의 `fetch`(GET·HEAD)를 한 번만 실행. React 기능이고 React 트리(레이아웃·페이지·`generateMetadata` 등)에만 적용, Route Handler에는 안 된다. DB 호출은 React `cache()`로 같은 효과\n  - <strong>Data Cache<\/strong>: 서버에 `fetch` 결과를 <strong>요청·배포를 넘어<\/strong> 저장. `revalidate`(시간)·`revalidateTag`/`revalidatePath`(on-demand)로 무효화\n  - <strong>Full Route Cache<\/strong>: 정적 라우트의 렌더 결과(HTML + RSC Payload)를 빌드·재검증 시 저장. 재배포하면 비워진다\n  - <strong>Router Cache<\/strong>: 브라우저 메모리에 방문·prefetch한 세그먼트의 RSC Payload를 저장. 뒤로 가기·재방문이 빠른 이유이자, 서버를 바꿔도 화면이 안 바뀌는 이유. `router.refresh()`로 갱신\n  - 클라이언트 서버 상태 캐시(TanStack Query)는 이것과 <strong>별개 계층<\/strong>이다. 둘 다 쓰면 무효화를 양쪽에서 해야 한다\n- <strong>핵심:<\/strong> \"옛 값이 보인다\"면 <strong>어느 계층의 캐시인지<\/strong>부터 가른다. 렌더 1회(<strong>Memoization<\/strong>) · 서버 영속(<strong>Data Cache<\/strong>) · 빌드 산출물(<strong>Full Route<\/strong>) · 브라우저(<strong>Router Cache<\/strong>)\n- <strong>꼬리질문:<\/strong>\n  - \"변경 후 화면이 안 바뀌면 어디를 보나요?\" → 서버 액션이면 `revalidatePath`/`revalidateTag`를 불렀는지(Route Handler에서 부르면 Router Cache는 즉시 안 비워진다), 클라이언트에서 바꿨다면 `router.refresh()`가 필요한지, TanStack Query를 쓰면 그쪽 무효화도 했는지 순서로 본다\n  - \"TanStack Query와 Next 캐시를 같이 쓰면 대가는?\" → 같은 데이터의 진실이 두 군데 생긴다. 로그인 뒤 화면은 클라이언트 캐시로, Next 캐시는 공용·정적 데이터로 역할을 나눈다\n- <strong>출처:<\/strong> [Caching (v15 문서)](https://nextjs.org/docs/15/app/guides/caching) · [Caching (Previous Model)](https://nextjs.org/docs/app/guides/caching-without-cache-components)\n\n### 버전별 캐싱 기본값 변화 (Caching Defaults by Version)\n\n- <strong>뭐야:<\/strong> Next.js가 `fetch`·Route Handler·내비게이션을 기본으로 캐시하느냐가 버전마다 달라진 흐름이다. 13~14는 암묵적 캐시, 15는 기본 비캐시, 16은 Cache Components를 켜면 `\"use cache\"`로 명시적으로 켜는 방식이다(안 켜면 15와 같은 기본값)\n- <strong>왜:<\/strong> 같은 코드가 버전에 따라 반대로 동작해서, 예제 코드대로 했는데 캐시가 안 되거나 반대로 너무 오래 남는다\n- <strong>어떻게:<\/strong>\n  - 주의: <strong>Next.js 13~14<\/strong>: `fetch`가 기본으로 Data Cache에 저장되고(`force-cache` 기본), GET Route Handler도 `Request` 객체·동적 함수·동적 세그먼트 설정을 안 쓰면 기본 캐시(14.2 문서 [Caching](https://nextjs.org/docs/14/app/building-your-application/caching)·[Route Handlers](https://nextjs.org/docs/14/app/building-your-application/routing/route-handlers)에서 확인, 13은 버전 문서를 직접 확인 못 했고 15 블로그의 \"App Router는 캐시 기본값으로 출시\" 서술 기준). 캐시를 원치 않으면 `cache: 'no-store'`나 `revalidate: 0`을 명시해야 했다 → \"왜 갱신이 안 되나\" 혼란의 주원인\n  - 주의: <strong>Next.js 15(2024-10)<\/strong>: `fetch`·GET Route Handler·클라이언트 내비게이션 <strong>기본 비캐시<\/strong>. Router Cache의 페이지 세그먼트 staleTime 기본 0(공유 레이아웃은 재요청 안 함, 뒤로/앞으로 가기는 캐시 복원, `loading`은 5분 유지). 캐시하려면 `cache: 'force-cache'` 명시. `params`·`searchParams`·`cookies()`·`headers()`·`draftMode()`가 <strong>비동기(Promise)<\/strong>로 바뀜(동기 접근은 경고와 함께 임시 허용)\n  - 주의: <strong>Next.js 16(2025-10)<\/strong>: `cacheComponents: true`를 켜면 <strong>Cache Components<\/strong> 모델. `\"use cache\"`로 페이지·컴포넌트·함수를 <strong>명시적으로 opt-in 캐시<\/strong>하고, 나머지 동적 코드는 요청 시 실행. `revalidateTag(tag, profile)`에 `cacheLife` 프로필 두 번째 인자(한 인자 형태는 deprecated), 서버 액션 전용 `updateTag`(쓴 직후 최신 읽기)·`refresh`(캐시 안 된 데이터만 갱신) 추가. 동기 `params`·`cookies()` 접근 <strong>제거<\/strong>\n  - 주의: 16.3: \"기본은 동적, 숨은 캐시 없음\" 방향의 Instant Navigations·Partial Prefetching이 opt-in으로 추가\n- <strong>핵심:<\/strong> 흐름은 <strong>암묵적 캐시(13~14) → 기본 비캐시(15) → 명시적 opt-in \"use cache\"(16)<\/strong>. 캐시 질문엔 <strong>버전부터<\/strong> 확인\n- <strong>꼬리질문:<\/strong>\n  - \"왜 기본값을 뒤집었나요?\" → 15는 피드백으로 캐싱 휴리스틱을 재평가했다고 했고, 16은 동적 코드를 요청 시 실행하는 게 개발자 기대에 맞는다고 설명한다\n  - \"업그레이드 때 먼저 볼 건?\" → 캐시를 기대하던 fetch가 매 요청 실행돼 백엔드 부하가 늘지 않는지, 동기 `params` 접근이 남았는지(codemod 제공)\n- <strong>출처:<\/strong> [Next.js 15 — Caching](https://nextjs.org/blog/next-15#caching-semantics) · [Next.js 16](https://nextjs.org/blog/next-16) · [Next.js 16.3](https://nextjs.org/blog/next-16-3)\n\n### 서버 액션 (Server Actions / Server Functions)\n\n- <strong>뭐야:<\/strong> 서버 액션은 `\"use server\"` 함수를 클라이언트에서 일반 함수처럼 부르면 POST 요청으로 서버에서 실행되게 하는 기능이다. 주로 폼 저장 같은 데이터 변경에 쓴다\n- <strong>왜:<\/strong> 없으면 폼 하나 저장하려고 Route Handler 만들고, 클라이언트에서 fetch하고, 성공 후 캐시 무효화까지 세 군데를 오가야 한다\n- <strong>어떻게:<\/strong>\n  - `\"use server\"` 함수(Server Function)를 클라이언트에서 호출하면 <strong>POST 요청<\/strong>으로 서버에서 실행된다. 변경 용도로 쓰면 Server Action이라 부른다. 서버 컴포넌트의 `<form action>`은 JS 로드 전에도 제출되고(점진적 향상), 클라이언트 컴포넌트 폼은 하이드레이션 전 제출을 큐에 쌓는다\n  - 액션 안에서 DB 변경 후 `revalidatePath`·`revalidateTag`(주의: 16은 `updateTag`·`refresh`도)를 부르면 <strong>한 번의 왕복<\/strong>으로 화면까지 갱신\n  - 주의: 13.4 alpha → 14에서 stable. 15부터 안 쓰는 액션은 빌드에서 제거되고 ID가 추측 불가능하게 생성돼 빌드마다 바뀐다. 클로저로 잡은 값은 자동 암호화된다(멀티 인스턴스면 `NEXT_SERVER_ACTIONS_ENCRYPTION_KEY`로 키 통일)\n  - <strong>보안<\/strong>: 액션은 사실상 <strong>공개 POST 엔드포인트<\/strong>다. 페이지에서 한 인증은 액션까지 이어지지 않으니 <strong>액션 안에서 인증·권한(소유권)·입력 검증<\/strong>을 하고, 반환값은 UI에 필요한 것만. Origin과 Host를 비교해 다른 호스트 호출은 막는다(CSRF 완화)\n- <strong>핵심:<\/strong> 서버 액션 = <strong>RPC처럼 쓰는 POST 엔드포인트<\/strong>. 장점은 <strong>변경 + 재검증 + 화면 갱신을 한 왕복<\/strong>, 의무는 <strong>액션 내부 인가·검증<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"목록 조회에도 서버 액션을 쓰면요?\" → 변경용 설계라 현재 클라이언트가 하나씩 순서대로 보낸다(문서상 구현 세부). 병렬 조회는 서버 컴포넌트나 Route Handler로\n  - \"별도 백엔드가 있는데도 쓸 이유가 있나요?\" → 토큰을 서버에만 두는 BFF로는 유용하지만, 이미 백엔드 직통 + TanStack Query로 일관됐다면 섞는 비용(무효화 이원화)이 더 클 수 있다\n- <strong>출처:<\/strong> [Mutating Data](https://nextjs.org/docs/app/getting-started/mutating-data) · [Data Security — Mutating](https://nextjs.org/docs/app/guides/data-security#mutating-data) · [Next.js 14](https://nextjs.org/blog/next-14#server-actions-stable)\n\n### Route Handler (route.ts)\n\n- <strong>뭐야:<\/strong> Route Handler는 `app/**/route.ts`에서 `GET`·`POST` 같은 HTTP 메서드 함수를 export해 만드는 API 엔드포인트다. 화면이 아니라 웹 표준 `Request`/`Response`로 응답한다\n- <strong>왜:<\/strong> 웹훅·외부 콜백·RSS처럼 UI가 아닌 응답이나 앱(웹뷰)이 호출할 HTTP API가 필요할 때 쓸 자리가 있어야 한다. \"서버 액션 두고 왜 Route Handler냐\"는 질문도 여기서 나온다\n- <strong>어떻게:<\/strong>\n  - `app/**/route.ts`에서 `GET`·`POST`·`PUT`·`PATCH`·`DELETE`·`HEAD`·`OPTIONS`를 export. 웹 표준 `Request`/`Response`(+`NextRequest`) 기반. Pages Router의 API Routes에 해당\n  - 레이아웃·클라이언트 내비게이션에 참여하지 않는 가장 낮은 수준의 라우트. <strong>같은 세그먼트에 `page`와 공존할 수 없다<\/strong>(`app/route.ts` + `app/page.tsx` 충돌)\n  - 캐시: 주의: 15부터 GET도 기본 비캐시, `dynamic = 'force-static'`으로 opt-in(POST 등은 캐시 안 됨). 16 Cache Components에선 페이지처럼 사전 렌더되거나 `\"use cache\"` 헬퍼로 캐시\n- <strong>핵심:<\/strong> <strong>UI 밖의 HTTP 계약<\/strong>이 필요하면 Route Handler, <strong>내 앱 UI의 변경<\/strong>이면 서버 액션, <strong>조회 렌더<\/strong>면 서버 컴포넌트\n- <strong>꼬리질문:<\/strong>\n  - \"서버 컴포넌트에서 내 Route Handler를 fetch하면요?\" → 같은 서버 안에서 HTTP 왕복을 한 번 더 하는 셈이다. 서버 컴포넌트는 데이터 함수를 직접 부르고, Route Handler는 외부 호출자용으로 둔다\n  - \"Route Handler에서 revalidateTag하면 화면도 바로 바뀌나요?\" → Data Cache는 무효화되지만 특정 라우트에 묶여 있지 않아 사용자의 Router Cache는 즉시 비워지지 않는다\n- <strong>출처:<\/strong> [Route Handlers](https://nextjs.org/docs/app/getting-started/route-handlers) · [route.js](https://nextjs.org/docs/app/api-reference/file-conventions/route)\n\n> 한 줄 정리: 캐시는 \"어느 계층, 어느 버전\"부터 말하고, 서버 액션은 공개 POST라 인가를 안에서, UI 밖 HTTP 계약은 Route Handler로.\n\n## 4. 라우팅과 요청 경계\n\n### 미들웨어와 인증 리다이렉트 (Middleware / Proxy)\n\n- <strong>뭐야:<\/strong> 미들웨어(16부터 proxy)는 페이지가 렌더되기 전에 요청을 가로채 리다이렉트·rewrite·헤더·쿠키를 처리하는 관문이다\n- <strong>왜:<\/strong> 인증 확인을 클라이언트에서 화면을 그린 뒤에 하면 로그인 안 한 사용자에게 보호된 화면이 잠깐 보였다가 튕긴다. 판정 기준이 흩어지면 리다이렉트가 서로를 불러 무한 루프에 빠진다\n- <strong>어떻게:<\/strong>\n  - 미들웨어(16: proxy)는 <strong>렌더 전에<\/strong> 요청을 가로채 redirect·rewrite·헤더·쿠키를 다룬다. matcher가 없으면 정적 파일·이미지 요청까지 전부 지나가니 `matcher`로 좁힌다\n  - 인증 패턴: 쿠키의 세션·토큰 존재와 만료만 <strong>가볍게<\/strong> 확인 → 없으면 로그인으로 redirect(원래 경로를 쿼리로 보존). 무거운 DB 조회는 피한다\n  - 무한 루프 방지: 로그인 페이지·공개 경로를 matcher에서 빼거나 분기에서 먼저 통과시킨다. 서로 다른 두 판정이 반대 방향으로 리다이렉트하지 않게 판정 기준을 하나로\n  - 주의: 런타임: 원래 Edge 전용 → 15.2 Node.js 런타임 experimental → <strong>15.5 stable<\/strong> → <strong>16에서 `middleware.ts`가 deprecated되고 `proxy.ts`로 이름이 바뀜<\/strong>. proxy는 Node.js 런타임 고정(`runtime` 설정 시 에러), Edge가 필요하면 deprecated된 `middleware.ts`를 당분간 쓸 수 있다\n  - 주의: CVE-2025-29927: 내부 헤더 `x-middleware-subrequest`를 위조해 미들웨어를 통째로 건너뛰는 취약점. 2025년 3월 패치(15.2.3·14.2.25·13.5.9·12.3.5), `next start`·standalone 셀프 호스팅이 영향, Vercel·Netlify 호스팅은 비해당. 미들웨어를 <strong>유일한 인가 지점으로 두면 안 된다<\/strong>는 근거\n- <strong>핵심:<\/strong> 미들웨어는 <strong>빠른 1차 관문(낙관적 체크)<\/strong>. 실제 인가는 <strong>데이터에 가까운 곳(서버 컴포넌트·액션·API)<\/strong>에서 다시. 리다이렉트 판정은 <strong>기준 하나로<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"미들웨어에서 토큰 갱신까지 하면요?\" → 매칭되는 모든 요청에서 실행되니 동시 갱신 경합과 지연이 생긴다. 갱신은 한 곳에서 single-flight로 묶는 게 안전하다\n  - \"matcher로 경로를 뺐는데 그 페이지의 서버 액션은요?\" → 서버 액션은 그 페이지 경로로 가는 POST라 같이 빠진다. 문서도 액션마다 인증을 다시 하라고 한다\n  - \"왜 이름을 proxy로 바꿨나요?\" → Express 미들웨어와 혼동돼 남용되는 걸 막고, 앱 앞단 네트워크 경계라는 성격을 드러내려는 것. 문서는 다른 방법이 없을 때의 최후 수단으로 쓰라고 한다\n- <strong>출처:<\/strong> [proxy.js](https://nextjs.org/docs/app/api-reference/file-conventions/proxy) · [Next.js 15.5 — Node 미들웨어](https://nextjs.org/blog/next-15-5#nodejs-middleware-stable) · [미들웨어 우회 postmortem](https://vercel.com/blog/postmortem-on-next-js-middleware-bypass)\n\n### 동적 라우트와 params (Dynamic Routes & params)\n\n- <strong>뭐야:<\/strong> 동적 라우트는 `[id]`처럼 대괄호 폴더로 URL의 일부를 변수로 받는 라우트이고, params는 그 값을 페이지에 넘겨주는 객체다. 필터 같은 쿼리 문자열 값은 searchParams로 받는다\n- <strong>왜:<\/strong> 다루는 법을 모르면 `/posts/[id]`에서 존재하지 않는 id가 빈 화면으로 뜨거나, 15로 올린 뒤 `params.id` 접근에서 경고가 난다. 필터 상태를 URL에 두지 않으면 새로고침·공유할 때 날아간다\n- <strong>어떻게:<\/strong>\n  - `[id]` 단일, `[...slug]` catch-all, `[[...slug]]` optional catch-all\n  - `generateStaticParams`로 빌드 시 미리 만들 경로 목록을 반환(SSG). 목록에 없는 경로는 `dynamicParams`(기본 true)면 첫 방문 때 생성, false면 404. 주의: 16 Cache Components에선 최소 1개를 반환해야 빌드된다\n  - 주의: Next.js 15부터 페이지·레이아웃의 `params`·`searchParams`는 <strong>Promise<\/strong> → `const { id } = await params`. 클라이언트 컴포넌트에선 `use(params)` 또는 `useParams()`. 16에서 동기 접근 제거\n  - 없는 리소스는 `notFound()`로 `not-found.tsx`를 띄운다. URL 이전은 `redirect()`·`permanentRedirect()` 또는 `next.config`의 `redirects`\n  - 필터·페이지 번호 같은 <strong>공유 가능한 UI 상태는 searchParams<\/strong>에 둔다(새로고침·뒤로 가기·링크 공유 유지)\n- <strong>핵심:<\/strong> 경로 정보는 <strong>params(경로)<\/strong>, 화면 상태는 <strong>searchParams(쿼리)<\/strong>. 주의: 15부터 <strong>await<\/strong>. 사전 생성은 <strong>generateStaticParams<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"searchParams를 읽으면 렌더링 방식이 어떻게 되나요?\" → 요청마다 값이 다르니 해당 라우트는 동적 렌더가 된다. 정적으로 두고 싶으면 클라이언트 컴포넌트에서 `useSearchParams`로 읽고 Suspense로 감싼다\n  - \"하위 컴포넌트가 useParams를 직접 부르면요?\" → 특정 라우트 구조에 묶여 재사용이 어렵다. 라우트에서 읽어 props로 내린다\n- <strong>출처:<\/strong> [generateStaticParams](https://nextjs.org/docs/app/api-reference/functions/generate-static-params) · [Next.js 15 — Async APIs](https://nextjs.org/blog/next-15#async-request-apis-breaking-change)\n\n### 메타데이터 API와 SEO (Metadata API)\n\n- <strong>뭐야:<\/strong> 메타데이터 API는 페이지의 title·설명·OG 태그를 `metadata` 객체나 `generateMetadata` 함수로 선언하면 Next.js가 `<head>`에 넣어 주는 기능이다. 세그먼트별로 선언한 값은 위에서 아래로 병합된다\n- <strong>왜:<\/strong> 없으면 공유 링크 미리보기(OG)가 모든 페이지에서 똑같거나, 루트 레이아웃에 `<head>`를 직접 넣어 중복 태그가 생긴다. \"`generateMetadata`가 느리면 전체가 늦지 않냐\"는 질문에 답하려면 동작 방식도 알아야 한다\n- <strong>어떻게:<\/strong>\n  - 정적이면 `export const metadata`, 데이터에 따라 바뀌면 `export async function generateMetadata({ params })`. <strong>서버 컴포넌트(layout·page)에서만<\/strong> 가능하고, 루트 레이아웃에 `<head>` 태그를 손으로 넣지 않는다\n  - 세그먼트별 metadata는 위에서 아래로 <strong>얕게 병합<\/strong>되고 같은 키는 덮어쓴다. `title.template`로 \"%s | 서비스명\" 같은 패턴을 상속\n  - `generateMetadata` 안의 `fetch`는 page와 <strong>메모이제이션이 공유<\/strong>돼 같은 요청을 두 번 안 보낸다\n  - 주의: 15.2부터 <strong>스트리밍 메타데이터<\/strong>: 일반 브라우저에는 `generateMetadata`를 기다리지 않고 UI를 먼저 보내고, JS를 못 돌리는 HTML 전용 봇(User-Agent로 판별, `htmlLimitedBots`로 조정)에는 기다렸다가 `<head>`에 넣어 보낸다\n  - `sitemap.ts`·`robots.ts`·`opengraph-image.tsx` 파일 규약으로 SEO 자산 생성(기본 정적)\n- <strong>핵심:<\/strong> 메타데이터는 <strong>서버에서 확정<\/strong>, 세그먼트별 <strong>얕은 병합<\/strong>. 주의: 15.2+는 <strong>봇에만 블로킹, 사람에겐 스트리밍<\/strong>이라 느린 메타데이터가 TTFB를 덜 막는다\n- <strong>꼬리질문:<\/strong>\n  - \"클라이언트 컴포넌트 페이지에서 제목을 바꾸려면?\" → metadata export는 서버 컴포넌트 전용이라 페이지를 서버 컴포넌트로 두고 상호작용 부분만 클라이언트로 내린다. React 19의 `<title>` 컴포넌트도 대안이다\n- <strong>출처:<\/strong> [generateMetadata](https://nextjs.org/docs/app/api-reference/functions/generate-metadata) · [Streaming metadata](https://nextjs.org/docs/app/api-reference/functions/generate-metadata#streaming-metadata)\n\n> 한 줄 정리: proxy는 1차 관문일 뿐 인가는 데이터 가까이서 다시, 화면 상태는 searchParams(15부터 await), 메타데이터는 서버에서 확정해 봇만 기다리게 한다(15.2+).\n\n## 5. 정적 자원 최적화\n\n### 이미지 최적화 (next/image)\n\n- <strong>뭐야:<\/strong> next/image는 이미지 공간을 미리 잡고, 기기에 맞는 크기·포맷을 골라 주고, 기본으로 지연 로딩하는 이미지 컴포넌트다\n- <strong>왜:<\/strong> 이런 처리가 없으면 이미지가 늦게 로드되며 아래 콘텐츠를 밀어내는 레이아웃 이동(CLS)이 생기고, 모바일에 4000px 원본이 그대로 내려가 LCP가 늦어진다\n- <strong>어떻게:<\/strong>\n  - `width`·`height`(또는 `fill` + 부모 크기)로 <strong>공간을 미리 확보<\/strong> → CLS 방지\n  - 요청 기기에 맞춰 <strong>리사이즈·포맷 변환한 이미지를 srcset으로<\/strong> 제공. `fill`·반응형 이미지는 `sizes`를 정확히 줘야 과도한 크기를 안 받는다\n  - 기본 <strong>지연 로딩(`loading=\"lazy\"`)<\/strong>. 첫 화면의 LCP 이미지는 `loading=\"eager\"`나 `fetchPriority=\"high\"`로 먼저 받는다. 주의: 16에서 `priority`는 deprecated, 대신 `preload`(헤드에 `<link>` 삽입)가 생겼지만 문서는 대부분 앞의 두 속성을 권한다\n  - 외부 이미지는 `images.remotePatterns`로 허용 도메인 등록(주의: `images.domains`는 14부터 deprecated)\n  - 주의: Next.js 16 기본값 변경: `minimumCacheTTL` 60초 → 4시간(14400초), `qualities` 기본 `[75]`(다른 값은 가장 가까운 허용값으로 맞춤), `imageSizes`에서 16 제거, 쿼리스트링이 붙은 로컬 이미지는 `images.localPatterns` 필요, 로컬 IP 최적화 기본 차단\n- <strong>핵심:<\/strong> next/image의 세 가지 일: <strong>공간 예약(CLS)<\/strong>, <strong>기기별 크기·포맷(srcset)<\/strong>, <strong>지연 로딩<\/strong>. LCP 이미지는 <strong>eager/high 우선순위<\/strong>, 반응형은 <strong>sizes<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"언제 안 쓰는 게 낫나요?\" → 셀프호스팅 최적화 비용(CPU·캐시)이 부담되거나 이미 CDN 이미지 변환을 쓰면 `unoptimized`나 커스텀 loader로 넘긴다\n  - \"모든 이미지를 우선 로드하면?\" → 우선순위가 의미 없어지고 첫 화면 대역폭을 나눠 먹어 오히려 LCP가 늦어진다. 문서도 뷰포트마다 LCP 후보가 여럿이면 preload를 쓰지 말라고 한다\n- <strong>출처:<\/strong> [Image Component](https://nextjs.org/docs/app/api-reference/components/image) · [Next.js 16 — 기본값 변경](https://nextjs.org/blog/next-16#behavior-changes)\n\n### 폰트 최적화 (next/font)\n\n- <strong>뭐야:<\/strong> next/font는 빌드 때 폰트 파일을 받아 자기 도메인에서 서빙(셀프 호스팅)하고, 메트릭을 맞춘 대체 폰트를 만들어 주는 폰트 로더다\n- <strong>왜:<\/strong> 없으면 웹폰트가 늦게 와서 글자가 안 보이다 뜨거나(FOIT), 대체 폰트에서 웹폰트로 바뀌며 줄바꿈이 달라져 레이아웃이 흔들린다(FOUT·CLS). 외부 폰트 CDN 요청이 첫 화면을 막기도 한다\n- <strong>어떻게:<\/strong>\n  - `next/font/google`·`next/font/local`은 <strong>빌드 시 폰트 파일을 받아 자기 도메인에서 셀프 호스팅<\/strong>한다. 브라우저가 Google로 요청을 보내지 않는다\n  - `adjustFontFallback`(기본 켜짐)이 메트릭을 맞춘 대체 폰트를 자동 생성해 교체 시 <strong>레이아웃 이동을 줄인다<\/strong>. `display` 기본값은 `swap`\n  - `subsets`로 프리로드할 글리프 범위를 정하고, 가변 폰트면 파일 하나로 여러 굵기. 프리로드는 그 폰트를 쓰는 라우트(페이지·레이아웃 범위)에만 붙는다\n  - className·CSS 변수로 받아 레이아웃에서 적용(Tailwind 테마 변수와 연결)\n- <strong>핵심:<\/strong> next/font = <strong>셀프 호스팅 + 메트릭 보정 + 서브셋<\/strong>. 목표는 <strong>외부 요청 제거와 CLS 감소<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"시스템 폰트면 다 해결 아닌가요?\" → 성능은 최고지만 OS별 글리프가 달라 기호·디자인이 깨질 수 있다. 일관성이 필요하면 셀프 호스팅 웹폰트\n- <strong>출처:<\/strong> [Font Module](https://nextjs.org/docs/app/api-reference/components/font)\n\n> 한 줄 정리: next/image는 공간 예약·기기별 크기·지연 로딩, next/font는 셀프 호스팅·메트릭 보정으로 CLS와 외부 요청을 줄인다.\n\n## 6. 배포와 런타임\n\n### 환경 변수와 NEXT_PUBLIC 빌드 시 인라인 (Environment Variables)\n\n- <strong>뭐야:<\/strong> Next.js 환경 변수 중 `NEXT_PUBLIC_`이 붙은 것은 `next build` 때 값으로 바뀌어(inline) 클라이언트 JS에 박히고, 안 붙은 것은 서버에서만 읽힌다\n- <strong>왜:<\/strong> 모르면 도커 이미지 하나를 dev·운영에 같이 쓰려고 런타임에 `NEXT_PUBLIC_API_URL`만 바꿨는데 브라우저는 여전히 빌드 때 값을 쓴다. 비밀키에 `NEXT_PUBLIC_`을 붙여 클라이언트 번들에 노출하기도 한다\n- <strong>어떻게:<\/strong>\n  - `NEXT_PUBLIC_` 접두사 변수는 <strong>`next build` 시점에 값으로 치환(inline)<\/strong>돼 클라이언트 JS에 박힌다. 빌드 후 환경을 바꿔도 반영 안 된다\n  - 접두사 없는 변수는 <strong>서버에서만<\/strong> 읽힌다. 클라이언트 번들에선 빈 문자열로 치환된다\n  - 동적 접근(`process.env[name]`, `const env = process.env; env.X`)은 치환되지 않는다. `process.env.NEXT_PUBLIC_X`처럼 정적으로 쓴다\n  - 조회 순서(먼저 찾으면 멈춤): `process.env` > `.env.$(NODE_ENV).local` > `.env.local` > `.env.$(NODE_ENV)` > `.env`. `NODE_ENV=test`면 `.env.local`을 읽지 않는다\n  - 한 이미지로 여러 환경을 쓰려면: 동적 렌더(`connection()`·`cookies()` 등 이후) 중 서버에서 런타임 env를 읽어 내려주거나, 환경별로 따로 빌드한다. 주의: `publicRuntimeConfig`·`serverRuntimeConfig`는 16에서 제거\n- <strong>핵심:<\/strong> `NEXT_PUBLIC_` = <strong>빌드 타임 상수 + 공개 정보<\/strong>. 런타임에 바뀌어야 하거나 비밀이면 <strong>서버에서만<\/strong> 읽는다\n- <strong>꼬리질문:<\/strong>\n  - \"`.env`에 비밀키를 커밋하면?\" → 번들엔 안 들어가도 저장소 히스토리에 남는다. 지워도 남으니 키를 교체(rotate)하고, 비밀은 배포 환경 시크릿 저장소로\n  - \"환경별 빌드의 대가는?\" → 같은 코드라도 산출물이 달라 \"dev에서 검증한 빌드 = 운영 빌드\"가 깨진다\n- <strong>출처:<\/strong> [Environment Variables](https://nextjs.org/docs/app/guides/environment-variables)\n\n### 엣지 런타임 vs 노드 런타임 (Edge & Node.js Runtime)\n\n- <strong>뭐야:<\/strong> Next.js 서버 코드가 실행되는 환경이다. Node.js 런타임은 Node API와 npm 생태계를 다 쓰는 기본값이고, Edge 런타임은 웹 표준 API만 있는 가벼운 환경이다\n- <strong>왜:<\/strong> 차이를 모르면 미들웨어나 Route Handler에서 `fs`·Node 전용 SDK를 import했다가 엣지 빌드에서 깨지거나, 엣지로 옮겼는데 DB가 한 리전에 있어 오히려 느려진다\n- <strong>어떻게:<\/strong>\n  - <strong>Node.js 런타임<\/strong>(기본): Node API·npm 생태계 전부 사용 가능. 렌더링에 쓰이는 런타임\n  - <strong>Edge 런타임<\/strong>: 웹 표준 API(`fetch`·`Request`·`Response`·Web Crypto·Streams)만 있는 경량 런타임. 파일 시스템 등 Node 네이티브 API·`require`·`eval` 불가, <strong>ISR 미지원<\/strong>\n  - 주의: 라우트별 `export const runtime = 'edge'`는 <strong>16.3.0(2026-08-03)부터 deprecated<\/strong>(빌드 경고, [PR #93369](https://github.com/vercel/next.js/pull/93369), 16.2.x에는 없음). 문서는 `runtime` export를 지워 기본 `nodejs`로 두라고 안내한다. proxy는 Node 고정이고 Edge는 deprecated된 `middleware.ts`로만 남아 있다\n  - 엣지의 이점은 <strong>데이터도 가까울 때<\/strong>만 크다. 한 리전 DB라면 엣지 → DB 왕복이 길어진다\n  - 셀프 호스팅(도커)은 `output: 'standalone'`으로 필요한 파일만 묶은 Node 서버를 만든다. 이미지 최적화·ISR 캐시는 그 서버 디스크·메모리에 의존하니 여러 인스턴스면 공유 캐시를 따로 설정한다\n- <strong>핵심:<\/strong> 기본이자 사실상 표준은 <strong>Node<\/strong>. 엣지는 <strong>가벼운 요청 가공<\/strong>에만 맞았고 <strong>데이터가 멀면 이점이 사라진다<\/strong>. 주의: 16부터 요청 가로채기(`proxy.ts`)도 Node, 16.3 문서는 라우트 Edge 지정 자체를 deprecated로 표기\n- <strong>꼬리질문:<\/strong>\n  - \"왜 Next 16은 proxy를 Node로 바꿨나요?\" → 공식 설명은 요청 가로채기에 하나의 예측 가능한 런타임을 주기 위해서다. 15.5 블로그는 Edge 전용이던 미들웨어가 Node 전용 라이브러리·API 연동에 제약이 있었다고 설명한다(15.5에서 Node 미들웨어가 먼저 stable)\n  - \"여러 인스턴스로 셀프 호스팅하면 뭐가 깨지나요?\" → 인스턴스마다 Data Cache·ISR 결과가 따로라 on-demand 재검증이 한 인스턴스에만 반영된다. 공유 캐시 핸들러를 설정하고, 서버 액션 암호화 키도 통일한다\n- <strong>출처:<\/strong> [Edge Runtime](https://nextjs.org/docs/app/api-reference/edge) · [runtime 설정](https://nextjs.org/docs/app/api-reference/file-conventions/route-segment-config/runtime) · [Next.js 16 — proxy](https://nextjs.org/blog/next-16#proxyts-formerly-middlewarets)\n\n> 한 줄 정리: NEXT_PUBLIC은 빌드 때 박히는 공개 상수이고, 런타임은 Node가 기본이자 사실상 표준이 됐으며 엣지는 데이터가 가까울 때만 이득이다.\n\n## 핵심 키워드 모음\n\n- <strong>CSR·SSR·SSG·ISR<\/strong>: 사용자별·변경 빈도·SEO로 고름. SSR은 TTFB 비용, ISR은 만료 후 옛 페이지 주고 뒤에서 재생성\n- <strong>하이드레이션<\/strong>: 서버 HTML에 동작 입히기. 비용은 클라이언트 JS 양, 전제는 첫 렌더 일치\n- <strong>하이드레이션 불일치<\/strong>: 시간·랜덤·window 분기·HTML 중첩·iOS 자동 링크. 차이는 마운트 후에\n- <strong>서버 vs 클라이언트 컴포넌트<\/strong>: 기본 서버(번들 0), 잎만 클라이언트. 클라이언트도 SSR된다\n- <strong>\"use client\" 경계<\/strong>: import 그래프의 선. props는 직렬화 가능, 서버 UI는 children으로\n- <strong>스트리밍<\/strong>: Suspense 경계 = 전송 단위, loading.tsx는 page를 감쌈(layout은 아님). 시작 후 상태 코드 200 고정\n- <strong>레이아웃 유지<\/strong>: 레이아웃은 유지(searchParams 못 받음)·페이지는 교체, 리셋은 template 또는 key\n- <strong>병렬·인터셉트 라우트<\/strong>: @slot은 레이아웃 prop, default.js(16 필수), (.)로 소프트 내비게이션만 가로챔\n- <strong>캐싱 계층<\/strong>: Request Memoization · Data Cache · Full Route Cache · Router Cache. 클라이언트 쿼리 캐시는 별개\n- <strong>버전별 캐싱<\/strong>: 13~14 기본 캐시 → 15 기본 비캐시·async params → 16 \"use cache\" opt-in·updateTag·proxy.ts\n- <strong>서버 액션<\/strong>: 공개 POST. 변경+재검증 한 왕복, 인가·검증은 액션 안에서\n- <strong>Route Handler<\/strong>: UI 밖 HTTP 계약용, page와 같은 세그먼트 불가, 15부터 GET도 기본 비캐시\n- <strong>미들웨어(16: proxy)<\/strong>: 렌더 전 1차 관문, proxy는 Node 고정. CVE-2025-29927 이후 인가는 데이터 가까이서 다시\n- <strong>동적 라우트<\/strong>: [id]·[...slug]·[[...slug]], generateStaticParams, 15부터 await params, 화면 상태는 searchParams\n- <strong>메타데이터 API<\/strong>: 서버에서 확정, 세그먼트별 얕은 병합, 15.2+ 봇 외에는 스트리밍\n- <strong>next/image<\/strong>: 공간 예약·srcset·lazy, LCP는 eager/fetchPriority(16 priority deprecated)\n- <strong>next/font<\/strong>: 셀프 호스팅·메트릭 보정·서브셋으로 외부 요청 제거와 CLS 감소\n- <strong>NEXT_PUBLIC<\/strong>: 빌드 시 인라인되는 공개 상수, 동적 접근 불가, 비밀은 서버 전용\n- <strong>Edge vs Node<\/strong>: 기본 Node, 16.3 문서에서 라우트 edge 지정 deprecated, 엣지는 데이터가 멀면 이점 없음\n"}, {"id": "n05", "num": "5", "title": "데이터와 상태 관리", "md": "# 5. 데이터와 상태 관리\n\n<strong>이 파트는 뭐냐:<\/strong> 화면에 보이는 값이 \"어디서 왔고, 언제 낡고, 누가 바꾸는가\"를 다룬다. 서버 상태와 클라이언트 상태를 나누고, 캐시·무효화·경쟁·중복 제출·페이지네이션·URL·폼·워터폴을 같은 원칙으로 묶는다. 한 줄 요약: <strong>원본은 하나, 나머지는 복사본이거나 계산 결과다.<\/strong>\n\n## 1. 상태를 어떻게 나누나\n\n### 서버 상태 vs 클라이언트 상태 (Server State vs Client State)\n\n- <strong>뭐야:<\/strong> 화면이 쓰는 값을 원본이 어디 있느냐로 나눈 것이다. 서버 상태는 서버에 원본이 있고 클라이언트는 <strong>특정 시점의 스냅샷<\/strong>을 빌려 쓰는 값이고, 클라이언트 상태는 모달 열림·입력 중인 값처럼 브라우저에만 있는 값이다.\n- <strong>왜:<\/strong> 둘을 구분하지 않고 API 응답을 `useState`·전역 스토어에 복사하면 다른 화면에서 수정해도 옛값이 남는다. 로딩·에러·재조회·중복 제거도 화면마다 다시 짜게 된다.\n- <strong>어떻게:<\/strong>\n  - 서버 상태: 원본이 서버에 있고, 클라이언트는 <strong>특정 시점의 스냅샷<\/strong>을 빌려 쓴다. 남이 바꿀 수 있고, 시간이 지나면 낡는다\n  - 클라이언트 상태: 원본이 브라우저에 있다. 모달 열림, 입력 중인 값, 선택된 탭 같은 것. 낡지 않는다\n  - 서버 상태는 캐시 라이브러리(TanStack Query, SWR, RTK Query)에, 클라이언트 상태는 `useState`·URL·작은 전역 스토어에 둔다\n  - 판단: \"새로고침하면 서버에서 다시 받아야 하나?\" → 그렇다면 서버 상태\n- <strong>핵심:<\/strong> 서버 상태는 <strong>소유가 아니라 캐시<\/strong>다. 전역 스토어에 API 응답을 복사하는 순간 <strong>동기화 책임<\/strong>이 생긴다.\n- <strong>꼬리질문:<\/strong>\n  - \"서버 상태를 Zustand에 넣으면 안 되나요?\" → 되지만 stale 판정·재조회·중복 제거·GC·무효화를 직접 만들어야 한다.\n  - \"경계가 애매한 경우는요?\" → 편집 중인 폼 값. 초기값은 서버 상태, 편집 시작부터는 클라이언트 상태(초안).\n- <strong>출처:<\/strong> [TanStack — Does this replace client state?](https://tanstack.com/query/v5/docs/framework/react/guides/does-this-replace-client-state)\n\n### 단일 원본 (Single Source of Truth)\n\n- <strong>뭐야:<\/strong> 값 하나마다 진짜 출처를 한 곳만 두고, 나머지는 그 출처를 읽거나 계산만 하는 원칙이다. 캐시·표시용 복사본은 있어도 되지만, 값을 바꿀 수 있고 어긋날 때 기준이 되는 곳은 하나다.\n- <strong>왜:<\/strong> 원본이 여럿이면 같은 숫자가 세 화면에서 다르게 나온다. 서버 값, 클라이언트가 센 값, 다른 API 값이 갈라지고 리포트는 \"가끔 숫자가 안 맞아요\"로 들어온다.\n- <strong>어떻게:<\/strong>\n  - 값마다 <strong>원본 하나<\/strong>를 정하고, 나머지는 그 원본을 읽거나 계산만 한다\n  - 원본이 둘 필요하면(예: 세션 시간과 하루 누적) <strong>이름을 나눠<\/strong> 다른 값으로 취급한다. 같은 이름의 값을 두 군데서 쓰는 게 문제다\n  - 클라이언트가 보간(tick 애니메이션 등)을 하더라도 기준은 서버 값이고, 서버 값이 오면 덮는다\n- <strong>핵심:<\/strong> \"누가 이 값을 <strong>쓸 수 있나<\/strong>\"가 한 곳이어야 한다. 원본이 둘이면 <strong>서로 갈라질 수 있다<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"클라이언트 tick과 서버 값이 다르면 어느 쪽을 믿나요?\" → 서버. 클라이언트 tick은 표시용 보간이고, 서버 값이 도착하면 그 값으로 맞춘다.\n  - \"그 선택의 대가는?\" → 서버 값이 더 작게 오면 숫자가 되감기는 것처럼 보인다. 되감김을 허용할지, 단조 증가만 허용할지 별도 정책이 필요하다.\n- <strong>출처:<\/strong> [react.dev — Choosing the State Structure](https://react.dev/learn/choosing-the-state-structure)\n\n### 파생 상태는 저장하지 않기 (Derived State)\n\n- <strong>뭐야:<\/strong> 다른 상태에서 계산할 수 있는 값(필터된 목록, 합계 등)은 따로 state에 담지 않고 <strong>렌더 중에 계산<\/strong>하자는 원칙이다.\n- <strong>왜:<\/strong> 목록을 `useState`에 받고 필터된 목록을 또 `useState`에 넣어 `useEffect`로 동기화하면, effect가 돌기 전까지 한 번은 옛값으로 렌더되고(화면에 보일 수도 있다), 의존성을 빠뜨리면 어긋난 채로 남는다.\n- <strong>어떻게:<\/strong>\n  - 다른 상태에서 계산 가능한 값은 <strong>렌더 중에 계산<\/strong>한다. 비싸면 `useMemo`\n  - \"props를 state로 복사\"가 대표 안티패턴. 리셋이 필요하면 `key`를 바꿔 컴포넌트를 새로 만든다\n  - 계산이 복잡하면 <strong>순수 함수<\/strong>로 빼서 테스트한다. 입력이 같으면 출력이 같으니 테스트로 결과를 고정하기 쉽다\n  - 서버가 판정해야 하는 값(권한, 자격, 회원 여부)은 클라이언트에서 다시 계산하지 않는다\n- <strong>핵심:<\/strong> 저장하는 순간 <strong>동기화 대상<\/strong>이 된다. 계산할 수 있으면 <strong>계산<\/strong>한다.\n- <strong>꼬리질문:<\/strong>\n  - \"계산이 비싸면요?\" → `useMemo`로 캐시한다. 그래도 원본은 하나고 메모는 캐시일 뿐이라 동기화 문제는 없다.\n  - \"기본값 + 사용자 재정의는 어떻게 저장하나요?\" → 합쳐진 결과를 저장하면 기본값이 바뀌어도 반영이 안 된다. 재정의한 항목만 저장하고 나머지는 `null`로 두어 읽을 때 합성한다.\n- <strong>출처:<\/strong> [react.dev — You Might Not Need an Effect](https://react.dev/learn/you-might-not-need-an-effect#updating-state-based-on-props-or-state)\n\n> 한 줄 정리: 서버 값은 빌린 캐시, 화면 값은 내 것, 계산할 수 있는 값은 아무도 저장하지 않는다.\n\n## 2. TanStack Query 캐시의 수명\n\n### staleTime과 gcTime\n\n- <strong>뭐야:<\/strong> TanStack Query 캐시의 두 시계다. staleTime은 받은 데이터를 신선하다고 믿는 시간이고, gcTime은 아무 화면도 안 쓰게 된 캐시를 메모리에서 지우기까지의 시간이다.\n- <strong>왜:<\/strong> 둘을 모르면 탭만 왔다 갔다 해도 같은 요청이 계속 나간다(staleTime 0). 반대로 staleTime을 길게 잡으면 다른 사람이 바꾼 값이 한참 안 보인다.\n- <strong>어떻게:<\/strong>\n  - `staleTime`: 데이터를 받은 뒤 <strong>신선(fresh)으로 간주하는 시간<\/strong>. fresh면 마운트·포커스·재연결 같은 자동 트리거가 와도 재조회하지 않는다. 기본값 <strong>0<\/strong>(받자마자 stale)\n  - `gcTime`: 쿼리를 쓰는 컴포넌트(observer)가 하나도 없게 된 뒤 <strong>캐시에서 지우기까지<\/strong> 시간. 기본값 <strong>5분<\/strong>\n  - stale은 \"버린다\"가 아니라 \"<strong>다음 트리거 때 다시 물어본다<\/strong>\"는 뜻. stale 데이터도 즉시 화면에 보여 주고 뒤에서 갱신한다(stale-while-revalidate)\n  - 주의: v5에서 `cacheTime`이 `gcTime`으로 바뀌었다. \"안 쓰게 된 뒤 GC까지\"라는 실제 의미를 드러낸 이름\n- <strong>핵심:<\/strong> <strong>staleTime은 재조회 여부<\/strong>, <strong>gcTime은 메모리 보관 여부<\/strong>. 둘은 독립이다.\n- <strong>꼬리질문:<\/strong>\n  - \"staleTime을 gcTime보다 길게 잡으면?\" → 가능하지만 안 쓰는 동안 gcTime이 지나 지워지면 다음 진입은 처음부터 로딩한다.\n  - \"staleTime은 어떻게 정하나요?\" → 데이터가 바뀌는 빈도와 틀린 값을 보여 줬을 때의 비용으로 정한다. 급식표는 길게, 실시간 좌석 현황은 0에 가깝게(또는 소켓으로).\n  - \"Infinity로 두면?\" → 무효화할 때만 갱신된다. 변경 경로를 다 아는 데이터에만.\n- <strong>출처:<\/strong> [TanStack — Caching](https://tanstack.com/query/v5/docs/framework/react/guides/caching) · [TanStack — Migrating to v5](https://tanstack.com/query/v5/docs/framework/react/guides/migrating-to-v5)\n\n### 재조회 트리거 (Refetch Triggers)\n\n- <strong>뭐야:<\/strong> stale한 쿼리를 다시 가져오게 만드는 순간들이다. 새 컴포넌트 마운트, 창 포커스 복귀, 네트워크 재연결이 기본으로 켜져 있다.\n- <strong>왜:<\/strong> 트리거를 모르면 \"탭 갔다 오니 요청이 또 나가요\"와 \"앱을 다시 켰는데 옛날 값이에요\"를 둘 다 설명하지 못한다.\n- <strong>어떻게:<\/strong>\n  - stale한 쿼리는 다음 순간에 다시 가져온다: <strong>새 observer 마운트<\/strong>(`refetchOnMount`), <strong>창 포커스 복귀<\/strong>(`refetchOnWindowFocus`), <strong>네트워크 재연결<\/strong>(`refetchOnReconnect`). 셋 다 기본 켜짐\n  - 그 외: `refetchInterval`(폴링), `invalidateQueries`, `refetch()` 직접 호출\n  - fresh면 마운트·포커스·재연결 트리거가 와도 <strong>아무것도 안 한다<\/strong>(`invalidateQueries`·`refetch()`·`refetchInterval`은 신선도와 상관없이 가져온다). 그래서 \"요청이 너무 많다\"의 첫 처방은 트리거를 끄는 게 아니라 staleTime을 올리는 것\n  - 재조회 결과는 구조적 공유(structural sharing)로 바뀐 부분만 새 참조가 된다\n- <strong>핵심:<\/strong> 마운트·포커스·재연결 트리거는 \"<strong>stale일 때만<\/strong>\" 발동한다. 요청 빈도는 <strong>staleTime<\/strong>이 조절한다.\n- <strong>꼬리질문:<\/strong>\n  - \"웹뷰 앱에서 백그라운드 복귀 때도 포커스 트리거가 오나요?\" → 주의: v5 포커스 감지는 `visibilitychange` 기반이다. 웹뷰가 안 주면 `focusManager.setEventListener`로 네이티브 복귀 신호를 연결한다.\n  - \"폴링을 쓰면 안 되나요?\" → 변화가 없어도 요청이 쌓인다. 지연에 민감하면 SSE·소켓 이벤트로 캐시를 갱신한다(6파트 참고).\n- <strong>출처:<\/strong> [TanStack — Important Defaults](https://tanstack.com/query/v5/docs/framework/react/guides/important-defaults) · [TanStack — Window Focus Refetching](https://tanstack.com/query/v5/docs/framework/react/guides/window-focus-refetching)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"TanStack Query 쿼리가 fresh에서 stale로, 트리거가 오면 fetching을 거쳐 다시 fresh가 되고, observer가 없으면 gcTime 뒤 삭제되는 상태 전이\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <rect x=\"40\" y=\"70\" width=\"150\" height=\"64\" rx=\"10\" fill=\"var(--fig-accent)\" opacity=\"0.18\" stroke=\"var(--fig-accent)\"/>\n  <text x=\"115\" y=\"98\" text-anchor=\"middle\" font-size=\"16\" fill=\"currentColor\">fresh<\/text>\n  <text x=\"115\" y=\"120\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">자동 트리거 무시<\/text>\n  <rect x=\"285\" y=\"70\" width=\"150\" height=\"64\" rx=\"10\" fill=\"var(--fig-muted)\" opacity=\"0.25\" stroke=\"var(--fig-line)\"/>\n  <text x=\"360\" y=\"98\" text-anchor=\"middle\" font-size=\"16\" fill=\"currentColor\">stale<\/text>\n  <text x=\"360\" y=\"120\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">캐시는 바로 보여 줌<\/text>\n  <rect x=\"530\" y=\"70\" width=\"150\" height=\"64\" rx=\"10\" fill=\"var(--fig-accent2)\" opacity=\"0.2\" stroke=\"var(--fig-accent2)\"/>\n  <text x=\"605\" y=\"98\" text-anchor=\"middle\" font-size=\"16\" fill=\"currentColor\">fetching<\/text>\n  <text x=\"605\" y=\"120\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">isFetching=true<\/text>\n  <line x1=\"190\" y1=\"102\" x2=\"280\" y2=\"102\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <polygon points=\"280,97 290,102 280,107\" fill=\"var(--fig-line)\"/>\n  <text x=\"237\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">staleTime 경과<\/text>\n  <line x1=\"435\" y1=\"102\" x2=\"525\" y2=\"102\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <polygon points=\"525,97 535,102 525,107\" fill=\"var(--fig-line)\"/>\n  <text x=\"482\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">트리거<\/text>\n  <path d=\"M605 134 C605 200 115 200 115 140\" fill=\"none\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <polygon points=\"110,142 115,132 120,142\" fill=\"var(--fig-accent)\"/>\n  <text x=\"360\" y=\"192\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">응답 도착 → 데이터 교체, 다시 fresh<\/text>\n  <text x=\"482\" y=\"60\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">마운트 · 포커스 · 재연결<\/text>\n  <rect x=\"285\" y=\"250\" width=\"150\" height=\"56\" rx=\"10\" fill=\"none\" stroke=\"var(--fig-line)\" stroke-dasharray=\"5 4\"/>\n  <text x=\"360\" y=\"276\" text-anchor=\"middle\" font-size=\"16\" fill=\"currentColor\">inactive<\/text>\n  <text x=\"360\" y=\"296\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">observer 0개<\/text>\n  <rect x=\"530\" y=\"250\" width=\"150\" height=\"56\" rx=\"10\" fill=\"var(--fig-muted)\" opacity=\"0.2\" stroke=\"var(--fig-line)\"/>\n  <text x=\"605\" y=\"283\" text-anchor=\"middle\" font-size=\"16\" fill=\"currentColor\">캐시에서 삭제<\/text>\n  <line x1=\"435\" y1=\"278\" x2=\"525\" y2=\"278\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <polygon points=\"525,273 535,278 525,283\" fill=\"var(--fig-line)\"/>\n  <text x=\"482\" y=\"268\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">gcTime 경과<\/text>\n  <text x=\"150\" y=\"282\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">마지막 컴포넌트 언마운트 →<\/text>\n  <text x=\"360\" y=\"340\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">staleTime은 \"다시 물어볼까\", gcTime은 \"메모리에 둘까\"<\/text>\n<\/svg>\n<figcaption>쿼리 하나의 수명: 신선도(staleTime)와 보관(gcTime)은 서로 다른 축이다<\/figcaption>\n<\/figure>\n\n> 한 줄 정리: stale은 \"틀렸다\"가 아니라 \"다음 기회에 다시 묻는다\"이고, 그 기회가 트리거다.\n\n## 3. 쿼리 키와 무효화\n\n### 쿼리 키 설계 (Query Key Factory)\n\n- <strong>뭐야:<\/strong> 쿼리 키는 캐시에서 응답이 들어갈 칸의 주소다. 키 설계는 이 주소를 어떤 입력으로, 어떤 계층으로 만들지 정하는 일이다.\n- <strong>왜:<\/strong> 화면마다 `['members', page]`, `['member-list', { page }]`처럼 인라인 키를 쓰면 무효화 때 하나를 빠뜨린다.\n- <strong>어떻게:<\/strong>\n  - 키는 <strong>캐시 주소<\/strong>다. 응답에 영향을 주는 모든 입력(필터·페이지·정렬·조직 ID)을 키에 넣는다. 빠지면 서로 다른 응답이 같은 칸을 덮는다\n  - 계층으로 설계한다: `[도메인] → [도메인, 'list', 필터] → [도메인, 'detail', id]`. 앞부분이 같으면 <strong>접두어 일치<\/strong>로 한 번에 무효화된다\n  - 키를 <strong>팩토리 함수<\/strong>로만 만들고 인라인 배열을 금지한다. 오타·순서 차이로 생기는 \"같은데 다른 키\"를 막는다\n  - 객체 속성 순서는 해시에 무관, 배열 순서는 의미가 있다\n- <strong>핵심:<\/strong> 키는 <strong>응답을 결정하는 입력의 전부<\/strong>이고, <strong>계층<\/strong>이 무효화 범위를 정한다.\n- <strong>꼬리질문:<\/strong>\n  - \"키에 필터를 다 넣으면 캐시가 너무 많아지지 않나요?\" → observer 없는 키는 gcTime 뒤 사라진다. 메모리보다 다른 필터 결과가 섞이는 비용이 훨씬 크다.\n  - \"다른 사람 계정으로 로그인하면요?\" → 사용자·조직 같은 범위 입력이 키에 없으면 이전 사용자 캐시가 보일 수 있다. 로그아웃 때 `queryClient.clear()`를 하거나 범위를 키에 넣는다.\n- <strong>출처:<\/strong> [TanStack — Query Keys](https://tanstack.com/query/v5/docs/framework/react/guides/query-keys)\n\n### 무효화 범위는 넓게 (Invalidation Scope)\n\n- <strong>뭐야:<\/strong> mutation 뒤에 \"이 캐시는 낡았다\"고 표시할 범위를 정하는 문제다. 좁게 고르기보다 도메인 루트 키를 통째로 무효화하자는 원칙이다.\n- <strong>왜:<\/strong> 범위가 좁으면 회원 정보를 수정했는데 상세는 바뀌고 목록·필터 카운트·선택 창은 옛값이다. 수정한 mutation이 자기 상세 키만 무효화했기 때문이다.\n- <strong>어떻게:<\/strong>\n  - mutation 성공 후 <strong>도메인 루트 키<\/strong>(`queryKeys.member.all`)를 무효화하면 그 아래 목록·상세·카운트가 모두 stale이 된다\n  - `invalidateQueries`는 stale 표시 + <strong>활성(화면에 떠 있는) 쿼리만 즉시 재조회<\/strong>한다(`refetchType` 기본 `'active'`). 키는 기본 <strong>접두어 일치<\/strong>(`exact: true`로 좁힘). 비활성 쿼리는 다음 진입 때 가져오니 요청 폭발은 없다\n  - 좁게 무효화하려면 \"이 변경이 영향을 주는 키를 <strong>전부<\/strong> 안다\"는 전제가 필요한데, 그 전제는 기능이 늘수록 깨진다\n  - 응답으로 확정값을 받는다면 `setQueryData`로 직접 써도 되지만, 목록 정렬·카운트처럼 서버만 아는 파생값은 결국 무효화가 필요하다\n- <strong>핵심:<\/strong> 무효화가 <strong>넓어서 생기는 비용은 요청 몇 개<\/strong>, <strong>좁아서 생기는 비용은 틀린 화면<\/strong>이다.\n- <strong>꼬리질문:<\/strong>\n  - \"활성 쿼리가 많으면 요청이 몰리지 않나요?\" → 몰린다. 측정 후 `refetchType`·`predicate`로 좁힌다.\n  - \"다른 도메인에 영향이 가면요?\" → 예를 들어 출결 변경이 좌석 표시에 영향을 준다면 두 루트를 함께 무효화한다. 영향 관계를 mutation 훅 한 곳에 모아 둔다.\n- <strong>출처:<\/strong> [TanStack — Query Invalidation](https://tanstack.com/query/v5/docs/framework/react/guides/query-invalidation) · [TanStack — QueryClient](https://tanstack.com/query/v5/docs/reference/QueryClient)\n\n> 한 줄 정리: 키는 팩토리로 계층 있게 만들고, 무효화는 도메인 루트로 넓게 건다.\n\n## 4. 변경(mutation)과 에러 처리\n\n### 낙관적 업데이트와 롤백 (Optimistic Update)\n\n- <strong>뭐야:<\/strong> 서버 응답을 기다리지 않고 성공할 거라 보고 화면을 먼저 바꾸는 방식이다. 실패하면 바꾸기 전 값으로 되돌린다(<strong>롤백<\/strong>).\n- <strong>왜:<\/strong> 없으면 토글이 서버 왕복만큼 늦게 반응해 사용자가 안 눌린 줄 알고 다시 누르기도 한다. 반대로 낙관적으로 바꾼 뒤 실패를 안 되돌리면 화면과 서버가 갈라진다.\n- <strong>어떻게:<\/strong>\n  - `onMutate`: 진행 중인 재조회를 `cancelQueries`로 멈추고(늦은 응답이 낙관적 값을 덮지 않게) → 이전 값 스냅샷 → `setQueryData`로 미리 반영 → 스냅샷을 반환(`onError`·`onSettled`에 전달됨)\n  - `onError`: 전달받은 스냅샷으로 되돌림. 주의: 최신 v5 문서는 이 반환값 인자를 `onMutateResult`라 부르고, `context`는 `client` 등을 담은 별도 인자다\n  - `onSettled`: 성공·실패 상관없이 무효화해서 서버 진실로 맞춤\n  - 대안: 캐시는 두고 `variables`·`isPending`으로 \"보내는 중\" 항목만 겹쳐 그린다. 롤백이 없다. 표시 위치가 한 곳이면 이쪽, 여러 곳이면 캐시 방식\n- <strong>핵심:<\/strong> 낙관적 업데이트는 <strong>취소 → 스냅샷 → 반영 → 실패 시 롤백 → 끝나면 무효화<\/strong> 다섯 단계다. 마지막 무효화가 <strong>정합성의 안전망<\/strong>이다.\n- <strong>꼬리질문:<\/strong>\n  - \"언제 안 쓰나요?\" → 실패가 잦거나 되돌림이 혼란인 경우(결제, 좌석 배정). 서버만 판정할 결과는 응답을 기다린다.\n  - \"같은 항목을 빠르게 두 번 토글하면?\" → 첫 요청의 `onSettled` 무효화가 두 번째 낙관적 값을 덮어 깜빡인다. `isMutating({ mutationKey }) === 1`(나만 남음)일 때만 무효화하거나 버튼을 잠근다.\n- <strong>출처:<\/strong> [TanStack — Optimistic Updates](https://tanstack.com/query/v5/docs/framework/react/guides/optimistic-updates) · [TkDodo — Concurrent Optimistic Updates](https://tkdodo.eu/blog/concurrent-optimistic-updates-in-react-query)\n\n### 전역 onError와 중복 토스트 (Global Error Handler)\n\n- <strong>뭐야:<\/strong> 쿼리·mutation 실패를 `QueryCache`·`MutationCache`의 onError 한 곳에서 받아 안내하는 구조다. 실패 안내를 어디서 몇 번 띄울지 정하는 문제다.\n- <strong>왜:<\/strong> 정하지 않으면 전역 핸들러와 훅이 둘 다 띄워 실패 토스트가 두 개 뜬다. 반대로 조회 실패가 토스트로만 지나가고 화면엔 \"데이터 없음\"이 남는다.\n- <strong>어떻게:<\/strong>\n  - 전역 처리는 `QueryCache({ onError })`·`MutationCache({ onError })`에 둔다. 주의: v5에서 `useQuery`의 `onSuccess`/`onError`/`onSettled`가 제거됐다(mutation엔 남음). 컴포넌트마다 불려 중복되기 쉬웠다\n  - mutation 콜백은 겹겹이 다 실행된다. 주의: v5 순서는 <strong>MutationCache 콜백 → `useMutation` 옵션 콜백 → `mutate()`에 넘긴 콜백<\/strong>(앞 둘은 `mutation.ts` 구현, 뒤 둘은 가이드 기준). `mutate()` 콜백은 언마운트되면 안 불리고, 연달아 호출하면 <strong>마지막 호출분만<\/strong> 실행된다\n  - 규칙: 일반 실패 문구는 <strong>전역 한 곳<\/strong>, 훅·컴포넌트는 성공 안내나 특수 코드 분기만\n  - 화면 안에서 오류를 직접 그리는 조회는 `meta` 같은 표식으로 전역 토스트를 끄고 <strong>오류 상태 + 다시 시도<\/strong>를 렌더한다\n- <strong>핵심:<\/strong> 실패 안내는 <strong>한 번, 한 곳<\/strong>. 조회 실패는 토스트가 아니라 <strong>화면 상태<\/strong>로 드러낸다.\n- <strong>꼬리질문:<\/strong>\n  - \"전역 핸들러가 모든 에러 코드를 알아야 하나요?\" → 아니다. 공통(네트워크·500·세션 만료)만 전역, 도메인 코드는 훅이 처리하며 전역을 끈다.\n  - \"에러 바운더리랑은 어떻게 나누나요?\" → 렌더 불가 실패는 바운더리, 부분·재시도 가능 실패는 인라인 오류 상태, 토스트는 방금 한 행동의 결과에만.\n- <strong>출처:<\/strong> [TanStack — Mutations](https://tanstack.com/query/v5/docs/framework/react/guides/mutations) · [TanStack — Migrating to v5](https://tanstack.com/query/v5/docs/framework/react/guides/migrating-to-v5) · [mutation.ts](https://raw.githubusercontent.com/TanStack/query/main/packages/query-core/src/mutation.ts)\n\n> 한 줄 정리: 낙관적 업데이트는 롤백·무효화까지 한 세트, 에러 안내는 전역에서 한 번.\n\n## 5. 동시성: 경쟁과 중복\n\n### 요청 경쟁과 취소 (Race Condition & Cancellation)\n\n- <strong>뭐야:<\/strong> 요청 여러 개가 동시에 날아가 응답이 보낸 순서와 다르게 도착하는 상황이다. 늦게 온 옛 응답이 최신 결과를 덮는 것을 막는 게 취소와 키 분리다.\n- <strong>왜:<\/strong> 대비가 없으면 검색어를 \"가\"→\"가나\"로 빠르게 입력했을 때 \"가\" 응답이 늦게 도착해 \"가나\" 결과를 덮는다. 탭을 빠르게 바꾸면 이전 탭 데이터가 잠깐 보인다.\n- <strong>어떻게:<\/strong>\n  - 원인은 \"<strong>응답 도착 순서 ≠ 요청 순서<\/strong>\". 마지막에 도착한 응답이 이기는 구조면 늦은 옛 응답이 덮는다\n  - `useEffect` 직접 fetch: cleanup에서 `ignore = true` 플래그를 세우거나 `AbortController.abort()`로 끊는다\n  - TanStack Query: 입력이 <strong>키에 들어가 있으면<\/strong> 늦게 온 \"가\" 응답은 `['search','가']` 칸에 들어가고 화면은 `['search','가나']`를 보므로 덮지 않는다. queryFn의 `signal`을 fetch에 넘겨야 안 쓰는 요청이 실제로 취소된다\n  - 같은 키를 낙관적으로 바꾸기 전에 `cancelQueries`로 진행 중 재조회를 끊는다\n- <strong>핵심:<\/strong> 경쟁은 <strong>요청 순서와 응답 순서가 다를 때<\/strong> 생긴다. 해결은 <strong>취소<\/strong>하거나, 응답을 <strong>입력별 칸에 분리<\/strong>하는 것.\n- <strong>꼬리질문:<\/strong>\n  - \"abort하면 서버 작업도 취소되나요?\" → 아니다. 서버는 이미 처리했을 수 있다. 쓰기 중복은 멱등 키로 막는다.\n  - \"디바운스로 충분하지 않나요?\" → 요청 수만 줄고 순서 역전은 남는다. 디바운스는 비용, 취소·키 분리는 정합성 문제.\n- <strong>출처:<\/strong> [react.dev — Fetching data](https://react.dev/learn/you-might-not-need-an-effect#fetching-data) · [TanStack — Query Cancellation](https://tanstack.com/query/v5/docs/framework/react/guides/query-cancellation)\n\n### 중복 제출 방지와 멱등 키 (Idempotency Key)\n\n- <strong>뭐야:<\/strong> 같은 요청이 여러 번 들어와도 한 번만 처리되게 하는 장치다. <strong>멱등 키<\/strong>는 \"같은 의도\"마다 하나씩 만들어 요청에 붙이는 고유 값(보통 UUID)으로, 서버는 이미 본 키면 처리하지 않고 이전 결과를 돌려준다.\n- <strong>왜:<\/strong> 결제·지급 버튼 연타, 네트워크가 느려 사용자가 다시 누름, 타임아웃 후 자동 재시도가 생긴다. 막지 않으면 서버가 같은 요청을 두 번 처리해 이중 지급이 날 수 있다.\n- <strong>어떻게:<\/strong>\n  - 1차 방어(클라이언트): `isPending` 동안 버튼 비활성, 동기 래치(ref)로 같은 tick의 연타 차단. 단, 새로고침·재시도·다른 탭에는 무력하다\n  - 2차 방어(서버 계약): 요청에 <strong>멱등 키<\/strong>를 실어 보내고, 서버는 같은 키를 이미 처리했으면 <strong>처리하지 않고 이전 결과를 돌려준다<\/strong>\n  - 키를 <strong>언제 만드는지<\/strong>가 핵심. 재시도 때마다 새로 만들면 무력하다. \"사용자의 같은 의도\"에 같은 키가 붙어야 한다 — 대상을 고른 시점에 고정하거나, 요청 내용으로 결정적으로 만든다\n  - 요청 시각 같은 매번 바뀌는 값을 키에 넣으면 멱등성이 사라진다\n  - 서버 관례(Stripe): 첫 결과(실패 포함)를 저장해 같은 키에 재응답, 같은 키·다른 파라미터는 거절, 키는 24시간 이상 보관. 주의: `Idempotency-Key` 헤더는 IETF 초안(만료)이지 RFC가 아니다\n- <strong>핵심:<\/strong> 버튼 비활성은 <strong>UX<\/strong>, 멱등 키는 <strong>정합성<\/strong>. 키는 <strong>같은 의도 = 같은 키<\/strong>가 되도록 생성 시점을 고정한다.\n- <strong>꼬리질문:<\/strong>\n  - \"내용 기반 키면 진짜로 두 번 하고 싶을 땐요?\" → 막힌다. 키에 의도 단위 값(작업 세션 ID 등)을 넣거나 서버가 키 유효 기간을 둔다.\n  - \"왜 서버에서 중복 검사만 하면 안 되나요?\" → 서버는 \"같은 내용의 정상적인 두 번째 요청\"과 \"재전송\"을 구분할 수 없다. 그 구분 정보를 주는 게 키다.\n- <strong>출처:<\/strong> [IETF — Idempotency-Key 헤더 초안](https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key-header/) · [Stripe — Idempotent requests](https://docs.stripe.com/api/idempotent_requests)\n\n> 한 줄 정리: 읽기 경쟁은 취소·키 분리로, 쓰기 중복은 같은 의도에 같은 멱등 키로.\n\n## 6. 목록 데이터: 페이지네이션\n\n### offset vs cursor (Offset / Keyset Pagination)\n\n- <strong>뭐야:<\/strong> 목록을 잘라 받는 두 방식이다. offset은 \"앞에서 몇 개 건너뛰고\"로, cursor는 \"마지막으로 본 항목 다음부터\"로 다음 묶음을 고른다.\n- <strong>왜:<\/strong> 차이를 모르고 offset만 쓰면 새 글이 앞에 끼었을 때 다음 페이지에 같은 항목이 또 나오고(중복), 삭제되면 하나가 건너뛰어진다(누락). 깊은 페이지일수록 느리다.\n- <strong>어떻게:<\/strong>\n  - <strong>offset<\/strong>: `?page=5&size=20` → `OFFSET 80 LIMIT 20`. 임의 페이지 점프와 총 건수 표시가 쉽다. 대신 DB가 앞 80건을 세고 버려야 해서 깊을수록 느리고, 데이터가 변하면 경계가 밀린다\n  - <strong>cursor(keyset)<\/strong>: `?after=마지막항목의(정렬키,id)` → `WHERE (created_at, id) < (...) LIMIT 20`. 인덱스로 바로 찾아 깊이와 무관하게 빠르고, 중간 삽입·삭제에도 중복·누락이 없다\n  - cursor는 정렬 키가 <strong>유일<\/strong>해야 한다. 시각만 쓰면 같은 시각 항목이 경계에서 빠지므로 `id`를 보조 키로 붙인다\n  - `useInfiniteQuery`는 재조회 때 <strong>첫 페이지부터 순서대로<\/strong> 다시 받는다(옛 커서 재사용 방지)\n  - cursor의 대가: \"17페이지로 가기\", \"총 몇 건\" 이 기본으로 안 된다. 총 건수는 별도 count가 필요하다\n- <strong>핵심:<\/strong> offset은 <strong>점프·총 건수<\/strong>, cursor는 <strong>일관성·깊은 페이지 성능<\/strong>. 정렬 키는 <strong>유일<\/strong>해야 한다.\n- <strong>꼬리질문:<\/strong>\n  - \"cursor인데 정렬 기준을 바꾸면요?\" → 커서가 정렬 키에 묶여 처음부터 다시 받는다. 정렬마다 인덱스도 필요하다.\n  - \"목록 일부만 받아 합계를 내면?\" → 받은 범위만 합산된다. 합계·총 건수는 서버가 계산한다.\n- <strong>출처:<\/strong> [Use The Index, Luke — No Offset](https://use-the-index-luke.com/no-offset) · [TanStack — Infinite Queries](https://tanstack.com/query/v5/docs/framework/react/guides/infinite-queries)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"offset 방식은 앞에 새 항목이 끼면 다음 페이지에서 같은 항목이 중복되고, cursor 방식은 마지막 항목 기준으로 이어 받아 중복이 없다는 비교\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <text x=\"180\" y=\"32\" text-anchor=\"middle\" font-size=\"16\" fill=\"currentColor\">offset (page=2, size=3)<\/text>\n  <text x=\"540\" y=\"32\" text-anchor=\"middle\" font-size=\"16\" fill=\"currentColor\">cursor (after=C)<\/text>\n  <line x1=\"360\" y1=\"20\" x2=\"360\" y2=\"340\" stroke=\"var(--fig-line)\" stroke-dasharray=\"4 4\"/>\n  <text x=\"70\" y=\"64\" font-size=\"13\" fill=\"currentColor\">1페이지 받음<\/text>\n  <rect x=\"40\" y=\"74\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"80\" y=\"94\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">A<\/text>\n  <rect x=\"130\" y=\"74\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"170\" y=\"94\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">B<\/text>\n  <rect x=\"220\" y=\"74\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"260\" y=\"94\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">C<\/text>\n  <text x=\"70\" y=\"140\" font-size=\"13\" fill=\"currentColor\">그 사이 새 항목 N이 맨 앞에 추가<\/text>\n  <rect x=\"40\" y=\"150\" width=\"60\" height=\"30\" rx=\"6\" fill=\"var(--fig-accent2)\" opacity=\"0.3\" stroke=\"var(--fig-accent2)\"/>\n  <text x=\"70\" y=\"170\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">N<\/text>\n  <text x=\"125\" y=\"170\" font-size=\"14\" fill=\"currentColor\">A  B  C  D  E …<\/text>\n  <text x=\"70\" y=\"216\" font-size=\"13\" fill=\"currentColor\">2페이지 = OFFSET 3 → C, D, E<\/text>\n  <rect x=\"40\" y=\"226\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-accent2)\" opacity=\"0.35\" stroke=\"var(--fig-accent2)\"/>\n  <text x=\"80\" y=\"246\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">C 중복<\/text>\n  <rect x=\"130\" y=\"226\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"170\" y=\"246\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">D<\/text>\n  <rect x=\"220\" y=\"226\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"260\" y=\"246\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">E<\/text>\n  <text x=\"40\" y=\"290\" font-size=\"13\" fill=\"currentColor\">+ 점프·총 건수 쉬움<\/text>\n  <text x=\"40\" y=\"312\" font-size=\"13\" fill=\"currentColor\">− 변동 시 중복·누락, 깊을수록 느림<\/text>\n  <text x=\"400\" y=\"64\" font-size=\"13\" fill=\"currentColor\">1페이지 받음, 마지막 = C<\/text>\n  <rect x=\"400\" y=\"74\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"440\" y=\"94\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">A<\/text>\n  <rect x=\"490\" y=\"74\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"530\" y=\"94\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">B<\/text>\n  <rect x=\"580\" y=\"74\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-accent)\" opacity=\"0.3\" stroke=\"var(--fig-accent)\"/>\n  <text x=\"620\" y=\"94\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">C<\/text>\n  <text x=\"400\" y=\"140\" font-size=\"13\" fill=\"currentColor\">N이 앞에 추가돼도 상관없음<\/text>\n  <text x=\"400\" y=\"170\" font-size=\"14\" fill=\"currentColor\">WHERE (time, id) &lt; C의 값<\/text>\n  <text x=\"400\" y=\"216\" font-size=\"13\" fill=\"currentColor\">2페이지 → D, E, F<\/text>\n  <rect x=\"400\" y=\"226\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"440\" y=\"246\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">D<\/text>\n  <rect x=\"490\" y=\"226\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"530\" y=\"246\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">E<\/text>\n  <rect x=\"580\" y=\"226\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"620\" y=\"246\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">F<\/text>\n  <text x=\"400\" y=\"290\" font-size=\"13\" fill=\"currentColor\">+ 중복·누락 없음, 깊이 무관하게 빠름<\/text>\n  <text x=\"400\" y=\"312\" font-size=\"13\" fill=\"currentColor\">− 페이지 점프·총 건수는 따로<\/text>\n<\/svg>\n<figcaption>offset은 \"몇 번째부터\", cursor는 \"이 항목 다음부터\"를 묻는다<\/figcaption>\n<\/figure>\n\n### 무한 스크롤 vs 페이지 번호 (Infinite Scroll vs Numbered Pages)\n\n- <strong>뭐야:<\/strong> 긴 목록을 보여 주는 두 UI다. 무한 스크롤은 내리면 다음 묶음이 이어 붙고, 페이지 번호는 원하는 페이지로 골라 이동한다.\n- <strong>왜:<\/strong> 목적에 안 맞게 고르면 문제가 된다. 어드민 목록을 무한 스크롤로 만들면 특정 페이지로 바로 갈 수 없고 \"전체 몇 명\"도 따로 세지 않으면 모른다. 불러오는 양에 상한까지 두면 목록이 조용히 잘려 그게 전부인 줄 안다.\n- <strong>어떻게:<\/strong>\n  - 기준은 <strong>사용 목적<\/strong>. 훑어보기·피드(채팅, 알림, 타임라인) → 무한 스크롤. 찾기·관리·비교(어드민 표, 검색 결과) → 페이지 번호\n  - 페이지 번호 목록은 <strong>페이지·필터·정렬을 URL에<\/strong> 둔다. 새로고침·공유·뒤로 가기에서 같은 화면이 나와야 한다\n  - 페이지를 넘길 때 이전 데이터를 유지해 깜빡임을 없앤다. 주의: v5는 `placeholderData: keepPreviousData`(v4 `keepPreviousData: true` 대체). 그동안 \"다음\" 버튼은 `isPlaceholderData`로 막는다\n  - 무한 스크롤은 `useInfiniteQuery`. 주의: v5부터 `initialPageParam` 필수. `getNextPageParam`이 `null`/`undefined`면 끝. 길어지면 가상화(7파트 참고)와 v5 `maxPages`로 보관 페이지 수를 묶는다\n  - 어느 쪽이든 <strong>정렬·필터는 서버에서<\/strong>. 받은 페이지 안에서만 정렬하면 \"전체 정렬\"처럼 보이지만 페이지별로 따로 정렬된 결과다\n- <strong>핵심:<\/strong> 탐색·관리 화면은 <strong>페이지 번호 + URL 상태<\/strong>, 흘려보는 피드는 <strong>무한 스크롤 + cursor<\/strong>. 정렬·필터는 <strong>서버<\/strong>에서.\n- <strong>꼬리질문:<\/strong>\n  - \"페이지 번호면 offset 문제가 다시 오지 않나요?\" → 온다. 어드민은 그 변동을 감수하고, 선택 상태는 id로 보존한다.\n  - \"화면 안에서 필터링하면?\" → 페이지 밖 항목이 빠져 \"없다\"고 오해한다.\n- <strong>출처:<\/strong> [TanStack — Paginated Queries](https://tanstack.com/query/v5/docs/framework/react/guides/paginated-queries) · [TanStack — Infinite Queries](https://tanstack.com/query/v5/docs/framework/react/guides/infinite-queries)\n\n> 한 줄 정리: 찾는 화면은 페이지 번호와 URL, 흘려보는 화면은 cursor와 무한 스크롤, 정렬·필터는 서버.\n\n## 7. 클라이언트 상태의 자리\n\n### URL을 상태로 (URL as State)\n\n- <strong>뭐야:<\/strong> 탭·필터·정렬·페이지 같은 화면 상태를 컴포넌트 안이 아니라 쿼리스트링에 두고, <strong>URL<\/strong>을 그 상태의 원본으로 삼는 방식이다.\n- <strong>왜:<\/strong> 상태를 컴포넌트에만 두면 필터를 걸고 3페이지를 보다가 상세에 들어갔다 뒤로 올 때 1페이지·필터 해제 상태로 돌아간다. 동료에게 링크를 보내도 다른 화면이 보인다.\n- <strong>어떻게:<\/strong>\n  - 공유·새로고침·뒤로 가기에서 <strong>살아남아야 하는 상태<\/strong>(탭, 필터, 정렬, 페이지, 검색어, 선택한 날짜)는 쿼리스트링에 둔다\n  - URL이 원본이고 컴포넌트는 `useSearchParams`로 <strong>읽기만<\/strong> 한다. `useState`에 복사해 두 원본을 만들지 않는다\n  - 바꿀 땐 히스토리 정책을 고른다: 필터·페이지는 `push`(뒤로 가기로 복귀), 입력 중 검색어는 `replace`(히스토리 오염 방지)\n  - 파싱은 한 곳에서 검증한다. URL은 사용자가 손으로 고칠 수 있는 <strong>외부 입력<\/strong>이다(잘못된 page, 없는 탭)\n- <strong>핵심:<\/strong> \"링크로 <strong>재현<\/strong>돼야 하는 상태\"는 URL이 <strong>원본<\/strong>이다.\n- <strong>꼬리질문:<\/strong>\n  - \"모달 열림도 URL에 두나요?\" → 링크로 열려야 하면 둔다. 그러면 뒤로 가기가 모달을 닫으니 그게 의도인지 정한다.\n  - \"Next.js App Router에서 대가는?\" → 프리렌더 라우트에서 `useSearchParams`는 가장 가까운 Suspense까지 클라이언트 렌더로 빠져, `<Suspense>`가 없으면 프로덕션 빌드가 실패한다. 서버에선 page의 `searchParams` prop을 읽는다(4파트 참고).\n- <strong>출처:<\/strong> [Next.js — useSearchParams](https://nextjs.org/docs/app/api-reference/functions/use-search-params)\n\n### 전역 상태 라이브러리 선택 (Context / Zustand / Jotai)\n\n- <strong>뭐야:<\/strong> 여러 컴포넌트가 함께 쓰는 클라이언트 상태를 담을 도구 고르기다. Context는 값을 아래로 전달하는 도구이고, Zustand·Jotai는 필요한 조각만 구독하는 스토어다.\n- <strong>왜:<\/strong> 잘못 고르면 Context에 자주 바뀌는 값을 넣어 소비자 전체가 매번 리렌더된다. 서버 데이터까지 전역 스토어에 넣으면 동기화 코드가 분다.\n- <strong>어떻게:<\/strong>\n  - 먼저 뺄 것: 서버 상태(→ Query), URL 상태, 폼 상태. 남는 전역 클라이언트 상태는 적다\n  - <strong>Context<\/strong>: 의존성 주입 도구에 가깝다. `value`가 바뀌면 읽는 <strong>모든 소비자<\/strong>가 리렌더되고(`memo`로 못 막음) selector가 없다. 드물게 바뀌는 값(테마·로케일)에 적합(3파트 참고)\n  - <strong>Zustand<\/strong>: selector 구독. 고른 값이 `Object.is`로 바뀔 때만 리렌더(새 객체를 만드는 selector는 `useShallow`). React 밖에서도 접근\n  - <strong>Jotai<\/strong>: 원자(atom) 단위 상태를 조합. 파생 atom으로 계산값을 선언적으로 만든다. 상태가 잘게 쪼개지고 서로 의존할 때 유리\n  - Redux(Toolkit): 엄격한 액션 기록·미들웨어·디버깅 도구가 필요한 큰 팀에서\n- <strong>핵심:<\/strong> Context는 <strong>전달 도구<\/strong>, 자주 바뀌는 값엔 <strong>selector 있는 스토어<\/strong>. 고르기 전에 <strong>서버·URL·폼 상태를 먼저 덜어낸다<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"Next.js App Router에서 모듈 전역 스토어의 위험은?\" → 서버는 동시 요청이 같은 모듈을 공유해 사용자 데이터가 섞일 수 있다. Zustand 가이드도 요청마다 Provider로 스토어를 만들고, 서버 컴포넌트는 스토어를 건드리지 않게 한다.\n  - \"Context 리렌더를 줄이려면?\" → 값과 setter를 다른 Context로 나누고 value를 `useMemo`로 고정한다. 그래도 부족하면 스토어로.\n- <strong>출처:<\/strong> [react.dev — useContext](https://react.dev/reference/react/useContext) · [Zustand — Setup with Next.js](https://zustand.docs.pmnd.rs/learn/guides/nextjs)\n\n### 폼 상태와 검증 (Form State & Validation)\n\n- <strong>뭐야:<\/strong> 입력 중인 값, 수정 여부, 오류를 관리하고 제출 전에 규칙에 맞는지 확인하는 일이다. 클라이언트 검증은 빠른 피드백이고 최종 판정은 서버가 한다.\n- <strong>왜:<\/strong> 제대로 안 하면 입력마다 폼 전체가 리렌더된다. 서버 거절을 어느 필드에 보일지 몰라 토스트로만 띄우고, 수정 폼이 안 건드린 필드까지 보내 남의 변경을 덮는다.\n- <strong>어떻게:<\/strong>\n  - 비제어 기반 라이브러리(React Hook Form)는 `register`가 `ref`를 잡아 값을 DOM에 두므로 타이핑마다 폼 전체가 리렌더되지 않는다. 제어 입력은 `Controller`로 격리\n  - 검증 규칙은 스키마(Zod 등) 하나로 정의하고 타입도 거기서 뽑는다. <strong>클라이언트 검증은 UX, 서버 검증이 진짜<\/strong>다\n  - 서버 에러는 필드 단위로 매핑(`setError`)하고, 매핑 안 되는 건 폼 상단에 둔다\n  - 부분 수정(PATCH)은 <strong>dirty 필드만<\/strong> 보낸다. \"미변경(키 없음)\"과 \"값 비움(`null`)\"을 구분해야 한다\n  - 제출 중 버튼 비활성은 기본, 중복 제출의 진짜 방어는 멱등 키(5섹션)\n- <strong>핵심:<\/strong> 클라이언트 검증은 <strong>빠른 피드백<\/strong>, 서버 검증이 <strong>판정<\/strong>. 수정 요청은 <strong>바뀐 것만<\/strong>, \"미변경\"과 \"비움\"을 <strong>구분<\/strong>한다.\n- <strong>꼬리질문:<\/strong>\n  - \"서버 검증 규칙을 클라이언트로 옮기면 중복 아닌가요?\" → 중복이지만 거절될 걸 미리 막아 비싼 단계(촬영, 결제)를 아낀다. 기준은 서버 계약.\n  - \"제어 컴포넌트로 다 하면 안 되나요?\" → 필드가 적으면 된다. 많으면 매 입력 리렌더가 체감된다.\n- <strong>출처:<\/strong> [React Hook Form — FAQs](https://react-hook-form.com/faqs) · [React Hook Form — Advanced Usage](https://react-hook-form.com/advanced-usage)\n\n### 상태 머신으로 UI 상태 다루기 (Finite State Machine)\n\n- <strong>뭐야:<\/strong> 화면이 가질 수 있는 상태를 목록으로 정하고, 어떤 이벤트에서 어느 상태로 넘어가는지를 표로 정해 두는 방식이다. 상태마다 받을 수 있는 이벤트가 정해져 있어 표에 없는 전이는 일어나지 않는다.\n- <strong>왜:<\/strong> 불리언으로 관리하면 `isSubmitting`·`isSuccess`·`isError`가 늘어 \"제출 중인데 성공\" 같은 모순된 조합이 가능해진다. 완료 화면에서 늦게 온 실패 응답이 화면을 되돌리기도 한다.\n- <strong>어떻게:<\/strong>\n  - <strong>상태 목록<\/strong>과 상태를 바꾸는 <strong>이벤트<\/strong>(입력·응답·타임아웃)를 먼저 적는다\n  - 불리언 여러 개 대신 `status` 하나로 <strong>불가능한 상태<\/strong>를 없앤다(타입은 8파트 판별 유니온)\n  - 핵심은 <strong>전이 표<\/strong>: (상태, 이벤트) → 다음 상태를 한 곳에. 표에 없는 이벤트는 <strong>무시<\/strong>돼 늦은 응답·중복 클릭이 구조적으로 막힌다\n  - 작으면 `useReducer`로 충분, 중첩·병렬 상태·가드가 필요하면 XState 같은 statechart\n- <strong>핵심:<\/strong> 불리언 조합 대신 <strong>상태 하나<\/strong>, 전이는 <strong>(상태, 이벤트) → 다음 상태<\/strong> 표 한 곳에. 허용 안 된 이벤트는 <strong>무시<\/strong>된다.\n- <strong>꼬리질문:<\/strong>\n  - \"useReducer랑 뭐가 다른가요?\" → reducer는 전이를 모으는 그릇, 머신은 상태별 허용 이벤트를 제한하는 규칙이다. reducer에서 현재 상태로 먼저 분기하면 머신이 된다.\n  - \"대가는?\" → 선언 코드가 는다. 단계 많은 흐름(결제·가입)에서만 이득이 크다.\n- <strong>출처:<\/strong> [react.dev — Reacting to Input with State](https://react.dev/learn/reacting-to-input-with-state) · [Stately — State machines](https://stately.ai/docs/state-machines-and-statecharts)\n\n> 한 줄 정리: 재현돼야 하면 URL, 잦은 공유 값은 selector 스토어, 입력 중이면 폼, 단계가 많으면 상태 머신, 판정은 서버.\n\n## 8. 서버 데이터의 모양과 흐름\n\n### 의존 쿼리와 요청 워터폴 (Dependent Queries & Request Waterfall)\n\n- <strong>뭐야:<\/strong> 앞 요청의 결과가 있어야 다음 요청을 보낼 수 있는 관계가 의존 쿼리다. 이런 요청이 줄줄이 이어져 하나씩 차례로 기다리는 모양을 <strong>워터폴<\/strong>이라 부른다.\n- <strong>왜:<\/strong> 관리하지 않으면 사용자 → 조직 → 설정을 차례로 받느라 첫 화면이 왕복 세 번만큼 늦다. 반대로 막지 않으면 `id`가 아직 없는데 쿼리가 `undefined`로 나간다.\n- <strong>어떻게:<\/strong>\n  - <strong>워터폴<\/strong>: 앞 요청이 끝나야 다음이 시작된다. 단계마다 왕복이 더해져 지연 큰 망에서 몇 배로 느려진다(부모→자식 컴포넌트 순 요청도 같다)\n  - 앞 결과가 꼭 필요하면 `enabled: !!userId`로 막는다. 막힌 동안 `status: 'pending'` + `fetchStatus: 'idle'`이라 `isPending`만 보면 로딩으로 오해한다. 조건은 전부 AND\n  - 서로 독립인 조회는 <strong>병렬<\/strong>로: 같은 컴포넌트에 나란히 두거나 `useQueries`. Suspense라면 `useSuspenseQuery` 여러 개가 직렬로 실행되므로 `useSuspenseQueries`\n  - 구조로 풀기: 쿼리를 부모로 끌어올리기, 라우트 시점 <strong>prefetch<\/strong>, 서버 렌더링으로 서버 쪽에 옮기기, API를 합쳐 의존 없애기\n- <strong>핵심:<\/strong> 워터폴은 <strong>단계 수 × 왕복 지연<\/strong>. 독립 조회는 <strong>병렬<\/strong>, 의존은 `enabled`로 막되 <strong>API 합치기·prefetch<\/strong>로 단계를 줄인다.\n- <strong>꼬리질문:<\/strong>\n  - \"코드 스플리팅도 워터폴을 만드나요?\" → 만든다. lazy 컴포넌트는 코드를 받은 뒤에야 안의 쿼리가 시작된다. 데이터 요청을 라우트 진입 시점으로 당겨 둔다(7파트 참고).\n  - \"왜 엔드포인트를 안 합치나요?\" → 효과는 가장 크지만 재사용성이 준다. 늘 같이 쓰는 조합만 합친다.\n- <strong>출처:<\/strong> [TanStack — Dependent Queries](https://tanstack.com/query/v5/docs/framework/react/guides/dependent-queries) · [TanStack — Request Waterfalls](https://tanstack.com/query/v5/docs/framework/react/guides/request-waterfalls)\n\n### 캐시 정규화 vs 쿼리 단위 캐시 (Normalized Cache)\n\n- <strong>뭐야:<\/strong> 캐시를 저장하는 두 방식이다. 정규화 캐시는 엔티티를 `타입:id`로 한 번만 저장하고 목록은 참조만 들며, 쿼리 단위 캐시는 키 하나에 응답을 통째로 저장한다.\n- <strong>왜:<\/strong> 쿼리 단위 캐시에선 같은 객체가 쿼리마다 복사돼 있어, 회원 이름을 바꿨는데 상세만 새 이름이고 목록·선택 창은 옛 이름일 수 있다. 이 차이를 알아야 일관성을 맞출 방법을 고른다.\n- <strong>어떻게:<\/strong>\n  - <strong>정규화 캐시<\/strong>(Apollo Client, Redux의 `createEntityAdapter`): 엔티티를 `타입:id` 키로 한 번만 저장하고 목록은 <strong>참조<\/strong>만 든다. 하나를 고치면 참조하는 화면이 다 바뀐다\n  - <strong>쿼리 단위 캐시<\/strong>(TanStack Query·SWR·RTK Query): 키 하나에 응답 통째. 공식 비교표상 셋 다 자동 정규화 미지원. 일관성은 <strong>넓은 무효화<\/strong>나 `setQueryData`로 맞춘다\n  - 전제는 <strong>전역 유일 id<\/strong>. GraphQL은 `__typename`·`id`로 자동화가 쉽다(6파트 참고)\n- <strong>핵심:<\/strong> 정규화는 <strong>엔티티 하나 = 저장 하나<\/strong>라 수정이 자동 전파되고, 쿼리 단위 캐시는 <strong>단순한 대신 무효화<\/strong>로 일관성을 맞춘다.\n- <strong>꼬리질문:<\/strong>\n  - \"그럼 왜 TanStack Query는 정규화를 안 하나요?\" → (공식 설명 아님) REST 응답은 엔티티 경계를 라이브러리가 모르고, 정렬·필터·카운트 같은 서버 파생값은 정규화해도 결국 재조회가 필요하다.\n  - \"정규화의 대가는?\" → 추가·삭제 때 어느 목록에 넣고 뺄지 직접 써야 한다.\n- <strong>출처:<\/strong> [Apollo — Caching overview](https://www.apollographql.com/docs/react/caching/overview) · [TanStack — Comparison](https://tanstack.com/query/v5/docs/framework/react/comparison)\n\n> 한 줄 정리: 왕복은 병렬·prefetch로 줄이고, 같은 엔티티의 일관성은 정규화나 넓은 무효화로 맞춘다.\n\n## 핵심 키워드 모음\n\n- <strong>서버 vs 클라이언트 상태<\/strong>: 서버 상태는 빌린 캐시, 전역 스토어에 복사하면 동기화 책임이 생긴다\n- <strong>단일 원본<\/strong>: 값마다 쓸 수 있는 곳은 하나, 둘이 필요하면 이름을 나눈다\n- <strong>파생 상태<\/strong>: 계산 가능한 값은 저장하지 말고 렌더 중 계산, 재정의는 `null` 오버라이드\n- <strong>staleTime / gcTime<\/strong>: 재조회 여부(기본 0) vs 보관(기본 5분), 독립, v5 cacheTime → gcTime\n- <strong>재조회 트리거<\/strong>: 마운트·포커스·재연결은 stale일 때만 발동, invalidate·refetch·폴링은 신선도 무관\n- <strong>쿼리 키 팩토리<\/strong>: 응답을 결정하는 입력 전부를 계층 키로, 인라인 배열 금지\n- <strong>무효화 범위<\/strong>: 도메인 루트로 넓게, 활성 쿼리만 즉시 재조회(비활성은 다음 진입 때)\n- <strong>낙관적 업데이트<\/strong>: 취소→스냅샷→반영→롤백→무효화\n- <strong>전역 onError<\/strong>: 실패 안내는 전역 한 번, 조회 실패는 화면 오류 상태, v5 useQuery 콜백 제거, mutation은 캐시 → 훅 → mutate 순\n- <strong>요청 경쟁<\/strong>: 응답 순서 ≠ 요청 순서, 취소(`signal`)하거나 입력별 키로 분리\n- <strong>멱등 키<\/strong>: 같은 의도 = 같은 키, 매번 바뀌는 값 금지, 서버는 첫 결과 재응답\n- <strong>offset vs cursor<\/strong>: 점프·총 건수 vs 일관성·깊은 페이지 성능, 정렬 키는 유일\n- <strong>무한 스크롤 vs 페이지 번호<\/strong>: 피드는 무한, 관리·검색은 페이지 번호, 정렬·필터는 서버, v5 `keepPreviousData`·`initialPageParam`\n- <strong>URL 상태<\/strong>: 공유·새로고침·뒤로 가기에서 살아야 하면 URL이 원본, 외부 입력이라 검증\n- <strong>전역 상태 라이브러리<\/strong>: Context는 전달 도구, 잦은 변경엔 selector 스토어(Zustand), 잘게 쪼개면 atom(Jotai)\n- <strong>폼 상태<\/strong>: 클라이언트 검증은 UX·서버가 판정, PATCH는 dirty 필드만, 미변경과 비움 구분\n- <strong>상태 머신<\/strong>: 불리언 대신 status 하나, (상태, 이벤트) → 다음 상태, 나머지 이벤트는 무시\n- <strong>요청 워터폴<\/strong>: 단계 수 × 왕복 지연, 독립은 병렬, 의존은 `enabled`, API 합치기·prefetch\n- <strong>캐시 정규화<\/strong>: 엔티티를 `타입:id`로 한 번 저장(Apollo), TanStack 등은 쿼리 단위라 무효화로 맞춤\n"}, {"id": "n06", "num": "6", "title": "네트워크·인증·보안", "md": "# 6. 네트워크·인증·보안\n\n<strong>이 파트는 뭐냐:<\/strong> 브라우저와 서버 사이의 선(HTTP·캐시·API), 그 위에서 신원을 증명하는 법(쿠키·세션·토큰·OAuth), 그 신원과 페이지를 노리는 공격(XSS·CSRF)과 방어, 선이 끊길 때(실시간·재연결·오프라인·웹뷰 브릿지)를 다룬다. 한 줄 요약: <strong>네트워크는 실패하고 순서가 섞이며, 인증은 그 와중에도 한 번만 갱신돼야 한다.<\/strong>\n\n## 1. HTTP 기본기\n\n### 메서드의 안전성과 멱등성 (Safe & Idempotent Methods)\n\n- <strong>뭐야:<\/strong> HTTP 메서드의 두 성질이다. 안전은 의미상 읽기 전용, 즉 클라이언트가 서버 상태 변경을 요청하지 않는다는 뜻이고(로그 기록 같은 부수 효과까지 금지하진 않는다), <strong>멱등<\/strong>은 같은 요청을 여러 번 보내도 서버에 의도된 효과가 한 번 보낸 것과 같다는 뜻이다.\n- <strong>왜:<\/strong> 이 구분 없이 재시도하거나 GET에 상태 변경을 두면 사고가 난다. 타임아웃 후 자동 재시도로 지급이 두 번 되고, 상태를 바꾸는 GET을 링크 미리보기·프리페치가 호출한다.\n- <strong>어떻게:<\/strong>\n  - <strong>안전(safe)<\/strong>: 의미상 읽기 전용. GET, HEAD, OPTIONS, TRACE\n  - <strong>멱등(idempotent)<\/strong>: 같은 요청 여러 번의 <strong>의도된 효과<\/strong>가 한 번과 같다. 안전한 메서드 + PUT, DELETE\n  - POST·PATCH는 멱등이 보장되지 않는다(예: \"수량 +1\" 패치)\n  - 멱등 ≠ 응답이 같다. DELETE 두 번째는 404여도 <strong>서버 상태<\/strong>는 같다\n  - 자동 재시도는 멱등 요청만, POST는 <strong>멱등 키<\/strong>(5파트 참고)가 있을 때만\n- <strong>핵심:<\/strong> 멱등은 <strong>응답이 아니라 서버 상태<\/strong> 기준. <strong>자동 재시도는 멱등한 요청에만<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"PUT과 PATCH 차이를 멱등성으로 설명하면?\" → PUT은 \"전체를 이 값으로\"라 몇 번 보내도 같다. PATCH는 변경 연산이라 연산에 따라 다르다.\n  - \"GET은 언제 위험한가요?\" → 상태를 바꾸는 GET은 프리페치·크롤러·CSRF(이미지 태그)로 호출된다.\n- <strong>출처:<\/strong> [RFC 9110 §9.2](https://www.rfc-editor.org/rfc/rfc9110.html#section-9.2.1) · [MDN — Idempotent](https://developer.mozilla.org/en-US/docs/Glossary/Idempotent)\n\n### 상태 코드: 401 vs 403과 그 너머 (Status Codes)\n\n- <strong>뭐야:<\/strong> 서버가 응답 결과를 숫자로 알려 주는 표시다. 401은 \"유효한 인증 정보가 없다\", 403은 \"요청은 이해했지만 거절한다\"는 뜻이다. 403은 로그인 여부와 무관하게 쓰일 수 있고, 자격 증명을 다시 보내도 결과가 같다.\n- <strong>왜:<\/strong> 둘을 섞으면 403을 \"인증 문제\"로 보고 토큰을 갱신한다. 갱신해도 403이라 갱신·재시도가 끝없이 돌 수 있다.\n- <strong>어떻게:<\/strong>\n  - <strong>401<\/strong>: 인증이 없거나 무효(만료 토큰, 서명 오류). 스펙상 `WWW-Authenticate` 헤더로 인증 방식을 알린다 → <strong>갱신·재로그인으로 풀릴 수 있다<\/strong>\n  - <strong>403<\/strong>: <strong>허락되지 않음<\/strong>(권한, 플랜, 소유권). RFC 9110은 같은 자격 증명으로 자동 반복하지 말라(SHOULD NOT)고 하고, 자격 증명과 무관한 이유로도 거절될 수 있다고 본다\n  - 404: 없음(존재를 숨기려고 403 대신 쓰기도 함). 409: 충돌(중복, 버전 불일치). 422: 형식은 맞는데 의미상 거절. 429: 너무 많음(`Retry-After`는 초 또는 날짜, 503에도 붙는다)\n  - 403 이유가 여럿이면 <strong>본문의 업무 코드<\/strong>(`customCode` 등)로 가른다. 상태 코드만 보면 다른 거절을 뭉갠다\n  - 재시도 대상 분류: 네트워크 오류·일부 5xx·408·429 → 재시도 후보(5섹션 참고) / 401 → 갱신 후 1회 재시도 / 403·그 밖의 4xx → 재시도 금지\n- <strong>핵심:<\/strong> <strong>401은 \"누구냐\", 403은 \"안 돼\"<\/strong>. 갱신 대상은 <strong>401뿐<\/strong>이고, 403의 이유는 <strong>업무 코드<\/strong>로 가른다.\n- <strong>꼬리질문:<\/strong>\n  - \"서버가 만료 토큰에 403을 주면요?\" → 상태 코드만 믿으면 갱신을 못 한다. 계약을 맞추거나 본문 코드로 \"만료\"만 갱신 대상으로 둔다.\n  - \"갱신 대상이 아닌 에러가 재시도 경로에 들어가면?\" → 실패-재시도 루프가 되고, 폴링이면 주기마다 반복된다.\n- <strong>출처:<\/strong> [RFC 9110 §15.5.4](https://www.rfc-editor.org/rfc/rfc9110.html#section-15.5.4) · [MDN — Retry-After](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Retry-After)\n\n### HTTP 캐시: Cache-Control, ETag, 304\n\n- <strong>뭐야:<\/strong> 브라우저·CDN이 받은 응답을 저장해 두고 다시 쓰는 규칙이다. `Cache-Control`이 얼마나 재사용할지 정하고, `ETag`와 304로 \"바뀌었나\"만 짧게 확인한다.\n- <strong>왜:<\/strong> 설정을 모르면 배포했는데 브라우저가 옛 JS를 쓴다. 반대로 같은 큰 응답을 매번 다시 받는다.\n- <strong>어떻게:<\/strong>\n  - `max-age=N`: N초간 묻지 않고 재사용. `no-cache`: 저장하되 <strong>쓸 때마다 재검증<\/strong>. `no-store`: 저장 금지. `private`: 브라우저만, `public`: 공유 캐시(CDN)도 저장\n  - <strong>재검증<\/strong>: `ETag`·`Last-Modified`를 받았으면 다음 요청에 `If-None-Match`/`If-Modified-Since`를 싣는다. 안 바뀌었으면 <strong>304<\/strong>(본문 없음)\n  - 정적 자산: 해시 파일명(`app.3f2a.js`) + `max-age=1년, immutable`. HTML은 `no-cache`로 매번 확인 → 새 해시 파일을 가리킨다(7파트 참고)\n  - `stale-while-revalidate`: 낡은 응답을 먼저 쓰고 뒤에서 갱신(TanStack Query stale과 같은 발상)\n- <strong>핵심:<\/strong> <strong>no-cache는 \"캐시하지 마\"가 아니라 \"매번 확인\"<\/strong>, 금지는 <strong>no-store<\/strong>. 해시 파일명 + 긴 max-age, HTML은 재검증.\n- <strong>꼬리질문:<\/strong>\n  - \"304면 요청이 안 나간 건가요?\" → 나갔다. 본문 전송만 아꼈다. 안 나가려면 max-age 안의 fresh 캐시여야 한다.\n  - \"인증된 API 응답을 CDN이 캐시하면?\" → 남에게 내 데이터가 간다. `Authorization` 요청 응답은 기본적으로 공유 캐시가 재사용하지 않지만 `public`·`s-maxage`·`must-revalidate`가 붙으면 재사용할 수 있다. 사용자별 응답은 `private`·`no-store`.\n- <strong>출처:<\/strong> [MDN — Cache-Control](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Cache-Control) · [MDN — HTTP caching](https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching#common_caching_patterns)\n\n### HTTP/1.1 vs HTTP/2 vs HTTP/3\n\n- <strong>뭐야:<\/strong> 같은 HTTP 의미를 실어 나르는 전송 방식의 세대 차이다. 1.1은 연결 하나에서 요청이 줄을 서고, 2는 연결 하나에 여러 요청을 섞어 보내며, 3은 UDP 기반 QUIC 위에서 스트림을 서로 독립시킨다.\n- <strong>왜:<\/strong> 차이를 모르면 작은 요청 수십 개가 줄 서서 느리게 오는 이유를 설명하지 못한다. \"HTTP/2면 번들을 쪼개도 되나요?\" 같은 질문에도 근거 없이 답하게 된다.\n- <strong>어떻게:<\/strong>\n  - <strong>HTTP/1.1<\/strong>: 한 연결에서 <strong>순서대로<\/strong>. 앞이 느리면 뒤가 막힌다(HOL). 브라우저는 도메인당 연결 약 6개로 우회\n  - <strong>HTTP/2<\/strong>: 연결 하나에 여러 스트림을 <strong>다중화(multiplexing)<\/strong>. 바이너리 프레임, 헤더 압축(HPACK). 단 TCP 위라 <strong>패킷 하나 손실이 모든 스트림을 멈춘다<\/strong>(TCP 레벨 HOL). 주의: 서버 푸시는 Chrome 106에서 기본 비활성화돼 사실상 폐기, 대안은 `103 Early Hints`·preload\n  - <strong>HTTP/3<\/strong>: <strong>QUIC(UDP)<\/strong> 위 스트림별 손실 복구로 TCP HOL이 없다. 전송·TLS 1.3 핸드셰이크를 합쳐 빠르고, 연결 ID로 IP가 바뀌어도 유지(connection migration)\n- <strong>핵심:<\/strong> 1.1은 <strong>줄 서기<\/strong>, 2는 <strong>다중화(TCP HOL 남음)<\/strong>, 3은 <strong>QUIC 스트림 독립 + 망 전환에 강함<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"HTTP/2에서 SSE 연결 수 제한은요?\" → 1.1에선 브라우저+도메인당 6개 제한에 SSE가 하나씩 물려 탭이 많으면 막힌다. 2에선 스트림이라 기본 약 100개로 완화된다.\n  - \"모바일에서 HTTP/3가 좋은 이유는?\" → 손실 잦은 무선망에서 HOL이 없고, 망이 바뀌어도 재연결하지 않는다.\n- <strong>출처:<\/strong> [MDN — Evolution of HTTP](https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Evolution_of_HTTP) · [Chrome — Removing Push](https://developer.chrome.com/blog/removing-push)\n\n### HTTPS와 TLS 핵심 (TLS Essentials)\n\n- <strong>뭐야:<\/strong> HTTPS는 HTTP를 TLS로 감싼 것이다. TLS는 통신을 암호화하고, 내용이 바뀌지 않았는지 확인하고, 인증서로 상대 서버가 진짜인지 증명한다.\n- <strong>왜:<\/strong> 모르면 카메라·Service Worker가 http에서 안 되는 이유를 놓친다. \"HTTPS가 뭘 지켜 주나요?\"에 \"암호화\"만 답하게 된다.\n- <strong>어떻게:<\/strong>\n  - 세 가지: <strong>기밀성<\/strong>(암호화), <strong>무결성<\/strong>(변조 감지), <strong>인증<\/strong>(인증서로 서버 신원 증명)\n  - 키 교환으로 세션 키를 합의한 뒤 대칭 키로 암호화. TLS 1.3은 1-RTT(1.2는 2-RTT), 재접속 0-RTT는 재전송(replay) 위험이 있다\n  - <strong>HSTS<\/strong>: \"앞으로 https로만\" 헤더. <strong>첫 접속<\/strong>은 못 지켜 preload 목록으로 보완\n  - Service Worker 등 강력한 API는 <strong>보안 컨텍스트<\/strong>(https, `localhost` 루프백)에서만. `isSecureContext`로 확인\n- <strong>핵심:<\/strong> TLS는 <strong>암호화 + 무결성 + 서버 신원 인증<\/strong>. 강력한 브라우저 API는 <strong>보안 컨텍스트<\/strong> 필수.\n- <strong>꼬리질문:<\/strong>\n  - \"HTTPS면 XSS도 막나요?\" → 아니다. 전송 구간만 지킨다.\n  - \"실기기에서 로컬 개발 서버로 카메라를 테스트하려면?\" → localhost가 아니면 막힌다. https 터널이 필요하다.\n- <strong>출처:<\/strong> [MDN — Secure contexts](https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Secure_Contexts) · [Cloudflare — TLS 1.3](https://blog.cloudflare.com/rfc-8446-aka-tls-1-3/)\n\n### REST vs GraphQL (Over-fetching / Under-fetching)\n\n- <strong>뭐야:<\/strong> API를 설계하는 두 방식이다. REST는 리소스마다 URL을 두고 서버가 응답 모양을 정하며, GraphQL은 엔드포인트 하나에 클라이언트가 필요한 필드만 골라 질의한다.\n- <strong>왜:<\/strong> REST를 리소스 단위 엔드포인트로만 쓰면 목록 카드에 이름 하나 쓰려고 회원 상세 전체를 받거나(오버페칭), 화면 하나에 회원·좌석·이용권을 따로 불러 왕복이 세 번이 된다(언더페칭). 이 비용과 GraphQL의 대가를 비교해야 고를 수 있다.\n- <strong>어떻게:<\/strong>\n  - <strong>REST<\/strong>: 리소스마다 URL, 응답 모양은 서버가 정한다. URL이 캐시 키라 <strong>HTTP 캐시·CDN<\/strong>을 그대로 쓴다\n  - <strong>GraphQL<\/strong>: 단일 엔드포인트에 <strong>필요한 필드만<\/strong> 질의, 여러 리소스를 한 요청에. 타입 스키마가 계약\n  - 대가: 보통 POST라 HTTP 캐시가 어렵다 → <strong>정규화 캐시<\/strong>(`__typename`+`id`, 5파트 참고)나 GET + persisted query. 서버는 N+1을 DataLoader 배치로, 과한 질의는 깊이·복잡도 제한으로 막는다\n- <strong>핵심:<\/strong> GraphQL은 <strong>오버·언더페칭을 없애는<\/strong> 대신 <strong>HTTP 캐시·서버 비용 통제<\/strong>를 직접 챙긴다.\n- <strong>꼬리질문:<\/strong>\n  - \"왜 GraphQL을 안 골랐나요?\" → 응답 모양이 고정돼도 충분하고 캐시·복잡도 제한 운영 비용이 더 크면 REST가 낫다. 오버페칭은 화면용 엔드포인트(BFF)로 줄인다.\n- <strong>출처:<\/strong> [GraphQL — Learn](https://graphql.org/learn/) · [GraphQL — Caching](https://graphql.org/learn/caching/) · [GraphQL — Performance](https://graphql.org/learn/performance/)\n\n> 한 줄 정리: 재시도는 멱등성, 갱신은 401만, 캐시는 해시 파일명과 재검증, 프로토콜은 HOL을 어디서 끊나, API 스타일은 누가 응답 모양을 정하나.\n\n## 2. 브라우저 보안 모델\n\n### 동일 출처 정책 (Same-Origin Policy)\n\n- <strong>뭐야:<\/strong> 브라우저가 한 출처(스킴+호스트+포트)의 스크립트가 다른 출처의 응답을 읽지 못하게 막는 기본 규칙이다. 쓰기와 임베드는 허용하고 <strong>읽기<\/strong>를 막는다.\n- <strong>왜:<\/strong> 이걸 모르면 \"CORS가 왜 있나요?\"에 답할 수 없다. CORS는 이 정책의 예외라 막는 쪽을 먼저 알아야 한다. 다른 도메인 iframe의 DOM을 못 읽고 `localStorage`가 서브도메인끼리 공유되지 않는 이유도 여기 있다.\n- <strong>어떻게:<\/strong>\n  - <strong>출처(origin)<\/strong> = 스킴 + 호스트 + 포트. 셋 중 하나만 달라도 다른 출처다(`http`↔`https`, `a.` ↔ `b.` 서브도메인)\n  - 막는 것: 다른 출처 응답을 <strong>JS가 읽기<\/strong>, 다른 출처 iframe의 DOM 접근(`postMessage` 등만 허용)\n  - 허용하는 것: <strong>쓰기<\/strong>(폼 제출, 링크, 리다이렉트)와 <strong>임베드<\/strong>(`<img>`·`<script>`·`<link>`·`<iframe>`). 그래서 CSRF가 가능하다\n  - 저장소도 출처별(Web Storage·IndexedDB). 쿠키만 도메인 기준이다\n- <strong>핵심:<\/strong> SOP는 <strong>읽기를 막고 쓰기·임베드는 허용<\/strong>한다. CORS는 SOP의 <strong>예외 허가<\/strong>다.\n- <strong>꼬리질문:<\/strong>\n  - \"SOP가 있는데 CSRF가 왜 되나요?\" → <strong>보내기<\/strong>는 막지 않아서다. 응답을 못 읽어도 요청만으로 목적을 이룬다.\n  - \"site와 origin 차이는?\" → origin은 스킴+호스트+포트, site는 등록 가능한 도메인(eTLD+1, 스킴 포함). SameSite 쿠키는 site 기준이다.\n- <strong>출처:<\/strong> [MDN — Same-origin policy](https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Same-origin_policy)\n\n### CORS와 preflight\n\n- <strong>뭐야:<\/strong> CORS는 서버가 응답 헤더로 \"이 출처는 읽어도 된다\"고 허락하는 방식이다. preflight는 그 허락을 실제 요청 전에 OPTIONS로 먼저 물어보는 단계다.\n- <strong>왜:<\/strong> 모르면 Postman에선 되는데 브라우저에선 CORS 에러가 나는 이유, `Authorization`을 붙이자 OPTIONS가 먼저 나가는 이유, 쿠키를 보내려니 `*`가 거부되는 이유를 설명하지 못한다.\n- <strong>어떻게:<\/strong>\n  - CORS는 <strong>브라우저가<\/strong> 다른 출처 응답을 JS에 넘길지 판정하는 규칙. 서버 간 통신·Postman엔 없다. <strong>사용자를 지키는 장치<\/strong>\n  - 단순 요청(GET/HEAD/POST + 안전 목록 헤더 + `x-www-form-urlencoded`·`multipart/form-data`·`text/plain`)은 바로 보내고 응답 헤더로 판정\n  - 그 외(PUT/DELETE, `application/json`, `Authorization` 등)는 <strong>preflight<\/strong>: OPTIONS로 먼저 묻는다. `Access-Control-Max-Age`로 캐시(브라우저 상한 우선)\n  - 쿠키 동반: `credentials: 'include'` + `Access-Control-Allow-Credentials: true` + <strong>구체적 오리진<\/strong>. 이때 Allow-Origin·Headers·Methods 모두 `*` 불가\n  - 우회: 같은 출처 프록시(Next.js rewrites, BFF)면 CORS 자체가 없다\n- <strong>핵심:<\/strong> CORS는 <strong>브라우저의 읽기 허가<\/strong>. JSON·커스텀 헤더면 <strong>preflight<\/strong>, 쿠키 동반이면 <strong>와일드카드 금지<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"CORS 에러면 요청은 서버에 안 간 건가요?\" → 단순 요청은 서버에서 처리된다. 응답을 JS에 안 넘길 뿐이라 CORS는 CSRF 방어가 아니다.\n- <strong>출처:<\/strong> [MDN — CORS](https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS#simple_requests)\n\n### 쿠키 속성: HttpOnly, Secure, SameSite\n\n- <strong>뭐야:<\/strong> 쿠키에 붙이는 안전 설정이다. HttpOnly는 JS가 못 읽게, Secure는 https에서만 보내게, SameSite는 다른 사이트발 요청에 실을지를 정한다.\n- <strong>왜:<\/strong> 설정이 틀리면 로그인 쿠키를 JS로 읽어 XSS 한 번에 세션이 털린다. 반대로 결제 리다이렉트 복귀 때 쿠키가 안 실려 로그아웃된 것처럼 보인다.\n- <strong>어떻게:<\/strong>\n  - `HttpOnly`: JS(`document.cookie`)로 못 읽는다. XSS의 <strong>탈취<\/strong>는 막지만 대신 요청 보내기는 못 막는다\n  - `Secure`: https에서만 전송\n  - `SameSite`: 다른 <strong>사이트<\/strong>발 요청에 쿠키를 실을지. `Strict`(절대 안 실음) / `Lax`(교차 사이트에선 <strong>최상위 이동 + GET 등 안전 메서드<\/strong>만) / `None`(항상, 단 `Secure` 필수)\n  - 주의: Chrome 80(2020년 2월)부터 SameSite 미지정 쿠키를 `Lax`로 취급하고 `None`엔 `Secure`를 요구. 기본 Lax는 생성 2분 안 최상위 POST를 예외 허용. 브라우저마다 기본값이 다르다\n  - site ≠ origin: `a.example.com`과 `b.example.com`은 다른 출처지만 <strong>같은 사이트<\/strong>\n- <strong>핵심:<\/strong> <strong>HttpOnly는 탈취 방지<\/strong>, <strong>Secure는 평문 전송 방지<\/strong>, <strong>SameSite는 교차 사이트 전송 제어<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"Lax면 CSRF가 완전히 막히나요?\" → 교차 POST는 막지만(Chrome 기본 Lax의 2분 예외 제외) GET 이동은 실린다. 상태 변경 GET이나 하위 도메인이 뚫리면 위험하다.\n  - \"로그아웃했는데 쿠키가 남는다면?\" → 삭제(`Max-Age=0`)는 설정 때와 같은 Domain·Path여야 먹는다. 역할별 쿠키는 각각 지운다.\n- <strong>출처:<\/strong> [MDN — Set-Cookie](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie) · [web.dev — SameSite cookies](https://web.dev/articles/samesite-cookies-explained)\n\n### XSS와 방어 (Cross-Site Scripting)\n\n- <strong>뭐야:<\/strong> 공격자가 넣은 스크립트가 우리 페이지 안에서 실행되는 공격이다. 사용자 입력이 코드로 해석돼 피해자 브라우저에서 돈다.\n- <strong>왜:<\/strong> 사용자 입력을 HTML로 그리는 순간(게시글·마크다운) 위험해진다. 방어가 없으면 공격자 스크립트가 피해자 권한으로 실행된다.\n- <strong>어떻게:<\/strong>\n  - 유형: 저장형(DB), 반사형(URL 파라미터 출력), DOM 기반(JS가 입력을 `innerHTML` 등에 꽂음)\n  - React는 JSX 텍스트를 <strong>자동 이스케이프<\/strong>한다. 구멍은 `dangerouslySetInnerHTML`, `href`/`src`의 사용자 URL(`javascript:`), `ref`로 직접 `innerHTML`. 주의: React 19는 `javascript:` URL을 막는 값으로 바꾼다(18은 경고만)\n  - HTML이 꼭 필요하면 <strong>sanitize<\/strong>(DOMPurify) 후 넣는다. URL은 `http`/`https` 등 허용 스킴만\n  - <strong>CSP<\/strong>(`Content-Security-Policy`): 실행 가능한 스크립트를 제한. 허용 목록보다 nonce·hash 기반 strict CSP 권장, `unsafe-inline`은 CSP를 무력화. sanitize의 대체가 아닌 <strong>2차 방어선<\/strong>\n  - `localStorage` 토큰은 XSS 한 번에 탈취된다. HttpOnly 쿠키도 XSS가 대신 요청을 보내는 건 못 막는다\n- <strong>핵심:<\/strong> 1차는 <strong>이스케이프·sanitize<\/strong>, 2차는 <strong>CSP<\/strong>. React의 구멍은 <strong>dangerouslySetInnerHTML과 URL 속성<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"CSP를 도입하면 대가는?\" → 인라인 스크립트·`eval`·외부 스크립트를 전수 정리해야 한다. 처음엔 `Report-Only` 헤더로 위반만 수집한다.\n  - \"남의 사이트가 우리 페이지를 iframe에 띄워 클릭을 훔치면?\" → 클릭재킹. CSP `frame-ancestors 'none'`이 정석, `X-Frame-Options: DENY`는 구형 대응. JS 프레임 탈출은 우회된다.\n- <strong>출처:<\/strong> [OWASP — XSS Prevention](https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html) · [MDN — CSP](https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP) · [OWASP — Clickjacking](https://cheatsheetseries.owasp.org/cheatsheets/Clickjacking_Defense_Cheat_Sheet.html)\n\n### CSRF와 SameSite (Cross-Site Request Forgery)\n\n- <strong>뭐야:<\/strong> 사용자가 로그인한 상태를 악용해 다른 사이트가 우리 서버로 요청을 보내게 만드는 공격이다. 브라우저가 쿠키를 알아서 실어 주기 때문에 서버는 본인 요청으로 착각한다.\n- <strong>왜:<\/strong> 막지 않으면 로그인한 채 악성 사이트를 열었을 때 그 폼이 우리 서버로 POST를 보내고, 쿠키의 SameSite 설정이 허용하는 한 브라우저가 쿠키를 <strong>자동으로<\/strong> 싣는다.\n- <strong>어떻게:<\/strong>\n  - 전제: <strong>자동 전송되는 자격 증명<\/strong>(쿠키, HTTP Basic)일 때만. `Bearer` 헤더는 JS가 붙여야 해 CSRF 대상이 아니다(대신 XSS에 노출)\n  - 주 방어: <strong>CSRF 토큰<\/strong>(서버 세션 토큰 또는 서명된 double-submit 쿠키) — 요청에 함께 보내 서버가 대조. 공격 사이트는 SOP 때문에 그 값을 못 읽는다\n  - 다른 주 방어: 커스텀 헤더 요구(교차 출처면 preflight가 걸림), <strong>Fetch Metadata<\/strong>(`Sec-Fetch-Site`) 검사(`Origin`/`Referer` 검증 폴백 필수)\n  - <strong>SameSite<\/strong>는 OWASP 기준 <strong>보조<\/strong>. 상태 변경 GET·하위 도메인·브라우저 차이로 단독으론 부족\n  - 상태 변경은 GET에 두지 않는다(1섹션)\n-
