자리를 예약하고, 폴백 폰트 크기를 웹폰트에 맞춘다\n  - <strong>먼저 시작하기<\/strong>: 다음 행동을 예측해 미리 요청한다. 예를 들어 hover 때 프리페치하거나, 입력 이벤트를 `keyup`보다 이른 `keydown`에서 시작한다.\n- <strong>핵심:<\/strong> 체감 성능은 <strong>기다리는 동안 무엇을 보여주나<\/strong>의 문제다. <strong>즉시 피드백 + 같은 크기의 자리표시 + 흔들림 없음<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"스켈레톤이 스피너보다 항상 낫나요?\" → 화면 구조를 예측할 수 있을 때만 낫다. 결과 모양을 모르는 검색이나 짧은 작업에는 스피너나 진행 표시가 정직하다. 스켈레톤과 실제 모양이 다르면 오히려 레이아웃 이동이 생긴다.\n  - \"체감만 좋게 하면 지표는요?\" → 스켈레톤은 실제 콘텐츠가 뜨는 시점을 앞당기지 않는다. 그래서 LCP 요소가 실제 콘텐츠라면 LCP는 그대로다. 체감과 지표를 둘 다 본다.\n- <strong>출처:<\/strong> [Perceived performance (MDN)](https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Performance/Perceived_performance)\n\n### 뒤로·앞으로 캐시 (bfcache)\n\n- <strong>뭐야:<\/strong> 브라우저가 떠나는 페이지를 JS 실행만 멈춘 채 메모리에 통째로 보관했다가, 뒤로·앞으로 이동 때 그대로 되살리는 캐시다.\n- <strong>왜:<\/strong> bfcache가 막히면 다른 페이지로 갔다가 뒤로가기할 때 페이지를 처음부터 다시 받아 실행한다. 비동기로 그리는 목록은 스크롤 위치 복원도 어긋나기 쉽다. 같은 사이트인데 어떤 페이지만 뒤로가기가 즉시인 것도 bfcache가 되는 페이지와 막힌 페이지의 차이다.\n- <strong>어떻게:<\/strong>\n  - 브라우저가 떠나는 페이지의 JS 실행을 멈춘 채 <strong>메모리에 통째로 보관<\/strong>했다가 뒤로·앞으로 이동 때 그대로 되살린다.\n  - SPA 안의 클라이언트 라우팅 이동은 bfcache 대상이 아니다.\n  - 막는 것은 넷이다. <strong>`unload` 리스너<\/strong>가 가장 큰 원인이고, `pagehide`로 바꾼다([1파트 참고](#n01/페이지-이탈-시-데이터-보내기-visibilitychange-pagehide-sendbeacon \"페이지 이탈 시 데이터 보내기\")). HTML의 `Cache-Control: no-store`도 막는다(주의: web.dev 기준 Chrome이 이 조건 완화 작업 중). 열린 IndexedDB와 진행 중인 fetch도 막는다. 열린 WebSocket은 브라우저에 따라 막는다(주의: web.dev 기준 Chrome 149+와 Safari는 막지 않는다). `window.opener` 참조도 막는다.\n  - 복원 감지: `pageshow` 이벤트에서 `event.persisted === true`이면 bfcache에서 되살아난 것이다. 이때 오래된 데이터를 갱신하고 세션을 다시 확인한다.\n  - 진단: DevTools <strong>Application → Back/forward cache<\/strong> 패널과 `NotRestoredReasons` API로 확인한다.\n- <strong>핵심:<\/strong> bfcache는 <strong>공짜 즉시 로딩<\/strong>이다. 막는 건 대부분 <strong>`unload`·`no-store`·열린 연결<\/strong>이고, 복원은 `pageshow.persisted`로 안다.\n- <strong>꼬리질문:<\/strong>\n  - \"복원된 페이지에 로그아웃 전 화면이 남으면요?\" → `pageshow`에서 `persisted`면 세션을 다시 확인한다. 민감한 화면은 갱신하거나 리다이렉트한다. 무조건 `no-store`로 막으면 모든 사용자가 즉시 복원을 잃는다.\n  - \"bfcache가 늘면 지표가 나빠질 수 있다던데?\" → 빠른 재방문이 일반 로드 통계에서 빠져서 분포가 느려 보일 수 있다. 복원은 별도 방문으로 보고 INP·CLS를 0부터 다시 잰다.\n- <strong>출처:<\/strong> [Back/forward cache (web.dev)](https://web.dev/articles/bfcache)\n\n### 성능 예산 (Performance Budget)\n\n- <strong>뭐야:<\/strong> 번들 크기·지표 같은 성능 값에 넘으면 안 되는 한도를 숫자로 정해 두는 것이다. 넘으면 새 기능을 넣기 전에 다른 것을 줄이거나 넣지 않는다.\n- <strong>왜:<\/strong> 한도가 없으면 한 번 최적화해 놓은 첫 화면이 기능이 붙을 때마다 조금씩 무거워진다. 석 달 뒤에는 원래대로 돌아와 있다. 어느 변경이 늘렸는지 뒤늦게 추적하기도 어렵다.\n- <strong>어떻게:<\/strong>\n  - 넘으면 안 되는 <strong>한도<\/strong>를 숫자로 정해 둔다. 종류는 셋이다. <strong>양<\/strong>은 JS·이미지 KB, 요청 수, 폰트 개수다. <strong>시점<\/strong>은 FCP·LCP 같은 사용자 중심 지표다. <strong>규칙<\/strong>은 Lighthouse 점수다.\n  - 양 기반 예산은 소통이 쉽지만 체감과 직접 연결되지는 않는다. 그래서 시점 지표 예산과 같이 건다.\n  - CI에 묶는다. 번들 KB는 `size-limit`·`bundlesize`로, 지표·점수는 Lighthouse CI로 검사한다. 넘으면 PR이 실패한다.\n  - 넘었을 때 선택지: 기존 기능을 최적화하거나, 다른 걸 빼거나, 새 기능을 넣지 않는다\n- <strong>핵심:<\/strong> 최적화는 한 번, <strong>예산은 계속<\/strong>. <strong>양·시점·규칙<\/strong> 세 종류를 CI에서 강제해야 회귀가 PR 단계에서 잡힌다.\n- <strong>꼬리질문:<\/strong>\n  - \"예산 숫자는 어떻게 정하나요?\" → 현재 실측값과 경쟁 서비스·목표 기기(저사양 안드로이드 등)에서 출발한다. 처음부터 이상적인 값을 박으면 모든 PR이 빨개져 아무도 안 본다. 그래서 현재 값으로 고정해 회귀부터 막고 점점 조인다.\n- <strong>출처:<\/strong> [Performance budgets 101 (web.dev)](https://web.dev/articles/performance-budgets-101)\n\n> 한 줄 정리: 기다림은 즉시 피드백과 같은 크기의 자리표시로 덜 느끼게, 뒤로가기는 bfcache로 공짜로, 지켜 낸 성능은 예산으로 CI에서 강제한다.\n\n## 핵심 키워드 모음\n\n- <strong>랩 vs 필드<\/strong>: 판정은 필드 p75(모바일·데스크톱 분리), 원인 추적은 랩. 랩 INP 대리 지표는 TBT지만 대체물은 아니다.\n- <strong>Performance 탭<\/strong>: 50ms 넘는 롱 태스크(빨간 삼각형·빗금), 노랑=스크립트·보라=레이아웃, Interactions 트랙, CPU 스로틀링, `scheduler.yield()`는 폴백과 함께.\n- <strong>React Profiler<\/strong>: 무엇이 왜 다시 렌더됐나. \"why rendered\" 옵션, `actualDuration` vs `baseDuration`, 주의: React 19.2 Performance Tracks, 프로덕션 측정은 profiling 빌드.\n- <strong>LCP<\/strong>: ≤2.5s·>4s, TTFB·발견·다운로드·렌더 지연 4조각. LCP 이미지에 lazy 금지, `fetchpriority=\"high\"`. 저정보량 자리표시 이미지는 후보 제외.\n- <strong>INP<\/strong>: 주의: 2024-03-12 FID 대체, ≤200ms·>500ms, 클릭·탭·키만, 50회당 최악 1개 제외. 입력 지연·처리·표시 지연. 피드백 먼저, 무거운 일 뒤로.\n- <strong>CLS<\/strong>: ≤0.1·>0.25, 세션 창(1초 간격·최대 5초) 최대 묶음, 입력 후 0.5초 제외, 자리 예약·`transform` 애니메이션.\n- <strong>TTFB·FCP<\/strong>: CWV 아닌 진단 지표. TTFB ≤0.8s, FCP ≤1.8s. TTFB→FCP→LCP 간격으로 늦는 구간을 가른다.\n- <strong>번들 분석<\/strong>: 트리맵으로 공용 청크·중복 버전 확인, parsed vs gzip 구분, 변환 전용 라이브러리는 서버 컴포넌트로.\n- <strong>코드 스플리팅<\/strong>: 총량이 아니라 비용 내는 사람을 바꾼다. 조건부 기능 1순위.\n- <strong>트리 셰이킹<\/strong>: ESM + `sideEffects`(CSS 예외) + 정적 분석 + production 빌드. 배럴 파일 주의, `optimizePackageImports`는 실험 옵션.\n- <strong>대형 모듈·WASM<\/strong>: 진입 시점·싱글플라이트·실패 정책(fail-open/closed).\n- <strong>이미지<\/strong>: 포맷·크기·시점 + 자리 예약, `srcset`/`sizes`, 디코딩 비용.\n- <strong>폰트<\/strong>: FOIT/FOUT, `font-display` swap/optional, woff2·서브셋·`unicode-range`, preload엔 crossorigin.\n- <strong>리소스 힌트<\/strong>: preconnect=연결(10초 안 쓰면 닫힘), preload=발견 앞당김(필수 요청), prefetch=다음 페이지, fetchpriority=순서만 조정. Next `<Link>` 프리페치는 프로덕션만.\n- <strong>캐시<\/strong>: 해시 자산 1년 장기 캐시·HTML 재검증, `staleTime`은 도메인 성격으로, SWR로 재방문 로딩 제거.\n- <strong>가상화<\/strong>: 덜 받기 → 리렌더 범위 → 가상화. 대가는 검색·접근성·가변 높이.\n- <strong>리렌더 줄이기<\/strong>: 측정 → 범위(내리기·children·구독 좁히기) → memo + 안정 props.\n- <strong>메모리 누수<\/strong>: 힙 스냅샷 3장 비교, Detached DOM, Retainers, cleanup·`AbortController`.\n- <strong>웹뷰<\/strong>: WKWebView·Android WebView, 저사양 기준 측정, 브릿지 타임아웃·폴백, CrUX가 WebView를 제외하니 필드 수집은 직접.\n- <strong>체감 성능<\/strong>: 즉시 피드백, 같은 크기 스켈레톤, 흔들림 제거, 예측 요청. 스켈레톤은 실제 콘텐츠 표시(LCP)를 앞당기지 않는다.\n- <strong>bfcache<\/strong>: 뒤로·앞으로 즉시 복원. `unload`·`no-store`·열린 연결이 막는다, `pageshow.persisted`로 감지.\n- <strong>성능 예산<\/strong>: 양·시점·규칙 세 종류, CI(size-limit·Lighthouse CI)로 강제, 현재 값으로 고정 후 조인다.\n"}, {"id": "n08", "num": "8", "title": "설계와 코드 품질", "md": "# 8. 설계와 코드 품질\n\n<strong>이 파트는 뭐냐:<\/strong> 코드가 \"돌아간다\" 다음 단계를 다룬다. 계약을 타입으로 강제한다. 계약은 서버와 화면처럼 두 쪽이 주고받기로 약속한 데이터 모양이다. 로직은 테스트할 수 있는 자리로 뺀다. 의존 방향을 지킨다. 실패는 사용자에게 정직하게 보여준다. 한 줄로 줄이면 이렇다. <strong>바뀔 때 어디가 깨지는지 컴파일러·테스트·경계 검사가 먼저 알려주게 만드는 것.<\/strong>\n\n## 1. TypeScript로 계약 강제하기\n\n### unknown vs any\n\n- <strong>뭐야:<\/strong> 둘 다 \"어떤 값이든 올 수 있다\"는 TS 타입이다. `any`는 타입 검사를 꺼 버린다. `unknown`은 값을 쓰기 전에 무엇인지 확인하도록 강제한다.\n- <strong>왜:<\/strong> 타입을 모르는 값을 `any`로 받으면 그 값을 쓰는 모든 곳에서 타입 검사가 꺼진다. API 응답·`JSON.parse`·`catch (e)`가 그런 값이다. 컴파일은 통과하는데 실행 중에 `undefined` 크래시가 나기 쉽다.\n- <strong>어떻게:<\/strong>\n  - `any`는 검사를 <strong>끈다<\/strong>. 어떤 속성 접근·대입도 허용된다. 그리고 전염된다. any 값에서 꺼낸 속성도 any가 된다.\n  - `unknown`은 \"뭔지 모름\"을 <strong>정직하게<\/strong> 표현한다. 그대로는 아무것도 할 수 없고, <strong>좁힌 뒤에만<\/strong> 쓸 수 있다. 좁힌다는 것은 `typeof` 같은 검사로 타입을 구체적으로 확정하는 것이다.\n  - `catch (e)`의 `e`는 설정에 따라 타입이 달라진다. 주의: TS 4.4에서 생긴 `useUnknownInCatchVariables`(`strict`에 포함)를 켜면 `e`는 `any`가 아니라 `unknown`이다.\n  - 경계에서 들어온 값은 `unknown`으로 받고 검증 함수로 좁힌다. 경계는 네트워크·스토리지·브릿지처럼 내 코드 바깥과 맞닿는 지점이다.\n- <strong>핵심:<\/strong> `any`는 검사를 <strong>끄고 전염<\/strong>시키고, `unknown`은 <strong>좁히기를 강제<\/strong>한다. 외부 입력은 `unknown`.\n- <strong>꼬리질문:<\/strong>\n  - \"`any`를 써도 되는 순간은?\" → 타입 정의가 없는 라이브러리를 감싸는 얇은 어댑터 안쪽 정도다. 어댑터 밖으로는 좁힌 타입만 내보낸다.\n  - \"`Record<string, unknown>`과 `object`의 차이는?\" → `Record<string, unknown>`은 아무 키로나 접근할 수 있고 값이 unknown이다. `object`는 원시값이 아니라는 것만 보장한다. 그래서 속성 접근이 막힌다.\n- <strong>출처:<\/strong> [useUnknownInCatchVariables (TSConfig Reference)](https://www.typescriptlang.org/tsconfig/#useUnknownInCatchVariables) · [Narrowing (TypeScript Handbook)](https://www.typescriptlang.org/docs/handbook/2/narrowing.html)\n\n### 타입 좁히기와 판별 유니온 (Narrowing, Discriminated Union)\n\n- <strong>뭐야:<\/strong> 좁히기는 `typeof`·비교 같은 검사를 거친 뒤 TS가 값의 타입을 더 구체적으로 알아듣는 것이다. 유니온은 `A | B`처럼 여러 타입 중 하나라는 뜻의 타입이다. 판별 유니온은 `kind`·`status` 같은 공통 필드 값으로 상태를 나눈 유니온 타입이다.\n- <strong>왜:<\/strong> 상태를 `{ status: string; data?: T; error?: E }`처럼 한 덩어리로 두면 \"성공인데 error가 있는\" 불가능한 상태가 타입에서 허용된다. 그래서 화면마다 `data &&`·`error &&` 검사를 제각각 쓴다.\n- <strong>어떻게:<\/strong>\n  - 좁히는 수단은 `typeof`·`instanceof`·`in`·동등 비교·사용자 정의 타입 가드(`x is T`)·`asserts x is T`다. 사용자 정의 타입 가드는 반환 타입을 `x is T`로 적어 \"true면 x는 T다\"라고 알리는 함수다.\n  - <strong>판별 유니온<\/strong>은 공통 리터럴 필드(`kind`·`status`)로 상태를 나눈다. 리터럴 필드는 `\"loading\"`처럼 정해진 값 하나만 타입으로 갖는 필드다. 이렇게 나누면 <strong>불가능한 조합을 타입에서 제거<\/strong>할 수 있다.\n  - `switch`의 `default`에서 값을 `never`에 대입하면 <strong>완전성 검사<\/strong>가 된다. `never`는 어떤 값도 올 수 없는 타입이다. 새 상태를 추가하면 처리하지 않은 곳이 컴파일 에러로 드러난다.\n  - 비교는 <strong>문자열 리터럴 유니온<\/strong>(서버 원본 값)으로 한다. 화면 문구와는 분리한다.\n  ```ts\n  type Load<T> =\n    | { status: \"loading\" }\n    | { status: \"error\"; error: Error }\n    | { status: \"success\"; data: T };\n  function assertNever(x: never): never { throw new Error(String(x)); }\n  ```\n- <strong>핵심:<\/strong> 판별 유니온은 <strong>불가능한 상태를 표현 불가능하게<\/strong> 만든다. `never` 완전성 검사로 <strong>추가 누락을 컴파일러가 잡게<\/strong> 한다.\n- <strong>꼬리질문:<\/strong>\n  - \"사용자 정의 타입 가드의 위험은?\" → `x is T`는 컴파일러가 <strong>믿기만<\/strong> 한다. 가드 구현이 틀리면 `as`와 똑같이 거짓말이 된다. 그래서 가드 자체를 테스트한다.\n  - \"enum 대신 리터럴 유니온을 쓰는 이유는?\" → 런타임 코드가 생기지 않고 서버 문자열과 바로 비교할 수 있다. 이름 붙은 상수가 필요하면 `as const` 객체를 쓴다(TS 핸드북의 대안). 배포된 ambient `const enum`은 `isolatedModules`와 같이 쓸 수 없다.\n- <strong>출처:<\/strong> [Narrowing — Discriminated unions·Exhaustiveness checking (TypeScript Handbook)](https://www.typescriptlang.org/docs/handbook/2/narrowing.html) · [Enums — Objects vs Enums (TypeScript Handbook)](https://www.typescriptlang.org/docs/handbook/enums.html)\n\n### 제네릭 기본 (Generics)\n\n- <strong>뭐야:<\/strong> 타입을 매개변수처럼 받는 문법이다. 함수·컴포넌트를 한 번만 만들어 여러 타입에 쓴다. 이때 입력과 출력 타입의 관계는 유지된다.\n- <strong>왜:<\/strong> 제네릭이 없으면 목록 훅·테이블 컴포넌트를 도메인마다 복사하게 된다. 공용으로 만들더라도 `any[]`로 받아서 타입이 사라진다.\n- <strong>어떻게:<\/strong>\n  - 제네릭은 <strong>입력과 출력 타입의 관계<\/strong>를 표현한다: `function first<T>(xs: T[]): T | undefined`\n  - <strong>제약<\/strong>(`T extends { id: string }`)을 걸어 필요한 최소 모양만 요구한다.\n  - 호출부에서 타입 인자를 적지 않아도 보통 <strong>추론<\/strong>되게 설계한다. 직접 적어야만 쓸 수 있다면 설계를 의심한다.\n  - 유틸리티 타입에는 `Pick`·`Omit`·`Partial`·`ReturnType`·`Awaited`가 있다. 조건부 타입과 `infer`는 필요할 때만 쓴다.\n  - 공용 컴포넌트는 `<Table<Row>>`처럼 만든다. 행 타입이 컬럼 정의와 렌더 함수까지 흐르게 한다.\n- <strong>핵심:<\/strong> 제네릭은 <strong>\"아무거나\"가 아니라 \"들어온 타입을 그대로 나가게\"<\/strong> 하는 도구다. <strong>제약은 최소, 추론은 최대<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"제네릭이 과하면?\" → 조건부 타입이 겹겹이 쌓이면 에러 메시지를 읽을 수 없고 컴파일도 느려진다. 호출부가 2~3곳이면 구체 타입이 나을 때가 많다.\n- <strong>출처:<\/strong> [Generics (TypeScript Handbook)](https://www.typescriptlang.org/docs/handbook/2/generics.html)\n\n### as 캐스팅이 숨기는 계약 위반 (Type Assertion)\n\n- <strong>뭐야:<\/strong> `as`는 값을 바꾸지 않고 컴파일러에게 \"이 값은 이 타입이라고 믿어라\"라고 선언하는 문법이다.\n- <strong>왜:<\/strong> 응답 타입이 안 맞아 뜬 빨간 줄을 `as Foo`로 덮으면 문제가 숨는다. 백엔드가 필드를 바꿔도 컴파일은 통과한다. 그리고 운영에서 터진다.\n- <strong>어떻게:<\/strong>\n  - `as`는 <strong>변환이 아니라 \"내 말을 믿어\"<\/strong> 선언이다. 런타임에는 아무것도 하지 않는다.\n  - `as unknown as T`처럼 두 번 캐스팅하면 사실상 검사를 끈 것이다.\n  - 대안은 세 가지다. 타입을 <strong>실제 계약(배포 스펙)에 맞게 고치기<\/strong>, 경계에서 런타임 검증하기, 타입 가드 쓰기다.\n  - `satisfies`(주의: TS 4.9 도입)는 값이 이 모양을 만족하는지 검사하되 추론된 구체 타입은 유지한다. 오타와 빠진 키를 잡으면서 값 타입이 넓어지지 않는다. 그래서 캐스팅 대신 쓸 자리가 많다.\n  - nullable을 거짓으로 선언한 타입도 같은 부류의 거짓말이다. `string`이라 했는데 실제로는 `null`이 오는 경우다.\n- <strong>핵심:<\/strong> `as`는 <strong>컴파일러의 입을 막는 것<\/strong>이다. 계약이 바뀌면 깨져야 할 곳이 <strong>조용히 통과<\/strong>한다.\n- <strong>꼬리질문:<\/strong>\n  - \"캐스팅을 걷어낼 때 뭐부터 하나요?\" → 실제 응답이 어떤지 배포 스펙과 실측으로 먼저 확인한다. 추측으로 타입을 고치면 거짓말의 내용만 바뀐다.\n  - \"`!`(non-null assertion)는요?\" → 같은 부류다. null이 아님을 보장하는 흐름이 없으면 좁히기나 기본값으로 바꾼다.\n- <strong>출처:<\/strong> [TypeScript 4.9 — The satisfies Operator](https://www.typescriptlang.org/docs/handbook/release-notes/typescript-4-9.html)\n\n### 런타임 검증과 경계 (zod, Parse Don't Validate)\n\n- <strong>뭐야:<\/strong> 밖에서 들어온 값이 기대한 모양인지 실행 중에 실제로 확인하는 것이다. zod는 스키마 하나로 그 검증과 TS 타입을 같이 만드는 라이브러리다.\n- <strong>왜:<\/strong> TS 타입만 믿으면 실행 중에 깨진다. 타입은 빌드 뒤에 사라지기 때문이다. 서버·브릿지·URL 쿼리·localStorage에서 들어온 값은 타입을 무엇이라 선언했든 실제로는 아무 값이나 올 수 있다.\n- <strong>어떻게:<\/strong>\n  - <strong>경계에서 한 번<\/strong> 검증한다. 안쪽 코드는 검증된 타입만 다룬다(parse, don't validate).\n  - zod(주의: 2026-10 문서 기준 Zod 4)는 스키마 하나로 <strong>런타임 검증 + `z.infer` 타입<\/strong>을 동시에 만든다. 타입과 검증을 따로 관리하지 않아도 된다. 변환을 쓰면 `z.input`과 `z.output`이 달라진다.\n  - `safeParse`는 성공/실패 판별 유니온을 돌려준다. 그 결과로 사용자 문구와 로그를 분기한다. `parse`는 `ZodError`를 던진다.\n  - 비용은 번들 크기와 파싱 시간이다. 큰 응답 전체를 검증하면 비싸다. 그래서 <strong>신뢰도 낮은 경계<\/strong>(외부 연동·브릿지·폼 입력·URL)부터 건다.\n  - 응답 일부만 손상됐을 때는 전체를 실패로 처리하는 대신 <strong>항목 단위로 격리<\/strong>하는 정규화도 선택지다.\n- <strong>핵심:<\/strong> 타입은 <strong>컴파일 타임 약속<\/strong>, 검증은 <strong>런타임 확인<\/strong>이다. 검증은 <strong>경계에서 한 번<\/strong>, 안쪽은 믿는다.\n- <strong>꼬리질문:<\/strong>\n  - \"모든 API 응답을 zod로 검증하나요?\" → 자사 백엔드이고 OpenAPI에서 생성한 타입이 있으면 비용에 비해 효과가 작을 수 있다. 외부 클라이언트나 구버전 클라이언트가 섞이는 경계부터 건다.\n  - \"검증 실패하면 화면은?\" → 전체를 오류로 만들지, 깨진 항목만 빼고 보여줄지는 도메인에 따라 정한다. 정산처럼 틀리면 안 되는 화면은 오류로 처리한다. 목록 표시는 격리가 낫다.\n- <strong>출처:<\/strong> [Basic usage (Zod)](https://zod.dev/basics)\n\n> 한 줄 정리: 외부는 unknown으로 받아 경계에서 검증하고, 상태는 판별 유니온으로, `as`로 입을 막지 않는다.\n\n## 2. 컴포넌트 설계\n\n### 관심사 분리와 순수 함수 추출 (Separation of Concerns, Pure Functions)\n\n- <strong>뭐야:<\/strong> 한 코드가 한 가지 일만 하도록 계산·효과·표시를 나누는 것이다. 순수 함수는 같은 입력에 늘 같은 출력을 내고 바깥을 건드리지 않는 함수다.\n- <strong>왜:<\/strong> 나누지 않으면 계산·API 호출·DOM 측정·렌더가 한 컴포넌트에 섞여 수천 줄이 된다. 로직 하나를 테스트하려 해도 화면을 띄워야 한다. 테스트 비용이 커져서 테스트를 잘 안 쓰게 된다.\n- <strong>어떻게:<\/strong>\n  - 세 층으로 나눈다. <strong>순수 계산<\/strong>은 입력을 받아 출력만 내고 부수효과가 없다. <strong>효과<\/strong>는 API·DOM·타이머를 다루며 훅에 둔다. <strong>표시<\/strong>는 props를 받아 JSX를 낸다. 부수효과는 함수가 값을 돌려주는 것 말고 바깥 상태를 바꾸는 일이다.\n  - 판정·변환·계획 수립은 순수 함수로 뺀다. 그러면 <strong>DOM·네트워크 없이 유닛 테스트<\/strong>할 수 있다.\n  - \"계획\"과 \"실행\"을 분리한다. 무엇을 할지 목록을 만드는 함수와, 그 목록을 API로 실행하는 코드를 뗀다. 그러면 실행 전에 검사하거나 미리 보여줄 수 있다.\n  - 훅은 효과를 감싸고 순수 함수를 호출하는 얇은 접착층이다. 부수효과는 렌더 중이 아니라 이벤트 핸들러에 둔다. 그럴 수 없을 때만 Effect에 둔다([3파트 참고](#n03/렌더와-커밋-단계-render-commit-phase \"렌더와 커밋 단계\")).\n- <strong>핵심:<\/strong> <strong>계산은 순수 함수, 효과는 훅, 표시는 컴포넌트<\/strong>로 나눈다. 테스트하기 어려운 코드는 대부분 <strong>섞여 있는 코드<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"다 순수 함수로 빼면 대가는?\" → 파일과 이름이 늘어난다. 흐름을 따라가려면 여러 파일을 열어야 한다. 그래서 분기·계산이 있는 로직만 빼고, 단순 매핑은 그 자리에 둔다.\n- <strong>출처:<\/strong> [Keeping Components Pure (react.dev)](https://react.dev/learn/keeping-components-pure)\n\n### 합성과 props 주입 vs 내부 의존 (Composition, Dependency Injection)\n\n- <strong>뭐야:<\/strong> 합성은 작은 부품을 `children`·슬롯으로 끼워 조립하는 방식이다. props 주입은 라우터·세션 같은 바깥 의존을 컴포넌트가 직접 읽지 않고 밖에서 받는 방식이다.\n- <strong>왜:<\/strong> 위젯이 안에서 `useRouter`나 세션을 직접 읽으면 다른 역할·다른 라우트에서 재사용할 수 없다. 결국 같은 화면을 두 벌 만든다.\n- <strong>어떻게:<\/strong>\n  - 바깥 의존(라우터·세션·API 구현)은 <strong>props로 받는다<\/strong>. `href`·`onBack`·`renderAction` 같은 props다.\n  - <strong>합성<\/strong>을 쓴다. 특정 동작을 켜는 boolean prop을 늘리는 대신, `children`이나 슬롯(채워 넣을 \"구멍\")에 끼워 넣게 한다.\n  - 외부 시스템 계약은 <strong>어댑터<\/strong>로 격리한다. 어댑터는 외부 시스템을 화면이 쓰는 모양으로 감싼 중간 층이다. 화면은 인터페이스만 안다. 구현(mock/실결제)은 갈아 끼운다.\n  - 주입하는 지점은 상위(라우트 레이어) 한 곳으로 둔다.\n- <strong>핵심:<\/strong> 컴포넌트는 <strong>무엇을 할지<\/strong>만 알고 <strong>어떻게·어디로<\/strong>는 밖에서 받는다. 그러면 <strong>재사용과 교체<\/strong>가 공짜가 된다.\n- <strong>꼬리질문:<\/strong>\n  - \"props drilling이 심해지면요?\" → 같은 값이 깊은 곳까지 내려가면 Context나 합성을 쓴다. 합성은 `children`으로 중간 층을 건너뛰는 방법이다. 다만 Context는 의존을 숨기므로 경계 지점에서만 쓴다.\n  - \"boolean prop을 늘리면 뭐가 문제죠?\" → 조합 수가 2ⁿ으로 늘어난다. 서로 모순되는 조합도 생긴다. 변형이 많아지면 합성이나 판별 유니온 props로 바꾼다.\n- <strong>출처:<\/strong> [Passing Props — Passing JSX as children (react.dev)](https://react.dev/learn/passing-props-to-a-component#passing-jsx-as-children) · [Compound Pattern (patterns.dev)](https://www.patterns.dev/react/compound-pattern/)\n\n### 콜백 opt-in과 확장 지점 (Callback Opt-in)\n\n- <strong>뭐야:<\/strong> 공용 부품은 기본 동작만 하고, 토스트·이동 같은 부가 동작은 호출부가 콜백을 넘길 때만 켜지게 하는 설계다.\n- <strong>왜:<\/strong> 공용 컴포넌트가 성공 시 토스트·이동·캐시 무효화까지 스스로 해 버리면 문제가 생긴다. 다른 화면이 그 동작을 원하지 않아도 끌 방법이 없다.\n- <strong>어떻게:<\/strong>\n  - 공용 부품은 <strong>기본 동작 최소<\/strong>로 둔다. 부가 동작은 `onSuccess`·`onError`·`onSelect` 같은 <strong>선택적 콜백<\/strong>으로 호출부가 켠다. 콜백 이름은 `onPlayMovie`처럼 의도를 드러낸다. 그래야 내부를 바꿔도 API가 유지된다.\n  - 콜백을 넘기지 않으면 아무 일도 일어나지 않는 것이 기본이다(opt-in). 반대로 끄는 옵션(opt-out)이 늘어나면 설계를 다시 볼 신호다.\n  - 같은 이벤트에 공용 부품과 호출부가 둘 다 반응하면 <strong>중복 실행<\/strong>이 생긴다(토스트 두 번 등). 책임자를 한 곳으로 정한다.\n- <strong>핵심:<\/strong> 공용 부품은 <strong>최소 동작 + 선택적 콜백<\/strong>으로 만든다. 부수효과의 <strong>책임자는 하나<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"매 호출부가 같은 콜백을 반복하잖아요?\" → 3곳 이상에서 반복되면 그 조합을 감싼 얇은 래퍼를 만든다. 공용 부품 자체는 두껍게 만들지 않는다.\n- <strong>출처:<\/strong> [Responding to Events — Passing event handlers as props (react.dev)](https://react.dev/learn/responding-to-events#passing-event-handlers-as-props)\n\n### 디자인 시스템과 공용 컴포넌트 API (Design System, Design Tokens)\n\n- <strong>뭐야:<\/strong> 디자인 시스템은 색·간격 같은 값(토큰)과 공용 부품, 쓰는 규칙을 한 묶음으로 관리하는 체계다. 토큰은 그 값에 `color.danger`처럼 이름을 붙여 한 곳에 둔 것이다.\n- <strong>왜:<\/strong> 없으면 화면마다 버튼 높이·여백·색이 조금씩 다르다. 디자인이 바뀌면 수십 파일을 찾아 고친다. 공용 컴포넌트 API 규칙이 없으면 변형이 생길 때마다 boolean prop이 붙어 prop이 계속 늘어난다.\n- <strong>어떻게:<\/strong>\n  - <strong>토큰<\/strong>은 색·간격·radius·글꼴을 이름 붙은 값으로 한 곳에 둔 것이다. 원시값을 그대로 쓰지 않고 `color.danger` 같은 의미값으로 한 번 더 이름을 붙인다. 주의: W3C 커뮤니티 그룹(DTCG)의 토큰 JSON 포맷이 2025.10에 첫 안정판이 됐다.\n  - <strong>층 나누기<\/strong>: 세 층으로 쌓는다. 맨 아래는 동작·접근성만 가진 headless 부품(Radix 등)이다. 그 위에 스타일을 입힌 기본 부품이 있다. 맨 위에 도메인 부품이 있다. 아래 층일수록 도메인을 모른다.\n  - <strong>API<\/strong>: 변형은 boolean 여러 개 대신 `variant` 유니온 하나로 받는다. 복잡한 부품은 compound 패턴으로 만든다. `Select.Trigger`처럼 컨텍스트로 상태를 나누는 방식이다.\n- <strong>핵심:<\/strong> 디자인 시스템은 <strong>토큰(값) + 부품(동작) + 규칙(문서)<\/strong>이다. 값은 한 곳, 변형은 <strong>유니온 하나<\/strong>로.\n- <strong>꼬리질문:<\/strong>\n  - \"compound 패턴의 대가는?\" → 하위 부품을 부모 밖에서 쓰면 깨진다. `cloneElement` 방식으로 만들었다면 중간에 낀 래퍼가 상태 공유를 끊는다.\n- <strong>출처:<\/strong> [Design Tokens Community Group (W3C)](https://www.designtokens.org/) · [Compound Pattern (patterns.dev)](https://www.patterns.dev/react/compound-pattern/)\n\n> 한 줄 정리: 계산은 순수 함수로 빼고, 바깥 의존은 주입받고, 부가 동작은 호출부가 켜고, 공용 값은 토큰 한 곳에.\n\n## 3. 폴더 아키텍처\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"FSD 레이어가 app에서 shared로 한 방향으로만 의존하며 역방향과 같은 레이어 다른 슬라이스 간 import는 금지됨을 보여주는 그림\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <text x=\"24\" y=\"30\" font-size=\"15\" fill=\"currentColor\" font-weight=\"bold\">FSD 레이어 의존 방향 (위 → 아래만 허용)<\/text>\n  <rect x=\"60\" y=\"50\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--fig-accent)\" opacity=\"0.30\"/>\n  <text x=\"78\" y=\"77\" font-size=\"15\" fill=\"currentColor\" font-weight=\"bold\">app<\/text>\n  <text x=\"140\" y=\"77\" font-size=\"13\" fill=\"currentColor\">라우트·프로바이더·주입<\/text>\n  <rect x=\"60\" y=\"110\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--fig-accent)\" opacity=\"0.24\"/>\n  <text x=\"78\" y=\"137\" font-size=\"15\" fill=\"currentColor\" font-weight=\"bold\">widgets<\/text>\n  <text x=\"160\" y=\"137\" font-size=\"13\" fill=\"currentColor\">화면 조합 블록<\/text>\n  <rect x=\"60\" y=\"170\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--fig-accent)\" opacity=\"0.18\"/>\n  <text x=\"78\" y=\"197\" font-size=\"15\" fill=\"currentColor\" font-weight=\"bold\">features<\/text>\n  <text x=\"168\" y=\"197\" font-size=\"13\" fill=\"currentColor\">사용자 행동 하나<\/text>\n  <rect x=\"60\" y=\"230\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--fig-accent)\" opacity=\"0.12\"/>\n  <text x=\"78\" y=\"257\" font-size=\"15\" fill=\"currentColor\" font-weight=\"bold\">entities<\/text>\n  <text x=\"168\" y=\"257\" font-size=\"13\" fill=\"currentColor\">도메인 모델·타입·UI<\/text>\n  <rect x=\"60\" y=\"290\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--fig-muted)\" opacity=\"0.30\"/>\n  <text x=\"78\" y=\"317\" font-size=\"15\" fill=\"currentColor\" font-weight=\"bold\">shared<\/text>\n  <text x=\"150\" y=\"317\" font-size=\"13\" fill=\"currentColor\">도메인 무관 공용<\/text>\n  <line x1=\"380\" y1=\"72\" x2=\"380\" y2=\"300\" stroke=\"var(--fig-accent)\" stroke-width=\"3\"/>\n  <polygon points=\"372,300 388,300 380,316\" fill=\"var(--fig-accent)\"/>\n  <text x=\"394\" y=\"190\" font-size=\"13\" fill=\"currentColor\">허용: 상위 → 하위<\/text>\n  <rect x=\"500\" y=\"170\" width=\"90\" height=\"44\" rx=\"8\" fill=\"var(--fig-accent)\" opacity=\"0.18\"/>\n  <text x=\"545\" y=\"197\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">features/A<\/text>\n  <rect x=\"610\" y=\"170\" width=\"90\" height=\"44\" rx=\"8\" fill=\"var(--fig-accent)\" opacity=\"0.18\"/>\n  <text x=\"655\" y=\"197\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">features/B<\/text>\n  <line x1=\"592\" y1=\"192\" x2=\"606\" y2=\"192\" stroke=\"var(--fig-accent2)\" stroke-width=\"3\"/>\n  <text x=\"599\" y=\"160\" font-size=\"16\" fill=\"var(--fig-accent2)\" text-anchor=\"middle\" font-weight=\"bold\">×<\/text>\n  <text x=\"600\" y=\"236\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">같은 층 다른 슬라이스 금지<\/text>\n  <line x1=\"545\" y1=\"300\" x2=\"545\" y2=\"230\" stroke=\"var(--fig-accent2)\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/>\n  <polygon points=\"537,236 553,236 545,222\" fill=\"var(--fig-accent2)\"/>\n  <text x=\"565\" y=\"275\" font-size=\"16\" fill=\"var(--fig-accent2)\" font-weight=\"bold\">×<\/text>\n  <text x=\"545\" y=\"320\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">하위 → 상위 금지<\/text>\n<\/svg>\n<figcaption>의존은 한 방향으로만 흐른다 — 아래 층은 위 층의 존재를 모른다 (pages 레이어를 뺀 Light 구성 기준)<\/figcaption>\n<\/figure>\n\n### FSD 레이어와 단방향 의존 (Feature-Sliced Design)\n\n- <strong>뭐야:<\/strong> 코드를 레이어 → 슬라이스 → 세그먼트로 나누는 프론트엔드 폴더 구조 방법론이다. 위 레이어가 아래 레이어만 import하게 한다.\n- <strong>왜:<\/strong> 기준이 없으면 `components/`·`hooks/`·`utils/` 같은 기술명 폴더에 수백 파일이 쌓인다. 기능 하나를 고치려면 폴더 다섯 개를 뒤져야 한다. 순환 import 때문에 초기화 순서 버그도 난다. 순환 import는 두 파일이 서로를 import하는 것이다.\n- <strong>어떻게:<\/strong>\n  - <strong>레이어<\/strong>(app → (pages) → widgets → features → entities → shared)로 책임을 나눈다. <strong>상위가 하위만 import<\/strong>한다.\n  - 레이어 안은 <strong>슬라이스<\/strong>(도메인/행동 단위)로 나눈다. 슬라이스 안은 <strong>세그먼트<\/strong>(`ui`·`model`·`api`·`lib`)로 나눈다.\n  - 같은 레이어의 <strong>다른 슬라이스끼리 직접 import 금지<\/strong>다. 공통 부분은 아래 층으로 내리거나 위 층에서 조합한다.\n  - 슬라이스는 <strong>public API<\/strong>(`index.ts`)로만 밖에 노출한다. 밖에서 내부 경로를 직접 참조하지 않는다.\n  - 주의: FSD 2.1 문서 기준 `processes` 레이어는 <strong>deprecated<\/strong>(더는 권장하지 않음)다. 문서는 그 내용을 `features`·`app`으로 옮기라고 한다. 공식 문서는 대부분의 프로젝트에 `shared`·`pages`·`app`은 있다고 본다. `pages`를 빼는 Light 구성은 공식 권장이 아닌 <strong>팀 변형<\/strong>이다.\n  - 같은 층 슬라이스 금지에는 예외가 있다. `entities`끼리는 `A/@x/B` 형태의 교차 공개 API를 둘 수 있다. `app`과 `shared`는 슬라이스 없이 세그먼트로만 나뉜다. 그래서 내부끼리 자유롭게 import한다.\n- <strong>핵심:<\/strong> FSD의 핵심은 <strong>단방향 의존<\/strong>이다. 아래 층은 위 층을 모르고, 같은 층 슬라이스는 서로 모른다. 그래서 <strong>바꿀 때 영향 범위가 위쪽으로만<\/strong> 퍼진다.\n- <strong>꼬리질문:<\/strong>\n  - \"두 feature가 같은 로직을 써야 하면요?\" → entities나 shared로 내린다. 도메인 이름이 박힌 것은 entities로, 도메인과 무관한 것은 shared로 보낸다.\n  - \"FSD의 대가는?\" → \"이건 feature냐 widget이냐\"를 판단하는 비용이 든다. 초반부터 폴더 수도 많다. 작은 프로젝트에는 과하고, 팀과 도메인이 늘 때 효과가 난다.\n  - \"왜 레이어드(components/hooks/utils)를 안 골랐나요?\" → 기술 기준으로 분류하면 기능 하나가 여러 폴더에 흩어진다. 무엇을 지워도 되는지 경계도 보이지 않는다.\n- <strong>출처:<\/strong> [Layers (Feature-Sliced Design)](https://feature-sliced.design/docs/reference/layers) · [Public API (Feature-Sliced Design)](https://feature-sliced.design/docs/reference/public-api)\n\n### 경계 검사 도구 (Boundary Linting)\n\n- <strong>뭐야:<\/strong> 레이어·슬라이스 import 규칙을 린터나 CI가 자동으로 검사하게 하는 것이다.\n- <strong>왜:<\/strong> 규칙이 문서에만 있으면 급한 PR에서 `features/A`가 `features/B`를 import한다. 리뷰어가 매번 눈으로 잡을 수는 없다.\n- <strong>어떻게:<\/strong>\n  - 도구는 여러 가지다. FSD 전용 `steiger`는 층·슬라이스 import 규칙, public API 우회 금지 등을 내장한다(주의: 2026-10 기준 베타). 그 밖에 `eslint-plugin-boundaries`, `dependency-cruiser`가 있다. 간단히는 ESLint `no-restricted-imports`로도 된다.\n  - CI에서 돌려 <strong>위반이 늘면 실패<\/strong>하게 한다. 기존 위반은 목록(baseline)으로 묶어 두고 <strong>새 위반만 막는<\/strong> 방식이 현실적이다.\n  - 도구의 사각지대를 알아 둔다. 경로 별칭(`@/`)만 보고 <strong>상대경로(`../../`)는 못 잡는<\/strong> 설정이 있다. 동적 import와 재export를 거친 우회도 사각지대다.\n  - 순환 의존은 `madge`·`dependency-cruiser`로 따로 확인한다.\n- <strong>핵심:<\/strong> 규칙은 <strong>도구로 강제<\/strong>해야 산다. 단, 도구가 <strong>무엇을 못 보는지<\/strong>까지 알아야 숫자를 믿을 수 있다.\n- <strong>꼬리질문:<\/strong>\n  - \"기존 위반이 수백 건이면요?\" → 한 번에 고치지 않는다. 기존 위반을 baseline으로 고정하고 새 위반만 막는다. 그 뒤 해당 영역을 손댈 때 줄인다.\n- <strong>출처:<\/strong> [Steiger (GitHub)](https://github.com/feature-sliced/steiger) · [Public API — 인덱스 파일 문제 (Feature-Sliced Design)](https://feature-sliced.design/docs/reference/public-api)\n\n> 한 줄 정리: 의존은 위에서 아래로만, 같은 층은 서로 모르게, 규칙은 도구로 강제하되 사각지대를 안다.\n\n## 4. 테스트 전략\n\n### 테스트 비율과 무엇을 테스트하나 (Pyramid vs Trophy)\n\n- <strong>뭐야:<\/strong> 유닛·통합·e2e 테스트를 어떤 비율로 둘지에 대한 모델이다. 유닛은 함수 하나를, 통합은 여러 부품을 묶어서, e2e는 실제 브라우저에서 사용자 흐름 전체를 확인하는 테스트다. 피라미드는 유닛을 가장 많이 둔다. 트로피는 통합을 가장 두껍게 둔다.\n- <strong>왜:<\/strong> 기준 없이 쓰면 둘 중 하나가 된다. 커버리지 숫자는 높은데 배포할 때마다 터진다. 또는 e2e만 잔뜩 있어서 CI가 30분 걸리고, 같은 코드인데 통과와 실패가 오락가락한다(flaky).\n- <strong>어떻게:<\/strong>\n  - <strong>피라미드<\/strong>는 유닛을 많이, 통합을 그다음으로, e2e를 적게 둔다. 아래로 갈수록 빠르고 싸다. Google은 대략 유닛 80%·통합 15%·e2e 5%를 목표로 든다.\n  - <strong>트로피<\/strong>(Kent C. Dodds)는 정적 분석(타입·린트)을 바닥에 깔고 <strong>통합 비중 크게<\/strong> 잡는다. 테스트가 실제 사용 방식을 닮을수록 신뢰가 커진다는 원칙에서 나왔다.\n  - 테스트할 것은 세 가지다. <strong>분기·계산이 있는 순수 로직<\/strong>은 유닛으로 본다. <strong>사용자 흐름의 핵심 경로<\/strong>(가입·결제·로그인)는 e2e로 본다. 화면 동작은 <strong>사용자가 보는 것<\/strong> 기준으로 본다. Testing Library의 쿼리 우선순위는 역할 → 라벨 → … 순이고 `data-testid`는 최후다.\n  - 테스트하지 않을 것은 구현 세부(내부 state 이름, 호출 횟수), 라이브러리 자체, 남발하는 단순 마크업 스냅샷이다.\n- <strong>핵심:<\/strong> 테스트는 비율보다 <strong>\"이 테스트가 깨지면 사용자 문제인가\"<\/strong>로 고른다. <strong>순수 함수 유닛<\/strong>이 가장 싸고 단단하고, e2e는 <strong>돈·로그인 같은 핵심 흐름<\/strong>에.\n- <strong>꼬리질문:<\/strong>\n  - \"e2e가 flaky하면?\" → 고정 `sleep`을 쓰지 않는다. 대신 자동으로 기다리는 로케이터와, 조건이 될 때까지 기다리는 단언(Playwright `toBeVisible()` 등)을 쓴다. 테스트마다 데이터·상태를 격리하고, 시간에 의존하는 부분은 시각을 고정한다. Google은 깜빡임이 1%에 가까워지면 테스트가 가치를 잃기 시작한다고 본다.\n  - \"커버리지 목표는?\" → 숫자 목표를 두면 의미 없는 테스트가 생긴다. 바뀐 로직의 분기가 테스트로 덮였는지를 본다.\n- <strong>출처:<\/strong> [The Testing Trophy and Testing Classifications (Kent C. Dodds)](https://kentcdodds.com/blog/the-testing-trophy-and-testing-classifications) · [About Queries — Priority (Testing Library)](https://testing-library.com/docs/queries/about/) · [Testing Overview (Software Engineering at Google, 11장)](https://abseil.io/resources/swe-book/html/ch11.html)\n\n### 모킹 경계 (Mocking Boundary)\n\n- <strong>뭐야:<\/strong> 테스트에서 가짜(mock)로 바꿀 것과 진짜로 둘 것을 가르는 선이다. 네트워크·시간·브라우저 API처럼 시스템 바깥만 가짜로 바꾼다.\n- <strong>왜:<\/strong> 훅·컴포넌트 내부 함수까지 전부 mock하면 테스트는 통과하는데 실제 연결은 깨져 있다. 반대로 아무것도 mock하지 않으면 테스트가 실제 서버에 의존한다. 그러면 느리고 불안정하다.\n- <strong>어떻게:<\/strong>\n  - <strong>시스템 바깥 경계에서만<\/strong> mock한다. 네트워크는 MSW로 막는다. MSW는 브라우저에서 Service Worker로 요청을 가로채므로 `fetch`를 건드리지 않는다. 시간은 `vi.useFakeTimers`로 바꾼다. 브라우저 API(카메라·브릿지)도 대상이다. e2e에서는 통제할 수 없는 외부 서비스만 Playwright 네트워크 API로 막는다.\n  - 내 코드 안의 모듈끼리는 mock하지 않는다. 그래야 실제 연결을 검증한다.\n  - mock 응답은 <strong>실제 응답 모양<\/strong>으로 만든다. 실측한 응답을 픽스처로 저장해 쓰면, 가짜 모양에 맞춘 테스트가 생기는 것을 막는다. 픽스처는 테스트에 쓰려고 저장해 둔 고정 데이터다.\n  - 순수 함수는 mock이 아예 필요 없다. 순수 함수로 빼는 것 자체가 모킹을 줄이는 설계다.\n- <strong>핵심:<\/strong> mock은 <strong>네트워크·시간·플랫폼 경계<\/strong>에서만 쓴다. <strong>가짜 모양의 mock<\/strong>은 거짓 안심을 준다.\n- <strong>꼬리질문:<\/strong>\n  - \"mock 응답이 실제와 어긋나는 걸 어떻게 막나요?\" → 두 가지 방법이 있다. 실제 응답을 픽스처로 쓰는 계약 테스트를 둔다. 또는 OpenAPI 스키마에서 타입과 mock을 생성한다.\n- <strong>출처:<\/strong> [Mock Service Worker — Docs](https://mswjs.io/docs/) · [Best Practices (Playwright)](https://playwright.dev/docs/best-practices)\n\n### 회귀 테스트 (Regression Test)\n\n- <strong>뭐야:<\/strong> 넓게는 변경 뒤에도 전에 되던 동작이 깨지지 않았는지 확인하는 테스트다. 여기서는 고친 버그가 돌아오지 않게 남기는 테스트를 다룬다. 버그를 재현하는 실패 테스트를 먼저 쓰고 나서 고치는 방식이다.\n- <strong>왜:<\/strong> 이 테스트가 없으면 고친 버그가 석 달 뒤 다른 사람의 리팩터로 똑같이 돌아온다.\n- <strong>어떻게:<\/strong>\n  - 버그를 고치기 <strong>전에<\/strong> 그 버그를 재현하는 실패 테스트부터 쓴다. 고친 뒤에 테스트가 통과하는지 확인한다.\n  - 테스트 이름에 <strong>증상<\/strong>을 적는다(\"자유석으로 옮긴 학생의 지정석을 미등원으로 표시하지 않는다\")\n  - 버그가 화면에서만 재현되면 원인 로직을 순수 함수로 빼서 유닛 테스트로 고정한다. 상호작용 버그는 e2e로 고정한다.\n  - 경계값(0, 빈 배열, 자정, 타임존, 최대치)을 같이 넣는다\n- <strong>핵심:<\/strong> 회귀 테스트는 <strong>실패하는 테스트 먼저 → 수정 → 통과<\/strong> 순서로 쓴다. 버그 하나가 테스트 하나를 남긴다.\n- <strong>꼬리질문:<\/strong>\n  - \"재현이 안 되는 버그는요?\" → 계측(로그·상태 스냅샷)을 먼저 넣어 재현 조건을 좁힌다. 추측으로 고치고 테스트를 거기에 맞춰 쓰면 회귀 테스트가 아니다.\n- <strong>출처:<\/strong> [Testing Overview — 비욘세 규칙·발견한 문제에 자동 테스트 추가 (Software Engineering at Google, 11장)](https://abseil.io/resources/swe-book/html/ch11.html)\n\n> 한 줄 정리: 순수 로직은 유닛, 핵심 흐름은 e2e, mock은 바깥 경계에만, 버그는 실패 테스트부터.\n\n## 5. 접근성\n\n### 시맨틱 태그·키보드·aria (Semantic HTML, ARIA)\n\n- <strong>뭐야:<\/strong> 시맨틱 태그는 `<button>`·`<nav>`처럼 역할이 담긴 HTML 요소다. aria는 네이티브 요소로 표현하지 못하는 역할·이름·상태를 보조 기술에 알려주는 속성이다. 보조 기술은 스크린리더처럼 화면을 대신 읽어 주는 도구다.\n- <strong>왜:<\/strong> `<div onClick>`으로 만든 버튼은 Tab으로 갈 수 없고 Enter도 듣지 않는다. 스크린리더도 \"버튼\"이라고 읽지 않는다. 이름을 주지 않은 아이콘 버튼은 무슨 버튼인지 없이 \"버튼\"이라고만 읽히기도 한다.\n- <strong>어떻게:<\/strong>\n  - <strong>네이티브 요소 우선<\/strong>이다. `<button>`·`<a href>`·`<label for>`·`<nav>`·`<main>`·`<ul>`을 쓰면 포커스·키보드·역할이 공짜로 따라온다.\n  - 이동은 `<a>`, 동작은 `<button>`으로 만든다. 섞으면 새 탭 열기와 뒤로 가기가 깨진다.\n  - aria의 첫 규칙은 <strong>네이티브로 되면 aria를 쓰지 않는다<\/strong>는 것이다. ARIA 역할은 \"약속\"일 뿐이고 키보드 동작을 주지 않는다. 그래서 잘못된 aria는 없는 것보다 나쁘다(APG: No ARIA is better than bad ARIA).\n  - 아이콘 버튼의 이름은 `aria-label`로 준다. 상태는 `aria-expanded`·`aria-pressed`·`aria-selected`로 알린다. 비동기 결과 안내는 `aria-live`로 알린다.\n  - 커스텀 위젯(탭·콤보박스)은 WAI-ARIA 패턴의 키보드 동작(화살표·Esc)까지 구현한다. 아니면 검증된 headless 라이브러리(Radix 등)를 쓴다.\n- <strong>핵심:<\/strong> <strong>시맨틱 태그가 접근성의 기반<\/strong>이다. aria는 네이티브로 안 되는 것만 <strong>보충<\/strong>한다.\n- <strong>꼬리질문:<\/strong>\n  - \"공용 Button 컴포넌트를 만들면 접근성은 어떻게 보장하나요?\" → 내부를 `<button>`으로 둔다. `type` 기본값을 명시해 폼 안에서 의도치 않게 submit되는 것을 막는다. 아이콘 전용 변형은 타입에서 `aria-label`을 필수로 만든다.\n  - \"자동 검사 도구로 충분한가요?\" → axe·Lighthouse는 대비 부족·라벨 누락 같은 기계적 위반만 잡는다. 키보드만으로 화면을 한 바퀴 도는 수동 확인이 필요하다.\n- <strong>출처:<\/strong> [Read Me First — No ARIA is better than bad ARIA (WAI-ARIA APG)](https://www.w3.org/WAI/ARIA/apg/practices/read-me-first/) · [Using ARIA — Rules of ARIA use (W3C)](https://www.w3.org/TR/using-aria/)\n\n### 포커스 관리와 색 대비 (Focus Management, Color Contrast)\n\n- <strong>뭐야:<\/strong> 포커스 관리는 키보드 포커스가 어디로 가고 어디로 돌아올지 정하는 것이다. 색 대비는 글자·UI 요소와 배경의 상대 휘도 대비율을 기준 이상으로 맞추는 것이다. 쉽게 말해 글자와 배경의 밝기 차이다.\n- <strong>왜:<\/strong> 관리하지 않으면 모달을 열었는데 Tab이 뒤 페이지로 샌다. 모달을 닫으면 포커스가 문서 맨 위로 튄다. 대비가 낮은 연회색 안내 문구는 햇빛 아래 키오스크에서 읽히지 않는다.\n- <strong>어떻게:<\/strong>\n  - 모달은 다음 순서로 다룬다. 열 때 포커스를 안쪽으로 옮긴다(보통 첫 상호작용 요소, 내용이 길면 제목). Tab은 모달 안에서만 <strong>순환<\/strong>한다(focus trap). Esc로 닫는다. 닫으면 포커스가 <strong>연 버튼으로 복귀<\/strong>한다. 뒤 콘텐츠는 `inert`로 둔다. `inert`는 그 영역을 클릭·포커스할 수 없게 만드는 속성이다.\n  - SPA에서 라우트를 이동한 뒤에는 새 화면 제목으로 포커스를 옮긴다. 아니면 `aria-live`로 알린다.\n  - 포커스 링은 `:focus-visible`로 준다. 브라우저가 필요하다고 판단할 때(주로 키보드 이동)만 링이 보인다. `outline: none`만 하고 대체 표시를 주지 않는 것이 흔한 실수다.\n  - 색 대비는 WCAG AA 기준을 따른다. 일반 텍스트는 <strong>4.5:1<\/strong>, 큰 텍스트(18pt 이상, 굵으면 14pt 이상)는 <strong>3:1<\/strong>이다(1.4.3). 버튼·입력 경계·포커스 표시 같은 UI 컴포넌트와 의미 있는 그래픽도 <strong>3:1<\/strong>이다(1.4.11). 반올림은 하지 않는다(4.499:1은 탈락).\n  - 정보를 <strong>색만으로<\/strong> 전달하지 않는다. 오류는 빨간색에 아이콘·문구를 함께 쓴다.\n- <strong>핵심:<\/strong> 포커스는 <strong>이동·가두기·복귀<\/strong> 세 단계로 관리한다. 대비는 <strong>4.5:1 / 3:1<\/strong>, 색만으로 의미를 전달하지 않는다.\n- <strong>꼬리질문:<\/strong>\n  - \"`<dialog>` 요소를 쓰면 다 해결되나요?\" → `showModal()`은 뒤 콘텐츠를 inert로 만들고 Esc 닫기를 준다. HTML 표준상 닫힐 때 <strong>열기 전 포커스 요소로 되돌린다<\/strong>. 다만 배경 스크롤 잠금, 여닫기 애니메이션, 연 버튼이 사라진 경우의 대체 포커스는 따로 챙긴다.\n- <strong>출처:<\/strong> [Understanding SC 1.4.3 Contrast (Minimum) (W3C)](https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html) · [Understanding SC 1.4.11 Non-text Contrast (W3C)](https://www.w3.org/WAI/WCAG22/Understanding/non-text-contrast.html) · [Dialog (Modal) Pattern (WAI-ARIA APG)](https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/)\n\n> 한 줄 정리: 네이티브 태그가 먼저, aria는 보충, 포커스는 이동·가두기·복귀, 대비는 4.5:1.\n\n## 6. 에러 처리와 유지보수\n\n### 에러 처리 설계 (User Message vs Developer Log)\n\n- <strong>뭐야:<\/strong> 실패를 사용자에게 보여줄 문구와 개발자가 볼 로그로 나눠 다루는 설계다. 화면에는 사용자가 할 수 있는 행동을 적는다. 로그에는 원인을 남긴다.\n- <strong>왜:<\/strong> 설계가 없으면 조회가 실패했는데 화면에는 \"데이터가 없습니다\"가 뜬다. 사용자는 정말 없는 줄 안다. 개발자는 신고가 오지 않아 모른다. 반대로 `[object Object]`나 스택이 사용자에게 그대로 보이기도 한다.\n- <strong>어떻게:<\/strong>\n  - 상태를 셋으로 <strong>반드시 구분<\/strong>한다. 로딩, <strong>빈 상태<\/strong>(성공했는데 0건), <strong>오류<\/strong>(실패 + 다시 시도)다.\n  - 사용자 문구와 개발자 로그를 분리한다. 화면에는 <strong>할 수 있는 행동<\/strong>(다시 시도·문의)을 적는다. 로그에는 코드·요청 ID·원본 에러를 남긴다.\n  - 에러를 <strong>부류로 분류<\/strong>한다. 일시적 실패는 재시도한다. 권한·정책 실패는 재시도가 무의미하므로 서버 문구를 보여준다. 버그는 로그로 남기고 보고한다.\n  - 상태코드만으로 부족하면 서버 <strong>커스텀 코드<\/strong>로 가른다. 같은 403이라도 토큰 문제일 수도, 플랜 거절일 수도 있다.\n  - 전역 처리(토스트)와 화면 처리(인라인 오류)의 <strong>책임을 한 곳<\/strong>으로 정한다. 그래야 같은 실패가 두 번 노출되지 않는다.\n  - React Error Boundary는 하위 컴포넌트의 에러를 잡아 대체 화면을 보여주는 컴포넌트다. 렌더 중 에러만 잡는다. 이벤트 핸들러, `setTimeout` 같은 비동기, SSR, 경계 자신의 에러는 못 잡는다(예외: `useTransition`의 `startTransition` 안에서 던진 에러는 잡힌다). 함수 컴포넌트로는 만들 수 없어서 클래스나 `react-error-boundary`를 쓴다.\n- <strong>핵심:<\/strong> <strong>실패를 빈 상태로 보이지 않는다.<\/strong> 사용자에겐 <strong>행동<\/strong>, 개발자에겐 <strong>원인<\/strong>. 에러는 <strong>부류별로<\/strong> 처리 경로가 다르다.\n- <strong>꼬리질문:<\/strong>\n  - \"모든 실패에 재시도 버튼을 주나요?\" → 권한 거절처럼 재시도로 풀리지 않는 실패에는 주지 않는다. 이 둘을 나누는 것이 설계다.\n  - \"Error Boundary를 어디에 두나요?\" → 앱 최상단에 하나만 두면 위젯 하나의 오류로 화면 전체가 날아간다. 독립적으로 실패해도 되는 영역 단위로 둔다.\n- <strong>출처:<\/strong> [Component — Catching rendering errors with an Error Boundary (react.dev)](https://react.dev/reference/react/Component#catching-rendering-errors-with-an-error-boundary)\n\n### 에러 모니터링과 관측성 (Error Monitoring, Observability)\n\n- <strong>뭐야:<\/strong> 운영 중인 사용자 브라우저에서 난 오류를 모아 개발자가 원인까지 볼 수 있게 하는 체계다. 재료는 수집 지점·소스맵·맥락 정보다.\n- <strong>왜:<\/strong> 없으면 운영에서만 나는 오류를 사용자 신고로 처음 안다. 받은 스택도 `a.js:1:48213`처럼 압축된 코드라 읽을 수 없다.\n- <strong>어떻게:<\/strong>\n  - <strong>수집 지점<\/strong>은 네 곳이다. Error Boundary는 렌더 에러를 모은다. `window`의 `error` 이벤트는 잡히지 않은 스크립트 에러를 모은다(타이머·이벤트 콜백 안에서 던진 것 포함, Promise 거부는 제외). 요소의 리소스 로드 실패는 버블링되지 않으므로 캡처 단계 리스너로 받는다. `unhandledrejection`은 처리 안 된 Promise 거부를 모은다. 나머지 하나는 API 인터셉터다.\n  - <strong>소스맵<\/strong>은 압축된 스택을 원본 줄로 되돌리는 파일이다. 빌드 때 만들어 모니터링 도구(Sentry 등)에 올린다. Sentry는 빌드 과정에서 올리는 것을 권장하고, 공개 호스팅도 가능하다.\n  - <strong>맥락<\/strong>은 릴리스·사용자 역할·앱 버전(웹뷰)을 태그로 붙인 것이다. 태그가 있어야 \"어느 배포부터, 누구에게\" 났는지 보인다.\n- <strong>핵심:<\/strong> 관측성은 <strong>수집 지점 + 소스맵 + 맥락 태그<\/strong>로 만든다. 사용자 문구와 달리 여기엔 <strong>원인 전부<\/strong>를 남긴다.\n- <strong>꼬리질문:<\/strong>\n  - \"에러가 너무 많이 쌓이면?\" → 확장 프로그램이나 취소된 요청 같은 소음을 거른다. 새 오류와 급증만 알린다.\n- <strong>출처:<\/strong> [unhandledrejection event (MDN)](https://developer.mozilla.org/en-US/docs/Web/API/Window/unhandledrejection_event) · [Source Maps (Sentry Docs)](https://docs.sentry.io/platforms/javascript/sourcemaps/)\n\n### 레거시 걷어내기 (Dead Code Removal)\n\n- <strong>뭐야:<\/strong> 더 이상 쓰이지 않는 prop·파일·export를 참조가 없음을 확인한 뒤 단계적으로 지우는 작업이다.\n- <strong>왜:<\/strong> 걷어내지 않으면 아무도 안 쓰는 것 같은 prop·파일이 쌓인다. 리팩터할 때마다 \"이거 지워도 되나\"를 조사하느라 시간이 든다. 감으로 지우면 런타임에 터진다.\n- <strong>어떻게:<\/strong>\n  - <strong>참조 0 확인<\/strong>: grep, IDE의 \"Find References\", `knip` 같은 도구로 확인한다. `knip`은 미사용 파일·export·의존성을 찾고, Next.js 등 프레임워크의 진입 파일을 플러그인으로 인식한다. 문자열 경로, 동적 import, 라우트 파일 규칙(파일명이 곧 진입점)은 grep에 걸리지 않으니 따로 확인한다.\n  - <strong>단계별 삭제<\/strong>: 호출부 제거 → 타입·prop 제거 → 파일 제거를 각각 다른 커밋으로 한다. 문제가 생기면 그 단계만 되돌린다.\n  - 외부에 노출된 것(URL·딥링크·API 필드)은 바로 지우지 않는다. 리다이렉트나 폴백을 남기고, 사용량을 본 뒤 제거한다.\n  - 주입 지점이 0인 옵션 prop은 \"언젠가 쓸 것\"이 아니라 <strong>죽은 분기<\/strong>다. 주입 지점이 0이라는 것은 그 prop에 값을 넘기는 호출부가 하나도 없다는 뜻이다.\n- <strong>핵심:<\/strong> 레거시는 <strong>참조 0 확인 → 단계별 삭제 → 외부 노출은 호환 유지<\/strong> 순서로 걷어낸다. 삭제도 커밋 단위가 작아야 되돌릴 수 있다.\n- <strong>꼬리질문:<\/strong>\n  - \"grep에서 0건이면 지워도 되나요?\" → grep만으로는 부족하다. 프레임워크 규칙 파일(page·layout), 문자열로 조립한 import, 다른 레포·앱이 부르는 경로는 잡히지 않는다. 빌드·타입 검사·주요 e2e까지 통과해야 확신한다.\n- <strong>출처:<\/strong> [Knip](https://knip.dev/)\n\n### 리팩터링 안전장치 (Safe Refactoring)\n\n- <strong>뭐야:<\/strong> 리팩터링은 겉으로 보이는 동작은 그대로 두고 코드 구조만 바꾸는 작업이다. 안전장치는 그 \"동작 그대로\"를 테스트와 커밋 분리로 보장하는 방법이다.\n- <strong>왜:<\/strong> 구조를 바꾸면서 동작도 같이 바꾸면, 버그가 났을 때 어느 쪽 탓인지 모른다. 큰 PR 하나로 묶으면 리뷰도 형식적이 된다.\n- <strong>어떻게:<\/strong>\n  - <strong>구조 변경과 동작 변경을 분리<\/strong>한다. 리팩터링은 정의상 \"관찰 가능한 동작을 바꾸지 않는\" 구조 변경이다(Fowler). 먼저 동작을 그대로 둔 채 옮긴다(이관). 그다음에 고친다. 기능 추가와는 다른 모자를 쓰는 일이다.\n  - 옮기기 전에 <strong>테스트로 현재 동작을 고정<\/strong>한다(characterization test). 이상한 동작도 일단 고정하고, 의도한 동작인지는 따로 판단한다.\n  - 로직을 훅·순수 함수로 <strong>선분리<\/strong>해 둔다. 그러면 화면을 교체할 때 로직은 고치지 않고 그대로 옮길 수 있다.\n  - 흩어진 상수·경계값은 <strong>한 소스<\/strong>로 모은다. 다른 곳(CSS·TS)의 값과 어긋나면 테스트가 깨지게 막아 둔다.\n  - 타입을 도구로 쓴다. 시그니처를 바꾸고, 그때 나오는 컴파일 에러 목록을 작업 목록으로 쓴다. 그래서 `as`가 적어야 한다.\n  - 커밋은 작게 한다. 단계마다 typecheck와 테스트를 통과시킨다.\n- <strong>핵심:<\/strong> 리팩터링은 <strong>고정(테스트) → 이동(동작 동일) → 변경<\/strong> 순서로 한다. 구조와 동작을 한 커밋에 섞지 않는다.\n- <strong>꼬리질문:<\/strong>\n  - \"테스트가 없는 9천 줄 컴포넌트는 어떻게 손대나요?\" → 고칠 부분만 순수 함수로 떼어낸다. 그 함수에 테스트를 붙인다. 전체를 한 번에 테스트하려 하지 않는다.\n  - \"리팩터를 언제 멈추나요?\" → 원래 목적에 필요한 범위에서 멈춘다. 그 밖은 기록만 남기고 별도 작업으로 넘긴다.\n- <strong>출처:<\/strong> [Definition Of Refactoring (Martin Fowler)](https://martinfowler.com/bliki/DefinitionOfRefactoring.html) · [Small CLs — 리팩터링은 별도 변경으로 (Google Engineering Practices)](https://google.github.io/eng-practices/review/developer/small-cls.html)\n\n### 코드 리뷰 관점 (Code Review)\n\n- <strong>뭐야:<\/strong> 다른 사람의 변경을 머지 전에 읽고 문제를 찾는 과정이다. 관점은 사람이 무엇을 먼저 볼지 정한 기준이다.\n- <strong>왜:<\/strong> 기준이 없으면 리뷰가 세미콜론·이름 취향에 머문다. 정작 계약 위반·캐시 무효화 누락·경계 위반은 그대로 머지된다.\n- <strong>어떻게:<\/strong>\n  - 포맷·린트·타입·경계는 <strong>도구에 맡긴다<\/strong>. 사람이 볼 것만 남긴다.\n  - 보는 우선순위는 다음과 같다. <strong>정확성<\/strong>(경계값·null·경쟁 상태·중복 요청) → <strong>계약<\/strong>(실제 API 응답과 타입이 맞나, `as`로 덮었나) → <strong>실패 경로<\/strong>(실패가 빈 상태로 보이지 않나, 재시도 안전한가·멱등) → <strong>경계<\/strong>(의존 방향, 도메인 누수) → <strong>테스트<\/strong>(바뀐 분기가 덮였나) → 가독성. 멱등은 같은 요청을 여러 번 보내도 결과가 한 번 보낸 것과 같은 성질이다.\n  - 의견은 질문형으로 쓴다. <strong>차단(머지 전 필수)과 제안(선택)<\/strong>을 구분해 표시한다. Google은 선택 사항에 `Nit:` 접두어를 붙인다.\n  - PR은 작게 만든다. 30분짜리 하나보다 5분짜리 여러 개가 리뷰하기도, 되돌리기도 쉽다.\n- <strong>핵심:<\/strong> 사람은 <strong>정확성·계약·실패 경로<\/strong>를 본다. 스타일은 도구가 본다. <strong>차단과 제안을 구분<\/strong>한다.\n- <strong>꼬리질문:<\/strong>\n  - \"리뷰에서 의견이 갈리면?\" → 컨벤션 문서와 실측 근거로 판단한다. 근거가 없는 취향 문제면 작성자 쪽을 따른다. 반복되는 논쟁은 규칙이나 도구로 올린다.\n  - \"멱등성은 왜 리뷰 체크 항목인가요?\" → 재시도·연타·네트워크 재전송은 반드시 일어난다. 멱등키를 요청 시각으로 만들면 요청마다 키가 달라져 멱등이 무력화된다. 키는 대상을 선택한 시점에 고정해야 한다.\n- <strong>출처:<\/strong> [What to look for in a code review (Google Engineering Practices)](https://google.github.io/eng-practices/review/reviewer/looking-for.html) · [Small CLs (Google Engineering Practices)](https://google.github.io/eng-practices/review/developer/small-cls.html)\n\n> 한 줄 정리: 실패는 오류로 보이게, 운영 오류는 소스맵·맥락까지 수집, 삭제는 참조 0 확인 후 단계별로, 리팩터는 고정→이동→변경, 리뷰는 정확성·계약·실패 경로부터.\n\n## 7. 확장 설계\n\n### 국제화 (Internationalization, i18n)\n\n- <strong>뭐야:<\/strong> 화면 문구와 날짜·숫자 형식을 코드에서 떼어 내 언어·지역마다 바꿔 끼울 수 있게 만드는 것이다. internationalization의 첫 글자 i와 끝 글자 n 사이 18글자를 숫자로 줄여 i18n이라 쓴다.\n- <strong>왜:<\/strong> 문구를 코드에 박아 두면 언어·고객 유형이 늘 때마다 모든 파일을 뒤진다. `count + \"개\"`처럼 이어 붙인 문장은 깨진다. 언어마다 어순과 복수형이 다르기 때문이다.\n- <strong>어떻게:<\/strong>\n  - <strong>문구 분리<\/strong>: 키로 언어별 메시지 테이블에서 문구를 찾는다. 문장 조각을 잇지 않는다. 자리표시자가 있는 문장을 통째로 둔다.\n  - <strong>형식은 `Intl`<\/strong>에 맡긴다. 날짜·숫자·통화는 `DateTimeFormat`·`NumberFormat`으로 맞춘다. 상대 시간과 복수형도 `Intl`로 처리한다. 복수형은 `PluralRules`를 쓰는데, 영어는 one/other 2종이고 아랍어는 6종이다.\n  - <strong>방향·언어 표시<\/strong>: `<html lang>`을 적는다. 스크린리더 발음과 하이픈 처리에 쓰인다. RTL(오른쪽에서 왼쪽으로 쓰는 언어)에 대응하려면 `margin-left` 대신 `margin-inline-start` 같은 논리 속성을 쓴다.\n  - 비교와 저장은 언어와 무관한 키나 서버 원본 값으로 한다. 번역 문구는 표시에만 쓴다.\n- <strong>핵심:<\/strong> i18n은 <strong>문구 분리 + `Intl` 형식 + 비교 키와 표시 분리<\/strong>다. 문장을 조각내 잇지 않는다.\n- <strong>꼬리질문:<\/strong>\n  - \"번역 파일이 커지면?\" → 언어·화면별로 쪼개 동적으로 불러온다. 또는 서버 컴포넌트에서 렌더한다.\n- <strong>출처:<\/strong> [Intl (MDN)](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl) · [Intl.PluralRules (MDN)](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl/PluralRules) · [CSS logical properties and values (MDN)](https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_logical_properties_and_values)\n\n### 프론트엔드 시스템 디자인 접근법 (Front-end System Design, RADIO)\n\n- <strong>뭐야:<\/strong> \"뉴스 피드를 설계해 보세요\" 같은 질문에 답하는 순서다. RADIO는 요구사항·아키텍처·데이터 모델·인터페이스·최적화의 앞 글자를 딴 체크리스트다.\n- <strong>왜:<\/strong> 순서가 없으면 컴포넌트 코드부터 말하다가 범위·데이터·API를 정하지 못한 채 끝난다.\n- <strong>어떻게:<\/strong> RADIO 순서로 푼다(시간 배분은 대략적 권장).\n  - <strong>R 요구사항<\/strong>(~10%): 핵심 기능과 비기능 요구(기기·오프라인·접근성·규모)를 질문으로 물어 범위를 확정한다.\n  - <strong>A 아키텍처<\/strong>(~20%): 서버·뷰·스토어·데이터 접근 층과 그 관계를 그림으로 그린다.\n  - <strong>D 데이터 모델<\/strong>(~10%): 서버 데이터와 클라이언트 전용 상태(입력·UI 상태)를 나눈다\n  - <strong>I 인터페이스<\/strong>(~20%): 서버↔클라이언트 API(HTTP·WebSocket·SSE, 페이지네이션)와 컴포넌트 간 props·이벤트를 정한다.\n  - <strong>O 최적화·심화<\/strong>(~40%): 그 제품에 특화된 성능·접근성·SEO·동시 수정을 다룬다.\n- <strong>핵심:<\/strong> 시스템 디자인 답변은 <strong>요구사항 → 아키텍처 → 데이터 모델 → 인터페이스 → 최적화<\/strong> 순서로 푼다. 백엔드 면접과 달리 DB 선택·서버 확장은 보통 범위 밖이다.\n- <strong>꼬리질문:<\/strong>\n  - \"순서대로만 가야 하나요?\" → 체크리스트일 뿐이다. 상대의 반응에 따라 앞 단계로 돌아간다.\n- <strong>출처:<\/strong> [RADIO Framework (GreatFrontEnd)](https://www.greatfrontend.com/front-end-system-design-playbook/framework) · [Front End System Design (Front End Interview Handbook)](https://www.frontendinterviewhandbook.com/front-end-system-design)\n\n> 한 줄 정리: 문구는 분리하고 형식은 `Intl`로, 설계 면접은 RADIO 순서로 범위부터 고정한다.\n\n## 핵심 키워드 모음\n\n- <strong>unknown vs any<\/strong>: any는 검사를 끄고 전염, unknown은 좁히기 강제. 외부 입력은 unknown.\n- <strong>판별 유니온<\/strong>: 리터럴 판별 필드로 불가능한 상태 제거, `never`로 완전성 검사.\n- <strong>제네릭<\/strong>: 입력·출력 타입 관계 표현, 제약은 최소·추론은 최대.\n- <strong>as 캐스팅<\/strong>: 변환이 아니라 \"믿어\" 선언. 계약 변경이 조용히 통과. `satisfies`로 대체할 자리가 많다.\n- <strong>런타임 검증(zod)<\/strong>: 경계에서 한 번, `z.infer`로 타입 단일화, `safeParse`로 실패를 값으로.\n- <strong>순수 함수 추출<\/strong>: 계산은 순수 함수, 효과는 훅, 표시는 컴포넌트. 계획과 실행 분리.\n- <strong>props 주입·합성·어댑터<\/strong>: 라우터·세션·외부 계약은 밖에서 받는다. boolean prop 대신 합성.\n- <strong>콜백 opt-in<\/strong>: 공용 부품은 최소 동작, 부수효과 책임자는 하나, 콜백 이름은 의도로.\n- <strong>디자인 시스템<\/strong>: 토큰(주의: DTCG 2025.10) + headless → 기본 → 도메인 부품, `variant` 유니온, compound.\n- <strong>FSD<\/strong>: app → (pages) → widgets → features → entities → shared 단방향, 같은 층 슬라이스끼리 금지(entities `@x` 예외), public API, 주의: v2.1에서 processes deprecated.\n- <strong>경계 검사 도구<\/strong>: steiger·boundaries·dependency-cruiser, baseline + 새 위반만 차단, 상대경로 사각지대.\n- <strong>테스트 비율<\/strong>: 피라미드 vs 트로피, 순수 로직 유닛·핵심 흐름 e2e, 사용자 관점으로 테스트.\n- <strong>모킹 경계<\/strong>: 네트워크·시간·플랫폼만 mock, 실측 픽스처로 가짜 모양 방지.\n- <strong>회귀 테스트<\/strong>: 실패 테스트 먼저 → 수정 → 통과, 이름에 증상.\n- <strong>시맨틱·aria<\/strong>: 네이티브 요소 우선, aria는 보충, 링크=이동·버튼=동작.\n- <strong>포커스·대비<\/strong>: 이동·가두기·복귀(`<dialog>`는 복귀 자동), `:focus-visible`, WCAG AA 4.5:1·큰 글자와 UI 3:1, 색만으로 의미 금지.\n- <strong>에러 처리<\/strong>: 로딩·빈·오류 구분, 사용자엔 행동·개발자엔 원인, 부류별 처리, Error Boundary는 렌더 에러만.\n- <strong>에러 모니터링<\/strong>: Boundary·`error`·`unhandledrejection` 수집, 소스맵, 릴리스·앱 버전 태그.\n- <strong>레거시 걷어내기<\/strong>: 참조 0 확인(grep 사각지대 주의) → 단계별 삭제 → 외부 노출은 호환 유지.\n- <strong>리팩터링 안전장치<\/strong>: 고정 → 이동 → 변경, 구조·동작 분리, 상수 단일 소스·드리프트 테스트.\n- <strong>코드 리뷰<\/strong>: 정확성·계약·실패 경로·멱등 우선, 스타일은 도구, 차단과 제안(`Nit:`) 구분, 작은 PR.\n- <strong>국제화<\/strong>: 문구 분리, `Intl`(복수형은 `PluralRules`), `lang`·논리 속성, 비교 키와 표시 분리.\n- <strong>시스템 디자인 면접<\/strong>: RADIO — 요구사항·아키텍처·데이터·인터페이스·최적화(40%).\n"}]</script>
<script>
(function(){
  const NOTES = JSON.parse(document.getElementById('data').textContent);
  const $ = s => document.querySelector(s);
  const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
  const store = {
    get(k,d){ try{ const v = localStorage.getItem('fenote:'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem('fenote:'+k, JSON.stringify(v)); }catch(e){} }
  };
  const conf = store.get('conf', {});
  const slug = s => s.toLowerCase().replace(/<[^>]+>/g,'').replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const ide = $('#ide'), scroller = $('#scroller'), doc = $('#doc'), panel = $('#panel');
  const mobile = () => matchMedia('(max-width:820px)').matches;
  const CONF_GLYPH = {no:'?', mid:'~', ok:'✓'}, CONF_TXT = {no:'모름', mid:'애매', ok:'앎'};
  const MODE_TXT = {off:'끔', core:'핵심 줄만', all:'핵심어 전부'};
  const PART_SLUG = {1:'browser',2:'javascript',3:'react',4:'nextjs',5:'data-state',6:'network-security',7:'performance',8:'design-quality'};

  // 테마 (IDE 버전은 다크 기본, 원본 사이트와 따로 기억)
  const rootEl = document.documentElement;
  if (!rootEl.dataset.theme) rootEl.dataset.theme = 'dark';
  const themeLabel = () => { const dark = rootEl.dataset.theme === 'dark'; ['#themeBtn','#themeBtnM'].forEach(s => { $(s).textContent = dark ? '라이트 테마' : '다크 테마'; $(s).title = dark ? '라이트 테마로 전환' : '다크 테마로 전환'; }); $('#themeBtn').textContent = dark ? '라이트' : '다크'; };
  themeLabel();
  $('#themeBtn').onclick = $('#themeBtnM').onclick = () => {
    const next = rootEl.dataset.theme === 'dark' ? 'light' : 'dark';
    rootEl.dataset.theme = next; store.set('ide-theme', next); themeLabel();
  };

  // 이름 규칙: 파트 = 폴더, 섹션 = 하위 폴더, 개념 = .md
  const partDir = n => n.id==='howto' ? '' : String(n.num).padStart(2,'0')+'-'+(PART_SLUG[n.num] || 'part');
  const fileOf = title => {
    const m = title.match(/\(([^()]*[A-Za-z][^()]*)\)\s*$/);
    const base = slug(m ? m[1] : title);
    return (base || 'concept') + '.md';
  };
  const korTitle = t => t.replace(/\s*\([^()]*\)\s*$/,'').replace(/[`*]/g,'').trim() || t;
  const secName = sec => sec.replace(/^\d+\.\s*/,'').trim();
  const secDir = sec => { const m = sec.match(/^(\d+)\.\s*(.+)/); return m ? m[1].padStart(2,'0')+'-'+m[2].trim().replace(/\s+/g,'-') : sec.replace(/\s+/g,'-'); };

  // 개념 목록(검색·탐색기용) 미리 추출
  const index = [];
  NOTES.forEach(n => {
    n.sections = [];
    let sec = null;
    n.md.split('\n').forEach(line => {
      const h2 = line.match(/^## (.+)/), h3 = line.match(/^### (.+)/);
      if (h2) { sec = h2[1].trim(); n.sections.push(sec); }
      if (h3) index.push({ part:n.id, title:h3[1].trim(), id:slug(h3[1]), sec:sec||'', body:'', n, file:fileOf(h3[1].trim()) });
    });
    n.kw = n.sections.find(s => /핵심 키워드/.test(s)) || null;
  });
  NOTES.forEach(n => {
    const blocks = n.md.split(/^### /m).slice(1);
    blocks.forEach(b => {
      const title = b.split('\n')[0].trim();
      const it = index.find(x => x.part===n.id && x.title===title);
      if (it) { it.body = b.toLowerCase(); it.raw = b; }
    });
  });
  const confKey = (part,id) => part+'/'+id;
  const partItems = n => index.filter(x => x.part===n.id);
  const partKnown = n => { const items = partItems(n); return [items.filter(x => conf[confKey(n.id,x.id)]==='ok').length, items.length]; };
  const partStats = n => { const [k,t] = partKnown(n); return t ? k+'/'+t : ''; };

  // ───── 탐색기 트리 ─────
  const expanded = new Set(store.get('ide-open', []));
  const collapsedSec = new Set(store.get('ide-sec-closed', []));
  const saveTree = () => { store.set('ide-open', [...expanded]); store.set('ide-sec-closed', [...collapsedSec]); };
  function row(o){
    const pad = 10 + o.depth*12 + (o.folder ? 0 : 12);
    const chev = o.folder ? (o.open ? '▾' : '▸') : '';
    const attrs = `data-act="${o.act}" data-p="${o.p}"${o.a!=null?` data-a="${esc(o.a)}"`:''}${o.key?` data-key="${esc(o.key)}"`:''}`;
    const v = o.v || '';
    const right = o.meta!=null ? `<span class="meta">${o.meta}</span>` : (o.memo ? `<span class="mk" title="메모 있음">메모</span>` : '') + (o.deco && v ? `<span class="deco" data-v="${v}" title="${CONF_TXT[v]}"></span>` : '');
    return `<button class="row${o.cls?' '+o.cls:''}" ${attrs} style="padding-left:${pad}px" title="${esc(o.tip||o.name)}"><span class="chev">${chev}</span>${o.num?`<span class="num">${esc(o.num)}</span>`:''}<span class="name">${esc(o.name)}</span>${right}</button>`;
  }
  function renderTree(){
    const side = $('#side'), st = side.scrollTop;
    let h = '';
    NOTES.forEach(n => {
      if (n.id==='howto') { h += row({depth:0, act:'readme', p:n.id, a:'', name:'읽는 법', tip:n.title}); return; }
      const open = expanded.has(n.id);
      h += row({depth:0, act:'part', p:n.id, folder:true, open, num:String(n.num).padStart(2,'0'), name:n.title, cls:'part', meta:partStats(n), tip:n.num+'. '+n.title+' ('+partDir(n)+')'});
      if (!open) return;
      h += `<div class="kids" style="--g:16px">`;
      h += row({depth:1, act:'readme', p:n.id, a:'', name:'개요', tip:'파트 개요 (README.md)'});
      const loose = index.filter(x => x.part===n.id && !x.sec);
      loose.forEach(it => { const v = conf[confKey(n.id,it.id)]; h += row({depth:1, act:'file', p:n.id, a:it.id, name:korTitle(it.title), deco:true, v, memo:hasMemo(n.id,it.id), cls:v==='ok'?'is-ok':'', tip:it.title+' · '+it.file}); });
      n.sections.forEach(sec => {
        if (sec===n.kw) return;
        const items = index.filter(x => x.part===n.id && x.sec===sec);
        const key = n.id+'|'+sec, so = !collapsedSec.has(key);
        const known = items.filter(x => conf[confKey(n.id,x.id)]==='ok').length;
        h += row({depth:1, act:'sec', p:n.id, a:slug(sec), key, folder:true, open:so, cls:'sec', name:secName(sec), meta:items.length?known+'/'+items.length:'', tip:sec});
        if (so && items.length) {
          h += `<div class="kids" style="--g:28px">`;
          items.forEach(it => { const v = conf[confKey(n.id,it.id)]; h += row({depth:2, act:'file', p:n.id, a:it.id, name:korTitle(it.title), deco:true, v, memo:hasMemo(n.id,it.id), cls:v==='ok'?'is-ok':'', tip:it.title+' · '+it.file}); });
          h += `</div>`;
        }
      });
      if (n.kw) h += row({depth:1, act:'kw', p:n.id, a:slug(n.kw), name:'핵심 키워드', tip:'핵심 키워드 모음 (KEYWORDS.md)'});
      h += `</div>`;
    });
    $('#tree').innerHTML = h;
    side.scrollTop = st;
    renderProgress();
    markTreeActive();
  }
  $('#tree').addEventListener('click', e => {
    const r = e.target.closest('.row'); if (!r) return;
    const {act, p, a, key} = r.dataset;
    if (act==='part') {
      if (p!==current) { expanded.add(p); saveTree(); go(p, ''); }
      else { expanded.has(p) ? expanded.delete(p) : expanded.add(p); saveTree(); renderTree(); }
    } else if (act==='sec') {
      collapsedSec.has(key) ? collapsedSec.delete(key) : collapsedSec.add(key); saveTree(); renderTree();
    } else if (act==='kw') { go(p, a); }
    else { go(p, a || ''); }
  });
  $('#collapseAll').onclick = () => { expanded.clear(); saveTree(); renderTree(); };
  function markTreeActive(){
    $$('#tree .row.on').forEach(r => r.classList.remove('on'));
    let sel;
    if (curA) sel = `#tree .row[data-p="${current}"][data-a="${CSS.escape(curA)}"]:not([data-act="sec"])`;
    else sel = `#tree .row[data-act="readme"][data-p="${current}"]`;
    const r = $(sel); if (!r) return;
    r.classList.add('on');
    const side = $('#side'), rt = r.getBoundingClientRect(), stt = side.getBoundingClientRect();
    if (rt.top < stt.top + 90 || rt.bottom > stt.bottom - 10) side.scrollTop += rt.top - stt.top - side.clientHeight/3;
  }
  function renderProgress(){
    const n = NOTES.find(x => x.id===current);
    let all = 0, tot = 0;
    NOTES.forEach(x => { const [k,t] = partKnown(x); all += k; tot += t; });
    let h = '';
    if (n && n.id!=='howto') { const [k,t] = partKnown(n); h += `<div class="pl-row"><span>${esc(n.title)}</span><span>${k}/${t}</span></div><div class="pbar"><i style="width:${t?k/t*100:0}%"></i></div>`; }
    h += `<div class="pl-row"><span>전체</span><span>${all}/${tot}</span></div><div class="pbar"><i style="width:${tot?all/tot*100:0}%"></i></div>`;
    h += `<div class="legend"><span><i style="background:var(--mod)"></i>모름</span><span><i style="background:var(--mid)"></i>애매</span><span><i style="background:var(--ok)"></i>앎</span></div>`;
    $('#progList').innerHTML = h;
    const [k,t] = n && n.id!=='howto' ? partKnown(n) : [all, tot];
    const cnt = v => (n && n.id!=='howto' ? partItems(n) : index).filter(x => conf[confKey(x.part,x.id)]===v).length;
    $('#sbProg').innerHTML = `앎 <b>${k}/${t}</b> · 애매 <b>${cnt('mid')}</b> · 모름 <b>${cnt('no')}</b>`;
    $$('.prog-frac').forEach(e => e.textContent = k+'/'+t);
    $('#mProg').textContent = k+'/'+t;
    $('#mProgPart').textContent = n && n.id!=='howto' ? String(n.num).padStart(2,'0')+' '+n.title : '전체';
    $('#mPbar').style.width = (t ? k/t*100 : 0)+'%';
  }

  // ───── 에디터 탭 ─────
  let tabs = store.get('ide-tabs', []).filter(t => NOTES.some(n => n.id===t.p));
  const MAX_TABS = 6;
  const tabKey = t => t.p+'/'+(t.a||'');
  function tabInfo(t){
    const n = NOTES.find(x => x.id===t.p);
    if (!t.a) return {name: n.id==='howto' ? '읽는 법' : n.title, tip: n.num+'. '+n.title, v:''};
    const it = index.find(x => x.part===t.p && x.id===t.a);
    if (it) return {name: korTitle(it.title), tip: it.title, v: conf[confKey(t.p,t.a)] || ''};
    if (n.kw && t.a===slug(n.kw)) return {name:'핵심 키워드', tip:'핵심 키워드 모음', v:''};
    return {name: t.a+'.md', tip: t.a, v:''};
  }
  function addTab(p, a){
    const k = tabKey({p,a});
    if (!tabs.some(t => tabKey(t)===k)) {
      tabs.push({p, a: a||''});
      while (tabs.length > MAX_TABS) tabs.shift();
      store.set('ide-tabs', tabs);
    }
    renderTabs();
  }
  function activeTabKey(){
    const k = tabKey({p:current, a:curA||''});
    if (tabs.some(t => tabKey(t)===k)) return k;
    return null;
  }
  function renderTabs(){
    const el = $('#tabs'), ak = activeTabKey();
    el.innerHTML = tabs.map((t,i) => {
      const info = tabInfo(t), on = tabKey(t)===ak;
      return `<div class="tab${on?' on':''}" role="tab" aria-selected="${on}" data-i="${i}" title="${esc(info.tip)}"><span class="t">${esc(info.name)}</span>${info.v?`<span class="dot" data-v="${info.v}" title="${CONF_TXT[info.v]}"></span>`:''}<button class="x" aria-label="탭 닫기">×</button></div>`;
    }).join('');
    const on = el.querySelector('.tab.on');
    if (on) { const l = on.offsetLeft, r = l + on.offsetWidth; if (l < el.scrollLeft || r > el.scrollLeft + el.clientWidth) el.scrollLeft = l - 20; }
  }
  $('#tabs').addEventListener('click', e => {
    const tab = e.target.closest('.tab'); if (!tab) return;
    const t = tabs[+tab.dataset.i]; if (!t) return;
    if (e.target.closest('.x')) { tabs.splice(+tab.dataset.i, 1); store.set('ide-tabs', tabs); renderTabs(); return; }
    resumeTab(t);
  });
  // 탭이 가리키는 개념 안에서 읽던 위치(개념 머리 기준 px)를 탭에 적어 둔다
  const tabTarget = a => { const el = document.getElementById(a); return el && doc.contains(el) ? (el.closest('section.concept') || el) : null; };
  function saveTabPos(){
    const k = activeTabKey(); if (!k) return;
    const tb = tabs.find(x => tabKey(x)===k);
    let off;
    if (tb.a) { const tg = tabTarget(tb.a); if (!tg || tg.offsetParent===null) return; off = Math.round(scroller.getBoundingClientRect().top - tg.getBoundingClientRect().top); }
    else off = Math.round(scroller.scrollTop);
    if (tb.off !== off) { tb.off = off; store.set('ide-tabs', tabs); }
  }
  function resumeTab(t){
    if (typeof t.off !== 'number') { go(t.p, t.a); return; }
    const off = t.off;
    if (t.p!==current) open(t.p, t.a || undefined);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (t.a) {
        const tg = tabTarget(t.a); if (!tg || tg.offsetParent===null) return;
        jump(t.a);
        scroller.scrollTop += tg.getBoundingClientRect().top - scroller.getBoundingClientRect().top + off;
      } else { scroller.scrollTop = off; setHash('#'+t.p); }
      spy();
      // 화면 구성이 바뀌어 그 개념을 벗어났으면 첫머리로
      if (curA !== (t.a || null)) { if (t.a) jump(t.a); else scroller.scrollTop = 0; spy(); }
    }));
    closeSide();
  }

  // ───── 파트 열기 · 이동 ─────
  let current = null, curA = null;
  const setHash = h => { history.replaceState(null, '', h); store.set('hash', h); };
  function go(p, a, noTab){
    if (p!==current) open(p, a || undefined);
    else if (a) jump(a);
    else { scroller.scrollTop = 0; setHash('#'+current); }
    if (!noTab) addTab(p, a || '');
    closeSide();
  }
  function open(id, anchor){
    const n = NOTES.find(x => x.id===id) || NOTES[0];
    current = n.id; store.set('last', n.id);
    expanded.add(n.id); saveTree();
    doc.innerHTML = marked.parse(n.md);
    enhance(doc, n);
    decorate(doc, n);
    const i = NOTES.indexOf(n), prev = NOTES[i-1], next = NOTES[i+1];
    const foot = document.createElement('div'); foot.className = 'nav-foot';
    const lab = x => esc(x.id==='howto' ? '읽는 법' : x.num+'. '+x.title);
    foot.innerHTML = (prev ? `<button class="press" data-go="${prev.id}"><small>이전</small>← ${lab(prev)}</button>` : '<span></span>')
                   + (next ? `<button class="press" data-go="${next.id}"><small>다음</small>${lab(next)} →</button>` : '<span></span>');
    foot.querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.go, ''));
    doc.appendChild(foot);
    $('#sbBranch').textContent = (n.id==='howto' ? 'main' : partDir(n));
    curA = null;
    renderTree();
    setHash('#'+n.id+(anchor?'/'+anchor:''));
    scroller.scrollTop = 0;
    measure();
    if (anchor) requestAnimationFrame(() => jump(anchor)); else spy();
    renderMemoList();
  }
  function jump(anchor){
    const el = document.getElementById(anchor);
    if (!el || !doc.contains(el)) return;
    const target = el.closest('section.concept') || el;
    scroller.scrollTop += target.getBoundingClientRect().top - scroller.getBoundingClientRect().top - 6 - (mobile() ? 48 : 0);
    setHash('#'+current+'/'+anchor);
    spy();
  }

  // ───── 원본 기능: 개념 카드·더 파고들기·빈칸 후보 ─────
  // 라벨은 글자로 판별한다(앞에 이모지가 남은 옛 원본도 무시하고 읽는다)
  const LEAD = /^[^\p{L}\p{N}]*/u;
  const LABEL_RE = /^(언제 문제 되나|뭐야|왜|어떻게|핵심|꼬리질문|내 사례|출처|이 파트는 뭐냐|이 노트는 뭐냐|한 줄 정리|주의)$/;
  const labelText = s => s.textContent.replace(/\s*[:：]\s*$/, '').trim();
  function liLabel(li){
    let host = li;
    const fe = li.firstElementChild;
    if (fe && fe.tagName==='P' && ![...li.childNodes].slice(0, [...li.childNodes].indexOf(fe)).some(x => x.textContent.trim())) host = fe;
    for (const x of host.childNodes) {
      if (x.nodeType===3) { if (x.textContent.replace(LEAD, '')) return ''; continue; }
      if (x.nodeType!==1) continue;
      return x.tagName==='STRONG' ? labelText(x) : '';
    }
    return '';
  }
  const quoteText = b => b.textContent.trim().replace(LEAD, '');
  const isWarnQuote = b => b.textContent.trim().startsWith('⚠') || /^주의/.test(quoteText(b));
  const isTipQuote = b => b.textContent.trim().startsWith('💡') || /^한 줄 정리/.test(quoteText(b));
  const isSummaryQuote = b => /^한 줄 정리/.test(quoteText(b));
  const isIvLi = li => /^(꼬리질문|내 사례)$/.test(liLabel(li));
  function enhance(doc, n){
    doc.querySelectorAll('h2').forEach(h => h.id = slug(h.textContent));
    doc.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    doc.querySelectorAll('blockquote').forEach(b => {
      if (isWarnQuote(b)) b.classList.add('warn');
      if (isTipQuote(b)) b.classList.add('tip');
    });
    const probs = $('#probs'); probs.innerHTML = '';
    let probTotal = 0;
    doc.querySelectorAll('h3').forEach(h => {
      const id = slug(h.textContent); h.id = id;
      const key = confKey(n.id,id);
      const box = document.createElement('section'); box.className = 'concept'; box.dataset.id = id;
      const head = document.createElement('div'); head.className = 'concept-head';
      h.parentNode.insertBefore(box, h);
      const c = document.createElement('div'); c.className = 'conf';
      c.setAttribute('role', 'group'); c.setAttribute('aria-label', '자기 평가');
      [['no','모름'],['mid','애매'],['ok','앎']].forEach(([v,t]) => {
        const b = document.createElement('button'); b.className = 'press'; b.dataset.v = v; b.textContent = t; b.title = '자기 평가: '+t;
        b.setAttribute('aria-pressed', conf[key]===v ? 'true' : 'false');
        b.onclick = () => {
          conf[key] = conf[key]===v ? undefined : v; if (!conf[key]) delete conf[key];
          store.set('conf', conf);
          c.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', conf[key]===x.dataset.v ? 'true':'false'));
          box.classList.toggle('is-ok', conf[key]==='ok');
          box.dataset.c = conf[key] || '';
          renderTree(); renderTabs();
        };
        c.appendChild(b);
      });
      const mb = document.createElement('button'); mb.className = 'mbtn press'; mb.dataset.c = id; mb.textContent = '메모';
      mb.dataset.has = hasMemo(n.id, id) ? '1' : ''; mb.title = mb.dataset.has ? '메모 있음 · 메모 열기' : '메모 쓰기';
      head.appendChild(h); head.appendChild(mb); head.appendChild(c); box.appendChild(head);
      box.classList.toggle('is-ok', conf[key]==='ok');
      box.dataset.c = conf[key] || '';
      let sib = box.nextSibling;
      while (sib && !(sib.nodeType===1 && /^H[1-3]$/.test(sib.tagName)) && !(sib.nodeType===1 && sib.tagName==='BLOCKQUOTE' && isSummaryQuote(sib))) {
        const nx = sib.nextSibling; box.appendChild(sib); sib = nx;
      }
      const lists = [...box.querySelectorAll(':scope > ul')], list = lists[0];
      if (list) {
        const iv = lists.flatMap(l => [...l.children]).filter(isIvLi);
        if (iv.length) {
          const g = buildGroup(n, id, h.textContent.trim(), iv);
          probs.appendChild(g);
          const cnt = g.querySelectorAll('.prob').length; probTotal += cnt;
          const fold = document.createElement('div'); fold.className = 'fold';
          fold.innerHTML = `<button class="foldbtn press" data-c="${esc(id)}" aria-expanded="false">더 파고들기 <span class="n">${cnt}</span>문항 <span class="more">패널에서 열기 ›</span></button>`;
          box.appendChild(fold);
        }
      }
    });
    if (!probTotal) probs.innerHTML = '<div class="p-empty">이 파일에는 더 파고들기 항목이 없습니다.</div>';
    $('#pCnt').textContent = probTotal; $('#sbIvCnt').textContent = probTotal;
    const ivOn = store.get('iv', false);
    $$('.prob', probs).forEach(d => d.open = ivOn);
    // 빈칸 후보
    const kwSection = [...doc.querySelectorAll('h2')].find(h => /핵심 키워드/.test(h.textContent));
    [...doc.querySelectorAll('strong'), ...probs.querySelectorAll('strong')].forEach(s => {
      if (s.closest('.concept-head, th')) return;
      if (LABEL_RE.test(labelText(s))) return;
      s.classList.add('blank');
      const li = s.closest('li');
      const top = li && li.closest('.concept > ul > li, article > ul > li');
      const isCore = doc.contains(s) && ((top && liLabel(top)==='핵심') ||
        (kwSection && kwSection.compareDocumentPosition(s) & Node.DOCUMENT_POSITION_FOLLOWING));
      if (isCore) s.classList.add('core');
      s.addEventListener('click', e => {
        if (document.body.classList.contains('mode-off')) return;
        if (s.closest('summary')) e.preventDefault();
        s.classList.toggle('shown');
        markBlankLines();
      });
    });
  }

  // 더 파고들기 → 하단 패널 그룹(개념별)
  function buildGroup(n, id, title, ivLis){
    const it = index.find(x => x.part===n.id && x.id===id);
    const fname = it ? it.file : fileOf(title);
    const g = document.createElement('details'); g.className = 'pgroup'; g.open = true; g.dataset.c = id;
    const path = partDir(n) + (it && it.sec ? '/'+secDir(it.sec) : '');
    g.innerHTML = `<summary><span class="chev">▸</span><span class="ttl">${esc(korTitle(title))}</span><span class="path">${esc(path)}</span><span class="cnt"></span></summary>`;
    let cnt = 0;
    ivLis.forEach(li => {
      const isCase = liLabel(li)==='내 사례';
      li.remove();
      if (!isCase) {
        const sub = li.querySelector(':scope > ul');
        const qs = sub ? [...sub.children] : [li];
        if (!sub) stripLabel(li);
        qs.forEach(q => { g.appendChild(probFrom(q, false, id)); cnt++; });
      } else {
        stripLabel(li);
        g.appendChild(probFrom(li, true, id)); cnt++;
      }
    });
    g.querySelector('.cnt').textContent = cnt;
    return g;
  }
  function stripLabel(li){
    const host = li.firstElementChild && li.firstElementChild.tagName==='P' ? li.firstElementChild : li;
    const first = host.firstChild;
    if (first && first.nodeType===3) first.textContent = first.textContent.replace(LEAD, '');
    const s = host.querySelector(':scope > strong');
    if (s && /^(꼬리질문|내 사례)\s*:?$/.test(s.textContent.trim())) s.remove();
    if (host.firstChild && host.firstChild.nodeType===3) host.firstChild.textContent = host.firstChild.textContent.replace(/^\s+/, '');
  }
  function probFrom(li, isCase, id){
    const d = document.createElement('details'); d.className = 'prob' + (isCase ? ' case' : '');
    const sum = document.createElement('summary');
    sum.innerHTML = `<span class="pi" aria-hidden="true">${isCase ? '사례' : 'Q'}</span><span class="q"></span><button class="loc" data-c="${esc(id)}" title="본문 위치로">L?</button>`;
    const q = sum.querySelector('.q'), ans = document.createElement('div'); ans.className = 'ans';
    const nodes = [...li.childNodes];
    if (isCase) {
      q.innerHTML = '<span class="lab" data-k="iv">내 사례</span> ' + esc(li.textContent.trim().split(/(?<=다\.)\s/)[0]);
      nodes.forEach(x => ans.appendChild(x));
    } else {
      let split = -1;
      for (let i = 0; i < nodes.length; i++) if (nodes[i].nodeType===3 && nodes[i].textContent.includes('→')) { split = i; break; }
      if (split < 0) { nodes.forEach(x => q.appendChild(x)); d.classList.add('noans'); }
      else {
        const t = nodes[split].textContent, k = t.indexOf('→');
        nodes.slice(0, split).forEach(x => q.appendChild(x));
        q.appendChild(document.createTextNode(t.slice(0, k).trimEnd()));
        ans.appendChild(document.createTextNode(t.slice(k+1).trimStart()));
        nodes.slice(split+1).forEach(x => ans.appendChild(x));
      }
    }
    d.appendChild(sum);
    if (!d.classList.contains('noans')) d.appendChild(ans);
    return d;
  }

  // ───── IDE 장식: 마크다운 기호·라벨·코드 색·줄 번호 ─────
  const LAB_KIND = {'언제 문제 되나':'when','뭐야':'what','왜':'why','어떻게':'how','핵심':'core','출처':'src','꼬리질문':'iv','내 사례':'iv','한 줄 정리':'tip','주의':'warn'};
