<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>프론트엔드 지식노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>try{var t=localStorage.getItem('fenote:ide-theme');if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
<style>
:root,[data-theme="dark"]{
  --act:#0f1114; --side:#14171b; --ed:#181b20; --tabs:#121418; --tab-on:#181b20; --panel:#15181c; --line:#2b2f36; --line2:#22262c;
  --fg:#c6cbd3; --sub:#959ca8; --faint:#656c78; --lnum:#4c535d; --lnum-cur:#c7ccd4; --cur:rgba(255,255,255,.03); --hover:rgba(255,255,255,.05); --sel:rgba(76,188,171,.12);
  --accent:#4cbcab; --accent-ink:#06201c; --status:#1b4a44; --status-fg:#dcefeb;
  --h:#f4f5f7; --strong:#eef0f3; --link:#5cc4b3; --quote:#aab0ba; --label:#8a919d;
  --kw:#e9806b; --fn:#6eb4f0; --str:#a9d38a; --tag:#e9806b; --attr:#e5c07b; --num:#c792ea; --cm:#5f6774; --codebg:rgba(255,255,255,.035); --inline-bg:rgba(255,255,255,.075);
  --fold:#252b33; --fold-dot:#7a8594; --del:#e0605a; --add-bg:rgba(76,188,171,.16); --add-fg:#c3f1e8;
  --mod:#e0605a; --mid:#e5b45a; --ok:#58c98a; --warn-bg:rgba(229,180,90,.06); --tip-bg:rgba(76,188,171,.06);
  --fig-accent:#3fb5a3; --fig-accent2:#e5a560; --fig-muted:#6b7380; --fig-line:#7d848d; --fig-bg:#14171c;
  --dir:#7d8592; --md:#5d6470;
  --seg-bg:rgba(255,255,255,.05); --seg-on:#2a2f37; --ring:0 0 0 1px rgba(255,255,255,.07); --lift:0 1px 2px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06);
}
[data-theme="light"]{
  --act:#ececee; --side:#f4f4f5; --ed:#fcfcfb; --tabs:#efeff1; --tab-on:#fcfcfb; --panel:#f4f4f5; --line:#dcdde1; --line2:#e8e9eb;
  --fg:#30343b; --sub:#5f6672; --faint:#989ea8; --lnum:#babec5; --lnum-cur:#30343b; --cur:rgba(0,0,0,.025); --hover:rgba(0,0,0,.045); --sel:rgba(29,133,116,.10);
  --accent:#1d8574; --accent-ink:#fff; --status:#1f7a6c; --status-fg:#f2fbf9;
  --h:#111418; --strong:#111418; --link:#1d8574; --quote:#4a505a; --label:#707682;
  --kw:#c2452d; --fn:#1f6fb8; --str:#3f7d1f; --tag:#c2452d; --attr:#9a6b00; --num:#8a3fb5; --cm:#9aa0a9; --codebg:rgba(0,0,0,.028); --inline-bg:rgba(0,0,0,.055);
  --fold:#e4e7ea; --fold-dot:#7e8792; --del:#cf3d36; --add-bg:rgba(29,133,116,.13); --add-fg:#0b5a4f;
  --mod:#cf3d36; --mid:#b07d0e; --ok:#1f8f52; --warn-bg:rgba(176,125,14,.06); --tip-bg:rgba(29,133,116,.06);
  --fig-accent:#1f8a7a; --fig-accent2:#c26a1d; --fig-muted:#9aa0a9; --fig-line:#7e8792; --fig-bg:#f2f3f1;
  --dir:#8a909a; --md:#a0a6af;
  --seg-bg:rgba(0,0,0,.05); --seg-on:#fff; --ring:0 0 0 1px rgba(0,0,0,.08); --lift:0 1px 2px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ed);color:var(--fg);overflow:hidden}
body{font:15px/1.5 "IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{display:block}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-ligatures:none}
.ico{width:16px;height:16px;flex:none}
.tnum{font-variant-numeric:tabular-nums}
.press{transition-property:transform,color,background-color,box-shadow;transition-duration:.15s;transition-timing-function:cubic-bezier(.2,0,0,1)}
.press:active{transform:scale(.96)}

.ide{display:grid;grid-template-columns:288px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 24px;height:100vh;height:100dvh}
.ide.noexp{grid-template-columns:minmax(0,1fr)}
.ide.noexp .explorer{display:none}


/* explorer */
.explorer{background:var(--side);box-shadow:inset -1px 0 var(--line2);overflow:auto;font:13px/1.3 "IBM Plex Sans KR",sans-serif;user-select:none;min-height:0;overscroll-behavior:contain}
.ex-title{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 8px 20px;font-size:11.5px;font-weight:600;color:var(--sub)}
.ex-title button{position:relative;color:var(--faint);height:24px;padding:0 8px;border-radius:5px;font-size:11.5px;font-weight:500}
.ex-title button::after{content:"";position:absolute;inset:-8px}
.ex-title button:hover{color:var(--fg);background:var(--hover)}
.ex-search{padding:0 12px 10px 14px}
.ex-search input{width:100%;height:30px;padding:0 10px;border:0;border-radius:6px;background:var(--seg-bg);box-shadow:var(--ring);color:var(--fg);font:13px "IBM Plex Sans KR",sans-serif}
.ex-search input::placeholder{color:var(--faint)}
.ex-search input:focus{outline:none;box-shadow:0 0 0 1px var(--accent)}
.ex-root{padding:6px 12px 4px 20px;font-weight:600;font-size:11.5px;color:var(--sub)}
.row{display:flex;align-items:center;gap:6px;height:28px;padding-right:12px;width:100%;text-align:left;white-space:nowrap;position:relative;transition:background-color .12s}
.row:hover{background:var(--hover)}
.row.on{background:var(--sel)}
.row.on .name{color:var(--h)}
.row .chev{width:12px;color:var(--faint);font-size:11px;flex:none;text-align:center}
.row .num{font:11px "JetBrains Mono",monospace;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}
.row .name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row.part .name{font-weight:500;color:var(--fg)}
.row.sec .name{color:var(--sub)}
.row .meta{margin-left:auto;color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums;flex:none}
.row .deco{margin-left:auto;width:6px;height:6px;border-radius:50%;flex:none}
.deco[data-v="no"]{background:var(--mod)} .deco[data-v="mid"]{background:var(--mid)} .deco[data-v="ok"]{background:var(--ok)}
.kids{position:relative}
.kids::before{content:"";position:absolute;top:0;bottom:0;left:var(--g);width:1px;background:var(--line2)}
body.weak-only .row.is-ok{display:none}
.ex-sec{margin-top:12px;box-shadow:inset 0 1px var(--line2)}
.prog-list{padding:0 16px 16px 20px;font-size:12px;color:var(--sub);line-height:1.6;font-variant-numeric:tabular-nums}
.prog-list .pl-row{display:flex;justify-content:space-between;gap:8px}
.prog-list .pl-row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar{height:3px;background:var(--line2);border-radius:2px;margin:5px 0 10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);width:0;border-radius:2px;transition:width .3s cubic-bezier(.2,0,0,1)}
.legend{display:flex;gap:12px;color:var(--faint);font-size:11.5px}
.legend i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.results{list-style:none;margin:0;padding:0 0 12px}
.results .r-head{padding:4px 14px 6px 20px;color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.results button{display:block;width:100%;text-align:left;padding:6px 12px 7px 20px;line-height:1.4;transition:background-color .12s}
.results button:hover{background:var(--hover)}
.results .r-file{display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden}
.results .r-file b{font-weight:500;color:var(--fg);overflow:hidden;text-overflow:ellipsis;min-width:0}
.results .r-file small{color:var(--faint);font:11px "JetBrains Mono",monospace;flex:none}
.results .r-snip{display:block;margin:2px 0 0;font-size:12px;line-height:1.5;color:var(--sub);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
mark{background:color-mix(in srgb,var(--accent) 26%,transparent);color:inherit;border-radius:2px;padding:0 1px}

/* editor */
.editor{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--ed)}
.tabbar{display:flex;flex:none;background:var(--tabs);min-width:0}
.tabs{display:flex;background:var(--tabs);overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0;min-height:36px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;height:36px;padding:0 6px 0 12px;font-size:12.5px;color:var(--faint);box-shadow:inset -1px 0 var(--line2);white-space:nowrap;position:relative;flex:none;cursor:pointer;max-width:220px;transition:color .12s}
.tab>span.t{overflow:hidden;text-overflow:ellipsis}
.tab:hover{color:var(--fg)}
.tab.on{background:var(--tab-on);color:var(--fg)}
.tab.on::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
.tab .x{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;color:var(--faint);font-size:14px;flex:none;opacity:.7}
.tab .x:hover{background:var(--hover);color:var(--fg);opacity:1}
.tab .dot{width:6px;height:6px;border-radius:50%;flex:none}
.dot[data-v="no"]{background:var(--mod)} .dot[data-v="mid"]{background:var(--mid)} .dot[data-v="ok"]{background:var(--ok)}
.totop{display:none}
.expbtn{position:relative;display:inline-grid;place-items:center;width:28px;height:28px;margin-left:-6px;border-radius:6px;color:var(--sub);flex:none;transition-property:color,background-color;transition-duration:.15s;transition-timing-function:cubic-bezier(.2,0,0,1)}
.expbtn::after{content:"";position:absolute;inset:-6px}
.expbtn:hover{color:var(--fg);background:var(--hover)}
.expbtn:active{scale:.96}
.expbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.expbtn svg{width:16px;height:16px;display:block}
.expbtn .fill{fill:currentColor;opacity:.9;transition-property:opacity;transition-duration:.15s}
.expbtn[aria-expanded="false"] .fill{opacity:0}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;padding:6px 12px 6px 16px;box-shadow:inset 0 -1px var(--line2);font-size:12.5px;color:var(--sub);flex:none;min-height:44px}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 260px;overflow:hidden;white-space:nowrap}
.crumb i{font-style:normal;color:var(--faint);flex:none;font-size:11px}
.crumb .p{font:11.5px "JetBrains Mono",monospace;color:var(--faint)}
.crumb button{color:var(--sub);flex:none;transition:color .12s}
.crumb button:hover{color:var(--fg)}
.crumb b{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tools .tl{color:var(--faint);font-size:12px}
.seg{display:inline-flex;padding:2px;border-radius:7px;background:var(--seg-bg)}
.seg button{position:relative;height:24px;padding:0 10px;border-radius:5px;color:var(--sub);font-size:12px}
.seg button::after{content:"";position:absolute;inset:-8px 0}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--h);font-weight:500;box-shadow:var(--lift)}
.tsep{width:1px;height:16px;background:var(--line);margin:0 2px}
.ibtn{position:relative;height:28px;padding:0 9px;border-radius:6px;color:var(--sub);font-size:12px;white-space:nowrap}
.ibtn::after{content:"";position:absolute;inset:-6px -4px}
.ibtn:hover{color:var(--fg);background:var(--hover)}
.tocbtn{display:none;position:relative;flex:none;align-items:center;height:36px;padding:0 16px;font-size:14px;font-weight:600;color:var(--accent);box-shadow:inset -1px 0 var(--line);isolation:isolate}
.tocbtn::before{content:"";position:absolute;inset:4px 6px;border-radius:7px;background:color-mix(in srgb,var(--accent) 16%,transparent);z-index:-1;transition-property:background-color;transition-duration:.15s;transition-timing-function:cubic-bezier(.2,0,0,1)}
.tocbtn::after{content:"";position:absolute;inset:-4px 0}
.tocbtn:hover::before{background:color-mix(in srgb,var(--accent) 24%,transparent)}
.tocbtn[aria-expanded="true"]{color:var(--accent-ink)}
.tocbtn[aria-expanded="true"]::before{background:var(--accent)}
.tocbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
[data-theme="light"] .tocbtn:not([aria-expanded="true"]){color:#0f5c4f}
.ibtn[aria-pressed="true"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.scroller{overflow-y:auto;overflow-x:hidden;min-width:0;overscroll-behavior:contain}

/* document = 마크다운 미리보기 */
.file{--gut:64px;--row:28.8px;--lh:28.8px;position:relative;isolation:isolate;padding:28px 48px 96px var(--gut);max-width:calc(var(--gut) + 1120px);font-size:16px;line-height:1.8;overflow-wrap:anywhere}
.ln::before{content:"";position:absolute;left:0;right:0;z-index:-1;height:var(--lh);padding-right:calc(100% - var(--gut) + 18px);text-align:right;font:400 11px/1 "JetBrains Mono",monospace;line-height:var(--lh);color:var(--lnum);font-variant-numeric:tabular-nums;letter-spacing:0;text-indent:0;pointer-events:none;user-select:none;white-space:nowrap;background-repeat:no-repeat}
.file h3.ln::before{content:"L" attr(data-ln)}
.ln.cur::before{background-color:var(--cur)}
.ln.del::before{background-image:linear-gradient(var(--del),var(--del));background-size:2px 100%;background-position:calc(var(--gut) - 12px) 0}
.ln.hit::before{background-color:color-mix(in srgb,var(--accent) 12%,transparent)}
.concept.here h3.ln::before,.file h3.ln.cur::before{color:var(--accent)}
.file h1,.file h2,.file h3,.file h4{color:var(--h);scroll-margin-top:8px;text-wrap:balance}
.file h1{font-size:30px;line-height:40px;--lh:40px;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
.part-meta{margin:0 0 28px;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.part-meta b{color:var(--sub);font-weight:500}
.file h2{font-size:22px;line-height:32px;--lh:32px;margin:72px 0 4px;font-weight:700;letter-spacing:-.015em;padding-bottom:10px;box-shadow:inset 0 -1px var(--line2)}
.file h3{font-size:18px;line-height:30px;--lh:30px;margin:0;font-weight:600;letter-spacing:-.01em}
.file h3 .en{font-weight:400;font-size:13.5px;color:var(--faint);letter-spacing:0;margin-left:6px}
.file h4{font-size:16px;margin:20px 0 4px}
.file p{margin:8px 0;text-wrap:pretty}
.file li{text-wrap:pretty}
.file ul,.file ol{margin:6px 0;padding-left:1.3em}
.file ul{list-style:disc}
.file ul ul{list-style:circle}
.file li{margin:4px 0}
.file li::marker{color:var(--faint);font-variant-numeric:tabular-nums}
.file ol>li::marker{font-size:.9em}
.file li>p{margin:0}
.file li>ul,.file li>ol{margin:4px 0}
.file li.has-lab{list-style:none;position:relative;padding-left:7.6em;margin:10px 0}
.concept>ul{padding-left:0}
.file a{color:var(--link);text-decoration:none;transition:color .12s}
.file a:hover{text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--link) 45%,transparent);text-underline-offset:3px}
.host{margin-left:4px;color:var(--faint);font-size:11.5px;opacity:.75}
.src-sep{color:var(--faint);margin:0 6px}
.file code{font:13.5px "JetBrains Mono",monospace;font-variant-ligatures:none;color:inherit;background:var(--inline-bg);border-radius:4px;padding:1px 5px}
.file pre{position:relative;margin:12px 0;padding:0;background:var(--codebg);box-shadow:var(--ring);border-radius:8px;white-space:pre-wrap;overflow:hidden}
.file pre[data-lang]::after{content:attr(data-lang);position:absolute;top:6px;right:10px;font:10.5px "JetBrains Mono",monospace;color:var(--faint);pointer-events:none}
.file pre code{display:block;background:none;padding:12px 0;color:var(--fg);font-size:13.5px;border-radius:0}
.cl{display:block;--lh:24px;line-height:24px;padding:0 16px;min-height:24px;white-space:pre-wrap;overflow-wrap:anywhere}
.t-kw{color:var(--kw)} .t-fn{color:var(--fn)} .t-str{color:var(--str)} .t-tag{color:var(--tag)} .t-num{color:var(--num)} .t-cm{color:var(--cm);font-style:italic} .t-at{color:var(--attr)}
.file table{display:block;overflow-x:auto;border-collapse:collapse;margin:14px 0;font-size:14.5px;line-height:1.6;max-width:100%}
.file th,.file td{border-bottom:1px solid var(--line2);padding:7px 14px 7px 0;text-align:left;vertical-align:top;--lh:23.2px;overflow-wrap:break-word;word-break:keep-all}
.file td:first-child,.file th:first-child{white-space:nowrap}
.file th{color:var(--sub);font-weight:600;font-size:12.5px;line-height:23.2px;border-bottom-color:var(--line)}
.file blockquote{margin:14px 0;padding:8px 16px;border-left:2px solid var(--line);color:var(--quote);border-radius:0 6px 6px 0}
.file blockquote p{margin:2px 0}
.file blockquote.warn{border-left-color:color-mix(in srgb,var(--mid) 70%,transparent);background:var(--warn-bg)}
.file blockquote.tip{border-left-color:var(--accent);background:var(--tip-bg);color:var(--fg)}
.lab{font-size:12.5px;font-weight:600;color:var(--label);white-space:nowrap;margin-right:.55em;letter-spacing:.01em}
.lab strong{font-weight:inherit;color:inherit}
li.has-lab>.lab,li.has-lab>p:first-child>.lab{position:absolute;left:0;top:0;width:7em;line-height:var(--row);margin:0;overflow:hidden;text-overflow:ellipsis}
.file strong{color:var(--strong);font-weight:650}
.fig{margin:18px 0;padding:16px;background:var(--fig-bg);box-shadow:var(--ring);border-radius:10px;color:var(--fg);text-align:center}
.fig svg{width:100%;height:auto;max-width:720px;margin:0 auto;border-radius:4px}
.fig figcaption{font-size:13px;line-height:1.6;color:var(--sub);margin-top:10px;text-align:left;text-wrap:pretty}

/* 개념 */
.concept{padding:32px 0 8px;box-shadow:inset 0 1px var(--line2)}
.file h2+.concept,.file h2+p+.concept{box-shadow:none;padding-top:20px}
body.weak-only .concept.is-ok{display:none}
.concept-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px;margin-bottom:8px}
.concept-head h3{flex:1 1 300px;min-width:0}
.conf{display:inline-flex;flex:none;padding:2px;border-radius:7px;background:var(--seg-bg);margin-left:auto}
.conf button{position:relative;height:24px;padding:0 10px;border-radius:5px;font-size:12px;color:var(--faint)}
.conf button::after{content:"";position:absolute;inset:-8px 0}
.conf button:hover{color:var(--fg)}
.conf button[aria-pressed="true"]{background:var(--seg-on);box-shadow:var(--lift);font-weight:500}
.conf button[data-v="no"][aria-pressed="true"]{color:var(--mod)}
.conf button[data-v="mid"][aria-pressed="true"]{color:var(--mid)}
.conf button[data-v="ok"][aria-pressed="true"]{color:var(--ok)}
.fold{--lh:32px;margin:12px 0 4px}
.foldbtn{position:relative;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:7px;background:var(--seg-bg);color:var(--sub);font-size:13px}
.foldbtn::after{content:"";position:absolute;inset:-4px 0}
.foldbtn:hover{color:var(--fg);background:var(--hover)}
.foldbtn .n{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.foldbtn .more{color:var(--faint);font-size:12px}

/* 빈칸 */
.blank{border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .15s,color .15s}
body.mode-core .blank.core,body.mode-all .blank{cursor:pointer}
body.mode-core .blank.core:not(.shown),body.mode-all .blank:not(.shown){color:transparent;background:radial-gradient(circle,var(--fold-dot) 1.2px,transparent 1.7px) 4px 55%/8px 8px repeat-x,var(--fold)}
body.mode-core .blank.core:not(.shown) *,body.mode-all .blank:not(.shown) *{color:transparent;background:none;border-color:transparent}
body.mode-core .blank.core.shown,body.mode-all .blank.shown{background:var(--add-bg);color:var(--add-fg)}

.nav-foot{display:flex;gap:12px;margin-top:64px;font-size:14px;line-height:1.5}
.nav-foot button{flex:1;min-width:0;box-shadow:var(--ring);border-radius:10px;padding:12px 16px;text-align:left;color:var(--fg)}
.nav-foot button:hover{box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 60%,transparent)}
.nav-foot button:last-child{text-align:right}
.nav-foot small{display:block;color:var(--faint);font-size:12px;margin-bottom:2px}
.nav-foot span{flex:1}

/* panel — 더 파고들기 */
.panel{flex:none;height:0;overflow:hidden;box-shadow:inset 0 1px var(--line);background:var(--panel);display:flex;flex-direction:column;transition:height .22s cubic-bezier(.2,0,0,1)}
.panel.open{height:min(320px,46vh)}
.panel.resizing{transition:none}
.p-resize{position:relative;z-index:6;flex:none;height:0;outline:none;touch-action:none;cursor:row-resize}
.p-resize[hidden]{display:none}
.p-resize::before{content:"";position:absolute;left:0;right:0;top:-5px;bottom:-5px}
.p-resize::after{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--accent);opacity:0;pointer-events:none;transition-property:opacity;transition-duration:.15s;transition-timing-function:cubic-bezier(.2,0,0,1)}
.p-resize:hover::after,.p-resize:focus-visible::after,.p-resize.on::after{opacity:1}
@media (pointer:coarse){.p-resize::before{top:-10px;bottom:-6px}}
body.p-dragging{cursor:row-resize;-webkit-user-select:none;user-select:none}
body.p-dragging *{cursor:row-resize!important}
.p-head{display:flex;align-items:center;gap:2px;padding:0 6px 0 8px;height:36px;flex:none;font-size:12px}
.p-tab{padding:0 10px;height:36px;color:var(--faint);position:relative;white-space:nowrap;transition:color .12s}
.p-tab:hover{color:var(--fg)}
.p-tab.on{color:var(--fg);font-weight:500}
.p-tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:5px;height:2px;border-radius:1px;background:var(--accent)}
.p-tab .cnt{display:inline-block;margin-left:6px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--seg-bg);color:var(--sub);text-align:center;font-size:11px;line-height:17px;font-variant-numeric:tabular-nums}
.p-head .sp{flex:1}
.p-head .icon{height:28px;padding:0 9px;color:var(--faint);border-radius:6px;font-size:12px}
.p-head .icon:hover{background:var(--hover);color:var(--fg)}
.p-body{flex:1;overflow:auto;padding:2px 0 14px;overscroll-behavior:contain}
.p-pane[hidden]{display:none}
.p-empty{padding:10px 16px;font-size:13px;color:var(--faint)}
.pgroup>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:5px 14px;font-size:13px;font-weight:500;cursor:pointer;color:var(--fg);white-space:nowrap;overflow:hidden}
.pgroup>summary::-webkit-details-marker,.prob>summary::-webkit-details-marker{display:none}
.pgroup>summary .chev{color:var(--faint);width:10px;flex:none;font-size:9px;transition:transform .15s cubic-bezier(.2,0,0,1)}
.pgroup[open]>summary .chev{transform:rotate(90deg)}
.pgroup>summary .ttl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.pgroup>summary .path{color:var(--faint);font:400 11px "JetBrains Mono",monospace;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 10 auto}
.pgroup>summary .cnt{margin-left:auto;min-width:18px;padding:0 5px;border-radius:9px;background:var(--seg-bg);color:var(--sub);text-align:center;font-size:11px;font-weight:400;flex:none;font-variant-numeric:tabular-nums}
.pgroup.here>summary{color:var(--accent)}
.prob{margin-left:24px}
.prob>summary{list-style:none;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:6px;padding:5px 14px 5px 6px;font-size:14.5px;line-height:1.6;cursor:pointer;border-radius:6px;transition:background-color .12s}
.prob>summary:hover{background:var(--hover)}
.prob>summary .pi{font-size:12px;line-height:23px;color:var(--faint);text-align:center}
.prob>summary .q{min-width:0;overflow-wrap:anywhere;text-wrap:pretty}
.prob.case>summary .q{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prob.case[open]>summary .q{white-space:normal}
.prob>summary .loc{font:11px/23px "JetBrains Mono",monospace;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.prob>summary .loc:hover{color:var(--accent)}
.prob .ans{margin:2px 14px 10px 34px;padding:8px 14px;border-left:2px solid var(--accent);border-radius:0 6px 6px 0;font-size:15px;line-height:1.75;color:var(--fg);background:var(--tip-bg);overflow-wrap:anywhere;text-wrap:pretty}
.prob .ans ul{margin:4px 0;padding-left:18px}
.prob:not([open])>summary .q::after{content:"  답 보기";color:var(--faint);font-size:12px}
.prob.noans>summary .q::after{content:none}
.prob strong{color:var(--strong);font-weight:650}
.prob code{font:13px "JetBrains Mono",monospace;color:inherit;background:var(--inline-bg);border-radius:4px;padding:1px 4px}
.prob a{color:var(--link);text-decoration:none}
.prob .lab{margin-right:.4em}
/* 메모 */
.memo{padding:6px 16px 0;font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif}
.mm-head{display:flex;align-items:baseline;gap:10px;min-height:24px;font-size:12.5px}
.mm-target{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg);font-weight:500}
.mm-target .k{color:var(--faint);font-weight:400;margin-right:6px;font-variant-numeric:tabular-nums}
.mm-state{flex:none;color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums;transition:opacity .2s cubic-bezier(.2,0,0,1)}
.mm-state:empty{opacity:0}
.mm-state.err{color:var(--mod)}
#memoText{display:block;width:100%;min-height:112px;height:128px;resize:vertical;margin:6px 0 8px;padding:10px 12px;border:0;border-radius:8px;background:var(--seg-bg);box-shadow:var(--ring);color:var(--fg);font:14px/1.7 "IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;text-wrap:pretty;transition-property:box-shadow;transition-duration:.15s;transition-timing-function:cubic-bezier(.2,0,0,1)}
#memoText::placeholder{color:var(--faint)}
#memoText:focus{outline:none;box-shadow:0 0 0 1px var(--accent)}
.mm-foot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:0 -9px}
.mm-foot .sp{flex:1}
.mm-foot .n{font-variant-numeric:tabular-nums}
.mm-foot .ibtn[aria-expanded="true"]{color:var(--fg);background:var(--hover)}
.mm-list{margin:8px 0 4px;padding:4px;border-radius:10px;background:var(--seg-bg);box-shadow:var(--ring)}
.mm-item{display:block;width:100%;text-align:left;padding:7px 10px 8px;border-radius:6px;transition:background-color .12s,transform .15s cubic-bezier(.2,0,0,1)}
.mm-item:hover{background:var(--hover)}
.mm-item.on{background:var(--sel)}
.mm-item b{display:block;font-weight:500;font-size:13px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mm-item span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px;font-size:12.5px;line-height:1.55;color:var(--sub);white-space:pre-line;text-wrap:pretty;overflow-wrap:anywhere}
.mm-list .p-empty{padding:6px 10px}
.row .mk{margin-left:auto;flex:none;font-size:10.5px;color:var(--faint);opacity:.85}
.row .mk+.deco{margin-left:0}
.mbtn{position:relative;flex:none;height:24px;padding:0 8px;border-radius:5px;font-size:12px;color:var(--faint);margin-left:auto;transition-property:transform,color,background-color,opacity;transition-duration:.15s;transition-timing-function:cubic-bezier(.2,0,0,1)}
.mbtn::after{content:"";position:absolute;inset:-8px 0}
.mbtn:hover{color:var(--fg);background:var(--hover)}
.mbtn[data-has="1"]{color:var(--accent)}
.mbtn:not([data-has="1"]){opacity:0}
.concept:hover .mbtn,.concept.here .mbtn,.mbtn:focus-visible{opacity:1}
@media (hover:none){.mbtn:not([data-has="1"]){opacity:1}}
.mbtn+.conf{margin-left:0}

/* status bar */
.status{grid-column:1/-1;display:flex;align-items:stretch;background:var(--status);color:var(--status-fg);font-size:11.5px;line-height:24px;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap;min-width:0}
.status>*{padding:0 10px;display:flex;align-items:center;gap:6px;flex:none}
.status button{transition:background-color .12s}
.status button:hover{background:rgba(255,255,255,.12)}
.status .grow{flex:1;padding:0}
.status .remote{background:color-mix(in srgb,var(--status) 60%,#000);padding:0 12px}
.status .pos{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;display:block}
.status .m{font-family:"JetBrains Mono",monospace;font-size:11px}

#scrim{display:none}
@media (max-width:820px){
  .ide,.ide.noexp{grid-template-columns:minmax(0,1fr)}
  .ide.noexp .explorer{display:block}
  .tocbtn{display:flex}
  .explorer{position:fixed;z-index:20;left:0;top:36px;bottom:24px;width:min(300px,calc(100vw - 48px));transform:translateX(calc(-100% - 60px));transition:transform .22s cubic-bezier(.2,0,0,1);box-shadow:8px 0 24px rgba(0,0,0,.35)}
  body.side-open .explorer{transform:none}
  body.side-open #scrim{display:block;position:fixed;inset:36px 0 24px 0;z-index:15;background:rgba(0,0,0,.35)}
  .file{--gut:16px;--row:27.9px;padding:16px 16px 64px var(--gut);font-size:15.5px}
  .ln::before{padding-right:0}
  .file h3.ln::before{content:""}
  .ln.del::before{background-position:4px 0}
  .file h1{font-size:24px;line-height:33px;--lh:33px}
  .file h2{font-size:19.5px;line-height:29px;--lh:29px;margin-top:52px}
  .file h3{font-size:17px;line-height:27px;--lh:27px}
  .file pre code{font-size:12.5px}
  .file li.has-lab{padding-left:0}
  li.has-lab>.lab,li.has-lab>p:first-child>.lab{position:static;display:block;width:auto;line-height:1.6;margin-bottom:1px}
  .fig{padding:8px}
  .crumbs{padding:6px 10px}
  .expbtn{display:none}
  .crumb{flex-basis:100%}
  .tools .tl{display:none}
  .status .hide-m{display:none}
  .status>*{padding:0 7px}
  .prob{margin-left:6px}
  .prob .ans{margin-left:14px}
  .tab{max-width:170px}
}

/* ───── 모바일: 경로 줄 · 하단 바 · 바텀 시트 (820px 이하에만) ───── */
.mpath,.mbar,.sh-grip,.sh-title,.m-dhead{display:none}
@media (max-width:820px){
  :root{--barh:calc(56px + env(safe-area-inset-bottom,0px));--pathh:40px;--ease:cubic-bezier(.2,0,0,1)}
  .ide,.ide.noexp{grid-template-rows:minmax(0,1fr);padding-bottom:var(--barh)}
  .tabbar,.crumbs,.status,.p-resize,.p-tab,#panelMax{display:none!important}

  /* 경로 줄 */
  .mpath{display:flex;position:fixed;top:0;left:0;right:0;z-index:12;align-items:center;gap:7px;width:100%;height:calc(var(--pathh) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;background:color-mix(in srgb,var(--ed) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 -1px var(--line2);font-size:13px;color:var(--sub);text-align:left;white-space:nowrap;overflow:hidden;transition:transform .26s var(--ease)}
  body.path-hid .mpath{transform:translateY(-100%)}
  .mpath .n{font:500 12px "JetBrains Mono",monospace;font-variant-numeric:tabular-nums;color:var(--accent);flex:none}
  .mpath .pt{flex:none;color:var(--sub)}
  .mpath i{font-style:normal;color:var(--faint);flex:none}
  .mpath b{font-weight:500;color:var(--fg);overflow:hidden;text-overflow:ellipsis;min-width:0}
  .file{padding-top:calc(var(--pathh) + env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(var(--shh,0px) + 40px)}

  /* 하단 바 */
  .totop{display:inline-flex;align-items:center;position:fixed;right:16px;bottom:calc(var(--barh) + var(--shh,0px) + 16px);z-index:25;justify-content:center;width:44px;height:44px;padding:0;border-radius:50%;background:var(--side);color:var(--fg);box-shadow:0 0 0 1px var(--line),0 8px 20px rgba(0,0,0,.28);opacity:0;translate:0 8px;pointer-events:none;transition-property:opacity,translate,bottom;transition-duration:.2s;transition-timing-function:var(--ease)}
  .totop::after{content:"";position:absolute;inset:-4px}
  .totop svg{width:18px;height:18px;display:block}
  .totop.show{opacity:1;translate:0 0;pointer-events:auto}
  .totop:active{scale:.96}
  body.side-open .totop{opacity:0;pointer-events:none}
  .mbar{display:flex;gap:4px;position:fixed;left:0;right:0;bottom:0;z-index:30;height:var(--barh);padding:6px 8px env(safe-area-inset-bottom,0px);background:var(--side);box-shadow:0 -1px 0 var(--line2)}
  .mbar button{flex:1 1 0;min-width:0;height:44px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:10px;font-size:14.5px;font-weight:500;color:var(--sub);white-space:nowrap;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .mbar button[aria-pressed="true"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
  [data-theme="light"] .mbar button[aria-pressed="true"]{color:#0f5c4f}
  .mbar button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .mbar .st{display:inline-block;min-width:2em;text-align:left;font-size:13px;font-weight:600}
  .mbar button[aria-pressed="false"]:not([data-on="1"]) .st{color:var(--faint);font-weight:500}
  .mbar button[aria-pressed="false"][data-on="1"] .st{color:var(--accent)}
  [data-theme="light"] .mbar button[aria-pressed="false"][data-on="1"] .st{color:#0f5c4f}

  /* 목차 서랍 */
  .explorer{top:0;bottom:var(--barh);z-index:22;width:min(320px,calc(100vw - 56px))}
  body.side-open #scrim{inset:0 0 var(--barh) 0;z-index:21;background:rgba(0,0,0,.4)}
  .m-dhead{display:block;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 14px 20px;box-shadow:inset 0 -1px var(--line2);margin-bottom:6px}
  .m-prog{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--sub)}
  .m-prog b{font-size:20px;line-height:1;color:var(--h);font-weight:600;font-variant-numeric:tabular-nums;margin-left:6px}
  .m-prog .m-part{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;color:var(--faint)}
  .m-dhead .pbar{margin:10px 0 12px}
  .m-dtools{display:flex;gap:8px}
  .m-dtools button{height:36px;padding:0 14px;border-radius:8px;background:var(--seg-bg);font-size:13px;color:var(--sub)}
  .row{height:40px}
  .ex-search input{height:40px;font-size:16px}
  .ex-title button{height:32px}

  /* 개념 제목 줄: 자기평가는 아래 줄, 손가락 크기 */
  .concept-head{gap:10px 8px;margin-bottom:12px}
  .concept-head h3{flex:1 1 100%}
  .conf{order:1;flex:1 1 auto;margin-left:0;padding:3px;border-radius:11px}
  .conf button{flex:1 1 0;height:40px;border-radius:8px;font-size:14px}
  .conf button::after{inset:-3px 0}
  .mbtn{order:2;opacity:1!important;height:46px;padding:0 16px;margin-left:0;border-radius:11px;background:var(--seg-bg);font-size:14px;color:var(--sub)}
  .mbtn::after{inset:0}
  .foldbtn{display:flex;width:100%;height:44px;font-size:14px;border-radius:10px;padding:0 14px}
  .foldbtn .more{display:none}

  /* 바텀 시트 (기존 패널 재사용) */
  .panel{position:fixed;left:0;right:0;bottom:var(--barh);z-index:18;height:60vh;border-radius:16px 16px 0 0;background:var(--panel);box-shadow:0 -10px 32px rgba(0,0,0,.28),0 0 0 1px var(--line2);transform:translateY(calc(100% + var(--barh) + 24px));visibility:hidden;transition:transform .32s var(--ease),height .28s var(--ease),visibility 0s linear .32s}
  .panel.open{transform:none;visibility:visible;transition:transform .32s var(--ease),height .28s var(--ease),visibility 0s}
  .panel.dragging{transition:none}
  body.kb .panel{bottom:var(--kb,0px)}
  .sh-grip{display:block;position:relative;flex:none;height:22px;touch-action:none;cursor:grab}
  .sh-grip::before{content:"";position:absolute;left:50%;top:9px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
  .p-head{height:44px;padding:0 6px 0 18px;touch-action:none;gap:8px}
  .sh-title{display:flex;align-items:baseline;gap:8px;font-size:15.5px;font-weight:600;color:var(--h);min-width:0;white-space:nowrap}
  .sh-title .cnt{font-size:12.5px;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
  .p-head .icon{height:40px;padding:0 14px;font-size:14px;color:var(--sub);border-radius:8px}
  .p-body{padding:0 0 20px}
  .pgroup>summary{min-height:44px;padding:6px 16px;font-size:14px}
  .pgroup>summary .path{display:none}
  .pgroup>summary .ttl{flex:1 1 auto;white-space:nowrap}
  .prob>summary{padding:8px 14px 8px 6px;font-size:15px}
  .memo{padding:4px 16px 0}
  #memoText{font-size:16px;min-height:120px;height:136px}
  .mm-foot .ibtn{height:40px;font-size:13px}

  /* 빈칸 옵션 시트 */
  .bl-pane{padding:4px 16px 8px}
  .bl-seg{display:flex;padding:3px;border-radius:12px;background:var(--seg-bg)}
  .bl-seg button{flex:1 1 0;height:44px;border-radius:9px;font-size:15px;color:var(--sub)}
  .bl-seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--h);font-weight:600;box-shadow:var(--lift)}
  .bl-row{display:flex;gap:4px;margin:8px -10px 0}
  .bl-row button{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;border-radius:9px;font-size:14.5px;font-weight:500;color:var(--fg);transition:background-color .15s,color .15s}
  .bl-row button:active{background:var(--hover)}
  .bl-row .st{font-size:13px;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
  .bl-row button[aria-pressed="true"]{color:var(--accent)}
  [data-theme="light"] .bl-row button[aria-pressed="true"]{color:#0f5c4f}
  .bl-row button[aria-pressed="true"] .st{color:inherit;font-weight:600}
  .bl-note{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--faint);text-wrap:pretty}
}
@media (max-width:820px) and (prefers-reduced-motion:reduce){
  .mpath,.panel,.panel.open{transition:none}
}
</style>
</head>
<body>
<div class="ide" id="ide">
  <aside class="explorer" id="side" aria-label="파일 탐색기">
    <div class="m-dhead">
      <div class="m-prog"><span>앎<b id="mProg">0/0</b></span><span class="m-part" id="mProgPart"></span></div>
      <div class="pbar"><i id="mPbar"></i></div>
      <div class="m-dtools"><button class="press" id="themeBtnM">라이트</button></div>
    </div>
    <div class="ex-title"><span>탐색기</span><button id="collapseAll" class="press">모두 접기</button></div>
    <div class="ex-search"><input id="search" type="search" placeholder="검색 (예: 하이드레이션)" aria-label="개념 검색" autocomplete="off"></div>
    <div id="results" class="results" hidden></div>
    <div id="treeWrap">
      <div class="ex-root">지식노트</div>
      <div class="tree" id="tree"></div>
      <div class="ex-sec">
        <div class="ex-title"><span>진도</span></div>
        <div class="prog-list" id="progList"></div>
      </div>
    </div>
  </aside>
  <div id="scrim"></div>
  <button class="mpath" id="mpath" aria-label="현재 위치 · 목차 열기"></button>

  <section class="editor">
    <div class="tabbar">
      <button class="tocbtn press" id="tocBtn" aria-expanded="false" aria-controls="side">목차</button>
      <div class="tabs" id="tabs" role="tablist"></div>
    </div>

<script type="application/json" id="data">[{"id": "howto", "num": "?", "title": "읽는 법", "md": "# 읽는 법\n\n<strong>이 노트는 뭐냐:<\/strong> 프론트엔드 개념을 한 곳에 모은 지식노트다. 개념마다 <strong>\"뭐야 → 왜 → 어떻게 → 핵심\"<\/strong> 순서로 읽히고, 더 깊이 파고드는 질문과 답은 접힌 칸에 따로 있다. 모든 개념에 확인한 공식 문서 링크(출처)가 붙어 있다.\n\n## 파트 구성\n\n| 파트 | 내용 | 읽는 포인트 |\n|---|---|---|\n| 1. 브라우저 | 파싱·렌더링 파이프라인·이벤트 루프·메인 스레드 | 성능·React 내용의 바닥. 여기서 막히면 나머지가 외운 말이 된다 |\n| 2. JavaScript | 스코프·클로저·this·Promise·메모리 | 실행 순서 맞히기와 stale closure가 단골 |\n| 3. React | 렌더·커밋·재조정·훅·memo·동시성 | \"memo가 왜 안 먹혔나\"까지 설명할 수 있으면 충분 |\n| 4. Next.js | SSR/SSG/ISR·하이드레이션·서버 컴포넌트·캐싱 | 버전마다 바뀌는 곳이라 '주의' 표시를 꼭 본다 |\n| 5. 데이터·상태 | 서버 상태·캐시·무효화·경쟁·멱등성·페이지네이션 | 실무에서 가장 자주 부딪히는 파트 |\n| 6. 네트워크·보안 | HTTP 캐시·CORS·쿠키·토큰 갱신·XSS/CSRF·실시간 통신 | 인증 흐름은 그림으로 설명할 수 있어야 한다 |\n| 7. 성능 | 측정·Core Web Vitals·번들·이미지·가상화 | 항상 \"어떻게 측정했나\"부터 |\n| 8. 설계·품질 | TypeScript·컴포넌트 설계·FSD·테스트·접근성 | 코드가 커질수록 비중이 커진다 |\n\n## 개념 하나의 형식\n\n- <strong>뭐야:<\/strong> 이 개념이 무엇인지 쉬운 말로. 처음 볼 때도, 복습할 때도 이 줄부터\n- <strong>왜:<\/strong> 왜 필요한지 = 이게 없거나 모르면 생기는 문제\n- <strong>어떻게:<\/strong> 원리. 비유와 짧은 코드\n- <strong>핵심:<\/strong> 외워 둘 것. <strong>첫 문장이 그 개념의 한 줄 요약<\/strong>이고 뒤 문장은 보충이다. 굵은 글씨가 핵심어\n- <strong>출처:<\/strong> 확인한 공식 문서 링크\n- <strong>꼬리질문:<\/strong> 한 단계 더 파고드는 질문과 짧은 답. 본문에는 접혀 있고, 개념 아래 \"더 파고들기 N문항\"을 누르면 아래쪽 심화 패널에 뜬다\n- <strong>한 줄 정리:<\/strong> 개념마다 있지 않고 섹션(1., 2. …)마다 맨 끝에 하나씩 있다. 시간 없으면 이것만 훑는다\n\n## 상태별 학습법\n\n무턱대고 외우지 않는다. 상태마다 목표가 다르다 — `모름`은 <strong>이해<\/strong>, `애매`는 <strong>꺼내기<\/strong>, `앎`은 <strong>유지<\/strong>.\n\n| 상태 | 목표 | 읽는 칸 | 하는 일 | 올리는 기준 |\n|---|---|---|---|---|\n| 모름 | 이해 | 뭐야 → 왜 → 어떻게 → 핵심 | 외우지 않고 한 번 읽은 뒤, 덮고 \"왜\"를 내 말로 한 문장 | 안 보고 \"뭐야 + 왜\"를 말한다 |\n| 애매 | 꺼내기 | 제목만 보고 시작, 틀린 칸만 다시 | 먼저 말해 보고 나서 대조, 꼬리질문 열기 | 꼬리질문에 안 보고 답한다 |\n| 앎 | 유지·연결 | 꼬리질문, 참고 링크 | 간격을 두고 꼬리질문만, 다른 개념과 잇기 | 틀리면 `애매`로 내린다 |\n\n<strong>모름일 때<\/strong>\n\n- <strong>\"왜\"가 제일 중요하다.<\/strong> 어떤 문제 때문에 생긴 개념인지 잡히면 \"어떻게\"는 그 문제의 해결 과정으로 읽힌다\n- 꼬리질문과 출처는 건너뛴다. 기본 그림이 없을 때 보면 헷갈리기만 한다\n- \"어떻게\"에서 막히면 출처를 하나만 본다. 대개 용어 하나에서 막힌 것이다\n\n<strong>애매일 때<\/strong>\n\n- <strong>다시 읽지 않는다.<\/strong> 읽으면 아는 것 같은데 말하려면 안 나오는 상태라, 읽기 전에 먼저 꺼내 봐야 빈 곳이 드러난다\n- \"어떻게\"는 항목을 외우지 말고 <strong>원인 → 결과<\/strong>로 잇는다. 예: CSS는 뒤 규칙이 덮을 수 있다 → 다 받아야 확정된다 → 그래서 그리기를 막는다\n- <strong>빈칸 모드<\/strong>로 핵심 줄을 가리고 맞혀 본다\n- 메모에는 틀린 지점만 적는다. 다음에 열면 거기부터 본다\n\n<strong>앎일 때<\/strong>\n\n- 다시 읽지 않는다. 3일 → 1주 → 3주로 간격을 벌려 가며 꼬리질문만 확인한다\n- 참고 링크를 따라가 다른 개념과 어떻게 이어지는지 설명해 본다. 한 단계 더 파고드는 질문은 대개 이 연결에서 나온다\n\n> 주의: 상태는 \"읽으니 이해된다\"가 아니라 <strong>\"안 보고 말할 수 있다\"<\/strong>로 매긴다. 읽을 때 익숙한 느낌은 아는 것과 다르다.\n\n## 용어는 어디까지 알아야 하나\n\n전부 알 필요는 없다. 용어가 <strong>어디에 나오느냐<\/strong>로 등급을 나눈다.\n\n| 등급 | 어디에 나오는 용어인가 | 어느 수준까지 |\n|---|---|---|\n| 필수 | \"핵심\" 줄의 굵은 글씨, 파트 끝 \"핵심 키워드 모음\" | 안 보고 뜻과 \"왜 중요한지\"를 말한다 |\n| 알아듣기 | \"어떻게\"와 꼬리질문에만 나오는 용어 | 들으면 뭔지 알고, 필요할 때 찾아본다 |\n| 넘겨도 됨 | '주의' 칸의 버전별 세부, 출처에만 있는 용어 | 그런 게 있다는 것만 안다 |\n\n헷갈리면 <strong>\"이 용어 없이 이 개념의 '왜'를 설명할 수 있나\"<\/strong>로 가른다. 설명이 안 되면 필수다.\n\n- <strong>TTFB<\/strong>는 필수. \"첫 화면이 왜 늦나\"는 서버 응답이 늦은 것과 받은 뒤 그리는 게 늦은 것으로 나뉘는데, 앞쪽의 이름이 TTFB다\n- <strong>렌더 차단·파서 차단<\/strong>도 필수. 이 두 말 없이는 \"HTML 파싱\" 개념의 결론을 말할 수 없다\n- <strong>프리로드 스캐너<\/strong>는 알아듣기. 몰라도 그 개념의 \"왜\"는 설명된다\n\n모르는 용어를 만났을 때:\n\n1. 한 줄 정리에서 만났으면 바로 위 개념들의 \"핵심\"에서 찾는다. 없으면 검색에 용어를 그대로 넣는다\n2. 정의를 외우지 않고 <strong>글자 뜻 → 무엇을 재거나 막는지 → 짝이 되는 말<\/strong> 세 가지로 잡는다. 예: TTFB = Time To First Byte = 요청 후 첫 바이트가 올 때까지. 렌더 차단은 파서 차단과 묶어 둔다\n3. 다른 파트에서 다루는 용어는 한 줄 뜻만 잡고 넘어간다. 그 파트에서 다시 나온다\n\n## 쓰는 법\n\n1. <strong>처음:<\/strong> 1 → 3 → 5 순서로 읽는다(브라우저 → React → 데이터). 막히면 2.\n2. <strong>개념마다 자기 평가:<\/strong> 제목 옆 `모름 · 애매 · 앎`을 누른다. 꼬리질문까지 답할 수 있어야 `앎`이다. 기록은 각자 브라우저에만 저장된다.\n3. <strong>복습:<\/strong> 위쪽 <strong>빈칸 모드<\/strong>를 켜면 핵심어가 가려진다. 칸을 누르면 보이고 다시 누르면 가려진다.\n   - <strong>핵심:<\/strong> 핵심 줄과 키워드 모음만 가림\n   - <strong>전부:<\/strong> 모든 굵은 글씨를 가림\n4. <strong>약점만 보기:<\/strong> `애매·모름만` 필터를 켜면 아직 못 넘은 개념만 남는다.\n5. <strong>빠른 복습:<\/strong> 각 파트 맨 아래 <strong>핵심 키워드 모음<\/strong>만 훑는다.\n\n> 주의: React·Next.js·Core Web Vitals는 버전마다 바뀐다. '주의' 표시가 붙은 내용은 기준 버전을 확인하고 공식 문서로 최신 여부를 본다.\n\n> 주의: AI와 함께 정리하고 공식 문서로 검수한 노트지만 틀린 곳이 있을 수 있다. 이상한 곳을 발견하면 알려 주세요.\n"}, {"id": "n01", "num": "1", "title": "브라우저는 어떻게 화면을 그리나", "md": "# 1. 브라우저는 어떻게 화면을 그리나\n\n<strong>이 파트는 뭐냐:<\/strong> \"URL을 쳤는데 왜 늦게 뜨나\", \"왜 버벅이나\", \"왜 클릭이 안 먹나\"를 설명하는 파트다. 브라우저는 <strong>메인 스레드 하나<\/strong>로 JS 실행과 렌더링 작업(스타일·레이아웃·페인트)을 번갈아 한다. 레이어를 합치는 합성만 별도 스레드에서 한다. 그래서 화면이 버벅이거나 반응이 늦는 문제는 대부분 그 한 스레드를 어떤 작업이 얼마나 오래 붙잡고 있느냐에서 나온다.\n\n## 1. 첫 화면이 뜨기까지\n\n### URL 입력부터 첫 픽셀까지 (Navigation to First Paint)\n\n- <strong>뭐야:<\/strong> 주소창에 URL을 친 순간부터 화면에 첫 픽셀이 그려질 때까지 브라우저가 거치는 단계 전체다. 서버를 찾아 연결하고 HTML을 받는 <strong>네트워크 단계<\/strong>와, 받은 문서를 해석해 그리는 문서 처리 단계로 나뉜다.\n- <strong>왜:<\/strong> 이 흐름을 모르면 \"첫 화면이 하얗게 오래 있다\"는 제보를 받아도 어디가 느린지 짚지 못한다. 네트워크가 느린지, 서버 응답이 느린지, 받은 문서를 그리는 쪽이 막혔는지를 단계별로 나눠 봐야 원인이 보인다.\n- <strong>어떻게:<\/strong>\n  - <strong>네트워크 단계<\/strong>는 DNS 조회(도메인 이름으로 서버 IP 주소 찾기) → TCP 연결 → TLS 핸드셰이크(HTTPS 암호화 연결 맺기) → HTTP 요청 → 첫 바이트 도착 순서로 진행된다. 응답의 첫 바이트가 도착하기까지 걸린 시간을 TTFB(Time To First Byte)라 한다. 캐시(HTTP 캐시·Service Worker)에 맞는 응답이 있으면 이 단계를 건너뛴다.\n  - <strong>문서 처리 단계<\/strong>에서는 HTML을 다 받을 때까지 기다리지 않고 받는 대로 파싱을 시작한다(스트리밍). 파싱하다 만난 하위 자원(CSS·JS·이미지·폰트)을 요청한다. 그 뒤 DOM·CSSOM → 렌더 트리 → Layout → Paint → Composite 순서로 화면을 만든다.\n  - DevTools Network의 Timing 탭에서 요청 하나에 걸린 시간을 Queueing·Stalled·DNS Lookup·Initial connection·Waiting (TTFB)·Content Download 등으로 나눠 볼 수 있다.\n  - SSR(서버가 HTML을 미리 만들어 보내는 방식)은 첫 페인트가 빠르다. 대신 hydration(받은 HTML에 JS가 이벤트 핸들러를 붙이는 과정)이 끝나기 전에는 클릭이 안 먹는 구간이 생긴다 ([4파트 참고](#n04/하이드레이션-hydration \"하이드레이션\")).\n- <strong>핵심:<\/strong> 빈 화면 시간은 주로 <strong>TTFB<\/strong> + <strong>렌더 차단 자원<\/strong>(CSS, 동기 스크립트) 대기에서 나온다. 측정 지표로 보면 FCP·LCP가 그림이 늦은 것, <strong>INP<\/strong>가 반응이 늦은 것.\n- <strong>꼬리질문:<\/strong>\n  - \"TTFB가 짧은데도 하얗게 오래 있으면?\" → 서버는 빨리 응답했다는 뜻이다. 그러니 응답을 받은 뒤의 단계를 본다. 화면 그리기를 막는 CSS, `<head>`의 동기 스크립트(`async`·`defer` 없이 넣은 스크립트), 웹폰트를 기다리느라 글자가 안 보이는 구간(FOIT)을 확인한다.\n  - \"preconnect는 이 중 어디를 줄이나?\" → 연결 단계만 줄인다. DNS·TCP·TLS 연결을 미리 맺어 둘 뿐이고, 자원 요청 자체를 앞당겨 보내지는 않는다.\n- <strong>출처:<\/strong> [MDN — How browsers work](https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/How_browsers_work#navigation) · [Chrome DevTools — Network reference](https://developer.chrome.com/docs/devtools/network/reference#timing-explanation)\n\n### HTML 파싱과 DOM·CSSOM (Parsing, DOM, CSSOM)\n\n- <strong>뭐야:<\/strong> 브라우저가 받은 HTML 글자를 노드 트리(DOM)로, CSS를 스타일 규칙 트리(CSSOM)로 바꾸는 과정이다. 둘이 있어야 무엇을 어떤 모양으로 그릴지 정해진다.\n- <strong>왜:<\/strong> 모르면 두 가지에서 막힌다. HTML은 다 받았는데 화면이 하얗게 멈춰 있는 이유를 모른다. `<head>`의 스크립트가 요소를 못 찾고 `null`을 받는 이유도 모른다. 알면 `<script>`를 어디에 둘지, 첫 화면에 CSS를 얼마나 실을지 근거를 갖고 정할 수 있다.\n- <strong>어떻게:<\/strong>\n  - HTML은 바이트 → 문자 → 토큰 → 노드 → <strong>DOM 트리<\/strong> 순서로 바뀐다. 전부 받은 뒤가 아니라 받는 대로 조금씩 파싱한다.\n  - CSS는 <strong>CSSOM<\/strong>으로 만든다. 뒤에 나온 규칙이 앞 규칙을 덮을 수 있어서(캐스케이드) 파일을 다 받아야 스타일이 확정된다. 그래서 브라우저는 CSS를 다 받을 때까지 화면을 그리지 않는다. 이것이 <strong>렌더 차단(render-blocking)<\/strong>이다.\n  - 동기 `<script>`는 `async`·`defer`·`type=\"module\"`을 붙이지 않은 기본 스크립트다(종류별 차이는 [다음 개념 참고](#n01/script의-defer-async-module-script-loading \"script의 defer·async·module\"))\n  - 동기 `<script>`는 DOM을 바꿀 수 있다. 그래서 파서는 이 태그를 만나면 파싱을 멈추고 그 자리에서 스크립트를 실행한다. 이것이 <strong>파서 차단(parser-blocking)<\/strong>이다. 이 시점에 아래쪽 HTML은 아직 DOM에 없다.\n  ```html\n  <head>\n    <script>\n      document.querySelector(\"#app\"); // null: 아래 줄을 아직 안 읽었다\n    <\/script>\n  <\/head>\n  <body>\n    <div id=\"app\"><\/div>\n  <\/body>\n  ```\n  - 스크립트는 스타일도 읽을 수 있다(`getComputedStyle` 등). 그래서 브라우저는 앞에 있는 CSS를 다 받아 처리할 때까지 스크립트 실행을 미룬다. CSS가 늦으면 스크립트가 밀리고, 스크립트가 밀리면 파싱도 멈춘다.\n  - 프리로드 스캐너(preload scanner)는 파서가 멈춘 동안에도 HTML을 앞서 훑는다. 마크업에 적힌 CSS·JS·이미지를 찾아 요청을 미리 보낸다. CSS 파일 안에 적힌 폰트·배경 이미지는 찾지 못한다.\n- <strong>핵심:<\/strong> <strong>CSS는 렌더 차단<\/strong>, <strong>동기 JS는 파서 차단<\/strong>으로 막는 대상이 다르다. CSS 다운로드가 늦으면 그 뒤 동기 JS 실행까지 밀린다.\n- <strong>꼬리질문:<\/strong>\n  - \"CSS가 렌더를 막는 게 손해 아닌가?\" → 막지 않는 쪽이 더 손해다. 스타일 없이 먼저 그리면 스타일 없는 화면이 잠깐 보였다 바뀌는 깜빡임(FOUC)이 난다. 그리고 전부 다시 그려야 한다. 막는 시간을 줄이려면 첫 화면에 필요한 CSS만 남기고(Critical CSS) 나머지는 나중에 불러온다.\n  - \"`media=\"print\"` 링크도 렌더를 막나?\" → 막지 않는다. `media` 조건이 지금 화면에 맞지 않는 CSS는 낮은 우선순위로 내려받기만 하고 렌더를 막지 않는다.\n- <strong>출처:<\/strong> [MDN — How browsers work: Parsing](https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/How_browsers_work#parsing) · [web.dev — Render-blocking CSS](https://web.dev/articles/critical-rendering-path/render-blocking-css)\n\n### script의 defer·async·module (Script Loading)\n\n- <strong>뭐야:<\/strong> `<script>` 태그를 언제 내려받고 언제 실행할지 정하는 속성들이다. 아무 속성도 없으면 브라우저는 태그를 만나는 즉시 HTML 파싱을 멈추고 스크립트를 실행한다. `defer`·`async`·`type=\"module\"`은 이 시점을 바꾼다.\n- <strong>왜:<\/strong> 시점을 잘못 고르면 분석 스크립트 하나 때문에 첫 화면이 늦게 뜬다. 반대로 무작정 `async`로 바꾸면 실행 순서가 뒤바뀔 수 있다. 그러면 다른 스크립트가 만든 값을 쓰는 스크립트가 먼저 실행돼 `is not defined` 같은 에러가 난다.\n- <strong>어떻게:<\/strong>\n  - <strong>기본<\/strong> — 속성이 없는 경우다. 태그를 만나면 파싱을 멈춘다. 스크립트를 내려받아 실행한 뒤에 파싱을 다시 시작한다.\n  - <strong>`defer`<\/strong> — 파싱을 멈추지 않고 동시에 내려받는다. 실행은 파싱이 끝난 뒤에 <strong>문서 순서대로<\/strong> 한다. 실행 시점은 `DOMContentLoaded` 이벤트 직전이다.\n  - <strong>`async`<\/strong> — 내려받기는 파싱과 동시에 한다. 다 <strong>받자마자 실행<\/strong>하고, 그 순간에는 파싱이 멈춘다. 스크립트끼리의 실행 순서는 보장되지 않는다.\n  - <strong>`type=\"module\"`<\/strong> — 속성을 더 붙이지 않아도 `defer`처럼 동작한다. 그래서 `defer` 속성을 붙여도 달라지는 게 없다. `async`를 붙이면 받는 대로 실행한다. 같은 모듈은 한 번만 실행되고, strict mode가 기본이다.\n  - 인라인 클래식 스크립트(`src` 없이 태그 안에 코드를 직접 쓴, 모듈이 아닌 스크립트)에는 `defer`·`async`가 효과가 없다. 모듈 스크립트는 인라인이어도 `async`가 적용된다.\n- <strong>핵심:<\/strong> 스크립트 로딩의 기본 선택은 <strong>`defer`<\/strong>다. 다른 코드와 무관한 독립 스크립트(분석·광고)만 <strong>`async`<\/strong>. 모듈은 이미 지연 실행이다.\n- <strong>꼬리질문:<\/strong>\n  - \"인라인 스크립트를 일부러 `<head>`에 넣을 때는?\" → 다른 청크(번들러가 나눠 놓은 JS 파일)보다 <strong>먼저<\/strong> 실행돼야 하는 코드일 때다. 첫 페인트 전에 클래스를 지정해 다크 모드 깜빡임을 막는 코드가 한 예다. 청크 로딩 실패를 복구하는 코드도 그렇다.\n  - \"`DOMContentLoaded`와 `load`의 차이는?\" → `DOMContentLoaded`는 HTML 파싱과 defer 스크립트 실행까지 끝난 시점에 발생한다. `load`는 이미지·스타일 등 하위 자원까지 다 받은 시점에 발생한다.\n- <strong>출처:<\/strong> [MDN — script 요소](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script) · [HTML Standard — async·defer 속성](https://html.spec.whatwg.org/multipage/scripting.html#attr-script-async)\n\n> 한 줄 정리: 첫 화면을 늦추는 건 서버 응답(TTFB)과 렌더 차단 CSS·파서 차단 JS이고, 스크립트는 기본이 `defer`다.\n\n## 2. 렌더링 파이프라인\n\n### 렌더 트리·레이아웃·페인트·합성 (Rendering Pipeline)\n\n- <strong>뭐야:<\/strong> 스타일 계산(Style) → 위치·크기 계산(Layout) → 그리기 명령 생성(Paint) → 레이어 합치기(Composite)로 이어지는, 브라우저가 화면 한 장을 만드는 공정이다. 공장 라인처럼 앞 단계가 다시 돌면 뒤 단계도 다시 거친다.\n- <strong>왜:<\/strong> 모르면 애니메이션이 끊길 때 원인을 못 찾는다. `left`와 `transform`은 화면에서 똑같이 움직여 보여도 비용이 다른데, 어느 쪽이 왜 무거운지 가려내지 못한다.\n- <strong>어떻게:<\/strong>\n  - <strong>Style<\/strong> — DOM과 CSSOM을 합쳐 요소마다 최종 스타일을 계산한다. `display: none`인 요소는 렌더 트리(화면에 그릴 요소만 모은 트리)에서 빠진다. `visibility: hidden`인 요소는 보이지 않을 뿐 자리를 차지한 채 남는다.\n  - <strong>Layout<\/strong> — 박스마다 위치와 크기를 계산한다. 한 요소가 커지면 형제·부모의 위치와 크기까지 바뀔 수 있다.\n  - <strong>Paint<\/strong> — 레이어마다 그리기 명령 목록을 만든다. 명령을 실제 픽셀로 바꾸는 래스터화는 이 뒤에 한다.\n  - <strong>Composite<\/strong> — 레이어를 합쳐 화면에 올린다. 이 단계는 <strong>컴포지터 스레드<\/strong>에서 돈다.\n  - 비용은 <strong>Layout > Paint > Composite<\/strong> 순으로 크다.\n- <strong>핵심:<\/strong> 바꾼 속성에 따라 재시작 지점이 다르다. 크기·위치(`width`, `left`, `top`) → <strong>Layout부터<\/strong>, 색(`color`, `background`) → <strong>Paint부터<\/strong>, <strong>`transform`·`opacity`<\/strong> → <strong>Composite만<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"`display: none`과 `visibility: hidden`을 토글하면 각각 어디부터?\" → `display: none`은 박스 자체가 생기고 사라지므로 Layout부터 다시 한다. `visibility: hidden`은 자리가 그대로라 Paint부터 다시 한다.\n- <strong>출처:<\/strong> [web.dev — Rendering performance](https://web.dev/articles/rendering-performance) · [MDN — How browsers work: Render](https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/How_browsers_work#render)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 340\" role=\"img\" aria-label=\"HTML과 CSS가 DOM과 CSSOM을 거쳐 Style, Layout, Paint, Composite로 이어지고, 바꾼 속성에 따라 재시작 지점이 달라지는 렌더링 파이프라인\">\n  <defs>\n    <marker id=\"a1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--fig-line)\"/><\/marker>\n  <\/defs>\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"340\" fill=\"var(--fig-bg)\"/>\n  <rect x=\"20\" y=\"30\" width=\"90\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <text x=\"65\" y=\"55\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">HTML<\/text>\n  <rect x=\"20\" y=\"110\" width=\"90\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <text x=\"65\" y=\"135\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">CSS<\/text>\n  <rect x=\"140\" y=\"30\" width=\"90\" height=\"40\" rx=\"6\" fill=\"var(--fig-muted)\" stroke=\"var(--fig-line)\"/>\n  <text x=\"185\" y=\"55\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">DOM<\/text>\n  <rect x=\"140\" y=\"110\" width=\"90\" height=\"40\" rx=\"6\" fill=\"var(--fig-muted)\" stroke=\"var(--fig-line)\"/>\n  <text x=\"185\" y=\"135\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">CSSOM<\/text>\n  <line x1=\"110\" y1=\"50\" x2=\"138\" y2=\"50\" stroke=\"var(--fig-line)\" marker-end=\"url(#a1)\"/>\n  <line x1=\"110\" y1=\"130\" x2=\"138\" y2=\"130\" stroke=\"var(--fig-line)\" marker-end=\"url(#a1)\"/>\n  <line x1=\"230\" y1=\"50\" x2=\"268\" y2=\"85\" stroke=\"var(--fig-line)\" marker-end=\"url(#a1)\"/>\n  <line x1=\"230\" y1=\"130\" x2=\"268\" y2=\"95\" stroke=\"var(--fig-line)\" marker-end=\"url(#a1)\"/>\n  <rect x=\"270\" y=\"70\" width=\"90\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"315\" y=\"95\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Style<\/text>\n  <rect x=\"385\" y=\"70\" width=\"90\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"430\" y=\"95\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Layout<\/text>\n  <rect x=\"500\" y=\"70\" width=\"90\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"545\" y=\"95\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Paint<\/text>\n  <rect x=\"615\" y=\"70\" width=\"95\" height=\"40\" rx=\"6\" fill=\"var(--fig-accent2)\" stroke=\"var(--fig-line)\"/>\n  <text x=\"662\" y=\"95\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Composite<\/text>\n  <line x1=\"360\" y1=\"90\" x2=\"383\" y2=\"90\" stroke=\"var(--fig-line)\" marker-end=\"url(#a1)\"/>\n  <line x1=\"475\" y1=\"90\" x2=\"498\" y2=\"90\" stroke=\"var(--fig-line)\" marker-end=\"url(#a1)\"/>\n  <line x1=\"590\" y1=\"90\" x2=\"613\" y2=\"90\" stroke=\"var(--fig-line)\" marker-end=\"url(#a1)\"/>\n  <text x=\"270\" y=\"140\" font-size=\"13\" fill=\"currentColor\">메인 스레드<\/text>\n  <text x=\"615\" y=\"140\" font-size=\"13\" fill=\"currentColor\">컴포지터 스레드<\/text>\n  <line x1=\"430\" y1=\"250\" x2=\"430\" y2=\"114\" stroke=\"var(--fig-accent)\" marker-end=\"url(#a1)\"/>\n  <text x=\"430\" y=\"272\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">width · left · top<\/text>\n  <text x=\"430\" y=\"292\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">Layout부터 전부 (리플로우)<\/text>\n  <line x1=\"545\" y1=\"200\" x2=\"545\" y2=\"114\" stroke=\"var(--fig-accent)\" marker-end=\"url(#a1)\"/>\n  <text x=\"545\" y=\"220\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">color · background<\/text>\n  <text x=\"545\" y=\"240\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">Paint부터 (리페인트)<\/text>\n  <line x1=\"662\" y1=\"250\" x2=\"662\" y2=\"114\" stroke=\"var(--fig-accent2)\" marker-end=\"url(#a1)\"/>\n  <text x=\"662\" y=\"272\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">transform · opacity<\/text>\n  <text x=\"662\" y=\"292\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">Composite만<\/text>\n<\/svg>\n<figcaption>바꾼 속성이 파이프라인 어디로 들어오느냐가 비용을 정한다<\/figcaption>\n<\/figure>\n\n### 리플로우·리페인트와 강제 동기 레이아웃 (Reflow, Repaint, Forced Synchronous Layout)\n\n- <strong>뭐야:<\/strong> 리플로우는 레이아웃(위치·크기)을 다시 계산하는 것이다. 리페인트는 화면을 다시 그리는 것이다. 강제 동기 레이아웃은 스타일을 바꾼 직후에 크기를 읽는 바람에, 브라우저가 나중에 몰아서 하려던 레이아웃 계산을 그 자리에서 하게 만드는 상황이다.\n- <strong>왜:<\/strong> 모르면 평범해 보이는 루프가 왜 느린지 찾지 못한다. 항목마다 높이를 재고 스타일을 바꾸는 루프에서 프레임이 끊긴다. Performance 탭에는 \"Forced reflow\" 경고가 줄줄이 뜬다.\n- <strong>어떻게:<\/strong>\n  - 브라우저는 스타일이 바뀌어도 레이아웃을 바로 다시 계산하지 않는다. '다시 계산해야 함'이라는 표시(더티 표시)만 해 두고 <strong>나중에 한 번에<\/strong> 계산한다.\n  - 그런데 스타일을 바꾼 바로 뒤에 레이아웃에 따라 달라지는 값을 읽으면 사정이 달라진다. `offsetHeight`, `getBoundingClientRect()`, `scrollTop`, `getComputedStyle()`의 width 같은 값이 그렇다. 브라우저는 정확한 값을 주려고 <strong>그 자리에서<\/strong> 레이아웃을 끝낸다. 이것이 강제 동기 레이아웃이다.\n  - 루프 안에서 쓰기와 읽기가 번갈아 나오면 반복할 때마다 레이아웃을 다시 계산한다. 이것을 <strong>레이아웃 스래싱(layout thrashing)<\/strong> 이라 한다.\n  - 해법은 순서를 바꾸는 것이다. <strong>읽기를 먼저 몰고 쓰기를 뒤로 몬다.<\/strong> 크기 측정은 매번 하지 말고 레이아웃이 바뀔 때만 한다(ResizeObserver 등).\n  - 레이아웃을 다시 계산하는 범위를 줄이는 방법도 있다. `position: absolute`로 요소를 일반 흐름에서 빼거나 `contain: layout`을 쓴다. 화면 밖 목록에는 `content-visibility: auto`와 `contain-intrinsic-size`를 함께 쓴다.\n  ```js\n  // 나쁨: N번 레이아웃\n  items.forEach(el => { el.style.width = \"100px\"; hs.push(el.offsetHeight); });\n  // 좋음: 읽기 전부 → 쓰기 전부, 레이아웃 1번\n  const hs = items.map(el => el.offsetHeight);\n  items.forEach((el, i) => { el.style.height = hs[i] + \"px\"; });\n  ```\n- <strong>핵심:<\/strong> 읽기가 비싼 게 아니라 <strong>밀린 쓰기 뒤의 읽기<\/strong>가 비싸다. <strong>읽기→쓰기 순서<\/strong>로 묶는다.\n- <strong>꼬리질문:<\/strong>\n  - \"React면 신경 안 써도 되나?\" → 신경 써야 한다. DOM 갱신은 React가 모아서 처리해 준다. 하지만 `useLayoutEffect`나 ref로 크기를 직접 재는 코드(툴팁 위치, 자동 높이)는 React를 써도 그대로 강제 레이아웃을 일으킨다.\n  - \"ResizeObserver면 항상 안전한가?\" → 아니다. 요소가 숨겨진 탭 안에 있으면 마운트 직후 폭이 0으로 들어온다. 이 0을 실제 폭으로 믿고 그대로 확정하면 안 된다.\n- <strong>출처:<\/strong> [web.dev — Layout thrashing](https://web.dev/articles/avoid-large-complex-layouts-and-layout-thrashing)\n\n### transform·opacity와 합성 레이어 (Compositing Layers, will-change)\n\n- <strong>뭐야:<\/strong> 브라우저는 화면을 여러 레이어로 나눠 그린 뒤 합쳐서 올린다. `transform`·`opacity`는 이미 그려진 레이어를 옮기고 섞기만 하는 속성이다. 그래서 CSS 애니메이션·트랜지션으로 이 둘을 바꾸면 메인 스레드가 아닌 컴포지터 스레드가 처리할 수 있다. `will-change`는 곧 움직일 요소를 미리 별도 레이어로 빼 두라고 브라우저에 알리는 힌트다.\n- <strong>왜:<\/strong> 모르고 다른 속성으로 애니메이션을 만들면, JS가 바쁜 순간(파싱, 리렌더 폭주)에 바텀시트 애니메이션까지 같이 멈춘다.\n- <strong>어떻게:<\/strong>\n  - 컴포지터는 이미 그려진 레이어를 <strong>옮기고(transform) 섞기만(opacity)<\/strong> 한다. 그래서 Layout·Paint를 건너뛴다.\n  - 컴포지터 스레드는 메인 스레드와 별개다. 그래서 JS가 메인 스레드를 막고 있어도 `transform`·`opacity` 애니메이션은 계속 돈다. 단, CSS 애니메이션이나 Web Animations API로 만들었을 때만 그렇다. `requestAnimationFrame`(rAF)으로 JS가 프레임마다 값을 직접 쓰면 메인 스레드에 묶인다.\n  - `will-change: transform`은 \"곧 움직일 테니 미리 레이어로 빼 둬\"라는 힌트다. 레이어 하나마다 GPU 메모리를 쓴다.\n- <strong>핵심:<\/strong> 애니메이션은 <strong>`transform`·`opacity`만<\/strong> 쓴다. 이유는 \"빨라서\"보다 <strong>다른 스레드에 맡겨져서<\/strong>다. `will-change`는 <strong>남발 금지<\/strong>, 움직이기 직전에 붙이고 끝나면 뗀다.\n- <strong>꼬리질문:<\/strong>\n  - \"레이어를 많이 만들면 왜 느려지나?\" → 레이어마다 메모리와 GPU 업로드 비용이 든다. 의도하지 않은 요소까지 레이어로 올라가는 일(layer explosion)이 겹치면 합성 자체가 무거워진다. 이 문제는 모바일에서 먼저 드러난다.\n  - \"`transform`으로 옮기면 주변 요소 자리는?\" → 레이아웃에서 차지하는 자리는 원래 위치 그대로다. 눈에 보이는 위치만 움직인다. 다른 요소를 밀어내야 하면 <strong>FLIP<\/strong>(First-Last-Invert-Play) 기법을 쓴다. 레이아웃은 한 번만 계산하고, 움직임은 transform 애니메이션으로 보여 주는 방법이다.\n- <strong>출처:<\/strong> [web.dev — Compositor-only properties](https://web.dev/articles/stick-to-compositor-only-properties-and-manage-layer-count) · [MDN — will-change](https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/will-change)\n\n> 한 줄 정리: 무엇을 바꾸느냐가 비용을 정하고, 쓰기 뒤 읽기가 강제 레이아웃을 부르며, 애니메이션은 컴포지터에 맡긴다.\n\n## 3. 이벤트 루프와 메인 스레드\n\n### 이벤트 루프 (Event Loop: Task, Microtask, Rendering)\n\n- <strong>뭐야:<\/strong> 메인 스레드 하나가 할 일을 순서대로 꺼내 처리하는 반복 규칙이다. 한 바퀴는 세 단계다. 태스크 하나를 실행한다. 마이크로태스크(Promise 콜백 등)를 전부 비운다. 렌더링 기회가 왔으면 화면을 그린다. 이 바퀴를 계속 돈다.\n- <strong>왜:<\/strong> 이 순서를 모르면 \"왜 setTimeout 0보다 then이 먼저 찍히나\" 같은 실행 순서를 설명하지 못한다. `Promise.then` 체인이 끝없이 이어질 때 화면이 멈추는 이유도 설명하지 못한다.\n- <strong>어떻게:<\/strong>\n  - 루프 한 바퀴의 순서는 다음과 같다. <strong>태스크 하나<\/strong> 실행(콜 스택이 빌 때까지) → <strong>마이크로태스크 큐를 전부 비움<\/strong> → 렌더링 기회가 왔으면 rAF 콜백 → Style → Layout → Paint.\n  - 마이크로태스크 큐는 태스크가 끝났을 때만 비우는 게 아니다. 이벤트 리스너 같은 콜백이 끝나 콜 스택이 빌 때마다 비운다.\n  - <strong>태스크(macrotask)<\/strong>는 `setTimeout`·`setInterval` 콜백, 사용자 입력 이벤트, `MessageChannel` 메시지, XHR `load` 같은 네트워크 이벤트 등이다. `fetch`의 `then`은 태스크가 아니라 마이크로태스크다. 태스크 큐는 종류별로 여러 개라서, 줄 하나에 온 순서대로 서는 구조(단일 FIFO)가 아니다. 어느 큐에서 꺼낼지는 브라우저가 고른다.\n  - <strong>마이크로태스크<\/strong>는 `Promise.then/catch/finally` 콜백, `await` 뒤에 이어지는 코드, `queueMicrotask` 콜백, `MutationObserver` 콜백이다.\n  - 렌더링 기회는 태스크가 끝날 때마다 오지 않는다. <strong>디스플레이 주기(보통 60Hz면 약 16.7ms)<\/strong>에 맞춰 온다.\n  - 마이크로태스크를 처리하는 중에 새 마이크로태스크를 넣으면 그것까지 다 비워야 다음 단계로 넘어간다. 그래서 마이크로태스크가 끝없이 이어지면 렌더링 차례가 오지 않아 화면이 멈춘다.\n- <strong>핵심:<\/strong> 순서는 <strong>동기 코드 → 마이크로태스크 전부 → 렌더(rAF 포함) → 다음 태스크<\/strong>. 마이크로태스크는 <strong>끼어들 틈 없이 전부<\/strong> 비운다.\n- <strong>꼬리질문:<\/strong>\n  - \"`setTimeout(fn, 0)`은 정말 0ms 뒤인가?\" → 아니다. 0은 최소 지연일 뿐이고, 앞선 작업이 끝나야 실행된다. 타이머 안에서 타이머를 다시 거는 중첩이 <strong>5단계<\/strong>에 이르면 지연이 최소 4ms로 올라간다. 주의: 숨긴 탭에서는 더 늦어진다. Firefox 데스크톱은 최소 1초로 늦춘다. Chrome은 타이머를 1초 단위로 묶어 실행한다. Chrome 88부터는 5분 넘게 숨긴 탭의 연쇄 타이머를 1분 단위로 묶는다(intensive throttling).\n  - \"작업을 쪼갤 때 `queueMicrotask`로 쪼개면?\" → 안 된다. 마이크로태스크는 렌더 전에 전부 비우므로 렌더가 끼어들 틈이 생기지 않는다. 나머지 작업은 태스크(`setTimeout`, `MessageChannel`, `scheduler.yield`)로 넘긴다. 주의: `scheduler.yield`는 Chrome·Edge 129+, Firefox 142+에서 지원하고 Safari는 지원하지 않는다(web.dev 기준). 그래서 `setTimeout` 폴백을 둔다.\n  - \"타이머로 경과 시간을 세면 왜 틀어지나?\" → 타이머 콜백은 제때 불리지 않는다. 앞 작업에 밀리고, 백그라운드에서는 늦춰지고, 기기가 잠들면 멈춘다. 그래서 경과 시간은 콜백 횟수가 아니라 <strong>기준 시각과의 차이<\/strong>로 계산한다.\n- <strong>출처:<\/strong> [MDN — Using microtasks](https://developer.mozilla.org/en-US/docs/Web/API/HTML_DOM_API/Microtask_guide) · [MDN — setTimeout: 비활성 탭의 지연](https://developer.mozilla.org/en-US/docs/Web/API/Window/setTimeout#timeouts_in_inactive_tabs)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"이벤트 루프 한 바퀴: 태스크 하나를 실행하고, 마이크로태스크 큐를 전부 비우고, 렌더링 기회가 오면 rAF와 스타일, 레이아웃, 페인트를 수행한 뒤 다음 태스크로 돌아간다\">\n  <defs>\n    <marker id=\"a2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--fig-line)\"/><\/marker>\n  <\/defs>\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <rect x=\"20\" y=\"40\" width=\"180\" height=\"120\" rx=\"8\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <text x=\"110\" y=\"64\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">태스크 큐 (여러 개)<\/text>\n  <text x=\"110\" y=\"92\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">setTimeout · 클릭<\/text>\n  <text x=\"110\" y=\"114\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">MessageChannel<\/text>\n  <text x=\"110\" y=\"136\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">네트워크 이벤트<\/text>\n  <rect x=\"20\" y=\"200\" width=\"180\" height=\"120\" rx=\"8\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <text x=\"110\" y=\"224\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">마이크로태스크 큐<\/text>\n  <text x=\"110\" y=\"252\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">Promise.then · await<\/text>\n  <text x=\"110\" y=\"274\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">queueMicrotask<\/text>\n  <text x=\"110\" y=\"296\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">MutationObserver<\/text>\n  <rect x=\"270\" y=\"40\" width=\"180\" height=\"60\" rx=\"8\" fill=\"var(--fig-muted)\" stroke=\"var(--fig-line)\"/>\n  <text x=\"360\" y=\"66\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">① 태스크 하나 실행<\/text>\n  <text x=\"360\" y=\"86\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">콜 스택이 빌 때까지<\/text>\n  <rect x=\"270\" y=\"150\" width=\"180\" height=\"60\" rx=\"8\" fill=\"var(--fig-muted)\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"360\" y=\"176\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">② 마이크로태스크<\/text>\n  <text x=\"360\" y=\"196\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">빌 때까지 전부<\/text>\n  <rect x=\"270\" y=\"260\" width=\"180\" height=\"60\" rx=\"8\" fill=\"var(--fig-muted)\" stroke=\"var(--fig-accent2)\" stroke-width=\"2\"/>\n  <text x=\"360\" y=\"286\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">③ 렌더링 기회?<\/text>\n  <text x=\"360\" y=\"306\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">약 16.7ms마다 (60Hz)<\/text>\n  <line x1=\"200\" y1=\"80\" x2=\"268\" y2=\"70\" stroke=\"var(--fig-line)\" marker-end=\"url(#a2)\"/>\n  <text x=\"234\" y=\"62\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">1개<\/text>\n  <line x1=\"200\" y1=\"250\" x2=\"268\" y2=\"190\" stroke=\"var(--fig-line)\" marker-end=\"url(#a2)\"/>\n  <text x=\"222\" y=\"208\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">전부<\/text>\n  <line x1=\"360\" y1=\"100\" x2=\"360\" y2=\"148\" stroke=\"var(--fig-line)\" marker-end=\"url(#a2)\"/>\n  <line x1=\"360\" y1=\"210\" x2=\"360\" y2=\"258\" stroke=\"var(--fig-line)\" marker-end=\"url(#a2)\"/>\n  <rect x=\"500\" y=\"230\" width=\"200\" height=\"120\" rx=\"8\" fill=\"none\" stroke=\"var(--fig-accent2)\"/>\n  <text x=\"600\" y=\"256\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">rAF 콜백<\/text>\n  <text x=\"600\" y=\"280\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Style → Layout<\/text>\n  <text x=\"600\" y=\"304\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Paint → Composite<\/text>\n  <text x=\"600\" y=\"330\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">기회 없으면 건너뜀<\/text>\n  <line x1=\"450\" y1=\"290\" x2=\"498\" y2=\"290\" stroke=\"var(--fig-line)\" marker-end=\"url(#a2)\"/>\n  <path d=\"M600,230 C600,120 560,70 452,70\" fill=\"none\" stroke=\"var(--fig-line)\" stroke-dasharray=\"5 4\" marker-end=\"url(#a2)\"/>\n  <text x=\"610\" y=\"130\" font-size=\"13\" fill=\"currentColor\">다음 바퀴<\/text>\n<\/svg>\n<figcaption>태스크는 한 번에 하나, 마이크로태스크는 한 번에 전부, 렌더는 주기마다 한 번<\/figcaption>\n<\/figure>\n\n### requestAnimationFrame (rAF)\n\n- <strong>뭐야:<\/strong> 다음 화면을 그리기 직전에 콜백을 실행해 달라고 브라우저에 맡기는 API다. 한 번 등록하면 한 번만 불린다. 매 프레임 실행하려면 콜백 안에서 다시 등록한다. 호출 주기는 대개 화면 주사율(화면이 1초에 갱신되는 횟수)을 따른다.\n- <strong>왜:<\/strong> 모르고 화면 갱신을 타이머로 하면 움직임이 덜덜 떨린다. 드래그·스크롤에 맞춰 움직이는 UI를 `setInterval(16)`으로 갱신하면 어떤 프레임에서는 두 번 계산하고 어떤 프레임에서는 건너뛴다.\n- <strong>어떻게:<\/strong>\n  - rAF 콜백은 <strong>다음 렌더 직전<\/strong>(Style·Layout 전)에 호출된다. 그래서 실행 시점이 프레임과 맞는다.\n  - 호출 주기는 주사율을 따라간다(60Hz면 약 16.7ms, 120Hz면 약 8.3ms). 그래서 \"16ms마다 불린다\"고 가정한 코드는 120Hz 화면에서 2배 빨라진다. 경과 시간은 콜백 인자 `timestamp`로 계산한다.\n  - 대부분의 브라우저에서 백그라운드 탭이나 숨긴 iframe에서는 rAF가 멈춘다. 그래서 화면과 상관없이 계속 돌아야 하는 일(타이머 적립, 살아 있음을 주기적으로 알리는 하트비트)은 rAF에 걸면 안 된다.\n- <strong>핵심:<\/strong> rAF는 결과가 <strong>화면 갱신<\/strong>일 때 쓰고, <strong>서버 요청·로깅<\/strong>이면 디바운스/스로틀을 쓴다. rAF는 <strong>백그라운드에서 멈춘다<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"rAF 안에서 측정해도 되나?\" → 된다. 다만 순서를 지킨다. 프레임 시작에서 먼저 읽고 그 뒤에 쓰면 강제 레이아웃이 생기지 않는다. 쓰고 나서 읽으면 rAF 안이라도 똑같이 강제 레이아웃이 생긴다.\n  - \"React에서 rAF를 쓰면 정리는?\" → effect cleanup에서 `cancelAnimationFrame`을 호출한다. 호출하지 않으면 컴포넌트가 언마운트된 뒤에도 콜백이 실행된다.\n- <strong>출처:<\/strong> [MDN — requestAnimationFrame](https://developer.mozilla.org/en-US/docs/Web/API/Window/requestAnimationFrame)\n\n### 메인 스레드 블로킹과 Long Task\n\n- <strong>뭐야:<\/strong> JS 실행·스타일·레이아웃·페인트·입력 처리는 전부 메인 스레드 하나에서 돈다. 이 스레드를 50ms 넘게 붙잡는 작업을 <strong>Long Task<\/strong>라 한다. 계산대가 하나뿐인 가게에서 한 손님이 계산대를 오래 붙잡고 있는 상황과 같다.\n- <strong>왜:<\/strong> 화면은 멀쩡히 떠 있는데 \"버튼을 눌렀는데 반응이 없다\"는 제보가 들어온다. Long Task를 모르면 이 제보의 원인을 찾지 못한다.\n- <strong>어떻게:<\/strong>\n  - JS 실행·스타일·레이아웃·페인트·입력 처리가 전부 <strong>메인 스레드 하나<\/strong>에서 돈다.\n  - <strong>50ms 넘게<\/strong> 스레드를 잡는 작업이 Long Task다. 그 사이에 들어온 입력은 그 태스크가 끝날 때까지 기다린다. Long Task에서 50ms를 넘는 부분을 차단 시간(blocking time)이라 하고, TBT(Total Blocking Time)는 이 시간을 센다.\n  - 60fps면 프레임 하나에 쓸 수 있는 시간은 약 16.7ms다. 하지만 브라우저가 자체 작업에 쓰는 몫이 있다. 그래서 web.dev는 내 코드가 쓸 수 있는 시간을 <strong>약 10ms<\/strong>로 잡는다.\n  - 대응 방향은 네 가지다. <strong>쪼갠다<\/strong>(작업을 여러 태스크로 나눠 중간에 양보) · <strong>모은다<\/strong>(디바운스·스로틀·rAF) · <strong>미룬다<\/strong>(코드 스플리팅·지연 로딩) · <strong>내보낸다<\/strong>(Web Worker). 다만 그 전에 <strong>불필요한 작업을 없애는 게 먼저<\/strong>다.\n  - 지표는 두 가지를 본다. <strong>INP<\/strong>는 실제 사용자가 상호작용한 순간부터 다음 페인트까지 걸린 시간이고, 실사용 환경(현장)에서 잰다. <strong>TBT<\/strong>는 로딩 구간에 있는 Long Task들의 50ms 초과분을 합한 값이고, 테스트 환경(실험실)에서 잰다.\n- <strong>핵심:<\/strong> 버벅임의 대부분은 <strong>메인 스레드 점유<\/strong>에서 온다. Performance 탭에서 <strong>50ms 넘는 태스크<\/strong>부터 찾는다.\n- <strong>꼬리질문:<\/strong>\n  - \"작업을 쪼개면 총 시간은 늘지 않나?\" → 는다. 쪼개기는 전체 처리 속도를 조금 내주고 <strong>반응성<\/strong>을 얻는 선택이다. 작업 사이에 입력과 렌더가 끼어들 틈이 생긴다.\n  - \"React 동시성 렌더링이면 해결되나?\" → 일부만 해결된다. 동시성 렌더링은 렌더 작업을 쪼개 중간에 입력에 양보한다. 하지만 컴포넌트 하나의 렌더 함수가 실행되는 도중에는 끊지 못한다 ([3파트 참고](#n03/동시성-렌더링-usetransition-usedeferredvalue-concurrent-rendering \"동시성 렌더링: useTransition·useDeferredValue\")).\n- <strong>출처:<\/strong> [web.dev — Optimize long tasks](https://web.dev/articles/optimize-long-tasks) · [web.dev — INP](https://web.dev/articles/inp) · [web.dev — Rendering performance](https://web.dev/articles/rendering-performance)\n\n### Web Worker\n\n- <strong>뭐야:<\/strong> 메인 스레드와 별도의 스레드에서 JS를 돌리는 환경이다. `document`·`window`가 없어서 화면은 만질 수 없다. 메인 스레드와는 `postMessage`로 메시지를 주고받는다.\n- <strong>왜:<\/strong> 카메라 프레임 분석, 대용량 JSON 파싱·정렬처럼 DOM과 무관한 계산을 메인 스레드에서 돌리면 그동안 클릭·입력이 밀린다. 워커를 모르면 이런 계산을 메인 스레드 밖으로 뺄 방법이 없다.\n- <strong>어떻게:<\/strong>\n  - 워커는 별도 스레드에서 도는 JS 환경이다. `document`·`window`·`localStorage`가 없다. 그래서 <strong>계산은 워커, 그리기는 메인<\/strong>으로 역할을 나눈다.\n  - 메인 스레드와는 `postMessage`로 통신한다. 보낸 데이터는 기본적으로 <strong>구조화 복제(structured clone)<\/strong> 방식으로 복사돼 넘어간다. 그래서 큰 데이터는 복사 비용이 든다.\n  - `ArrayBuffer`·`ImageBitmap`·`OffscreenCanvas`는 <strong>Transferable<\/strong>(소유권을 넘길 수 있는 객체)이다. 복사하지 않고 소유권만 넘긴다. 넘긴 쪽은 그 객체를 더 쓸 수 없다.\n  - IndexedDB와 `fetch`는 워커에서도 쓸 수 있다.\n- <strong>핵심:<\/strong> 워커는 빠르게 하는 도구가 아니라 <strong>메인 스레드를 비우는 도구<\/strong>다. 총 CPU 시간은 줄지 않고 <strong>왕복 지연<\/strong>은 오히려 는다.\n- <strong>꼬리질문:<\/strong>\n  - \"그럼 무거운 건 다 워커로?\" → 아니다. DOM을 만지거나 레이아웃을 재는 일은 워커로 못 보낸다. 매 프레임 그려야 하는 작업은 메시지 왕복 지연과 초기화 비용(WASM 로딩 등)이 이득을 깎아 먹는다. 판단 기준은 \"이 작업이 도는 동안 사용자가 뭔가 하려 하느냐\"다.\n- <strong>출처:<\/strong> [MDN — Using Web Workers](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Using_web_workers) · [MDN — Transferable objects](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Transferable_objects)\n\n### 디바운스·스로틀 (Debounce, Throttle)\n\n- <strong>뭐야:<\/strong> 연달아 오는 이벤트의 실행 횟수를 줄이는 기법이다. 디바운스는 이벤트가 잠잠해진 뒤에 한 번만 실행한다. 스로틀은 정해진 간격마다 한 번만 실행한다.\n- <strong>왜:<\/strong> 줄이지 않으면 검색창에 글자를 칠 때마다 API 요청이 나간다. 불필요한 요청이 서버에 쌓인다. `scroll` 핸들러가 초당 수십 번 실행돼 화면이 끊기기도 한다.\n- <strong>어떻게:<\/strong>\n  - <strong>디바운스<\/strong> — 이벤트가 올 때마다 타이머를 처음부터 다시 센다. 이벤트가 멈춰 조용해진 뒤에 한 번 실행한다. 검색, 자동 저장, 리사이즈가 끝난 뒤의 처리에 쓴다.\n  - <strong>스로틀<\/strong> — 한 번 실행하면 정해진 간격 동안 들어온 이벤트를 무시한다. 진행 중간의 값이 필요할 때 쓴다. 스크롤 위치 추적, 실시간 좌표 전송이 예다.\n  - <strong>rAF<\/strong> — 시간 간격이 아니라 화면 프레임에 맞춰 실행한다. 결과가 화면 갱신일 때 쓴다.\n  - 실행 시점 옵션이 두 가지 있다. leading은 첫 이벤트에 바로 실행하고, trailing은 마지막 이벤트 뒤에 실행한다. 중복 클릭 방지에는 leading을, 검색에는 trailing을 쓴다.\n  - React에서는 두 가지를 구분한다. <strong>값 디바운스<\/strong>는 상태를 늦게 바꿔 리렌더 횟수 자체를 줄인다. <strong>함수 디바운스<\/strong>는 함수 실행만 늦춘다.\n- <strong>핵심:<\/strong> 디바운스는 <strong>마지막 것만<\/strong>, 스로틀은 <strong>주기적으로<\/strong>, rAF는 <strong>화면 갱신에 맞춰<\/strong> 실행한다. 셋 다 작업 수를 줄이고, 다른 건 <strong>무엇을 버리느냐<\/strong>다.\n- <strong>꼬리질문:<\/strong>\n  - \"디바운스로 응답 순서 꼬임도 막히나?\" → 아니다. 디바운스는 요청 수만 줄인다. 먼저 보낸 요청의 응답이 나중에 도착해 화면을 덮는 문제(경쟁 상태)는 그대로 남는다. 이 문제는 요청 취소(AbortController, 2파트)나 쿼리 키 캐시로 막는다.\n- <strong>출처:<\/strong> [MDN Glossary — Debounce](https://developer.mozilla.org/en-US/docs/Glossary/Debounce)\n\n> 한 줄 정리: 태스크 하나 → 마이크로태스크 전부 → 렌더, 이 순서를 알면 실행 순서·버벅임·rAF 위치가 다 설명된다.\n\n## 4. 이벤트와 저장소\n\n### 이벤트 전파와 위임 (Capture, Bubble, Event Delegation)\n\n- <strong>뭐야:<\/strong> 대부분의 이벤트는 두 방향으로 차례로 전파된다. 먼저 바깥(window)에서 대상 요소까지 내려간다(캡처). 그다음 대상에서 다시 바깥으로 올라간다(버블). 이벤트 위임은 이 버블을 이용하는 패턴이다. 부모 하나에 리스너를 두고, 이벤트가 실제로 일어난 자식을 찾아 처리한다.\n- <strong>왜:<\/strong> 전파를 모르면 행 1,000개에 리스너를 하나씩 붙이게 된다. 드롭다운을 눌렀는데 모달이 닫히는 버그도 설명하지 못한다. 포털(React에서 컴포넌트를 DOM의 다른 위치에 그리는 기능)로 그린 드롭다운의 클릭을 바깥 클릭 감지가 \"바깥\"으로 판정한 경우다.\n- <strong>어떻게:<\/strong>\n  - 전파는 3단계다. <strong>캡처<\/strong>(window → 대상) → <strong>타깃<\/strong> → <strong>버블<\/strong>(대상 → window) 순서로 진행된다. `addEventListener(type, fn, { capture: true })`로 등록하면 캡처 단계에서 이벤트를 받는다.\n  - <strong>이벤트 위임<\/strong> — 부모 하나에 리스너를 두고 `event.target.closest(\"[data-id]\")`로 실제 대상을 찾는다. 나중에 추가된 자식도 리스너를 따로 달지 않고 처리된다.\n  - `target`은 실제로 클릭된 요소이고, `currentTarget`은 리스너를 단 요소다.\n  - `focus`·`blur`·`mouseenter`는 버블되지 않는다. 이 이벤트를 위임하려면 버블되는 `focusin`·`focusout`, `mouseover`를 대신 쓴다.\n  - 주의: React는 17부터 이벤트 리스너를 `document`가 아니라 <strong>루트 컨테이너<\/strong>에 위임한다. React 포털 안에서 난 이벤트는 DOM 위치와 무관하게 <strong>React 트리 기준으로 버블<\/strong>된다.\n- <strong>핵심:<\/strong> 이벤트 위임은 <strong>버블링<\/strong>에 기대는 패턴이다. <strong>`target` vs `currentTarget`<\/strong>, 버블 안 되는 이벤트를 구분한다. 포털은 DOM과 React 트리의 버블 경로가 다르다.\n- <strong>꼬리질문:<\/strong>\n  - \"`stopPropagation`을 남발하면?\" → 상위에서 이벤트를 기다리던 쪽이 받지 못한다. 위임 리스너, 분석 도구, 바깥 클릭 감지가 모두 해당한다. 전파를 막지 말고, 받는 쪽에서 `contains`로 걸러 판정한다.\n  - \"바깥 클릭을 어떻게 판정하나?\" → `pointerdown`을 캡처 단계에서 받아 `ref.contains(e.target)`로 판정한다. 포털로 그린 요소는 DOM상 바깥에 있으므로 별도 허용 목록이 필요하다.\n  - \"passive 리스너는 왜 쓰나?\" → `preventDefault`를 부르지 않겠다고 브라우저에 약속하는 옵션이다. 그러면 브라우저가 JS 핸들러 실행을 기다리지 않고 스크롤을 바로 시작한다. 주의: `window`·`document`·`documentElement`·`body`의 `touchstart`·`touchmove`·`wheel` 리스너는 기본값이 passive다(MDN 기준).\n- <strong>출처:<\/strong> [MDN — Event bubbling](https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/Event_bubbling) · [MDN — addEventListener: passive](https://developer.mozilla.org/en-US/docs/Web/API/EventTarget/addEventListener#passive) · [react.dev — createPortal (Caveats)](https://react.dev/reference/react-dom/createPortal)\n\n### 브라우저 저장소 (Cookie, localStorage, sessionStorage, IndexedDB)\n\n- <strong>뭐야:<\/strong> 브라우저 안에 데이터를 남겨 두는 장소들이다. 쿠키는 매 요청에 실려 서버로 간다. localStorage는 출처(스킴·호스트·포트 조합) 단위로 영구 보관된다. sessionStorage는 탭 단위로 보관된다. IndexedDB는 비동기로 쓰고 큰 데이터를 담는다. 넷은 범위·수명·JS 접근 여부가 다르다.\n- <strong>왜:<\/strong> 차이를 모르고 고르면 보안과 상태 정리에서 사고가 난다. 토큰을 `localStorage`에 뒀다가 XSS(공격자가 페이지에 스크립트를 심는 공격)에 취약하다는 지적을 받는다. 로그아웃하고 다른 계정으로 들어갔는데 이전 계정의 상태가 화면에 남기도 한다.\n- <strong>어떻게:<\/strong>\n\n  | | 범위·수명 | 특징 |\n  | --- | --- | --- |\n  | <strong>Cookie<\/strong> | 도메인·경로, 만료일까지 | <strong>매 요청에 자동 전송<\/strong>. `HttpOnly`(JS 접근 차단), `Secure`, `SameSite`. 약 4KB |\n  | <strong>localStorage<\/strong> | 출처(origin), 영구 | <strong>동기 API<\/strong>, 문자열만. 주의: MDN 기준 출처당 5MiB, 넘으면 `QuotaExceededError` |\n  | <strong>sessionStorage<\/strong> | 출처 + <strong>탭<\/strong>, 탭 닫으면 삭제 | 새 탭은 새 세션. opener가 있는 창은 opener 값의 <strong>사본<\/strong>으로 시작해 이후 따로 논다 |\n  | <strong>IndexedDB<\/strong> | 출처, 영구 | <strong>비동기<\/strong>, 구조화 데이터·Blob, 워커에서 접근 가능, 대용량 |\n\n  - `localStorage`는 동기 API다. 그래서 큰 값을 자주 쓰면 그동안 메인 스레드가 막힌다.\n  - `storage` 이벤트로 <strong>다른 탭<\/strong>에서 바꾼 내용을 받을 수 있다. 값을 바꾼 그 문서에는 이벤트가 오지 않는다.\n  - 주의: `SameSite`를 지정하지 않은 쿠키를 Chrome은 `Lax`로 취급한다(Chrome 80부터). 쿠키 속성은 6파트에서 자세히 다룬다.\n- <strong>핵심:<\/strong> 저장소는 <strong>JS로 읽히느냐<\/strong>로 고른다. Web Storage는 JS로 읽혀 XSS로 털리고, 인증 토큰은 <strong>`HttpOnly` 쿠키<\/strong>가 XSS에 강하다(대신 CSRF를 `SameSite`·토큰으로 막는다). 로그아웃 때는 저장소·쿠키·쿼리 캐시를 <strong>함께<\/strong> 비운다.\n- <strong>꼬리질문:<\/strong>\n  - \"하이브리드 앱 웹뷰에서 주의할 점은?\" → 웹뷰(앱 안에 넣은 브라우저 화면)가 쿠키 저장소를 앱과 공유하는지는 플랫폼마다 다르다. 그래서 로그아웃하거나 계정을 바꾼 뒤에 이전 상태가 남는지 실기기에서 확인한다.\n- <strong>출처:<\/strong> [MDN — Web Storage API](https://developer.mozilla.org/en-US/docs/Web/API/Web_Storage_API) · [MDN — Storage quotas: Web Storage](https://developer.mozilla.org/en-US/docs/Web/API/Storage_API/Storage_quotas_and_eviction_criteria#web_storage)\n\n### 페이지 이탈 시 데이터 보내기 (visibilitychange, pagehide, sendBeacon)\n\n- <strong>뭐야:<\/strong> 사용자가 탭을 닫거나 앱을 내리는 순간에 데이터를 서버로 보내는 방법이다. 떠나는 순간은 `visibilitychange`·`pagehide` 이벤트로 감지한다. 전송은 페이지가 사라져도 끝까지 시도되는 `sendBeacon`·`keepalive`로 한다.\n- <strong>왜:<\/strong> 모르고 `unload`·`beforeunload` 이벤트에 기대면 마지막 기록(학습 시간, 로그)이 서버에 남지 않는다. 모바일에서는 앱을 내리거나 탭을 닫을 때 이 이벤트가 불리지 않을 수 있기 때문이다.\n- <strong>어떻게:<\/strong>\n  - 모바일에서는 `unload`·`beforeunload`를 믿을 수 없다. 페이지가 백그라운드로 갔다가 그대로 종료되면 불리지 않는다. 그래서 <strong>`visibilitychange`(hidden)<\/strong>를 확실하게 받을 수 있는 마지막 신호로 본다.\n  - `pagehide`는 페이지가 bfcache에 들어갈 때도 불린다. bfcache는 뒤로·앞으로 이동할 때 쓰는 캐시다. `unload` 리스너가 있으면 그 페이지는 bfcache 대상에서 빠질 수 있다.\n  - <strong>`navigator.sendBeacon`<\/strong> 또는 `fetch(..., { keepalive: true })`는 페이지가 사라져도 전송을 끝까지 시도한다. `sendBeacon`은 보내기만 하고 응답을 받지 못한다(단방향). `keepalive` fetch는 페이지가 살아 있을 때만 응답을 읽을 수 있다.\n- <strong>핵심:<\/strong> 이탈 직전 데이터는 <strong>`visibilitychange` hidden<\/strong>에서 <strong>`sendBeacon`/`keepalive`<\/strong>로 보낸다. 이탈 비콘은 <strong>되돌릴 수 없는 동작(종료·무효화)<\/strong>을 하면 안 된다.\n- <strong>꼬리질문:<\/strong>\n  - \"비콘 요청에 인증 헤더를 못 붙이면?\" → `sendBeacon`은 POST만 보내고 커스텀 헤더를 붙일 수 없다. 방법은 세 가지다. 쿠키로 인증하거나, 본문에 식별자를 넣거나, 헤더를 붙일 수 있는 `fetch keepalive`를 쓴다. 주의: 둘 다 본문 크기가 <strong>64KiB<\/strong> 안팎으로 제한된다(MDN 기준).\n  - \"탭을 잠깐 내렸다 돌아오면?\" → hidden이 될 때마다 '종료'를 보내면, 사용자가 돌아왔을 때 세션이 이미 끝나 있다. hidden에서는 동기화(sync)만 보낸다. 종료는 사용자가 명시적으로 끝낼 때만 보낸다.\n- <strong>출처:<\/strong> [Chrome — Page Lifecycle API](https://developer.chrome.com/docs/web-platform/page-lifecycle-api#advice-hidden) · [MDN — Navigator.sendBeacon()](https://developer.mozilla.org/en-US/docs/Web/API/Navigator/sendBeacon) · [MDN — RequestInit: keepalive](https://developer.mozilla.org/en-US/docs/Web/API/RequestInit)\n\n### CSS 환경 변수와 safe-area (env(), max())\n\n- <strong>뭐야:<\/strong> `env()`는 브라우저가 알려 주는 환경 값을 CSS에서 읽는 함수다. safe-area 값은 그중 하나로, 노치·홈 인디케이터(화면 아래의 홈 막대)를 피하는 데 필요한 여백이다. `max()`를 쓰면 이 값에 하한을 붙일 수 있다.\n- <strong>왜:<\/strong> 여백을 주지 않으면 노치·홈바가 있는 기기에서 하단 버튼이 홈 인디케이터에 가린다. 데스크톱에서는 이 문제가 재현되지 않아 놓치기 쉽다.\n- <strong>어떻게:<\/strong>\n  - `viewport-fit=cover`를 켜면 콘텐츠가 노치 영역까지 깔린다. 이때 피해야 할 여백 크기를 `env(safe-area-inset-bottom)` 등으로 받는다.\n  - 사각형 화면(데스크톱)에서는 `env()` 값이 0이라 여백이 없다. 그래서 `max(env(...), 16px)`처럼 <strong>하한<\/strong>을 준다. `env(name, 대체값)`의 두 번째 인자는 변수가 <strong>없을 때<\/strong>만 쓰인다. 값이 0일 때는 쓰이지 않으므로 하한 역할을 못 한다.\n  - 값을 CSS 변수(`--safe-bottom`)로 한 번 감싸 둔다. 그러면 데스크톱에서 변수 값만 바꿔 노치가 있는 상황을 흉내 낼 수 있다.\n- <strong>핵심:<\/strong> safe-area 여백은 <strong>`env()` + `max()` 하한<\/strong>으로 잡고, <strong>CSS 변수로 감싸 검증 가능하게<\/strong> 둔다.\n- <strong>꼬리질문:<\/strong>\n  - \"`100vh`는 모바일에서 왜 어긋나나?\" → 모바일에서는 주소창이 접히고 펴지면서 보이는 높이가 바뀐다. 그런데 `vh`는 대부분 주소창이 접힌 큰 뷰포트(`lvh`) 기준이다. 그래서 두 단위 중에서 고른다. `svh`는 값이 바뀌지 않아 안정적이다. `dvh`는 주소창을 따라 값이 바뀌고, 스크롤 중에 리사이즈 비용이 든다(주의: 구형 브라우저는 `vh` 폴백).\n- <strong>출처:<\/strong> [MDN — env()](https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Values/env) · [MDN — length: 뷰포트 단위](https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Values/length)\n\n> 한 줄 정리: 위임은 버블에 기대고, 저장소는 \"JS가 읽나·매 요청에 실리나·탭마다 다르나\"로 고르며, 이탈 신호는 visibilitychange로 받는다.\n\n## 5. 출처 경계와 플랫폼 확장\n\n### 동일 출처 정책 (Same-Origin Policy, SOP)\n\n- <strong>뭐야:<\/strong> 브라우저의 기본 보안 규칙이다. 한 출처의 문서·스크립트가 다른 출처의 자원에서 데이터를 읽지 못하게 막는다. 출처는 스킴·호스트·포트의 조합이다. 다른 출처 자원을 페이지에 삽입하는 것은 대체로 허용한다. 막는 것은 그 내용을 읽는 것이다.\n- <strong>왜:<\/strong> 규칙을 모르면 `<img>`·`<script>`로는 다른 도메인 자원이 뜨는데 `fetch`로 읽으면 막히는 이유를 설명하지 못한다. 다른 출처 iframe의 DOM을 만지다 `SecurityError`가 났을 때도 원인을 찾지 못한다.\n- <strong>어떻게:<\/strong>\n  - 출처는 세 가지로 정해진다. <strong>출처(origin) = 스킴 + 호스트 + 포트<\/strong>. 스킴은 `http`·`https` 같은 주소 맨 앞 부분이다. 셋 중 하나만 달라도 다른 출처다(`http`↔`https`, `:80`↔`:81`, `a.`↔`b.`). 경로는 달라도 같은 출처다.\n  - 교차 출처(다른 출처 사이) 동작은 세 종류로 나뉜다. <strong>쓰기<\/strong>(링크·리다이렉트·폼 제출)와 <strong>삽입<\/strong>(`script`·`img`·`stylesheet`·`iframe`)은 대체로 허용한다. <strong>읽기<\/strong>(응답 본문·삽입 문서의 DOM)는 차단한다.\n  - 다른 출처 창끼리는 `postMessage`로 메시지를 주고받는다. Web Storage·IndexedDB도 <strong>출처별 격리<\/strong> 대상이다. 쿠키는 출처가 아니라 도메인·경로 규칙을 따로 따른다.\n  - 서버가 이 읽기 제한을 풀어 주는 방법이 <strong>CORS<\/strong>다 ([6파트 참고](#n06/cors와-preflight \"CORS와 preflight\")). 예전에는 `document.domain`으로 하위 도메인끼리 제한을 풀기도 했다. 이 방식은 폐기되는 중이다.\n- <strong>핵심:<\/strong> SOP는 다른 출처에 대해 <strong>삽입·쓰기는 허용, 읽기는 차단<\/strong>한다. 출처는 <strong>스킴·호스트·포트 3개 일치<\/strong>로 판정한다. 그래서 CSRF(쓰기)는 SOP만으로 못 막는다.\n- <strong>꼬리질문:<\/strong>\n  - \"SOP가 있는데 왜 CSRF가 되나?\" → SOP는 읽기만 막기 때문이다. 폼 제출 같은 교차 출처 <strong>쓰기<\/strong>는 원래 허용이라 요청 자체는 나간다. 공격자는 응답을 읽지 못할 뿐이다. 그래서 SameSite 쿠키 설정이나 CSRF 토큰이 따로 필요하다([6파트 참고](#n06/csrf와-samesite-cross-site-request-forgery \"CSRF와 SameSite\")).\n- <strong>출처:<\/strong> [MDN — Same-origin policy](https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Same-origin_policy)\n\n### 서비스 워커 기초 (Service Worker)\n\n- <strong>뭐야:<\/strong> 페이지와 네트워크 사이에서 요청을 중간에 받아 처리하는(프록시) 워커다. 자기 범위 안에서 나가는 요청을 가로챈다. 그리고 캐시에서 꺼내 줄지, 네트워크로 보낼지, 대체 응답을 줄지 고른다.\n- <strong>왜:<\/strong> 없으면 오프라인에서 앱 셸(앱의 기본 뼈대 화면)을 띄우거나(PWA) 푸시 알림을 받을 수 없다. 쓰더라도 생명주기와 캐시 전략을 모르면, 새로 배포했는데 일부 사용자만 옛 화면을 계속 보는 문제가 생긴다.\n- <strong>어떻게:<\/strong>\n  - 서비스 워커는 페이지와 네트워크 사이의 <strong>프록시 워커<\/strong>다. 범위(scope) 안에서 나가는 요청을 `fetch` 이벤트로 가로챈다. 범위의 기본값은 워커 스크립트가 있는 위치다. 가로챈 요청에는 캐시·네트워크·대체 응답 중 하나를 골라 응답한다.\n  - 생명주기는 `register` → `install`(캐시 채우기) → `activate`(옛 캐시 정리) 순서다. <strong>새 버전은 옛 버전이 제어하는 탭이 다 닫힐 때까지 waiting<\/strong> 상태로 기다린다. 이 대기를 건너뛰려면 `skipWaiting()`을 부른다. 이미 열려 있는 페이지를 새 워커가 바로 제어하게 하려면 `clients.claim()`을 부른다.\n  - DOM과 동기 API(`localStorage`)는 쓸 수 없다. <strong>HTTPS 필수<\/strong>다(localhost 예외). 워커 하나가 <strong>여러 탭을 제어<\/strong>한다.\n- <strong>핵심:<\/strong> 서비스 워커는 <strong>요청 가로채기 + 캐시<\/strong>다. 업데이트는 <strong>waiting 단계<\/strong> 때문에 즉시 반영되지 않는다. 캐시 전략(cache-first·network-first)이 곧 <strong>신선도 정책<\/strong>이다.\n- <strong>꼬리질문:<\/strong>\n  - \"새 배포가 왜 바로 안 보이나?\" → 원인은 둘 중 하나다. 새 워커가 waiting 상태에 머물러 있거나, cache-first(캐시에 있으면 캐시를 먼저 쓰는 전략)가 옛 HTML을 내주고 있다. HTML은 network-first(네트워크를 먼저 시도하는
