<strong>핵심:<\/strong> CSRF는 <strong>자동으로 실리는 쿠키<\/strong>를 악용한다. <strong>토큰·Fetch Metadata 검사<\/strong>가 주, <strong>SameSite는 보조<\/strong>. XSS가 있으면 무력하다.\n- <strong>꼬리질문:<\/strong>\n  - \"CORS가 CSRF를 막아 주지 않나요?\" → 안 막는다. 단순 POST는 서버에서 처리되고, 오히려 credentials 허용 CORS를 느슨하게 열면 CSRF 통로가 된다.\n  - \"XSS와 CSRF 차이는?\" → XSS는 우리 사이트 안에서 공격자 코드가 돌고, CSRF는 남의 사이트가 우리 서버로 요청을 위조한다.\n- <strong>출처:<\/strong> [OWASP — CSRF Prevention](https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html) · [OWASP — Session Management](https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html)\n\n> 한 줄 정리: SOP는 읽기 차단, CORS는 예외 허가, SameSite는 쿠키 동반, XSS·CSRF 방어는 따로 — 서로를 대신하지 않는다.\n\n## 3. 인증: 세션, 토큰, 갱신\n\n### 세션 vs JWT (Session vs Token)\n\n- <strong>뭐야:<\/strong> 로그인 상태를 유지하는 두 방식이다. 세션은 서버가 상태를 들고 클라이언트는 세션 ID만 가지며, JWT는 서명된 정보를 클라이언트가 들고 서버는 저장소 조회 없이 서명과 클레임(만료 등)을 검증한다.\n- <strong>왜:<\/strong> 장단점을 모르면 \"JWT는 stateless라 좋다\"고 했다가 \"강제 로그아웃은요?\"에서 막힌다. JWT는 발급 후 회수가 어렵다.\n- <strong>어떻게:<\/strong>\n  - <strong>세션<\/strong>: 서버가 상태를 들고 클라이언트는 세션 ID 쿠키만. 즉시 무효화 쉬움, 서버가 여럿이면 공유 저장소(Redis 등)\n  - <strong>JWT<\/strong>: 서명된 클레임을 저장소 조회 없이 검증. 수평 확장이 쉽지만 <strong>발급 후 회수가 어렵다<\/strong>\n  - JWT 페이로드는 base64url 인코딩일 뿐 <strong>암호화가 아니다<\/strong>(서명은 위변조 검증일 뿐 내용을 숨기지 않는다). 기밀이 필요하면 JWE나 서버 쪽 불투명 토큰\n  - 절충: <strong>짧은 액세스 + 서버가 관리하는 리프레시<\/strong>. 회수는 리프레시 쪽에서\n- <strong>핵심:<\/strong> 세션은 <strong>회수가 쉽고 저장소가 필요<\/strong>, JWT는 <strong>검증이 싸고 회수가 어렵다<\/strong>. JWT는 <strong>서명이지 암호화가 아니다<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"JWT를 즉시 무효화하려면?\" → `jti` 거부 목록이나 토큰 버전을 서버에 두면 되지만 조회가 생겨 stateless 장점이 준다. 그래서 액세스 수명을 짧게 둔다.\n- <strong>출처:<\/strong> [OWASP — JWT Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_Cheat_Sheet.html) · [OWASP — Session Management](https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html)\n\n### 액세스 토큰과 리프레시 토큰 (Access / Refresh Token)\n\n- <strong>뭐야:<\/strong> 토큰을 둘로 나눈 구조다. 액세스 토큰은 매 요청에 쓰는 짧은 수명의 출입증이고, 리프레시 토큰은 그 출입증을 새로 받는 데만 쓰는 긴 수명의 토큰이다.\n- <strong>왜:<\/strong> 토큰 하나로는 수명을 길게 잡으면 유출 피해가 길고, 짧으면 자꾸 튕긴다. 갱신 실패를 구분하지 않고 바로 로그아웃시키면 지하철 사용자가 로그인 화면을 본다.\n- <strong>어떻게:<\/strong>\n  - 액세스: 짧게(분 단위), 매 요청. 리프레시: 길게, <strong>갱신에만<\/strong>\n  - 저장: 리프레시는 HttpOnly·Secure 쿠키(또는 서버 세션 안). 액세스는 메모리, `localStorage`는 XSS에 노출. IETF 브라우저 앱 권고는 토큰을 브라우저에 안 두는 <strong>BFF<\/strong>를 가장 안전하게 본다\n  - <strong>리프레시 토큰 회전(rotation)<\/strong>: 갱신마다 새 리프레시를 주고 옛것을 폐기. 재사용되면 탈취로 보고 계열 전체 무효화. RFC 9700은 공개 클라이언트에 회전 또는 송신자 제약(DPoP 등)을 MUST로 둔다\n  - 갱신 실패 <strong>분류<\/strong>: 순단·5xx(일시적) → 토큰 보존 후 재시도 / 리프레시 만료·폐기(영구) → 로그아웃\n  - 만료 감지는 둘: 선제 갱신(만료 시각)과 401 사후 복구\n- <strong>핵심:<\/strong> 액세스는 <strong>짧게·메모리<\/strong>, 리프레시는 <strong>길게·HttpOnly<\/strong>. 갱신 실패는 <strong>일시적이면 보존, 영구적이면 로그아웃<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"일시적 실패에도 로그아웃시키면 뭐가 문제죠?\" → 잠깐 끊긴 사이 쫓겨나고 진행 중 작업(측정, 입력)이 날아간다.\n  - \"판정이 여러 층에 있으면?\" → 아래층은 보존하는데 위층이 오류 플래그만 보고 로그아웃한다. 판정은 함수 하나로 모은다.\n- <strong>출처:<\/strong> [RFC 9700](https://datatracker.ietf.org/doc/html/rfc9700) · [IETF — OAuth 브라우저 앱 초안(RFC 10017)](https://datatracker.ietf.org/doc/html/draft-ietf-oauth-browser-based-apps)\n\n### OAuth 2.0 Authorization Code + PKCE\n\n- <strong>뭐야:<\/strong> 인가 서버(소셜 로그인 제공자 등)에서 인가 코드를 받아 액세스 토큰으로 바꾸는 흐름이다. OAuth 자체는 권한 위임 규약이고, 로그인(신원 확인)은 보통 그 위에 OpenID Connect를 얹는다. <strong>PKCE<\/strong>는 코드를 요청한 클라이언트만 그 코드를 교환할 수 있게 비밀값 짝을 붙이는 장치다.\n- <strong>왜:<\/strong> SPA·앱은 client secret을 숨길 수 없다. PKCE가 없으면 redirect로 돌아온 인가 코드를 다른 앱이 가로채 토큰으로 바꿀 수 있다.\n- <strong>어떻게:<\/strong>\n  - 흐름: 인가 서버로 이동 → 로그인·동의 → <strong>인가 코드<\/strong>를 들고 redirect URI로 복귀 → 코드를 <strong>토큰으로 교환<\/strong>\n  - <strong>PKCE<\/strong>: 무작위 `code_verifier`의 해시(`code_challenge`, S256)만 먼저 보내고, 교환 때 원본을 낸다. 코드를 훔쳐도 verifier 없이는 못 바꾼다\n  - RFC 9700: 공개 클라이언트는 PKCE <strong>필수<\/strong>, 기밀 클라이언트도 권장. 토큰을 URL로 받는 Implicit은 SHOULD NOT\n  - `state`(또는 PKCE)로 로그인 CSRF를 막는다. 인가 서버는 redirect URI를 미리 등록된 값과 <strong>정확한 문자열 일치<\/strong>로 비교해야 한다(RFC 9700 §2.1 MUST, 네이티브 앱 `localhost` redirect의 포트 번호만 예외)\n- <strong>핵심:<\/strong> 브라우저·앱은 <strong>Authorization Code + PKCE<\/strong>. PKCE는 <strong>코드를 요청한 클라이언트만 교환<\/strong>하게 한다.\n- <strong>꼬리질문:<\/strong>\n  - \"PKCE면 client secret이 필요 없나요?\" → 대신하지 않는다. 비밀을 지킬 수 있는 서버(BFF)면 둘 다 쓴다.\n  - \"토큰은 어디 두나요?\" → BFF가 토큰을 갖고 브라우저엔 HttpOnly 세션 쿠키만 주는 구조가 가장 안전하다.\n- <strong>출처:<\/strong> [oauth.net — PKCE](https://oauth.net/2/pkce/) · [RFC 9700 §2.1](https://datatracker.ietf.org/doc/html/rfc9700)\n\n### 토큰 갱신 single-flight\n\n- <strong>뭐야:<\/strong> 동시에 여러 곳에서 토큰 갱신이 필요해도 실제 갱신 요청은 하나만 보내고, 나머지는 그 결과를 함께 기다리게 하는 방식이다.\n- <strong>왜:<\/strong> 없으면 API 5개가 동시에 401을 받아 리프레시가 5번 나간다. 회전을 쓰면 첫 번째만 성공하고 나머지는 이미 폐기된 토큰을 내밀어 실패하며, 서버가 재사용을 탈취로 보면 계열 전체가 무효화돼 로그아웃된다. 플래그+큐 방식은 선제 갱신과 401 복구가 엇갈리면 큐가 영영 안 빌 수 있다.\n- <strong>어떻게:<\/strong>\n  - 진행 중인 갱신을 <strong>Promise 하나로 공유<\/strong>한다. 뒤에 온 호출은 <strong>같은 Promise를 await<\/strong>\n  - 성공·실패 모두 `finally`에서 비운다. 실패도 모두에게 전파돼 \"영원히 대기\"가 없다\n  - 선제 갱신과 401 복구가 <strong>같은 함수<\/strong>를 쓴다. 경로가 둘이면 single-flight도 둘이 된다\n  - 401 재시도는 <strong>1회만<\/strong>. 갱신 요청 자체의 401은 갱신 경로를 안 타게 한다\n\n```ts\nlet inflight: Promise<string> | null = null;\n\nexport function refreshOnce() {\n  inflight ??= requestRefresh().finally(() => {\n    inflight = null;\n  });\n  return inflight;\n}\n```\n\n- <strong>핵심:<\/strong> 동시 401은 <strong>갱신 하나에 합류<\/strong>시킨다. 플래그·큐가 아니라 <strong>공유 Promise<\/strong>, 실패도 <strong>같이 실패<\/strong>한다. 재시도는 <strong>1회<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"플래그+큐 방식은 왜 버렸나요?\" → 큐를 비우는 책임이 한 경로에만 있어 다른 경로가 플래그를 세우고 끝나면 영원히 대기한다.\n  - \"탭이 여러 개면 탭끼리도 겹치지 않나요?\" → 겹친다. 탭 간엔 서버 유예(직전 리프레시 잠깐 허용)나 BroadcastChannel·락으로 조율한다.\n  - \"갱신이 실패하면 기다리던 요청들은?\" → 같은 거절을 받고, 일시·영구 분류를 따른다.\n- <strong>출처:<\/strong> [Go singleflight](https://pkg.go.dev/golang.org/x/sync/singleflight) · [RFC 9700 §4.14](https://datatracker.ietf.org/doc/html/rfc9700)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"요청 A, B, C가 동시에 401을 받으면 A만 갱신 요청을 보내고 B와 C는 같은 Promise를 기다렸다가 새 토큰으로 함께 재시도하는 시퀀스\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <text x=\"90\" y=\"30\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">요청 A·B·C<\/text>\n  <text x=\"330\" y=\"30\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">refreshOnce()<\/text>\n  <text x=\"590\" y=\"30\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">인증 서버<\/text>\n  <line x1=\"90\" y1=\"42\" x2=\"90\" y2=\"340\" stroke=\"var(--fig-line)\" stroke-dasharray=\"4 4\"/>\n  <line x1=\"330\" y1=\"42\" x2=\"330\" y2=\"340\" stroke=\"var(--fig-line)\" stroke-dasharray=\"4 4\"/>\n  <line x1=\"590\" y1=\"42\" x2=\"590\" y2=\"340\" stroke=\"var(--fig-line)\" stroke-dasharray=\"4 4\"/>\n  <rect x=\"40\" y=\"56\" width=\"100\" height=\"26\" rx=\"6\" fill=\"var(--fig-accent2)\" opacity=\"0.25\" stroke=\"var(--fig-accent2)\"/>\n  <text x=\"90\" y=\"74\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">A·B·C 모두 401<\/text>\n  <line x1=\"90\" y1=\"104\" x2=\"322\" y2=\"104\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <polygon points=\"322,99 332,104 322,109\" fill=\"var(--fig-accent)\"/>\n  <text x=\"206\" y=\"98\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">A: inflight 없음 → 생성<\/text>\n  <line x1=\"330\" y1=\"124\" x2=\"582\" y2=\"124\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <polygon points=\"582,119 592,124 582,129\" fill=\"var(--fig-accent)\"/>\n  <text x=\"460\" y=\"118\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">리프레시 요청 1회<\/text>\n  <line x1=\"90\" y1=\"150\" x2=\"322\" y2=\"150\" stroke=\"var(--fig-line)\" stroke-width=\"2\" stroke-dasharray=\"6 3\"/>\n  <polygon points=\"322,145 332,150 322,155\" fill=\"var(--fig-line)\"/>\n  <text x=\"206\" y=\"144\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">B: 같은 Promise await<\/text>\n  <line x1=\"90\" y1=\"178\" x2=\"322\" y2=\"178\" stroke=\"var(--fig-line)\" stroke-width=\"2\" stroke-dasharray=\"6 3\"/>\n  <polygon points=\"322,173 332,178 322,183\" fill=\"var(--fig-line)\"/>\n  <text x=\"206\" y=\"172\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">C: 같은 Promise await<\/text>\n  <rect x=\"300\" y=\"132\" width=\"60\" height=\"70\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.2\" stroke=\"var(--fig-line)\"/>\n  <line x1=\"590\" y1=\"218\" x2=\"338\" y2=\"218\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <polygon points=\"338,213 328,218 338,223\" fill=\"var(--fig-accent)\"/>\n  <text x=\"460\" y=\"212\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">새 액세스 토큰<\/text>\n  <line x1=\"330\" y1=\"248\" x2=\"98\" y2=\"248\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <polygon points=\"98,243 88,248 98,253\" fill=\"var(--fig-accent)\"/>\n  <text x=\"206\" y=\"242\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">A·B·C 모두 resolve<\/text>\n  <text x=\"330\" y=\"276\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">finally → inflight = null<\/text>\n  <rect x=\"30\" y=\"292\" width=\"120\" height=\"30\" rx=\"6\" fill=\"var(--fig-accent)\" opacity=\"0.2\" stroke=\"var(--fig-accent)\"/>\n  <text x=\"90\" y=\"312\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">각자 1회 재시도<\/text>\n  <text x=\"460\" y=\"312\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">실패해도 셋이 같은 거절을 받는다<\/text>\n<\/svg>\n<figcaption>single-flight: 동시에 터진 401은 갱신 요청 하나에 합류한다<\/figcaption>\n<\/figure>\n\n> 한 줄 정리: 세션은 회수, JWT는 확장, 로그인은 Code + PKCE, 갱신은 공유 Promise 하나로 — 영구 실패일 때만 로그아웃.\n\n## 4. 실시간 통신\n\n### 폴링·롱폴링·SSE·WebSocket 선택 (Realtime Transport)\n\n- <strong>뭐야:<\/strong> 서버의 새 데이터를 화면에 빨리 반영하는 전송 방식들이다. 폴링은 주기적으로 묻고, 롱폴링은 새 데이터까지 응답을 붙잡고, SSE는 서버가 한쪽으로 흘려보내고, WebSocket은 양방향으로 주고받는다.\n- <strong>왜:<\/strong> 요구사항 없이 고르면 \"실시간이니까 WebSocket\"으로 시작했다가 재연결·인증·확장을 다 직접 짠다. 반대로 짧은 폴링은 변화 없이 요청만 쌓이고 표시값이 계단처럼 튄다.\n- <strong>어떻게:<\/strong>\n  - 요구사항에서 출발: <strong>방향<\/strong>, <strong>지연 허용치<\/strong>, <strong>연결 수<\/strong>, 프록시·웹뷰 환경\n  - <strong>폴링<\/strong>: 가장 단순. 지연 = 주기, 빈 요청이 많다. 변화가 드물면 충분\n  - <strong>롱폴링<\/strong>: 새 데이터까지 응답을 붙잡는다. 응답마다 재요청. WebSocket이 막힌 환경의 폴백\n  - <strong>SSE<\/strong>(`EventSource`): HTTP 위 <strong>서버→클라 단방향<\/strong> 텍스트 스트림. 브라우저가 <strong>자동 재연결<\/strong>하고 `id:` → `Last-Event-ID`로 이어 받는다. 알림·AI 스트리밍에 적합. `EventSource` 옵션은 `withCredentials`뿐이라 `Authorization` 헤더를 못 붙인다\n  - <strong>WebSocket<\/strong>: <strong>양방향<\/strong>. 클라→서버 전송도 잦을 때. 재연결·하트비트·재동기화는 직접(또는 socket.io), 서버 확장엔 pub/sub 중계. backpressure가 없고 열린 연결은 bfcache를 막는다\n- <strong>핵심:<\/strong> <strong>방향과 지연 허용치<\/strong>로 고른다. 단방향이면 <strong>SSE<\/strong>(재연결 공짜), 양방향이면 <strong>WebSocket<\/strong>(재연결은 내 몫), 드물면 <strong>폴링<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"AI 답변 스트리밍은 SSE가 정석 아닌가요?\" → 맞다. 다만 양방향 소켓이 이미 있으면 스트림만 SSE로 빼는 순간 연결이 둘이 된다. 기존 소켓에 태우는 것도 합리적이다.\n  - \"WebSocket이 막히는 환경은?\" → 사내 프록시·방화벽·백신이 업그레이드를 막는다. socket.io가 HTTP 롱폴링으로 먼저 붙고 업그레이드하는 이유다.\n  - \"실시간인데 표시값이 계단처럼 튀면?\" → 폴링 주기마다 값을 통째로 바꾸기 때문. 서버 기준값 + 클라이언트 보간(라이브 델타)으로 그린다.\n- <strong>출처:<\/strong> [MDN — SSE](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events) · [MDN — WebSockets API](https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API) · [Socket.IO — How it works](https://socket.io/docs/v4/how-it-works/)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"폴링, 롱폴링, SSE, WebSocket의 요청과 응답 흐름을 시간축 네 줄로 비교한 그림\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <text x=\"20\" y=\"30\" font-size=\"14\" fill=\"currentColor\">시간 →<\/text>\n  <line x1=\"150\" y1=\"22\" x2=\"700\" y2=\"22\" stroke=\"var(--fig-line)\"/>\n  <polygon points=\"700,17 710,22 700,27\" fill=\"var(--fig-line)\"/>\n  <text x=\"20\" y=\"80\" font-size=\"15\" fill=\"currentColor\">폴링<\/text>\n  <line x1=\"150\" y1=\"76\" x2=\"700\" y2=\"76\" stroke=\"var(--fig-line)\" stroke-dasharray=\"3 4\"/>\n  <rect x=\"160\" y=\"64\" width=\"24\" height=\"24\" rx=\"4\" fill=\"var(--fig-muted)\" opacity=\"0.4\"/>\n  <rect x=\"270\" y=\"64\" width=\"24\" height=\"24\" rx=\"4\" fill=\"var(--fig-muted)\" opacity=\"0.4\"/>\n  <rect x=\"380\" y=\"64\" width=\"24\" height=\"24\" rx=\"4\" fill=\"var(--fig-accent)\" opacity=\"0.6\"/>\n  <rect x=\"490\" y=\"64\" width=\"24\" height=\"24\" rx=\"4\" fill=\"var(--fig-muted)\" opacity=\"0.4\"/>\n  <rect x=\"600\" y=\"64\" width=\"24\" height=\"24\" rx=\"4\" fill=\"var(--fig-muted)\" opacity=\"0.4\"/>\n  <text x=\"150\" y=\"108\" font-size=\"13\" fill=\"currentColor\">주기마다 요청, 대부분 빈 응답 · 지연 = 주기<\/text>\n  <text x=\"20\" y=\"152\" font-size=\"15\" fill=\"currentColor\">롱폴링<\/text>\n  <rect x=\"160\" y=\"138\" width=\"200\" height=\"24\" rx=\"4\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <rect x=\"340\" y=\"138\" width=\"20\" height=\"24\" rx=\"4\" fill=\"var(--fig-accent)\" opacity=\"0.6\"/>\n  <rect x=\"370\" y=\"138\" width=\"150\" height=\"24\" rx=\"4\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <rect x=\"500\" y=\"138\" width=\"20\" height=\"24\" rx=\"4\" fill=\"var(--fig-accent)\" opacity=\"0.6\"/>\n  <rect x=\"530\" y=\"138\" width=\"160\" height=\"24\" rx=\"4\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <text x=\"150\" y=\"182\" font-size=\"13\" fill=\"currentColor\">이벤트까지 응답을 붙잡음 → 받으면 즉시 재요청<\/text>\n  <text x=\"20\" y=\"226\" font-size=\"15\" fill=\"currentColor\">SSE<\/text>\n  <rect x=\"160\" y=\"212\" width=\"530\" height=\"24\" rx=\"4\" fill=\"var(--fig-accent2)\" opacity=\"0.15\" stroke=\"var(--fig-accent2)\"/>\n  <rect x=\"250\" y=\"216\" width=\"14\" height=\"16\" rx=\"3\" fill=\"var(--fig-accent)\"/>\n  <rect x=\"330\" y=\"216\" width=\"14\" height=\"16\" rx=\"3\" fill=\"var(--fig-accent)\"/>\n  <rect x=\"470\" y=\"216\" width=\"14\" height=\"16\" rx=\"3\" fill=\"var(--fig-accent)\"/>\n  <rect x=\"610\" y=\"216\" width=\"14\" height=\"16\" rx=\"3\" fill=\"var(--fig-accent)\"/>\n  <text x=\"150\" y=\"256\" font-size=\"13\" fill=\"currentColor\">연결 하나 유지, 서버 → 클라만 · 자동 재연결 + Last-Event-ID<\/text>\n  <text x=\"20\" y=\"300\" font-size=\"15\" fill=\"currentColor\">WebSocket<\/text>\n  <rect x=\"160\" y=\"286\" width=\"530\" height=\"24\" rx=\"4\" fill=\"var(--fig-accent)\" opacity=\"0.12\" stroke=\"var(--fig-accent)\"/>\n  <polygon points=\"240,290 254,298 240,306\" fill=\"var(--fig-accent)\"/>\n  <polygon points=\"344,290 330,298 344,306\" fill=\"var(--fig-accent2)\"/>\n  <polygon points=\"430,290 444,298 430,306\" fill=\"var(--fig-accent)\"/>\n  <polygon points=\"560,290 546,298 560,306\" fill=\"var(--fig-accent2)\"/>\n  <polygon points=\"620,290 634,298 620,306\" fill=\"var(--fig-accent)\"/>\n  <text x=\"150\" y=\"330\" font-size=\"13\" fill=\"currentColor\">연결 하나로 양방향 · 재연결·하트비트·재동기화는 직접<\/text>\n<\/svg>\n<figcaption>방향과 지연 허용치가 방식을 고른다: 단방향이면 SSE, 양방향이면 WebSocket<\/figcaption>\n<\/figure>\n\n### 재연결: 백오프, jitter, 재동기화 (Reconnect & Resync)\n\n- <strong>뭐야:<\/strong> 끊긴 실시간 연결을 다시 잇는 방법이다. 재시도 간격을 늘리고(백오프) 무작위를 섞고(jitter), 다시 붙은 뒤 놓친 데이터를 메운다(<strong>재동기화<\/strong>).\n- <strong>왜:<\/strong> 없으면 서버가 살아나는 순간 모두 동시에 재접속해 다시 쓰러뜨릴 수 있다. 끊긴 동안의 이벤트가 빠지고, `close`가 안 와 재연결이 안 돈다.\n- <strong>어떻게:<\/strong>\n  - <strong>지수 백오프<\/strong>: 실패마다 간격을 늘리고 상한을 둔다. 예: socket.io 기본은 1초에서 2배씩, 최대 5초\n  - <strong>jitter<\/strong>: 간격에 무작위를 섞는다(socket.io 기본 0.5). 없으면 재시도가 한 시각에 몰린다\n  - <strong>half-open 감지<\/strong>: 조용히 끊기면 종료 신호가 안 와 계속 \"열림\"이다. <strong>ping/pong 하트비트<\/strong>로 감지하고, `online`·`visibilitychange` 때 즉시 확인한다\n  - <strong>재동기화<\/strong>: 놓친 구간을 메운다. <strong>delta<\/strong>(마지막 번호 이후만, `Last-Event-ID`·seq) 또는 <strong>snapshot<\/strong>(현재 상태 통째 교체). 받은 쪽은 seq·id로 <strong>중복 제거<\/strong>\n  - 재연결 직후 구독 재등록. socket.io 연결 상태 복구(기본 2분)도 <strong>항상 성공하진 않아<\/strong> 재동기화가 따로 필요\n- <strong>핵심:<\/strong> <strong>백오프 + jitter<\/strong>로 몰림을, <strong>하트비트<\/strong>로 죽은 연결을, 재연결 뒤엔 <strong>delta·snapshot 재동기화<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"delta와 snapshot은 누가 고르나요?\" → 밀린 양이 많으면 snapshot, 적으면 delta가 싸다. 서버가 판단하거나 채널마다 고정한다.\n  - \"재연결 중 놓친 메시지를 seq로 걸러도 구멍은요?\" → `seq <= lastSeq` 제거는 중복만 막는다. `seq !== lastSeq + 1`이면 재요청하는 갭 검출이 따로 필요하다.\n  - \"끊긴 동안 클라이언트가 계속 숫자를 세다가 서버 값이 더 작으면?\" → 되감긴다. 서버 값이 진실이고 표시 정책(되감김/단조 증가)은 따로 정한다(5파트 참고).\n- <strong>출처:<\/strong> [AWS — Backoff and Jitter](https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/) · [Socket.IO — State recovery](https://socket.io/docs/v4/connection-state-recovery)\n\n> 한 줄 정리: 방식은 방향과 지연으로 고르고, 끊김은 백오프·jitter·하트비트로 견디고, 재연결 뒤엔 반드시 재동기화한다.\n\n## 5. 불안정한 네트워크와 웹뷰\n\n### 오프라인 감지 (Offline Detection)\n\n- <strong>뭐야:<\/strong> 사용자 기기가 네트워크에 닿지 않는 상태를 알아내는 일이다. `navigator.onLine`은 힌트일 뿐이고, 실제 판정은 요청 결과로 한다.\n- <strong>왜:<\/strong> 제대로 안 하면 지하철에서 요청이 실패하는데 화면은 \"서버 오류\"라고 한다. `navigator.onLine`이 true인데 인터넷이 안 되기도 한다.\n- <strong>어떻게:<\/strong>\n  - `navigator.onLine`·`online`/`offline` 이벤트는 브라우저·OS 휴리스틱이다. LAN만 붙어도 true라 <strong>인터넷을 보장하지 않고<\/strong> 오판도 있다. MDN은 기능을 끄는 근거가 아닌 <strong>힌트<\/strong>로만 쓰라고 한다\n  - 판정은 <strong>요청 결과<\/strong>로. fetch가 `TypeError`(응답 없음)면 네트워크 문제, 응답이 왔으면 상태 코드 문제. 주의: CORS 차단도 JS에선 같은 거절로만 보인다\n  - 오프라인이면: 쓰기를 막거나 큐에 쌓고, \"연결 끊김\"을 별도 상태로 보여 주고, 복귀 시 재조회한다. TanStack Query 기본 `networkMode: 'online'`은 오프라인이면 `paused`로 멈췄다 재연결 시 잇는다\n  - 끊김을 <strong>로그아웃 사유로 오인하지 않는다<\/strong>. 네트워크 실패와 인증 실패는 다른 분기\n- <strong>핵심:<\/strong> `onLine`은 <strong>힌트<\/strong>(true는 특히 의심). 판정은 <strong>실제 요청 결과<\/strong>로. 네트워크 실패는 <strong>인증 실패가 아니다<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"오프라인 중 사용자가 저장을 누르면?\" → 측정 기록처럼 잃으면 안 되는 건 로컬에 쌓아 재전송(멱등 키 필수), 결제처럼 즉시 확정이 필요한 건 막는다.\n  - \"페이지를 닫는 순간 보내야 하는 데이터는?\" → `sendBeacon`·`fetch(..., { keepalive: true })`. 응답을 못 받으니 되돌릴 수 없는 요청(종료·무효화)은 위험하다(1파트 참고).\n- <strong>출처:<\/strong> [MDN — Navigator.onLine](https://developer.mozilla.org/en-US/docs/Web/API/Navigator/onLine) · [TanStack — Network Mode](https://tanstack.com/query/v5/docs/framework/react/guides/network-mode)\n\n### 재시도 정책과 지수 백오프 (Retry Policy)\n\n- <strong>뭐야:<\/strong> 실패한 요청을 무엇을, 어떤 요청을, 몇 번, 어떤 간격으로 다시 보낼지 정한 규칙이다. <strong>지수 백오프<\/strong>는 실패할 때마다 다음 시도까지 간격을 늘리는 방식이다.\n- <strong>왜:<\/strong> 정책 없이 재시도하면 400을 세 번 재시도해 몇 초 뒤 같은 에러를 본다. 결제 POST를 멱등 키 없이 자동 재시도하면 이중 결제가 날 수 있다.\n- <strong>어떻게:<\/strong>\n  - <strong>무엇을<\/strong>: 일시적일 가능성이 큰 실패만. 흔히 네트워크 오류, 408, 429, 502/503/504를 후보로 본다(RFC 9110은 408에 재전송을 허용하고 503에 `Retry-After`를 붙일 수 있게 한다. 429의 `Retry-After`는 RFC 6585, 502·504엔 재시도 규정이 없어 관례다). 다른 4xx는 다시 보내도 대개 같다\n  - <strong>어떤 요청을<\/strong>: 멱등 요청, 또는 멱등 키 있는 POST\n  - <strong>얼마나<\/strong>: 상한 + 지수 백오프 + jitter. `Retry-After`가 있으면 따른다\n  - TanStack Query 기본: 쿼리는 <strong>3회 재시도<\/strong>(서버 렌더링에선 0), 간격 `min(1000 × 2^n, 30000)`ms. mutation은 기본 <strong>재시도 없음<\/strong>. `retry`를 함수로 두어 상태 코드별로 끈다\n- <strong>핵심:<\/strong> 재시도는 <strong>일시적 실패 × 멱등 요청<\/strong>에만. <strong>상한 + 백오프 + jitter<\/strong>, 4xx는 <strong>재시도하지 않는다<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"기본 3회 재시도를 그대로 두면 어떤 문제가?\" → 403·404에도 수 초간 로딩이 이어진다. 상태 코드별로 끈다.\n  - \"재시도가 성공처럼 보이는 함정은?\" → 첫 시도가 부분 처리된 뒤 재시도가 성공하면 화면은 성공이지만 데이터는 불완전하다. 결과 필드(배정 여부 등)로 확인한다.\n- <strong>출처:<\/strong> [TanStack — Query Retries](https://tanstack.com/query/v5/docs/framework/react/guides/query-retries) · [TanStack — Mutations](https://tanstack.com/query/v5/docs/framework/react/guides/mutations)\n\n### 하이브리드 앱 웹뷰 브릿지 (WebView Bridge)\n\n- <strong>뭐야:<\/strong> 앱 안의 웹뷰에서 돌아가는 웹과 네이티브 앱이 메시지를 주고받는 통로다. 웹이 카메라·다운로드 같은 기능을 앱에 부탁할 때 쓴다.\n- <strong>왜:<\/strong> 웹은 바로 배포되는데 앱은 심사·업데이트를 거친다. 새 웹이 구버전 앱에 없는 브릿지 메서드를 부르면 응답이 안 와 버튼이 로딩으로 굳을 수 있고, 앱이 보낸 에러 객체를 문자열로 그대로 찍으면 `[object Object]`만 남는다.\n- <strong>어떻게:<\/strong>\n  - <strong>버전 스큐<\/strong>가 전제다. 웹은 최신, 앱은 여러 버전이 섞인다\n  - 채널은 보통 단방향이다(Flutter `JavaScriptChannel`의 `postMessage`는 값을 돌려주지 않음). 요청-응답은 요청 ID로 직접 짝지어 \"응답이 안 오는\" 경우가 생긴다\n  - 모든 요청-응답형 브릿지 호출에 <strong>타임아웃<\/strong>을 걸고(`Promise.race`는 진 쪽을 취소하지 않으니 대기 목록도 정리), 시간 초과 시 <strong>안전한 폴백<\/strong>(거부로 간주)으로 끝낸다\n  - 기능 탐지: 앱이 지원 메서드·버전을 알려 주고, 미지원이면 진입점을 숨긴다\n  - 에러는 <strong>구조화된 계약<\/strong>(코드·분류)으로 받아 일시적 / 빌드 결함 / 버전 스큐를 구분한다\n  - 웹뷰에서 막히는 기능(다운로드, 일부 권한)은 네이티브 브릿지로 폴백\n- <strong>핵심:<\/strong> 웹뷰 브릿지는 <strong>버전 스큐가 기본값<\/strong>. 모든 호출에 <strong>타임아웃 + 폴백<\/strong>, 에러는 <strong>분류된 계약<\/strong>으로.\n- <strong>꼬리질문:<\/strong>\n  - \"타임아웃을 몇 초로 잡나요?\" → 사람이 응답하는 호출(권한 팝업)은 길게, 자동 응답만 있으면 짧게. 너무 짧으면 정상 앱도 실패로 본다.\n  - \"판정 로직은 앱과 웹 중 어디에 두나요?\" → 자주 바뀌는 판정은 웹에. 앱은 업데이트 전까지 옛 판정이 남는다.\n- <strong>출처:<\/strong> [webview_flutter](https://pub.dev/documentation/webview_flutter/latest/webview_flutter/WebViewController/addJavaScriptChannel.html) · [MDN — Promise.race](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/race)\n\n> 한 줄 정리: 네트워크 실패는 인증 실패가 아니고, 재시도는 일시적·멱등한 것만, 브릿지는 언제나 응답이 안 올 수 있다.\n\n## 핵심 키워드 모음\n\n- <strong>안전·멱등 메서드<\/strong>: GET/HEAD/OPTIONS/TRACE 안전, PUT/DELETE 멱등, POST·PATCH는 보장 안 됨, 기준은 의도된 효과\n- <strong>401 vs 403<\/strong>: 401은 인증 없음(갱신 대상), 403은 거절(갱신 금지), 이유는 업무 코드로\n- <strong>HTTP 캐시<\/strong>: max-age는 안 물음, no-cache는 매번 재검증, no-store는 저장 금지, ETag → 304\n- <strong>HTTP/1.1·2·3<\/strong>: 줄 서기 → 다중화(TCP HOL) → QUIC 스트림 독립·연결 이동, 서버 푸시 폐기\n- <strong>TLS<\/strong>: 암호화·무결성·인증, 1.3은 1-RTT, HSTS, 보안 컨텍스트\n- <strong>REST vs GraphQL<\/strong>: 필드 선택으로 오버·언더페칭 제거, 대가는 HTTP 캐시·N+1·복잡도 제한\n- <strong>SOP<\/strong>: 출처 = 스킴+호스트+포트, 읽기 차단·쓰기와 임베드 허용, CORS는 예외 허가\n- <strong>CORS<\/strong>: JSON·커스텀 헤더면 preflight, 쿠키면 와일드카드 금지, CSRF 방어 아님\n- <strong>쿠키 속성<\/strong>: HttpOnly·Secure·SameSite, None은 Secure 필수, Chrome 80부터 미지정은 Lax\n- <strong>XSS<\/strong>: 이스케이프·sanitize 1차, strict CSP 2차, 클릭재킹은 frame-ancestors\n- <strong>CSRF<\/strong>: 토큰·Fetch Metadata(Origin 폴백)가 주, SameSite는 보조, Bearer 헤더는 대상 아님\n- <strong>세션 vs JWT<\/strong>: 세션은 회수 쉬움, JWT는 검증 싸고 회수 어려움, 서명이지 암호화 아님\n- <strong>액세스/리프레시<\/strong>: 짧은 액세스·HttpOnly 리프레시, 회전(RFC 9700), BFF가 가장 안전\n- <strong>OAuth + PKCE<\/strong>: 인가 코드 + code_verifier, 공개 클라이언트 필수, Implicit 비권장\n- <strong>single-flight 갱신<\/strong>: 공유 Promise에 합류, finally로 비움, 재시도 1회\n- <strong>실시간 방식<\/strong>: 폴링·롱폴링·SSE(단방향·자동 재연결)·WebSocket(양방향)\n- <strong>재연결·재동기화<\/strong>: 백오프 + jitter, 하트비트로 half-open 감지, delta 또는 snapshot\n- <strong>오프라인 감지<\/strong>: onLine은 힌트, 판정은 요청 결과, 끊김 ≠ 인증 실패\n- <strong>재시도 정책<\/strong>: 일시적 실패 × 멱등 요청만, Query 기본 쿼리 3회·mutation 0회\n- <strong>웹뷰 브릿지<\/strong>: 버전 스큐 전제, 요청 ID·타임아웃·폴백\n"}, {"id": "n07", "num": "7", "title": "성능과 측정", "md": "# 7. 성능과 측정\n\n<strong>이 파트는 뭐냐:<\/strong> \"느리다\"는 말을 지표·원인·수단으로 쪼개는 영역. 순서는 늘 <strong>측정 → 병목 특정 → 가장 싼 수단 → 재측정<\/strong>이고, 측정 없이 고른 최적화는 근거를 댈 수 없다.\n\n## 1. 측정 먼저\n\n### 랩 데이터와 필드 데이터 (Lab vs Field Data)\n\n- <strong>뭐야:<\/strong> 성능 숫자를 얻는 두 경로다. 랩 데이터는 정해진 기기·네트워크 조건에서 한 번 재는 실험실 값이고, 필드 데이터는 실제 사용자 브라우저에서 모은 값이다.\n- <strong>왜:<\/strong> 둘을 구분하지 않으면 내 맥북 Lighthouse 95점과 \"사용자는 느리다\"는 말이 충돌하거나, 점수는 낮은데 실사용 지표는 멀쩡한 상황을 설명하지 못한다. 같은 숫자로 착각하면 엉뚱한 곳을 고친다.\n- <strong>어떻게:<\/strong>\n  - <strong>랩(Lab)<\/strong>: Lighthouse·Performance 탭처럼 정해진 기기·네트워크 조건에서 한 번 재는 값. 재현 가능해서 <strong>원인 추적·전후 비교<\/strong>에 쓴다\n  - <strong>필드(Field, RUM)<\/strong>: 실제 사용자 브라우저에서 모은 값. CrUX(Chrome 사용자 통계), `web-vitals` 라이브러리로 직접 수집. 기기·네트워크 분포가 섞여 <strong>판정<\/strong>에 쓴다\n  - CWV 합격 여부는 필드 데이터의 <strong>75번째 백분위(p75)<\/strong>, 모바일·데스크톱을 나눠서 본다\n  - 일반 Lighthouse 실행(페이지 로드)엔 사용자 상호작용이 없어서 INP를 못 잰다. 대신 TBT(Total Blocking Time)를 <strong>랩용 대리 지표<\/strong>로 본다. 다만 TBT가 좋아도 INP가 나쁠 수 있다(사용자가 언제 누를지 랩은 모른다)\n- <strong>핵심:<\/strong> 판정은 <strong>필드 p75<\/strong>, 원인 추적은 <strong>랩<\/strong>. 랩 점수 올리기가 목표가 되면 안 된다.\n- <strong>꼬리질문:<\/strong>\n  - \"Lighthouse 점수가 매번 다른데요?\" → CPU 부하·네트워크·확장 프로그램에 흔들린다. 시크릿 창·여러 번 실행 중앙값으로 비교하고, 절대값보다 <strong>같은 조건의 전후 차이<\/strong>를 본다.\n  - \"필드 데이터가 없는 신규 서비스는요?\" → CrUX는 공개 페이지이면서 방문자가 일정 수 이상이어야 잡힌다(기준치는 비공개). `web-vitals`로 `onLCP`·`onINP`·`onCLS`를 직접 보내 수집한다.\n- <strong>출처:<\/strong> [Why lab and field data can be different (web.dev)](https://web.dev/articles/lab-and-field-data-differences) · [Total Blocking Time (web.dev)](https://web.dev/articles/tbt) · [CrUX methodology](https://developer.chrome.com/docs/crux/methodology)\n\n### Performance 탭과 롱 태스크 (Performance Panel, Long Task)\n\n- <strong>뭐야:<\/strong> Chrome DevTools의 Performance 탭은 메인 스레드가 시간을 어디에 썼는지 녹화해 보여주는 도구다. 그 기록에서 50ms 넘게 메인 스레드를 잡은 작업을 <strong>롱 태스크<\/strong>라 부른다.\n- <strong>왜:<\/strong> 이게 없으면 버튼 반응이 굼뜨거나 스크롤이 끊길 때 \"어느 함수가 느린지\"를 말할 근거가 없다. 감으로 고치게 된다.\n- <strong>어떻게:<\/strong>\n  - 녹화 → Main 트랙의 플레임 차트에서 <strong>50ms 넘는 태스크<\/strong>를 찾는다. 이게 롱 태스크. 빨간 삼각형이 붙고 50ms를 넘긴 부분이 빨간 빗금으로 칠해진다\n  - 노란색(Scripting)·보라색(Rendering/Layout)·초록색(Painting) 비율로 JS 문제인지 레이아웃 문제인지 가른다\n  - Interactions 트랙에서 클릭·키 입력 하나하나의 입력 지연·처리·표시 지연이 보이고, 200ms를 넘으면 경고가 붙는다\n  - 보라색 Layout 블록이 JS 안에서 반복되면 <strong>강제 동기 레이아웃(레이아웃 스래싱)<\/strong> 의심 → 읽기·쓰기 분리\n  - CPU 4~6배 스로틀링을 걸어 저사양 폰을 흉내 낸다\n- <strong>핵심:<\/strong> 메인 스레드를 <strong>50ms 넘게<\/strong> 잡는 태스크가 입력 반응을 늦춘다. 플레임 차트는 <strong>넓은 블록 → 아래로 내려가며<\/strong> 가장 깊은 자기 시간(Self Time)을 찾는다.\n- <strong>꼬리질문:<\/strong>\n  - \"롱 태스크를 찾았는데 쪼갤 수 없는 계산이면요?\" → 중간중간 메인 스레드에 양보해 입력이 끼어들 틈을 주거나, 계산을 웹 워커로 뺀다(1파트 참고). `scheduler.yield()`는 이어지는 작업을 큐 맨 뒤가 아니라 앞쪽에 다시 넣어 주지만 주의: 2026-10 MDN 기준 Baseline이 아니라(Safari 미지원) `setTimeout` 폴백을 같이 둔다.\n  - \"DevTools 일시정지는 언제 쓰나요?\" → 화면이 굳어 녹화조차 어려울 때. 멈춘 시점의 콜스택이 곧 무한 루프·이벤트 고리의 위치다.\n- <strong>출처:<\/strong> [Performance features reference (Chrome DevTools)](https://developer.chrome.com/docs/devtools/performance/reference) · [Optimize long tasks (web.dev)](https://web.dev/articles/optimize-long-tasks) · [Scheduler.yield() (MDN)](https://developer.mozilla.org/en-US/docs/Web/API/Scheduler/yield)\n\n### React Profiler\n\n- <strong>뭐야:<\/strong> React DevTools에 들어 있는 렌더 측정 도구로, 어떤 컴포넌트가 얼마나 오래 렌더됐는지를 커밋 단위로 보여주고, 설정을 켜면 왜 다시 렌더됐는지도 기록한다.\n- <strong>왜:<\/strong> 입력 하나에 화면 전체가 버벅일 때 브라우저 Performance 탭은 JS 호출 스택을 보여줄 뿐이라 `performWorkUntilDeadline` 같은 React 내부 함수 사이에서 컴포넌트를 골라내야 하고(프로덕션 빌드는 이름도 압축된다), 그 컴포넌트가 왜 다시 렌더됐는지는 알려주지 않는다.\n- <strong>어떻게:<\/strong>\n  - React DevTools Profiler 녹화 → 커밋별 <strong>Flamegraph·Ranked<\/strong> 차트로 렌더 시간이 긴 컴포넌트 확인\n  - Profiler 설정의 \"Record why each component rendered while profiling\"(기본 꺼짐, 약간의 오버헤드)을 켜면 <strong>첫 렌더/props 변경/state 변경/hooks 변경/context 변경/부모 리렌더<\/strong> 이유가 나온다. 출처: [React DevTools CHANGELOG 4.0.0 \"Why did this render?\"](https://github.com/facebook/react/blob/main/packages/react-devtools/CHANGELOG.md) · [ProfilerSettings.js](https://github.com/facebook/react/blob/main/packages/react-devtools-shared/src/devtools/views/Settings/ProfilerSettings.js) · [WhatChanged.js](https://github.com/facebook/react/blob/main/packages/react-devtools-shared/src/devtools/views/Profiler/WhatChanged.js)\n  - \"Highlight updates\" 옵션으로 리렌더되는 영역을 눈으로 본다\n  - 코드에서 재고 싶으면 `<Profiler id onRender>` 컴포넌트로 `actualDuration`(이번 렌더에 실제 쓴 시간, 메모 효과 반영)과 `baseDuration`(메모 없이 전부 다시 그릴 때 추정치)을 비교\n  - 주의: React 19.2(2025-10)부터 Chrome Performance 탭에 React 전용 트랙(Scheduler·Components)이 붙어, 브라우저 타임라인 위에서 어느 우선순위의 렌더였는지까지 같이 본다\n- <strong>핵심:<\/strong> Profiler는 <strong>\"무엇이 왜 다시 렌더됐나\"<\/strong>, Performance 탭은 <strong>\"메인 스레드 시간이 어디로 갔나\"<\/strong>. 둘을 같이 본다.\n- <strong>꼬리질문:<\/strong>\n  - \"개발 모드에서 잰 수치를 믿어도 되나요?\" → 개발 빌드는 경고·이중 렌더(StrictMode) 때문에 느리다. 상대 비교용이고, 절대 수치는 프로덕션 빌드로 잰다. 프로덕션 빌드는 `<Profiler>` 측정이 꺼져 있어서 `react-dom/profiling` 빌드로 바꿔야 한다.\n- <strong>출처:<\/strong> [Profiler (react.dev)](https://react.dev/reference/react/Profiler) · [React Performance Tracks (react.dev)](https://react.dev/reference/dev-tools/react-performance-tracks) · [Introducing the React Profiler (React 블로그, 2018)](https://legacy.reactjs.org/blog/2018/09/10/introducing-the-react-profiler.html)\n\n> 한 줄 정리: 필드로 판정하고 랩으로 원인을 찾고, 메인 스레드는 Performance 탭, 리렌더는 Profiler로 본다.\n\n## 2. Core Web Vitals\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"LCP는 로딩 초반, INP는 페이지 수명 동안의 상호작용, CLS는 전 구간의 레이아웃 이동에 해당함을 보여주는 타임라인\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <text x=\"24\" y=\"30\" font-size=\"15\" fill=\"currentColor\" font-weight=\"bold\">페이지 수명 타임라인과 Core Web Vitals<\/text>\n  <line x1=\"40\" y1=\"130\" x2=\"690\" y2=\"130\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <polygon points=\"690,124 702,130 690,136\" fill=\"var(--fig-line)\"/>\n  <circle cx=\"40\" cy=\"130\" r=\"5\" fill=\"var(--fig-muted)\"/>\n  <text x=\"40\" y=\"152\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">요청<\/text>\n  <circle cx=\"130\" cy=\"130\" r=\"5\" fill=\"var(--fig-muted)\"/>\n  <text x=\"130\" y=\"152\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">TTFB<\/text>\n  <circle cx=\"220\" cy=\"130\" r=\"5\" fill=\"var(--fig-muted)\"/>\n  <text x=\"220\" y=\"152\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">FCP<\/text>\n  <circle cx=\"330\" cy=\"130\" r=\"7\" fill=\"var(--fig-accent)\"/>\n  <text x=\"330\" y=\"152\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">LCP<\/text>\n  <rect x=\"40\" y=\"70\" width=\"290\" height=\"30\" rx=\"6\" fill=\"var(--fig-accent)\" opacity=\"0.25\"/>\n  <text x=\"52\" y=\"90\" font-size=\"13\" fill=\"currentColor\">LCP: 가장 큰 콘텐츠가 그려질 때까지 · 좋음 ≤ 2.5s<\/text>\n  <text x=\"510\" y=\"100\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">사용자 상호작용 (탭·클릭·키 입력)<\/text>\n  <rect x=\"400\" y=\"176\" width=\"20\" height=\"26\" fill=\"var(--fig-muted)\"/>\n  <rect x=\"420\" y=\"176\" width=\"34\" height=\"26\" fill=\"var(--fig-accent2)\"/>\n  <rect x=\"454\" y=\"176\" width=\"14\" height=\"26\" fill=\"var(--fig-accent)\"/>\n  <rect x=\"520\" y=\"176\" width=\"12\" height=\"26\" fill=\"var(--fig-muted)\"/>\n  <rect x=\"532\" y=\"176\" width=\"18\" height=\"26\" fill=\"var(--fig-accent2)\"/>\n  <rect x=\"550\" y=\"176\" width=\"10\" height=\"26\" fill=\"var(--fig-accent)\"/>\n  <rect x=\"610\" y=\"176\" width=\"26\" height=\"26\" fill=\"var(--fig-muted)\"/>\n  <rect x=\"636\" y=\"176\" width=\"22\" height=\"26\" fill=\"var(--fig-accent2)\"/>\n  <rect x=\"658\" y=\"176\" width=\"12\" height=\"26\" fill=\"var(--fig-accent)\"/>\n  <line x1=\"400\" y1=\"130\" x2=\"400\" y2=\"176\" stroke=\"var(--fig-line)\" stroke-dasharray=\"3 3\"/>\n  <line x1=\"520\" y1=\"130\" x2=\"520\" y2=\"176\" stroke=\"var(--fig-line)\" stroke-dasharray=\"3 3\"/>\n  <line x1=\"610\" y1=\"130\" x2=\"610\" y2=\"176\" stroke=\"var(--fig-line)\" stroke-dasharray=\"3 3\"/>\n  <text x=\"400\" y=\"222\" font-size=\"13\" fill=\"currentColor\">입력 지연 → 처리 → 다음 페인트<\/text>\n  <text x=\"400\" y=\"240\" font-size=\"13\" fill=\"currentColor\">INP: 가장 느린 축의 상호작용 · 좋음 ≤ 200ms<\/text>\n  <rect x=\"40\" y=\"270\" width=\"650\" height=\"30\" rx=\"6\" fill=\"var(--fig-accent2)\" opacity=\"0.2\"/>\n  <polygon points=\"180,276 190,294 170,294\" fill=\"var(--fig-accent2)\"/>\n  <polygon points=\"300,276 310,294 290,294\" fill=\"var(--fig-accent2)\"/>\n  <polygon points=\"470,276 480,294 460,294\" fill=\"var(--fig-accent2)\"/>\n  <text x=\"52\" y=\"324\" font-size=\"13\" fill=\"currentColor\">CLS: 전 구간의 예상치 못한 레이아웃 이동, 가장 큰 묶음(세션 창) 점수 · 좋음 ≤ 0.1<\/text>\n<\/svg>\n<figcaption>LCP는 로딩, INP는 반응성, CLS는 시각 안정성 — 세 지표가 재는 구간이 다르다 (주의: 2024-03 기준 지표·임계값)<\/figcaption>\n<\/figure>\n\n### LCP (Largest Contentful Paint)\n\n- <strong>뭐야:<\/strong> 뷰포트 안에서 가장 큰 이미지나 글 덩어리가 화면에 그려지기까지 걸린 시간이다. \"주요 내용이 언제 보였나\"를 재는 로딩 지표다.\n- <strong>왜:<\/strong> 스켈레톤은 금방 뜨는데 정작 메인 이미지·제목이 늦게 나오는 경우가 있다. LCP는 주요 콘텐츠가 로드됐을 가능성이 높은 시점을 표시해 체감 로딩 속도에 가깝다(web.dev). 첫 화면이 그려진 시점(FCP)만 보면 이 늦음이 안 잡힌다.\n- <strong>어떻게:<\/strong>\n  - 뷰포트 안에서 <strong>가장 큰 이미지·텍스트 블록<\/strong>이 그려진 시점. 후보는 `<img>`·SVG 안 `<image>`·`<video>`(포스터 로드와 첫 프레임 중 이른 쪽)·CSS `url()` 배경 이미지·텍스트 블록. 주의: web.dev 기준(2026-10 확인) 좋음 ≤ <strong>2.5s<\/strong>, 나쁨 > 4s (p75)\n  - 4구간으로 쪼개 본다: <strong>TTFB → 리소스 로드 지연(발견이 늦음) → 리소스 다운로드 → 렌더 지연<\/strong>\n  - 발견 지연: LCP 이미지가 CSS `background`나 JS 렌더로만 존재하면 프리로드 스캐너가 못 찾는다 → HTML에 `<img>`로 두고 `fetchpriority=\"high\"`\n  - 렌더 지연: 렌더 차단 CSS·폰트, 클라이언트에서 데이터를 받아야만 그리는 구조 → SSR·스트리밍\n  - LCP 요소에 `loading=\"lazy\"`를 걸면 오히려 늦어진다\n- <strong>핵심:<\/strong> LCP는 <strong>TTFB·발견·다운로드·렌더 지연<\/strong> 네 조각의 합. LCP가 나쁜 사이트는 이미지 다운로드보다 <strong>TTFB와 발견 지연<\/strong>에 더 오래 쓰는 경우가 많다.\n- <strong>꼬리질문:<\/strong>\n  - \"CSR 앱이라 LCP가 늦습니다. SSR 말고 방법은?\" → LCP 리소스를 `preload`로 미리 당기고, 데이터 요청을 JS 번들 실행 뒤가 아니라 라우트 진입과 병렬로 시작한다. 근본 해결은 서버에서 HTML에 내용을 담는 것.\n  - \"스켈레톤도 LCP가 되나요?\" → 단색 블록은 후보 유형이 아니고, 정보량 낮은 자리표시 이미지·투명 요소·화면 전체 배경도 빠진다. 다만 스켈레톤 안의 텍스트·실제 이미지는 후보가 될 수 있으니 실제 LCP 요소는 Performance 탭의 LCP 마커로 확인한다.\n- <strong>출처:<\/strong> [Largest Contentful Paint (web.dev)](https://web.dev/articles/lcp) · [Optimize LCP (web.dev)](https://web.dev/articles/optimize-lcp)\n\n### INP (Interaction to Next Paint)\n\n- <strong>뭐야:<\/strong> 클릭·탭·키 입력 상호작용 뒤 다음 화면이 그려지기까지 걸린 시간을, 페이지 수명 동안 관찰한 상호작용 중 가장 느린 축의 값으로 보고하는 지표다. 페이지를 쓰는 동안의 반응성을 잰다.\n- <strong>왜:<\/strong> 첫 로딩은 빠른데 필터 칩을 누르면 0.5초 뒤에 반응하는 굼뜸은 로딩 지표로는 안 잡힌다. INP가 그 빈자리를 잰다.\n- <strong>어떻게:<\/strong>\n  - 주의: <strong>2024-03-12부터 FID를 대체<\/strong>한 CWV(web.dev 공지). FID는 첫 입력의 <strong>대기 시간만<\/strong> 쟀고, INP는 페이지 수명 동안의 <strong>모든<\/strong> 클릭·탭·키 입력을 <strong>다음 페인트까지<\/strong> 잰다. 스크롤·호버·확대는 대상이 아니다\n  - 한 상호작용 = <strong>입력 지연(앞선 태스크 대기) + 처리 시간(핸들러) + 표시 지연(렌더·페인트)<\/strong>\n  - 값은 대개 가장 느린 상호작용. 상호작용이 많은 페이지는 <strong>50회당 최악 1개<\/strong>를 이상치로 빼고 고른다. 주의: web.dev 기준(2026-10 확인) 좋음 ≤ <strong>200ms<\/strong>, 나쁨 > 500ms (p75)\n  - 개선: 핸들러에서 무거운 일 미루기(`startTransition`, `yield`), 렌더 범위 줄이기, 거대 DOM 줄이기, 서드파티 스크립트 정리\n- <strong>핵심:<\/strong> INP는 <strong>입력 지연·처리·표시 지연<\/strong> 셋으로 쪼갠다. 클릭 직후 <strong>보이는 피드백을 먼저 그리고<\/strong> 무거운 일은 뒤로.\n- <strong>꼬리질문:<\/strong>\n  - \"`useTransition`을 쓰면 왜 INP가 좋아지나요?\" → 상태 갱신을 긴급하지 않은 렌더로 표시해 React가 중간에 양보할 수 있게 된다. 입력에 대한 즉시 갱신(입력창 값)은 먼저 커밋되고 무거운 목록 렌더는 뒤로 밀린다.\n  - \"랩에서 INP를 어떻게 재죠?\" → Lighthouse 기본 실행엔 상호작용이 없다. DevTools Performance 탭에서 실제로 클릭하며 녹화하면 Interactions 트랙에 각 상호작용 시간이 나온다. 로딩이 끝난 뒤만 누르지 말고 <strong>로딩 중에도<\/strong> 눌러 봐야 실제 사용자 상황이 나온다.\n- <strong>출처:<\/strong> [Interaction to Next Paint (web.dev)](https://web.dev/articles/inp) · [INP is officially a Core Web Vital (web.dev, 2024-03-12)](https://web.dev/blog/inp-cwv-launch)\n\n### CLS (Cumulative Layout Shift)\n\n- <strong>뭐야:<\/strong> 이미 보이던 요소가 예상치 못하게 밀려난 정도를 점수로 매겨, 가장 큰 묶음(세션 창)의 합으로 보고하는 지표다. 화면이 얼마나 덜컹거렸나를 잰다.\n- <strong>왜:<\/strong> 이미지 로드·배너 삽입으로 레이아웃이 밀리면 누르려던 버튼 대신 엉뚱한 걸 누르게 된다.\n- <strong>어떻게:<\/strong>\n  - 예상치 못한 레이아웃 이동(클릭·탭·키 입력 직후 500ms 안의 이동은 제외, 스크롤은 입력으로 치지 않음)의 점수(영향 비율 × 이동 거리 비율)를 <strong>세션 창<\/strong>(이동 사이 1초 미만, 최대 5초) 단위로 묶고, 가장 큰 묶음을 쓴다. 주의: web.dev 기준(2026-10 확인) 좋음 ≤ <strong>0.1<\/strong>, 나쁨 > 0.25 (p75)\n  - 원인 TOP: 크기 없는 이미지·iframe, 늦게 끼어드는 배너·광고, 웹폰트 교체로 글자 폭이 바뀜, 비동기 데이터로 위쪽에 요소 삽입\n  - 대응: `width`/`height` 또는 `aspect-ratio`로 <strong>자리 예약<\/strong>, 삽입 영역 `min-height`, 폰트 `size-adjust` 등으로 폴백 폰트 크기 맞추기\n  - 애니메이션은 `top`/`height` 대신 `transform` — 레이아웃을 안 건드려 CLS에 안 잡힌다\n  - 클릭·키 입력 직후 0.5초 이내 이동은 제외된다(예: 아코디언 펼침). 스크롤·드래그 같은 연속 입력은 이 예외에 해당하지 않는다\n- <strong>핵심:<\/strong> CLS는 <strong>자리 예약<\/strong>의 문제. 나중에 올 것의 크기를 <strong>먼저 알려준다<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"스켈레톤이 CLS를 막나요?\" → 스켈레톤 높이가 실제 콘텐츠와 같을 때만. 다르면 교체 순간 이동이 생긴다.\n- <strong>출처:<\/strong> [Cumulative Layout Shift (web.dev)](https://web.dev/articles/cls)\n\n### 보조 지표 TTFB·FCP (Time to First Byte, First Contentful Paint)\n\n- <strong>뭐야:<\/strong> TTFB는 페이지 이동을 시작한 때부터 응답의 첫 바이트가 도착하기 시작할 때까지의 시간(리다이렉트·DNS·연결 포함), FCP는 화면에 첫 콘텐츠(텍스트·이미지 등)가 그려진 시점이다. CWV 판정용이 아니라 원인을 가르는 진단용 지표다.\n- <strong>왜:<\/strong> LCP가 나쁠 때 원인이 서버 쪽인지 프론트 쪽인지 가르는 데 이 둘이 쓰인다. 모르면 \"CWV 말고 다른 지표도 아세요?\"라는 질문에도 막힌다.\n- <strong>어떻게:<\/strong>\n  - <strong>TTFB<\/strong>: 이동 시작부터 응답 첫 바이트까지. 리다이렉트·서비스 워커 시작·DNS·연결·TLS·서버 처리가 다 들어간다. 주의: web.dev 기준 좋음 ≤ <strong>0.8s<\/strong>, 나쁨 > 1.8s — 대략적 안내값이고 <strong>CWV가 아니다<\/strong>\n  - <strong>FCP<\/strong>: 텍스트·이미지·SVG·흰색이 아닌 canvas 중 <strong>무엇이든 처음<\/strong> 그려진 시점. 주의: web.dev 기준 좋음 ≤ <strong>1.8s<\/strong>, 나쁨 > 3.0s\n  - 진단 순서: TTFB가 크면 서버·캐시·리다이렉트 → TTFB는 작은데 FCP가 크면 렌더 차단 CSS·폰트 → FCP는 빠른데 LCP가 늦으면 LCP 리소스 발견·다운로드. 내비게이션 단계 자체는 1파트 참고\n  - CSR SPA는 HTML이 비어 있어 TTFB가 작아도 FCP·LCP가 JS 실행을 기다린다. 반대로 SSR은 TTFB가 늘어도 FCP·LCP는 나아질 수 있다\n- <strong>핵심:<\/strong> TTFB·FCP는 <strong>CWV가 아니라 진단용<\/strong>. LCP 4구간의 첫 조각이 TTFB이고, FCP와 LCP 사이 간격이 \"주요 콘텐츠가 늦다\"는 신호다.\n- <strong>꼬리질문:<\/strong>\n  - \"TTFB를 꼭 0.8초 안에 맞춰야 하나요?\" → 아니다. 서버 렌더링이라 TTFB가 길어도 LCP·FCP가 좋으면 괜찮다는 게 web.dev 입장이다. 103 Early Hints를 쓰면 그 응답이 첫 바이트로 잡혀 TTFB 비교가 흐려진다.\n- <strong>출처:<\/strong> [Time to First Byte (web.dev)](https://web.dev/articles/ttfb) · [First Contentful Paint (web.dev)](https://web.dev/articles/fcp)\n\n> 한 줄 정리: LCP는 발견을 앞당기고, INP는 메인 스레드를 비우고, CLS는 자리를 예약한다. TTFB·FCP는 LCP가 어디서 늦는지 가르는 진단 지표다.\n\n## 3. 번들과 모듈\n\n### 번들 분석 (Bundle Analysis)\n\n- <strong>뭐야:<\/strong> 빌드 결과물(번들)이 어떤 청크와 모듈로 이루어졌고 각각 얼마나 큰지를 들여다보는 작업이다.\n- <strong>왜:<\/strong> 이게 없으면 \"번들 줄여야 한다\"는 말만 나오고 무엇이 큰지 아무도 모른다.\n- <strong>어떻게:<\/strong>\n  - `@next/bundle-analyzer`(webpack)·`webpack-bundle-analyzer`·`source-map-explorer`로 청크별 트리맵을 본다. 주의: Next.js 16.1부터 Turbopack용 `next experimental-analyze`(실험 기능)가 import 경로까지 추적해 준다\n  - 볼 것: <strong>첫 화면 공용 청크에 들어간 큰 라이브러리<\/strong>, 같은 라이브러리의 <strong>중복 버전<\/strong>, 날짜·아이콘처럼 일부만 쓰는데 통째 들어온 패키지\n  - 크기는 parsed(압축 해제 후, 파싱·실행 비용)와 gzip/brotli(전송 비용)를 구분해 본다\n  - 데이터를 UI로 바꾸기만 하는 라이브러리(코드 하이라이트·마크다운 파싱)는 서버 컴포넌트로 옮기면 클라이언트 번들에서 아예 빠진다\n  - CI에서 `size-limit` 같은 도구로 예산을 걸면 회귀를 막는다(아래 성능 예산 참고)\n- <strong>핵심:<\/strong> 줄이기 전에 <strong>어느 청크에 무엇이<\/strong> 들었는지부터. 전송 크기와 <strong>파싱·실행 비용<\/strong>은 다른 문제.\n- <strong>꼬리질문:<\/strong>\n  - \"gzip 크기만 보면 안 되나요?\" → 전송은 그걸로 되지만 저사양 기기에서 비싼 건 압축 해제된 JS의 파싱·실행 시간이다.\n- <strong>출처:<\/strong> [Optimizing package bundling (Next.js)](https://nextjs.org/docs/app/guides/package-bundling)\n\n### 코드 스플리팅과 동적 import (Code Splitting, Dynamic Import)\n\n- <strong>뭐야:<\/strong> 하나로 뭉친 번들을 여러 조각으로 나눠, 필요한 조각만 필요한 때 받게 하는 방식이다. 동적 `import()`가 그 나눔 지점을 만든다.\n- <strong>왜:<\/strong> 나누지 않으면 관리자 화면에서만 쓰는 에디터·차트가 로그인 화면 번들에도 들어가 모든 사용자가 그 비용을 낸다.\n- <strong>어떻게:<\/strong>\n  - 라우트 단위와 서버 컴포넌트는 Next.js App Router가 자동 분리. 클라이언트 컴포넌트 단위는 `next/dynamic`(= `React.lazy` + `Suspense` 조합)\n  - `import()`는 Promise를 돌려주는 런타임 로드 → 번들러가 별도 청크로 뗀다. 같은 모듈은 한 번만 평가되고 캐시된다\n  - 모달·에디터·차트처럼 <strong>조건부로 열리는 것<\/strong>이 1순위. 클릭 직전 `onMouseEnter`·`onFocus`에서 미리 import해 대기 시간을 숨길 수 있다\n  - `ssr: false`는 브라우저 API에 의존하는 라이브러리를 서버 렌더에서 뺄 때. 클라이언트 컴포넌트 안에서만 쓸 수 있고 서버 컴포넌트에서 쓰면 에러다\n- <strong>핵심:<\/strong> 스플리팅은 총량을 줄이지 않고 <strong>비용을 내는 사람<\/strong>을 바꾼다. 기준은 \"무겁나\"가 아니라 <strong>\"누가 그 화면에 들어가나\"<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"다 쪼개면 좋은가요?\" → 요청 수가 늘고 쪼갠 조각을 필요한 순간 기다린다. 대부분이 들어가는 화면을 쪼개면 지연을 옮긴 것뿐이다.\n  - \"청크 로드가 실패하면요?\" → 배포로 해시가 바뀌어 옛 청크가 404가 될 수 있다. `import()` Promise가 reject되니 에러 바운더리에서 재시도·새로고침 안내를 둔다.\n- <strong>출처:<\/strong> [Lazy loading (Next.js)](https://nextjs.org/docs/app/guides/lazy-loading) · [import() (MDN)](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/import)\n\n### 트리 셰이킹 (Tree Shaking)\n\n- <strong>뭐야:<\/strong> 빌드 도구가 실제로 쓰이지 않는 export를 번들에서 빼는 최적화다. 이름은 Rollup이 널리 퍼뜨렸고, webpack 문서는 이를 나무를 흔들어 죽은 잎(안 쓰는 코드)을 떨어뜨리는 것에 비유한다. 다만 실제로는 저절로 떨어지지 않고, 아래 조건을 만족해 정적으로 \"안 쓴다\"고 증명된 export만 빠진다.\n- <strong>왜:<\/strong> 조건이 깨지면 함수 하나만 import했는데 라이브러리 전체가 번들에 들어온다.\n- <strong>어떻게:<\/strong>\n  - 번들러가 <strong>정적 `import`/`export` 그래프<\/strong>를 보고 안 쓰는 export를 제거\n  - 조건 1: <strong>ESM<\/strong>이어야 한다. CommonJS `require`는 동적이라 정적 분석이 어렵다(주의: webpack 5는 일부 CommonJS 패턴만 추적하고, 분석 못 하는 모듈은 포기한다)\n  - 조건 2: <strong>부수효과 없음<\/strong>을 알려야 한다. `package.json`의 `\"sideEffects\": false`(또는 `\"*.css\"` 같은 예외 목록 — CSS를 빼먹으면 스타일이 지워진다). 모듈 최상단에서 전역을 건드리면 지울 수 없다\n  - 조건 3: 배럴 파일(`index.ts`에서 전부 re-export)은 부수효과 판단이 꼬이면 통째로 끌려온다 → 직접 경로 import, Next.js `optimizePackageImports`(주의: Next.js 16 문서 기준 `experimental` 옵션. `lucide-react`·`date-fns`·`lodash-es` 등은 기본 적용)\n  - `lodash` 대신 `lodash-es`처럼 ESM 배포판을 고른다. 셰이킹은 production 빌드(최소화 단계)에서 완성되니 개발 빌드로 판단하지 않는다\n- <strong>핵심:<\/strong> 트리 셰이킹 조건은 <strong>ESM + 부수효과 없음 + 정적 분석 가능<\/strong>. 하나라도 깨지면 통째로 들어오기 쉽다. ESM 원리 자체는 2파트 참고.\n- <strong>꼬리질문:<\/strong>\n  - \"`import * as utils`는 셰이킹이 안 되나요?\" → 번들러가 어떤 속성을 쓰는지 정적으로 추적할 수 있으면 걸러 내는 경우가 많다(번들러마다 다르다). `utils[name]`처럼 동적 접근을 하면 추적이 끊긴다.\n- <strong>출처:<\/strong> [Tree Shaking (webpack)](https://webpack.js.org/guides/tree-shaking/) · [optimizePackageImports (Next.js)](https://nextjs.org/docs/app/api-reference/config/next-config-js/optimizePackageImports)\n\n### 대형 모듈·WASM 지연 로드\n\n- <strong>뭐야:<\/strong> 얼굴 인식·PDF 생성처럼 수 MB짜리 모듈이나 WASM을 앱 번들에 넣지 않고, 그 기능에 들어가는 순간에 따로 불러오는 방식이다.\n- <strong>왜:<\/strong> 일반 import로 넣으면 그 기능을 안 쓰는 사용자까지 큰 첫 로딩 비용을 내고, 번들러가 거대한 파일을 처리하지 못해 빌드가 깨지기도 한다.\n- <strong>어떻게:<\/strong>\n  - 번들에 넣지 않고 <strong>기능 진입 시점에 `<script>` 주입·동적 import<\/strong>\n  - 로더를 <strong>싱글플라이트<\/strong>(공유 Promise)로 만들어 여러 곳이 동시에 불러도 한 번만 받는다. `import()`는 모듈 단위로 캐시되지만 `<script>` 주입·WASM 초기화는 직접 막아야 한다\n  - 로딩 중·실패 시 UX 정책을 먼저 정한다: 기다릴지, 기능 없이 진행할지(<strong>fail-open/closed<\/strong>)\n  - 무거운 계산은 웹 워커로 옮겨 메인 스레드를 비운다\n- <strong>핵심:<\/strong> 대형 모듈은 <strong>필요한 사람만, 필요한 순간에, 한 번만<\/strong>. 그리고 <strong>로딩 실패 시 정책<\/strong>까지가 설계다.\n- <strong>꼬리질문:<\/strong>\n  - \"로딩이 끝날 때까지 기능을 막으면 되지 않나요?\" → 저사양·느린 망에서 영영 못 쓰는 사용자가 생긴다. 타임아웃 뒤 우회 경로를 열어 둬야 한다.\n- <strong>출처:<\/strong> [import() (MDN)](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/import) · [Lazy loading — Loading External Libraries (Next.js)](https://nextjs.org/docs/app/guides/lazy-loading#loading-external-libraries)\n\n> 한 줄 정리: 분석으로 범인을 찾고, 조건부 기능은 쪼개고, 셰이킹 조건을 지키고, 대형 모듈은 진입 시점에 한 번만.\n\n## 4. 리소스 로딩\n\n### 이미지 최적화 (Image Optimization)\n\n- <strong>뭐야:<\/strong> 이미지를 알맞은 포맷·크기로, 알맞은 시점에 내려주는 작업이다. 같은 그림이라도 화면에 필요한 만큼만 보낸다.\n- <strong>왜:<\/strong> 이미지 많은 목록이 느리고, LCP 요소도 대부분 이미지다. 200px 자리에 2000px 원본이 내려오는 일이 흔하다.\n- <strong>어떻게:<\/strong>\n  - <strong>포맷<\/strong>: 사진은 WebP·AVIF, 도형·아이콘은 SVG. `<picture>`로 AVIF → WebP → JPEG 폴백\n  - <strong>크기<\/strong>: `srcset`(후보 목록) + `sizes`(이 요소의 표시 폭) → 브라우저가 DPR까지 보고 고른다. 기준은 <strong>표시 크기 × DPR<\/strong>\n  - <strong>시점<\/strong>: 화면 밖은 `loading=\"lazy\"`, LCP 이미지는 eager + `fetchpriority=\"high\"`. 처음엔 안 보이는 캐러셀 뒷장은 `fetchpriority=\"low\"`\n  - <strong>자리 예약<\/strong>: `width`/`height`·`aspect-ratio`로 CLS 방지\n  - 디코딩도 비용이다 → `decoding=\"async\"`, 개수 자체를 줄이기\n  - `next/image`가 포맷 변환·`srcset`·lazy를 대신 해준다. 외부 이미지는 `remotePatterns` 등록 필요\n- <strong>핵심:<\/strong> <strong>포맷·크기·시점<\/strong> 세 축 + <strong>자리 예약<\/strong>. LCP 이미지에 lazy는 금지.\n- <strong>꼬리질문:<\/strong>\n  - \"전부 `lazy` 걸면 되나요?\" → 첫 화면 이미지는 늦게 뜬다. 뷰포트 위쪽은 eager + 우선순위.\n  - \"사용자 업로드 이미지는요?\" → 원본은 통제 불가. 업로드 시 리사이즈·변환하거나 이미지 CDN의 URL 파라미터로 변환해 받는다.\n- <strong>출처:<\/strong> [Responsive images (web.dev)](https://web.dev/articles/responsive-images) · [Browser-level image lazy loading (web.dev)](https://web.dev/articles/browser-level-image-lazy-loading) · [Fetch Priority API (web.dev)](https://web.dev/articles/fetch-priority)\n\n### 폰트 로딩 (FOIT·FOUT, font-display, Subset)\n\n- <strong>뭐야:<\/strong> 웹폰트를 받는 동안 글자를 어떻게 보여줄지 정하는 일이다. 안 보이게 기다리면 FOIT, 기본 폰트로 먼저 보여주고 바꾸면 FOUT이고, 이를 `font-display`로 고른다.\n- <strong>왜:<\/strong> 정하지 않으면 글자가 몇 초간 안 보이거나(FOIT), 기본 폰트로 떴다가 웹폰트로 바뀌며 줄바꿈이 튄다(FOUT → CLS). 한글 폰트는 글자 수가 많아 파일이 커서 더 심하다.\n- <strong>어떻게:<\/strong>\n  - <strong>FOIT<\/strong>(Flash of Invisible Text): 폰트 올 때까지 글자를 숨김. <strong>FOUT<\/strong>(Unstyled): 폴백으로 먼저 보여주고 교체\n  - `font-display`: `block`(짧게 숨김 후 교체, 교체 기간 무제한) · `swap`(거의 즉시 폴백, 오면 교체) · `fallback`(아주 짧게 숨김, 교체 기간이 짧아 늦으면 폴백 유지) · `optional`(아주 짧게 숨김, 교체 기간 없음 → 그 안에 못 오면 그 페이지에선 폴백 유지, CLS 최소)\n  - <strong>woff2<\/strong>(WOFF보다 약 30% 더 압축), 한글은 <strong>서브셋<\/strong>(쓰는 글자만) 또는 `unicode-range` 분할로 필요한 조각만 받는다\n  - 첫 화면 폰트는 `preload`(`as=\"font\"` + `crossorigin` 필수, 같은 오리진이어도), 폴백 폰트는 `size-adjust`로 메트릭을 맞춰 교체 이동을 줄인다. 단 preload는 다른 핵심 리소스의 대역폭을 뺏으니 아껴 쓴다\n  - `next/font`는 셀프호스팅·preload·폴백 메트릭 조정을 자동으로 해준다\n- <strong>핵심:<\/strong> 보여주기 vs 안정성의 교환. 본문은 <strong>swap<\/strong>, 레이아웃 민감하면 <strong>optional<\/strong>, 한글은 <strong>서브셋·unicode-range<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"폰트 preload에 crossorigin은 왜 붙이나요?\" → 폰트는 스펙상 익명 CORS 모드로 가져오기 때문에, preload 요청의 모드가 다르면 실제 폰트 요청과 맞지 않아 preload가 쓸모없어진다.\n  - \"외부 폰트 CDN 대신 셀프호스팅은 왜?\" → 다른 오리진 연결이 하나 줄고, 주의: Chrome 86부터 HTTP 캐시가 최상위 사이트별로 나뉘어(cache partitioning) \"다른 사이트에서 이미 받아 둔 CDN 폰트\" 이점이 사라졌다. 플랫폼별 폰트 차이도 통제할 수 있다. 대신 CDN·HTTP/2 같은 전송 환경은 직접 갖춰야 한다.\n- <strong>출처:<\/strong> [Best practices for fonts (web.dev)](https://web.dev/articles/font-best-practices) · [font-display (MDN)](https://developer.mozilla.org/en-US/docs/Web/CSS/@font-face/font-display) · [Gaining security and privacy by partitioning the cache (Chrome)](https://developer.chrome.com/blog/http-cache-partitioning)\n\n### 리소스 힌트 (preload·prefetch·preconnect)\n\n- <strong>뭐야:<\/strong> 브라우저에게 \"이 연결·파일이 곧 필요하다\"고 미리 알려주는 `<link>` 힌트다. preconnect는 연결을, preload는 지금 페이지의 파일을, prefetch는 다음 페이지의 파일을 앞당긴다.\n- <strong>왜:<\/strong> HTML에 없고 CSS·JS 안에서만 참조되는 LCP 이미지·폰트는 그 파일을 받아 해석한 뒤에야 발견된다. 다음 화면의 리소스도 힌트가 없으면 이동한 뒤에야 받기 시작한다.\n- <strong>어떻게:<\/strong>\n  - `preconnect`: 곧 쓸 <strong>다른 오리진<\/strong>에 DNS·TCP·TLS를 미리 연결. 10초 안에 안 쓰면 브라우저가 닫으니 <strong>바로 쓸 핵심 오리진 몇 개만<\/strong>. 폰트 오리진엔 `crossorigin`. `dns-prefetch`는 DNS만\n  - `preload`: <strong>지금 페이지<\/strong>에서 곧 필요한데 늦게 발견되는 리소스를 높은 우선순위로 당김. 힌트가 아니라 <strong>반드시 받는 요청<\/strong>이고 `as` 속성 필수\n  - `prefetch`: <strong>다음 페이지<\/strong>에 쓸 리소스를 유휴 시간에 낮은 우선순위로 받아 캐시\n  - `fetchpriority=\"high|low|auto\"`: 발견 시점은 그대로 두고 <strong>우선순위만<\/strong> 올리거나 내린다. preload(발견 앞당기기)와 짝으로 쓴다. 주의: web.dev 기준 Chrome 102·Safari 17.2·Firefox 132부터 지원\n  - Next.js `<Link>`는 뷰포트에 들어온 링크의 라우트를 프리페치한다. 주의: Next.js 16 문서 기준 <strong>프로덕션에서만<\/strong> 동작하고, 기본값(`auto`)은 정적 라우트면 전체, 동적 라우트면 가장 가까운 `loading.js` 경계까지만 받는다\n- <strong>핵심:<\/strong> <strong>preconnect=연결<\/strong>, <strong>preload=지금 페이지 발견 앞당김<\/strong>, <strong>prefetch=다음 페이지 미리<\/strong>. preload 남발은 진짜 중요한 것과 대역폭을 다툰다.\n- <strong>꼬리질문:<\/strong>\n  - \"다 preload하면 안 되나요?\" → 우선순위가 다 높으면 아무것도 우선이 아니다. LCP·첫 화면 폰트처럼 <strong>늦게 발견되는 핵심 1~2개<\/strong>만.\n  - \"모바일 데이터 사용자에게 prefetch는?\" → 안 갈 수도 있는 페이지 데이터를 쓴다. 데이터 절약 모드(`navigator.connection.saveData`)를 보고 끄기도 한다.\n  - \"preload와 fetchpriority 차이는?\" → preload는 <strong>발견<\/strong>을 앞당기고(HTML에 없던 리소스를 일찍 요청), fetchpriority는 이미 발견된 리소스의 <strong>순서<\/strong>를 바꾼다. HTML `<img>`에 있는 LCP 이미지는 fetchpriority만으로 충분한 경우가 많다.\n- <strong>출처:<\/strong> [Establish network connections early (web.dev)](https://web.dev/articles/preconnect-and-dns-prefetch) · [Fetch Priority API (web.dev)](https://web.dev/articles/fetch-priority) · [Link — prefetch (Next.js)](https://nextjs.org/docs/app/api-reference/components/link#prefetch)\n\n### 캐시로 재요청 줄이기 (HTTP Cache, Query Cache)\n\n- <strong>뭐야:<\/strong> 한 번 받은 응답을 저장해 두고 다시 쓰는 것이다. 브라우저 HTTP 캐시와 TanStack Query 같은 쿼리 캐시 두 층이 있다.\n- <strong>왜:<\/strong> 캐시를 안 쓰면 잘 바뀌지 않는 데이터인데도 탭을 오갈 때마다 같은 목록을 다시 받고 로딩 스피너가 뜬다.\n- <strong>어떻게:<\/strong>\n  - <strong>HTTP 캐시<\/strong>: 해시 파일명 정적 자산은 `Cache-Control: max-age=31536000`(`immutable`은 선택, 지원 브라우저 한정), HTML은 `no-cache`(저장은 하되 매번 재검증, `no-store`와 다름) — 배포 즉시 반영과 장기 캐시를 동시에(헤더 상세는 6파트 참고)\n  - <strong>클라이언트 캐시(TanStack Query)<\/strong>: `staleTime`(신선 기간, 이 동안 재요청 안 함, 기본 0)과 `gcTime`(안 쓰는 캐시 보관 시간, 기본 5분)을 <strong>도메인 성격별로<\/strong> 다르게(5파트 참고)\n  - 신선도 낮은 화면은 <strong>stale-while-revalidate<\/strong>: 캐시를 바로 보여주고 뒤에서 갱신 → 재방문 로딩 화면 제거\n  - 독립 조회는 <strong>병렬로<\/strong>(워터폴 제거), 실시간성이 필요한 조회는 예외로 짧게\n- <strong>핵심:<\/strong> 캐시 시간은 기술이 아니라 <strong>데이터가 얼마나 자주 바뀌는가<\/strong>로 정한다. `staleTime` 기본값 0은 \"매번 다시 확인\"이다.\n- <strong>꼬리질문:<\/strong>\n  - \"캐시를 길게 잡으면 대가는?\" → 다른 사용자가 바꾼 값을 늦게 본다. 변경 직후엔 mutation에서 <strong>도메인 루트 키 무효화<\/strong>로 보완한다(5파트 참고).\n- <strong>출처:<\/strong> [Prevent unnecessary network requests with the HTTP Cache (web.dev)](https://web.dev/articles/http-cache) · [Important Defaults (TanStack Query)](https://tanstack.com/query/latest/docs/framework/react/guides/important-defaults)\n\n> 한 줄 정리: 이미지는 포맷·크기·시점, 폰트는 swap·서브셋, 힌트는 핵심 1~2개만, 재요청은 도메인별 캐시로.\n\n## 5. 런타임 성능\n\n### 긴 리스트 가상화 (List Virtualization)\n\n- <strong>뭐야:<\/strong> 긴 목록에서 지금 화면에 보이는 행만 DOM으로 그리고, 스크롤에 따라 그 행들을 바꿔 끼우는 기법이다.\n- <strong>왜:<\/strong> 수백~수천 행 목록·채팅을 전부 그리면 스크롤이 끊기고 입력이 굼뜨다. DOM 노드 수 자체가 레이아웃·페인트 비용이다.\n- <strong>어떻게:<\/strong>\n  - 스크롤 위치로 <strong>보이는 인덱스 범위 + overscan<\/strong>만 렌더하고, 나머지 높이는 spacer로 채워 스크롤바 길이 유지\n  - 라이브러리: `@tanstack/react-virtual`(마크업을 직접 쥐는 headless 방식), `react-window`. overscan은 빠른 스크롤 때 빈칸이 비치는 걸 막지만 많이 잡을수록 이득이 줄어든다\n  - 가변 높이: <strong>추정 높이로 먼저 그리고 측정 후 보정<\/strong>. 이미지가 늦게 로드되면 다시 튄다\n  - 채팅처럼 위로 과거를 붙이면 붙기 전 `scrollHeight`를 재고 차이만큼 `scrollTop` 보정\n  - 그 전에: <strong>한 번에 다 안 받기<\/strong>(커서 페이지네이션)와 <strong>행 리렌더 범위<\/strong>부터\n- <strong>핵심:<\/strong> 순서는 <strong>덜 받기(페이지네이션) → 행 리렌더 줄이기 → 가상화<\/strong>. 가상화는 DOM 수 문제의 해법이지 데이터 양 문제의 해법이 아니다.\n- <strong>꼬리질문:<\/strong>\n  - \"가상화의 대가는?\" → 브라우저 `Ctrl+F` 검색에 화면 밖 항목이 안 걸리고, 스크린리더가 전체 개수를 모르며, 앵커 이동·가변 높이 처리가 복잡해진다.\n  - \"몇 개부터 가상화하나요?\" → 정해진 숫자보다 저사양 기기에서 측정해 프레임이 떨어질 때. 페이지네이션으로 DOM 수가 관리되면 필요 없을 수 있다.\n- <strong>출처:<\/strong> [Virtualize large lists with react-window (web.dev)](https://web.dev/articles/virtualize-long-lists-react-window) · [TanStack Virtual — Introduction](https://tanstack.com/virtual/latest/docs/introduction)\n\n### 리렌더 줄이기 순서 (Measure → Scope → Memo)\n\n- <strong>뭐야:<\/strong> 불필요한 리렌더를 줄일 때 측정 → 상태 범위 좁히기 → memo 순서로 접근하는 방법이다. memo부터 손대지 않는다는 원칙이다.\n- <strong>왜:<\/strong> 순서 없이 가면 입력 한 글자에 화면 전체가 리렌더되는데, 원인(상태 위치·불안정한 props)을 그대로 두고 `useMemo`·`useCallback`을 도배하면 잘 나아지지 않는다.\n- <strong>어떻게:<\/strong>\n  - 1) <strong>측정<\/strong>: Profiler로 정말 리렌더가 원인인지, 어느 컴포넌트가 비싼지 확인\n  - 2) <strong>범위 줄이기<\/strong>: 상태를 쓰는 곳 가까이로 <strong>내리기<\/strong>(state colocation), 바뀌는 부분을 자식으로 분리, `children`으로 넘겨 리렌더 경계 밖에 두기, Context를 값 단위로 쪼개기\n  - 3) <strong>구독 좁히기<\/strong>: TanStack Query `select`, 스토어 셀렉터로 필요한 조각만 구독\n  - 4) 그래도 비싸면 <strong>memo<\/strong>: `React.memo` + 안정적인 props(`useCallback`·`useMemo`)를 <strong>같이<\/strong>\n  - 렌더 중 레이아웃 측정(`getBoundingClientRect`)은 리렌더마다 레이아웃을 강제한다 → 레이아웃이 바뀔 때만 재기\n  - 주의: React Compiler 1.0(2025-10-07 정식 출시, React 17 이상 지원·19는 별도 런타임 불필요)을 켜면 빌드 시 자동 메모이제이션이 들어가 수동 memo 필요가 줄어든다. 조건부 return 뒤 값처럼 `useMemo`로는 못 거는 곳도 메모한다\n- <strong>핵심:<\/strong> <strong>측정 → 범위 → memo<\/strong> 순서. memo는 props가 <strong>참조적으로 안정<\/strong>할 때만 효과가 있다.\n- <strong>꼬리질문:<\/strong>\n  - \"`React.memo`가 안 먹는 경우는?\" → 매 렌더 새 객체·인라인 함수·`children` JSX가 props로 내려갈 때. 얕은 비교가 항상 실패한다.\n  - \"memo를 전부 걸면 대가는?\" → 비교 비용과 메모리, 그리고 의존성 배열 관리 부담. 싼 컴포넌트는 그냥 다시 그리는 게 빠르다.\n- <strong>출처:<\/strong> [React Compiler v1.0 (react.dev, 2025-10-07)](https://react.dev/blog/2025/10/07/react-compiler-1) · [Profiler (react.dev)](https://react.dev/reference/react/Profiler)\n\n### 메모리 누수 찾기 (Heap Snapshot)\n\n- <strong>뭐야:<\/strong> 힙 스냅샷은 특정 순간의 JS 메모리에 무엇이 남아 있는지 찍은 사진이다. 여러 장을 비교해, 해제돼야 할 객체를 누가 붙잡고 있는지 찾는다.\n- <strong>왜:<\/strong> 누수를 못 찾으면 키오스크·대시보드처럼 오래 켜 두는 화면이 몇 시간 뒤 느려지거나 웹뷰가 죽는다. 화면을 오갈수록 메모리가 계단식으로 오른다.\n- <strong>어떻게:<\/strong>\n  - Memory 탭 <strong>힙 스냅샷 3장 비교<\/strong>: 기준 → 동작 반복(화면 열고 닫기 N회) → GC 후 다시 찍기. 반복 횟수만큼 늘어난 객체가 범인 후보\n  - <strong>Detached DOM<\/strong>(문서에서 떨어졌는데 JS가 참조 중인 노드) 필터로 검색, Retainers 패널로 \"누가 붙잡고 있나\" 추적\n  - Performance 탭 Memory 체크박스로 JS 힙·노드 수 추세 확인(GC 뒤에도 시작보다 높게 끝나는 계단 모양은 누수 의심, 지나치게 잦은 오르내림은 잦은 GC 신호)\n  - 흔한 원인: 해제 안 한 `addEventListener`·`setInterval`·소켓 구독·`ResizeObserver`, 모듈 전역 캐시·Map에 계속 쌓기, 클로저가 큰 객체 캡처\n  - React는 `useEffect` cleanup에서 해제, 비동기 작업은 `AbortController`로 언마운트 시 취소\n- <strong>핵심:<\/strong> <strong>스냅샷 비교 + Retainers<\/strong>로 붙잡는 참조를 찾는다. 원인 대부분은 <strong>cleanup 누락<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"`WeakMap`을 쓰면 해결되나요?\" → 키 객체 수명에 캐시를 묶고 싶을 때만. 키는 객체(또는 등록 안 된 심볼)만 되고, 키 객체를 다른 곳이 계속 참조하면 항목도 남는다. 값이 키를 참조하는 것은 수거를 막지 않는다.\n  - \"언마운트 후 setState 경고가 사라졌던데요?\" → React 18이 그 경고를 지웠다. 정작 문제없는 상황에서 주로 떠서 우회 코드만 늘렸기 때문이고, 안 끊은 구독·타이머는 여전히 누수다.\n- <strong>출처:<\/strong> [Fix memory problems (Chrome DevTools)](https://developer.chrome.com/docs/devtools/memory-problems) · [How to Upgrade to React 18 (react.dev)](https://react.dev/blog/2022/03/08/react-18-upgrade-guide)\n\n### 웹뷰 환경 성능 특이점 (WebView)\n\n- <strong>뭐야:<\/strong> 웹뷰는 네이티브 앱 안에 끼워 넣은 브라우저 화면이다. iOS는 엔진부터 다르고(WebKit), 기기 사양·앱과의 브릿지도 데스크톱 Chrome과 달라 성능 특성이 다르다.\n- <strong>왜:<\/strong> 이 차이를 모르면 데스크톱 Chrome에선 멀쩡한데 앱 안 웹뷰에서만 느리거나, 브라우저 기능(다운로드·권한)이 조용히 안 되는 문제를 놓친다.\n- <strong>어떻게:<\/strong>\n  - 엔진이 다르다: iOS는 WKWebView(WebKit), Android는 시스템 WebView(Chromium 계열). Safari에서 안 되는 건 iOS 앱에서도 안 된다\n  - 저사양 안드로이드 비중이 높아 <strong>CPU 스로틀링 기준<\/strong>으로 측정해야 한다\n  - 앱 콜드 스타트 + 웹뷰 초기화 + 웹 로딩이 겹친다 → 첫 화면 리소스를 더 공격적으로 줄인다\n  - CrUX는 데스크톱·Android Chrome(Custom Tabs 포함) 사용자만 모은다. 주의: CrUX 방법론 문서(2026-10 확인)상 <strong>Android 앱의 WebView와 iOS의 Chrome은 제외<\/strong>라 앱 웹뷰 트래픽은 CrUX에 안 잡힌다 → `web-vitals`로 직접 수집한다. iOS WKWebView에선 `onCLS`가 보고되지 않는 점도 감안한다\n  - <strong>브릿지 호출은 비동기·실패 가능<\/strong>: 구버전 앱이 응답 안 하면 영원히 기다린다 → 타임아웃·폴백 필수\n- <strong>핵심:<\/strong> 웹뷰는 <strong>다른 엔진·저사양·브릿지 의존<\/strong>. 브릿지 호출엔 항상 <strong>타임아웃과 폴백<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"앱 버전과 웹 버전이 어긋나면?\" → 웹은 즉시 배포되지만 앱은 사용자가 업데이트해야 한다. 브릿지 기능은 지원 여부 확인 → 실패 시 웹 폴백으로 설계한다.\n- <strong>출처:<\/strong> [CrUX methodology (Chrome)](https://developer.chrome.com/docs/crux/methodology) · [web-vitals 라이브러리 — Browser Support (GitHub)](https://github.com/GoogleChrome/web-vitals)\n\n> 한 줄 정리: 리스트는 덜 받고 덜 그리고, 리렌더는 측정 후 범위부터, 누수는 스냅샷 비교, 웹뷰는 타임아웃·폴백.\n\n## 6. 체감 성능과 성능 유지\n\n### 체감 성능과 스켈레톤 (Perceived Performance)\n\n- <strong>뭐야:<\/strong> 실제 로딩 시간과 별개로 사용자가 느끼는 빠르기다. 스켈레톤은 내용이 올 자리에 같은 크기의 회색 틀을 먼저 그려 두는 자리표시 UI다.\n- <strong>왜:<\/strong> 실제 로딩 시간이 같아도 어떤 화면은 \"빠르다\", 어떤 화면은 \"멈췄다\"는 말을 듣는다. 버튼을 눌러도 아무 표시가 없으면 사용자가 연타한다.\n- <strong>어떻게:<\/strong>\n  - <strong>즉시 피드백<\/strong>: 누른 순간 눌림 상태·스피너·낙관적 갱신(5파트 참고)부터 그린다. 무거운 일은 그 뒤에(INP 참고)\n  - <strong>점진 표시<\/strong>: 텍스트 먼저, 이미지 나중. 스켈레톤은 실제 콘텐츠와 <strong>같은 크기<\/strong>로 자리를 잡아야 교체 때 CLS가 안 생긴다\n  - <strong>흔들림 제거<\/strong>: 늦게 오는 광고·이미지·폰트의 자리를 예약하고, 폴백 폰트 크기를 웹폰트에 맞춘다\n  - <strong>먼저 시작하기<\/strong>: 다음 행동을 예측해 미리 요청(hover 프리페치, 입력 이벤트를 `keyup`보다 이른 `keydown`에서 시작)\n- <strong>핵심:<\/strong> 체감 성능은 <strong>기다리는 동안 무엇을 보여주나<\/strong>의 문제. <strong>즉시 피드백 + 같은 크기의 자리표시 + 흔들림 없음<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"스켈레톤이 스피너보다 항상 낫나요?\" → 화면 구조가 예측 가능할 때만. 결과 모양을 모르는 검색·짧은 작업엔 스피너나 진행 표시가 정직하다. 스켈레톤과 실제 모양이 다르면 오히려 레이아웃 이동이 생긴다.\n  - \"체감만 좋게 하면 지표는요?\" → 스켈레톤은 실제 콘텐츠가 뜨는 시점을 앞당기지 않으니, LCP 요소가 실제 콘텐츠라면 LCP는 그대로다. 체감과 지표를 둘 다 본다.\n- <strong>출처:<\/strong> [Perceived performance (MDN)](https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Performance/Perceived_performance)\n\n### 뒤로·앞으로 캐시 (bfcache)\n\n- <strong>뭐야:<\/strong> 브라우저가 떠나는 페이지를 JS 실행만 멈춘 채 메모리에 통째로 보관했다가, 뒤로·앞으로 이동 때 그대로 되살리는 캐시다.\n- <strong>왜:<\/strong> bfcache가 막히면 다른 페이지로 갔다가 뒤로가기할 때 페이지를 처음부터 다시 받아 실행하고, 비동기로 그리는 목록은 스크롤 위치 복원도 어긋나기 쉽다. 단 SPA 안의 클라이언트 라우팅 이동은 bfcache 대상이 아니다. 같은 사이트인데 어떤 페이지는 뒤로가기가 즉시인 이유가 이것이다.\n- <strong>어떻게:<\/strong>\n  - 브라우저가 떠나는 페이지의 JS 실행을 멈춘 채 <strong>메모리에 통째로 보관<\/strong>했다가 뒤로·앞으로 이동 때 그대로 되살린다.\n  - 막는 것: <strong>`unload` 리스너<\/strong>(가장 큰 원인, `pagehide`로 바꾼다 — 1파트 참고), HTML의 `Cache-Control: no-store`(주의: web.dev 기준 Chrome이 이 조건 완화 작업 중), 열린 IndexedDB·WebSocket·진행 중 fetch, `window.opener` 참조\n  - 복원 감지: `pageshow` 이벤트의 `event.persisted === true` → 오래된 데이터 갱신·세션 재확인\n  - 진단: DevTools <strong>Application → Back/forward cache<\/strong>, `NotRestoredReasons` API\n- <strong>핵심:<\/strong> bfcache는 <strong>공짜 즉시 로딩<\/strong>. 막는 건 대부분 <strong>`unload`·`no-store`·열린 연결<\/strong>이고, 복원은 `pageshow.persisted`로 안다.\n- <strong>꼬리질문:<\/strong>\n  - \"복원된 페이지에 로그아웃 전 화면이 남으면요?\" → `pageshow`에서 `persisted`면 세션을 다시 확인하고 민감 화면은 갱신·리다이렉트한다. 무조건 `no-store`로 막으면 모든 사용자가 즉시 복원을 잃는다.\n  - \"bfcache가 늘면 지표가 나빠질 수 있다던데?\" → 빠른 재방문이 일반 로드 통계에서 빠져 분포가 느려 보일 수 있다. 복원은 별도 방문으로 보고 INP·CLS를 0부터 다시 잰다.\n- <strong>출처:<\/strong> [Back/forward cache (web.dev)](https://web.dev/articles/bfcache)\n\n### 성능 예산 (Performance Budget)\n\n- <strong>뭐야:<\/strong> 번들 크기·지표 같은 성능 값에 넘으면 안 되는 한도를 숫자로 정해 두는 것이다. 넘으면 새 기능을 넣기 전에 다른 것을 줄이거나 넣지 않는다.\n- <strong>왜:<\/strong> 한도가 없으면 한 번 최적화해 놓은 첫 화면이 기능이 붙을 때마다 조금씩 무거워져, 석 달 뒤 원래대로 돌아와 있다. 어느 변경이 늘렸는지 뒤늦게 추적하기 어렵다.\n- <strong>어떻게:<\/strong>\n  - 넘으면 안 되는 <strong>한도<\/strong>를 숫자로 정해 둔다. 종류는 셋: <strong>양<\/strong>(JS·이미지 KB, 요청 수, 폰트 개수) / <strong>시점<\/strong>(FCP·LCP 같은 사용자 중심 지표) / <strong>규칙<\/strong>(Lighthouse 점수)\n  - 양 기반은 소통이 쉽지만 체감과 직접 연결되진 않는다 → 시점 지표 예산과 같이 건다\n  - CI에 묶는다: `size-limit`·`bundlesize`로 번들 KB, Lighthouse CI로 지표·점수. 넘으면 PR이 실패\n  - 넘었을 때 선택지: 기존 기능을 최적화하거나, 다른 걸 빼거나, 새 기능을 넣지 않는다\n- <strong>핵심:<\/strong> 최적화는 한 번, <strong>예산은 계속<\/strong>. <strong>양·시점·규칙<\/strong> 세 종류를 CI에서 강제해야 회귀가 PR 단계에서 잡힌다.\n- <strong>꼬리질문:<\/strong>\n  - \"예산 숫자는 어떻게 정하나요?\" → 현재 실측값과 경쟁 서비스·목표 기기(저사양 안드로이드 등)에서 출발한다. 처음부터 이상값을 박으면 모든 PR이 빨개져 아무도 안 본다 — 현재 값으로 고정해 회귀부터 막고 점점 조인다.\n- <strong>출처:<\/strong> [Performance budgets 101 (web.dev)](https://web.dev/articles/performance-budgets-101)\n\n> 한 줄 정리: 기다림은 즉시 피드백과 같은 크기의 자리표시로 덜 느끼게, 뒤로가기는 bfcache로 공짜로, 지켜 낸 성능은 예산으로 CI에서 강제한다.\n\n## 핵심 키워드 모음\n\n- <strong>랩 vs 필드<\/strong>: 판정은 필드 p75(모바일·데스크톱 분리), 원인 추적은 랩. 랩 INP 대리 지표는 TBT지만 대체물은 아니다.\n- <strong>Performance 탭<\/strong>: 50ms 넘는 롱 태스크(빨간 삼각형·빗금), 노랑=스크립트·보라=레이아웃, Interactions 트랙, CPU 스로틀링, `scheduler.yield()`는 폴백과 함께.\n- <strong>React Profiler<\/strong>: 무엇이 왜 다시 렌더됐나. \"why rendered\" 옵션, `actualDuration` vs `baseDuration`, 주의: React 19.2 Performance Tracks, 프로덕션 측정은 profiling 빌드.\n- <strong>LCP<\/strong>: ≤2.5s·>4s, TTFB·발견·다운로드·렌더 지연 4조각. LCP 이미지에 lazy 금지, `fetchpriority=\"high\"`. 저정보량 자리표시 이미지는 후보 제외.\n- <strong>INP<\/strong>: 주의: 2024-03-12 FID 대체, ≤200ms·>500ms, 클릭·탭·키만, 50회당 최악 1개 제외. 입력 지연·처리·표시 지연. 피드백 먼저, 무거운 일 뒤로.\n- <strong>CLS<\/strong>: ≤0.1·>0.25, 세션 창(1초 간격·최대 5초) 최대 묶음, 입력 후 0.5초 제외, 자리 예약·`transform` 애니메이션.\n- <strong>TTFB·FCP<\/strong>: CWV 아닌 진단 지표. TTFB ≤0.8s, FCP ≤1.8s. TTFB→FCP→LCP 간격으로 늦는 구간을 가른다.\n- <strong>번들 분석<\/strong>: 트리맵으로 공용 청크·중복 버전 확인, parsed vs gzip 구분, 변환 전용 라이브러리는 서버 컴포넌트로.\n- <strong>코드 스플리팅<\/strong>: 총량이 아니라 비용 내는 사람을 바꾼다. 조건부 기능 1순위.\n- <strong>트리 셰이킹<\/strong>: ESM + `sideEffects`(CSS 예외) + 정적 분석 + production 빌드. 배럴 파일 주의, `optimizePackageImports`는 실험 옵션.\n- <strong>대형 모듈·WASM<\/strong>: 진입 시점·싱글플라이트·실패 정책(fail-open/closed).\n- <strong>이미지<\/strong>: 포맷·크기·시점 + 자리 예약, `srcset`/`sizes`, 디코딩 비용.\n- <strong>폰트<\/strong>: FOIT/FOUT, `font-display` swap/optional, woff2·서브셋·`unicode-range`, preload엔 crossorigin.\n- <strong>리소스 힌트<\/strong>: preconnect=연결(10초 안 쓰면 닫힘), preload=발견 앞당김(필수 요청), prefetch=다음 페이지, fetchpriority=순서만 조정. Next `<Link>` 프리페치는 프로덕션만.\n- <strong>캐시<\/strong>: 해시 자산 1년 장기 캐시·HTML 재검증, `staleTime`은 도메인 성격으로, SWR로 재방문 로딩 제거.\n- <strong>가상화<\/strong>: 덜 받기 → 리렌더 범위 → 가상화. 대가는 검색·접근성·가변 높이.\n- <strong>리렌더 줄이기<\/strong>: 측정 → 범위(내리기·children·구독 좁히기) → memo + 안정 props.\n- <strong>메모리 누수<\/strong>: 힙 스냅샷 3장 비교, Detached DOM, Retainers, cleanup·`AbortController`.\n- <strong>웹뷰<\/strong>: WKWebView·Android WebView, 저사양 기준 측정, 브릿지 타임아웃·폴백, CrUX가 WebView를 제외하니 필드 수집은 직접.\n- <strong>체감 성능<\/strong>: 즉시 피드백, 같은 크기 스켈레톤, 흔들림 제거, 예측 요청. 스켈레톤은 실제 콘텐츠 표시(LCP)를 앞당기지 않는다.\n- <strong>bfcache<\/strong>: 뒤로·앞으로 즉시 복원. `unload`·`no-store`·열린 연결이 막는다, `pageshow.persisted`로 감지.\n- <strong>성능 예산<\/strong>: 양·시점·규칙 세 종류, CI(size-limit·Lighthouse CI)로 강제, 현재 값으로 고정 후 조인다.\n"}, {"id": "n08", "num": "8", "title": "설계와 코드 품질", "md": "# 8. 설계와 코드 품질\n\n<strong>이 파트는 뭐냐:<\/strong> 코드가 \"돌아간다\" 다음 단계 — 계약을 타입으로 강제하고, 로직을 테스트 가능한 자리로 빼고, 의존 방향을 지키고, 실패를 사용자에게 정직하게 보여주는 영역. 한 줄로: <strong>바뀔 때 어디가 깨지는지 컴파일러·테스트·경계 검사가 먼저 알려주게 만드는 것.<\/strong>\n\n## 1. TypeScript로 계약 강제하기\n\n### unknown vs any\n\n- <strong>뭐야:<\/strong> 둘 다 \"어떤 값이든 올 수 있다\"는 TS 타입이다. `any`는 타입 검사를 꺼 버리고, `unknown`은 값을 쓰기 전에 무엇인지 확인하도록 강제한다.\n- <strong>왜:<\/strong> API 응답·`JSON.parse`·`catch (e)`처럼 타입을 모르는 값을 `any`로 받으면, 그 뒤 모든 사용처에서 타입 검사가 꺼진 채 퍼진다. 그 결과가 런타임 `undefined` 크래시로 돌아오기 쉽다.\n- <strong>어떻게:<\/strong>\n  - `any`: 검사를 <strong>끈다<\/strong>. 어떤 속성 접근·대입도 허용되고 전염된다(any 값에서 꺼낸 속성도 any)\n  - `unknown`: \"뭔지 모름\"을 <strong>정직하게<\/strong> 표현. 그대로는 아무것도 못 하고, <strong>좁힌 뒤에만<\/strong> 쓸 수 있다\n  - `catch (e)`의 `e`는 주의: TS 4.4에서 생긴 `useUnknownInCatchVariables`(`strict`에 포함)를 켜면 `any`가 아니라 `unknown`\n  - 경계(네트워크·스토리지·브릿지)는 `unknown`으로 받고 검증 함수로 좁힌다\n- <strong>핵심:<\/strong> `any`는 검사를 <strong>끄고 전염<\/strong>, `unknown`은 <strong>좁히기를 강제<\/strong>. 외부 입력은 `unknown`.\n- <strong>꼬리질문:<\/strong>\n  - \"`any`를 써도 되는 순간은?\" → 타입 정의가 없는 라이브러리를 감싸는 얇은 어댑터 내부 정도. 밖으로는 좁힌 타입만 내보낸다.\n  - \"`Record<string, unknown>`과 `object`의 차이는?\" → 전자는 임의 키 접근이 되고 값이 unknown, `object`는 원시값이 아니라는 것만 보장해 속성 접근이 막힌다.\n- <strong>출처:<\/strong> [useUnknownInCatchVariables (TSConfig Reference)](https://www.typescriptlang.org/tsconfig/#useUnknownInCatchVariables) · [Narrowing (TypeScript Handbook)](https://www.typescriptlang.org/docs/handbook/2/narrowing.html)\n\n### 타입 좁히기와 판별 유니온 (Narrowing, Discriminated Union)\n\n- <strong>뭐야:<\/strong> 좁히기는 `typeof`·비교 같은 검사를 거친 뒤 TS가 값의 타입을 더 구체적으로 알아듣는 것이다. 판별 유니온은 `kind`·`status` 같은 공통 필드 값으로 상태를 나눈 유니온 타입이다.\n- <strong>왜:<\/strong> `{ status: string; data?: T; error?: E }` 같은 타입이면 \"성공인데 error가 있는\" 불가능한 상태가 타입상 허용된다. 그래서 화면마다 `data &&`·`error &&`를 뒤죽박죽 검사한다.\n- <strong>어떻게:<\/strong>\n  - 좁히기 수단: `typeof`·`instanceof`·`in`·동등 비교·사용자 정의 타입 가드(`x is T`)·`asserts x is T`\n  - <strong>판별 유니온<\/strong>: 공통 리터럴 필드(`kind`·`status`)로 상태를 나눠 <strong>불가능한 조합을 타입에서 제거<\/strong>\n  - `switch`의 `default`에서 `never`에 대입해 <strong>완전성 검사<\/strong> → 새 상태를 추가하면 처리 안 한 곳이 컴파일 에러\n  - 비교 대상은 <strong>문자열 리터럴 유니온<\/strong>(서버 원본 값)으로, 화면 문구와 분리\n  ```ts\n  type Load<T> =\n    | { status: \"loading\" }\n    | { status: \"error\"; error: Error }\n    | { status: \"success\"; data: T };\n  function assertNever(x: never): never { throw new Error(String(x)); }\n  ```\n- <strong>핵심:<\/strong> 판별 유니온은 <strong>불가능한 상태를 표현 불가능하게<\/strong> 만든다. `never` 완전성 검사로 <strong>추가 누락을 컴파일러가 잡게<\/strong> 한다.\n- <strong>꼬리질문:<\/strong>\n  - \"사용자 정의 타입 가드의 위험은?\" → `x is T`는 컴파일러가 <strong>믿기만<\/strong> 한다. 가드 구현이 틀리면 `as`와 똑같이 거짓말이 된다. 가드 자체를 테스트한다.\n  - \"enum 대신 리터럴 유니온을 쓰는 이유는?\" → 런타임 코드가 안 생기고 서버 문자열과 바로 비교된다. 이름 붙은 상수가 필요하면 `as const` 객체(TS 핸드북의 대안). 배포된 ambient `const enum`은 `isolatedModules`와 못 쓴다.\n- <strong>출처:<\/strong> [Narrowing — Discriminated unions·Exhaustiveness checking (TypeScript Handbook)](https://www.typescriptlang.org/docs/handbook/2/narrowing.html) · [Enums — Objects vs Enums (TypeScript Handbook)](https://www.typescriptlang.org/docs/handbook/enums.html)\n\n### 제네릭 기본 (Generics)\n\n- <strong>뭐야:<\/strong> 타입을 매개변수처럼 받는 문법이다. 함수·컴포넌트를 한 번 만들고, 입력과 출력 타입의 관계를 유지한 채 여러 타입에 쓴다.\n- <strong>왜:<\/strong> 제네릭이 없으면 목록 훅·테이블 컴포넌트를 도메인마다 복사하거나, 공용으로 만들면서 `any[]`로 받아 타입이 사라진다.\n- <strong>어떻게:<\/strong>\n  - 제네릭은 <strong>입력과 출력 타입의 관계<\/strong>를 표현한다: `function first<T>(xs: T[]): T | undefined`\n  - <strong>제약<\/strong>(`T extends { id: string }`)으로 필요한 최소 모양만 요구\n  - 호출부에서 보통 <strong>추론<\/strong>되게 설계. 명시해야만 쓸 수 있으면 설계를 의심\n  - 유틸리티 타입: `Pick`·`Omit`·`Partial`·`ReturnType`·`Awaited`, 조건부 타입·`infer`는 필요할 때만\n  - 공용 컴포넌트: `<Table<Row>>`처럼 행 타입이 컬럼 정의·렌더 함수까지 흐르게\n- <strong>핵심:<\/strong> 제네릭은 <strong>\"아무거나\"가 아니라 \"들어온 타입을 그대로 나가게\"<\/strong>. <strong>제약은 최소, 추론은 최대<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"제네릭이 과하면?\" → 조건부 타입이 겹겹이 쌓이면 에러 메시지가 읽히지 않고 컴파일도 느려진다. 호출부 2~3곳이면 구체 타입이 나을 때가 많다.\n- <strong>출처:<\/strong> [Generics (TypeScript Handbook)](https://www.typescriptlang.org/docs/handbook/2/generics.html)\n\n### as 캐스팅이 숨기는 계약 위반 (Type Assertion)\n\n- <strong>뭐야:<\/strong> `as`는 값을 바꾸지 않고 컴파일러에게 \"이 값은 이 타입이라고 믿어라\"라고 선언하는 문법이다.\n- <strong>왜:<\/strong> 응답 타입이 안 맞아 빨간 줄이 뜨자 `as Foo`로 덮으면, 백엔드가 필드를 바꿔도 컴파일은 통과하고 운영에서 터진다.\n- <strong>어떻게:<\/strong>\n  - `as`는 <strong>변환이 아니라 \"내 말을 믿어\"<\/strong> 선언. 런타임엔 아무것도 하지 않는다\n  - `as unknown as T` 이중 캐스팅은 사실상 검사 해제\n  - 대안: 타입을 <strong>실제 계약(배포 스펙)에 맞게 고치기<\/strong>, 경계에서 런타임 검증, 타입 가드\n  - `satisfies`(주의: TS 4.9 도입)는 \"이 모양을 만족하는지 검사하되 추론된 구체 타입은 유지\" → 오타·빠진 키를 잡으면서 값 타입이 넓어지지 않아 캐스팅 대신 쓸 자리가 많다\n  - 거짓 선언된 nullable(`string`이라 했는데 실제로 `null`이 옴)도 같은 부류의 거짓말\n- <strong>핵심:<\/strong> `as`는 <strong>컴파일러의 입을 막는 것<\/strong>. 계약이 바뀌면 깨져야 할 곳이 <strong>조용히 통과<\/strong>한다.\n- <strong>꼬리질문:<\/strong>\n  - \"캐스팅을 걷어낼 때 뭐부터 하나요?\" → 실제 응답이 어떤지 배포 스펙·실측으로 먼저 확인한다. 추측으로 타입을 고치면 거짓말이 바뀔 뿐이다.\n  - \"`!`(non-null assertion)는요?\" → 같은 부류. 진짜 null이 아님을 보장하는 흐름이 없으면 좁히기나 기본값으로 바꾼다.\n- <strong>출처:<\/strong> [TypeScript 4.9 — The satisfies Operator](https://www.typescriptlang.org/docs/handbook/release-notes/typescript-4-9.html)\n\n### 런타임 검증과 경계 (zod, Parse Don't Validate)\n\n- <strong>뭐야:<\/strong> 밖에서 들어온 값이 기대한 모양인지 실행 중에 실제로 확인하는 것이다. zod는 스키마 하나로 그 검증과 TS 타입을 같이 만드는 라이브러리다.\n- <strong>왜:<\/strong> TS 타입은 빌드 후 사라진다. 서버·브릿지·URL 쿼리·localStorage에서 들어온 값은 타입이 무엇이라 선언했든 실제로는 아무거나 올 수 있다.\n- <strong>어떻게:<\/strong>\n  - <strong>경계에서 한 번<\/strong> 검증하고, 안쪽은 검증된 타입만 다룬다(parse, don't validate)\n  - zod(주의: 2026-10 문서 기준 Zod 4): 스키마 하나로 <strong>런타임 검증 + `z.infer` 타입<\/strong>을 동시에 → 타입과 검증의 이중 관리 제거. 변환을 쓰면 `z.input`·`z.output`이 갈린다\n  - `safeParse`는 성공/실패 판별 유니온을 돌려줘 사용자 문구·로그로 분기, `parse`는 `ZodError`를 던진다\n  - 비용: 번들 크기·파싱 시간, 큰 응답 전체 검증은 비싸다 → <strong>신뢰도 낮은 경계<\/strong>(외부 연동·브릿지·폼 입력·URL)부터\n  - 부분 손상 응답은 전체 실패 대신 <strong>항목 단위로 격리<\/strong>하는 정규화도 선택지\n- <strong>핵심:<\/strong> 타입은 <strong>컴파일 타임 약속<\/strong>, 검증은 <strong>런타임 확인<\/strong>. 검증은 <strong>경계에서 한 번<\/strong>, 안쪽은 믿는다.\n- <strong>꼬리질문:<\/strong>\n  - \"모든 API 응답을 zod로 검증하나요?\" → 자사 백엔드와 OpenAPI 생성 타입이 있으면 비용 대비 효과가 작을 수 있다. 외부·구버전 클라이언트가 섞이는 경계부터 건다.\n  - \"검증 실패하면 화면은?\" → 전체를 오류로 만들지, 깨진 항목만 빼고 보여줄지는 도메인 결정. 정산처럼 틀리면 안 되는 건 오류, 목록 표시는 격리가 낫다.\n- <strong>출처:<\/strong> [Basic usage (Zod)](https://zod.dev/basics)\n\n> 한 줄 정리: 외부는 unknown으로 받아 경계에서 검증하고, 상태는 판별 유니온으로, `as`로 입을 막지 않는다.\n\n## 2. 컴포넌트 설계\n\n### 관심사 분리와 순수 함수 추출 (Separation of Concerns, Pure Functions)\n\n- <strong>뭐야:<\/strong> 한 코드가 한 가지 일만 하도록 계산·효과·표시를 나누는 것이다. 순수 함수는 같은 입력에 늘 같은 출력을 내고 바깥을 건드리지 않는 함수다.\n- <strong>왜:<\/strong> 나누지 않으면 계산·API 호출·DOM 측정·렌더가 한 컴포넌트에 섞여 수천 줄이 된다. 로직을 테스트하려면 화면을 띄워야 해서 테스트 비용이 커지고 잘 안 쓰게 된다.\n- <strong>어떻게:<\/strong>\n  - 세 층으로 나눈다: <strong>순수 계산<\/strong>(입력→출력, 부수효과 없음) / <strong>효과<\/strong>(API·DOM·타이머, 훅) / <strong>표시<\/strong>(props→JSX)\n  - 판정·변환·계획 수립은 순수 함수로 → <strong>DOM·네트워크 없이 유닛 테스트<\/strong>\n  - \"계획\"과 \"실행\"을 분리: 무엇을 할지 목록을 만드는 함수와 그걸 API로 실행하는 코드를 떼면 실행 전 검사·미리보기가 가능\n  - 훅은 효과를 감싸고 순수 함수를 호출하는 얇은 접착층. 부수효과는 렌더가 아니라 이벤트 핸들러, 안 되면 Effect에(3파트 참고)\n- <strong>핵심:<\/strong> <strong>계산은 순수 함수, 효과는 훅, 표시는 컴포넌트<\/strong>. 테스트하기 어려운 코드는 대부분 <strong>섞여 있는 코드<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"다 순수 함수로 빼면 대가는?\" → 파일·이름이 늘고 흐름을 따라가려면 여러 곳을 열어야 한다. 분기·계산이 있는 로직만 빼고, 단순 매핑은 그 자리에 둔다.\n- <strong>출처:<\/strong> [Keeping Components Pure (react.dev)](https://react.dev/learn/keeping-components-pure)\n\n### 합성과 props 주입 vs 내부 의존 (Composition, Dependency Injection)\n\n- <strong>뭐야:<\/strong> 합성은 작은 부품을 `children`·슬롯으로 끼워 조립하는 방식이고, props 주입은 라우터·세션 같은 바깥 의존을 컴포넌트가 직접 읽지 않고 밖에서 받는 방식이다.\n- <strong>왜:<\/strong> 위젯이 안에서 `useRouter`·세션을 직접 읽으면 다른 역할·다른 라우트에서 재사용이 안 되고, 결국 같은 화면을 두 벌 만든다.\n- <strong>어떻게:<\/strong>\n  - 바깥 의존(라우터·세션·API 구현)은 <strong>props로 받는다<\/strong>: `href`·`onBack`·`renderAction`\n  - <strong>합성<\/strong>: 특정 동작을 위한 boolean prop을 늘리는 대신 `children`·슬롯(채워 넣을 \"구멍\")으로 끼워 넣게 한다\n  - 외부 시스템 계약은 <strong>어댑터<\/strong>로 격리: 화면은 인터페이스만 알고, 구현(mock/실결제)은 갈아끼운다\n  - 주입 지점은 상위(라우트 레이어) 한 곳\n- <strong>핵심:<\/strong> 컴포넌트는 <strong>무엇을 할지<\/strong>만 알고 <strong>어떻게·어디로<\/strong>는 밖에서 받는다. 그러면 <strong>재사용과 교체<\/strong>가 공짜가 된다.\n- <strong>꼬리질문:<\/strong>\n  - \"props drilling이 심해지면요?\" → 깊은 곳까지 같은 값이 내려가면 Context나 합성(`children`으로 중간 층 건너뛰기)을 쓴다. 다만 Context는 의존을 숨기므로 경계 지점에서만.\n  - \"boolean prop을 늘리면 뭐가 문제죠?\" → 조합 수가 2ⁿ으로 늘고 서로 모순되는 조합이 생긴다. 변형이 커지면 합성이나 판별 유니온 props로.\n- <strong>출처:<\/strong> [Passing Props — Passing JSX as children (react.dev)](https://react.dev/learn/passing-props-to-a-component#passing-jsx-as-children) · [Compound Pattern (patterns.dev)](https://www.patterns.dev/react/compound-pattern/)\n\n### 콜백 opt-in과 확장 지점 (Callback Opt-in)\n\n- <strong>뭐야:<\/strong> 공용 부품은 기본 동작만 하고, 토스트·이동 같은 부가 동작은 호출부가 콜백을 넘길 때만 켜지게 하는 설계다.\n- <strong>왜:<\/strong> 공용 컴포넌트가 성공 시 토스트·이동·캐시 무효화까지 스스로 해버리면, 다른 화면이 그 동작을 원치 않을 때 끌 방법이 없다.\n- <strong>어떻게:<\/strong>\n  - 공용 부품은 <strong>기본 동작 최소<\/strong>, 부가 동작은 `onSuccess`·`onError`·`onSelect` 같은 <strong>선택적 콜백<\/strong>으로 호출부가 켠다. 이름은 `onPlayMovie`처럼 의도를 드러내야 내부를 바꿔도 API가 유지된다\n  - 콜백이 없으면 아무 일도 안 일어나는 것이 기본(opt-in). 반대로 끄는 옵션(opt-out)이 늘어나면 설계 신호\n  - 같은 이벤트에 공용·호출부 양쪽이 반응하면 <strong>중복 실행<\/strong>(토스트 두 번 등)이 생긴다 → 책임자를 한 곳으로\n- <strong>핵심:<\/strong> 공용 부품은 <strong>최소 동작 + 선택적 콜백<\/strong>. 부수효과의 <strong>책임자는 하나<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"매 호출부가 같은 콜백을 반복하잖아요?\" → 3곳 이상이면 그 조합을 감싼 얇은 래퍼를 만든다. 공용 부품은 두껍게 하지 않는다.\n- <strong>출처:<\/strong> [Responding to Events — Passing event handlers as props (react.dev)](https://react.dev/learn/responding-to-events#passing-event-handlers-as-props)\n\n### 디자인 시스템과 공용 컴포넌트 API (Design System, Design Tokens)\n\n- <strong>뭐야:<\/strong> 디자인 시스템은 색·간격 같은 값(토큰)과 공용 부품, 쓰는 규칙을 한 묶음으로 관리하는 체계다. 토큰은 그 값에 `color.danger`처럼 이름을 붙여 한 곳에 둔 것이다.\n- <strong>왜:<\/strong> 없으면 화면마다 버튼 높이·여백·색이 조금씩 다르고, 디자인이 바뀌면 수십 파일을 찾아 고친다. 공용 컴포넌트 API 규칙이 없으면 변형마다 boolean prop이 붙어 prop이 계속 늘어난다.\n- <strong>어떻게:<\/strong>\n  - <strong>토큰<\/strong>: 색·간격·radius·글꼴을 이름 붙은 값으로 한 곳에 둔다(원시값 → 의미값 `color.danger`). 주의: W3C 커뮤니티 그룹(DTCG)의 토큰 JSON 포맷이 2025.10에 첫 안정판이 됐다\n  - <strong>층 나누기<\/strong>: 동작·접근성만 가진 headless(Radix 등) → 스타일 입힌 기본 부품 → 도메인 부품. 아래 층일수록 도메인을 모른다\n  - <strong>API<\/strong>: 변형은 boolean 여러 개 대신 `variant` 유니온 하나, 복잡한 부품은 `Select.Trigger`처럼 컨텍스트로 상태를 나누는 compound 패턴\n- <strong>핵심:<\/strong> 디자인 시스템은 <strong>토큰(값) + 부품(동작) + 규칙(문서)<\/strong>. 값은 한 곳, 변형은 <strong>유니온 하나<\/strong>로.\n- <strong>꼬리질문:<\/strong>\n  - \"compound 패턴의 대가는?\" → 하위 부품을 부모 밖에서 쓰면 깨지고, `cloneElement` 방식이면 중간 래퍼가 상태 공유를 끊는다.\n- <strong>출처:<\/strong> [Design Tokens Community Group (W3C)](https://www.designtokens.org/) · [Compound Pattern (patterns.dev)](https://www.patterns.dev/react/compound-pattern/)\n\n> 한 줄 정리: 계산은 순수 함수로 빼고, 바깥 의존은 주입받고, 부가 동작은 호출부가 켜고, 공용 값은 토큰 한 곳에.\n\n## 3. 폴더 아키텍처\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"FSD 레이어가 app에서 shared로 한 방향으로만 의존하며 역방향과 같은 레이어 다른 슬라이스 간 import는 금지됨을 보여주는 그림\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <text x=\"24\" y=\"30\" font-size=\"15\" fill=\"currentColor\" font-weight=\"bold\">FSD 레이어 의존 방향 (위 → 아래만 허용)<\/text>\n  <rect x=\"60\" y=\"50\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--fig-accent)\" opacity=\"0.30\"/>\n  <text x=\"78\" y=\"77\" font-size=\"15\" fill=\"currentColor\" font-weight=\"bold\">app<\/text>\n  <text x=\"140\" y=\"77\" font-size=\"13\" fill=\"currentColor\">라우트·프로바이더·주입<\/text>\n  <rect x=\"60\" y=\"110\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--fig-accent)\" opacity=\"0.24\"/>\n  <text x=\"78\" y=\"137\" font-size=\"15\" fill=\"currentColor\" font-weight=\"bold\">widgets<\/text>\n  <text x=\"160\" y=\"137\" font-size=\"13\" fill=\"currentColor\">화면 조합 블록<\/text>\n  <rect x=\"60\" y=\"170\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--fig-accent)\" opacity=\"0.18\"/>\n  <text x=\"78\" y=\"197\" font-size=\"15\" fill=\"currentColor\" font-weight=\"bold\">features<\/text>\n  <text x=\"168\" y=\"197\" font-size=\"13\" fill=\"currentColor\">사용자 행동 하나<\/text>\n  <rect x=\"60\" y=\"230\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--fig-accent)\" opacity=\"0.12\"/>\n  <text x=\"78\" y=\"257\" font-size=\"15\" fill=\"currentColor\" font-weight=\"bold\">entities<\/text>\n  <text x=\"168\" y=\"257\" font-size=\"13\" fill=\"currentColor\">도메인 모델·타입·UI<\/text>\n  <rect x=\"60\" y=\"290\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--fig-muted)\" opacity=\"0.30\"/>\n  <text x=\"78\" y=\"317\" font-size=\"15\" fill=\"currentColor\" font-weight=\"bold\">shared<\/text>\n  <text x=\"150\" y=\"317\" font-size=\"13\" fill=\"currentColor\">도메인 무관 공용<\/text>\n  <line x1=\"380\" y1=\"72\" x2=\"380\" y2=\"300\" stroke=\"var(--fig-accent)\" stroke-width=\"3\"/>\n  <polygon points=\"372,300 388,300 380,316\" fill=\"var(--fig-accent)\"/>\n  <text x=\"394\" y=\"190\" font-size=\"13\" fill=\"currentColor\">허용: 상위 → 하위<\/text>\n  <rect x=\"500\" y=\"170\" width=\"90\" height=\"44\" rx=\"8\" fill=\"var(--fig-accent)\" opacity=\"0.18\"/>\n  <text x=\"545\" y=\"197\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">features/A<\/text>\n  <rect x=\"610\" y=\"170\" width=\"90\" height=\"44\" rx=\"8\" fill=\"var(--fig-accent)\" opacity=\"0.18\"/>\n  <text x=\"655\" y=\"197\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">features/B<\/text>\n  <line x1=\"592\" y1=\"192\" x2=\"606\" y2=\"192\" stroke=\"var(--fig-accent2)\" stroke-width=\"3\"/>\n  <text x=\"599\" y=\"160\" font-size=\"16\" fill=\"var(--fig-accent2)\" text-anchor=\"middle\" font-weight=\"bold\">×<\/text>\n  <text x=\"600\" y=\"236\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">같은 층 다른 슬라이스 금지<\/text>\n  <line x1=\"545\" y1=\"300\" x2=\"545\" y2=\"230\" stroke=\"var(--fig-accent2)\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/>\n  <polygon points=\"537,236 553,236 545,222\" fill=\"var(--fig-accent2)\"/>\n  <text x=\"565\" y=\"275\" font-size=\"16\" fill=\"var(--fig-accent2)\" font-weight=\"bold\">×<\/text>\n  <text x=\"545\" y=\"320\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">하위 → 상위 금지<\/text>\n<\/svg>\n<figcaption>의존은 한 방향으로만 흐른다 — 아래 층은 위 층의 존재를 모른다 (pages 레이어를 뺀 Light 구성 기준)<\/figcaption>\n<\/figure>\n\n### FSD 레이어와 단방향 의존 (Feature-Sliced Design)\n\n- <strong>뭐야:<\/strong> 코드를 레이어 → 슬라이스 → 세그먼트로 나누고, 위 레이어가 아래 레이어만 import하게 하는 프론트엔드 폴더 구조 방법론이다.\n- <strong>왜:<\/strong> 기준이 없으면 `components/`·`hooks/`·`utils/` 기술명 폴더에 수백 파일이 쌓여, 기능 하나를 고치려면 폴더 다섯 개를 뒤진다. 순환 import로 초기화 순서 버그도 난다.\n- <strong>어떻게:<\/strong>\n  - <strong>레이어<\/strong>(app → (pages) → widgets → features → entities → shared)로 책임을 나누고, <strong>상위가 하위만 import<\/strong>\n  - 레이어 안은 <strong>슬라이스<\/strong>(도메인/행동 단위), 슬라이스 안은 <strong>세그먼트<\/strong>(`ui`·`model`·`api`·`lib`)\n  - 같은 레이어의 <strong>다른 슬라이스끼리 직접 import 금지<\/strong> → 공통 부분은 아래 층으로 내리거나 위 층에서 조합\n  - 슬라이스는 <strong>public API<\/strong>(`index.ts`)로만 노출, 내부 경로 직접 참조 금지\n  - 주의: FSD 2.1 문서 기준 `processes` 레이어는 <strong>deprecated<\/strong> — 내용을 `features`·`app`으로 옮기라고 한다. 공식 문서는 대부분 프로젝트에 `shared`·`pages`·`app`은 있다고 본다. `pages`를 빼는 Light 구성은 공식 권장이 아닌 <strong>팀 변형<\/strong>\n  - 같은 층 슬라이스 금지의 예외: `entities`끼리는 `A/@x/B` 형태의 교차 공개 API를 둘 수 있다. `app`·`shared`는 슬라이스 없이 세그먼트로만 나뉘어 내부끼리 자유롭게 import\n- <strong>핵심:<\/strong> <strong>단방향 의존<\/strong>이 핵심. 아래 층은 위 층을 모르고, 같은 층 슬라이스는 서로 모른다. 그래서 <strong>바꿀 때 영향 범위가 위쪽으로만<\/strong> 퍼진다.\n- <strong>꼬리질문:<\/strong>\n  - \"두 feature가 같은 로직을 써야 하면요?\" → entities나 shared로 내린다. 도메인 이름이 박힌 건 entities, 도메인 무관이면 shared.\n  - \"FSD의 대가는?\" → \"이건 feature냐 widget이냐\" 판단 비용과 초반 폴더 수. 작은 프로젝트엔 과하고, 팀·도메인이 늘 때 효과가 난다.\n  - \"왜 레이어드(components/hooks/utils)를 안 골랐나요?\" → 기술 기준 분류는 기능 하나가 여러 폴더에 흩어지고, 무엇을 지워도 되는지 경계가 안 보인다.\n- <strong>출처:<\/strong> [Layers (Feature-Sliced Design)](https://feature-sliced.design/docs/reference/layers) · [Public API (Feature-Sliced Design)](https://feature-sliced.design/docs/reference/public-api)\n\n### 경계 검사 도구 (Boundary Linting)\n\n- <strong>뭐야:<\/strong> 레이어·슬라이스 import 규칙을 린터나 CI가 자동으로 검사하게 하는 것이다.\n- <strong>왜:<\/strong> 규칙이 문서에만 있으면 급한 PR에서 `features/A`가 `features/B`를 import한다. 리뷰어가 매번 눈으로 잡을 수 없다.\n- <strong>어떻게:<\/strong>\n  - 도구: FSD 전용 `steiger`(층·슬라이스 import 규칙, public API 우회 금지 등 내장, 주의: 2026-10 기준 베타), `eslint-plugin-boundaries`, `dependency-cruiser`, 간단히는 ESLint `no-restricted-imports`\n  - CI에서 돌려 <strong>위반이 늘면 실패<\/strong>하게. 기존 위반은 목록(baseline)으로 묶고 <strong>새 위반만 막는<\/strong> 방식이 현실적\n  - 사각지대를 안다: 경로 별칭(`@/`)만 보고 <strong>상대경로(`../../`)는 못 잡는<\/strong> 설정이 있다, 동적 import·재export 우회\n  - 순환 의존은 `madge`·`dependency-cruiser`로 별도 확인\n- <strong>핵심:<\/strong> 규칙은 <strong>도구로 강제<\/strong>해야 산다. 단, 도구가 <strong>무엇을 못 보는지<\/strong>까지 알아야 숫자를 믿을 수 있다.\n- <strong>꼬리질문:<\/strong>\n  - \"기존 위반이 수백 건이면요?\" → 한 번에 고치지 않는다. baseline으로 고정하고 새 위반만 막은 뒤, 해당 영역을 손댈 때 줄인다.\n- <strong>출처:<\/strong> [Steiger (GitHub)](https://github.com/feature-sliced/steiger) · [Public API — 인덱스 파일 문제 (Feature-Sliced Design)](https://feature-sliced.design/docs/reference/public-api)\n\n> 한 줄 정리: 의존은 위에서 아래로만, 같은 층은 서로 모르게, 규칙은 도구로 강제하되 사각지대를 안다.\n\n## 4. 테스트 전략\n\n### 테스트 비율과 무엇을 테스트하나 (Pyramid vs Trophy)\n\n- <strong>뭐야:<\/strong> 유닛·통합·e2e 테스트를 어떤 비율로 둘지에 대한 모델이다. 피라미드는 유닛을 가장 많이, 트로피는 통합을 가장 두껍게 둔다.\n- <strong>왜:<\/strong> 기준 없이 쓰면 커버리지 숫자는 높은데 배포마다 터지거나, e2e만 잔뜩 있어서 CI가 30분 걸리고 자주 깜빡인다(flaky).\n- <strong>어떻게:<\/strong>\n  - <strong>피라미드<\/strong>: 유닛 많이 → 통합 → e2e 적게. 아래로 갈수록 빠르고 싸다. Google은 대략 유닛 80%·통합 15%·e2e 5%를 목표로 든다\n  - <strong>트로피<\/strong>(Kent C. Dodds): 정적 분석(타입·린트) 바닥 + <strong>통합 비중 크게<\/strong>. 테스트가 실제 사용 방식을 닮을수록 신뢰가 커진다는 원칙에서\n  - 무엇을: <strong>분기·계산이 있는 순수 로직<\/strong>(유닛), <strong>사용자 흐름의 핵심 경로<\/strong>(e2e: 가입·결제·로그인), 화면 동작은 <strong>사용자가 보는 것<\/strong> 기준(Testing Library 우선순위: 역할 → 라벨 → … → `data-testid`는 최후)\n  - 무엇을 안: 구현 세부(내부 state 이름, 호출 횟수), 라이브러리 자체, 단순 마크업 스냅샷 남발\n- <strong>핵심:<\/strong> 비율보다 <strong>\"이 테스트가 깨지면 사용자 문제인가\"<\/strong>. <strong>순수 함수 유닛<\/strong>이 가장 싸고 단단하고, e2e는 <strong>돈·로그인 같은 핵심 흐름<\/strong>에.\n- <strong>꼬리질문:<\/strong>\n  - \"e2e가 flaky하면?\" → 고정 `sleep` 대신 자동 대기하는 로케이터·조건을 기다리는 단언(Playwright `toBeVisible()` 등)을 쓰고, 테스트마다 데이터·상태를 격리, 시간 의존은 고정. Google은 깜빡임이 1%에 가까워지면 테스트가 가치를 잃기 시작한다고 본다.\n  - \"커버리지 목표는?\" → 숫자 목표는 의미 없는 테스트를 부른다. 바뀐 로직의 분기가 덮였는지를 본다.\n- <strong>출처:<\/strong> [The Testing Trophy and Testing Classifications (Kent C. Dodds)](https://kentcdodds.com/blog/the-testing-trophy-and-testing-classifications) · [About Queries — Priority (Testing Library)](https://testing-library.com/docs/queries/about/) · [Testing Overview (Software Engineering at Google, 11장)](https://abseil.io/resources/swe-book/html/ch11.html)\n\n### 모킹 경계 (Mocking Boundary)\n\n- <strong>뭐야:<\/strong> 테스트에서 가짜(mock)로 바꿀 것과 진짜로 둘 것을 가르는 선이다. 네트워크·시간·브라우저 API처럼 시스템 바깥만 가짜로 바꾼다.\n- <strong>왜:<\/strong> 훅·컴포넌트 내부 함수까지 다 mock하면 테스트는 통과하는데 실제 연결은 깨져 있다. 반대로 아무것도 안 mock하면 테스트가 실제 서버에 의존해 느리고 불안정하다.\n- <strong>어떻게:<\/strong>\n  - <strong>시스템 바깥 경계에서만<\/strong> mock: 네트워크(MSW — 브라우저에선 Service Worker로 가로채 `fetch`를 안 건드림), 시간(`vi.useFakeTimers`), 브라우저 API(카메라·브릿지). e2e에선 통제 못 하는 외부 서비스만 Playwright 네트워크 API로 막는다\n  - 내 코드 안의 모듈끼리는 mock하지 않는다 → 실제 연결을 검증\n  - mock 응답은 <strong>실제 응답 모양<\/strong>으로: 실측 응답을 픽스처로 저장해 쓰면 가짜 모양에 맞춘 테스트를 막는다\n  - 순수 함수는 mock이 아예 필요 없다 → 순수 함수로 빼는 것 자체가 모킹을 줄이는 설계\n- <strong>핵심:<\/strong> mock은 <strong>네트워크·시간·플랫폼 경계<\/strong>에서만. <strong>가짜 모양의 mock<\/strong>은 거짓 안심을 준다.\n- <strong>꼬리질문:<\/strong>\n  - \"mock 응답이 실제와 어긋나는 걸 어떻게 막나요?\" → 실제 응답을 픽스처로 쓰는 계약 테스트, 또는 OpenAPI 스키마에서 타입·mock을 생성한다.\n- <strong>출처:<\/strong> [Mock Service Worker — Docs](https://mswjs.io/docs/) · [Best Practices (Playwright)](https://playwright.dev/docs/best-practices)\n\n### 회귀 테스트 (Regression Test)\n\n- <strong>뭐야:<\/strong> 넓게는 변경 뒤 전에 되던 동작이 다시 깨지지 않았는지 확인하는 테스트이고, 여기서는 고친 버그가 돌아오지 않게 남기는 테스트를 다룬다. 버그를 재현하는 실패 테스트를 먼저 쓰고 고치는 방식이다.\n- <strong>왜:<\/strong> 이 테스트가 없으면 고친 버그가 석 달 뒤 다른 사람 리팩터로 똑같이 돌아온다.\n- <strong>어떻게:<\/strong>\n  - 버그를 고치기 <strong>전에<\/strong> 그 버그를 재현하는 실패 테스트부터 쓴다 → 고친 뒤 통과 확인\n  - 테스트 이름에 <strong>증상<\/strong>을 적는다(\"자유석으로 옮긴 학생의 지정석을 미등원으로 표시하지 않는다\")\n  - 재현이 화면에만 있으면 원인 로직을 순수 함수로 빼서 유닛으로 고정, 상호작용 버그는 e2e로\n  - 경계값(0, 빈 배열, 자정, 타임존, 최대치)을 같이 넣는다\n- <strong>핵심:<\/strong> <strong>실패하는 테스트 먼저 → 수정 → 통과<\/strong>. 버그 하나가 테스트 하나를 남긴다.\n- <strong>꼬리질문:<\/strong>\n  - \"재현이 안 되는 버그는요?\" → 계측(로그·상태 스냅샷)을 먼저 넣
