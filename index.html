 직접 부를 수 있는 쪽에서 쓴다\n  - `useDeferredValue(value)`: <strong>값의 지연 사본<\/strong>을 만든다. 급한 렌더는 옛 값으로 먼저 끝내고, 뒤에서 새 값으로 다시 렌더한다. props로 값만 받는 쪽에서 쓴다. 주의: React 19에서 `initialValue` 인자가 추가됐다\n  - 디바운스(입력이 멈추고 일정 시간이 지나야 실행하는 기법)와 다른 점은 고정된 지연 시간이 없다는 것이다. 기기가 빠르면 바로 렌더하고, 느리면 입력을 먼저 처리한다. 단 <strong>네트워크 요청 수를 줄이진 않는다<\/strong>\n  - 주의: React 19부터 `startTransition`에 async 함수를 넘길 수 있다(Actions). 단 `await` 뒤의 set 호출은 transition으로 잡히지 않는다. 그래서 다시 `startTransition`으로 감싸야 한다\n- <strong>핵심:<\/strong> 동시성 렌더링은 계산을 <strong>빨리하는<\/strong> 게 아니라 <strong>양보하게<\/strong> 만든다. setter가 있으면 <strong>useTransition<\/strong>, 값만 있으면 <strong>useDeferredValue<\/strong>. useDeferredValue로 넘기는 무거운 자식은 <strong>memo<\/strong>로 감싸야 효과가 난다\n- <strong>꼬리질문:<\/strong>\n  - \"그럼 디바운스는 필요 없나요?\" → 요청 횟수를 줄이려면 여전히 필요하다. useDeferredValue는 렌더 비용을 줄이는 도구다\n  - \"언제 안 통하나요?\" → 컴포넌트 하나의 렌더가 오래 걸릴 때다(거대한 동기 계산). 그 안에는 중단할 지점이 없다. 리스트 가상화(보이는 행만 그리는 기법)나 계산 분리가 먼저다.\n- <strong>출처:<\/strong> [useTransition — input은 transition 불가](https://react.dev/reference/react/useTransition#updating-an-input-in-a-transition-doesnt-work) · [useDeferredValue — 디바운스와 차이](https://react.dev/reference/react/useDeferredValue#how-is-deferring-a-value-different-from-debouncing-and-throttling)\n\n> 한 줄 정리: 에러 바운더리와 Suspense는 실패와 대기의 경계를 선언하는 장치고, 동시성 기능은 무거운 렌더가 입력에 양보하게 만든다.\n\n## 6. 최신 변화\n\n### React 19 주요 변화 (React 19)\n\n- <strong>뭐야:<\/strong> React 19는 폼 제출 같은 비동기 변경(mutation)을 React가 직접 관리하게 만든 버전이다. 이를 위해 Actions·`useActionState`·`useOptimistic`·`use`를 들여왔다. ref도 일반 prop으로 받게 바꿨다\n- <strong>왜:<\/strong> 이전에는 폼 제출마다 `isPending`·`error`·낙관적 업데이트·롤백 state를 손으로 짜야 했다. 낙관적 업데이트는 서버 응답 전에 성공한 것처럼 화면에 먼저 반영하는 것이다. ref를 받으려면 `forwardRef`로 감싸야 했다. 이 변화를 모르면 라이브러리를 업그레이드할 때 깨지는 API를 설명하지 못한다\n- <strong>어떻게:<\/strong> (주의: React 19, 2024-12-05 stable 기준)\n  - <strong>Actions<\/strong>: transition 안에서 실행하는 async 함수다. pending·에러·낙관적 업데이트·순차 처리를 React가 관리한다. `<form action={fn}>`처럼 form의 action에 함수를 넘길 수 있다\n  - <strong>`useActionState`<\/strong>(canary 시절 `ReactDOM.useFormState`에서 이름 변경): 액션의 결과 state와 pending 여부를 묶어서 반환한다\n  - <strong>`useFormStatus`<\/strong>(react-dom): 자식 버튼이 부모 form의 pending 여부를 Context처럼 읽는다\n  - <strong>`useOptimistic`<\/strong>: 요청이 진행되는 동안 낙관적 값을 보여 준다. 요청이 끝나면 실제 값으로 바뀐다\n  - <strong>`use`<\/strong>: promise나 Context를 렌더 중에 읽는다. 조건문 안에서도 호출할 수 있다\n  - <strong>ref를 일반 prop으로<\/strong>: 함수 컴포넌트가 `forwardRef` 없이 `ref` prop을 받는다(`forwardRef`는 이후 버전에서 deprecated 예정). ref 콜백이 클린업 함수를 반환할 수 있다. ref는 포커스·스크롤 같은 명령형 동작에만 쓴다. 바깥에 노출하는 범위는 `useImperativeHandle`로 줄인다\n  - 그 밖에 세 가지가 있다. `<Context>`를 Provider로 쓸 수 있다. `<title>`·`<meta>`를 컴포넌트 안에 써도 `<head>`로 올려 준다. 하이드레이션 에러가 나면 차이(diff)를 보여 준다\n  - 주의: React 19.2(2025-10-01): `useEffectEvent`, `<Activity>`(숨길 때 state·DOM은 유지하고 effect는 정리), `cacheSignal`(RSC), 부분 사전 렌더링 API가 추가됐다\n- <strong>핵심:<\/strong> 19의 방향은 <strong>비동기 변경(mutation)을 React가 관리<\/strong>하는 것. <strong>Actions + useActionState + useOptimistic<\/strong>, 렌더 중 읽기는 <strong>use<\/strong>, <strong>ref는 prop<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"TanStack Query의 mutation이 있는데 Actions가 필요한가요?\" → 역할이 겹친다. 클라이언트 캐시 무효화·재시도가 중심이면 Query mutation이 자연스럽다. 서버 액션·폼이 중심이면(점진적 향상 포함) Actions가 자연스럽다. 한 화면에 둘을 섞으면 pending의 출처가 두 개가 된다\n  - \"업그레이드 시 깨지는 건?\" → 주의: 제거된 API가 깨진다. `propTypes`와 함수 컴포넌트의 `defaultProps`가 제거됐다. string ref와 legacy context가 제거됐다. `ReactDOM.render`·`hydrate`·`findDOMNode`·`unmountComponentAtNode`가 제거돼서 `createRoot`·`hydrateRoot`만 쓴다. UMD 빌드도 제거됐다. 공식 codemod(코드를 자동으로 고쳐 주는 변환 도구)가 있다. 의존 라이브러리가 호환되는지부터 확인한다\n- <strong>출처:<\/strong> [React v19](https://react.dev/blog/2024/12/05/react-19) · [React 19 Upgrade Guide](https://react.dev/blog/2024/04/25/react-19-upgrade-guide) · [forwardRef](https://react.dev/reference/react/forwardRef)\n\n> 한 줄 정리: React 19는 비동기 변경을 React가 관리하는 방향이고, 버전 경계(17 위임·18 배칭·19 Actions·19.2 useEffectEvent·컴파일러 1.0)를 같이 말한다.\n\n## 핵심 키워드 모음\n\n- <strong>렌더와 커밋<\/strong>: 렌더는 순수 계산(폐기 가능), 커밋은 바뀐 DOM만 반영(동기)\n- <strong>리렌더 조건<\/strong>: 자기 state · 부모 리렌더 · Context 값 변경. props 변경은 원인이 아님\n- <strong>재조정과 key<\/strong>: O(n) 휴리스틱, 타입 다르면 교체, key 변경 = 리마운트\n- <strong>Virtual DOM·Fiber<\/strong>: VDOM은 선언형용(최소 연산만 하는 직접 조작보다 빠르진 않음), Fiber는 렌더를 쪼개는 엔진\n- <strong>배칭·함수형 업데이트<\/strong>: state는 스냅샷, 업데이트는 큐. React 18부터 자동 배칭\n- <strong>훅 규칙<\/strong>: 호출 순서로 식별 → 조건부·핸들러·try/catch 안 금지 (`use`만 조건문 예외)\n- <strong>로직 재사용<\/strong>: HOC·render props → 커스텀 훅. 훅은 로직 공유, 상태 비공유\n- <strong>useEffect<\/strong>: 외부 동기화. 의존성 = 읽는 값 전부, Strict Mode 이중 실행은 클린업 검증\n- <strong>stale closure<\/strong>: 함수는 렌더 스냅샷을 잡음 → latest ref 또는 useEffectEvent(19.2)\n- <strong>제어/비제어<\/strong>: 값의 소유자가 state냐 DOM이냐. 19 action 성공 시 비제어 필드 리셋\n- <strong>메모이제이션 함정<\/strong>: 얕은 비교 사슬이 인라인 값에서 끊김. Context·자기 state는 못 막음. 컴파일러 1.0\n- <strong>Context 리렌더<\/strong>: 값 바뀌면 구독자 전부. 빈도별·state/dispatch 분리, 세밀하면 외부 스토어\n- <strong>useLayoutEffect<\/strong>: 페인트 전 실행, 측정 후 보정에만. SSR에선 안 돎\n- <strong>포털<\/strong>: DOM 위치만 이동, 이벤트 전파는 React 트리 기준\n- <strong>합성 이벤트<\/strong>: 래퍼 + 루트 위임(17부터 root 컨테이너), 풀링 제거, onScroll 비버블\n- <strong>에러 바운더리<\/strong>: 렌더 중 에러만. 이벤트·비동기는 못 잡음. 19에 onCaughtError·onUncaughtError\n- <strong>Suspense·lazy<\/strong>: 기다림의 경계, SSR에선 스트리밍 단위\n- <strong>useTransition·useDeferredValue<\/strong>: 빨리하는 게 아니라 양보. 요청 수 줄이기는 디바운스\n- <strong>React 19<\/strong>: Actions·useActionState·useFormStatus·useOptimistic·use·ref prop. 19.2에 useEffectEvent·Activity\n"}, {"id": "n04", "num": "4", "title": "Next.js와 렌더링 전략", "md": "# 4. Next.js와 렌더링 전략\n\n<strong>이 파트는 뭐냐:<\/strong> \"이 페이지의 HTML은 어디서, 언제 만들어지나\"를 고르는 문제를 다룬다. 먼저 CSR·SSR·SSG·ISR 중 무엇을 고를지 본다. 이어서 서버가 만든 HTML이 브라우저에서 동작하게 되는 하이드레이션, App Router에서 서버 컴포넌트와 클라이언트 컴포넌트를 가르는 경계, 버전마다 바뀌어 온 캐싱을 본다. 마지막으로 미들웨어·환경 변수·런타임처럼 배포할 때 문제가 터지는 지점을 본다. 한 줄 요약: <strong>렌더링 위치와 시점, 그리고 캐시의 수명을 고르는 일.<\/strong>\n\n> 주의: 이 파트는 아래 버전 표기를 기준으로 쓴다. Next.js 13.4(2023-05, App Router stable) · 14(2023-10) · 15(2024-10) · 15.5(2025-08) · 16(2025-10-21) · 16.3(2026-08). 캐싱 기본값은 버전마다 반대로 바뀌었다. 그래서 설명할 때는 \"어느 버전 기준인지\"를 먼저 말한다.\n\n## 1. 렌더링 전략\n\n### CSR·SSR·SSG·ISR 비교와 선택 기준 (Rendering Strategies)\n\n- <strong>뭐야:<\/strong> 페이지 HTML을 어디서, 언제 만드느냐에 따라 나눈 네 가지 방식이다. CSR은 브라우저에서 만든다. SSR은 요청이 올 때마다 서버에서 만든다. SSG는 빌드할 때 만들어 둔다. ISR은 SSG로 만든 결과를 조건에 따라 다시 만든다\n- <strong>왜:<\/strong> 잘못 고르면 두 방향으로 손해를 본다. 로그인 전 랜딩 페이지가 빈 화면으로 떠서 검색에 잘 노출되지 않고 첫 화면도 느려진다. 반대로 드물게 바뀌는 공용 페이지를 요청마다 SSR로 만들면 TTFB(첫 바이트가 도착할 때까지 걸리는 시간)와 서버 비용만 늘어난다\n- <strong>어떻게:<\/strong>\n  - <strong>CSR<\/strong>: 서버는 빈 HTML과 JS 번들을 보낸다. 브라우저가 데이터를 요청한 뒤 화면을 그린다. 서버 부담은 적다. 대신 앱이 커질수록 JS가 늘어 첫 화면·SEO(검색 노출)·INP(입력에 반응하는 속도 지표)가 약해진다\n  - <strong>SSR<\/strong>: 요청이 올 때마다 서버에서 HTML을 만든다. FCP(첫 내용이 화면에 그려지는 시점)가 빠르고 사용자별 데이터를 담을 수 있다. 대신 HTML을 만드는 시간만큼 <strong>TTFB가 늘고<\/strong> 요청마다 서버 비용이 든다\n  - <strong>SSG<\/strong>: 빌드할 때 HTML을 만들어 두고 CDN에서 바로 내려 준다. TTFB와 FCP 모두 유리하다. 대신 데이터가 빌드 시점 값으로 고정되고, 만들 URL을 미리 알아야 한다\n  - <strong>ISR<\/strong>: SSG에 \"다시 만들기\"를 더한 방식이다. 시간 기반으로 설정하면, 만료된 뒤 첫 요청에는 <strong>옛 페이지를 주고 뒤에서 재생성<\/strong>한다(stale-while-revalidate). `revalidatePath`·`revalidateTag`를 부르면 원하는 때에 무효화할 수 있다(on-demand). 이때는 다음 요청이 올 때 다시 만든다\n- <strong>핵심:<\/strong> 전략은 데이터가 누구 것이고 얼마나 자주 바뀌나로 고른다. 공용·드물게 변경 → <strong>SSG/ISR<\/strong>, 사용자별·실시간 → <strong>SSR<\/strong> 또는 <strong>CSR<\/strong>, 로그인 뒤 앱 화면 → <strong>CSR(+서버 셸)<\/strong>도 충분하다. App Router에선 페이지 단위가 아니라 <strong>세그먼트·컴포넌트 단위<\/strong>로 섞인다\n- <strong>꼬리질문:<\/strong>\n  - \"ISR에서 사용자가 옛 데이터를 보는 건 괜찮나요?\" → 만료 직후 첫 요청자는 옛 페이지를 본다. 가격·재고처럼 틀리면 안 되는 값은 ISR 대상에서 뺀다. 그런 값은 따로 조회하거나 on-demand 재검증을 건다\n  - \"App Router엔 getServerSideProps가 없는데 SSR/SSG를 어떻게 정하나요?\" → 라우트가 어떤 API를 쓰는지로 정해진다. `cookies()`·`headers()`·`searchParams`처럼 요청이 와야 값을 알 수 있는 API나 캐시 안 된 데이터를 쓰면 요청할 때 렌더한다. 쓰지 않으면 빌드할 때 미리 렌더한다. 주의: Cache Components를 안 켠 경우에는 `dynamic`·`revalidate` 세그먼트 설정으로 렌더 방식을 강제할 수 있다(16에서 Cache Components를 켜면 이 설정들은 제거된다)\n- <strong>출처:<\/strong> [Rendering on the Web](https://web.dev/articles/rendering-on-the-web) · [ISR 가이드](https://nextjs.org/docs/app/guides/incremental-static-regeneration)\n\n### 하이드레이션 (Hydration)\n\n- <strong>뭐야:<\/strong> 하이드레이션은 서버가 보낸 HTML 위에서 브라우저가 JS로 같은 트리를 다시 렌더하며 이벤트 핸들러를 붙이는 과정이다. 그림만 있는 화면에 동작을 입히는 일이다\n- <strong>왜:<\/strong> 모르면 두 가지를 설명하지 못한다. SSR 화면이 이미 보이는데 버튼을 눌러도 반응이 없는 구간(uncanny valley)이 왜 생기는지 모른다. 서버 HTML과 클라이언트 렌더 결과가 달라서 나는 하이드레이션 에러도 원인을 짚지 못한다\n- <strong>어떻게:<\/strong>\n  - 서버가 만든 HTML은 \"그림\"일 뿐이다. 브라우저가 JS를 받아 <strong>같은 트리를 다시 렌더하며 기존 DOM에 이벤트 핸들러를 붙이는 것<\/strong>이 하이드레이션이다(`hydrateRoot`)\n  - DOM을 새로 만들지 않고 <strong>재사용<\/strong>한다. 그래서 서버 출력과 클라이언트 첫 렌더가 <strong>같아야<\/strong> 한다\n  - JS가 실행되기 전까지는 화면이 보여도 동작하지 않는다. 그래서 JS가 클수록 상호작용이 늦어진다\n  - 주의: React 18부터 <strong>선택적 하이드레이션(selective hydration)<\/strong>을 한다. Suspense 경계 단위로 나눠 하이드레이션하고, 사용자가 상호작용한 영역을 먼저 처리한다\n  - 서버 컴포넌트의 코드는 클라이언트로 가지 않는다. RSC Payload(서버 컴포넌트를 렌더한 결과 데이터)로 트리만 맞춘다. 하이드레이션되는 건 <strong>클라이언트 컴포넌트<\/strong>뿐이다\n- <strong>핵심:<\/strong> 하이드레이션은 <strong>서버 HTML에 동작을 입히는 일<\/strong>이다. 비용은 <strong>클라이언트 JS 양<\/strong>에 비례하고, 전제는 <strong>서버·클라이언트 첫 렌더가 같다<\/strong>는 것\n- <strong>꼬리질문:<\/strong>\n  - \"SSR이면 무조건 빨라지나요?\" → 화면이 처음 그려지는 건 빨라져도, JS가 크면 상호작용은 오히려 늦을 수 있다. App Router는 서버 컴포넌트로 클라이언트 JS 자체를 줄이는 방식으로 답한다\n- <strong>출처:<\/strong> [Server and Client Components — first load](https://nextjs.org/docs/app/getting-started/server-and-client-components#on-the-client-first-load)\n\n### 하이드레이션 불일치 원인과 해결 (Hydration Mismatch)\n\n- <strong>뭐야:<\/strong> 하이드레이션 불일치는 서버가 만든 HTML과 클라이언트 첫 렌더 결과가 달라지는 상황이다. 시간·난수·브라우저 전용 값처럼 실행 환경마다 달라지는 값이 첫 렌더에 섞이면 생긴다\n- <strong>왜:<\/strong> 생기면 \"Text content does not match server-rendered HTML\"이나 \"Hydration failed\" 에러가 난다. 해당 영역이 클라이언트에서 다시 그려지면서 화면이 깜빡이거나 SSR로 얻은 이점이 사라진다\n- <strong>어떻게:<\/strong>\n  - <strong>비결정적 값<\/strong>: 실행할 때마다 결과가 달라지는 값이다. `Date`, `toLocaleString()`, `Math.random()`, 렌더 중 생성한 id가 해당한다. 서버와 클라이언트의 <strong>시간대·로캘<\/strong>이 다르면 같은 시각도 다른 문자열이 된다\n  - <strong>환경 분기<\/strong>: `typeof window !== 'undefined'`로 렌더 결과를 바꾸는 경우다. `localStorage`·`matchMedia` 값을 첫 렌더에 반영하는 경우도 같다\n  - <strong>잘못된 HTML 중첩<\/strong>: `<p>` 안의 `<div>`·`<p>`, `<a>` 안의 `<a>`, `<button>` 안의 `<button>`이 해당한다. 브라우저 파서가 DOM을 고쳐 버려서 서버 HTML과 달라진다\n  - <strong>외부 수정<\/strong>: 앱 바깥에서 HTML을 고치는 경우다. 번역·광고 차단 확장, HTML을 고치는 CDN(자동 압축 등), <strong>iOS의 전화번호·이메일 자동 링크 변환<\/strong>이 해당한다. iOS 자동 링크는 `<meta name=\"format-detection\">`으로 끈다\n  - 해결: 클라이언트 전용 값은 <strong>마운트 후 effect에서 state로<\/strong> 넣는다. id는 <strong>`useId`<\/strong>로 만든다. 클라이언트 전용 컴포넌트는 `next/dynamic`의 `ssr: false`로 불러온다(주의: 15부터 서버 컴포넌트에선 금지). 피할 수 없는 텍스트 차이에는 `suppressHydrationWarning`을 쓴다(한 단계만 적용된다)\n- <strong>핵심:<\/strong> 불일치의 원인은 <strong>첫 렌더가 환경에 따라 달라지는 것<\/strong>이다. 규칙은 <strong>첫 렌더는 서버와 동일하게, 차이는 마운트 후에<\/strong>. 시간은 <strong>타임존을 명시<\/strong>해 포맷한다\n- <strong>꼬리질문:<\/strong>\n  - \"`suppressHydrationWarning`을 루트에 걸면 끝 아닌가요?\" → 경고만 숨길 뿐이다. React는 그 텍스트 차이를 고쳐 주지도 않는다. 한 단계에만 적용되니 테마 클래스처럼 의도한 차이에만 쓴다\n  - \"마운트 후 state로 바꾸면 대가는?\" → 한 프레임 동안 서버 값이 보였다가 바뀐다. 자리를 미리 잡아 두어 레이아웃이 흔들리지 않게 한다\n- <strong>출처:<\/strong> [Hydration error 안내](https://nextjs.org/docs/messages/react-hydration-error)\n\n> 한 줄 정리: 렌더링 전략은 \"데이터가 누구 것이고 얼마나 자주 바뀌나\"로 고르고, SSR을 고르면 TTFB 비용·하이드레이션 비용·첫 렌더 일치 의무가 따라온다.\n\n## 2. App Router의 컴포넌트 모델\n\n### 서버 컴포넌트 vs 클라이언트 컴포넌트 (Server & Client Components)\n\n- <strong>뭐야:<\/strong> App Router의 컴포넌트는 두 종류로 나뉜다. 서버 컴포넌트는 서버에서만 실행되고 결과만 보낸다. 클라이언트 컴포넌트는 `\"use client\"`로 표시하며 브라우저에서도 실행된다. 레이아웃·페이지의 기본값은 <strong>서버 컴포넌트<\/strong>다\n- <strong>왜:<\/strong> 구분을 모르면 두 가지 문제를 겪는다. 마크다운 파서·날짜 라이브러리 같은 무거운 의존성이 단순 표시용인데도 클라이언트 번들에 들어간다. 반대로 서버 컴포넌트에서 `useState`를 썼다가 빌드 에러가 난다\n- <strong>어떻게:<\/strong>\n  - App Router에서 레이아웃·페이지의 기본값은 <strong>서버 컴포넌트(RSC)<\/strong>다. 서버에서만 실행되고 결과(RSC Payload)만 클라이언트로 간다. 코드와 의존성은 <strong>번들에 포함되지 않는다<\/strong>\n  - 서버 컴포넌트에서는 `async` 컴포넌트로 직접 `await`해서 데이터를 가져올 수 있고, DB·비밀키에 접근할 수 있다. state·effect·이벤트 핸들러·브라우저 API·Context는 쓸 수 없다\n  - <strong>클라이언트 컴포넌트<\/strong>: `\"use client\"`를 적은 파일의 컴포넌트다. 첫 로드 때는 서버에서도 HTML로 미리 렌더되고, 클라이언트에서 하이드레이션된다. 즉 \"클라이언트에서만 실행\"되는 것이 아니다. 그 뒤의 내비게이션에서는 클라이언트에서만 렌더된다\n  - 배치 원칙: 상호작용이 필요한 <strong>잎(leaf)만 클라이언트로<\/strong> 둔다. 잎은 트리의 맨 끝에 있는 컴포넌트다. 데이터와 레이아웃은 서버에 둔다\n  - 비밀 코드가 클라이언트로 새는 것을 막으려면 `import 'server-only'`를 적어 빌드할 때 차단한다\n- <strong>핵심:<\/strong> 기본은 <strong>서버<\/strong>, 상호작용이 있는 <strong>잎만 클라이언트<\/strong>로 둔다. 서버 컴포넌트의 이득은 <strong>번들 0 + 데이터 근접<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"서버 컴포넌트와 SSR은 같은 건가요?\" → 다르다. SSR은 HTML을 서버에서 만드는 일이고, 클라이언트 컴포넌트도 SSR된다. 서버 컴포넌트는 코드가 아예 클라이언트로 가지 않는 컴포넌트 종류다\n  - \"서버 컴포넌트에서 TanStack Query를 못 쓰면 클라이언트 캐시는요?\" → 서버에서 prefetch(미리 조회)한다. 그 상태를 dehydrate(직렬화)해서 `HydrationBoundary`로 클라이언트 쿼리 캐시에 넘긴다([5파트 참고](#n05))\n- <strong>출처:<\/strong> [Server and Client Components](https://nextjs.org/docs/app/getting-started/server-and-client-components)\n\n### \"use client\" 경계와 직렬화 가능한 props (Client Boundary & Serializable Props)\n\n- <strong>뭐야:<\/strong> `\"use client\"`는 컴포넌트 하나에만 붙는 표시가 아니다. 그 파일이 import하는 모듈까지 클라이언트 번들로 넣는 경계선이다. 이 경계를 넘어 서버에서 클라이언트로 가는 props는 <strong>직렬화<\/strong> 가능해야 한다. 직렬화 가능하다는 건 네트워크로 보낼 수 있는 데이터라는 뜻이다\n- <strong>왜:<\/strong> 모르면 두 가지 문제를 겪는다. 서버 컴포넌트에서 클라이언트 컴포넌트로 `onClick` 함수나 클래스 인스턴스를 넘겼다가 \"Functions cannot be passed directly to Client Components\" 에러가 난다. 상위 컴포넌트에 `\"use client\"`를 붙였다가 그 파일이 import하는 하위 컴포넌트까지 전부 클라이언트 번들로 들어가기도 한다\n- <strong>어떻게:<\/strong>\n  - `\"use client\"`는 컴포넌트 하나가 아니라 <strong>모듈 그래프의 경계<\/strong>다. 모듈 그래프는 파일들이 import로 이어진 관계다. 그 파일이 import하는 모듈과 직접 렌더하는 컴포넌트가 클라이언트 번들로 들어간다\n  - 서버에서 클라이언트로 넘기는 props는 <strong>직렬화 가능<\/strong>해야 한다. 원시값(전역 등록 `Symbol.for` 포함)·배열·`Map`·`Set`·TypedArray·`Date`·일반 객체·JSX·Promise·서버 함수는 넘길 수 있다. 일반 함수·클래스·클래스 인스턴스·null 프로토타입 객체·전역 등록 안 된 심볼은 넘길 수 없다\n  - 클라이언트 컴포넌트가 서버 컴포넌트를 <strong>import하면<\/strong> 그 컴포넌트도 클라이언트 모듈 그래프에 들어간다. 그러면 서버 컴포넌트로 동작하지 않는다. 대신 <strong>children·props 슬롯으로 받으면<\/strong> 서버에서 렌더된 결과를 끼워 넣을 수 있다(interleaving)\n  - Context Provider는 클라이언트 컴포넌트다. 그래서 `providers.tsx`를 따로 만들고 레이아웃에서 children을 감싼다. 문서는 Provider를 가능한 한 깊게 두라고 한다\n- <strong>핵심:<\/strong> `\"use client\"`는 <strong>import 그래프에 긋는 선<\/strong>이다. 경계는 <strong>최대한 아래로<\/strong>, 넘기는 건 <strong>직렬화 가능한 데이터<\/strong>, 서버 UI는 <strong>children으로 꽂는다<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"클라이언트 컴포넌트 안에 서버 컴포넌트를 넣고 싶으면?\" → import하지 않는다. 부모 서버 컴포넌트에서 `<ClientShell><ServerList /><\/ClientShell>`처럼 children으로 넘긴다\n  - \"Promise를 넘기면 뭐가 좋나요?\" → 서버에서 await하지 않고 Promise를 그대로 넘긴다. 클라이언트는 `use(promise)`와 Suspense로 받는다. 그러면 스트리밍과 함께 쓸 수 있다([3파트 참고](#n03/suspense와-lazy-suspense-code-splitting \"Suspense와 lazy\"))\n- <strong>출처:<\/strong> ['use client' — 직렬화 타입](https://react.dev/reference/rsc/use-client#serializable-types) · [Interleaving](https://nextjs.org/docs/app/getting-started/server-and-client-components#interleaving-server-and-client-components)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"서버 컴포넌트 트리 안에서 use client 경계 아래만 클라이언트 번들로 가고, 서버 컴포넌트는 children으로 클라이언트 컴포넌트 안에 끼워지는 구조\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <rect x=\"20\" y=\"20\" width=\"680\" height=\"320\" rx=\"14\" fill=\"var(--fig-accent)\" fill-opacity=\"0.08\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"40\" y=\"46\" font-size=\"15\" fill=\"var(--fig-accent)\">서버 (번들에 안 들어감 · await·DB·비밀키 가능)<\/text>\n  <rect x=\"290\" y=\"60\" width=\"140\" height=\"44\" rx=\"8\" fill=\"var(--fig-bg)\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"360\" y=\"87\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">layout.tsx<\/text>\n  <rect x=\"90\" y=\"140\" width=\"160\" height=\"44\" rx=\"8\" fill=\"var(--fig-bg)\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"170\" y=\"167\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">page.tsx (async)<\/text>\n  <rect x=\"400\" y=\"125\" width=\"280\" height=\"200\" rx=\"12\" fill=\"var(--fig-accent2)\" fill-opacity=\"0.12\" stroke=\"var(--fig-accent2)\" stroke-width=\"2\" stroke-dasharray=\"8 5\"/>\n  <text x=\"414\" y=\"148\" font-size=\"14\" fill=\"var(--fig-accent2)\">\"use client\" 경계 아래 = 클라이언트 번들<\/text>\n  <rect x=\"460\" y=\"160\" width=\"160\" height=\"44\" rx=\"8\" fill=\"var(--fig-bg)\" stroke=\"var(--fig-accent2)\" stroke-width=\"2\"/>\n  <text x=\"540\" y=\"187\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">FilterPanel<\/text>\n  <rect x=\"420\" y=\"250\" width=\"120\" height=\"44\" rx=\"8\" fill=\"var(--fig-bg)\" stroke=\"var(--fig-accent2)\" stroke-width=\"2\"/>\n  <text x=\"480\" y=\"277\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Button<\/text>\n  <rect x=\"560\" y=\"250\" width=\"110\" height=\"44\" rx=\"8\" fill=\"var(--fig-bg)\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"615\" y=\"270\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">{children}<\/text>\n  <text x=\"615\" y=\"286\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-accent)\">서버 렌더 결과<\/text>\n  <rect x=\"60\" y=\"230\" width=\"220\" height=\"44\" rx=\"8\" fill=\"var(--fig-bg)\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"170\" y=\"257\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">List (서버에서 데이터 조회)<\/text>\n  <line x1=\"330\" y1=\"104\" x2=\"190\" y2=\"138\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <line x1=\"390\" y1=\"104\" x2=\"520\" y2=\"158\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <line x1=\"170\" y1=\"184\" x2=\"170\" y2=\"228\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <line x1=\"520\" y1=\"204\" x2=\"485\" y2=\"248\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <line x1=\"560\" y1=\"204\" x2=\"610\" y2=\"248\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <text x=\"300\" y=\"130\" font-size=\"13\" fill=\"var(--fig-muted)\">props: 직렬화 가능한 값만<\/text>\n  <text x=\"60\" y=\"310\" font-size=\"13\" fill=\"var(--fig-muted)\">일반 함수·클래스 인스턴스는 경계를 못 넘음<\/text>\n<\/svg>\n<figcaption>\"use client\"는 import 그래프에 긋는 선이다. 서버 UI는 import가 아니라 children 슬롯으로 클라이언트 안에 꽂힌다.<\/figcaption>\n<\/figure>\n\n### 스트리밍·loading.tsx·Suspense (Streaming)\n\n- <strong>뭐야:<\/strong> 스트리밍은 HTML을 준비된 부분부터 먼저 보내는 방식이다. Suspense 경계 안의 느린 부분은 fallback(대신 보여 줄 화면)을 먼저 보내고, 완료되면 같은 응답으로 이어서 보낸다. `loading.tsx`는 페이지를 Suspense로 감싸 주는 파일 규약이다\n- <strong>왜:<\/strong> 없으면 SSR이 가장 느린 조각을 기다린다. 페이지에 느린 API 하나(3초)와 빠른 API 여러 개가 섞여 있으면 화면 전체가 3초 동안 하얗게 비어 있다\n- <strong>어떻게:<\/strong>\n  - 전통 SSR은 <strong>모든 데이터 → 전체 HTML → 전송 → 전체 하이드레이션<\/strong> 순서로 차례대로 진행한다. 그래서 가장 느린 조각이 전체를 막는다\n  - 스트리밍은 준비된 부분의 HTML을 먼저 보낸다. `<Suspense>` 경계 안의 느린 부분은 fallback을 보냈다가 <strong>완료되면 같은 응답 스트림으로 이어서<\/strong> 보낸다\n  - `loading.tsx`는 같은 폴더의 `page`(와 하위 레이아웃·`not-found`)를 Suspense로 감싸는 파일 규약이다. 같은 세그먼트의 `layout`·`template`·`error`는 감싸지 않는다\n  - 더 세밀하게 나누려면 컴포넌트 단위 `<Suspense>`로 느린 위젯만 감싼다\n  - <strong>독립 요청은 병렬<\/strong>로 보낸다. 차례대로 `await`하면 서버에서도 워터폴(앞 요청이 끝나야 다음 요청이 시작되는 현상)이 생긴다\n- <strong>핵심:<\/strong> 스트리밍에서는 <strong>Suspense 경계가 전송 단위<\/strong>다. 느린 조각을 <strong>경계로 격리<\/strong>하면 첫 화면이 가장 느린 API에 묶이지 않는다\n- <strong>꼬리질문:<\/strong>\n  - \"스트리밍 중에 404나 리다이렉트를 하면요?\" → 헤더가 이미 나갔기 때문에 상태 코드는 200으로 고정된다. `notFound()`를 부르면 스트림 안에 `noindex` 메타를 넣어 검색 색인은 막는다. 진짜 404 상태 코드가 필요하면 Suspense 경계와 suspend되는 `await`보다 앞에서 판정한다. 또는 proxy에서 판정한다\n  - \"레이아웃에서 `cookies()`를 읽으면 loading.tsx가 왜 안 보이죠?\" → loading은 레이아웃 아래에 있다. 그래서 레이아웃 자체가 요청 시점 데이터를 기다리는 시간은 덮지 못한다. 그 부분을 별도 `<Suspense>`로 감싸거나 page로 내린다\n- <strong>출처:<\/strong> [loading.js](https://nextjs.org/docs/app/api-reference/file-conventions/loading) · [loading.js — Status Codes](https://nextjs.org/docs/app/api-reference/file-conventions/loading#status-codes)\n\n### 라우트 세그먼트와 레이아웃 유지 (Route Segments & Layouts)\n\n- <strong>뭐야:<\/strong> App Router에서는 폴더 하나가 URL 조각(세그먼트) 하나다. 그 안의 `layout`·`page` 같은 특수 파일이 동작을 정한다. <strong>레이아웃<\/strong>은 이동해도 다시 렌더되지 않고 유지된다. 바뀐 세그먼트의 페이지만 교체된다\n- <strong>왜:<\/strong> 이 규칙을 모르면 두 가지에서 당황한다. 탭을 이동할 때마다 사이드바의 스크롤 위치·열림 상태가 초기화된다. 반대로 페이지를 옮겼는데 이전 폼 상태가 남아 있다\n- <strong>어떻게:<\/strong>\n  - 폴더 하나가 URL 세그먼트 하나다. `layout`·`page`·`loading`·`error`·`not-found`·`template` 특수 파일로 동작을 정한다\n  - <strong>레이아웃은 내비게이션 간 다시 렌더되지 않는다<\/strong>. 바뀐 세그먼트만 렌더하고(partial rendering) 레이아웃의 state는 유지한다. 그래서 레이아웃은 `searchParams`·pathname을 받지 못한다(받으면 낡은 값이 된다)\n  - 이동할 때마다 새로 마운트해야 하면 <strong>`template.tsx`<\/strong>를 쓴다. 세그먼트마다 고유 key가 붙어서, 해당 세그먼트(동적 params 포함)가 바뀌면 리마운트된다. searchParams가 바뀌는 것으로는 리마운트되지 않는다\n  - `error.tsx`는 세그먼트 단위 에러 바운더리다(클라이언트 컴포넌트여야 한다). 같은 레벨의 `layout`·`template`에서 난 에러는 잡지 못하고 상위가 잡는다. 루트 레이아웃의 에러는 `global-error.tsx`가 잡는다. 주의: 16.3에서 데이터까지 다시 가져오는 `retry` prop이 stable이 됐다(기존 `reset`은 클라이언트 상태만 재시도한다)\n  - `(group)` 폴더는 URL에 나타나지 않고 레이아웃만 나눈다. `_folder`는 라우팅에서 빠지는 비공개 폴더다\n- <strong>핵심:<\/strong> 내비게이션 때 <strong>레이아웃은 유지, 페이지는 교체<\/strong>된다. 리셋이 필요하면 <strong>template<\/strong> 또는 <strong>key<\/strong>. 에러·로딩도 <strong>세그먼트 단위<\/strong>로 격리된다\n- <strong>꼬리질문:<\/strong>\n  - \"레이아웃에서 경로에 따라 다르게 그리려면?\" → `usePathname`·`useSelectedLayoutSegment`를 쓰는 클라이언트 컴포넌트로 분리한다. 경로별 데이터가 필요하면 page에서 받는다\n  - \"레이아웃에서 인증 체크만 하면 충분한가요?\" → 레이아웃은 하위 경로로 이동할 때 다시 실행되지 않는다. 서버 액션·Route Handler는 레이아웃을 거치지 않는다. 그래서 데이터를 읽는 곳(페이지·데이터 함수·액션)에서도 확인한다\n- <strong>출처:<\/strong> [layout.js — Caveats](https://nextjs.org/docs/app/api-reference/file-conventions/layout#caveats) · [template.js](https://nextjs.org/docs/app/api-reference/file-conventions/template) · [error.js](https://nextjs.org/docs/app/api-reference/file-conventions/error)\n\n### 병렬 라우트와 인터셉트 라우트 (Parallel & Intercepting Routes)\n\n- <strong>뭐야:<\/strong> 병렬 라우트는 한 레이아웃 안에 `@slot` 폴더로 독립된 화면 칸을 여러 개 두는 기능이다. 인터셉트 라우트는 링크로 이동할 때 다른 경로를 현재 화면 맥락(예: 모달)에 띄우는 기능이다\n- <strong>왜:<\/strong> 없으면 이런 요구를 맞추기 어렵다. 사진을 누르면 모달로 열리지만 URL은 공유할 수 있어야 한다. 새로고침하면 상세 페이지가 떠야 한다. 뒤로 가기를 누르면 모달만 닫혀야 한다. 대시보드 패널마다 로딩·에러를 따로 둘 때도 쓴다\n- <strong>어떻게:<\/strong>\n  - <strong>병렬 라우트<\/strong>: `@slot` 폴더가 부모 레이아웃의 prop으로 들어간다(`children`도 암묵적 슬롯이다). 슬롯은 URL 세그먼트가 아니다. 슬롯마다 loading·error를 따로 둔다\n  - 소프트 내비게이션(링크 클릭처럼 페이지를 새로 받지 않는 이동)에서는 매칭되지 않은 슬롯이 이전 화면을 유지한다. 새로고침(하드 내비게이션)에서는 `default.js`를 그린다. `default.js`가 없으면 404가 된다. 주의: 16부터 모든 슬롯에 `default.js`가 없으면 빌드가 실패한다\n  - <strong>인터셉트 라우트<\/strong>: `(.)`·`(..)`·`(..)(..)`·`(...)` 표기로 다른 경로를 현재 레이아웃 안에 띄운다. 기준은 파일 시스템이 아니라 <strong>라우트 세그먼트<\/strong>다(`@slot`은 세지 않는다)\n  - 둘을 합치면 모달 패턴이 된다. 링크를 클릭하면 `@modal/(.)photo/[id]`가 가로채 모달로 띄운다. 직접 접속하거나 새로고침하면 실제 `/photo/[id]` 페이지가 뜬다\n- <strong>핵심:<\/strong> 병렬 라우트는 <strong>한 레이아웃 안의 독립 슬롯<\/strong>, 인터셉트는 <strong>소프트 내비게이션일 때만 다른 경로를 현재 맥락에 띄우기<\/strong>다. 하드 내비게이션에선 원래 페이지\n- <strong>꼬리질문:<\/strong>\n  - \"역할별 슬롯을 레이아웃에서 골라 보여주면 권한 처리가 끝나나요?\" → 아니다. 문서에 따르면 고르지 않은 슬롯도 서버에서 렌더되고 그 결과가 응답에 포함된다. 슬롯 페이지나 데이터 계층에서 따로 인가(권한 확인)한다\n  - \"모달이 다른 페이지로 가도 안 닫혀요\" → 소프트 내비게이션에서는 매칭되지 않은 슬롯이 유지되기 때문이다. `null`을 반환하는 `page`나 catch-all 슬롯을 둬서 닫는다\n- <strong>출처:<\/strong> [Parallel Routes](https://nextjs.org/docs/app/api-reference/file-conventions/parallel-routes) · [Intercepting Routes](https://nextjs.org/docs/app/api-reference/file-conventions/intercepting-routes)\n\n> 한 줄 정리: 서버 컴포넌트가 기본, \"use client\"는 import 그래프의 경계, Suspense 경계가 스트리밍 단위, 레이아웃은 유지되고 슬롯·인터셉트로 경로를 겹친다.\n\n## 3. 데이터와 변경\n\n### 데이터 페칭과 캐싱 계층 (Data Fetching & Caching Layers)\n\n- <strong>뭐야:<\/strong> Next.js는 같은 데이터를 다시 만들지 않으려고 여러 층에 캐시를 둔다(15 문서 기준). Request Memoization은 렌더 1회 안에서 중복 요청을 없앤다. Data Cache는 서버에 오래 저장한다. Full Route Cache는 렌더 결과를 저장한다. Router Cache는 브라우저 메모리에 저장한다. 층마다 수명과 무효화 방법이 다르다\n- <strong>왜:<\/strong> 계층을 구분하지 못하면 두 상황에서 막힌다. 데이터를 수정했는데 새로고침해도 옛 값이 보일 때 어디를 비워야 할지 모른다. 같은 데이터를 레이아웃·페이지·컴포넌트가 각각 요청해 중복 호출처럼 보일 때도 판단하지 못한다\n- <strong>어떻게:<\/strong> (주의: 15 문서 기준으로 네 겹이다. 16의 Cache Components를 켜면 `\"use cache\"` 모델로 바뀐다)\n  - <strong>Request Memoization<\/strong>: 한 번의 서버 렌더 안에서 URL·옵션이 같은 `fetch`(GET·HEAD)를 한 번만 실행한다. React의 기능이라 React 트리(레이아웃·페이지·`generateMetadata` 등)에만 적용된다. Route Handler에는 적용되지 않는다. DB 호출은 React `cache()`로 같은 효과를 얻는다\n  - <strong>Data Cache<\/strong>: `fetch` 결과를 서버에 저장한다. <strong>요청·배포를 넘어<\/strong> 남는다. `revalidate`(시간)나 `revalidateTag`/`revalidatePath`(on-demand)로 무효화한다\n  - <strong>Full Route Cache<\/strong>: 정적 라우트의 렌더 결과(HTML + RSC Payload)를 빌드할 때와 재검증할 때 저장한다. 재배포하면 비워진다\n  - <strong>Router Cache<\/strong>: 방문했거나 prefetch(미리 받아 두기)한 세그먼트의 RSC Payload를 브라우저 메모리에 저장한다. 뒤로 가기·재방문이 빠른 이유다. 서버 쪽을 바꿔도 화면이 안 바뀌는 이유이기도 하다. `router.refresh()`로 갱신한다\n  - 클라이언트 서버 상태 캐시(TanStack Query)는 이것과 <strong>별개 계층<\/strong>이다. 둘 다 쓰면 무효화를 양쪽에서 해야 한다\n- <strong>핵심:<\/strong> \"옛 값이 보인다\"면 <strong>어느 계층의 캐시인지<\/strong>부터 가른다. 렌더 1회(<strong>Memoization<\/strong>) · 서버 영속(<strong>Data Cache<\/strong>) · 빌드 산출물(<strong>Full Route<\/strong>) · 브라우저(<strong>Router Cache<\/strong>)\n- <strong>꼬리질문:<\/strong>\n  - \"변경 후 화면이 안 바뀌면 어디를 보나요?\" → 세 가지를 순서대로 본다. 서버 액션이면 `revalidatePath`/`revalidateTag`를 불렀는지 본다(Route Handler에서 부르면 Router Cache는 즉시 안 비워진다). 클라이언트에서 바꿨다면 `router.refresh()`가 필요한지 본다. TanStack Query를 쓰면 그쪽 무효화도 했는지 본다\n  - \"TanStack Query와 Next 캐시를 같이 쓰면 대가는?\" → 같은 데이터의 기준 값이 두 군데에 생긴다. 그래서 역할을 나눈다. 로그인 뒤 화면은 클라이언트 캐시가 맡고, Next 캐시는 공용·정적 데이터를 맡는다\n- <strong>출처:<\/strong> [Caching (v15 문서)](https://nextjs.org/docs/15/app/guides/caching) · [Caching (Previous Model)](https://nextjs.org/docs/app/guides/caching-without-cache-components)\n\n### 버전별 캐싱 기본값 변화 (Caching Defaults by Version)\n\n- <strong>뭐야:<\/strong> Next.js가 `fetch`·Route Handler·내비게이션을 기본으로 캐시하는지가 버전마다 달라진 흐름이다. 13~14는 따로 적지 않아도 캐시했다(암묵적 캐시). 15는 기본으로 캐시하지 않는다. 16은 Cache Components를 켜면 `\"use cache\"`를 적어 명시적으로 캐시를 켠다(안 켜면 15와 같은 기본값이다)\n- <strong>왜:<\/strong> 같은 코드가 버전에 따라 반대로 동작한다. 그래서 예제 코드대로 했는데 캐시가 안 되거나, 반대로 너무 오래 남는다\n- <strong>어떻게:<\/strong>\n  - 주의: <strong>Next.js 13~14<\/strong>: `fetch` 결과가 기본으로 Data Cache에 저장된다(`force-cache`가 기본). GET Route Handler도 `Request` 객체·동적 함수·동적 세그먼트 설정을 쓰지 않으면 기본으로 캐시된다. 14.2 문서 [Caching](https://nextjs.org/docs/14/app/building-your-application/caching)·[Route Handlers](https://nextjs.org/docs/14/app/building-your-application/routing/route-handlers)에서 확인했다. 13은 버전 문서를 직접 확인하지 못했고, 15 블로그의 \"App Router는 캐시 기본값으로 출시\" 서술을 기준으로 했다. 캐시를 원하지 않으면 `cache: 'no-store'`나 `revalidate: 0`을 명시해야 했다. 이것이 \"왜 갱신이 안 되나\" 혼란의 주원인이었다\n  - 주의: <strong>Next.js 15(2024-10)<\/strong>: `fetch`·GET Route Handler·클라이언트 내비게이션이 <strong>기본 비캐시<\/strong>다. Router Cache에서 페이지 세그먼트의 staleTime 기본값은 0이다(공유 레이아웃은 다시 요청하지 않고, 뒤로/앞으로 가기는 캐시에서 복원하며, `loading`은 5분 유지된다). 캐시하려면 `cache: 'force-cache'`를 명시한다. `params`·`searchParams`·`cookies()`·`headers()`·`draftMode()`가 <strong>비동기(Promise)<\/strong>로 바뀌었다(동기 접근은 경고와 함께 임시로 허용된다)\n  - 주의: <strong>Next.js 16(2025-10)<\/strong>: `cacheComponents: true`를 켜면 <strong>Cache Components<\/strong> 모델이 된다. `\"use cache\"`를 적어 페이지·컴포넌트·함수를 <strong>명시적으로 opt-in 캐시<\/strong>한다(opt-in은 직접 켜야 적용된다는 뜻이다). 나머지 동적 코드는 요청할 때 실행된다. `revalidateTag(tag, profile)`는 두 번째 인자로 `cacheLife` 프로필을 받는다(인자 하나만 넘기는 형태는 deprecated). 서버 액션 전용 `updateTag`(쓴 직후 최신 읽기)·`refresh`(캐시 안 된 데이터만 갱신)가 추가됐다. 동기 `params`·`cookies()` 접근은 <strong>제거<\/strong>됐다\n  - 주의: 16.3: \"기본은 동적, 숨은 캐시 없음\" 방향에 맞춘 Instant Navigations·Partial Prefetching이 opt-in으로 추가됐다\n- <strong>핵심:<\/strong> 캐싱 기본값은 <strong>암묵적 캐시(13~14) → 기본 비캐시(15) → 명시적 opt-in \"use cache\"(16)<\/strong>로 바뀌어 왔다. 캐시 질문엔 <strong>버전부터<\/strong> 확인\n- <strong>꼬리질문:<\/strong>\n  - \"왜 기본값을 뒤집었나요?\" → 15는 피드백을 받아 캐싱 휴리스틱을 다시 평가했다고 밝혔다. 16은 동적 코드를 요청할 때 실행하는 쪽이 개발자 기대에 맞는다고 설명한다\n  - \"업그레이드 때 먼저 볼 건?\" → 두 가지를 본다. 캐시되리라 기대하던 fetch가 요청마다 실행돼 백엔드 부하가 늘지 않는지 본다. 동기 `params` 접근이 남아 있는지 본다(codemod가 제공된다)\n- <strong>출처:<\/strong> [Next.js 15 — Caching](https://nextjs.org/blog/next-15#caching-semantics) · [Next.js 16](https://nextjs.org/blog/next-16) · [Next.js 16.3](https://nextjs.org/blog/next-16-3)\n\n### 서버 액션 (Server Actions / Server Functions)\n\n- <strong>뭐야:<\/strong> 서버 액션은 `\"use server\"` 함수를 클라이언트에서 일반 함수처럼 부르면 POST 요청으로 서버에서 실행되게 하는 기능이다. 주로 폼 저장 같은 데이터 변경에 쓴다\n- <strong>왜:<\/strong> 없으면 폼 하나를 저장하려고 세 군데를 오가야 한다. Route Handler를 만들고, 클라이언트에서 fetch하고, 성공한 뒤 캐시를 무효화한다\n- <strong>어떻게:<\/strong>\n  - `\"use server\"` 함수(Server Function)를 클라이언트에서 호출하면 <strong>POST 요청<\/strong>으로 서버에서 실행된다. 데이터 변경 용도로 쓰면 Server Action이라 부른다. 서버 컴포넌트의 `<form action>`은 JS가 로드되기 전에도 제출된다(점진적 향상). 클라이언트 컴포넌트의 폼은 하이드레이션 전에 들어온 제출을 큐에 쌓아 둔다\n  - 액션 안에서 DB를 변경한 뒤 `revalidatePath`·`revalidateTag`(주의: 16은 `updateTag`·`refresh`도)를 부르면 <strong>한 번의 왕복<\/strong>으로 화면까지 갱신된다\n  - 주의: 13.4에서 alpha였고 14에서 stable이 됐다. 15부터 두 가지가 바뀌었다. 쓰지 않는 액션은 빌드에서 제거된다. ID는 추측할 수 없게 생성돼 빌드마다 바뀐다. 클로저로 잡은 값은 자동으로 암호화된다(서버 인스턴스가 여러 개면 `NEXT_SERVER_ACTIONS_ENCRYPTION_KEY`로 키를 통일한다)\n  - <strong>보안<\/strong>: 액션은 사실상 <strong>공개 POST 엔드포인트<\/strong>다. 페이지에서 한 인증은 액션까지 이어지지 않는다. 그래서 <strong>액션 안에서 인증·권한(소유권)·입력 검증<\/strong>을 한다. 반환값은 UI에 필요한 것만 담는다. Origin과 Host를 비교해 다른 호스트에서 온 호출은 막는다(CSRF 완화)\n- <strong>핵심:<\/strong> 서버 액션은 <strong>RPC처럼 쓰는 POST 엔드포인트<\/strong>다. 장점은 <strong>변경 + 재검증 + 화면 갱신을 한 왕복<\/strong>, 의무는 <strong>액션 내부 인가·검증<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"목록 조회에도 서버 액션을 쓰면요?\" → 서버 액션은 변경용으로 설계됐다. 그래서 현재 클라이언트는 액션을 하나씩 순서대로 보낸다(문서상 구현 세부). 병렬 조회는 서버 컴포넌트나 Route Handler로 한다\n  - \"별도 백엔드가 있는데도 쓸 이유가 있나요?\" → 토큰을 서버에만 두는 BFF(프론트엔드 전용 중간 서버)로는 유용하다. 하지만 이미 백엔드 직접 호출과 TanStack Query로 일관되게 짰다면, 섞는 비용이 더 클 수 있다. 무효화를 두 군데서 해야 하기 때문이다\n- <strong>출처:<\/strong> [Mutating Data](https://nextjs.org/docs/app/getting-started/mutating-data) · [Data Security — Mutating](https://nextjs.org/docs/app/guides/data-security#mutating-data) · [Next.js 14](https://nextjs.org/blog/next-14#server-actions-stable)\n\n### Route Handler (route.ts)\n\n- <strong>뭐야:<\/strong> Route Handler는 `app/**/route.ts`에서 `GET`·`POST` 같은 HTTP 메서드 함수를 export해 만드는 API 엔드포인트다. 화면을 그리지 않고 웹 표준 `Request`/`Response`로 응답한다\n- <strong>왜:<\/strong> 없으면 UI가 아닌 응답을 둘 자리가 없다. 웹훅·외부 콜백·RSS가 그런 응답이다. 앱(웹뷰)이 호출할 HTTP API도 마찬가지다. \"서버 액션 두고 왜 Route Handler냐\"는 질문도 여기서 나온다\n- <strong>어떻게:<\/strong>\n  - `app/**/route.ts`에서 `GET`·`POST`·`PUT`·`PATCH`·`DELETE`·`HEAD`·`OPTIONS`를 export한다. 웹 표준 `Request`/`Response`(+`NextRequest`)를 쓴다. Pages Router의 API Routes에 해당한다\n  - 레이아웃과 클라이언트 내비게이션에 참여하지 않는, 가장 낮은 수준의 라우트다. <strong>같은 세그먼트에 `page`와 공존할 수 없다<\/strong>(`app/route.ts`와 `app/page.tsx`는 충돌한다)\n  - 캐시: 주의: 15부터 GET도 기본으로 캐시하지 않는다. 캐시하려면 `dynamic = 'force-static'`으로 직접 켠다(POST 등은 캐시되지 않는다). 16 Cache Components에서는 페이지처럼 사전 렌더되거나 `\"use cache\"` 헬퍼로 캐시한다\n- <strong>핵심:<\/strong> <strong>UI 밖의 HTTP 계약<\/strong>이 필요하면 Route Handler, <strong>내 앱 UI의 변경<\/strong>이면 서버 액션, <strong>조회 렌더<\/strong>면 서버 컴포넌트\n- <strong>꼬리질문:<\/strong>\n  - \"서버 컴포넌트에서 내 Route Handler를 fetch하면요?\" → 같은 서버 안에서 HTTP 왕복을 한 번 더 하는 셈이다. 서버 컴포넌트에서는 데이터 함수를 직접 부른다. Route Handler는 외부 호출자용으로 둔다\n  - \"Route Handler에서 revalidateTag하면 화면도 바로 바뀌나요?\" → Data Cache는 무효화된다. 하지만 Route Handler는 특정 라우트에 묶여 있지 않아서 사용자의 Router Cache는 즉시 비워지지 않는다\n- <strong>출처:<\/strong> [Route Handlers](https://nextjs.org/docs/app/getting-started/route-handlers) · [route.js](https://nextjs.org/docs/app/api-reference/file-conventions/route)\n\n> 한 줄 정리: 캐시는 \"어느 계층, 어느 버전\"부터 말하고, 서버 액션은 공개 POST라 인가를 안에서, UI 밖 HTTP 계약은 Route Handler로.\n\n## 4. 라우팅과 요청 경계\n\n### 미들웨어와 인증 리다이렉트 (Middleware / Proxy)\n\n- <strong>뭐야:<\/strong> 미들웨어(16부터 proxy)는 페이지가 렌더되기 전에 요청을 가로채는 관문이다. 여기서 리다이렉트·rewrite(주소는 그대로 두고 다른 경로를 보여 주기)·헤더·쿠키를 처리한다\n- <strong>왜:<\/strong> 인증 확인을 클라이언트에서 화면을 그린 뒤에 하면, 로그인하지 않은 사용자에게 보호된 화면이 잠깐 보였다가 튕긴다. 판정 기준이 흩어져 있으면 리다이렉트가 서로를 불러 무한 루프에 빠진다\n- <strong>어떻게:<\/strong>\n  - 미들웨어(16: proxy)는 <strong>렌더 전에<\/strong> 요청을 가로채 redirect·rewrite·헤더·쿠키를 다룬다. matcher(적용할 경로를 정하는 설정)가 없으면 정적 파일·이미지 요청까지 전부 지나간다. 그래서 `matcher`로 범위를 좁힌다\n  - 인증 패턴: 쿠키에 세션·토큰이 있는지와 만료됐는지만 <strong>가볍게<\/strong> 확인한다. 없으면 로그인 페이지로 redirect하고, 원래 경로는 쿼리에 남긴다. 무거운 DB 조회는 피한다\n  - 무한 루프 방지: 로그인 페이지·공개 경로는 matcher에서 빼거나 분기에서 먼저 통과시킨다. 서로 다른 두 판정이 반대 방향으로 리다이렉트하지 않도록 판정 기준을 하나로 둔다\n  - 주의: 런타임은 이렇게 바뀌어 왔다. 실행 런타임은 버전마다 달라졌다. 원래는 Edge 전용이었다. 15.2에서 Node.js 런타임이 experimental로 들어왔고 <strong>15.5 stable<\/strong>이 됐다. 그 뒤 <strong>16에서 `middleware.ts`가 deprecated되고 `proxy.ts`로 이름이 바뀜<\/strong>. proxy는 Node.js 런타임으로 고정이다(`runtime`을 설정하면 에러가 난다). Edge가 필요하면 deprecated된 `middleware.ts`를 당분간 쓸 수 있다\n  - 주의: CVE-2025-29927: 내부 헤더 `x-middleware-subrequest`를 위조해 미들웨어를 통째로 건너뛰는 취약점이다. 2025년 3월에 패치됐다(15.2.3·14.2.25·13.5.9·12.3.5). `next start`·standalone 셀프 호스팅이 영향을 받고, Vercel·Netlify 호스팅은 해당하지 않는다. 미들웨어를 <strong>유일한 인가 지점으로 두면 안 된다<\/strong>는 근거다\n- <strong>핵심:<\/strong> 미들웨어는 <strong>빠른 1차 관문(낙관적 체크)<\/strong>일 뿐이다. 실제 인가는 <strong>데이터에 가까운 곳(서버 컴포넌트·액션·API)<\/strong>에서 다시. 리다이렉트 판정은 <strong>기준 하나로<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"미들웨어에서 토큰 갱신까지 하면요?\" → 미들웨어는 매칭되는 모든 요청에서 실행된다. 그래서 여러 요청이 동시에 갱신하려고 경합하고 지연도 생긴다. 갱신은 한 곳에서 single-flight(동시에 온 요청을 하나로 묶어 한 번만 실행하는 방식)로 묶는 게 안전하다\n  - \"matcher로 경로를 뺐는데 그 페이지의 서버 액션은요?\" → 서버 액션은 그 페이지 경로로 가는 POST다. 그래서 액션 요청도 같이 빠진다. 문서도 액션마다 인증을 다시 하라고 한다\n  - \"왜 이름을 proxy로 바꿨나요?\" → 이유는 두 가지다. Express 미들웨어와 혼동돼 남용되는 것을 막으려 했다. 앱 앞단의 네트워크 경계라는 성격도 드러내려 했다. 문서는 다른 방법이 없을 때의 최후 수단으로 쓰라고 한다\n- <strong>출처:<\/strong> [proxy.js](https://nextjs.org/docs/app/api-reference/file-conventions/proxy) · [Next.js 15.5 — Node 미들웨어](https://nextjs.org/blog/next-15-5#nodejs-middleware-stable) · [미들웨어 우회 postmortem](https://vercel.com/blog/postmortem-on-next-js-middleware-bypass)\n\n### 동적 라우트와 params (Dynamic Routes & params)\n\n- <strong>뭐야:<\/strong> 동적 라우트는 `[id]`처럼 대괄호 폴더로 URL의 일부를 변수로 받는 라우트다. params는 그 값을 페이지에 넘겨주는 객체다. 필터 같은 쿼리 문자열 값은 searchParams로 받는다\n- <strong>왜:<\/strong> 다루는 법을 모르면 세 가지 문제를 겪는다. `/posts/[id]`에서 존재하지 않는 id가 빈 화면으로 뜬다. 15로 올린 뒤 `params.id` 접근에서 경고가 난다. 필터 상태를 URL에 두지 않아서 새로고침·공유할 때 상태가 날아간다\n- <strong>어떻게:<\/strong>\n  - `[id]`는 조각 하나를 받는다. `[...slug]`는 뒤의 조각을 전부 받는다(catch-all). `[[...slug]]`는 조각이 없어도 매칭된다(optional catch-all)\n  - `generateStaticParams`는 빌드할 때 미리 만들 경로 목록을 반환한다(SSG). 목록에 없는 경로는 `dynamicParams` 값에 따라 달라진다. true(기본값)면 첫 방문 때 생성하고, false면 404다. 주의: 16 Cache Components에선 최소 1개를 반환해야 빌드된다\n  - 주의: Next.js 15부터 페이지·레이아웃의 `params`·`searchParams`는 <strong>Promise<\/strong>다. 그래서 `const { id } = await params`처럼 꺼낸다. 클라이언트 컴포넌트에선 `use(params)`나 `useParams()`를 쓴다. 16에서 동기 접근이 제거됐다\n  - 없는 리소스는 `notFound()`를 불러 `not-found.tsx`를 띄운다. URL을 옮길 때는 `redirect()`·`permanentRedirect()`나 `next.config`의 `redirects`를 쓴다\n  - 필터·페이지 번호 같은 <strong>공유 가능한 UI 상태는 searchParams<\/strong>에 둔다. 그래야 새로고침·뒤로 가기·링크 공유에서도 상태가 유지된다\n- <strong>핵심:<\/strong> 경로 정보는 <strong>params(경로)<\/strong>, 화면 상태는 <strong>searchParams(쿼리)<\/strong>로 받는다. 주의: 15부터 <strong>await<\/strong>. 사전 생성은 <strong>generateStaticParams<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"searchParams를 읽으면 렌더링 방식이 어떻게 되나요?\" → 요청마다 값이 다르기 때문에 해당 라우트는 동적 렌더가 된다. 정적으로 두고 싶으면 클라이언트 컴포넌트에서 `useSearchParams`로 읽고 Suspense로 감싼다\n  - \"하위 컴포넌트가 useParams를 직접 부르면요?\" → 그 컴포넌트가 특정 라우트 구조에 묶여 재사용하기 어려워진다. 라우트에서 읽어 props로 내려 준다\n- <strong>출처:<\/strong> [generateStaticParams](https://nextjs.org/docs/app/api-reference/functions/generate-static-params) · [Next.js 15 — Async APIs](https://nextjs.org/blog/next-15#async-request-apis-breaking-change)\n\n### 메타데이터 API와 SEO (Metadata API)\n\n- <strong>뭐야:<\/strong> 메타데이터 API는 페이지의 title·설명·OG 태그를 `metadata` 객체나 `generateMetadata` 함수로 선언하면 Next.js가 `<head>`에 넣어 주는 기능이다. 세그먼트별로 선언한 값은 위에서 아래로 병합된다\n- <strong>왜:<\/strong> 없으면 두 가지 문제가 생긴다. 공유 링크 미리보기(OG)가 모든 페이지에서 똑같다. 루트 레이아웃에 `<head>`를 직접 넣다가 중복 태그가 생긴다. \"`generateMetadata`가 느리면 전체가 늦지 않냐\"는 질문에도 동작 방식을 모르면 답하지 못한다\n- <strong>어떻게:<\/strong>\n  - 값이 고정이면 `export const metadata`를 쓴다. 데이터에 따라 바뀌면 `export async function generateMetadata({ params })`를 쓴다. <strong>서버 컴포넌트(layout·page)에서만<\/strong> 쓸 수 있다. 루트 레이아웃에 `<head>` 태그를 손으로 넣지 않는다\n  - 세그먼트별 metadata는 위에서 아래로 <strong>얕게 병합<\/strong>된다. 같은 키는 덮어쓴다. `title.template`을 쓰면 \"%s | 서비스명\" 같은 패턴을 하위 세그먼트가 물려받는다\n  - `generateMetadata` 안의 `fetch`는 page와 <strong>메모이제이션이 공유<\/strong>된다. 그래서 같은 요청을 두 번 보내지 않는다\n  - 주의: 15.2부터 <strong>스트리밍 메타데이터<\/strong>가 적용된다. 일반 브라우저에는 `generateMetadata`를 기다리지 않고 UI를 먼저 보낸다. JS를 실행하지 못하는 HTML 전용 봇에는 기다렸다가 `<head>`에 넣어 보낸다. 봇은 User-Agent로 판별하고 `htmlLimitedBots`로 조정한다\n  - `sitemap.ts`·`robots.ts`·`opengraph-image.tsx` 파일 규약으로 SEO 자산을 만든다(기본은 정적이다)\n- <strong>핵심:<\/strong> 메타데이터는 <strong>서버에서 확정<\/strong>되고 세그먼트별로 <strong>얕은 병합<\/strong>된다. 주의: 15.2+는 <strong>봇에만 블로킹, 사람에겐 스트리밍<\/strong>이라 느린 메타데이터가 TTFB를 덜 막는다\n- <strong>꼬리질문:<\/strong>\n  - \"클라이언트 컴포넌트 페이지에서 제목을 바꾸려면?\" → metadata export는 서버 컴포넌트 전용이다. 그래서 페이지는 서버 컴포넌트로 두고 상호작용 부분만 클라이언트로 내린다. React 19의 `<title>` 컴포넌트도 대안이다\n- <strong>출처:<\/strong> [generateMetadata](https://nextjs.org/docs/app/api-reference/functions/generate-metadata) · [Streaming metadata](https://nextjs.org/docs/app/api-reference/functions/generate-metadata#streaming-metadata)\n\n> 한 줄 정리: proxy는 1차 관문일 뿐 인가는 데이터 가까이서 다시, 화면 상태는 searchParams(15부터 await), 메타데이터는 서버에서 확정해 봇만 기다리게 한다(15.2+).\n\n## 5. 정적 자원 최적화\n\n### 이미지 최적화 (next/image)\n\n- <strong>뭐야:<\/strong> next/image는 세 가지를 해 주는 이미지 컴포넌트다. 이미지가 들어갈 공간을 미리 잡는다. 기기에 맞는 크기·포맷을 골라 준다. 기본으로 지연 로딩(화면에 가까워질 때 받기)한다\n- <strong>왜:<\/strong> 이런 처리가 없으면 두 가지 문제가 생긴다. 이미지가 늦게 로드되면서 아래 콘텐츠를 밀어내는 레이아웃 이동(CLS)이 생긴다. 모바일에 4000px 원본이 그대로 내려가 LCP(가장 큰 콘텐츠가 그려지는 시점)가 늦어진다\n- <strong>어떻게:<\/strong>\n  - `width`·`height`(또는 `fill` + 부모 크기)로 <strong>공간을 미리 확보<\/strong>한다. 그래서 CLS를 막는다\n  - 요청한 기기에 맞춰 <strong>리사이즈·포맷 변환한 이미지를 srcset으로<\/strong> 제공한다. srcset은 브라우저가 여러 크기 후보 중 하나를 고르게 하는 속성이다. `fill`·반응형 이미지는 `sizes`를 정확히 줘야 필요 이상으로 큰 이미지를 받지 않는다\n  - 기본은 <strong>지연 로딩(`loading=\"lazy\"`)<\/strong>이다. 첫 화면의 LCP 이미지는 `loading=\"eager\"`나 `fetchPriority=\"high\"`로 먼저 받는다. 주의: 16에서 `priority`는 deprecated됐다. 대신 `preload`(헤드에 `<link>` 삽입)가 생겼지만, 문서는 대부분 앞의 두 속성을 권한다\n  - 외부 이미지는 `images.remotePatterns`에 허용할 도메인을 등록한다(주의: `images.domains`는 14부터 deprecated)\n  - 주의: Next.js 16에서 기본값이 바뀌었다. `minimumCacheTTL`은 60초에서 4시간(14400초)으로 늘었다. `qualities` 기본값은 `[75]`다(다른 값은 가장 가까운 허용값으로 맞춘다). `imageSizes`에서 16이 빠졌다. 쿼리스트링이 붙은 로컬 이미지는 `images.localPatterns`가 필요하다. 로컬 IP 최적화는 기본으로 차단된다\n- <strong>핵심:<\/strong> next/image의 세 가지 일: <strong>공간 예약(CLS)<\/strong>, <strong>기기별 크기·포맷(srcset)<\/strong>, <strong>지연 로딩<\/strong>. LCP 이미지는 <strong>eager/high 우선순위<\/strong>, 반응형은 <strong>sizes<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"언제 안 쓰는 게 낫나요?\" → 두 경우다. 셀프호스팅에서 최적화 비용(CPU·캐시)이 부담될 때다. 이미 CDN 이미지 변환을 쓰고 있을 때다. 이때는 `unoptimized`나 커스텀 loader로 넘긴다\n  - \"모든 이미지를 우선 로드하면?\" → 우선순위가 의미 없어진다. 첫 화면의 대역폭을 나눠 써서 오히려 LCP가 늦어진다. 문서도 뷰포트마다 LCP 후보가 여럿이면 preload를 쓰지 말라고 한다\n- <strong>출처:<\/strong> [Image Component](https://nextjs.org/docs/app/api-reference/components/image) · [Next.js 16 — 기본값 변경](https://nextjs.org/blog/next-16#behavior-changes)\n\n### 폰트 최적화 (next/font)\n\n- <strong>뭐야:<\/strong> next/font는 폰트 로더다. 빌드할 때 폰트 파일을 받아 자기 도메인에서 내려 준다(셀프 호스팅). 메트릭(글자 폭·높이 같은 치수)을 맞춘 대체 폰트도 만들어 준다\n- <strong>왜:<\/strong> 없으면 세 가지 문제가 생긴다. 웹폰트가 늦게 와서 글자가 안 보이다가 뜬다(FOIT). 대체 폰트에서 웹폰트로 바뀌면서 줄바꿈이 달라져 레이아웃이 흔들린다(FOUT·CLS). 외부 폰트 CDN 요청이 첫 화면을 막기도 한다\n- <strong>어떻게:<\/strong>\n  - `next/font/google`은 <strong>빌드 시 폰트 파일을 받아 자기 도메인에서 셀프 호스팅<\/strong>한다. `next/font/local`은 프로젝트에 있는 폰트 파일을 같은 방식으로 내보낸다. 그래서 브라우저가 Google로 요청을 보내지 않는다\n  - `adjustFontFallback`(기본 켜짐)이 메트릭을 맞춘 대체 폰트를 자동으로 만든다. 그래서 폰트가 교체될 때 <strong>레이아웃 이동을 줄인다<\/strong>. `display` 기본값은 `swap`이다\n  - `subsets`로 프리로드할 글리프(글자 모양) 범위를 정한다. 가변 폰트면 파일 하나로 여러 굵기를 쓴다. 프리로드는 그 폰트를 쓰는 라우트(페이지·레이아웃 범위)에만 붙는다\n  - className이나 CSS 변수로 받아 레이아웃에서 적용한다(Tailwind 테마 변수와 연결한다)\n- <strong>핵심:<\/strong> next/font는 <strong>셀프 호스팅 + 메트릭 보정 + 서브셋<\/strong>이다. 목표는 <strong>외부 요청 제거와 CLS 감소<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"시스템 폰트면 다 해결 아닌가요?\" → 성능은 가장 좋다. 하지만 OS마다 글리프가 달라 기호·디자인이 깨질 수 있다. 일관성이 필요하면 셀프 호스팅 웹폰트를 쓴다\n- <strong>출처:<\/strong> [Font Module](https://nextjs.org/docs/app/api-reference/components/font)\n\n> 한 줄 정리: next/image는 공간 예약·기기별 크기·지연 로딩, next/font는 셀프 호스팅·메트릭 보정으로 CLS와 외부 요청을 줄인다.\n\n## 6. 배포와 런타임\n\n### 환경 변수와 NEXT_PUBLIC 빌드 시 인라인 (Environment Variables)\n\n- <strong>뭐야:<\/strong> Next.js 환경 변수는 `NEXT_PUBLIC_` 접두사가 있느냐로 갈린다. 접두사가 붙은 변수는 `next build` 때 실제 값으로 바뀌어(inline) 클라이언트 JS에 박힌다. 접두사가 없는 변수는 서버에서만 읽힌다\n- <strong>왜:<\/strong> 모르면 두 가지 사고가 난다. 도커 이미지 하나를 dev·운영에 같이 쓰려고 런타임에 `NEXT_PUBLIC_API_URL`만 바꿨는데 브라우저는 여전히 빌드 때 값을 쓴다. 비밀키에 `NEXT_PUBLIC_`을 붙여 클라이언트 번들에 노출하기도 한다\n- <strong>어떻게:<\/strong>\n  - `NEXT_PUBLIC_` 접두사 변수는 <strong>`next build` 시점에 값으로 치환(inline)<\/strong>돼 클라이언트 JS에 박힌다. 빌드한 뒤에 환경을 바꿔도 반영되지 않는다\n  - 접두사 없는 변수는 <strong>서버에서만<\/strong> 읽힌다. 클라이언트 번들에서는 빈 문자열로 치환된다\n  - 동적 접근은 치환되지 않는다. `process.env[name]`이나 `const env = process.env; env.X` 같은 형태가 동적 접근이다. `process.env.NEXT_PUBLIC_X`처럼 이름을 그대로 적어 쓴다\n  - 조회 순서는 다음과 같고, 먼저 찾으면 멈춘다: `process.env` > `.env.$(NODE_ENV).local` > `.env.local` > `.env.$(NODE_ENV)` > `.env`. `NODE_ENV=test`면 `.env.local`을 읽지 않는다\n  - 한 이미지로 여러 환경을 쓰려면 두 방법이 있다. 동적 렌더(`connection()`·`cookies()` 등 이후) 중에 서버에서 런타임 env를 읽어 내려 준다. 또는 환경별로 따로 빌드한다. 주의: `publicRuntimeConfig`·`serverRuntimeConfig`는 16에서 제거됐다\n- <strong>핵심:<\/strong> `NEXT_PUBLIC_`은 <strong>빌드 타임 상수 + 공개 정보<\/strong>다. 런타임에 바뀌어야 하거나 비밀이면 <strong>서버에서만<\/strong> 읽는다\n- <strong>꼬리질문:<\/strong>\n  - \"`.env`에 비밀키를 커밋하면?\" → 번들에는 안 들어가도 저장소 히스토리에 남는다. 지워도 남으니 키를 교체(rotate)한다. 비밀은 배포 환경의 시크릿 저장소에 둔다\n  - \"환경별 빌드의 대가는?\" → 같은 코드라도 산출물이 달라진다. 그래서 \"dev에서 검증한 빌드가 곧 운영 빌드\"라는 보장이 깨진다\n- <strong>출처:<\/strong> [Environment Variables](https://nextjs.org/docs/app/guides/environment-variables)\n\n### 엣지 런타임 vs 노드 런타임 (Edge & Node.js Runtime)\n\n- <strong>뭐야:<\/strong> 런타임은 Next.js 서버 코드가 실행되는 환경이다. Node.js 런타임은 Node API와 npm 생태계를 다 쓸 수 있는 기본값이다. Edge 런타임은 웹 표준 API만 있는 가벼운 환경이다\n- <strong>왜:<\/strong> 차이를 모르면 두 가지 문제를 겪는다. 미들웨어나 Route Handler에서 `fs`·Node 전용 SDK를 import했다가 엣지 빌드에서 깨진다. 엣지로 옮겼는데 DB가 한 리전에 있어 오히려 느려진다\n- <strong>어떻게:<\/strong>\n  - <strong>Node.js 런타임<\/strong>(기본): Node API와 npm 생태계를 전부 쓸 수 있다. 렌더링에 쓰이는 런타임이다\n  - <strong>Edge 런타임<\/strong>: 웹 표준 API(`fetch`·`Request`·`Response`·Web Crypto·Streams)만 있는 가벼운 런타임이다. 파일 시스템 같은 Node 네이티브 API와 `require`·`eval`을 쓸 수 없다. <strong>ISR 미지원<\/strong>이다\n  - 주의: 라우트별 `export const runtime = 'edge'`는 <strong>16.3.0(2026-08-03)부터 deprecated<\/strong>다(빌드 경고, [PR #93369](https://github.com/vercel/next.js/pull/93369), 16.2.x에는 없음). 문서는 `runtime` export를 지워 기본 `nodejs`로 두라고 안내한다. proxy는 Node로 고정이다. Edge는 deprecated된 `middleware.ts`로만 남아 있다\n  - 엣지의 이점은 <strong>데이터도 가까울 때<\/strong>만 크다. DB가 한 리전에만 있으면 엣지에서 DB까지 왕복이 길어진다\n  - 셀프 호스팅(도커)은 `output: 'standalone'`으로 필요한 파일만 묶은 Node 서버를 만든다. 이미지 최적화와 ISR 캐시는 그 서버의 디스크·메모리에 의존한다. 그래서 인스턴스가 여러 개면 공유 캐시를 따로 설정한다\n- <strong>핵심:<\/strong> 런타임의 기본이자 사실상 표준은 <strong>Node<\/strong>다. 엣지는 <strong>가벼운 요청 가공<\/strong>에만 맞았고 <strong>데이터가 멀면 이점이 사라진다<\/strong>. 주의: 16부터 요청 가로채기(`proxy.ts`)도 Node, 16.3 문서는 라우트 Edge 지정 자체를 deprecated로 표기\n- <strong>꼬리질문:<\/strong>\n  - \"왜 Next 16은 proxy를 Node로 바꿨나요?\" → 공식 설명은 요청 가로채기에 예측 가능한 런타임 하나를 주기 위해서라는 것이다. 15.5 블로그는 Edge 전용이던 미들웨어가 Node 전용 라이브러리·API와 연동하는 데 제약이 있었다고 설명한다(15.5에서 Node 미들웨어가 먼저 stable이 됐다)\n  - \"여러 인스턴스로 셀프 호스팅하면 뭐가 깨지나요?\" → 인스턴스마다 Data Cache·ISR 결과를 따로 갖는다. 그래서 on-demand 재검증이 한 인스턴스에만 반영된다. 공유 캐시 핸들러를 설정하고, 서버 액션 암호화 키도 통일한다\n- <strong>출처:<\/strong> [Edge Runtime](https://nextjs.org/docs/app/api-reference/edge) · [runtime 설정](https://nextjs.org/docs/app/api-reference/file-conventions/route-segment-config/runtime) · [Next.js 16 — proxy](https://nextjs.org/blog/next-16#proxyts-formerly-middlewarets)\n\n> 한 줄 정리: NEXT_PUBLIC은 빌드 때 박히는 공개 상수이고, 런타임은 Node가 기본이자 사실상 표준이 됐으며 엣지는 데이터가 가까울 때만 이득이다.\n\n## 핵심 키워드 모음\n\n- <strong>CSR·SSR·SSG·ISR<\/strong>: 사용자별·변경 빈도·SEO로 고름. SSR은 TTFB 비용, ISR은 만료 후 옛 페이지 주고 뒤에서 재생성\n- <strong>하이드레이션<\/strong>: 서버 HTML에 동작 입히기. 비용은 클라이언트 JS 양, 전제는 첫 렌더 일치\n- <strong>하이드레이션 불일치<\/strong>: 시간·랜덤·window 분기·HTML 중첩·iOS 자동 링크. 차이는 마운트 후에\n- <strong>서버 vs 클라이언트 컴포넌트<\/strong>: 기본 서버(번들 0), 잎만 클라이언트. 클라이언트도 SSR된다\n- <strong>\"use client\" 경계<\/strong>: import 그래프의 선. props는 직렬화 가능, 서버 UI는 children으로\n- <strong>스트리밍<\/strong>: Suspense 경계 = 전송 단위, loading.tsx는 page를 감쌈(layout은 아님). 시작 후 상태 코드 200 고정\n- <strong>레이아웃 유지<\/strong>: 레이아웃은 유지(searchParams 못 받음)·페이지는 교체, 리셋은 template 또는 key\n- <strong>병렬·인터셉트 라우트<\/strong>: @slot은 레이아웃 prop, default.js(16 필수), (.)로 소프트 내비게이션만 가로챔\n- <strong>캐싱 계층<\/strong>: Request Memoization · Data Cache · Full Route Cache · Router Cache. 클라이언트 쿼리 캐시는 별개\n- <strong>버전별 캐싱<\/strong>: 13~14 기본 캐시 → 15 기본 비캐시·async params → 16 \"use cache\" opt-in·updateTag·proxy.ts\n- <strong>서버 액션<\/strong>: 공개 POST. 변경+재검증 한 왕복, 인가·검증은 액션 안에서\n- <strong>Route Handler<\/strong>: UI 밖 HTTP 계약용, page와 같은 세그먼트 불가, 15부터 GET도 기본 비캐시\n- <strong>미들웨어(16: proxy)<\/strong>: 렌더 전 1차 관문, proxy는 Node 고정. CVE-2025-29927 이후 인가는 데이터 가까이서 다시\n- <strong>동적 라우트<\/strong>: [id]·[...slug]·[[...slug]], generateStaticParams, 15부터 await params, 화면 상태는 searchParams\n- <strong>메타데이터 API<\/strong>: 서버에서 확정, 세그먼트별 얕은 병합, 15.2+ 봇 외에는 스트리밍\n- <strong>next/image<\/strong>: 공간 예약·srcset·lazy, LCP는 eager/fetchPriority(16 priority deprecated)\n- <strong>next/font<\/strong>: 셀프 호스팅·메트릭 보정·서브셋으로 외부 요청 제거와 CLS 감소\n- <strong>NEXT_PUBLIC<\/strong>: 빌드 시 인라인되는 공개 상수, 동적 접근 불가, 비밀은 서버 전용\n- <strong>Edge vs Node<\/strong>: 기본 Node, 16.3 문서에서 라우트 edge 지정 deprecated, 엣지는 데이터가 멀면 이점 없음\n"}, {"id": "n05", "num": "5", "title": "데이터와 상태 관리", "md": "# 5. 데이터와 상태 관리\n\n<strong>이 파트는 뭐냐:<\/strong> 화면에 보이는 값이 \"어디서 왔고, 언제 낡고, 누가 바꾸는가\"를 다룬다. 먼저 서버 상태와 클라이언트 상태를 나눈다. 그다음 캐시, 무효화, 요청 경쟁, 중복 제출, 페이지네이션, URL, 폼, 워터폴을 같은 원칙으로 본다. 한 줄 요약: <strong>원본은 하나, 나머지는 복사본이거나 계산 결과다.<\/strong>\n\n## 1. 상태를 어떻게 나누나\n\n### 서버 상태 vs 클라이언트 상태 (Server State vs Client State)\n\n- <strong>뭐야:<\/strong> 화면이 쓰는 값을 \"원본이 어디 있느냐\"로 나눈 것이다. 서버 상태는 원본이 서버에 있는 값이다. 클라이언트는 그 값의 <strong>특정 시점의 스냅샷<\/strong>(그 순간의 복사본)을 빌려 쓴다. 클라이언트 상태는 모달 열림이나 입력 중인 값처럼 브라우저에만 있는 값이다.\n- <strong>왜:<\/strong> 둘을 구분하지 않으면 API 응답을 `useState`나 전역 스토어에 복사해 두게 된다. 그러면 다른 화면에서 값을 수정해도 이 화면에는 옛값이 남는다. 로딩·에러·재조회·중복 요청 제거도 화면마다 다시 짜게 된다.\n- <strong>어떻게:<\/strong>\n  - 서버 상태는 원본이 서버에 있다. 클라이언트는 <strong>특정 시점의 스냅샷<\/strong>을 빌려 쓴다. 다른 사람이 바꿀 수 있고, 시간이 지나면 낡는다.\n  - 클라이언트 상태는 원본이 브라우저에 있다. 모달 열림, 입력 중인 값, 선택된 탭이 여기에 든다. 이 값은 낡지 않는다.\n  - 서버 상태는 캐시 라이브러리(TanStack Query, SWR, RTK Query)에 둔다. 클라이언트 상태는 `useState`·URL·작은 전역 스토어에 둔다.\n  - 헷갈리면 \"새로고침하면 서버에서 다시 받아야 하나?\"를 묻는다. 그렇다면 서버 상태다.\n- <strong>핵심:<\/strong> 서버 상태는 <strong>소유가 아니라 캐시<\/strong>다. 전역 스토어에 API 응답을 복사하는 순간 <strong>동기화 책임<\/strong>이 생긴다.\n- <strong>꼬리질문:<\/strong>\n  - \"서버 상태를 Zustand에 넣으면 안 되나요?\" → 넣을 수는 있다. 대신 다섯 가지를 직접 만들어야 한다. 낡았는지 판정(stale), 재조회, 중복 요청 제거, 안 쓰는 캐시 정리(GC), 무효화다.\n  - \"경계가 애매한 경우는요?\" → 편집 중인 폼 값이 그렇다. 처음 채워 넣는 값은 서버 상태다. 편집을 시작한 뒤의 값은 클라이언트 상태(초안)다.\n- <strong>출처:<\/strong> [TanStack — Does this replace client state?](https://tanstack.com/query/v5/docs/framework/react/guides/does-this-replace-client-state)\n\n### 단일 원본 (Single Source of Truth)\n\n- <strong>뭐야:<\/strong> 값 하나마다 진짜 출처를 한 곳만 두는 원칙이다. 나머지는 그 출처를 읽거나 계산만 한다. 캐시나 표시용 복사본은 있어도 된다. 다만 값을 바꿀 수 있는 곳, 값이 어긋났을 때 기준이 되는 곳은 하나여야 한다.\n- <strong>왜:<\/strong> 원본이 여럿이면 같은 숫자가 세 화면에서 다르게 나온다. 서버 값, 클라이언트가 센 값, 다른 API 값이 서로 갈라지기 때문이다. 버그 제보는 \"가끔 숫자가 안 맞아요\"라는 식으로 들어온다.\n- <strong>어떻게:<\/strong>\n  - 값마다 <strong>원본 하나<\/strong>를 정한다. 나머지는 그 원본을 읽거나 계산만 한다.\n  - 원본이 둘 필요하면(예: 세션 시간과 하루 누적) <strong>이름을 나눠<\/strong> 서로 다른 값으로 다룬다. 문제가 되는 것은 같은 이름의 값을 두 군데서 쓰는 경우다.\n  - 클라이언트가 보간(값 사이를 계산으로 채워 보여 주기, tick 애니메이션 등)을 하더라도 기준은 서버 값이다. 서버 값이 오면 그 값으로 덮는다.\n- <strong>핵심:<\/strong> \"누가 이 값을 <strong>쓸 수 있나<\/strong>\"가 한 곳이어야 한다. 원본이 둘이면 <strong>서로 갈라질 수 있다<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"클라이언트 tick과 서버 값이 다르면 어느 쪽을 믿나요?\" → 서버 값을 믿는다. 클라이언트 tick은 화면 표시를 위한 보간일 뿐이다. 서버 값이 도착하면 그 값으로 맞춘다.\n  - \"그 선택의 대가는?\" → 서버 값이 화면 숫자보다 작게 오면 숫자가 되감기는 것처럼 보인다. 되감김을 허용할지, 늘어나는 방향(단조 증가)만 허용할지는 따로 정책으로 정해야 한다.\n- <strong>출처:<\/strong> [react.dev — Choosing the State Structure](https://react.dev/learn/choosing-the-state-structure)\n\n### 파생 상태는 저장하지 않기 (Derived State)\n\n- <strong>뭐야:<\/strong> 다른 상태에서 계산할 수 있는 값(필터된 목록, 합계 등)을 파생 상태라 한다. 이런 값은 state에 따로 담지 않고 <strong>렌더 중에 계산<\/strong>하자는 원칙이다.\n- <strong>왜:<\/strong> 파생 값을 state에 따로 저장하면 두 가지 문제를 겪는다. 예를 들어 목록을 `useState`에 받고, 필터된 목록을 또 `useState`에 넣어 `useEffect`로 맞춘다고 하자. effect가 돌기 전까지 한 번은 옛값으로 렌더되고, 그 화면이 사용자에게 보일 수도 있다. 의존성을 하나 빠뜨리면 두 값이 어긋난 채로 남는다.\n- <strong>어떻게:<\/strong>\n  - 다른 상태에서 계산할 수 있는 값은 <strong>렌더 중에 계산<\/strong>한다. 계산이 비싸면 `useMemo`로 결과를 기억해 둔다.\n  - 대표적인 잘못된 패턴은 \"props를 state로 복사\"하는 것이다. 값을 처음 상태로 되돌려야 하면 `key`를 바꿔 컴포넌트를 새로 만든다.\n  - 계산이 복잡하면 <strong>순수 함수<\/strong>로 빼서 테스트한다. 순수 함수는 입력이 같으면 출력이 같으니 테스트로 결과를 고정하기 쉽다.\n  - 서버가 판정해야 하는 값(권한, 자격, 회원 여부)은 클라이언트에서 다시 계산하지 않는다.\n- <strong>핵심:<\/strong> 파생 값은 저장하는 순간 <strong>동기화 대상<\/strong>이 된다. 계산할 수 있으면 <strong>계산<\/strong>한다.\n- <strong>꼬리질문:<\/strong>\n  - \"계산이 비싸면요?\" → `useMemo`로 결과를 캐시한다. 그래도 원본은 하나다. 메모는 캐시일 뿐이라 동기화 문제가 생기지 않는다.\n  - \"기본값 + 사용자 재정의는 어떻게 저장하나요?\" → 합쳐진 결과를 저장하면 나중에 기본값이 바뀌어도 반영되지 않는다. 사용자가 재정의한 항목만 저장하고 나머지는 `null`로 둔다. 읽을 때 기본값과 합친다.\n- <strong>출처:<\/strong> [react.dev — You Might Not Need an Effect](https://react.dev/learn/you-might-not-need-an-effect#updating-state-based-on-props-or-state)\n\n> 한 줄 정리: 서버 값은 빌린 캐시, 화면 값은 내 것, 계산할 수 있는 값은 아무도 저장하지 않는다.\n\n## 2. TanStack Query 캐시의 수명\n\n### staleTime과 gcTime\n\n- <strong>뭐야:<\/strong> TanStack Query 캐시에 달린 두 개의 시계다. staleTime은 받은 데이터를 신선하다고 믿는 시간이다. gcTime은 어느 화면도 쓰지 않게 된 캐시를 메모리에서 지우기까지 기다리는 시간이다.\n- <strong>왜:<\/strong> 둘을 모르면 두 가지 문제를 겪는다. staleTime이 0이면 탭만 왔다 갔다 해도 같은 요청이 계속 나간다. 반대로 staleTime을 길게 잡으면 다른 사람이 바꾼 값이 한참 동안 안 보인다.\n- <strong>어떻게:<\/strong>\n  - `staleTime`은 데이터를 받은 뒤 <strong>신선(fresh)으로 간주하는 시간<\/strong>이다. fresh인 동안에는 마운트·포커스·재연결 같은 자동 트리거가 와도 재조회하지 않는다. 기본값은 <strong>0<\/strong>이라 받자마자 stale(낡은 것으로 취급)이 된다.\n  - `gcTime`은 쿼리를 쓰는 컴포넌트(observer)가 하나도 없게 된 뒤 <strong>캐시에서 지우기까지<\/strong> 걸리는 시간이다. 기본값은 <strong>5분<\/strong>이다.\n  - stale은 \"버린다\"가 아니라 \"<strong>다음 트리거 때 다시 물어본다<\/strong>\"는 뜻이다. stale 데이터도 일단 화면에 바로 보여 주고, 뒤에서 새 값으로 갱신한다. 이 방식을 stale-while-revalidate라 부른다.\n  - 주의: v5에서 `cacheTime`의 이름이 `gcTime`으로 바뀌었다. \"안 쓰게 된 뒤 GC(안 쓰는 캐시 정리)까지\"라는 실제 의미를 드러낸 이름이다.\n- <strong>핵심:<\/strong> <strong>staleTime은 재조회 여부<\/strong>, <strong>gcTime은 메모리 보관 여부<\/strong>를 정한다. 둘은 독립이다.\n- <strong>꼬리질문:<\/strong>\n  - \"staleTime을 gcTime보다 길게 잡으면?\" → 설정은 가능하다. 다만 아무도 안 쓰는 동안 gcTime이 지나면 캐시가 지워진다. 그러면 다음에 들어올 때는 처음부터 로딩한다.\n  - \"staleTime은 어떻게 정하나요?\" → 두 가지를 보고 정한다. 데이터가 얼마나 자주 바뀌는지, 틀린 값을 보여 줬을 때 비용이 얼마나 큰지다. 급식표는 길게 잡는다. 실시간 좌석 현황은 0에 가깝게 잡거나 소켓으로 받는다.\n  - \"Infinity로 두면?\" → 무효화할 때만 갱신된다. 그래서 값이 바뀌는 경로를 전부 아는 데이터에만 쓴다.\n- <strong>출처:<\/strong> [TanStack — Caching](https://tanstack.com/query/v5/docs/framework/react/guides/caching) · [TanStack — Migrating to v5](https://tanstack.com/query/v5/docs/framework/react/guides/migrating-to-v5)\n\n### 재조회 트리거 (Refetch Triggers)\n\n- <strong>뭐야:<\/strong> stale한 쿼리를 다시 가져오게 만드는 순간들이다. 새 컴포넌트 마운트, 창 포커스 복귀, 네트워크 재연결 세 가지가 기본으로 켜져 있다.\n- <strong>왜:<\/strong> 트리거를 모르면 두 가지 증상을 설명하지 못한다. 하나는 \"탭 갔다 오니 요청이 또 나가요\"다. 다른 하나는 \"앱을 다시 켰는데 옛날 값이에요\"다.\n- <strong>어떻게:<\/strong>\n  - stale한 쿼리는 세 순간에 다시 가져온다. <strong>새 observer 마운트<\/strong>(`refetchOnMount`), <strong>창 포커스 복귀<\/strong>(`refetchOnWindowFocus`), <strong>네트워크 재연결<\/strong>(`refetchOnReconnect`)이다. observer는 그 쿼리를 쓰는 컴포넌트다. 셋 다 기본으로 켜져 있다.\n  - 그 밖에 `refetchInterval`(폴링, 일정 간격으로 다시 묻기), `invalidateQueries`, `refetch()` 직접 호출로도 다시 가져온다.\n  - fresh면 마운트·포커스·재연결 트리거가 와도 <strong>아무것도 안 한다<\/strong>. 반면 `invalidateQueries`·`refetch()`·`refetchInterval`은 신선도와 상관없이 가져온다. 그래서 \"요청이 너무 많다\"는 문제는 트리거를 끄기보다 staleTime을 올리는 것으로 먼저 푼다.\n  - 재조회 결과에는 구조적 공유(structural sharing)가 적용된다. 바뀐 부분만 새 참조가 된다.\n- <strong>핵심:<\/strong> 마운트·포커스·재연결 트리거는 \"<strong>stale일 때만<\/strong>\" 발동한다. 요청 빈도는 <strong>staleTime<\/strong>이 조절한다.\n- <strong>꼬리질문:<\/strong>\n  - \"웹뷰 앱에서 백그라운드 복귀 때도 포커스 트리거가 오나요?\" → 주의: v5의 포커스 감지는 `visibilitychange` 이벤트를 기준으로 한다. 웹뷰가 이 이벤트를 주지 않으면 `focusManager.setEventListener`로 네이티브의 복귀 신호를 연결한다.\n  - \"폴링을 쓰면 안 되나요?\" → 쓸 수는 있지만 변화가 없어도 요청이 쌓인다. 지연에 민감한 화면이면 SSE·소켓 이벤트를 받아 캐시를 갱신한다([6파트 참고](#n06/폴링-롱폴링-sse-websocket-선택-realtime-transport \"폴링·롱폴링·SSE·WebSocket 선택\")).\n- <strong>출처:<\/strong> [TanStack — Important Defaults](https://tanstack.com/query/v5/docs/framework/react/guides/important-defaults) · [TanStack — Window Focus Refetching](https://tanstack.com/query/v5/docs/framework/react/guides/window-focus-refetching)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"TanStack Query 쿼리가 fresh에서 stale로, 트리거가 오면 fetching을 거쳐 다시 fresh가 되고, observer가 없으면 gcTime 뒤 삭제되는 상태 전이\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <rect x=\"40\" y=\"70\" width=\"150\" height=\"64\" rx=\"10\" fill=\"var(--fig-accent)\" opacity=\"0.18\" stroke=\"var(--fig-accent)\"/>\n  <text x=\"115\" y=\"98\" text-anchor=\"middle\" font-size=\"16\" fill=\"currentColor\">fresh<\/text>\n  <text x=\"115\" y=\"120\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">자동 트리거 무시<\/text>\n  <rect x=\"285\" y=\"70\" width=\"150\" height=\"64\" rx=\"10\" fill=\"var(--fig-muted)\" opacity=\"0.25\" stroke=\"var(--fig-line)\"/>\n  <text x=\"360\" y=\"98\" text-anchor=\"middle\" font-size=\"16\" fill=\"currentColor\">stale<\/text>\n  <text x=\"360\" y=\"120\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">캐시는 바로 보여 줌<\/text>\n  <rect x=\"530\" y=\"70\" width=\"150\" height=\"64\" rx=\"10\" fill=\"var(--fig-accent2)\" opacity=\"0.2\" stroke=\"var(--fig-accent2)\"/>\n  <text x=\"605\" y=\"98\" text-anchor=\"middle\" font-size=\"16\" fill=\"currentColor\">fetching<\/text>\n  <text x=\"605\" y=\"120\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">isFetching=true<\/text>\n  <line x1=\"190\" y1=\"102\" x2=\"280\" y2=\"102\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <polygon points=\"280,97 290,102 280,107\" fill=\"var(--fig-line)\"/>\n  <text x=\"237\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">staleTime 경과<\/text>\n  <line x1=\"435\" y1=\"102\" x2=\"525\" y2=\"102\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <polygon points=\"525,97 535,102 525,107\" fill=\"var(--fig-line)\"/>\n  <text x=\"482\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">트리거<\/text>\n  <path d=\"M605 134 C605 200 115 200 115 140\" fill=\"none\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <polygon points=\"110,142 115,132 120,142\" fill=\"var(--fig-accent)\"/>\n  <text x=\"360\" y=\"192\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">응답 도착 → 데이터 교체, 다시 fresh<\/text>\n  <text x=\"482\" y=\"60\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">마운트 · 포커스 · 재연결<\/text>\n  <rect x=\"285\" y=\"250\" width=\"150\" height=\"56\" rx=\"10\" fill=\"none\" stroke=\"var(--fig-line)\" stroke-dasharray=\"5 4\"/>\n  <text x=\"360\" y=\"276\" text-anchor=\"middle\" font-size=\"16\" fill=\"currentColor\">inactive<\/text>\n  <text x=\"360\" y=\"296\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">observer 0개<\/text>\n  <rect x=\"530\" y=\"250\" width=\"150\" height=\"56\" rx=\"10\" fill=\"var(--fig-muted)\" opacity=\"0.2\" stroke=\"var(--fig-line)\"/>\n  <text x=\"605\" y=\"283\" text-anchor=\"middle\" font-size=\"16\" fill=\"currentColor\">캐시에서 삭제<\/text>\n  <line x1=\"435\" y1=\"278\" x2=\"525\" y2=\"278\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <polygon points=\"525,273 535,278 525,283\" fill=\"var(--fig-line)\"/>\n  <text x=\"482\" y=\"268\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">gcTime 경과<\/text>\n  <text x=\"150\" y=\"282\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">마지막 컴포넌트 언마운트 →<\/text>\n  <text x=\"360\" y=\"340\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">staleTime은 \"다시 물어볼까\", gcTime은 \"메모리에 둘까\"<\/text>\n<\/svg>\n<figcaption>쿼리 하나의 수명: 신선도(staleTime)와 보관(gcTime)은 서로 다른 축이다<\/figcaption>\n<\/figure>\n\n> 한 줄 정리: stale은 \"틀렸다\"가 아니라 \"다음 기회에 다시 묻는다\"이고, 그 기회가 트리거다.\n\n## 3. 쿼리 키와 무효화\n\n### 쿼리 키 설계 (Query Key Factory)\n\n- <strong>뭐야:<\/strong> 쿼리 키는 캐시에서 응답이 들어갈 칸의 주소다. 키 설계는 이 주소를 어떤 입력으로, 어떤 계층으로 만들지 정하는 일이다.\n- <strong>왜:<\/strong> 화면마다 `['members', page]`, `['member-list', { page }]`처럼 키를 그 자리에서 직접(인라인) 쓰면 같은 데이터의 키가 제각각이 된다. 그러면 무효화할 때 하나를 빠뜨린다.\n- <strong>어떻게:<\/strong>\n  - 키는 <strong>캐시 주소<\/strong>다. 응답에 영향을 주는 모든 입력(필터·페이지·정렬·조직 ID)을 키에 넣는다. 하나라도 빠지면 서로 다른 응답이 같은 칸을 덮어쓴다.\n  - 키는 계층으로 설계한다: `[도메인] → [도메인, 'list', 필터] → [도메인, 'detail', id]`. 키의 앞부분이 같으면 <strong>접두어 일치<\/strong>로 한 번에 무효화된다.\n  - 키는 <strong>팩토리 함수<\/strong>로만 만들고, 인라인 배열은 금지한다. 팩토리 함수는 키 배열을 만들어 돌려주는 함수다. 이렇게 하면 오타나 순서 차이로 생기는 \"같은데 다른 키\"를 막는다.\n  - 키 안의 객체는 속성 순서가 달라도 같은 키로 본다. 배열은 순서가 다르면 다른 키다.\n- <strong>핵심:<\/strong> 키는 <strong>응답을 결정하는 입력의 전부<\/strong>이고, <strong>계층<\/strong>이 무효화 범위를 정한다.\n- <strong>꼬리질문:<\/strong>\n  - \"키에 필터를 다 넣으면 캐시가 너무 많아지지 않나요?\" → 쓰는 컴포넌트(observer)가 없는 키는 gcTime 뒤에 사라진다. 메모리 비용보다 다른 필터의 결과가 섞이는 비용이 훨씬 크다.\n  - \"다른 사람 계정으로 로그인하면요?\" → 사용자·조직 같은 범위 입력이 키에 없으면 이전 사용자의 캐시가 보일 수 있다. 로그아웃할 때 `queryClient.clear()`를 부르거나 범위를 키에 넣는다.\n- <strong>출처:<\/strong> [TanStack — Query Keys](https://tanstack.com/query/v5/docs/framework/react/guides/query-keys)\n\n### 무효화 범위는 넓게 (Invalidation Scope)\n\n- <strong>뭐야:<\/strong> mutation(서버 데이터를 바꾸는 요청) 뒤에 \"이 캐시는 낡았다\"고 표시할 범위를 정하는 문제다. 좁게 고르기보다 도메인 루트 키를 통째로 무효화하자는 원칙이다.\n- <strong>왜:<\/strong> 범위가 좁으면 회원 정보를 수정했을 때 상세 화면만 바뀐다. 목록·필터 카운트·선택 창에는 옛값이 남는다.\n- <strong>어떻게:<\/strong>\n  - mutation이 성공한 뒤 <strong>도메인 루트 키<\/strong>(`queryKeys.member.all`)를 무효화한다. 그러면 그 아래 목록·상세·카운트가 모두 stale이 된다.\n  - `invalidateQueries`는 두 가지 일을 한다. 대상 쿼리에 stale 표시를 하고, 그중 <strong>활성(화면에 떠 있는) 쿼리만 즉시 재조회<\/strong>한다(`refetchType` 기본 `'active'`). 대상 키는 기본으로 <strong>접두어 일치<\/strong>로 고르고, `exact: true`를 주면 정확히 같은 키만 고른다. 비활성 쿼리는 다음에 그 화면에 들어갈 때 가져오므로 요청이 폭발하지는 않는다.\n  - 좁게 무효화하려면 \"이 변경이 영향을 주는 키를 <strong>전부<\/strong> 안다\"는 전제가 필요하다. 그 전제는 기능이 늘수록 깨진다.\n  - 응답으로 확정된 값을 받는다면 `setQueryData`로 캐시에 직접 써도 된다. 하지만 목록 정렬·카운트처럼 서버만 아는 파생값은 결국 무효화해야 한다.\n- <strong>핵심:<\/strong> 무효화가 <strong>넓어서 생기는 비용은 요청 몇 개<\/strong>, <strong>좁아서 생기는 비용은 틀린 화면<\/strong>이다.\n- <strong>꼬리질문:<\/strong>\n  - \"활성 쿼리가 많으면 요청이 몰리지 않나요?\" → 몰린다. 먼저 측정하고, 문제가 되면 `refetchType`·`predicate`로 범위를 좁힌다.\n  - \"다른 도메인에 영향이 가면요?\" → 예를 들어 출결 변경이 좌석 표시에 영향을 준다면 두 도메인의 루트를 함께 무효화한다. 이런 영향 관계는 mutation 훅 한 곳에 모아 둔다.\n- <strong>출처:<\/strong> [TanStack — Query Invalidation](https://tanstack.com/query/v5/docs/framework/react/guides/query-invalidation) · [TanStack — QueryClient](https://tanstack.com/query/v5/docs/reference/QueryClient)\n\n> 한 줄 정리: 키는 팩토리로 계층 있게 만들고, 무효화는 도메인 루트로 넓게 건다.\n\n## 4. 변경(mutation)과 에러 처리\n\n### 낙관적 업데이트와 롤백 (Optimistic Update)\n\n- <strong>뭐야:<\/strong> 서버 응답을 기다리지 않고, 성공할 것이라 보고 화면을 먼저 바꾸는 방식이다. 실패하면 바꾸기 전 값으로 되돌린다(<strong>롤백<\/strong>).\n- <strong>왜:<\/strong> 없으면 토글이 서버 왕복 시간만큼 늦게 반응한다. 사용자는 안 눌린 줄 알고 다시 누르기도 한다. 반대로 화면을 먼저 바꿔 놓고 실패했을 때 되돌리지 않으면 화면과 서버 값이 갈라진다.\n- <strong>어떻게:<\/strong>\n  - `onMutate`에서는 네 가지를 차례로 한다. 진행 중인 재조회를 `cancelQueries`로 멈춘다(늦은 응답이 낙관적 값을 덮지 않게) → 이전 값을 스냅샷으로 떠 둔다 → `setQueryData`로 화면에 미리 반영한다 → 스냅샷을 반환한다(`onError`·`onSettled`에 전달됨).\n  - `onError`에서는 전달받은 스냅샷으로 되돌린다. 주의: 최신 v5 문서는 이 반환값 인자를 `onMutateResult`라 부른다. `context`는 `client` 등을 담은 별도 인자다.\n  - `onSettled`에서는 성공·실패와 상관없이 무효화해 서버의 실제 값으로 맞춘다.\n  - 대안도 있다. 캐시는 그대로 두고 `variables`·`isPending`으로 \"보내는 중\" 항목만 화면에 겹쳐 그린다. 이 방식에는 롤백이 없다. 값을 보여 주는 곳이 한 곳이면 이 방식을, 여러 곳이면 캐시를 바꾸는 방식을 쓴다.\n- <strong>핵심:<\/strong> 낙관적 업데이트는 <strong>취소 → 스냅샷 → 반영 → 실패 시 롤백 → 끝나면 무효화<\/strong> 다섯 단계다. 마지막 무효화가 <strong>정합성의 안전망<\/strong>이다.\n- <strong>꼬리질문:<\/strong>\n  - \"언제 안 쓰나요?\" → 실패가 잦거나, 되돌리면 사용자가 혼란스러운 경우(결제, 좌석 배정)에는 쓰지 않는다. 서버만 판정할 수 있는 결과는 응답을 기다린다.\n  - \"같은 항목을 빠르게 두 번 토글하면?\" → 첫 요청의 `onSettled` 무효화가 두 번째 낙관적 값을 덮어 화면이 깜빡인다. `isMutating({ mutationKey }) === 1`(진행 중인 mutation이 나 하나뿐)일 때만 무효화하거나 버튼을 잠근다.\n- <strong>출처:<\/strong> [TanStack — Optimistic Updates](https://tanstack.com/query/v5/docs/framework/react/guides/optimistic-updates) · [TkDodo — Concurrent Optimistic Updates](https://tkdodo.eu/blog/concurrent-optimistic-updates-in-react-query)\n\n### 전역 onError와 중복 토스트 (Global Error Handler)\n\n- <strong>뭐야:<\/strong> 쿼리·mutation의 실패를 `QueryCache`·`MutationCache`의 onError 한 곳에서 받아 안내하는 구조다. 실패 안내를 어디서 몇 번 띄울지 정하는 문제이기도 하다.\n- <strong>왜:<\/strong> 정하지 않으면 두 가지 문제가 생긴다. 전역 핸들러와 훅이 둘 다 띄워서 실패 토스트가 두 개 뜬다. 반대로 조회 실패가 토스트로만 잠깐 지나가고 화면에는 \"데이터 없음\"이 남는다.\n- <strong>어떻게:<\/strong>\n  - 전역 처리는 `QueryCache({ onError })`·`MutationCache({ onError })`에 둔다. 주의: v5에서 `useQuery`의 `onSuccess`/`onError`/`onSettled`가 제거됐다(mutation에는 남아 있다). 이 콜백들은 컴포넌트마다 불려서 중복되기 쉬웠다.\n  - mutation 콜백은 여러 곳에 걸어 두면 전부 실행된다. 주의: v5의 실행 순서는 <strong>MutationCache 콜백 → `useMutation` 옵션 콜백 → `mutate()`에 넘긴 콜백<\/strong>이다(앞 둘의 순서는 `mutation.ts` 구현, 뒤 둘의 순서는 가이드 기준). `mutate()`에 넘긴 콜백은 컴포넌트가 언마운트되면 불리지 않는다. `mutate()`를 연달아 호출하면 <strong>마지막 호출분만<\/strong> 실행된다.\n  - 규칙은 이렇다. 일반 실패 문구는 <strong>전역 한 곳<\/strong>에서만 띄운다. 훅·컴포넌트는 성공 안내나 특수 오류 코드 분기만 맡는다.\n  - 화면 안에서 오류를 직접 그리는 조회는 `meta` 같은 표식으로 전역 토스트를 끈다. 그리고 <strong>오류 상태 + 다시 시도<\/strong>를 렌더한다.\n- <strong>핵심:<\/strong> 실패 안내는 <strong>한 번, 한 곳<\/strong>에서 한다. 조회 실패는 토스트가 아니라 <strong>화면 상태<\/strong>로 드러낸다.\n- <strong>꼬리질문:<\/strong>\n  - \"전역 핸들러가 모든 에러 코드를 알아야 하나요?\" → 아니다. 전역은 공통 오류(네트워크·500·세션 만료)만 맡는다. 도메인 오류 코드는 훅이 처리하고, 그때는 전역 안내를 끈다.\n  - \"에러 바운더리랑은 어떻게 나누나요?\" → 화면을 아예 그릴 수 없는 실패는 에러 바운더리가 맡는다. 일부만 실패했거나 다시 시도할 수 있는 실패는 화면 안의 오류 상태로 보여 준다. 토스트는 사용자가 방금 한 행동의 결과에만 쓴다.\n- <strong>출처:<\/strong> [TanStack — Mutations](https://tanstack.com/query/v5/docs/framework/react/guides/mutations) · [TanStack — Migrating to v5](https://tanstack.com/query/v5/docs/framework/react/guides/migrating-to-v5) · [mutation.ts](https://raw.githubusercontent.com/TanStack/query/main/packages/query-core/src/mutation.ts)\n\n> 한 줄 정리: 낙관적 업데이트는 롤백·무효화까지 한 세트, 에러 안내는 전역에서 한 번.\n\n## 5. 동시성: 경쟁과 중복\n\n### 요청 경쟁과 취소 (Race Condition & Cancellation)\n\n- <strong>뭐야:<\/strong> 요청 여러 개가 동시에 나가서, 응답이 보낸 순서와 다르게 도착하는 상황이다. 취소와 키 분리는 늦게 온 옛 응답이 최신 결과를 덮지 못하게 막는 방법이다.\n- <strong>왜:<\/strong> 대비가 없으면 검색어를 \"가\"→\"가나\"로 빠르게 입력했을 때 \"가\" 응답이 늦게 도착해 \"가나\" 결과를 덮는다. 탭을 빠르게 바꾸면 이전 탭의 데이터가 잠깐 보인다.\n- <strong>어떻게:<\/strong>\n  - 원인은 \"<strong>응답 도착 순서 ≠ 요청 순서<\/strong>\"다. 마지막에 도착한 응답이 이기는 구조라면 늦게 온 옛 응답이 최신 결과를 덮는다.\n  - `useEffect`에서 직접 fetch한다면 cleanup에서 막는다. `ignore = true` 플래그를 세우거나 `AbortController.abort()`로 요청을 끊는다.\n  - TanStack Query에서는 입력이 <strong>키에 들어가 있으면<\/strong> 덮이지 않는다. 늦게 온 \"가\" 응답은 `['search','가']` 칸에 들어가고, 화면은 `['search','가나']` 칸을 보기 때문이다. 다만 queryFn이 받는 `signal`을 fetch에 넘겨야 안 쓰는 요청이 실제로 취소된다.\n  - 같은 키의 값을 낙관적으로 바꿀 때는 먼저 `cancelQueries`로 진행 중인 재조회를 끊는다.\n- <strong>핵심:<\/strong> 경쟁은 <strong>요청 순서와 응답 순서가 다를 때<\/strong> 생긴다. 해결은 <strong>취소<\/strong>하거나, 응답을 <strong>입력별 칸에 분리<\/strong>하는 것.\n- <strong>꼬리질문:<\/strong>\n  - \"abort하면 서버 작업도 취소되나요?\" → 아니다. 서버는 이미 처리했을 수 있다. 쓰기 요청의 중복은 멱등 키로 막는다.\n  - \"디바운스로 충분하지 않나요?\" → 디바운스(입력이 잠깐 멈출 때까지 기다렸다 한 번만 보내기)는 요청 수만 줄인다. 응답 순서가 뒤바뀌는 문제는 그대로 남는다. 디바운스는 비용 문제를, 취소·키 분리는 정합성(값이 맞는지) 문제를 푼다.\n- <strong>출처:<\/strong> [react.dev — Fetching data](https://react.dev/learn/you-might-not-need-an-effect#fetching-data) · [TanStack — Query Cancellation](https://tanstack.com/query/v5/docs/framework/react/guides/query-cancellation)\n\n### 중복 제출 방지와 멱등 키 (Idempotency Key)\n\n- <strong>뭐야:<\/strong> 같은 요청이 여러 번 들어와도 한 번만 처리되게 하는 장치다. <strong>멱등 키<\/strong>는 \"같은 의도\"마다 하나씩 만들어 요청에 붙이는 고유 값(보통 UUID)이다. 서버는 이미 본 키면 다시 처리하지 않고 이전 결과를 돌려준다.\n- <strong>왜:<\/strong> 같은 요청이 두 번 가는 경우는 여러 가지다. 결제·지급 버튼을 연타한다. 네트워크가 느려 사용자가 다시 누른다. 타임아웃 뒤 자동 재시도가 일어난다. 막지 않으면 서버가 같은 요청을 두 번 처리해 이중 지급이 날 수 있다.\n- <strong>어떻게:<\/strong>\n  - 1차 방어는 클라이언트가 한다. `isPending` 동안 버튼을 비활성화한다. 동기 래치(ref에 \"보내는 중\" 표시를 바로 세워 두는 것)로 같은 tick 안의 연타를 막는다. 단, 새로고침·재시도·다른 탭에서 오는 중복은 막지 못한다.\n  - 2차 방어는 서버와 맺는 약속(계약)이다. 요청에 <strong>멱등 키<\/strong>를 실어 보낸다. 서버는 같은 키를 이미 처리했으면 <strong>처리하지 않고 이전 결과를 돌려준다<\/strong>.\n  - 핵심은 키를 <strong>언제 만드는지<\/strong>다. 재시도할 때마다 새로 만들면 소용이 없다. \"사용자의 같은 의도\"에는 같은 키가 붙어야 한다. 그러려면 대상을 고른 시점에 키를 고정하거나, 요청 내용에서 항상 같은 값이 나오도록 키를 만든다.\n  - 요청 시각처럼 매번 바뀌는 값을 키에 넣으면 멱등성이 사라진다.\n  - 서버 쪽 관례(Stripe)는 이렇다. 첫 결과를 실패까지 포함해 저장해 두고, 같은 키가 오면 그 결과를 다시 응답한다. 같은 키인데 파라미터가 다르면 거절한다. 키는 24시간 이상 보관한다. 주의: `Idempotency-Key` 헤더는 IETF 초안(만료됨)이지 RFC가 아니다.\n- <strong>핵심:<\/strong> 버튼 비활성은 <strong>UX<\/strong>, 멱등 키는 <strong>정합성<\/strong>을 맡는다. 키는 <strong>같은 의도 = 같은 키<\/strong>가 되도록 생성 시점을 고정한다.\n- <strong>꼬리질문:<\/strong>\n  - \"내용 기반 키면 진짜로 두 번 하고 싶을 땐요?\" → 그대로면 두 번째 요청이 막힌다. 키에 의도 단위 값(작업 세션 ID 등)을 넣거나, 서버가 키에 유효 기간을 둔다.\n  - \"왜 서버에서 중복 검사만 하면 안 되나요?\" → 서버는 \"같은 내용의 정상적인 두 번째 요청\"과 \"재전송\"을 구분할 수 없다. 그 구분에 필요한 정보를 주는 것이 키다.\n- <strong>출처:<\/strong> [IETF — Idempotency-Key 헤더 초안](https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key-header/) · [Stripe — Idempotent requests](https://docs.stripe.com/api/idempotent_requests)\n\n> 한 줄 정리: 읽기 경쟁은 취소·키 분리로, 쓰기 중복은 같은 의도에 같은 멱등 키로.\n\n## 6. 목록 데이터: 페이지네이션\n\n### offset vs cursor (Offset / Keyset Pagination)\n\n- <strong>뭐야:<\/strong> 목록을 잘라 받는 두 방식이다. offset은 \"앞에서 몇 개 건너뛰고\"로 다음 묶음을 고른다. cursor는 \"마지막으로 본 항목 다음부터\"로 고른다.\n- <strong>왜:<\/strong> 차이를 모르고 offset만 쓰면 세 가지 문제를 겪는다. 새 글이 앞에 끼면 다음 페이지에 같은 항목이 또 나온다(중복). 항목이 삭제되면 하나를 건너뛴다(누락). 깊은 페이지일수록 느려진다.\n- <strong>어떻게:<\/strong>\n  - <strong>offset<\/strong>: `?page=5&size=20` → `OFFSET 80 LIMIT 20`. 원하는 페이지로 바로 건너뛰기와 총 건수 표시가 쉽다. 대신 DB가 앞의 80건을 세고 버려야 해서 깊은 페이지일수록 느리다. 데이터가 변하면 페이지 경계도 밀린다.\n  - <strong>cursor(keyset)<\/strong>: `?after=마지막항목의(정렬키,id)` → `WHERE (created_at, id) < (...) LIMIT 20`. 인덱스로 시작 위치를 바로 찾으므로 깊이와 상관없이 빠르다. 중간에 항목이 추가·삭제돼도 중복·누락이 없다.\n  - cursor는 정렬 키가 <strong>유일<\/strong>해야 한다. 시각만 쓰면 같은 시각의 항목이 페이지 경계에서 빠진다. 그래서 `id`를 보조 키로 붙인다.\n  - `useInfiniteQuery`는 재조회할 때 <strong>첫 페이지부터 순서대로<\/strong> 다시 받는다. 옛 커서를 다시 쓰지 않기 위해서다.\n  - cursor에는 대가가 있다. \"17페이지로 가기\"와 \"총 몇 건\"이 기본으로는 안 된다. 총 건수는 별도 count가 필요하다.\n- <strong>핵심:<\/strong> offset은 <strong>점프·총 건수<\/strong>에, cursor는 <strong>일관성·깊은 페이지 성능<\/strong>에 강하다. 정렬 키는 <strong>유일<\/strong>해야 한다.\n- <strong>꼬리질문:<\/strong>\n  - \"cursor인데 정렬 기준을 바꾸면요?\" → 커서는 정렬 키에 묶여 있어서 처음부터 다시 받아야 한다. 정렬 기준마다 인덱스도 필요하다.\n  - \"목록 일부만 받아 합계를 내면?\" → 받은 범위만 합산된다. 합계와 총 건수는 서버가 계산한다.\n- <strong>출처:<\/strong> [Use The Index, Luke — No Offset](https://use-the-index-luke.com/no-offset) · [TanStack — Infinite Queries](https://tanstack.com/query/v5/docs/framework/react/guides/infinite-queries)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"offset 방식은 앞에 새 항목이 끼면 다음 페이지에서 같은 항목이 중복되고, cursor 방식은 마지막 항목 기준으로 이어 받아 중복이 없다는 비교\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <text x=\"180\" y=\"32\" text-anchor=\"middle\" font-size=\"16\" fill=\"currentColor\">offset (page=2, size=3)<\/text>\n  <text x=\"540\" y=\"32\" text-anchor=\"middle\" font-size=\"16\" fill=\"currentColor\">cursor (after=C)<\/text>\n  <line x1=\"360\" y1=\"20\" x2=\"360\" y2=\"340\" stroke=\"var(--fig-line)\" stroke-dasharray=\"4 4\"/>\n  <text x=\"70\" y=\"64\" font-size=\"13\" fill=\"currentColor\">1페이지 받음<\/text>\n  <rect x=\"40\" y=\"74\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"80\" y=\"94\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">A<\/text>\n  <rect x=\"130\" y=\"74\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"170\" y=\"94\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">B<\/text>\n  <rect x=\"220\" y=\"74\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"260\" y=\"94\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">C<\/text>\n  <text x=\"70\" y=\"140\" font-size=\"13\" fill=\"currentColor\">그 사이 새 항목 N이 맨 앞에 추가<\/text>\n  <rect x=\"40\" y=\"150\" width=\"60\" height=\"30\" rx=\"6\" fill=\"var(--fig-accent2)\" opacity=\"0.3\" stroke=\"var(--fig-accent2)\"/>\n  <text x=\"70\" y=\"170\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">N<\/text>\n  <text x=\"125\" y=\"170\" font-size=\"14\" fill=\"currentColor\">A  B  C  D  E …<\/text>\n  <text x=\"70\" y=\"216\" font-size=\"13\" fill=\"currentColor\">2페이지 = OFFSET 3 → C, D, E<\/text>\n  <rect x=\"40\" y=\"226\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-accent2)\" opacity=\"0.35\" stroke=\"var(--fig-accent2)\"/>\n  <text x=\"80\" y=\"246\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">C 중복<\/text>\n  <rect x=\"130\" y=\"226\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"170\" y=\"246\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">D<\/text>\n  <rect x=\"220\" y=\"226\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"260\" y=\"246\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">E<\/text>\n  <text x=\"40\" y=\"290\" font-size=\"13\" fill=\"currentColor\">+ 점프·총 건수 쉬움<\/text>\n  <text x=\"40\" y=\"312\" font-size=\"13\" fill=\"currentColor\">− 변동 시 중복·누락, 깊을수록 느림<\/text>\n  <text x=\"400\" y=\"64\" font-size=\"13\" fill=\"currentColor\">1페이지 받음, 마지막 = C<\/text>\n  <rect x=\"400\" y=\"74\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"440\" y=\"94\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">A<\/text>\n  <rect x=\"490\" y=\"74\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"530\" y=\"94\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">B<\/text>\n  <rect x=\"580\" y=\"74\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-accent)\" opacity=\"0.3\" stroke=\"var(--fig-accent)\"/>\n  <text x=\"620\" y=\"94\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">C<\/text>\n  <text x=\"400\" y=\"140\" font-size=\"13\" fill=\"currentColor\">N이 앞에 추가돼도 상관없음<\/text>\n  <text x=\"400\" y=\"170\" font-size=\"14\" fill=\"currentColor\">WHERE (time, id) &lt; C의 값<\/text>\n  <text x=\"400\" y=\"216\" font-size=\"13\" fill=\"currentColor\">2페이지 → D, E, F<\/text>\n  <rect x=\"400\" y=\"226\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"440\" y=\"246\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">D<\/text>\n  <rect x=\"490\" y=\"226\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"530\" y=\"246\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">E<\/text>\n  <rect x=\"580\" y=\"226\" width=\"80\" height=\"30\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.3\" stroke=\"var(--fig-line)\"/>\n  <text x=\"620\" y=\"246\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">F<\/text>\n  <text x=\"400\" y=\"290\" font-size=\"13\" fill=\"currentColor\">+ 중복·누락 없음, 깊이 무관하게 빠름<\/text>\n  <text x=\"400\" y=\"312\" font-size=\"13\" fill=\"currentColor\">− 페이지 점프·총 건수는 따로<\/text>\n<\/svg>\n<figcaption>offset은 \"몇 번째부터\", cursor는 \"이 항목 다음부터\"를 묻는다<\/figcaption>\n<\/figure>\n\n### 무한 스크롤 vs 페이지 번호 (Infinite Scroll vs Numbered Pages)\n\n- <strong>뭐야:<\/strong> 긴 목록을 보여 주는 두 가지 UI다. 무한 스크롤은 아래로 내리면 다음 묶음이 이어 붙는다. 페이지 번호는 원하는 페이지를 골라 이동한다.\n- <strong>왜:<\/strong> 화면의 목적에 안 맞게 고르면 문제가 생긴다. 어드민 목록을 무한 스크롤로 만들면 특정 페이지로 바로 갈 수 없다. \"전체 몇 명\"도 따로 세지 않으면 알 수 없다. 불러오는 양에 상한까지 두면 목록이 아무 표시 없이 잘려서, 사용자는 그게 전부인 줄 안다.\n- <strong>어떻게:<\/strong>\n  - 기준은 <strong>사용 목적<\/strong>이다. 훑어보는 피드(채팅, 알림, 타임라인)에는 무한 스크롤이 맞다. 찾고 관리하고 비교하는 화면(어드민 표, 검색 결과)에는 페이지 번호가 맞다.\n  - 페이지 번호 목록은 <strong>페이지·필터·정렬을 URL에<\/strong> 둔다. 새로고침, 링크 공유, 뒤로 가기를 해도 같은 화면이 나와야 하기 때문이다.\n  - 페이지를 넘길 때는 이전 데이터를 화면에 유지해 깜빡임을 없앤다. 주의: v5에서는 `placeholderData: keepPreviousData`를 쓴다(v4의 `keepPreviousData: true`를 대체). 이전 데이터가 보이는 동안 \"다음\" 버튼은 `isPlaceholderData`로 막는다.\n  - 무한 스크롤은 `useInfiniteQuery`로 만든다. 주의: v5부터 `initialPageParam`이 필수다. `getNextPageParam`이 `null`/`undefined`를 돌려주면 마지막 페이지다. 목록이 길어지면 화면에 보이는 항목만 그리는 가상화([7파트 참고](#n07/긴-리스트-가상화-list-virtualization \"긴 리스트 가상화\"))를 쓰고, v5 `maxPages`로 보관하는 페이지 수를 제한한다.\n  - 어느 쪽이든 <strong>정렬·필터는 서버에서<\/strong> 한다. 받은 페이지 안에서만 정렬하면 전체를 정렬한 것처럼 보인다. 하지만 실제로는 페이지마다 따로 정렬된 결과다.\n- <strong>핵심:<\/strong> 탐색·관리 화면은 <strong>페이지 번호 + URL 상태<\/strong>, 흘려보는 피드는 <strong>무한 스크롤 + cursor<\/strong>가 맞다. 정렬·필터는 <strong>서버<\/strong>에서.\n- <strong>꼬리질문:<\/strong>\n  - \"페이지 번호면 offset 문제가 다시 오지 않나요?\" → 온다. 어드민에서는 그 변동을 감수한다. 대신 선택 상태는 id로 보존한다.\n  - \"화면 안에서 필터링하면?\" → 아직 받지 않은 페이지의 항목은 결과에서 빠진다. 사용자는 그 항목이 \"없다\"고 오해한다.\n- <strong>출처:<\/strong> [TanStack — Paginated Queries](https://tanstack.com/query/v5/docs/framework/react/guides/paginated-queries) · [TanStack — Infinite Queries](https://tanstack.com/query/v5/docs/framework/react/guides/infinite-queries)\n\n> 한 줄 정리: 찾는 화면은 페이지 번호와 URL, 흘려보는 화면은 cursor와 무한 스크롤, 정렬·필터는 서버.\n\n## 7. 클라이언트 상태의 자리\n\n### URL을 상태로 (URL as State)\n\n- <strong>뭐야:<\/strong> 탭·필터·정렬·페이지 같은 화면 상태를 컴포넌트 안이 아니라 쿼리스트링(주소의 `?` 뒤 부분)에 두는 방식이다. 이때 <strong>URL<\/strong>이 그 상태의 원본이 된다.\n- <strong>왜:<\/strong> 상태를 컴포넌트에만 두면 두 가지가 깨진다. 필터를 걸고 3페이지를 보다가 상세에 들어갔다 뒤로 오면 1페이지·필터 해제 상태로 돌아간다. 동료에게 링크를 보내도 동료는 다른 화면을 본다.\n- <strong>어떻게:<\/strong>\n  - 공유·새로고침·뒤로 가기에서 <strong>살아남아야 하는 상태<\/strong>는 쿼리스트링에 둔다. 탭, 필터, 정렬, 페이지, 검색어, 선택한 날짜가 그렇다.\n  - URL이 원본이고 컴포넌트는 `useSearchParams`로 <strong>읽기만<\/strong> 한다. 읽은 값을 `useState`에 복사하면 원본이 둘이 되므로 복사하지 않는다.\n  - 값을 바꿀 때는 히스토리에 어떻게 남길지 고른다. 필터·페이지는 `push`로 기록을 쌓아 뒤로 가기로 돌아올 수 있게 한다. 입력 중인 검색어는 `replace`로 현재 기록을 바꿔 히스토리가 지저분해지지 않게 한다.\n  - 파싱은 한 곳에서 하고 거기서 검증한다. URL은 사용자가 손으로 고칠 수 있는 <strong>외부 입력<\/strong>이다. 잘못된 page나 없는 탭이 들어올 수 있다.\n- <strong>핵심:<\/strong> \"링크로 <strong>재현<\/strong>돼야 하는 상태\"는 URL이 <strong>원본<\/strong>이다.\n- <strong>꼬리질문:<\/strong>\n  - \"모달 열림도 URL에 두나요?\" → 링크로 모달이 열려야 하면 둔다. 그러면 뒤로 가기가 모달을 닫게 된다. 그 동작이 의도한 것인지 정해야 한다.\n  - \"Next.js App Router에서 대가는?\" → 프리렌더(빌드 때 미리 그려 두는) 라우트에서 `useSearchParams`를 쓰면 가장 가까운 Suspense 경계까지가 클라이언트 렌더로 바뀐다. 감싸는 `<Suspense>`가 없으면 프로덕션 빌드가 실패한다. 서버에서는 page의 `searchParams` prop을 읽는다([4파트 참고](#n04/동적-라우트와-params-dynamic-routes-params \"동적 라우트와 params\")).\n- <strong>출처:<\/strong> [Next.js — useSearchParams](https://nextjs.org/docs/app/api-reference/functions/use-search-params)\n\n### 전역 상태 라이브러리 선택 (Context / Zustand / Jotai)\n\n- <strong>뭐야:<\/strong> 여러 컴포넌트가 함께 쓰는 클라이언트 상태를 어떤 도구에 담을지 고르는 문제다. Context는 값을 아래 컴포넌트로 전달하는 도구다. Zustand·Jotai는 필요한 조각만 구독하는 스토어다.\n- <strong>왜:<\/strong> 잘못 고르면 두 가지 문제를 겪는다. Context에 자주 바뀌는 값을 넣으면 그 값을 읽는 컴포넌트 전체가 매번 리렌더된다. 서버 데이터까지 전역 스토어에 넣으면 동기화 코드가 늘어난다.\n- <strong>어떻게:<\/strong>\n  - 먼저 전역 스토어에서 뺄 것을 뺀다. 서버 상태(→ Query), URL 상태, 폼 상태다. 이들을 빼면 남는 전역 클라이언트 상태는 적다.\n  - <strong>Context<\/strong>는 의존성 주입(필요한 값을 바깥에서 넣어 주는 것) 도구에 가깝다. `value`가 바뀌면 그 값을 읽는 <strong>모든 소비자<\/strong>가 리렌더된다. `memo`로도 막을 수 없고, 필요한 부분만 골라 구독하는 selector도 없다. 그래서 드물게 바뀌는 값(테마·로케일)에 적합하다([3파트 참고](#n03/context-리렌더-범위와-쪼개기-context-re-render-scope \"Context 리렌더 범위와 쪼개기\")).\n  - <strong>Zustand<\/strong>는 selector로 구독한다. 고른 값이 `Object.is` 비교로 달라졌을 때만 리렌더된다. 매번 새 객체를 만드는 selector에는 `useShallow`를 쓴다. React 바깥 코드에서도 스토어에 접근할 수 있다.\n  - <strong>Jotai<\/strong>는 원자(atom) 단위의 작은 상태를 조합한다. 파생 atom으로 계산값을 선언적으로 만든다. 상태가 잘게 쪼개지고 서로 의존할 때 유리하다.\n  - Redux(Toolkit)는 엄격한 액션 기록·미들웨어·디버깅 도구가 필요한 큰 팀에 맞는다.\n- <strong>핵심:<\/strong> Context는 <strong>전달 도구<\/strong>이고, 자주 바뀌는 값엔 <strong>selector 있는 스토어<\/strong>를 쓴다. 고르기 전에 <strong>서버·URL·폼 상태를 먼저 덜어낸다<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"Next.js App Router에서 모듈 전역 스토어의 위험은?\" → 서버에서는 동시에 들어온 여러 요청이 같은 모듈을 공유한다. 그래서 사용자 데이터가 서로 섞일 수 있다. Zustand 가이드도 요청마다 Provider로 스토어를 만들고, 서버 컴포넌트는 스토어를 건드리지 않게 한다.\n  - \"Context 리렌더를 줄이려면?\" → 값과 setter를 서로 다른 Context로 나눈다. value는 `useMemo`로 고정한다. 그래도 부족하면 스토어로 옮긴다.\n- <strong>출처:<\/strong> [react.dev — useContext](https://react.dev/reference/react/useContext) · [Zustand — Setup with Next.js](https://zustand.docs.pmnd.rs/learn/guides/nextjs)\n\n### 폼 상태와 검증 (Form State & Validation)\n\n- <strong>뭐야:<\/strong> 입력 중인 값, 수정 여부, 오류를 관리하고, 제출 전에 값이 규칙에 맞는지 확인하는 일이다. 클라이언트 검증은 사용자에게 빠르게 알려 주는 용도다. 최종 판정은 서버가 한다.\n- <strong>왜:<\/strong> 제대로 하지 않으면 세 가지 문제를 겪는다. 글자를 입력할 때마다 폼 전체가 리렌더된다. 서버가 거절한 내용을 어느 필드에 보여 줄지 몰라 토스트로만 띄운다. 수정 폼이 건드리지 않은 필드까지 보내서 다른 사람이 바꾼 값을 덮어쓴다.\n- <strong>어떻게:<\/strong>\n  - 비제어 기반 라이브러리(React Hook Form)는 값을 state가 아니라 DOM에 둔다. `register`가 `ref`로 입력 요소를 잡기 때문이다. 그래서 타이핑할 때마다 폼 전체가 리렌더되지 않는다. 제어 입력(값을 state로 관리하는 입력)은 `Controller`로 감싸 따로 떼어 놓는다.\n  - 검증 규칙은 스키마(Zod 등) 하나로 정의하고, 타입도 그 스키마에서 뽑는다. <strong>클라이언트 검증은 UX, 서버 검증이 진짜<\/strong>다.\n  - 서버 에러는 `setError`로 해당 필드에 연결한다. 어느 필드에도 연결할 수 없는 에러는 폼 상단에 보여 준다.\n  - 부분 수정(PATCH)은 <strong>dirty 필드만<\/strong> 보낸다. dirty 필드는 사용자가 값을 바꾼 필드다. \"미변경(키 없음)\"과 \"값 비움(`null`)\"은 구분해야 한다.\n  - 제출 중 버튼 비활성은 기본으로 한다. 중복 제출을 실제로 막는 것은 멱등 키다(5섹션).\n- <strong>핵심:<\/strong> 클라이언트 검증은 <strong>빠른 피드백<\/strong>, 서버 검증이 <strong>판정<\/strong>이다. 수정 요청은 <strong>바뀐 것만<\/strong>, \"미변경\"과 \"비움\"을 <strong>구분<\/strong>한다.\n- <strong>꼬리질문:<\/strong>\n  - \"서버 검증 규칙을 클라이언트로 옮기면 중복 아닌가요?\" → 중복은 맞다. 대신 거절될 입력을 미리 막아 비싼 단계(촬영, 결제)를 아낀다. 규칙의 기준은 서버 계약이다.\n  - \"제어 컴포넌트로 다 하면 안 되나요?\" → 필드가 적으면 괜찮다. 필드가 많으면 입력할 때마다 일어나는 리렌더가 느리게 느껴진다.\n- <strong>출처:<\/strong> [React Hook Form — FAQs](https://react-hook-form.com/faqs) · [React Hook Form — Advanced Usage](https://react-hook-form.com/advanced-usage)\n\n### 상태 머신으로 UI 상태 다루기 (Finite State Machine)\n\n- <strong>뭐야:<\/strong> 화면이 가질 수 있는 상태를 목록으로 정해 두는 방식이다. 어떤 이벤트가 오면 어느 상태로 넘어가는지(전이)도 표로 정해 둔다. 상태마다 받을 수 있는 이벤트가 정해져 있어서, 표에 없는 전이는 일어나지 않는다.\n- <strong>왜:<\/strong> 상태를 불리언으로 관리하면 `isSubmitting`·`isSuccess`·`isError`처럼 불리언이 계속 늘어난다. 그러면 \"제출 중인데 성공\" 같은 모순된 조합이 가능해진다. 완료 화면이 뜬 뒤 늦게 온 실패 응답이 화면을 되돌리기도 한다.\n- <strong>어떻게:<\/strong>\n  - 먼저 <strong>상태 목록<\/strong>을 적는다. 그리고 상태를 바꾸는 <strong>이벤트<\/strong>(입력·응답·타임아웃)를 적는다.\n  - 불리언 여러 개 대신 `status` 하나를 둬서 <strong>불가능한 상태<\/strong>를 없앤다(타입은 8파트의 판별 유니온으로 표현한다).\n  - 핵심은 <strong>전이 표<\/strong>다. (상태, 이벤트) → 다음 상태를 한 곳에 모아 적는다. 표에 없는 이벤트는 <strong>무시<\/strong>된다. 그래서 늦은 응답과 중복 클릭이 구조적으로 막힌다.\n  - 규모가 작으면 `useReducer`로 충분하다. 중첩 상태·병렬 상태·가드(전이를 허용할 조건)가 필요하면 XState 같은 statechart 도구를 쓴다.\n- <strong>핵심:<\/strong> 불리언 조합 대신 <strong>상태 하나<\/strong>로 두고, 전이는 <strong>(상태, 이벤트) → 다음 상태<\/strong> 표 한 곳에 모은다. 허용 안 된 이벤트는 <strong>무시<\/strong>된다.\n- <strong>꼬리질문:<\/strong>\n  - \"useReducer랑 뭐가 다른가요?\" → reducer는 전이를 한 곳에 모으는 그릇이다. 머신은 상태별로 허용하는 이벤트를 제한하는 규칙이다. reducer 안에서 현재 상태로 먼저 분기하면 머신이 된다.\n  - \"대가는?\" → 선언하는 코드가 늘어난다. 단계가 많은 흐름(결제·가입)에서만 이득이 크다.\n- <strong>출처:<\/strong> [react.dev — Reacting to Input with State](https://react.dev/learn/reacting-to-input-with-state) · [Stately — State machines](https://stately.ai/docs/state-machines-and-statecharts)\n\n> 한 줄 정리: 재현돼야 하면 URL, 잦은 공유 값은 selector 스토어, 입력 중이면 폼, 단계가 많으면 상태 머신, 판정은 서버.\n\n## 8. 서버 데이터의 모양과 흐름\n\n### 의존 쿼리와 요청 워터폴 (Dependent Queries & Request Waterfall)\n\n- <strong>뭐야:<\/strong> 의존 쿼리는 앞 요청의 결과가 있어야 다음 요청을 보낼 수 있는 관계다. 이런 요청이 줄줄이 이어져 하나씩 차례로 기다리는 모양을 <strong>워터폴<\/strong>이라 부른다.\n- <strong>왜:<\/strong> 관리하지 않으면 사용자 → 조직 → 설정을 차례로 받느라 첫 화면이 왕복 세 번만큼 늦다. 반대로 순서를 막아 두지 않으면 `id`가 아직 없는데 쿼리가 `undefined`를 들고 나간다.\n- <strong>어떻게:<\/strong>\n  - <strong>워터폴<\/strong>에서는 앞 요청이 끝나야 다음 요청이 시작된다. 단계마다 왕복 시간이 더해지므로 지연이 큰 망에서는 몇 배로 느려진다. 부모 컴포넌트가 요청한 뒤 자식 컴포넌트가 요청하는 순서도 같은 워터폴이다.\n  - 앞 결과가 꼭 필요하면 `enabled: !!userId`로 요청을 막아 둔다. 막힌 동안 쿼리는 `status: 'pending'`이면서 `fetchStatus: 'idle'`이다. 그래서 `isPending`만 보면 로딩 중이라고 오해한다. 조건이 여러 개면 전부 AND로 묶는다.\n  - 서로 독립인 조회는 <strong>병렬<\/strong>로 보낸다. 같은 컴포넌트에 나란히 두거나 `useQueries`를 쓴다. Suspense를 쓴다면 `useSuspenseQuery` 여러 개는 하나씩 차례로 실행된다. 이때는 `useSuspenseQueries`를 쓴다.\n  - 구조를 바꿔 푸는 방법도 있다. 쿼리를 부모로 끌어올린다. 라우트 시점에 <strong>prefetch<\/strong>(미리 받아 두기)한다. 서버 렌더링으로 조회를 서버 쪽에 옮긴다. API를 합쳐 의존 자체를 없앤다.\n- <strong>핵심:<\/strong> 워터폴 비용은 <strong>단계 수 × 왕복 지연<\/strong>이다. 독립 조회는 <strong>병렬<\/strong>, 의존은 `enabled`로 막되 <strong>API 합치기·prefetch<\/strong>로 단계를 줄인다.\n- <strong>꼬리질문:<\/strong>\n  - \"코드 스플리팅도 워터폴을 만드나요?\" → 만든다. lazy 컴포넌트는 코드를 내려받은 뒤에야 그 안의 쿼리가 시작된다. 그래서 데이터 요청을
