<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>프론트엔드 지식노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>try{var t=localStorage.getItem('fenote:ide-theme');if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
<style>
:root,[data-theme="dark"]{
  --act:#0f1114; --side:#14171b; --ed:#181b20; --tabs:#121418; --tab-on:#181b20; --panel:#15181c; --line:#2b2f36; --line2:#22262c;
  --fg:#c6cbd3; --sub:#959ca8; --faint:#656c78; --lnum:#4c535d; --lnum-cur:#c7ccd4; --cur:rgba(255,255,255,.03); --hover:rgba(255,255,255,.05); --sel:rgba(76,188,171,.12);
  --accent:#4cbcab; --accent-ink:#06201c; --status:#1b4a44; --status-fg:#dcefeb;
  --h:#f4f5f7; --strong:#eef0f3; --link:#5cc4b3; --quote:#aab0ba; --label:#8a919d;
  --kw:#e9806b; --fn:#6eb4f0; --str:#a9d38a; --tag:#e9806b; --attr:#e5c07b; --num:#c792ea; --cm:#5f6774; --codebg:rgba(255,255,255,.035); --inline-bg:rgba(255,255,255,.075);
  --fold:#252b33; --fold-dot:#7a8594; --del:#e0605a; --add-bg:rgba(76,188,171,.16); --add-fg:#c3f1e8;
  --mod:#e0605a; --mid:#e5b45a; --ok:#58c98a; --warn-bg:rgba(229,180,90,.06); --tip-bg:rgba(76,188,171,.06);
  --fig-accent:#3fb5a3; --fig-accent2:#e5a560; --fig-muted:#6b7380; --fig-line:#7d848d; --fig-bg:#14171c;
  --dir:#7d8592; --md:#5d6470;
  --seg-bg:rgba(255,255,255,.05); --seg-on:#2a2f37; --ring:0 0 0 1px rgba(255,255,255,.07); --lift:0 1px 2px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06);
}
[data-theme="light"]{
  --act:#ececee; --side:#f4f4f5; --ed:#fcfcfb; --tabs:#efeff1; --tab-on:#fcfcfb; --panel:#f4f4f5; --line:#dcdde1; --line2:#e8e9eb;
  --fg:#30343b; --sub:#5f6672; --faint:#989ea8; --lnum:#babec5; --lnum-cur:#30343b; --cur:rgba(0,0,0,.025); --hover:rgba(0,0,0,.045); --sel:rgba(29,133,116,.10);
  --accent:#1d8574; --accent-ink:#fff; --status:#1f7a6c; --status-fg:#f2fbf9;
  --h:#111418; --strong:#111418; --link:#1d8574; --quote:#4a505a; --label:#707682;
  --kw:#c2452d; --fn:#1f6fb8; --str:#3f7d1f; --tag:#c2452d; --attr:#9a6b00; --num:#8a3fb5; --cm:#9aa0a9; --codebg:rgba(0,0,0,.028); --inline-bg:rgba(0,0,0,.055);
  --fold:#e4e7ea; --fold-dot:#7e8792; --del:#cf3d36; --add-bg:rgba(29,133,116,.13); --add-fg:#0b5a4f;
  --mod:#cf3d36; --mid:#b07d0e; --ok:#1f8f52; --warn-bg:rgba(176,125,14,.06); --tip-bg:rgba(29,133,116,.06);
  --fig-accent:#1f8a7a; --fig-accent2:#c26a1d; --fig-muted:#9aa0a9; --fig-line:#7e8792; --fig-bg:#f2f3f1;
  --dir:#8a909a; --md:#a0a6af;
  --seg-bg:rgba(0,0,0,.05); --seg-on:#fff; --ring:0 0 0 1px rgba(0,0,0,.08); --lift:0 1px 2px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ed);color:var(--fg);overflow:hidden}
body{font:15px/1.5 "IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{display:block}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-ligatures:none}
.ico{width:16px;height:16px;flex:none}
.tnum{font-variant-numeric:tabular-nums}
.press{transition-property:transform,color,background-color,box-shadow;transition-duration:.15s;transition-timing-function:cubic-bezier(.2,0,0,1)}
.press:active{transform:scale(.96)}

.ide{display:grid;grid-template-columns:288px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 24px;height:100vh;height:100dvh}
.ide.noexp{grid-template-columns:minmax(0,1fr)}
.ide.noexp .explorer{display:none}


/* explorer */
.explorer{background:var(--side);box-shadow:inset -1px 0 var(--line2);overflow:auto;font:13px/1.3 "IBM Plex Sans KR",sans-serif;user-select:none;min-height:0;overscroll-behavior:contain}
.ex-title{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 8px 20px;font-size:11.5px;font-weight:600;color:var(--sub)}
.ex-title button{position:relative;color:var(--faint);height:24px;padding:0 8px;border-radius:5px;font-size:11.5px;font-weight:500}
.ex-title button::after{content:"";position:absolute;inset:-8px}
.ex-title button:hover{color:var(--fg);background:var(--hover)}
.ex-search{padding:0 12px 10px 14px}
.ex-search input{width:100%;height:30px;padding:0 10px;border:0;border-radius:6px;background:var(--seg-bg);box-shadow:var(--ring);color:var(--fg);font:13px "IBM Plex Sans KR",sans-serif}
.ex-search input::placeholder{color:var(--faint)}
.ex-search input:focus{outline:none;box-shadow:0 0 0 1px var(--accent)}
.ex-root{padding:6px 12px 4px 20px;font-weight:600;font-size:11.5px;color:var(--sub)}
.row{display:flex;align-items:center;gap:6px;height:28px;padding-right:12px;width:100%;text-align:left;white-space:nowrap;position:relative;transition:background-color .12s}
.row:hover{background:var(--hover)}
.row.on{background:var(--sel)}
.row.on .name{color:var(--h)}
.row .chev{width:12px;color:var(--faint);font-size:11px;flex:none;text-align:center}
.row .num{font:11px "JetBrains Mono",monospace;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}
.row .name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row.part .name{font-weight:500;color:var(--fg)}
.row.sec .name{color:var(--sub)}
.row .meta{margin-left:auto;color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums;flex:none}
.row .deco{margin-left:auto;width:6px;height:6px;border-radius:50%;flex:none}
.deco[data-v="no"]{background:var(--mod)} .deco[data-v="mid"]{background:var(--mid)} .deco[data-v="ok"]{background:var(--ok)}
.kids{position:relative}
.kids::before{content:"";position:absolute;top:0;bottom:0;left:var(--g);width:1px;background:var(--line2)}
body.weak-only .row.is-ok{display:none}
.ex-sec{margin-top:12px;box-shadow:inset 0 1px var(--line2)}
.prog-list{padding:0 16px 16px 20px;font-size:12px;color:var(--sub);line-height:1.6;font-variant-numeric:tabular-nums}
.prog-list .pl-row{display:flex;justify-content:space-between;gap:8px}
.prog-list .pl-row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar{height:3px;background:var(--line2);border-radius:2px;margin:5px 0 10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);width:0;border-radius:2px;transition:width .3s cubic-bezier(.2,0,0,1)}
.legend{display:flex;gap:12px;color:var(--faint);font-size:11.5px}
.legend i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.results{list-style:none;margin:0;padding:0 0 12px}
.results .r-head{padding:4px 14px 6px 20px;color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.results button{display:block;width:100%;text-align:left;padding:6px 12px 7px 20px;line-height:1.4;transition:background-color .12s}
.results button:hover{background:var(--hover)}
.results .r-file{display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden}
.results .r-file b{font-weight:500;color:var(--fg);overflow:hidden;text-overflow:ellipsis;min-width:0}
.results .r-file small{color:var(--faint);font:11px "JetBrains Mono",monospace;flex:none}
.results .r-snip{display:block;margin:2px 0 0;font-size:12px;line-height:1.5;color:var(--sub);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
mark{background:color-mix(in srgb,var(--accent) 26%,transparent);color:inherit;border-radius:2px;padding:0 1px}

/* editor */
.editor{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--ed)}
.tabbar{display:flex;flex:none;background:var(--tabs);min-width:0}
.tabs{display:flex;background:var(--tabs);overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0;min-height:36px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;height:36px;padding:0 6px 0 12px;font-size:12.5px;color:var(--faint);box-shadow:inset -1px 0 var(--line2);white-space:nowrap;position:relative;flex:none;cursor:pointer;max-width:220px;transition:color .12s}
.tab>span.t{overflow:hidden;text-overflow:ellipsis}
.tab:hover{color:var(--fg)}
.tab.on{background:var(--tab-on);color:var(--fg)}
.tab.on::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
.tab .x{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;color:var(--faint);font-size:14px;flex:none;opacity:.7}
.tab .x:hover{background:var(--hover);color:var(--fg);opacity:1}
.tab .dot{width:6px;height:6px;border-radius:50%;flex:none}
.dot[data-v="no"]{background:var(--mod)} .dot[data-v="mid"]{background:var(--mid)} .dot[data-v="ok"]{background:var(--ok)}
.expbtn{position:relative;display:inline-grid;place-items:center;width:28px;height:28px;margin-left:-6px;border-radius:6px;color:var(--sub);flex:none;transition-property:color,background-color;transition-duration:.15s;transition-timing-function:cubic-bezier(.2,0,0,1)}
.expbtn::after{content:"";position:absolute;inset:-6px}
.expbtn:hover{color:var(--fg);background:var(--hover)}
.expbtn:active{scale:.96}
.expbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.expbtn svg{width:16px;height:16px;display:block}
.expbtn .fill{fill:currentColor;opacity:.9;transition-property:opacity;transition-duration:.15s}
.expbtn[aria-expanded="false"] .fill{opacity:0}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;padding:6px 12px 6px 16px;box-shadow:inset 0 -1px var(--line2);font-size:12.5px;color:var(--sub);flex:none;min-height:44px}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 260px;overflow:hidden;white-space:nowrap}
.crumb i{font-style:normal;color:var(--faint);flex:none;font-size:11px}
.crumb .p{font:11.5px "JetBrains Mono",monospace;color:var(--faint)}
.crumb button{color:var(--sub);flex:none;transition:color .12s}
.crumb button:hover{color:var(--fg)}
.crumb b{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tools .tl{color:var(--faint);font-size:12px}
.seg{display:inline-flex;padding:2px;border-radius:7px;background:var(--seg-bg)}
.seg button{position:relative;height:24px;padding:0 10px;border-radius:5px;color:var(--sub);font-size:12px}
.seg button::after{content:"";position:absolute;inset:-8px 0}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--h);font-weight:500;box-shadow:var(--lift)}
.tsep{width:1px;height:16px;background:var(--line);margin:0 2px}
.ibtn{position:relative;height:28px;padding:0 9px;border-radius:6px;color:var(--sub);font-size:12px;white-space:nowrap}
.ibtn::after{content:"";position:absolute;inset:-6px -4px}
.ibtn:hover{color:var(--fg);background:var(--hover)}
.tocbtn{display:none;position:relative;flex:none;align-items:center;height:36px;padding:0 16px;font-size:14px;font-weight:600;color:var(--accent);box-shadow:inset -1px 0 var(--line);isolation:isolate}
.tocbtn::before{content:"";position:absolute;inset:4px 6px;border-radius:7px;background:color-mix(in srgb,var(--accent) 16%,transparent);z-index:-1;transition-property:background-color;transition-duration:.15s;transition-timing-function:cubic-bezier(.2,0,0,1)}
.tocbtn::after{content:"";position:absolute;inset:-4px 0}
.tocbtn:hover::before{background:color-mix(in srgb,var(--accent) 24%,transparent)}
.tocbtn[aria-expanded="true"]{color:var(--accent-ink)}
.tocbtn[aria-expanded="true"]::before{background:var(--accent)}
.tocbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
[data-theme="light"] .tocbtn:not([aria-expanded="true"]){color:#0f5c4f}
.ibtn[aria-pressed="true"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.scroller{overflow-y:auto;overflow-x:hidden;min-width:0;overscroll-behavior:contain}

/* document = 마크다운 미리보기 */
.file{--gut:64px;--row:28.8px;--lh:28.8px;position:relative;isolation:isolate;padding:28px 48px 96px var(--gut);max-width:calc(var(--gut) + 1120px);font-size:16px;line-height:1.8;overflow-wrap:anywhere}
.ln::before{content:"";position:absolute;left:0;right:0;z-index:-1;height:var(--lh);padding-right:calc(100% - var(--gut) + 18px);text-align:right;font:400 11px/1 "JetBrains Mono",monospace;line-height:var(--lh);color:var(--lnum);font-variant-numeric:tabular-nums;letter-spacing:0;text-indent:0;pointer-events:none;user-select:none;white-space:nowrap;background-repeat:no-repeat}
.file h3.ln::before{content:"L" attr(data-ln)}
.ln.cur::before{background-color:var(--cur)}
.ln.del::before{background-image:linear-gradient(var(--del),var(--del));background-size:2px 100%;background-position:calc(var(--gut) - 12px) 0}
.ln.hit::before{background-color:color-mix(in srgb,var(--accent) 12%,transparent)}
.concept.here h3.ln::before,.file h3.ln.cur::before{color:var(--accent)}
.file h1,.file h2,.file h3,.file h4{color:var(--h);scroll-margin-top:8px;text-wrap:balance}
.file h1{font-size:30px;line-height:40px;--lh:40px;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
.part-meta{margin:0 0 28px;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.part-meta b{color:var(--sub);font-weight:500}
.file h2{font-size:22px;line-height:32px;--lh:32px;margin:72px 0 4px;font-weight:700;letter-spacing:-.015em;padding-bottom:10px;box-shadow:inset 0 -1px var(--line2)}
.file h3{font-size:18px;line-height:30px;--lh:30px;margin:0;font-weight:600;letter-spacing:-.01em}
.file h3 .en{font-weight:400;font-size:13.5px;color:var(--faint);letter-spacing:0;margin-left:6px}
.file h4{font-size:16px;margin:20px 0 4px}
.file p{margin:8px 0;text-wrap:pretty}
.file li{text-wrap:pretty}
.file ul,.file ol{margin:6px 0;padding-left:1.3em}
.file ul{list-style:disc}
.file ul ul{list-style:circle}
.file li{margin:4px 0}
.file li::marker{color:var(--faint);font-variant-numeric:tabular-nums}
.file ol>li::marker{font-size:.9em}
.file li>p{margin:0}
.file li>ul,.file li>ol{margin:4px 0}
.file li.has-lab{list-style:none;position:relative;padding-left:7.6em;margin:10px 0}
.concept>ul{padding-left:0}
.file a{color:var(--link);text-decoration:none;transition:color .12s}
.file a:hover{text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--link) 45%,transparent);text-underline-offset:3px}
.host{margin-left:4px;color:var(--faint);font-size:11.5px;opacity:.75}
.src-sep{color:var(--faint);margin:0 6px}
.file code{font:13.5px "JetBrains Mono",monospace;font-variant-ligatures:none;color:inherit;background:var(--inline-bg);border-radius:4px;padding:1px 5px}
.file pre{position:relative;margin:12px 0;padding:0;background:var(--codebg);box-shadow:var(--ring);border-radius:8px;white-space:pre-wrap;overflow:hidden}
.file pre[data-lang]::after{content:attr(data-lang);position:absolute;top:6px;right:10px;font:10.5px "JetBrains Mono",monospace;color:var(--faint);pointer-events:none}
.file pre code{display:block;background:none;padding:12px 0;color:var(--fg);font-size:13.5px;border-radius:0}
.cl{display:block;--lh:24px;line-height:24px;padding:0 16px;min-height:24px;white-space:pre-wrap;overflow-wrap:anywhere}
.t-kw{color:var(--kw)} .t-fn{color:var(--fn)} .t-str{color:var(--str)} .t-tag{color:var(--tag)} .t-num{color:var(--num)} .t-cm{color:var(--cm);font-style:italic} .t-at{color:var(--attr)}
.file table{display:block;overflow-x:auto;border-collapse:collapse;margin:14px 0;font-size:14.5px;line-height:1.6;max-width:100%}
.file th,.file td{border-bottom:1px solid var(--line2);padding:7px 14px 7px 0;text-align:left;vertical-align:top;--lh:23.2px;overflow-wrap:break-word;word-break:keep-all}
.file td:first-child,.file th:first-child{white-space:nowrap}
.file th{color:var(--sub);font-weight:600;font-size:12.5px;line-height:23.2px;border-bottom-color:var(--line)}
.file blockquote{margin:14px 0;padding:8px 16px;border-left:2px solid var(--line);color:var(--quote);border-radius:0 6px 6px 0}
.file blockquote p{margin:2px 0}
.file blockquote.warn{border-left-color:color-mix(in srgb,var(--mid) 70%,transparent);background:var(--warn-bg)}
.file blockquote.tip{border-left-color:var(--accent);background:var(--tip-bg);color:var(--fg)}
.lab{font-size:12.5px;font-weight:600;color:var(--label);white-space:nowrap;margin-right:.55em;letter-spacing:.01em}
.lab strong{font-weight:inherit;color:inherit}
li.has-lab>.lab,li.has-lab>p:first-child>.lab{position:absolute;left:0;top:0;width:7em;line-height:var(--row);margin:0;overflow:hidden;text-overflow:ellipsis}
.file strong{color:var(--strong);font-weight:650}
.fig{margin:18px 0;padding:16px;background:var(--fig-bg);box-shadow:var(--ring);border-radius:10px;color:var(--fg);text-align:center}
.fig svg{width:100%;height:auto;max-width:720px;margin:0 auto;border-radius:4px}
.fig figcaption{font-size:13px;line-height:1.6;color:var(--sub);margin-top:10px;text-align:left;text-wrap:pretty}

/* 개념 */
.concept{padding:32px 0 8px;box-shadow:inset 0 1px var(--line2)}
.file h2+.concept,.file h2+p+.concept{box-shadow:none;padding-top:20px}
body.weak-only .concept.is-ok{display:none}
.concept-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px;margin-bottom:8px}
.concept-head h3{flex:1 1 300px;min-width:0}
.conf{display:inline-flex;flex:none;padding:2px;border-radius:7px;background:var(--seg-bg);margin-left:auto}
.conf button{position:relative;height:24px;padding:0 10px;border-radius:5px;font-size:12px;color:var(--faint)}
.conf button::after{content:"";position:absolute;inset:-8px 0}
.conf button:hover{color:var(--fg)}
.conf button[aria-pressed="true"]{background:var(--seg-on);box-shadow:var(--lift);font-weight:500}
.conf button[data-v="no"][aria-pressed="true"]{color:var(--mod)}
.conf button[data-v="mid"][aria-pressed="true"]{color:var(--mid)}
.conf button[data-v="ok"][aria-pressed="true"]{color:var(--ok)}
.fold{--lh:32px;margin:12px 0 4px}
.foldbtn{position:relative;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:7px;background:var(--seg-bg);color:var(--sub);font-size:13px}
.foldbtn::after{content:"";position:absolute;inset:-4px 0}
.foldbtn:hover{color:var(--fg);background:var(--hover)}
.foldbtn .n{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.foldbtn .more{color:var(--faint);font-size:12px}

/* 빈칸 */
.blank{border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .15s,color .15s}
body.mode-core .blank.core,body.mode-all .blank{cursor:pointer}
body.mode-core .blank.core:not(.shown),body.mode-all .blank:not(.shown){color:transparent;background:radial-gradient(circle,var(--fold-dot) 1.2px,transparent 1.7px) 4px 55%/8px 8px repeat-x,var(--fold)}
body.mode-core .blank.core:not(.shown) *,body.mode-all .blank:not(.shown) *{color:transparent;background:none;border-color:transparent}
body.mode-core .blank.core.shown,body.mode-all .blank.shown{background:var(--add-bg);color:var(--add-fg)}

.nav-foot{display:flex;gap:12px;margin-top:64px;font-size:14px;line-height:1.5}
.nav-foot button{flex:1;min-width:0;box-shadow:var(--ring);border-radius:10px;padding:12px 16px;text-align:left;color:var(--fg)}
.nav-foot button:hover{box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 60%,transparent)}
.nav-foot button:last-child{text-align:right}
.nav-foot small{display:block;color:var(--faint);font-size:12px;margin-bottom:2px}
.nav-foot span{flex:1}

/* panel — 더 파고들기 */
.panel{flex:none;height:0;overflow:hidden;box-shadow:inset 0 1px var(--line);background:var(--panel);display:flex;flex-direction:column;transition:height .22s cubic-bezier(.2,0,0,1)}
.panel.open{height:min(320px,46vh)}
.panel.resizing{transition:none}
.p-resize{position:relative;z-index:6;flex:none;height:0;outline:none;touch-action:none;cursor:row-resize}
.p-resize[hidden]{display:none}
.p-resize::before{content:"";position:absolute;left:0;right:0;top:-5px;bottom:-5px}
.p-resize::after{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--accent);opacity:0;pointer-events:none;transition-property:opacity;transition-duration:.15s;transition-timing-function:cubic-bezier(.2,0,0,1)}
.p-resize:hover::after,.p-resize:focus-visible::after,.p-resize.on::after{opacity:1}
@media (pointer:coarse){.p-resize::before{top:-10px;bottom:-6px}}
body.p-dragging{cursor:row-resize;-webkit-user-select:none;user-select:none}
body.p-dragging *{cursor:row-resize!important}
.p-head{display:flex;align-items:center;gap:2px;padding:0 6px 0 8px;height:36px;flex:none;font-size:12px}
.p-tab{padding:0 10px;height:36px;color:var(--faint);position:relative;white-space:nowrap;transition:color .12s}
.p-tab:hover{color:var(--fg)}
.p-tab.on{color:var(--fg);font-weight:500}
.p-tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:5px;height:2px;border-radius:1px;background:var(--accent)}
.p-tab .cnt{display:inline-block;margin-left:6px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--seg-bg);color:var(--sub);text-align:center;font-size:11px;line-height:17px;font-variant-numeric:tabular-nums}
.p-head .sp{flex:1}
.p-head .icon{height:28px;padding:0 9px;color:var(--faint);border-radius:6px;font-size:12px}
.p-head .icon:hover{background:var(--hover);color:var(--fg)}
.p-body{flex:1;overflow:auto;padding:2px 0 14px;overscroll-behavior:contain}
.p-pane[hidden]{display:none}
.p-empty{padding:10px 16px;font-size:13px;color:var(--faint)}
.pgroup>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:5px 14px;font-size:13px;font-weight:500;cursor:pointer;color:var(--fg);white-space:nowrap;overflow:hidden}
.pgroup>summary::-webkit-details-marker,.prob>summary::-webkit-details-marker{display:none}
.pgroup>summary .chev{color:var(--faint);width:10px;flex:none;font-size:9px;transition:transform .15s cubic-bezier(.2,0,0,1)}
.pgroup[open]>summary .chev{transform:rotate(90deg)}
.pgroup>summary .ttl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.pgroup>summary .path{color:var(--faint);font:400 11px "JetBrains Mono",monospace;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 10 auto}
.pgroup>summary .cnt{margin-left:auto;min-width:18px;padding:0 5px;border-radius:9px;background:var(--seg-bg);color:var(--sub);text-align:center;font-size:11px;font-weight:400;flex:none;font-variant-numeric:tabular-nums}
.pgroup.here>summary{color:var(--accent)}
.prob{margin-left:24px}
.prob>summary{list-style:none;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:6px;padding:5px 14px 5px 6px;font-size:14.5px;line-height:1.6;cursor:pointer;border-radius:6px;transition:background-color .12s}
.prob>summary:hover{background:var(--hover)}
.prob>summary .pi{font-size:12px;line-height:23px;color:var(--faint);text-align:center}
.prob>summary .q{min-width:0;overflow-wrap:anywhere;text-wrap:pretty}
.prob.case>summary .q{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prob.case[open]>summary .q{white-space:normal}
.prob>summary .loc{font:11px/23px "JetBrains Mono",monospace;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.prob>summary .loc:hover{color:var(--accent)}
.prob .ans{margin:2px 14px 10px 34px;padding:8px 14px;border-left:2px solid var(--accent);border-radius:0 6px 6px 0;font-size:15px;line-height:1.75;color:var(--fg);background:var(--tip-bg);overflow-wrap:anywhere;text-wrap:pretty}
.prob .ans ul{margin:4px 0;padding-left:18px}
.prob:not([open])>summary .q::after{content:"  답 보기";color:var(--faint);font-size:12px}
.prob.noans>summary .q::after{content:none}
.prob strong{color:var(--strong);font-weight:650}
.prob code{font:13px "JetBrains Mono",monospace;color:inherit;background:var(--inline-bg);border-radius:4px;padding:1px 4px}
.prob a{color:var(--link);text-decoration:none}
.prob .lab{margin-right:.4em}
/* 메모 */
.memo{padding:6px 16px 0;font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif}
.mm-head{display:flex;align-items:baseline;gap:10px;min-height:24px;font-size:12.5px}
.mm-target{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg);font-weight:500}
.mm-target .k{color:var(--faint);font-weight:400;margin-right:6px;font-variant-numeric:tabular-nums}
.mm-state{flex:none;color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums;transition:opacity .2s cubic-bezier(.2,0,0,1)}
.mm-state:empty{opacity:0}
.mm-state.err{color:var(--mod)}
#memoText{display:block;width:100%;min-height:112px;height:128px;resize:vertical;margin:6px 0 8px;padding:10px 12px;border:0;border-radius:8px;background:var(--seg-bg);box-shadow:var(--ring);color:var(--fg);font:14px/1.7 "IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;text-wrap:pretty;transition-property:box-shadow;transition-duration:.15s;transition-timing-function:cubic-bezier(.2,0,0,1)}
#memoText::placeholder{color:var(--faint)}
#memoText:focus{outline:none;box-shadow:0 0 0 1px var(--accent)}
.mm-foot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:0 -9px}
.mm-foot .sp{flex:1}
.mm-foot .n{font-variant-numeric:tabular-nums}
.mm-foot .ibtn[aria-expanded="true"]{color:var(--fg);background:var(--hover)}
.mm-list{margin:8px 0 4px;padding:4px;border-radius:10px;background:var(--seg-bg);box-shadow:var(--ring)}
.mm-item{display:block;width:100%;text-align:left;padding:7px 10px 8px;border-radius:6px;transition:background-color .12s,transform .15s cubic-bezier(.2,0,0,1)}
.mm-item:hover{background:var(--hover)}
.mm-item.on{background:var(--sel)}
.mm-item b{display:block;font-weight:500;font-size:13px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mm-item span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px;font-size:12.5px;line-height:1.55;color:var(--sub);white-space:pre-line;text-wrap:pretty;overflow-wrap:anywhere}
.mm-list .p-empty{padding:6px 10px}
.row .mk{margin-left:auto;flex:none;font-size:10.5px;color:var(--faint);opacity:.85}
.row .mk+.deco{margin-left:0}
.mbtn{position:relative;flex:none;height:24px;padding:0 8px;border-radius:5px;font-size:12px;color:var(--faint);margin-left:auto;transition-property:transform,color,background-color,opacity;transition-duration:.15s;transition-timing-function:cubic-bezier(.2,0,0,1)}
.mbtn::after{content:"";position:absolute;inset:-8px 0}
.mbtn:hover{color:var(--fg);background:var(--hover)}
.mbtn[data-has="1"]{color:var(--accent)}
.mbtn:not([data-has="1"]){opacity:0}
.concept:hover .mbtn,.concept.here .mbtn,.mbtn:focus-visible{opacity:1}
@media (hover:none){.mbtn:not([data-has="1"]){opacity:1}}
.mbtn+.conf{margin-left:0}

/* status bar */
.status{grid-column:1/-1;display:flex;align-items:stretch;background:var(--status);color:var(--status-fg);font-size:11.5px;line-height:24px;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap;min-width:0}
.status>*{padding:0 10px;display:flex;align-items:center;gap:6px;flex:none}
.status button{transition:background-color .12s}
.status button:hover{background:rgba(255,255,255,.12)}
.status .grow{flex:1;padding:0}
.status .remote{background:color-mix(in srgb,var(--status) 60%,#000);padding:0 12px}
.status .pos{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;display:block}
.status .m{font-family:"JetBrains Mono",monospace;font-size:11px}

#scrim{display:none}
@media (max-width:820px){
  .ide,.ide.noexp{grid-template-columns:minmax(0,1fr)}
  .ide.noexp .explorer{display:block}
  .tocbtn{display:flex}
  .explorer{position:fixed;z-index:20;left:0;top:36px;bottom:24px;width:min(300px,calc(100vw - 48px));transform:translateX(calc(-100% - 60px));transition:transform .22s cubic-bezier(.2,0,0,1);box-shadow:8px 0 24px rgba(0,0,0,.35)}
  body.side-open .explorer{transform:none}
  body.side-open #scrim{display:block;position:fixed;inset:36px 0 24px 0;z-index:15;background:rgba(0,0,0,.35)}
  .file{--gut:16px;--row:27.9px;padding:16px 16px 64px var(--gut);font-size:15.5px}
  .ln::before{padding-right:0}
  .file h3.ln::before{content:""}
  .ln.del::before{background-position:4px 0}
  .file h1{font-size:24px;line-height:33px;--lh:33px}
  .file h2{font-size:19.5px;line-height:29px;--lh:29px;margin-top:52px}
  .file h3{font-size:17px;line-height:27px;--lh:27px}
  .file pre code{font-size:12.5px}
  .file li.has-lab{padding-left:0}
  li.has-lab>.lab,li.has-lab>p:first-child>.lab{position:static;display:block;width:auto;line-height:1.6;margin-bottom:1px}
  .fig{padding:8px}
  .crumbs{padding:6px 10px}
  .expbtn{display:none}
  .crumb{flex-basis:100%}
  .tools .tl{display:none}
  .status .hide-m{display:none}
  .status>*{padding:0 7px}
  .prob{margin-left:6px}
  .prob .ans{margin-left:14px}
  .tab{max-width:170px}
}

/* ───── 모바일: 경로 줄 · 하단 바 · 바텀 시트 (820px 이하에만) ───── */
.mpath,.mbar,.sh-grip,.sh-title,.m-dhead{display:none}
@media (max-width:820px){
  :root{--barh:calc(56px + env(safe-area-inset-bottom,0px));--pathh:40px;--ease:cubic-bezier(.2,0,0,1)}
  .ide,.ide.noexp{grid-template-rows:minmax(0,1fr);padding-bottom:var(--barh)}
  .tabbar,.crumbs,.status,.p-resize,.p-tab,#panelMax{display:none!important}

  /* 경로 줄 */
  .mpath{display:flex;position:fixed;top:0;left:0;right:0;z-index:12;align-items:center;gap:7px;width:100%;height:calc(var(--pathh) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;background:color-mix(in srgb,var(--ed) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 -1px var(--line2);font-size:13px;color:var(--sub);text-align:left;white-space:nowrap;overflow:hidden;transition:transform .26s var(--ease)}
  body.path-hid .mpath{transform:translateY(-100%)}
  .mpath .n{font:500 12px "JetBrains Mono",monospace;font-variant-numeric:tabular-nums;color:var(--accent);flex:none}
  .mpath .pt{flex:none;color:var(--sub)}
  .mpath i{font-style:normal;color:var(--faint);flex:none}
  .mpath b{font-weight:500;color:var(--fg);overflow:hidden;text-overflow:ellipsis;min-width:0}
  .file{padding-top:calc(var(--pathh) + env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(var(--shh,0px) + 40px)}

  /* 하단 바 */
  .mbar{display:flex;gap:4px;position:fixed;left:0;right:0;bottom:0;z-index:30;height:var(--barh);padding:6px 8px env(safe-area-inset-bottom,0px);background:var(--side);box-shadow:0 -1px 0 var(--line2)}
  .mbar button{flex:1 1 0;min-width:0;height:44px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:10px;font-size:14.5px;font-weight:500;color:var(--sub);white-space:nowrap;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .mbar button[aria-pressed="true"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
  [data-theme="light"] .mbar button[aria-pressed="true"]{color:#0f5c4f}
  .mbar button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .mbar .st{display:inline-block;min-width:2em;text-align:left;font-size:13px;font-weight:600}
  .mbar button[aria-pressed="false"]:not([data-on="1"]) .st{color:var(--faint);font-weight:500}
  .mbar button[aria-pressed="false"][data-on="1"] .st{color:var(--accent)}
  [data-theme="light"] .mbar button[aria-pressed="false"][data-on="1"] .st{color:#0f5c4f}

  /* 목차 서랍 */
  .explorer{top:0;bottom:var(--barh);z-index:22;width:min(320px,calc(100vw - 56px))}
  body.side-open #scrim{inset:0 0 var(--barh) 0;z-index:21;background:rgba(0,0,0,.4)}
  .m-dhead{display:block;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 14px 20px;box-shadow:inset 0 -1px var(--line2);margin-bottom:6px}
  .m-prog{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--sub)}
  .m-prog b{font-size:20px;line-height:1;color:var(--h);font-weight:600;font-variant-numeric:tabular-nums;margin-left:6px}
  .m-prog .m-part{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;color:var(--faint)}
  .m-dhead .pbar{margin:10px 0 12px}
  .m-dtools{display:flex;gap:8px}
  .m-dtools button{height:36px;padding:0 14px;border-radius:8px;background:var(--seg-bg);font-size:13px;color:var(--sub)}
  .row{height:40px}
  .ex-search input{height:40px;font-size:16px}
  .ex-title button{height:32px}

  /* 개념 제목 줄: 자기평가는 아래 줄, 손가락 크기 */
  .concept-head{gap:10px 8px;margin-bottom:12px}
  .concept-head h3{flex:1 1 100%}
  .conf{order:1;flex:1 1 auto;margin-left:0;padding:3px;border-radius:11px}
  .conf button{flex:1 1 0;height:40px;border-radius:8px;font-size:14px}
  .conf button::after{inset:-3px 0}
  .mbtn{order:2;opacity:1!important;height:46px;padding:0 16px;margin-left:0;border-radius:11px;background:var(--seg-bg);font-size:14px;color:var(--sub)}
  .mbtn::after{inset:0}
  .foldbtn{display:flex;width:100%;height:44px;font-size:14px;border-radius:10px;padding:0 14px}
  .foldbtn .more{display:none}

  /* 바텀 시트 (기존 패널 재사용) */
  .panel{position:fixed;left:0;right:0;bottom:var(--barh);z-index:18;height:60vh;border-radius:16px 16px 0 0;background:var(--panel);box-shadow:0 -10px 32px rgba(0,0,0,.28),0 0 0 1px var(--line2);transform:translateY(calc(100% + var(--barh) + 24px));visibility:hidden;transition:transform .32s var(--ease),height .28s var(--ease),visibility 0s linear .32s}
  .panel.open{transform:none;visibility:visible;transition:transform .32s var(--ease),height .28s var(--ease),visibility 0s}
  .panel.dragging{transition:none}
  body.kb .panel{bottom:var(--kb,0px)}
  .sh-grip{display:block;position:relative;flex:none;height:22px;touch-action:none;cursor:grab}
  .sh-grip::before{content:"";position:absolute;left:50%;top:9px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
  .p-head{height:44px;padding:0 6px 0 18px;touch-action:none;gap:8px}
  .sh-title{display:flex;align-items:baseline;gap:8px;font-size:15.5px;font-weight:600;color:var(--h);min-width:0;white-space:nowrap}
  .sh-title .cnt{font-size:12.5px;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
  .p-head .icon{height:40px;padding:0 14px;font-size:14px;color:var(--sub);border-radius:8px}
  .p-body{padding:0 0 20px}
  .pgroup>summary{min-height:44px;padding:6px 16px;font-size:14px}
  .pgroup>summary .path{display:none}
  .pgroup>summary .ttl{flex:1 1 auto;white-space:nowrap}
  .prob>summary{padding:8px 14px 8px 6px;font-size:15px}
  .memo{padding:4px 16px 0}
  #memoText{font-size:16px;min-height:120px;height:136px}
  .mm-foot .ibtn{height:40px;font-size:13px}

  /* 빈칸 옵션 시트 */
  .bl-pane{padding:4px 16px 8px}
  .bl-seg{display:flex;padding:3px;border-radius:12px;background:var(--seg-bg)}
  .bl-seg button{flex:1 1 0;height:44px;border-radius:9px;font-size:15px;color:var(--sub)}
  .bl-seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--h);font-weight:600;box-shadow:var(--lift)}
  .bl-row{display:flex;gap:4px;margin:8px -10px 0}
  .bl-row button{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;border-radius:9px;font-size:14.5px;font-weight:500;color:var(--fg);transition:background-color .15s,color .15s}
  .bl-row button:active{background:var(--hover)}
  .bl-row .st{font-size:13px;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
  .bl-row button[aria-pressed="true"]{color:var(--accent)}
  [data-theme="light"] .bl-row button[aria-pressed="true"]{color:#0f5c4f}
  .bl-row button[aria-pressed="true"] .st{color:inherit;font-weight:600}
  .bl-note{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--faint);text-wrap:pretty}
}
@media (max-width:820px) and (prefers-reduced-motion:reduce){
  .mpath,.panel,.panel.open{transition:none}
}
</style>
</head>
<body>
<div class="ide" id="ide">
  <aside class="explorer" id="side" aria-label="파일 탐색기">
    <div class="m-dhead">
      <div class="m-prog"><span>앎<b id="mProg">0/0</b></span><span class="m-part" id="mProgPart"></span></div>
      <div class="pbar"><i id="mPbar"></i></div>
      <div class="m-dtools"><button class="press" id="themeBtnM">라이트</button></div>
    </div>
    <div class="ex-title"><span>탐색기</span><button id="collapseAll" class="press">모두 접기</button></div>
    <div class="ex-search"><input id="search" type="search" placeholder="검색 (예: 하이드레이션)" aria-label="개념 검색" autocomplete="off"></div>
    <div id="results" class="results" hidden></div>
    <div id="treeWrap">
      <div class="ex-root">지식노트</div>
      <div class="tree" id="tree"></div>
      <div class="ex-sec">
        <div class="ex-title"><span>진도</span></div>
        <div class="prog-list" id="progList"></div>
      </div>
    </div>
  </aside>
  <div id="scrim"></div>
  <button class="mpath" id="mpath" aria-label="현재 위치 · 목차 열기"></button>

  <section class="editor">
    <div class="tabbar">
      <button class="tocbtn press" id="tocBtn" aria-expanded="false" aria-controls="side">목차</button>
      <div class="tabs" id="tabs" role="tablist"></div>
    </div>
    <div class="crumbs">
      <button class="expbtn" id="expBtn" aria-controls="side" aria-expanded="true" aria-label="탐색기 접기 (Ctrl/⌘+B)" title="탐색기 접기 (Ctrl/⌘+B)"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor" stroke-width="1.3"/><rect class="fill" x="2.2" y="3.2" width="3.2" height="9.6" rx="1"/></svg></button>
      <div class="crumb" id="crumb"></div>
      <div class="tools">
        <span class="tl">빈칸</span>
        <div class="seg" id="blankSeg" role="group" aria-label="빈칸 모드"><button class="press" data-mode="off" aria-pressed="true" title="빈칸 끔">끔</button><button class="press" data-mode="core" aria-pressed="false" title="핵심 줄만 가리기">핵심</button><button class="press" data-mode="all" aria-pressed="false" title="핵심어 전부 가리기">전부</button></div>

<script type="application/json" id="data">[{"id": "howto", "num": "?", "title": "읽는 법", "md": "# 읽는 법\n\n<strong>이 노트는 뭐냐:<\/strong> 프론트엔드 개념을 한 곳에 모은 지식노트다. 개념마다 <strong>\"뭐야 → 왜 → 어떻게 → 핵심\"<\/strong> 순서로 읽히고, 더 깊이 파고드는 질문과 답은 접힌 칸에 따로 있다. 모든 개념에 확인한 공식 문서 링크(출처)가 붙어 있다.\n\n## 파트 구성\n\n| 파트 | 내용 | 읽는 포인트 |\n|---|---|---|\n| 1. 브라우저 | 파싱·렌더링 파이프라인·이벤트 루프·메인 스레드 | 성능·React 내용의 바닥. 여기서 막히면 나머지가 외운 말이 된다 |\n| 2. JavaScript | 스코프·클로저·this·Promise·메모리 | 실행 순서 맞히기와 stale closure가 단골 |\n| 3. React | 렌더·커밋·재조정·훅·memo·동시성 | \"memo가 왜 안 먹혔나\"까지 설명할 수 있으면 충분 |\n| 4. Next.js | SSR/SSG/ISR·하이드레이션·서버 컴포넌트·캐싱 | 버전마다 바뀌는 곳이라 '주의' 표시를 꼭 본다 |\n| 5. 데이터·상태 | 서버 상태·캐시·무효화·경쟁·멱등성·페이지네이션 | 실무에서 가장 자주 부딪히는 파트 |\n| 6. 네트워크·보안 | HTTP 캐시·CORS·쿠키·토큰 갱신·XSS/CSRF·실시간 통신 | 인증 흐름은 그림으로 설명할 수 있어야 한다 |\n| 7. 성능 | 측정·Core Web Vitals·번들·이미지·가상화 | 항상 \"어떻게 측정했나\"부터 |\n| 8. 설계·품질 | TypeScript·컴포넌트 설계·FSD·테스트·접근성 | 코드가 커질수록 비중이 커진다 |\n\n## 개념 하나의 형식\n\n- <strong>뭐야:<\/strong> 이 개념이 무엇인지 쉬운 말로. 처음 볼 때도, 복습할 때도 이 줄부터\n- <strong>왜:<\/strong> 왜 필요한지 = 이게 없거나 모르면 생기는 문제\n- <strong>어떻게:<\/strong> 원리. 비유와 짧은 코드\n- <strong>핵심:<\/strong> 외워 둘 것. 굵은 글씨가 핵심어\n- <strong>출처:<\/strong> 확인한 공식 문서 링크\n- <strong>꼬리질문:<\/strong> 한 단계 더 파고드는 질문과 짧은 답 (접힌 칸)\n- <strong>한 줄 정리:<\/strong> 섹션 끝 요약. 시간 없으면 이것만 훑는다\n\n## 쓰는 법\n\n1. <strong>처음:<\/strong> 1 → 3 → 5 순서로 읽는다(브라우저 → React → 데이터). 막히면 2.\n2. <strong>개념마다 자기 평가:<\/strong> 제목 옆 `모름 · 애매 · 앎`을 누른다. 꼬리질문까지 답할 수 있어야 `앎`이다. 기록은 각자 브라우저에만 저장된다.\n3. <strong>복습:<\/strong> 위쪽 <strong>빈칸 모드<\/strong>를 켜면 핵심어가 가려진다. 칸을 누르면 보이고 다시 누르면 가려진다.\n   - <strong>핵심:<\/strong> 핵심 줄과 키워드 모음만 가림\n   - <strong>전부:<\/strong> 모든 굵은 글씨를 가림\n4. <strong>약점만 보기:<\/strong> `애매·모름만` 필터를 켜면 아직 못 넘은 개념만 남는다.\n5. <strong>빠른 복습:<\/strong> 각 파트 맨 아래 <strong>핵심 키워드 모음<\/strong>만 훑는다.\n\n> 주의: React·Next.js·Core Web Vitals는 버전마다 바뀐다. '주의' 표시가 붙은 내용은 기준 버전을 확인하고 공식 문서로 최신 여부를 본다.\n\n> 주의: AI와 함께 정리하고 공식 문서로 검수한 노트지만 틀린 곳이 있을 수 있다. 이상한 곳을 발견하면 알려 주세요.\n"}, {"id": "n01", "num": "1", "title": "브라우저는 어떻게 화면을 그리나", "md": "# 1. 브라우저는 어떻게 화면을 그리나\n\n<strong>이 파트는 뭐냐:<\/strong> \"URL을 쳤는데 왜 늦게 뜨나\", \"왜 버벅이나\", \"왜 클릭이 안 먹나\"를 설명하는 영역. 한 줄 요약 — 브라우저는 <strong>메인 스레드 하나<\/strong>로 JS 실행과 렌더링 작업(스타일·레이아웃·페인트)을 번갈아 하고(합성은 별도 스레드), 버벅임·반응 지연의 대부분은 그 한 스레드를 누가 얼마나 오래 잡느냐다.\n\n## 1. 첫 화면이 뜨기까지\n\n### URL 입력부터 첫 픽셀까지 (Navigation to First Paint)\n\n- <strong>뭐야:<\/strong> 주소창에 URL을 친 순간부터 화면에 첫 픽셀이 그려질 때까지 브라우저가 거치는 단계 전체다. 서버를 찾아 연결하고 HTML을 받는 <strong>네트워크 단계<\/strong>와, 받은 문서를 해석해 그리는 문서 처리 단계로 나뉜다.\n- <strong>왜:<\/strong> 이 흐름을 모르면 \"첫 화면이 하얗게 오래 있다\"는 제보를 받아도 원인을 가를 수 없다. 네트워크 문제인지, 서버 문제인지, 렌더 차단 자원 문제인지 단계별로 갈라야 원인이 보인다.\n- <strong>어떻게:<\/strong>\n  - <strong>네트워크 단계<\/strong> — DNS 조회 → TCP 연결 → TLS 핸드셰이크 → HTTP 요청 → 첫 바이트 도착(TTFB). 캐시(HTTP 캐시·Service Worker)가 맞으면 이 단계를 건너뛴다\n  - <strong>문서 처리 단계<\/strong> — HTML을 받으면서(스트리밍) 파싱 시작 → 하위 자원(CSS·JS·이미지·폰트) 요청 → DOM·CSSOM → 렌더 트리 → Layout → Paint → Composite\n  - DevTools Network의 Timing 탭에서 Queueing·Stalled·DNS Lookup·Initial connection·Waiting (TTFB)·Content Download 등으로 쪼개 볼 수 있다\n  - SSR은 첫 페인트가 빠르지만 hydration 전까지 클릭이 안 먹는 구간이 생긴다 (4파트 참고)\n- <strong>핵심:<\/strong> 빈 화면 시간은 주로 <strong>TTFB<\/strong> + <strong>렌더 차단 자원<\/strong>(CSS, 동기 스크립트) 대기에서 나온다. 측정 지표로 보면 FCP·LCP가 그림이 늦은 것, <strong>INP<\/strong>가 반응이 늦은 것.\n- <strong>꼬리질문:<\/strong>\n  - \"TTFB가 짧은데도 하얗게 오래 있으면?\" → 서버는 빨랐다는 뜻이니 렌더 차단 CSS, `<head>`의 동기 스크립트, 웹폰트 대기(FOIT)를 본다.\n  - \"preconnect는 이 중 어디를 줄이나?\" → DNS·TCP·TLS 연결 비용만 미리 치른다. 요청 자체를 당기지는 않는다.\n- <strong>출처:<\/strong> [MDN — How browsers work](https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/How_browsers_work#navigation) · [Chrome DevTools — Network reference](https://developer.chrome.com/docs/devtools/network/reference#timing-explanation)\n\n### HTML 파싱과 DOM·CSSOM (Parsing, DOM, CSSOM)\n\n- <strong>뭐야:<\/strong> 브라우저가 받은 HTML 글자를 노드 트리(DOM)로, CSS를 스타일 규칙 트리(CSSOM)로 바꾸는 과정이다. 둘이 있어야 무엇을 어떤 모양으로 그릴지 정해진다.\n- <strong>왜:<\/strong> 이 과정에서 CSS는 화면 그리기를, 동기 스크립트는 파싱을 멈춰 세운다. 그래서 CSS가 크면 첫 화면이 늦고, `<head>`에 둔 스크립트가 아직 없는 DOM을 찾다 `null`이 난다.\n- <strong>어떻게:<\/strong>\n  - HTML은 바이트 → 문자 → 토큰 → 노드 → <strong>DOM 트리<\/strong>로 점진적으로 만들어진다. 받는 대로 파싱한다\n  - CSS는 <strong>CSSOM<\/strong>으로 만든다. 캐스케이드 때문에 뒤 규칙이 앞 규칙을 덮을 수 있어 파일을 다 받아야 확정된다 → <strong>렌더 차단(render-blocking)<\/strong>\n  - 동기 `<script>`는 DOM을 바꿀 수 있어 만나면 파싱을 멈춘다 → <strong>파서 차단(parser-blocking)<\/strong>. 게다가 스크립트가 스타일을 읽을 수 있으니 앞선 CSS가 끝날 때까지 실행도 기다린다\n  - 프리로드 스캐너(preload scanner)가 파서가 멈춘 동안에도 HTML을 앞서 훑어 마크업에 적힌 CSS·JS·이미지 요청을 미리 보낸다(CSS 안의 폰트·배경 이미지는 못 찾는다)\n- <strong>핵심:<\/strong> <strong>CSS = 렌더 차단<\/strong>, <strong>동기 JS = 파서 차단<\/strong>. 둘은 막는 대상이 다르다. 그리고 CSS 다운로드가 늦으면 그 뒤 동기 JS 실행까지 밀린다.\n- <strong>꼬리질문:<\/strong>\n  - \"CSS가 렌더를 막는 게 손해 아닌가?\" → 스타일 없이 먼저 그리면 FOUC(스타일 없는 깜빡임)가 나고 전부 다시 그려야 한다. 대신 첫 화면에 필요한 것만 남기고(Critical CSS) 나머지는 미룬다.\n  - \"`media=\"print\"` 링크도 렌더를 막나?\" → 조건이 지금 화면에 안 맞으면 다운로드는 하되(낮은 우선순위) 렌더를 막지 않는다.\n- <strong>출처:<\/strong> [MDN — How browsers work: Parsing](https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/How_browsers_work#parsing) · [web.dev — Render-blocking CSS](https://web.dev/articles/critical-rendering-path/render-blocking-css)\n\n### script의 defer·async·module (Script Loading)\n\n- <strong>뭐야:<\/strong> `<script>` 태그를 언제 내려받고 언제 실행할지 정하는 속성들이다. 기본은 만나는 즉시 HTML 파싱을 멈추고 실행하고, `defer`·`async`·`type=\"module\"`은 이 시점을 바꾼다.\n- <strong>왜:<\/strong> 시점을 잘못 고르면 분석 스크립트 하나가 첫 화면을 늦춘다. 반대로 무작정 `async`로 바꾸면 실행 순서 보장이 사라져, 의존 대상보다 먼저 실행된 스크립트에서 `is not defined` 같은 에러가 날 수 있다.\n- <strong>어떻게:<\/strong>\n  - <strong>기본<\/strong> — 만나면 파싱 멈춤 → 다운로드 → 실행 → 파싱 재개\n  - <strong>`defer`<\/strong> — 다운로드는 파싱과 병렬, 실행은 파싱이 끝난 뒤 <strong>문서 순서대로<\/strong>, `DOMContentLoaded` 직전\n  - <strong>`async`<\/strong> — 다운로드는 병렬, <strong>받자마자 실행<\/strong>(그 순간 파싱을 끊음), 순서 보장 없음\n  - <strong>`type=\"module\"`<\/strong> — 기본이 `defer`처럼 동작하고 `defer` 속성은 아무 효과가 없다. `async`를 붙이면 받는 대로 실행. 같은 모듈은 한 번만 실행되고 strict mode가 기본이다\n  - 인라인 클래식 스크립트에는 `defer`·`async`가 효과 없다. 모듈은 인라인이어도 `async`가 먹는다\n- <strong>핵심:<\/strong> 기본 선택은 <strong>`defer`<\/strong>. 다른 코드와 무관한 독립 스크립트(분석·광고)만 <strong>`async`<\/strong>. 모듈은 이미 지연 실행이다.\n- <strong>꼬리질문:<\/strong>\n  - \"인라인 스크립트를 일부러 `<head>`에 넣을 때는?\" → 다른 청크보다 <strong>먼저<\/strong> 돌아야 하는 경우. 다크 모드 깜빡임 방지(첫 페인트 전 클래스 지정), 청크 로딩 실패 복구 같은 것.\n  - \"`DOMContentLoaded`와 `load`의 차이는?\" → 전자는 HTML 파싱과 defer 스크립트까지 끝난 시점, 후자는 이미지·스타일 등 하위 자원까지 다 받은 시점.\n- <strong>출처:<\/strong> [MDN — script 요소](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script) · [HTML Standard — async·defer 속성](https://html.spec.whatwg.org/multipage/scripting.html#attr-script-async)\n\n> 한 줄 정리: 첫 화면을 늦추는 건 서버 응답(TTFB)과 렌더 차단 CSS·파서 차단 JS이고, 스크립트는 기본이 `defer`다.\n\n## 2. 렌더링 파이프라인\n\n### 렌더 트리·레이아웃·페인트·합성 (Rendering Pipeline)\n\n- <strong>뭐야:<\/strong> 스타일 계산(Style) → 위치·크기 계산(Layout) → 그리기 명령 생성(Paint) → 레이어 합치기(Composite)로 이어지는, 브라우저가 화면 한 장을 만드는 공정이다. 공장 라인처럼 앞 단계가 다시 돌면 뒤 단계도 다시 거친다.\n- <strong>왜:<\/strong> 바꾼 속성에 따라 이 라인의 어디서부터 다시 도는지가 달라 비용이 갈린다. 이걸 모르면 애니메이션이 끊길 때 원인을 못 찾는다. `left`와 `transform`은 같아 보여도 비용이 다르다.\n- <strong>어떻게:<\/strong>\n  - <strong>Style<\/strong> — DOM과 CSSOM을 합쳐 요소마다 최종 스타일 계산. `display: none`은 렌더 트리에서 빠지고 `visibility: hidden`은 자리를 차지한 채 남는다\n  - <strong>Layout<\/strong> — 박스 위치·크기 계산. 한 요소가 커지면 형제·부모까지 흔들릴 수 있다\n  - <strong>Paint<\/strong> — 레이어마다 그리기 명령 목록 생성(래스터화는 이후)\n  - <strong>Composite<\/strong> — 레이어를 합쳐 화면에 올림. <strong>컴포지터 스레드<\/strong>에서 돈다\n  - 비싼 순서: <strong>Layout > Paint > Composite<\/strong>\n- <strong>핵심:<\/strong> 바꾼 속성에 따라 재시작 지점이 다르다. 크기·위치(`width`, `left`, `top`) → <strong>Layout부터<\/strong>, 색(`color`, `background`) → <strong>Paint부터<\/strong>, <strong>`transform`·`opacity`<\/strong> → <strong>Composite만<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"`display: none`과 `visibility: hidden`을 토글하면 각각 어디부터?\" → 전자는 박스가 생기고 사라지니 Layout부터, 후자는 자리는 그대로라 Paint부터.\n- <strong>출처:<\/strong> [web.dev — Rendering performance](https://web.dev/articles/rendering-performance) · [MDN — How browsers work: Render](https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/How_browsers_work#render)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 340\" role=\"img\" aria-label=\"HTML과 CSS가 DOM과 CSSOM을 거쳐 Style, Layout, Paint, Composite로 이어지고, 바꾼 속성에 따라 재시작 지점이 달라지는 렌더링 파이프라인\">\n  <defs>\n    <marker id=\"a1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--fig-line)\"/><\/marker>\n  <\/defs>\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"340\" fill=\"var(--fig-bg)\"/>\n  <rect x=\"20\" y=\"30\" width=\"90\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <text x=\"65\" y=\"55\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">HTML<\/text>\n  <rect x=\"20\" y=\"110\" width=\"90\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <text x=\"65\" y=\"135\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">CSS<\/text>\n  <rect x=\"140\" y=\"30\" width=\"90\" height=\"40\" rx=\"6\" fill=\"var(--fig-muted)\" stroke=\"var(--fig-line)\"/>\n  <text x=\"185\" y=\"55\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">DOM<\/text>\n  <rect x=\"140\" y=\"110\" width=\"90\" height=\"40\" rx=\"6\" fill=\"var(--fig-muted)\" stroke=\"var(--fig-line)\"/>\n  <text x=\"185\" y=\"135\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">CSSOM<\/text>\n  <line x1=\"110\" y1=\"50\" x2=\"138\" y2=\"50\" stroke=\"var(--fig-line)\" marker-end=\"url(#a1)\"/>\n  <line x1=\"110\" y1=\"130\" x2=\"138\" y2=\"130\" stroke=\"var(--fig-line)\" marker-end=\"url(#a1)\"/>\n  <line x1=\"230\" y1=\"50\" x2=\"268\" y2=\"85\" stroke=\"var(--fig-line)\" marker-end=\"url(#a1)\"/>\n  <line x1=\"230\" y1=\"130\" x2=\"268\" y2=\"95\" stroke=\"var(--fig-line)\" marker-end=\"url(#a1)\"/>\n  <rect x=\"270\" y=\"70\" width=\"90\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"315\" y=\"95\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Style<\/text>\n  <rect x=\"385\" y=\"70\" width=\"90\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"430\" y=\"95\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Layout<\/text>\n  <rect x=\"500\" y=\"70\" width=\"90\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"545\" y=\"95\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Paint<\/text>\n  <rect x=\"615\" y=\"70\" width=\"95\" height=\"40\" rx=\"6\" fill=\"var(--fig-accent2)\" stroke=\"var(--fig-line)\"/>\n  <text x=\"662\" y=\"95\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Composite<\/text>\n  <line x1=\"360\" y1=\"90\" x2=\"383\" y2=\"90\" stroke=\"var(--fig-line)\" marker-end=\"url(#a1)\"/>\n  <line x1=\"475\" y1=\"90\" x2=\"498\" y2=\"90\" stroke=\"var(--fig-line)\" marker-end=\"url(#a1)\"/>\n  <line x1=\"590\" y1=\"90\" x2=\"613\" y2=\"90\" stroke=\"var(--fig-line)\" marker-end=\"url(#a1)\"/>\n  <text x=\"270\" y=\"140\" font-size=\"13\" fill=\"currentColor\">메인 스레드<\/text>\n  <text x=\"615\" y=\"140\" font-size=\"13\" fill=\"currentColor\">컴포지터 스레드<\/text>\n  <line x1=\"430\" y1=\"250\" x2=\"430\" y2=\"114\" stroke=\"var(--fig-accent)\" marker-end=\"url(#a1)\"/>\n  <text x=\"430\" y=\"272\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">width · left · top<\/text>\n  <text x=\"430\" y=\"292\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">Layout부터 전부 (리플로우)<\/text>\n  <line x1=\"545\" y1=\"200\" x2=\"545\" y2=\"114\" stroke=\"var(--fig-accent)\" marker-end=\"url(#a1)\"/>\n  <text x=\"545\" y=\"220\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">color · background<\/text>\n  <text x=\"545\" y=\"240\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">Paint부터 (리페인트)<\/text>\n  <line x1=\"662\" y1=\"250\" x2=\"662\" y2=\"114\" stroke=\"var(--fig-accent2)\" marker-end=\"url(#a1)\"/>\n  <text x=\"662\" y=\"272\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">transform · opacity<\/text>\n  <text x=\"662\" y=\"292\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">Composite만<\/text>\n<\/svg>\n<figcaption>바꾼 속성이 파이프라인 어디로 들어오느냐가 비용을 정한다<\/figcaption>\n<\/figure>\n\n### 리플로우·리페인트와 강제 동기 레이아웃 (Reflow, Repaint, Forced Synchronous Layout)\n\n- <strong>뭐야:<\/strong> 리플로우는 레이아웃(위치·크기)을 다시 계산하는 것, 리페인트는 다시 그리는 것이다. 강제 동기 레이아웃은 스타일을 바꾼 직후 크기를 읽어서, 브라우저가 나중에 몰아 하려던 레이아웃 계산을 그 자리에서 하게 만드는 상황이다.\n- <strong>왜:<\/strong> 루프 안에서 쓰기와 읽기가 번갈아 나오면 매 회 레이아웃이 돈다. 항목마다 높이를 재고 스타일을 바꾸는 루프에서 프레임이 끊기고, Performance 탭에 \"Forced reflow\" 경고가 줄줄이 뜨는 게 이 경우다.\n- <strong>어떻게:<\/strong>\n  - 브라우저는 게으르다. 스타일을 바꾸면 레이아웃을 <strong>나중에 한 번에<\/strong> 하려고 더티 표시만 해 둔다\n  - 그런데 바로 뒤에 `offsetHeight`, `getBoundingClientRect()`, `scrollTop`, `getComputedStyle()`의 레이아웃 의존 값(width 등)을 읽으면 정확한 값을 주려고 <strong>그 자리에서<\/strong> 레이아웃을 끝낸다 → 강제 동기 레이아웃\n  - 루프 안에서 쓰기·읽기가 번갈아 나오면 매 회 레이아웃이 돈다 → <strong>레이아웃 스래싱(layout thrashing)<\/strong>\n  - 해법: <strong>읽기를 먼저 몰고 쓰기를 뒤로 몬다.<\/strong> 측정은 레이아웃이 바뀔 때만(ResizeObserver 등)\n  - 범위 줄이기: `position: absolute`로 흐름에서 빼기, `contain: layout`, 화면 밖 목록엔 `content-visibility: auto` + `contain-intrinsic-size`\n  ```js\n  // 나쁨: N번 레이아웃\n  items.forEach(el => { el.style.width = \"100px\"; hs.push(el.offsetHeight); });\n  // 좋음: 읽기 전부 → 쓰기 전부, 레이아웃 1번\n  const hs = items.map(el => el.offsetHeight);\n  items.forEach((el, i) => { el.style.height = hs[i] + \"px\"; });\n  ```\n- <strong>핵심:<\/strong> 읽기가 비싼 게 아니라 <strong>밀린 쓰기 뒤의 읽기<\/strong>가 비싸다. <strong>읽기→쓰기 순서<\/strong>로 묶는다.\n- <strong>꼬리질문:<\/strong>\n  - \"React면 신경 안 써도 되나?\" → DOM 갱신은 React가 모아 주지만 `useLayoutEffect`·ref로 직접 재는 코드(툴팁 위치, 자동 높이)는 그대로 강제 레이아웃을 부른다.\n  - \"ResizeObserver면 항상 안전한가?\" → 마운트 직후 숨겨진 탭 안이면 폭이 0으로 들어온다. 0을 유효 값으로 받아 그대로 굳히면 안 된다.\n- <strong>출처:<\/strong> [web.dev — Layout thrashing](https://web.dev/articles/avoid-large-complex-layouts-and-layout-thrashing)\n\n### transform·opacity와 합성 레이어 (Compositing Layers, will-change)\n\n- <strong>뭐야:<\/strong> 브라우저는 화면을 레이어로 나눠 그린 뒤 합쳐 올리는데, `transform`·`opacity`는 이미 그려진 레이어를 옮기고 섞기만 하는 속성이라, CSS 애니메이션·트랜지션으로 바꾸면 메인 스레드가 아닌 컴포지터 스레드가 처리할 수 있다. `will-change`는 곧 움직일 요소를 미리 레이어로 빼 두라는 힌트다.\n- <strong>왜:<\/strong> 다른 속성으로 애니메이션을 만들면 메인 스레드에 묶인다. 그러면 JS가 바쁜 순간(파싱, 리렌더 폭주)에 바텀시트 애니메이션까지 같이 멈춘다.\n- <strong>어떻게:<\/strong>\n  - 컴포지터는 이미 그려진 레이어를 <strong>옮기고(transform) 섞기만(opacity)<\/strong> 하므로 Layout·Paint를 건너뛴다\n  - 컴포지터 스레드는 메인과 별개라 JS가 막혀도 `transform`·`opacity` 애니메이션은 돈다(CSS·Web Animations일 때. rAF로 JS가 매 프레임 값을 쓰면 메인에 묶인다)\n  - `will-change: transform`은 \"곧 움직일 테니 레이어로 빼 둬\" 힌트. 레이어마다 GPU 메모리를 먹는다\n- <strong>핵심:<\/strong> 애니메이션은 <strong>`transform`·`opacity`만<\/strong>. 이유는 \"빨라서\"보다 <strong>다른 스레드에 맡겨져서<\/strong>다. `will-change`는 <strong>남발 금지<\/strong>, 움직이기 직전에 붙이고 끝나면 뗀다.\n- <strong>꼬리질문:<\/strong>\n  - \"레이어를 많이 만들면 왜 느려지나?\" → 레이어마다 메모리·GPU 업로드 비용이 든다. 의도치 않은 승격(layer explosion)이 겹치면 합성 자체가 무거워지고 모바일에서 먼저 터진다.\n  - \"`transform`으로 옮기면 주변 요소 자리는?\" → 레이아웃상 자리는 원래 위치 그대로다. 시각적으로만 움직인다. 다른 요소를 밀어내야 하면 <strong>FLIP<\/strong>(First-Last-Invert-Play)으로 레이아웃 1회 + transform 애니메이션으로 바꾼다.\n- <strong>출처:<\/strong> [web.dev — Compositor-only properties](https://web.dev/articles/stick-to-compositor-only-properties-and-manage-layer-count) · [MDN — will-change](https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/will-change)\n\n> 한 줄 정리: 무엇을 바꾸느냐가 비용을 정하고, 쓰기 뒤 읽기가 강제 레이아웃을 부르며, 애니메이션은 컴포지터에 맡긴다.\n\n## 3. 이벤트 루프와 메인 스레드\n\n### 이벤트 루프 (Event Loop: Task, Microtask, Rendering)\n\n- <strong>뭐야:<\/strong> 메인 스레드 하나가 할 일을 순서대로 꺼내 처리하는 반복 규칙이다. 태스크 하나를 실행하고, 마이크로태스크(Promise 콜백 등)를 전부 비우고, 렌더링 기회가 오면 화면을 그리는 바퀴를 계속 돈다.\n- <strong>왜:<\/strong> 이 순서를 모르면 \"왜 setTimeout 0보다 then이 먼저 찍히나\" 같은 실행 순서를 설명하지 못한다. `Promise.then` 체인이 이어지며 화면이 멈추는 것도 마이크로태스크를 전부 비워야 렌더로 넘어가는 규칙 때문이다.\n- <strong>어떻게:<\/strong>\n  - 루프 한 바퀴: <strong>태스크 하나<\/strong> 실행(스택이 빌 때까지) → <strong>마이크로태스크 큐를 전부 비움<\/strong>(태스크 끝뿐 아니라 리스너 등 콜백이 끝나 스택이 빌 때마다) → (렌더링 기회가 오면) rAF 콜백 → Style → Layout → Paint\n  - <strong>태스크(macrotask)<\/strong>: `setTimeout`·`setInterval`, 사용자 입력 이벤트, `MessageChannel`, XHR `load` 같은 네트워크 이벤트 등(`fetch`의 `then`은 마이크로태스크). 큐는 종류별로 여러 개라 단일 FIFO가 아니고, 어느 큐에서 꺼낼지는 브라우저가 고른다\n  - <strong>마이크로태스크<\/strong>: `Promise.then/catch/finally`, `await` 이후 재개, `queueMicrotask`, `MutationObserver`\n  - 렌더링은 매 태스크마다가 아니라 <strong>디스플레이 주기(보통 60Hz면 약 16.7ms)<\/strong> 에 맞춰 기회가 온다\n  - 마이크로태스크 중에 마이크로태스크를 또 넣으면 그것까지 다 비워야 다음으로 넘어간다 → 무한 체인은 렌더링을 굶긴다\n- <strong>핵심:<\/strong> 순서는 <strong>동기 코드 → 마이크로태스크 전부 → 렌더(rAF 포함) → 다음 태스크<\/strong>. 마이크로태스크는 <strong>끼어들 틈 없이 전부<\/strong> 비운다.\n- <strong>꼬리질문:<\/strong>\n  - \"`setTimeout(fn, 0)`은 정말 0ms 뒤인가?\" → 최소 지연일 뿐, 앞 작업이 끝나야 돈다. 중첩이 <strong>5단계<\/strong>에 이르면 4ms 하한. 주의: 숨긴 탭: Firefox 데스크톱 최소 1초, Chrome은 1초 단위로 묶고 88부터 5분 넘게 숨긴 연쇄 타이머는 1분 단위(intensive throttling).\n  - \"작업을 쪼갤 때 `queueMicrotask`로 쪼개면?\" → 안 된다. 렌더 전에 전부 비우므로 틈이 안 생긴다. 태스크(`setTimeout`, `MessageChannel`, `scheduler.yield`)로 넘긴다. 주의: `scheduler.yield`는 Chrome·Edge 129+, Firefox 142+, Safari 미지원(web.dev 기준)이라 `setTimeout` 폴백을 둔다.\n  - \"타이머로 경과 시간을 세면 왜 틀어지나?\" → 콜백이 밀리고, 백그라운드에서 늦춰지고, 기기가 잠들면 멈춘다. 경과 시간은 콜백 횟수가 아니라 <strong>기준 시각과의 차이<\/strong>로 계산한다.\n- <strong>출처:<\/strong> [MDN — Using microtasks](https://developer.mozilla.org/en-US/docs/Web/API/HTML_DOM_API/Microtask_guide) · [MDN — setTimeout: 비활성 탭의 지연](https://developer.mozilla.org/en-US/docs/Web/API/Window/setTimeout#timeouts_in_inactive_tabs)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"이벤트 루프 한 바퀴: 태스크 하나를 실행하고, 마이크로태스크 큐를 전부 비우고, 렌더링 기회가 오면 rAF와 스타일, 레이아웃, 페인트를 수행한 뒤 다음 태스크로 돌아간다\">\n  <defs>\n    <marker id=\"a2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--fig-line)\"/><\/marker>\n  <\/defs>\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <rect x=\"20\" y=\"40\" width=\"180\" height=\"120\" rx=\"8\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <text x=\"110\" y=\"64\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">태스크 큐 (여러 개)<\/text>\n  <text x=\"110\" y=\"92\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">setTimeout · 클릭<\/text>\n  <text x=\"110\" y=\"114\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">MessageChannel<\/text>\n  <text x=\"110\" y=\"136\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">네트워크 이벤트<\/text>\n  <rect x=\"20\" y=\"200\" width=\"180\" height=\"120\" rx=\"8\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <text x=\"110\" y=\"224\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">마이크로태스크 큐<\/text>\n  <text x=\"110\" y=\"252\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">Promise.then · await<\/text>\n  <text x=\"110\" y=\"274\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">queueMicrotask<\/text>\n  <text x=\"110\" y=\"296\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">MutationObserver<\/text>\n  <rect x=\"270\" y=\"40\" width=\"180\" height=\"60\" rx=\"8\" fill=\"var(--fig-muted)\" stroke=\"var(--fig-line)\"/>\n  <text x=\"360\" y=\"66\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">① 태스크 하나 실행<\/text>\n  <text x=\"360\" y=\"86\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">콜 스택이 빌 때까지<\/text>\n  <rect x=\"270\" y=\"150\" width=\"180\" height=\"60\" rx=\"8\" fill=\"var(--fig-muted)\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"360\" y=\"176\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">② 마이크로태스크<\/text>\n  <text x=\"360\" y=\"196\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">빌 때까지 전부<\/text>\n  <rect x=\"270\" y=\"260\" width=\"180\" height=\"60\" rx=\"8\" fill=\"var(--fig-muted)\" stroke=\"var(--fig-accent2)\" stroke-width=\"2\"/>\n  <text x=\"360\" y=\"286\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">③ 렌더링 기회?<\/text>\n  <text x=\"360\" y=\"306\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">약 16.7ms마다 (60Hz)<\/text>\n  <line x1=\"200\" y1=\"80\" x2=\"268\" y2=\"70\" stroke=\"var(--fig-line)\" marker-end=\"url(#a2)\"/>\n  <text x=\"234\" y=\"62\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">1개<\/text>\n  <line x1=\"200\" y1=\"250\" x2=\"268\" y2=\"190\" stroke=\"var(--fig-line)\" marker-end=\"url(#a2)\"/>\n  <text x=\"222\" y=\"208\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">전부<\/text>\n  <line x1=\"360\" y1=\"100\" x2=\"360\" y2=\"148\" stroke=\"var(--fig-line)\" marker-end=\"url(#a2)\"/>\n  <line x1=\"360\" y1=\"210\" x2=\"360\" y2=\"258\" stroke=\"var(--fig-line)\" marker-end=\"url(#a2)\"/>\n  <rect x=\"500\" y=\"230\" width=\"200\" height=\"120\" rx=\"8\" fill=\"none\" stroke=\"var(--fig-accent2)\"/>\n  <text x=\"600\" y=\"256\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">rAF 콜백<\/text>\n  <text x=\"600\" y=\"280\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Style → Layout<\/text>\n  <text x=\"600\" y=\"304\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Paint → Composite<\/text>\n  <text x=\"600\" y=\"330\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">기회 없으면 건너뜀<\/text>\n  <line x1=\"450\" y1=\"290\" x2=\"498\" y2=\"290\" stroke=\"var(--fig-line)\" marker-end=\"url(#a2)\"/>\n  <path d=\"M600,230 C600,120 560,70 452,70\" fill=\"none\" stroke=\"var(--fig-line)\" stroke-dasharray=\"5 4\" marker-end=\"url(#a2)\"/>\n  <text x=\"610\" y=\"130\" font-size=\"13\" fill=\"currentColor\">다음 바퀴<\/text>\n<\/svg>\n<figcaption>태스크는 한 번에 하나, 마이크로태스크는 한 번에 전부, 렌더는 주기마다 한 번<\/figcaption>\n<\/figure>\n\n### requestAnimationFrame (rAF)\n\n- <strong>뭐야:<\/strong> 다음 화면을 그리기 직전에 콜백을 실행해 달라고 브라우저에 맡기는 API다. 한 번 등록하면 한 번만 불리므로 매 프레임 돌리려면 콜백 안에서 다시 등록하고, 호출 주기는 대개 화면 주사율을 따른다.\n- <strong>왜:<\/strong> 화면 갱신을 시간 타이머로 하면 프레임과 박자가 어긋난다. 드래그·스크롤 연동 UI를 `setInterval(16)`으로 갱신하면 어떤 프레임은 두 번 계산되고 어떤 프레임은 건너뛰어 덜덜 떨린다.\n- <strong>어떻게:<\/strong>\n  - rAF 콜백은 <strong>다음 렌더 직전<\/strong>(Style·Layout 전)에 호출된다 → 프레임과 정렬\n  - 주사율을 따라간다(60Hz면 약 16.7ms, 120Hz면 약 8.3ms). 그래서 \"16ms마다\"라고 가정한 코드는 120Hz 화면에서 2배 빨라진다 → 콜백 인자 `timestamp`로 경과 시간을 계산\n  - 대부분의 브라우저에서 백그라운드 탭·숨긴 iframe이면 멈춘다. 그래서 \"계속 돌아야 하는 일\"(타이머 적립, 하트비트)은 rAF에 걸면 안 된다\n- <strong>핵심:<\/strong> 결과가 <strong>화면 갱신<\/strong>이면 rAF, <strong>서버 요청·로깅<\/strong>이면 디바운스/스로틀. rAF는 <strong>백그라운드에서 멈춘다<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"rAF 안에서 측정해도 되나?\" → 프레임 시작에서 먼저 읽고 그 뒤에 쓰면 강제 레이아웃이 없다. 쓰고 나서 읽으면 rAF 안이라도 똑같이 강제된다.\n  - \"React에서 rAF를 쓰면 정리는?\" → `cancelAnimationFrame`을 effect cleanup에서 호출. 안 하면 언마운트 뒤에도 콜백이 돈다.\n- <strong>출처:<\/strong> [MDN — requestAnimationFrame](https://developer.mozilla.org/en-US/docs/Web/API/Window/requestAnimationFrame)\n\n### 메인 스레드 블로킹과 Long Task\n\n- <strong>뭐야:<\/strong> JS 실행·스타일·레이아웃·페인트·입력 처리는 전부 메인 스레드 하나에서 도는데, 이 스레드를 50ms 넘게 붙잡는 작업을 <strong>Long Task<\/strong>라 한다. 계산대가 하나뿐인 가게에서 한 손님이 계산대를 오래 붙잡고 있는 상황과 같다.\n- <strong>왜:<\/strong> Long Task가 도는 동안 들어온 입력은 그 작업이 끝날 때까지 기다린다. 화면은 멀쩡한데 \"버튼을 눌렀는데 반응이 없다\"는 제보가 이렇게 생긴다.\n- <strong>어떻게:<\/strong>\n  - JS 실행·스타일·레이아웃·페인트·입력 처리가 전부 <strong>메인 스레드 하나<\/strong>에서 돈다\n  - <strong>50ms 넘게<\/strong> 스레드를 잡는 작업이 Long Task. 그 사이 들어온 입력은 태스크가 끝날 때까지 기다린다. TBT는 이 중 50ms를 넘는 부분을 차단 시간(blocking time)으로 센다\n  - 60fps 프레임 예산은 약 16.7ms지만 브라우저 자체 작업 몫이 있어, web.dev는 내 코드가 쓸 수 있는 예산을 <strong>약 10ms<\/strong>로 잡는다\n  - 대응 네 방향: <strong>쪼갠다<\/strong>(태스크로 양보) · <strong>모은다<\/strong>(디바운스·스로틀·rAF) · <strong>미룬다<\/strong>(코드 스플리팅·지연 로딩) · <strong>내보낸다<\/strong>(Web Worker). 그 전에 <strong>불필요한 작업을 없애는 게 먼저<\/strong>\n  - 지표: <strong>INP<\/strong>(실사용 상호작용 → 다음 페인트, 현장), <strong>TBT<\/strong>(로딩 구간 Long Task의 50ms 초과분 합, 실험실)\n- <strong>핵심:<\/strong> 버벅임의 대부분은 <strong>메인 스레드 점유<\/strong>. Performance 탭에서 <strong>50ms 넘는 태스크<\/strong>부터 찾는다.\n- <strong>꼬리질문:<\/strong>\n  - \"작업을 쪼개면 총 시간은 늘지 않나?\" → 는다. 쪼개기는 처리량을 <strong>반응성<\/strong>과 맞바꾸는 것이다. 입력과 렌더가 끼어들 틈을 만든다.\n  - \"React 동시성 렌더링이면 해결되나?\" → 렌더를 쪼개 입력에 양보하지만, 컴포넌트 하나의 렌더 함수 안에서는 못 끊는다 (3파트 참고).\n- <strong>출처:<\/strong> [web.dev — Optimize long tasks](https://web.dev/articles/optimize-long-tasks) · [web.dev — INP](https://web.dev/articles/inp) · [web.dev — Rendering performance](https://web.dev/articles/rendering-performance)\n\n### Web Worker\n\n- <strong>뭐야:<\/strong> 메인 스레드와 별도의 스레드에서 JS를 돌리는 환경이다. `document`·`window`가 없어 화면은 못 만지고, 메인과는 `postMessage`로 메시지를 주고받는다.\n- <strong>왜:<\/strong> 카메라 프레임 분석, 대용량 JSON 파싱·정렬처럼 DOM과 무관한 계산을 메인 스레드에서 돌리면 그동안 입력이 밀린다. 이런 계산을 워커로 보내 메인 스레드를 비운다.\n- <strong>어떻게:<\/strong>\n  - 별도 스레드에서 도는 JS 환경. `document`·`window`·`localStorage`가 없다 → <strong>계산은 워커, 그리기는 메인<\/strong>\n  - 통신은 `postMessage`. 기본은 <strong>구조화 복제(structured clone)<\/strong> 라 큰 데이터는 복사 비용이 든다\n  - `ArrayBuffer`·`ImageBitmap`·`OffscreenCanvas`는 <strong>Transferable<\/strong>로 소유권만 넘겨 복사가 없다. 넘긴 쪽은 더 못 쓴다\n  - IndexedDB·`fetch`는 워커에서도 된다\n- <strong>핵심:<\/strong> 워커는 빠르게 하는 도구가 아니라 <strong>메인 스레드를 비우는 도구<\/strong>다. 총 CPU 시간은 줄지 않고 <strong>왕복 지연<\/strong>은 오히려 는다.\n- <strong>꼬리질문:<\/strong>\n  - \"그럼 무거운 건 다 워커로?\" → DOM·레이아웃 측정은 못 보낸다. 매 프레임 그려야 하면 왕복 지연과 초기화 비용(WASM 로딩 등)이 이득을 먹는다. 기준은 \"이게 도는 동안 사용자가 뭔가 하려 하느냐\".\n- <strong>출처:<\/strong> [MDN — Using Web Workers](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Using_web_workers) · [MDN — Transferable objects](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Transferable_objects)\n\n### 디바운스·스로틀 (Debounce, Throttle)\n\n- <strong>뭐야:<\/strong> 연달아 오는 이벤트의 실행 횟수를 줄이는 기법이다. 디바운스는 이벤트가 잠잠해진 뒤 한 번만, 스로틀은 정해진 간격마다 한 번만 실행한다.\n- <strong>왜:<\/strong> 줄이지 않으면 검색창 입력마다 API가 나가 불필요한 요청이 서버에 쌓인다. `scroll` 핸들러가 초당 수십 번 돌며 화면이 끊기기도 한다.\n- <strong>어떻게:<\/strong>\n  - <strong>디바운스<\/strong> — 이벤트가 올 때마다 타이머를 처음부터 다시 센다. 조용해진 뒤 한 번 실행. 검색·자동 저장·리사이즈 완료\n  - <strong>스로틀<\/strong> — 한 번 실행하면 정해진 간격 동안 무시. 중간 경과가 필요할 때. 스크롤 위치·실시간 좌표 전송\n  - <strong>rAF<\/strong> — 시간이 아니라 프레임에 맞춘다. 결과가 화면 갱신일 때\n  - leading(첫 이벤트에 즉시) / trailing(마지막 뒤 실행) 옵션. 중복 클릭 방지는 leading, 검색은 trailing\n  - React에서는 <strong>값 디바운스<\/strong>(상태를 늦게 바꿔 리렌더 자체를 줄임)와 <strong>함수 디바운스<\/strong>(실행만 늦춤)를 구분\n- <strong>핵심:<\/strong> <strong>마지막 것만(디바운스) / 주기적으로(스로틀) / 화면 갱신(rAF)<\/strong>. 셋 다 작업 수를 줄이고, 다른 건 <strong>무엇을 버리느냐<\/strong>다.\n- <strong>꼬리질문:<\/strong>\n  - \"디바운스로 응답 순서 꼬임도 막히나?\" → 아니다. 요청 수만 준다. 경쟁 상태는 취소(AbortController, 2파트)나 쿼리 키 캐시로 막는다.\n- <strong>출처:<\/strong> [MDN Glossary — Debounce](https://developer.mozilla.org/en-US/docs/Glossary/Debounce)\n\n> 한 줄 정리: 태스크 하나 → 마이크로태스크 전부 → 렌더, 이 순서를 알면 실행 순서·버벅임·rAF 위치가 다 설명된다.\n\n## 4. 이벤트와 저장소\n\n### 이벤트 전파와 위임 (Capture, Bubble, Event Delegation)\n\n- <strong>뭐야:<\/strong> 대부분의 이벤트는 바깥(window)에서 대상까지 내려가는 캡처, 대상에서 다시 바깥으로 올라가는 버블 순서로 전파된다. 이벤트 위임은 이 버블을 이용해 부모 하나에 리스너를 두고 실제 대상을 찾아 처리하는 패턴이다.\n- <strong>왜:<\/strong> 전파를 모르면 행 1,000개에 리스너를 하나씩 붙이게 된다. 또 바깥 클릭 감지가 포털 드롭다운 클릭까지 \"바깥\"으로 판정해 모달이 닫히는 상황을 설명하지 못한다.\n- <strong>어떻게:<\/strong>\n  - 전파 3단계: <strong>캡처<\/strong>(window → 대상) → <strong>타깃<\/strong> → <strong>버블<\/strong>(대상 → window). `addEventListener(type, fn, { capture: true })`면 캡처 단계에서 받는다\n  - <strong>이벤트 위임<\/strong> — 부모 하나에 리스너를 두고 `event.target.closest(\"[data-id]\")`로 실제 대상을 찾는다. 동적 자식도 자동 대응\n  - `target`은 실제 클릭된 요소, `currentTarget`은 리스너 단 요소\n  - `focus`·`blur`·`mouseenter`는 버블되지 않는다 → 위임하려면 `focusin`·`focusout`, `mouseover` 사용\n  - 주의: React 17부터 이벤트를 `document`가 아니라 <strong>루트 컨테이너<\/strong>에 위임한다. React 포털은 DOM 위치와 무관하게 <strong>React 트리 기준으로 버블<\/strong>된다\n- <strong>핵심:<\/strong> 위임은 <strong>버블링<\/strong>에 기대는 패턴. <strong>`target` vs `currentTarget`<\/strong>, 버블 안 되는 이벤트를 구분. 포털은 DOM과 React 트리의 버블 경로가 다르다.\n- <strong>꼬리질문:<\/strong>\n  - \"`stopPropagation`을 남발하면?\" → 상위 위임 리스너·분석 도구·바깥 클릭 감지가 못 받는다. 막지 말고 판정 쪽에서 `contains`로 거른다.\n  - \"바깥 클릭을 어떻게 판정하나?\" → `pointerdown`을 캡처 단계에서 받아 `ref.contains(e.target)`로 판정. 포털 대상은 DOM상 바깥이라 별도 허용 목록이 필요하다.\n  - \"passive 리스너는 왜 쓰나?\" → `preventDefault`를 안 부른다고 약속해 스크롤을 JS 처리 전에 시작시킨다. 주의: `window`·`document`·`documentElement`·`body`의 `touchstart`·`touchmove`·`wheel`은 기본 passive(MDN 기준).\n- <strong>출처:<\/strong> [MDN — Event bubbling](https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/Event_bubbling) · [MDN — addEventListener: passive](https://developer.mozilla.org/en-US/docs/Web/API/EventTarget/addEventListener#passive) · [react.dev — createPortal (Caveats)](https://react.dev/reference/react-dom/createPortal)\n\n### 브라우저 저장소 (Cookie, localStorage, sessionStorage, IndexedDB)\n\n- <strong>뭐야:<\/strong> 브라우저 안에 데이터를 남겨 두는 장소들이다. 매 요청에 실려 가는 쿠키, 출처 단위로 영구 보관되는 localStorage, 탭 단위인 sessionStorage, 비동기·대용량인 IndexedDB가 있고 범위·수명·JS 접근 여부가 다르다.\n- <strong>왜:<\/strong> 차이를 모르고 고르면 보안과 상태 정리에서 사고가 난다. 토큰을 `localStorage`에 뒀다가 XSS 지적을 받거나, 로그아웃했는데 다른 계정 화면에 이전 계정 상태가 남는다.\n- <strong>어떻게:<\/strong>\n\n  | | 범위·수명 | 특징 |\n  | --- | --- | --- |\n  | <strong>Cookie<\/strong> | 도메인·경로, 만료일까지 | <strong>매 요청에 자동 전송<\/strong>. `HttpOnly`(JS 접근 차단), `Secure`, `SameSite`. 약 4KB |\n  | <strong>localStorage<\/strong> | 출처(origin), 영구 | <strong>동기 API<\/strong>, 문자열만. 주의: MDN 기준 출처당 5MiB, 넘으면 `QuotaExceededError` |\n  | <strong>sessionStorage<\/strong> | 출처 + <strong>탭<\/strong>, 탭 닫으면 삭제 | 새 탭은 새 세션. opener가 있는 창은 opener 값의 <strong>사본<\/strong>으로 시작해 이후 따로 논다 |\n  | <strong>IndexedDB<\/strong> | 출처, 영구 | <strong>비동기<\/strong>, 구조화 데이터·Blob, 워커에서 접근 가능, 대용량 |\n\n  - `localStorage`는 동기라 큰 값을 자주 쓰면 메인 스레드를 막는다\n  - `storage` 이벤트로 <strong>다른 탭<\/strong>의 변경을 받는다(같은 문서엔 안 옴)\n  - 주의: `SameSite` 미지정 쿠키를 Chrome은 `Lax`로 취급한다(Chrome 80부터). 쿠키 속성 상세는 6파트\n- <strong>핵심:<\/strong> 인증 토큰은 <strong>`HttpOnly` 쿠키<\/strong>가 XSS에 강하다(대신 CSRF를 `SameSite`·토큰으로 막는다). Web Storage는 <strong>JS로 읽힌다<\/strong> = XSS로 털린다. 로그아웃 때는 저장소·쿠키·쿼리 캐시를 <strong>함께<\/strong> 비운다.\n- <strong>꼬리질문:<\/strong>\n  - \"하이브리드 앱 웹뷰에서 주의할 점은?\" → 웹뷰 쿠키 저장소를 앱과 공유하는지가 플랫폼마다 달라, 로그아웃·계정 전환 뒤 남는 상태를 실기기에서 확인한다.\n- <strong>출처:<\/strong> [MDN — Web Storage API](https://developer.mozilla.org/en-US/docs/Web/API/Web_Storage_API) · [MDN — Storage quotas: Web Storage](https://developer.mozilla.org/en-US/docs/Web/API/Storage_API/Storage_quotas_and_eviction_criteria#web_storage)\n\n### 페이지 이탈 시 데이터 보내기 (visibilitychange, pagehide, sendBeacon)\n\n- <strong>뭐야:<\/strong> 사용자가 탭을 닫거나 앱을 내리는 순간을 감지하고(`visibilitychange`·`pagehide`), 페이지가 사라져도 전송을 끝까지 시도하도록 보내는(`sendBeacon`·`keepalive`) 방법이다.\n- <strong>왜:<\/strong> 모바일에서는 `unload`·`beforeunload`가 안 불릴 수 있다. 여기에 기대면 앱을 내리거나 탭을 닫는 순간의 마지막 기록(학습 시간, 로그)이 서버에 안 남는다.\n- <strong>어떻게:<\/strong>\n  - 모바일에서는 `unload`·`beforeunload`가 신뢰할 수 없다. 백그라운드로 갔다가 그대로 종료되면 안 불린다 → <strong>`visibilitychange`(hidden)<\/strong> 를 마지막 확실한 신호로 본다\n  - `pagehide`는 bfcache(뒤로·앞으로 캐시) 진입 때도 불린다. `unload` 리스너가 있으면 bfcache에서 제외될 수 있다\n  - <strong>`navigator.sendBeacon`<\/strong> 또는 `fetch(..., { keepalive: true })`는 페이지가 사라져도 전송을 끝까지 시도한다. `sendBeacon`은 응답을 못 받고(단방향), `keepalive` fetch는 페이지가 살아 있을 때만 응답을 읽을 수 있다\n- <strong>핵심:<\/strong> 마지막 신호는 <strong>`visibilitychange` hidden<\/strong>, 전송은 <strong>`sendBeacon`/`keepalive`<\/strong>. 이탈 비콘은 <strong>되돌릴 수 없는 동작(종료·무효화)<\/strong> 을 하면 안 된다.\n- <strong>꼬리질문:<\/strong>\n  - \"비콘 요청에 인증 헤더를 못 붙이면?\" → `sendBeacon`은 POST만, 커스텀 헤더 불가. 쿠키 인증이거나, 본문에 식별자를 넣거나, 헤더가 되는 `fetch keepalive`를 쓴다. 주의: 둘 다 본문이 <strong>64KiB<\/strong> 안팎으로 묶인다(MDN 기준).\n  - \"탭을 잠깐 내렸다 돌아오면?\" → hidden마다 '종료'를 보내면 복귀 후 세션이 죽어 있다. 동기화(sync)만 보내고 종료는 명시적 동작에서만.\n- <strong>출처:<\/strong> [Chrome — Page Lifecycle API](https://developer.chrome.com/docs/web-platform/page-lifecycle-api#advice-hidden) · [MDN — Navigator.sendBeacon()](https://developer.mozilla.org/en-US/docs/Web/API/Navigator/sendBeacon) · [MDN — RequestInit: keepalive](https://developer.mozilla.org/en-US/docs/Web/API/RequestInit)\n\n### CSS 환경 변수와 safe-area (env(), max())\n\n- <strong>뭐야:<\/strong> `env()`는 브라우저가 알려 주는 환경 값을 CSS에서 읽는 함수이고, safe-area 값은 노치·홈 인디케이터를 피하기 위한 여백이다. `max()`로 이 값에 하한을 붙일 수 있다.\n- <strong>왜:<\/strong> 여백을 안 주면 노치·홈바가 있는 기기에서 하단 버튼이 홈 인디케이터에 가린다. 사각형 화면인 데스크톱에서는 `env()` 값이 0이라 재현이 안 돼 놓치기 쉽다.\n- <strong>어떻게:<\/strong>\n  - `viewport-fit=cover`를 켜면 콘텐츠가 노치 영역까지 깔리고, `env(safe-area-inset-bottom)` 등으로 여백을 받는다\n  - 사각형 화면(데스크톱)에서는 `env()`가 0이라 여백 없음 → `max(env(...), 16px)`처럼 <strong>하한<\/strong>을 준다. `env(name, 대체값)`의 두 번째 인자는 변수가 <strong>없을 때<\/strong>만 쓰이므로 0일 때의 하한 역할은 못 한다\n  - 값을 CSS 변수(`--safe-bottom`)로 한 번 감싸면 데스크톱에서 변수만 바꿔 노치 상황을 흉내 낼 수 있다\n- <strong>핵심:<\/strong> <strong>`env()` + `max()` 하한<\/strong>, 그리고 <strong>CSS 변수로 감싸 검증 가능하게<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"`100vh`는 모바일에서 왜 어긋나나?\" → 주소창이 접히고 펴지는데 `vh`는 대부분 큰 뷰포트(`lvh`) 기준이다. 안정적인 `svh`, 따라 움직이는 `dvh`(스크롤 중 리사이즈 비용) 중 고른다(주의: 구형 브라우저는 `vh` 폴백).\n- <strong>출처:<\/strong> [MDN — env()](https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Values/env) · [MDN — length: 뷰포트 단위](https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Values/length)\n\n> 한 줄 정리: 위임은 버블에 기대고, 저장소는 \"JS가 읽나·매 요청에 실리나·탭마다 다르나\"로 고르며, 이탈 신호는 visibilitychange로 받는다.\n\n## 5. 출처 경계와 플랫폼 확장\n\n### 동일 출처 정책 (Same-Origin Policy, SOP)\n\n- <strong>뭐야:<\/strong> 한 출처의 문서·스크립트가 출처(스킴·호스트·포트)가 다른 자원의 데이터를 읽지 못하게 막는 브라우저 기본 보안 규칙이다. 다른 출처 자원을 페이지에 삽입하는 건 대체로 허용하고, 그 내용을 읽는 것을 막는다.\n- <strong>왜:<\/strong> 규칙을 모르면 `<img>`·`<script>`로는 다른 도메인 자원이 뜨는데 `fetch`로 읽으면 막히는 이유를 설명 못 한다. 다른 출처 iframe DOM을 만지다 `SecurityError`가 나는 것도 이 규칙 때문이다.\n- <strong>어떻게:<\/strong>\n  - <strong>출처(origin) = 스킴 + 호스트 + 포트<\/strong>. 하나만 달라도 다른 출처(`http`↔`https`, `:80`↔`:81`, `a.`↔`b.`). 경로는 무관\n  - 교차 출처 <strong>쓰기<\/strong>(링크·리다이렉트·폼 제출)와 <strong>삽입<\/strong>(`script`·`img`·`stylesheet`·`iframe`)은 대체로 허용, <strong>읽기<\/strong>(응답 본문·삽입 문서의 DOM)는 차단\n  - 다른 출처 창끼리는 `postMessage`로 대화한다. Web Storage·IndexedDB도 <strong>출처별 격리<\/strong>(쿠키는 도메인·경로 규칙이 따로)\n  - 읽기 제한을 서버가 풀어 주는 게 <strong>CORS<\/strong>다 (6파트 참고). `document.domain`으로 하위 도메인끼리 완화하던 방식은 폐기 수순\n- <strong>핵심:<\/strong> 출처는 <strong>스킴·호스트·포트 3개 일치<\/strong>. SOP는 <strong>삽입·쓰기는 허용, 읽기는 차단<\/strong>이 기본 틀이다. 그래서 CSRF(쓰기)는 SOP만으로 못 막는다.\n- <strong>꼬리질문:<\/strong>\n  - \"SOP가 있는데 왜 CSRF가 되나?\" → 폼 제출 같은 교차 출처 <strong>쓰기<\/strong>는 원래 허용이라 요청 자체는 나간다. 공격자는 응답을 못 읽을 뿐이다. 그래서 SameSite·CSRF 토큰이 필요하다(6파트 참고).\n- <strong>출처:<\/strong> [MDN — Same-origin policy](https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Same-origin_policy)\n\n### 서비스 워커 기초 (Service Worker)\n\n- <strong>뭐야:<\/strong> 페이지와 네트워크 사이에 끼어 앉는 프록시 역할의 워커다. 범위 안 요청을 가로채 캐시에서 줄지, 네트워크로 보낼지, 대체 응답을 줄지 고른다.\n- <strong>왜:<\/strong> 오프라인에서도 앱 셸을 띄우거나(PWA) 푸시 알림을 받으려면 필요하다. 대신 생명주기와 캐시 전략을 모르면 배포했는데 일부 사용자만 옛 화면을 계속 보는 문제가 생긴다.\n- <strong>어떻게:<\/strong>\n  - 페이지와 네트워크 사이의 <strong>프록시 워커<\/strong>. 범위(scope, 기본은 스크립트 위치) 안 요청을 `fetch` 이벤트로 가로채 캐시·네트워크·대체 응답 중 고른다\n  - 생명주기: `register` → `install`(캐시 채우기) → `activate`(옛 캐시 정리). <strong>새 버전은 옛 버전이 제어하는 탭이 다 닫힐 때까지 waiting<\/strong>. 건너뛰기는 `skipWaiting()`, 열린 페이지 장악은 `clients.claim()`\n  - DOM·동기 API(`localStorage`) 없음, <strong>HTTPS 필수<\/strong>(localhost 예외). 하나가 <strong>여러 탭을 제어<\/strong>한다\n- <strong>핵심:<\/strong> 서비스 워커는 <strong>요청 가로채기 + 캐시<\/strong>다. 업데이트는 <strong>waiting 단계<\/strong> 때문에 즉시 반영되지 않는다. 캐시 전략(cache-first·network-first)이 곧 <strong>신선도 정책<\/strong>이다.\n- <strong>꼬리질문:<\/strong>\n  - \"새 배포가 왜 바로 안 보이나?\" → 새 워커가 waiting이거나 cache-first로 옛 HTML을 내주기 때문. HTML은 network-first, 해시 붙은 정적 자원만 cache-first.\n  - \"`skipWaiting`을 항상 켜면?\" → 옛 청크를 들고 있는 탭이 새 캐시와 섞여 청크 로딩이 깨질 수 있다. \"새 버전 → 새로고침\" 안내와 묶는다.\n- <strong>출처:<\/strong> [MDN — Using Service Workers](https://developer.mozilla.org/en-US/docs/Web/API/Service_Worker_API/Using_Service_Workers)\n\n### Web Components와 Shadow DOM (Custom Elements, Shadow DOM)\n\n- <strong>뭐야:<\/strong> 브라우저 표준만으로 재사용 가능한 커스텀 태그를 만드는 기술 묶음이다. 그중 <strong>Shadow DOM<\/strong>은 요소 안에 바깥과 격리된 숨은 DOM 트리를 붙여 바깥 셀렉터가 안으로, 안쪽 스타일이 밖으로 새지 않게 한다(상속 속성·CSS 변수는 통과).\n- <strong>왜:<\/strong> 격리가 없으면 외부 위젯을 넣었을 때 전역 CSS가 위젯을 깨뜨리거나 위젯 CSS가 화면에 샌다. 이름이 비슷한 Virtual DOM과 헷갈리기 쉬워 \"Shadow DOM vs Virtual DOM\" 질문으로도 나온다.\n- <strong>어떻게:<\/strong>\n  - 세 기술의 묶음: <strong>Custom Elements<\/strong>(`customElements.define`, 이름에 <strong>하이픈 필수<\/strong>, `connectedCallback` 등 생명주기) · <strong>Shadow DOM<\/strong> · <strong>`<template>`·`<slot>`<\/strong>\n  - `attachShadow({ mode })`로 숨은 트리를 붙인다. 바깥 셀렉터·`querySelector`가 못 들어가고 안쪽 스타일도 안 샌다. `closed`는 보안 장치가 아니다\n  - <strong>상속 속성(color·font)과 CSS 변수(`--x`)<\/strong> 는 안으로 들어온다 → 테마 훅. 특정 요소는 `part` + `::part()`로 연다\n  - 이벤트는 경계를 넘으며 <strong>target이 호스트로 바뀐다(retargeting)<\/strong>. 클릭 등 UA 이벤트는 composed라 넘고, 커스텀 이벤트는 `composed: true`가 필요\n- <strong>핵심:<\/strong> Shadow DOM = <strong>DOM·스타일 캡슐화<\/strong>(브라우저 표준), Virtual DOM = <strong>렌더 비교용 JS 객체<\/strong>(라이브러리 기법). 기본으로 경계를 넘는 건 <strong>상속 속성·CSS 변수·composed 이벤트<\/strong>이고, 그 밖은 `::part`로 연다.\n- <strong>꼬리질문:<\/strong>\n  - \"Shadow DOM 안 요소를 바깥 클릭 감지로 판정하면?\" → 문서 레벨에선 `e.target`이 호스트로 보인다. 안쪽 실제 요소는 `e.composedPath()`로 확인한다(open 모드일 때. closed면 경로에 안쪽 노드가 안 나온다).\n  - \"섞어 쓸 때 대가는?\" → 격리를 얻는 대신 디자인 토큰을 CSS 변수로 다시 열어 줘야 하고, SSR엔 선언형 Shadow DOM(`<template shadowrootmode>`)이 필요하다.\n- <strong>출처:<\/strong> [MDN — Using shadow DOM](https://developer.mozilla.org/en-US/docs/Web/API/Web_components/Using_shadow_DOM) · [MDN — Event.composed](https://developer.mozilla.org/en-US/docs/Web/API/Event/composed) · [web.dev — Shadow DOM v1](https://web.dev/articles/shadowdom-v1)\n\n> 한 줄 정리: SOP는 스킴·호스트·포트로 출처를 갈라 읽기를 막고, 서비스 워커는 요청을 가로채는 캐시 계층, Shadow DOM은 가두되 상속 속성·CSS 변수는 통과시킨다.\n\n## 핵심 키워드 모음\n\n- <strong>URL→첫 픽셀<\/strong>: DNS·TCP·TLS·TTFB 뒤 파싱→렌더. 빈 화면은 주로 TTFB + 렌더 차단 자원\n- <strong>DOM·CSSOM<\/strong>: CSS는 렌더 차단, 동기 JS는 파서 차단\n- <strong>defer·async·module<\/strong>: 기본은 defer(순서 보장, 파싱 후), async는 받자마자, module은 기본 지연\n- <strong>렌더링 파이프라인<\/strong>: Style→Layout→Paint→Composite, 비용은 Layout > Paint > Composite\n- <strong>강제 동기 레이아웃<\/strong>: 밀린 쓰기 뒤의 읽기가 레이아웃을 강제. 읽기 먼저, 쓰기 나중\n- <strong>합성 레이어<\/strong>: transform·opacity는 컴포지터 스레드. will-change는 남발 금지\n- <strong>이벤트 루프<\/strong>: 태스크 하나 → 마이크로태스크 전부 → 렌더\n- <strong>rAF<\/strong>: 렌더 직전 호출, 주사율 추종, 백그라운드에서 멈춤\n- <strong>Long Task<\/strong>: 50ms 초과. 쪼갠다·모은다·미룬다·내보낸다\n- <strong>Web Worker<\/strong>: DOM 없음, postMessage·Transferable. 빠르게가 아니라 메인을 비우는 것\n- <strong>디바운스·스로틀<\/strong>: 마지막만 / 주기적으로 / 화면 갱신이면 rAF\n- <strong>이벤트 위임<\/strong>: 버블링 활용, target vs currentTarget, 포털은 React 트리로 버블\n- <strong>저장소<\/strong>: 쿠키는 매 요청 전송·HttpOnly, Web Storage는 동기·JS 노출, IndexedDB는 비동기·대용량\n- <strong>이탈 처리<\/strong>: visibilitychange hidden + sendBeacon/keepalive, 비콘은 저장만\n- <strong>safe-area<\/strong>: env() + max() 하한, CSS 변수로 감싸 검증\n- <strong>동일 출처 정책<\/strong>: 스킴·호스트·포트 일치, 삽입·쓰기 허용·읽기 차단, 푸는 건 CORS\n- <strong>서비스 워커<\/strong>: fetch 가로채기 + Cache, install→waiting→activate, HTTPS 필수\n- <strong>Web Components·Shadow DOM<\/strong>: 스타일·DOM 캡슐화, 기본 통과는 상속 속성·CSS 변수·composed 이벤트(나머지는 ::part), target은 호스트로 retarget\n"}, {"id": "n02", "num": "2", "title": "JavaScript 핵심 동작", "md": "# 2. JavaScript 핵심 동작\n\n<strong>이 파트는 뭐냐:<\/strong> \"왜 이 값이 옛날 값이지\", \"왜 `this`가 undefined지\", \"왜 이 순서로 찍히지\", \"왜 메모리가 계속 늘지\"를 설명하는 언어 동작 영역. 한 줄 요약 — 대부분의 이상 동작은 <strong>값이 언제 묶이고(스코프·클로저·this), 무엇이 공유되고(참조), 언제 실행되느냐(이벤트 루프)<\/strong> 세 질문으로 풀린다.\n\n## 1. 실행 컨텍스트와 스코프\n\n### 실행 컨텍스트·스코프 체인 (Execution Context, Scope Chain)\n\n- <strong>뭐야:<\/strong> 실행 컨텍스트는 함수가 호출될 때마다 만들어지는 실행 환경으로, 그 안의 변수 기록과 `this`를 담는다. 스코프 체인은 변수를 못 찾았을 때 바깥 환경으로 차례로 올라가며 찾는 연결 고리다.\n- <strong>왜:<\/strong> 이 규칙을 모르면 같은 이름의 변수가 안쪽·바깥쪽에 있을 때 어느 값이 쓰이는지 헷갈린다. `for (var i...)` 루프 안 콜백이 전부 루프가 끝난 뒤의 같은 값(마지막 인덱스 + 1)을 찍는 상황도 설명하지 못한다.\n- <strong>어떻게:<\/strong>\n  - 함수가 호출될 때마다 <strong>실행 컨텍스트<\/strong>가 콜 스택에 쌓인다. 안에는 변수 환경(렉시컬 환경)과 `this`가 들어 있다\n  - 렉시컬 환경 = 이 스코프의 변수 기록 + <strong>바깥 환경 참조<\/strong>. 변수를 못 찾으면 바깥으로 올라간다 → <strong>스코프 체인<\/strong>\n  - 바깥 참조는 함수를 <strong>어디서 호출했나가 아니라 어디서 정의했나<\/strong>로 정해진다(렉시컬 스코프)\n  - `var`는 함수 스코프, `let`·`const`는 <str
