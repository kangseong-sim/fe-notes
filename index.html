 전략)로 두고, 해시가 붙은 정적 자원만 cache-first로 둔다.\n  - \"`skipWaiting`을 항상 켜면?\" → 옛 청크를 들고 있는 탭이 새 캐시와 섞여 청크 로딩이 깨질 수 있다. 그래서 `skipWaiting`은 \"새 버전이 있으니 새로고침해 달라\"는 안내와 함께 쓴다.\n- <strong>출처:<\/strong> [MDN — Using Service Workers](https://developer.mozilla.org/en-US/docs/Web/API/Service_Worker_API/Using_Service_Workers)\n\n### Web Components와 Shadow DOM (Custom Elements, Shadow DOM)\n\n- <strong>뭐야:<\/strong> 브라우저 표준만으로 재사용 가능한 커스텀 태그를 만드는 기술 묶음이다. 그중 <strong>Shadow DOM<\/strong>은 요소 안에 바깥과 격리된 숨은 DOM 트리를 붙이는 기술이다. 바깥 셀렉터는 안으로 들어오지 못하고, 안쪽 스타일은 밖으로 새지 않는다. 상속 속성과 CSS 변수는 예외로 통과한다.\n- <strong>왜:<\/strong> 격리가 없으면 외부 위젯을 넣었을 때 스타일이 서로 섞인다. 전역 CSS가 위젯 모양을 깨뜨리거나, 위젯의 CSS가 내 화면에 새어 나온다. 이름이 비슷한 Virtual DOM과 헷갈리기도 쉬워서 \"Shadow DOM vs Virtual DOM\" 질문으로도 나온다.\n- <strong>어떻게:<\/strong>\n  - Web Components는 세 기술의 묶음이다. 첫째는 <strong>Custom Elements<\/strong>다. `customElements.define`으로 새 태그를 등록한다. 태그 이름에는 <strong>하이픈 필수<\/strong>다. `connectedCallback` 같은 생명주기 콜백도 쓸 수 있다. 둘째는 <strong>Shadow DOM<\/strong>, 셋째는 <strong>`<template>`·`<slot>`<\/strong>이다.\n  - `attachShadow({ mode })`로 요소에 숨은 트리를 붙인다. 바깥 셀렉터와 `querySelector`는 이 트리 안으로 들어가지 못한다. 안쪽 스타일도 밖으로 새지 않는다. `mode`를 `closed`로 해도 보안 장치가 되지는 않는다.\n  - <strong>상속 속성(color·font)과 CSS 변수(`--x`)<\/strong>는 경계를 넘어 안으로 들어온다. 그래서 바깥에서 테마를 입히는 통로로 쓴다. 안쪽의 특정 요소를 바깥에서 꾸미게 하려면 `part` 속성을 달고 `::part()`로 연다.\n  - 이벤트가 경계를 넘어 바깥으로 나가면 <strong>target이 호스트로 바뀐다(retargeting)<\/strong>. 호스트는 Shadow DOM이 붙은 바깥 요소다. 클릭 등 브라우저가 만드는 이벤트(UA 이벤트)는 composed라서 경계를 넘는다. 직접 만든 커스텀 이벤트는 `composed: true`를 줘야 넘는다.\n- <strong>핵심:<\/strong> Shadow DOM은 <strong>DOM·스타일 캡슐화<\/strong>(브라우저 표준)이고, Virtual DOM은 <strong>렌더 비교용 JS 객체<\/strong>(라이브러리 기법)다. 기본으로 경계를 넘는 건 <strong>상속 속성·CSS 변수·composed 이벤트<\/strong>이고, 그 밖은 `::part`로 연다.\n- <strong>꼬리질문:<\/strong>\n  - \"Shadow DOM 안 요소를 바깥 클릭 감지로 판정하면?\" → 문서 레벨 리스너에서는 `e.target`이 호스트로 보인다. 안쪽의 실제 요소는 `e.composedPath()`로 확인한다. 단, open 모드일 때만 된다. closed 모드면 경로에 안쪽 노드가 나오지 않는다.\n  - \"섞어 쓸 때 대가는?\" → 격리를 얻는 대신 치르는 비용이 두 가지 있다. 디자인 토큰을 CSS 변수로 다시 열어 줘야 한다. SSR에는 선언형 Shadow DOM(`<template shadowrootmode>`)이 필요하다.\n- <strong>출처:<\/strong> [MDN — Using shadow DOM](https://developer.mozilla.org/en-US/docs/Web/API/Web_components/Using_shadow_DOM) · [MDN — Event.composed](https://developer.mozilla.org/en-US/docs/Web/API/Event/composed) · [web.dev — Shadow DOM v1](https://web.dev/articles/shadowdom-v1)\n\n> 한 줄 정리: SOP는 스킴·호스트·포트로 출처를 갈라 읽기를 막고, 서비스 워커는 요청을 가로채는 캐시 계층, Shadow DOM은 가두되 상속 속성·CSS 변수는 통과시킨다.\n\n## 핵심 키워드 모음\n\n- <strong>URL→첫 픽셀<\/strong>: DNS·TCP·TLS·TTFB 뒤 파싱→렌더. 빈 화면은 주로 TTFB + 렌더 차단 자원\n- <strong>DOM·CSSOM<\/strong>: CSS는 렌더 차단, 동기 JS는 파서 차단\n- <strong>defer·async·module<\/strong>: 기본은 defer(순서 보장, 파싱 후), async는 받자마자, module은 기본 지연\n- <strong>렌더링 파이프라인<\/strong>: Style→Layout→Paint→Composite, 비용은 Layout > Paint > Composite\n- <strong>강제 동기 레이아웃<\/strong>: 밀린 쓰기 뒤의 읽기가 레이아웃을 강제. 읽기 먼저, 쓰기 나중\n- <strong>합성 레이어<\/strong>: transform·opacity는 컴포지터 스레드. will-change는 남발 금지\n- <strong>이벤트 루프<\/strong>: 태스크 하나 → 마이크로태스크 전부 → 렌더\n- <strong>rAF<\/strong>: 렌더 직전 호출, 주사율 추종, 백그라운드에서 멈춤\n- <strong>Long Task<\/strong>: 50ms 초과. 쪼갠다·모은다·미룬다·내보낸다\n- <strong>Web Worker<\/strong>: DOM 없음, postMessage·Transferable. 빠르게가 아니라 메인을 비우는 것\n- <strong>디바운스·스로틀<\/strong>: 마지막만 / 주기적으로 / 화면 갱신이면 rAF\n- <strong>이벤트 위임<\/strong>: 버블링 활용, target vs currentTarget, 포털은 React 트리로 버블\n- <strong>저장소<\/strong>: 쿠키는 매 요청 전송·HttpOnly, Web Storage는 동기·JS 노출, IndexedDB는 비동기·대용량\n- <strong>이탈 처리<\/strong>: visibilitychange hidden + sendBeacon/keepalive, 비콘은 저장만\n- <strong>safe-area<\/strong>: env() + max() 하한, CSS 변수로 감싸 검증\n- <strong>동일 출처 정책<\/strong>: 스킴·호스트·포트 일치, 삽입·쓰기 허용·읽기 차단, 푸는 건 CORS\n- <strong>서비스 워커<\/strong>: fetch 가로채기 + Cache, install→waiting→activate, HTTPS 필수\n- <strong>Web Components·Shadow DOM<\/strong>: 스타일·DOM 캡슐화, 기본 통과는 상속 속성·CSS 변수·composed 이벤트(나머지는 ::part), target은 호스트로 retarget\n"}, {"id": "n02", "num": "2", "title": "JavaScript 핵심 동작", "md": "# 2. JavaScript 핵심 동작\n\n<strong>이 파트는 뭐냐:<\/strong> JavaScript 언어가 실제로 어떻게 동작하는지를 다룬다. \"왜 이 값이 옛날 값이지\", \"왜 `this`가 undefined지\", \"왜 이 순서로 찍히지\", \"왜 메모리가 계속 늘지\" 같은 질문에 답하는 파트다. 이상한 동작은 대부분 세 가지 질문으로 풀린다. <strong>값이 언제 묶이고(스코프·클로저·this), 무엇이 공유되고(참조), 언제 실행되느냐(이벤트 루프)<\/strong>다.\n\n## 1. 실행 컨텍스트와 스코프\n\n### 실행 컨텍스트·스코프 체인 (Execution Context, Scope Chain)\n\n- <strong>뭐야:<\/strong> 실행 컨텍스트는 함수가 호출될 때마다 만들어지는 실행 환경이다. 그 안에는 그 함수의 변수 기록과 `this`가 들어 있다. 스코프 체인은 변수를 못 찾았을 때 바깥 환경으로 차례로 올라가며 찾는 연결 고리다.\n- <strong>왜:<\/strong> 이 규칙을 모르면 같은 이름의 변수가 안쪽과 바깥쪽에 모두 있을 때 어느 값이 쓰이는지 헷갈린다. `for (var i...)` 루프 안의 콜백이 전부 같은 값을 찍는 이유도 설명하지 못한다. 그 값은 루프가 끝난 뒤의 값(마지막 인덱스 + 1)이다.\n- <strong>어떻게:<\/strong>\n  - 함수가 호출될 때마다 <strong>실행 컨텍스트<\/strong>가 콜 스택에 쌓인다. 콜 스택은 지금 실행 중인 함수들이 쌓이는 곳이다. 실행 컨텍스트 안에는 변수 환경(렉시컬 환경)과 `this`가 들어 있다.\n  - 렉시컬 환경은 이 스코프의 변수 기록과 <strong>바깥 환경 참조<\/strong>로 이루어진다. 변수를 못 찾으면 이 참조를 따라 바깥으로 올라간다. 이렇게 이어진 연결이 <strong>스코프 체인<\/strong>이다.\n  - 바깥 환경 참조는 함수를 <strong>어디서 호출했나가 아니라 어디서 정의했나<\/strong>로 정해진다. 이 규칙을 렉시컬 스코프라고 한다.\n  - `var`는 함수 스코프를 따르고, `let`·`const`는 <strong>블록 스코프<\/strong>를 따른다. 블록 스코프는 중괄호 `{}` 안에서만 변수가 보인다는 뜻이다.\n  - `for (let i...)`는 반복마다 새 바인딩이 생긴다. 바인딩은 변수 이름과 그 값이 담기는 자리를 묶은 것이다.\n- <strong>핵심:<\/strong> 스코프는 <strong>정의 위치(렉시컬)<\/strong>로 정해지고 변수 탐색은 <strong>안쪽 → 바깥<\/strong> 한 방향이다. `this`만 예외로 호출 방식이 정한다(화살표 함수는 제외).\n- <strong>꼬리질문:<\/strong>\n  - \"`for (var i...)` 안의 `setTimeout`이 전부 같은 값을 찍는 이유?\" → `var`는 함수 스코프라 `i`의 바인딩이 하나뿐이다. 콜백은 루프가 끝난 뒤에 그 하나를 읽는다. `let`이면 반복마다 바인딩이 따로 생긴다.\n  - \"스코프 체인이 깊으면 느린가?\" → 엔진이 최적화하므로 실무에서 느리다고 느낄 일은 거의 없다. 성능보다 <strong>가려짐(shadowing)<\/strong>으로 생기는 버그가 문제다. 가려짐은 안쪽 변수가 바깥의 같은 이름 변수를 덮어 안 보이게 하는 것이다.\n- <strong>출처:<\/strong> [MDN — Closures: Lexical scoping](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures#lexical_scoping) · [MDN — let](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let)\n\n### 호이스팅과 TDZ (Hoisting, Temporal Dead Zone)\n\n- <strong>뭐야:<\/strong> 호이스팅은 실행 전에 선언을 먼저 등록해서, 선언이 맨 위로 끌어올려진 것처럼 보이는 현상이다. TDZ는 `let`·`const`·`class`가 등록은 됐지만 아직 초기화되지 않아 접근하면 에러가 나는 구간이다.\n- <strong>왜:<\/strong> 모르면 선언보다 위에서 변수를 썼을 때 나오는 두 증상을 구분하지 못한다. 어떤 때는 `undefined`가 나와 조용히 넘어간다. 어떤 때는 `ReferenceError: Cannot access 'x' before initialization`이 난다.\n- <strong>어떻게:<\/strong>\n  - 실행 컨텍스트가 만들어질 때 엔진은 그 안의 선언을 먼저 등록한다. 그래서 선언이 \"끌어올려진 것처럼\" 보인다.\n  - `var`는 등록과 동시에 `undefined`로 초기화된다. 그래서 선언 전에 접근하면 <strong>조용히 `undefined`<\/strong>가 나온다.\n  - `let`·`const`·`class`는 등록은 되지만 <strong>초기화 전까지 접근 불가<\/strong>다. 등록부터 초기화까지의 이 구간이 TDZ다.\n  - 함수 선언문은 <strong>본문까지 통째로<\/strong> 올라간다. 함수 표현식(`const f = () => {}`)은 함수를 변수에 담는 것이라 그 변수의 규칙을 따른다.\n  ```js\n  console.log(a); // undefined\n  console.log(b); // ReferenceError (TDZ)\n  var a = 1;\n  let b = 2;\n  ```\n- <strong>핵심:<\/strong> `var`·`let`·`const` 모두 호이스팅되지만 <strong>초기화 시점<\/strong>이 다르다. `var`는 <strong>`undefined`로 조용히<\/strong>, `let`·`const`는 <strong>TDZ로 시끄럽게<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"그럼 `let`은 호이스팅이 안 되는 건가?\" → 용어를 어떻게 정의하느냐의 문제다. MDN도 호이스팅이 합의된 용어가 아니라고 적는다. 다만 `let` 선언이 스코프 전체에 영향을 주는 것은 맞다. 영향이 없다면 선언 전에는 바깥의 같은 이름 변수가 보여야 한다. 실제로는 선언 전 접근이 TDZ 에러를 낸다. 참고로 TDZ 안에서는 `typeof`도 에러를 낸다.\n  - \"TDZ가 왜 좋은가?\" → 초기화 전에 변수를 쓰는 실수를 실행 시점에 바로 드러낸다. `var`는 `undefined`인 채로 흘러가다 엉뚱한 곳에서 터진다. TDZ는 이를 막는다.\n  - \"모듈 순환 import에서 TDZ가 나는 경우는?\" → A가 B를 import하고 B가 A의 `const`를 최상위에서 바로 읽는 경우다. 이때 A는 아직 초기화 전이라 TDZ 에러가 난다.\n- <strong>출처:<\/strong> [MDN Glossary — Hoisting](https://developer.mozilla.org/en-US/docs/Glossary/Hoisting) · [MDN — let: TDZ](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let#temporal_dead_zone_tdz)\n\n### 클로저 (Closure)\n\n- <strong>뭐야:<\/strong> 함수가 만들어질 때 자신이 정의된 환경(바깥 변수들)에 대한 참조를 같이 들고 다니는 성질이다. 바깥 함수가 끝나도 안쪽 함수가 살아 있으면 그 변수들에 계속 접근할 수 있다.\n- <strong>왜:<\/strong> 모르면 콜백·이벤트 핸들러·타이머가 옛 값을 보는 버그를 설명하지 못한다. 이들은 만들어진 시점의 환경(변수 바인딩)을 계속 붙잡고 있다. 그래서 그 뒤에 새로 만들어진 환경(React 렌더 등)의 최신 값을 못 본다. 반대로 이 성질을 알면 상태를 외부에서 못 건드리게 숨길 수 있다.\n- <strong>어떻게:<\/strong>\n  - 함수는 생성될 때 <strong>자신이 정의된 렉시컬 환경에 대한 참조<\/strong>를 같이 들고 다닌다\n  - 바깥 함수가 끝나도 안쪽 함수가 살아 있으면 그 환경도 메모리에 남는다. GC(안 쓰는 메모리를 엔진이 자동으로 회수하는 것)가 회수하지 않는다.\n  - 쓰이는 곳은 밖에서 못 건드리는 상태(카운터, 캐시), 팩토리(설정을 받아 함수나 객체를 만들어 돌려주는 함수), 부분 적용, 디바운스 구현(타이머 id를 클로저에 보관)이다.\n  - 대가도 있다. 클로저가 들고 있는 환경은 메모리에 남는다. 큰 객체를 무심코 붙잡으면 메모리 누수가 된다.\n- <strong>핵심:<\/strong> 클로저는 값의 복사가 아니라 <strong>환경에 대한 참조<\/strong>다. 그 환경이 <strong>어느 시점에 만들어졌느냐<\/strong>가 버그를 가른다.\n- <strong>꼬리질문:<\/strong>\n  - \"클로저가 값을 복사하나 참조하나?\" → 값이 아니라 변수 바인딩을 참조한다. 같은 환경 안에서 `let` 값을 바꾸면 클로저도 바뀐 값을 본다. 문제가 되는 것은 <strong>환경 자체가 새로 만들어지는<\/strong> 경우다. React는 렌더마다 환경이 새로 만들어진다.\n  - \"클로저 때문에 메모리가 새는 대표 경우는?\" → 큰 데이터를 참조하는 함수를 전역 리스너·타이머·캐시에 등록해 놓고 해제하지 않는 경우다.\n- <strong>출처:<\/strong> [MDN — Closures](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures) · [MDN — Closures: 루프에서 만드는 클로저](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures#creating_closures_in_loops_a_common_mistake)\n\n### 커링과 부분 적용 (Currying, Partial Application)\n\n- <strong>뭐야:<\/strong> 커링은 인자 여러 개를 받는 함수를, 인자를 하나씩 받는 함수 사슬(`f(a)(b)(c)`)로 바꾸는 것이다. 부분 적용은 인자 일부를 미리 고정한 새 함수를 만드는 것이다. 두 경우 모두 먼저 받은 인자는 클로저에 기억된다.\n- <strong>왜:<\/strong> 없으면 같은 인자(조직 ID, 로그 레벨)를 매번 넘기는 코드가 여기저기 복붙된다. `onClick={() => select(id)}` 같은 래퍼 함수를 어떻게 일반화하느냐는 질문으로도 나온다.\n- <strong>어떻게:<\/strong>\n  - <strong>커링<\/strong>은 `f(a, b, c)`를 `f(a)(b)(c)`로 바꾼다. 인자를 하나씩 받는 함수가 사슬처럼 이어진다. 받은 인자는 <strong>클로저<\/strong>에 쌓인다.\n  - <strong>부분 적용<\/strong>은 인자 일부를 미리 고정한 새 함수를 만든다. `fn.bind(null, a)`도 부분 적용이다. 다만 `bind`는 `this`까지 고정한다는 점이 다르다.\n  - 범용 `curry` 함수는 `fn.length`(함수가 선언한 매개변수 개수)로 필요한 인자 수를 센다. 인자가 그만큼 모이면 원래 함수를 실행한다. 그래서 <strong>나머지 매개변수(`...args`) 함수에는 안 통한다<\/strong>.\n  ```js\n  const log = (level) => (scope) => (msg) => console[level](`[${scope}] ${msg}`);\n  const warnAuth = log(\"warn\")(\"auth\");\n  warnAuth(\"토큰 만료\"); // [auth] 토큰 만료\n  ```\n- <strong>핵심:<\/strong> 커링은 <strong>인자를 하나씩<\/strong>, 부분 적용은 <strong>일부를 먼저<\/strong> 고정한다. 둘 다 <strong>클로저로 인자를 기억<\/strong>하는 것이고, 목적은 <strong>설정과 실행의 분리<\/strong>다.\n- <strong>꼬리질문:<\/strong>\n  - \"남발하면?\" → 몇 번째 괄호가 무슨 뜻인지 코드만 봐서는 알기 어렵다. 스택 트레이스(에러가 난 호출 경로 기록)도 익명 함수로 덮인다. 옵션 객체를 받는 팩토리가 더 읽기 쉬울 때가 많다.\n  - \"핸들러 팩토리 `handle(id)`가 매 렌더 새 함수를 만들면?\" → `memo`로 감싼 자식은 props가 같으면 리렌더를 건너뛴다. 매번 새 함수가 오면 이 비교가 항상 실패한다. 자식이 무거울 때만 `data-id` + 위임 같은 방식으로 바꾼다.\n- <strong>출처:<\/strong> [javascript.info — Currying](https://javascript.info/currying-partials) · [MDN — bind(): Partially applied functions](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/bind)\n\n### stale closure와 React (Stale Closure)\n\n- <strong>뭐야:<\/strong> 콜백이나 effect가 자신이 만들어진 렌더의 옛 값을 계속 붙잡고 있어 최신 값을 못 보는 현상이다. React 함수 컴포넌트는 렌더마다 새로 호출된다. 그때마다 새 스코프가 생기기 때문에 이런 일이 일어난다.\n- <strong>왜:<\/strong> 모르면 두 가지 버그를 설명하지 못한다. `useEffect` 안의 `setInterval`이 `count`를 계속 0으로 본다. effect에서 등록한 이벤트 리스너가 첫 렌더의 props를 계속 들고 있다.\n- <strong>어떻게:<\/strong>\n  - React 함수 컴포넌트는 <strong>렌더마다 새로 호출<\/strong>된다. 그래서 렌더마다 새 스코프와 새 `count`가 생긴다.\n  - effect와 콜백은 <strong>그것이 만들어진 렌더의 스코프<\/strong>를 클로저로 잡는다. 의존성 배열은 `useEffect`의 두 번째 인자로, 여기 든 값이 바뀌면 effect가 다시 실행된다. 어떤 값이 의존성 배열에서 빠지면 effect는 옛 렌더의 값을 계속 본다.\n  - 해법은 네 가지다. ① 의존성 배열에 쓰는 값을 빠짐없이 넣는다. ② 함수형 업데이트 `setCount(c => c + 1)`를 쓴다. ③ 최신값을 `useRef`에 담아 두고 읽는다. ④ 주의: `useEffectEvent`(React 19.2에서 안정화)를 쓴다.\n  ```js\n  useEffect(() => {\n    const id = setInterval(() => setCount(count + 1), 1000); // 항상 0+1\n    return () => clearInterval(id);\n  }, []);\n  // 고침: setCount(c => c + 1)\n  ```\n- <strong>핵심:<\/strong> 렌더마다 <strong>스냅샷<\/strong>이 생기고 콜백은 <strong>자기 렌더의 스냅샷<\/strong>을 본다. 의존성 배열은 \"언제 다시 실행하나\"만이 아니라 \"<strong>어떤 렌더 값을 쓰나<\/strong>\"의 선언이다.\n- <strong>꼬리질문:<\/strong>\n  - \"그냥 의존성에 다 넣으면?\" → 의존성 값이 바뀔 때마다 타이머·구독이 해제되고 다시 등록된다. 렌더마다 바뀌는 값이 들어 있으면 렌더마다 그렇게 된다. 소켓 구독처럼 다시 연결하는 비용이 크면 다른 방법을 쓴다. ref나 effect event로 \"읽기만 최신\"을 분리한다.\n  - \"ref로 최신값을 읽는 방식의 대가는?\" → ref 값이 바뀌어도 리렌더가 일어나지 않는다. 그래서 화면에 그리는 값으로 쓰면 안 된다. 콜백 안에서 읽는 용도로만 쓴다.\n  - \"비동기 응답이 늦게 와서 옛 요청 결과가 덮는 건 stale closure인가?\" → 비슷하지만 stale closure가 아니라 경쟁 상태(race)다. 경쟁 상태는 여러 요청의 응답 순서에 따라 결과가 달라지는 문제다. 이전 요청을 취소하거나, 응답이 왔을 때 \"아직 최신 요청인가\"를 확인한다([AbortController 참고](#n02/abortcontroller로-요청-취소-abortcontroller \"AbortController로 요청 취소\")).\n- <strong>출처:<\/strong> [react.dev — useEffectEvent](https://react.dev/reference/react/useEffectEvent) · [react.dev — React 19.2](https://react.dev/blog/2025/10/01/react-19-2)\n\n> 한 줄 정리: 스코프는 정의 위치로, 초기화는 선언 종류로, 클로저는 환경 참조로 — 커링은 그 환경에 인자를 쌓는 것이고, React에서는 그 환경이 렌더마다 새로 생긴다.\n\n## 2. 객체 모델\n\n### this 바인딩 규칙 (this Binding)\n\n- <strong>뭐야:<\/strong> `this`는 함수가 실행될 때 정해지는 객체로, 함수가 누구를 대상으로 실행되는지를 가리킨다. 정의한 위치가 아니라 호출하는 방식(`obj.f()`, `new`, `call` 등)으로 정해진다. 화살표 함수만 예외로 바깥의 `this`를 쓴다.\n- <strong>왜:<\/strong> 모르면 메서드를 다른 곳에 넘겼을 때 나는 `Cannot read properties of undefined` 에러를 설명하지 못한다. 클래스 메서드를 React 이벤트 핸들러로 그냥 넘기면 `this`가 `undefined`가 된다. `setTimeout`에 넘기면 `this`가 인스턴스가 아니라 `globalThis`가 된다.\n- <strong>어떻게:<\/strong> `this`는 정의가 아니라 <strong>호출 방식<\/strong>으로 정해진다. 아래는 우선순위가 높은 순서다.\n  - <strong>`new`<\/strong>로 호출하면 `this`는 새로 만든 객체다.\n  - <strong>명시적<\/strong> 바인딩에서는 `call`·`apply`·`bind`로 지정한 객체다. `bind`로 지정한 `this`는 영구히 고정된다.\n  - <strong>암시적<\/strong> 바인딩에서는 `obj.method()`처럼 점 앞에 있는 객체다.\n  - <strong>기본<\/strong> 바인딩은 그냥 `fn()`으로 부를 때다. strict mode(실수하기 쉬운 동작을 에러로 막는 엄격한 실행 모드)에서는 `undefined`이고, 아니면 전역 객체다. 모듈과 클래스 본문은 기본이 strict mode다.\n  - <strong>화살표 함수<\/strong>는 자기 `this`가 없다. 정의된 곳 바깥의 `this`를 <strong>렉시컬하게<\/strong> 쓴다. 호출 방식과 상관없이 정의된 위치로 정해진다는 뜻이다. `call`·`bind`로도 못 바꾼다.\n- <strong>핵심:<\/strong> \"<strong>점 앞이 누구냐<\/strong>\"가 기본 규칙이고, 메서드를 <strong>변수에 꺼내 넘기는 순간 점이 사라진다.<\/strong> 화살표 함수는 `this`를 <strong>바깥에서 빌린다<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"객체 리터럴 메서드를 화살표로 쓰면?\" → `this`가 그 객체가 아니라 바깥의 `this`가 된다. 모듈이면 `undefined`다. 메서드에 화살표 함수를 쓰면 안 되는 대표적인 경우다.\n  - \"클래스 필드에 화살표 함수를 쓰는 것의 대가는?\" → `this`는 고정된다. 대신 함수가 프로토타입에 하나만 있는 것이 아니라 <strong>인스턴스마다<\/strong> 하나씩 생긴다. 인스턴스가 많으면 메모리가 늘어난다. 상속에서 `super.method()`로 부를 수도 없다.\n- <strong>출처:<\/strong> [MDN — this](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/this) · [MDN — Function.prototype.bind()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/bind)\n\n### call·apply·bind (Explicit this Binding)\n\n- <strong>뭐야:<\/strong> 함수를 부를 때 `this`를 직접 지정하는 세 메서드다. `call`과 `apply`는 지정한 `this`로 함수를 바로 호출한다. `call`은 인자를 하나씩, `apply`는 배열로 받는다. `bind`는 호출하지 않고 `this`가 고정된 새 함수를 돌려준다.\n- <strong>왜:<\/strong> 메서드를 콜백으로 넘기면 원래 객체와의 연결이 끊긴다. 그러면 `this`가 `undefined`(strict mode)나 전역 객체로 바뀐다. 이때 `this`를 고정하려면 이 메서드들이 필요하다. 유사 배열(인덱스와 `length`는 있지만 배열 메서드는 없는 객체)에 배열 메서드를 빌려 쓸 때도 필요하다. \"call과 apply 차이\"는 단골 질문이다.\n- <strong>어떻게:<\/strong>\n  - <strong>`call(thisArg, a, b)`<\/strong>는 함수를 즉시 호출한다. 인자를 <strong>하나씩<\/strong> 넘긴다.\n  - <strong>`apply(thisArg, [a, b])`<\/strong>는 함수를 즉시 호출한다. 인자를 <strong>배열로<\/strong> 넘긴다. 요즘은 `fn(...arr)` 스프레드가 대부분 대체한다.\n  - <strong>`bind(thisArg, a)`<\/strong>는 함수를 호출하지 않고 <strong>`this`가 고정된 새 함수<\/strong>를 반환한다. 앞 인자도 미리 고정할 수 있다(부분 적용).\n  - 비엄격 모드에서는 넘긴 `thisArg`가 바뀐다. `null`·`undefined`면 `globalThis`로 바뀌고, 원시값이면 객체로 감싸진다. 엄격 모드에서는 넘긴 값을 그대로 쓴다.\n  - 한 번 `bind`한 함수는 다시 `bind`해도 `this`가 안 바뀐다. 단 `new`로 부르면 묶인 `this`는 무시된다. 화살표 함수의 `this`는 세 메서드 어느 것으로도 못 바꾼다.\n- <strong>핵심:<\/strong> 셋 다 `this`를 직접 정하고, 차이는 <strong>call = 쉼표, apply = 배열, bind = 나중에 부를 새 함수<\/strong>다. bind는 <strong>재바인딩 불가<\/strong>, `new`가 bind보다 우선.\n- <strong>꼬리질문:<\/strong>\n  - \"`bind`를 render 안에서 하면?\" → `bind`는 부를 때마다 새 함수를 만든다. 그래서 렌더마다 새 함수가 자식에게 전달되고, `memo`로 감싼 자식도 매번 다시 렌더된다. 클래스 필드 화살표 함수를 쓰거나 생성자에서 한 번만 bind한다.\n  - \"`Math.max.apply(null, bigArray)`나 `Math.max(...bigArray)`의 위험은?\" → 배열 원소가 수만 개를 넘으면 엔진이 받을 수 있는 인자 개수 한계에 걸린다. 대부분은 예외가 나지만 인자가 조용히 잘릴 수도 있다. 명세가 이 동작을 정해 두지 않았기 때문이다. 큰 배열은 `reduce`로 구하거나 청크(작은 묶음)로 나눠 처리한다.\n- <strong>출처:<\/strong> [MDN — Function.prototype.call()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/call) · [MDN — Function.prototype.apply()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/apply) · [MDN — Function.prototype.bind()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/bind)\n\n### 프로토타입 체인과 class (Prototype Chain)\n\n- <strong>뭐야:<\/strong> 모든 객체는 다른 객체(또는 `null`)를 가리키는 숨은 링크(`[[Prototype]]`)를 갖는다. 객체에서 속성을 못 찾으면 이 링크를 따라 올라가며 찾는다. 이 링크의 사슬이 <strong>프로토타입 체인<\/strong>이고, `class`는 이 구조 위에 얹은 문법이다.\n- <strong>왜:<\/strong> 모르면 두 가지를 설명하지 못한다. `Object.create(null)`로 만든 객체에서 `obj.hasOwnProperty`가 없다는 에러가 나는 이유를 모른다. `for...in`이 상속된 속성까지 도는 이유도 모른다. `class`를 쓰면서도 내부에서 무슨 일이 일어나는지 말하지 못한다.\n- <strong>어떻게:<\/strong>\n  - 모든 객체는 숨은 링크 `[[Prototype]]`을 가진다. 이 링크는 `Object.getPrototypeOf`로 읽는다. 속성을 못 찾으면 이 링크를 따라 올라간다. `null`에 닿을 때까지 못 찾으면 결과는 `undefined`다.\n  - 함수의 `.prototype` 속성은 그 함수를 `new`로 불러 만든 인스턴스의 `[[Prototype]]`이 될 객체다.\n  - `class`는 이 구조를 쓰는 문법이다. 메서드는 `Class.prototype`에 들어간다. `extends`는 `Child.prototype`의 `[[Prototype]]`을 `Parent.prototype`으로 연결한다.\n  - 일반 함수로 만든 생성자와 다른 점도 있다. class는 `new` 없이 호출하면 에러가 난다. 본문은 항상 strict mode다. 선언은 TDZ의 적용을 받는다.\n  - 쓰기는 체인을 타지 않는다. `child.x = 1`은 프로토타입이 아니라 <strong>자기 자신<\/strong>에 속성을 만든다. 그 결과 프로토타입의 같은 이름 속성은 가려진다. 주의: 체인에 setter가 있으면 그 setter가 불린다\n- <strong>핵심:<\/strong> 읽기는 <strong>체인을 타고 올라가고<\/strong>, 쓰기는 <strong>자기 자신에<\/strong> 한다. `class`는 <strong>프로토타입 위의 문법 설탕<\/strong>에 가깝다.\n- <strong>꼬리질문:<\/strong>\n  - \"`instanceof`는 어떻게 판정하나?\" → 오른쪽 생성자의 `.prototype`이 왼쪽 객체의 프로토타입 체인 어딘가에 있는지 본다. iframe이나 다른 realm에서 온 배열은 `instanceof Array`가 거짓이 된다. realm은 전역 객체와 내장 객체를 따로 갖는 실행 환경이다. 그래서 배열 판정에는 `Array.isArray`를 쓴다.\n  - \"`Object.prototype`에 메서드를 추가하면?\" → 추가한 메서드가 모든 객체에서 보인다. 이것을 프로토타입 오염이라고 한다. 외부 입력에 든 `__proto__` 키를 그대로 병합하는 코드가 보안 취약점이 되는 이유다.\n- <strong>출처:<\/strong> [MDN — Inheritance and the prototype chain](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Inheritance_and_the_prototype_chain)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 340\" role=\"img\" aria-label=\"인스턴스 rex에서 Dog.prototype, Animal.prototype, Object.prototype을 거쳐 null로 끝나는 프로토타입 체인과, 생성자 함수의 prototype 속성 연결\">\n  <defs>\n    <marker id=\"p1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--fig-line)\"/><\/marker>\n  <\/defs>\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"340\" fill=\"var(--fig-bg)\"/>\n  <rect x=\"20\" y=\"150\" width=\"130\" height=\"70\" rx=\"8\" fill=\"var(--fig-muted)\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"85\" y=\"175\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">rex<\/text>\n  <text x=\"85\" y=\"198\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">name: \"Rex\"<\/text>\n  <rect x=\"190\" y=\"150\" width=\"140\" height=\"70\" rx=\"8\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <text x=\"260\" y=\"175\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Dog.prototype<\/text>\n  <text x=\"260\" y=\"198\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">bark()<\/text>\n  <rect x=\"370\" y=\"150\" width=\"150\" height=\"70\" rx=\"8\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <text x=\"445\" y=\"175\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Animal.prototype<\/text>\n  <text x=\"445\" y=\"198\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">eat()<\/text>\n  <rect x=\"560\" y=\"150\" width=\"140\" height=\"70\" rx=\"8\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <text x=\"630\" y=\"175\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Object.prototype<\/text>\n  <text x=\"630\" y=\"198\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">toString()<\/text>\n  <line x1=\"150\" y1=\"185\" x2=\"188\" y2=\"185\" stroke=\"var(--fig-accent)\" stroke-width=\"2\" marker-end=\"url(#p1)\"/>\n  <line x1=\"330\" y1=\"185\" x2=\"368\" y2=\"185\" stroke=\"var(--fig-accent)\" stroke-width=\"2\" marker-end=\"url(#p1)\"/>\n  <line x1=\"520\" y1=\"185\" x2=\"558\" y2=\"185\" stroke=\"var(--fig-accent)\" stroke-width=\"2\" marker-end=\"url(#p1)\"/>\n  <line x1=\"630\" y1=\"220\" x2=\"630\" y2=\"268\" stroke=\"var(--fig-accent)\" stroke-width=\"2\" marker-end=\"url(#p1)\"/>\n  <text x=\"630\" y=\"290\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">null<\/text>\n  <text x=\"360\" y=\"140\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">[[Prototype]] 링크 — 읽을 때 못 찾으면 오른쪽으로<\/text>\n  <rect x=\"190\" y=\"30\" width=\"140\" height=\"50\" rx=\"8\" fill=\"var(--fig-accent2)\" stroke=\"var(--fig-line)\"/>\n  <text x=\"260\" y=\"60\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">class Dog<\/text>\n  <rect x=\"370\" y=\"30\" width=\"150\" height=\"50\" rx=\"8\" fill=\"var(--fig-accent2)\" stroke=\"var(--fig-line)\"/>\n  <text x=\"445\" y=\"60\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">class Animal<\/text>\n  <line x1=\"260\" y1=\"80\" x2=\"260\" y2=\"148\" stroke=\"var(--fig-line)\" stroke-dasharray=\"5 4\" marker-end=\"url(#p1)\"/>\n  <text x=\"268\" y=\"112\" font-size=\"13\" fill=\"currentColor\">.prototype<\/text>\n  <line x1=\"445\" y1=\"80\" x2=\"445\" y2=\"148\" stroke=\"var(--fig-line)\" stroke-dasharray=\"5 4\" marker-end=\"url(#p1)\"/>\n  <text x=\"453\" y=\"112\" font-size=\"13\" fill=\"currentColor\">.prototype<\/text>\n  <line x1=\"330\" y1=\"55\" x2=\"368\" y2=\"55\" stroke=\"var(--fig-line)\" marker-end=\"url(#p1)\"/>\n  <text x=\"349\" y=\"24\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">extends<\/text>\n  <text x=\"85\" y=\"260\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">rex.eat()<\/text>\n  <text x=\"85\" y=\"280\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">→ 자기 없음 → Dog 없음<\/text>\n  <text x=\"85\" y=\"300\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">→ Animal에서 찾음<\/text>\n<\/svg>\n<figcaption>class 문법 아래에는 [[Prototype]] 링크 체인이 있고, 속성 읽기는 이 체인을 따라 올라간다<\/figcaption>\n<\/figure>\n\n### 값과 참조, 불변성 (Value vs Reference, Immutability)\n\n- <strong>뭐야:<\/strong> 원시값(숫자·문자열 등)은 대입할 때 값 자체가 복사된다. 객체·배열은 값이 아니라 같은 객체를 가리키는 참조(주소)가 복사된다. 불변성은 원본을 고치지 않고 바뀐 부분만 새로 만들어 쓰는 방식이다.\n- <strong>왜:<\/strong> 모르면 두 가지 버그를 만난다. 상태 배열에 `push`했는데 화면이 안 바뀐다. 폼 초기값 객체를 고쳤더니 원본 서버 데이터까지 바뀌어 \"취소\"가 안 먹는다. 둘 다 참조를 공유한 줄 모르고 원본을 고쳐서 생긴다.\n- <strong>어떻게:<\/strong>\n  - 원시값(`string`·`number`·`boolean`·`null`·`undefined`·`symbol`·`bigint`)은 <strong>값 자체<\/strong>가 복사된다\n  - 객체·배열·함수는 <strong>참조(주소)<\/strong>가 복사된다. 두 변수가 같은 객체를 가리키면 한쪽에서 고친 내용이 다른 쪽에서도 보인다.\n  - React는 새 상태가 이전 상태와 <strong>`Object.is`로 같으면<\/strong> 리렌더를 건너뛴다. 원본을 직접 고치면 참조가 그대로라 React는 \"변경 없음\"으로 판단한다.\n  - 불변 갱신은 바꿀 경로만 새로 만들고 나머지는 기존 참조를 재사용한다. 이것을 구조 공유라고 한다. 쓰는 도구는 `[...arr, x]`, `{ ...obj, k: v }`, `toSorted`·`toSpliced`·`with`(주의: ES2023)다.\n  - `Object.freeze`는 <strong>얕게만<\/strong> 얼린다. 1단계 속성만 못 바꾸게 하고 중첩된 객체는 여전히 바꿀 수 있다.\n- <strong>핵심:<\/strong> 객체 대입은 <strong>참조 복사<\/strong>다. React 상태는 <strong>새 참조를 만들어야<\/strong> 바뀐다. 원본 변경은 캐시·props·상태를 <strong>동시에<\/strong> 오염시킨다.\n- <strong>꼬리질문:<\/strong>\n  - \"`sort()`가 왜 위험한가?\" → `sort()`는 새 배열을 만들지 않고 원본 배열을 제자리에서 바꾼다. 쿼리 캐시에서 받은 배열을 그대로 `sort`하면 캐시 자체가 바뀐다. 복사한 뒤 정렬하거나 `toSorted`를 쓴다.\n  - \"불변성의 대가는?\" → 매번 새 객체를 할당하고, 버려진 객체를 GC가 회수해야 하는 부담이 생긴다. 깊게 중첩된 객체를 손으로 펼쳐 복사하면 코드가 길어진다. 그래서 Immer 같은 도구를 쓴다.\n- <strong>출처:<\/strong> [react.dev — Updating Arrays in State](https://react.dev/learn/updating-arrays-in-state) · [MDN — Object.freeze(): Deep freezing](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/freeze#deep_freezing) · [TC39 — Finished Proposals](https://github.com/tc39/proposals/blob/main/finished-proposals.md)\n\n### 얕은 복사·깊은 복사와 structuredClone (Shallow vs Deep Copy)\n\n- <strong>뭐야:<\/strong> 얕은 복사는 객체의 1단계만 새로 만드는 복사다. 중첩된 객체는 원본과 참조를 공유한다. 깊은 복사는 중첩된 객체까지 전부 새로 만드는 복사다. `structuredClone`은 깊은 복사를 해 주는 내장 함수다.\n- <strong>왜:<\/strong> 모르면 복사했다고 믿은 데이터에서 버그가 난다. 스프레드로 복사했는데 중첩 객체를 고치면 원본까지 바뀐다. `JSON.parse(JSON.stringify())`로 복사했더니 `Date`가 문자열이 되고 `undefined` 필드가 사라진다.\n- <strong>어떻게:<\/strong>\n  - <strong>얕은 복사<\/strong>는 `{...obj}`, `Object.assign`, `arr.slice()`로 한다. 1단계만 새로 만들고 중첩된 객체는 참조를 공유한다.\n  - <strong>`JSON` 왕복<\/strong>은 `JSON.stringify`로 문자열로 바꿨다가 `JSON.parse`로 되돌리는 방법이다. 이 과정에서 여러 값이 바뀌거나 사라진다. `Date`는 문자열이 된다. 객체 속성의 값이 `undefined`·함수·`Symbol`이면 그 속성이 빠지고, 배열 안에서는 `null`이 된다. Symbol 키는 무시된다. `Map`·`Set`은 `{}`가 된다. `NaN`·`Infinity`는 `null`이 된다. 순환 참조가 있으면 `TypeError`가 난다.\n  - <strong>`structuredClone`<\/strong>은 `Date`·`Map`·`Set`·`RegExp`·`ArrayBuffer`·`Error`·<strong>순환 참조<\/strong>까지 보존한다. 함수·DOM 노드·Symbol을 넣으면 `DataCloneError`가 난다. <strong>프로토타입 체인을 따라가지 않아<\/strong> 클래스 인스턴스는 일반 객체가 된다. getter·속성 descriptor·private 필드도 복제되지 않는다.\n  - Web Worker의 `postMessage`도 `structuredClone`과 같은 구조화 복제 알고리즘으로 데이터를 복사한다 ([1파트 참고](#n01/web-worker \"Web Worker\")).\n- <strong>핵심:<\/strong> 스프레드는 <strong>1단계만<\/strong> 복사한다. 깊은 복사는 <strong>`structuredClone`<\/strong>, 단 <strong>함수 불가·프로토타입 소실<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"깊은 복사를 자주 하면?\" → 큰 트리를 통째로 복사하면 비용이 크다. 모든 참조가 새로 바뀌므로 React 메모이제이션도 전부 깨진다. 필요한 경로만 새로 만드는 구조 공유가 낫다.\n  - \"부분 수정 요청(PATCH)을 만들 때 복사 말고 주의할 점은?\" → \"안 바꿈\"과 \"비움\"을 구분해야 한다. 예를 들어 키가 없으면 안 바꾼다는 뜻, `null`이면 비운다는 뜻으로 계약을 정한다. 그 규칙을 요청 본문을 만드는 빌더 함수에 담아 고정한다.\n- <strong>출처:<\/strong> [MDN — The structured clone algorithm](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Structured_clone_algorithm) · [MDN — JSON.stringify()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/stringify)\n\n### 동등성 비교 (==, ===, Object.is)\n\n- <strong>뭐야:<\/strong> 두 값이 같은지 판정하는 세 가지 방법이다. `==`는 타입이 다르면 변환한 뒤 비교한다. `===`는 변환 없이 비교한다. `Object.is`는 `===`와 거의 같고, `NaN`과 `+0`·`-0`을 다루는 두 경우만 다르다.\n- <strong>왜:<\/strong> 모르면 조건문이 예상과 다르게 동작한다. `0 == \"\"`가 참이라 빈 값 검사가 엉킨다. `NaN === NaN`이 거짓이라 \"값이 같으면 갱신 생략\" 로직이 매번 갱신한다.\n- <strong>어떻게:<\/strong>\n  - <strong>`==`<\/strong>는 타입이 다르면 변환한 뒤 비교한다. `null == undefined`는 참이다. `null`과 `undefined`는 서로와 자기 자신 말고는 어떤 값과 `==`로 비교해도 거짓이다.\n  - <strong>`===`<\/strong>는 타입을 변환하지 않는다. 직관과 다른 예외가 두 개 있다. `NaN === NaN`은 거짓이고, `+0 === -0`은 참이다.\n  - <strong>`Object.is`<\/strong>는 `===`에서 그 두 예외만 고친 것이다. `Object.is(NaN, NaN)`은 참이고, `Object.is(0, -0)`은 거짓이다.\n  - 객체는 세 방법 모두 <strong>참조 동일성<\/strong>만 본다. 내용이 같아도 서로 다른 객체면 다르다고 판정한다. 내용을 비교하려면 직접 구현하거나 라이브러리를 쓴다.\n  - React의 `useState`·의존성 배열·`memo`는 `Object.is`로 비교한다. 참고로 `includes`·`Map`·`Set`은 SameValueZero라는 다른 규칙을 쓴다. 이 규칙은 `NaN`끼리를 같게 보고, `+0`과 `-0`도 같게 본다.\n- <strong>핵심:<\/strong> 비교의 기본은 <strong>`===`<\/strong>다. 유일한 실용적 `==`는 <strong>`x == null`<\/strong>(null·undefined 동시 검사). React는 <strong>`Object.is`로 참조를 비교<\/strong>한다.\n- <strong>꼬리질문:<\/strong>\n  - \"`??`와 `||`의 차이는?\" → 왼쪽 값을 버리고 오른쪽 값을 쓰는 조건이 다르다. `||`는 `0`·`\"\"`·`false`도 버린다. `??`는 `null`·`undefined`만 버린다. 숫자 0이 유효한 값이면 `??`를 쓴다.\n  - \"의존성 배열에 객체 리터럴을 넣으면?\" → 객체 리터럴은 렌더마다 새 참조가 된다. 그래서 `Object.is` 비교가 매번 거짓이 되고 effect가 렌더마다 실행된다. 객체 대신 그 안의 원시값을 의존성에 넣거나, `useMemo`로 참조를 고정한다.\n- <strong>출처:<\/strong> [MDN — Equality comparisons and sameness](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Equality_comparisons_and_sameness) · [react.dev — useState: set 함수 주의점](https://react.dev/reference/react/useState#setstate-caveats)\n\n> 한 줄 정리: `this`는 호출 방식(call·apply·bind로 지정), 속성 읽기는 프로토타입 체인, 대입은 참조 복사, 비교는 참조 동일성 — React는 그 마지막 규칙 위에 서 있다.\n\n## 3. 비동기\n\n### Promise와 async/await (Promise, async/await)\n\n- <strong>뭐야:<\/strong> Promise는 아직 끝나지 않은 비동기 작업의 결과를 나중에 받기로 한 약속 객체다. 대기 상태로 시작해 성공 또는 실패로 한 번만 확정된다. `async`/`await`는 이 Promise를 동기 코드처럼 위에서 아래로 읽히게 쓰는 문법이다.\n- <strong>왜:<\/strong> 모르면 두 가지 문제를 만든다. 순서와 상관없는 요청 세 개를 `await`로 줄줄이 써서 세 요청 시간의 합만큼 걸린다. `forEach` 안의 `await`가 기다려 주지 않아 저장이 끝나기 전에 화면이 넘어간다.\n- <strong>어떻게:<\/strong>\n  - Promise는 pending(대기)에서 fulfilled(성공)나 rejected(실패)로 <strong>한 번만<\/strong> 확정된다. `then` 콜백은 확정된 뒤 <strong>마이크로태스크<\/strong>로 실행된다. 마이크로태스크는 지금 실행 중인 동기 코드가 끝난 직후에 처리되는 작업이다.\n  - `async` 함수는 항상 Promise를 반환한다. `await`는 그 지점에서 함수를 멈춘다. 나머지 부분은 나중에 마이크로태스크로 재개된다.\n  - 서로 독립인 요청은 <strong>`Promise.all`<\/strong>로 동시에 보낸다. 하나라도 실패하면 `Promise.all`은 즉시 reject된다. 이때 나머지 요청은 취소되지 않고 계속 돈다.\n  - <strong>`allSettled`<\/strong>는 전부 끝날 때까지 기다린 뒤 성공·실패 목록을 준다. <strong>`race`<\/strong>는 가장 먼저 확정된 것의 결과를 따른다. <strong>`any`<\/strong>는 가장 먼저 성공한 것의 결과를 준다.\n  - `forEach`는 콜백이 반환한 Promise를 무시한다. 그래서 콜백 안에서 `await`해도 `forEach`는 기다리지 않는다. 차례로 실행하려면 `for...of` 안에서 `await`한다. 동시에 실행하려면 `Promise.all(arr.map(...))`을 쓴다.\n- <strong>핵심:<\/strong> 여러 비동기 작업은 <strong>독립이면 `Promise.all`<\/strong>, 부분 실패를 다뤄야 하면 <strong>`allSettled`<\/strong>로 묶는다. <strong>`forEach` + `await`는 기다리지 않는다.<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"같은 요청이 동시에 여러 번 나가면?\" → 진행 중인 Promise 하나를 공유한다. 나중에 호출한 쪽은 새 요청을 보내지 않고 그 Promise의 결과를 기다린다. 이 방식을 single-flight라고 한다. 토큰 갱신처럼 한 번만 돌아야 하는 작업의 기본 패턴이다.\n  - \"응답이 영원히 안 오면?\" → Promise에는 기본 타임아웃이 없다. `Promise.race`로 타이머와 경쟁시키거나 `AbortSignal.timeout`을 건다. 시간이 초과됐을 때 대신 무엇을 할지(폴백)까지 정해야 한다.\n- <strong>출처:<\/strong> [MDN — Promise.all()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/all) · [MDN — async function](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function)\n\n### 비동기 에러 처리 (Error Handling)\n\n- <strong>뭐야:<\/strong> Promise가 실패(reject)했을 때 그 에러를 잡아 처리하는 방법이다. 방법은 세 가지다. `await`와 `try/catch`를 함께 쓰는 것, `.catch`, 전역 `unhandledrejection` 이벤트다.\n- <strong>왜:<\/strong> 모르면 세 가지 증상을 만난다. `try/catch`로 감쌌는데 에러가 안 잡힌다. 토스트에 `[object Object]`가 찍힌다. 콘솔에 `Uncaught (in promise)`만 남고 원인을 알 수 없다.\n- <strong>어떻게:<\/strong>\n  - `try/catch`는 <strong>`await`한 Promise<\/strong>의 reject만 잡는다. `await` 없이 호출만 하면 못 잡는다\n  - `.then(ok, fail)`의 `fail`은 <strong>같은 `then`의 `ok`에서 난 에러<\/strong>를 못 잡는다. 그래서 체인 끝에 `.catch`를 붙인다.\n  - 어디서도 처리하지 않은 reject는 `unhandledrejection` 이벤트로 한곳에서 모아 볼 수 있다.\n  - `throw`는 아무 값이나 던질 수 있다. 문자열·객체를 던지면 <strong>스택이 없고<\/strong>, 문자열에 이어 붙이면 `[object Object]`가 된다. 스택은 에러가 난 호출 경로 기록이다. 그래서 잡은 값이 `instanceof Error`인지 확인해 `Error`로 통일한다. 원래 에러는 `cause`로 이어 둔다(`new Error(msg, { cause })`).\n  - `finally`는 성공하든 실패하든 실행된다. 로딩 표시를 끄거나 잠금을 푸는 데 쓴다.\n- <strong>핵심:<\/strong> 비동기 에러는 <strong>`await`해야 잡힌다.<\/strong> 던질 때는 <strong>`Error` 객체<\/strong>로. 에러는 \"<strong>재시도로 풀리나<\/strong>\"로 분류해야 처리가 정해진다.\n- <strong>꼬리질문:<\/strong>\n  - \"모든 에러를 재시도하면?\" → 권한 거절·검증 실패처럼 다시 해도 같은 결과가 나오는 에러는 무한 루프가 된다. 에러를 일시적인 것(네트워크·5xx)과 영구적인 것(4xx 대부분)으로 나눈다. 영구적인 에러는 재시도하지 않고 바로 사용자에게 알린다.\n  - \"재시도할 때 서버에서 두 번 처리되면?\" → 요청에 멱등 키를 붙인다. 멱등 키는 서버가 같은 요청이 다시 온 것을 알아보고 한 번만 처리하게 하는 식별값이다. 키는 <strong>재시도마다 바뀌면 안 되고<\/strong>, 같은 의도의 요청이면 같은 값이어야 한다.\n- <strong>출처:<\/strong> [MDN — unhandledrejection](https://developer.mozilla.org/en-US/docs/Web/API/Window/unhandledrejection_event) · [MDN — Error: cause](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Error/cause)\n\n### 마이크로태스크 순서 퀴즈 (Microtask Ordering)\n\n- <strong>뭐야:<\/strong> 동기 코드, 마이크로태스크(Promise 콜백·`await` 이후 재개), 태스크(`setTimeout` 등)가 섞여 있을 때 어떤 순서로 실행되는지 맞히는 문제다. 이벤트 루프 규칙을 실제 코드에 적용해 보는 연습이다.\n- <strong>왜:<\/strong> 단골 질문이고, 실무에서는 실행 순서가 예상과 다른 버그로 만난다. \"then 안에서 setTimeout을 걸었더니 예상보다 늦음\", \"`await` 다음 줄이 다른 콜백보다 늦게 실행됨\" 같은 형태다.\n- <strong>어떻게:<\/strong> 규칙은 세 줄이다. ① 동기 코드를 끝까지 실행한다. ② 마이크로태스크 큐를 <strong>빌 때까지<\/strong> 실행한다. ③ 태스크를 하나 실행하고 다시 ②로 돌아간다 ([1파트 이벤트 루프 참고](#n01/이벤트-루프-event-loop-task-microtask-rendering \"이벤트 루프\")).\n  ```js\n  console.log(1);\n  setTimeout(() => console.log(2));\n  Promise.resolve().then(() => console.log(3));\n  (async () => {\n    console.log(4);\n    await null;\n    console.log(5);\n  })();\n  queueMicrotask(() => console.log(6));\n  console.log(7);\n  // 1 4 7 3 5 6 2\n  ```\n  - `async` 함수 본문은 <strong>첫 `await` 전까지 동기<\/strong>로 돈다. 그래서 4가 7보다 먼저 찍힌다.\n  - `await null`도 마이크로태스크를 한 번 거친다. 그래서 5는 바로 찍히지 않고, 등록 순서대로 3 다음에 찍힌다.\n  - Promise 생성자에 넘긴 콜백(`new Promise(fn)`의 `fn`)도 <strong>동기<\/strong>로 실행된다.\n- <strong>핵심:<\/strong> 실행 순서는 <strong>동기 → 마이크로태스크(등록 순) → 태스크<\/strong>다. `async` 함수는 <strong>첫 `await`까지 동기<\/strong>, Promise 생성자 콜백도 <strong>동기<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"then 안에서 또 then을 등록하면?\" → 새 콜백은 지금 비우고 있는 마이크로태스크 큐 뒤에 붙어 <strong>같은 바퀴 안에서<\/strong> 실행된다. 큐가 빌 때까지는 렌더로 넘어가지 못한다. 그래서 then이 끝없이 이어지면 화면이 갱신되지 않는다.\n  - \"`await`한 값이 이미 resolve된 Promise면 바로 재개되나?\" → 아니다. 이미 resolve된 Promise여도 마이크로태스크를 거친 뒤 재개된다. 동기 코드처럼 보여도 한 박자 늦게 실행된다.\n- <strong>출처:<\/strong> [MDN — async function](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function) · [MDN — Using microtasks](https://developer.mozilla.org/en-US/docs/Web/API/HTML_DOM_API/Microtask_guide)\n\n### AbortController로 요청 취소 (AbortController)\n\n- <strong>뭐야:<\/strong> 진행 중인 `fetch` 같은 비동기 작업에 그만두라는 신호를 보내는 객체다. 먼저 `signal`을 작업에 넘겨 둔다. 나중에 `abort()`를 부르면, 신호를 지원하는 작업(`fetch` 등)은 아직 끝나지 않은 경우 에러로 끝난다.\n- <strong>왜:<\/strong> 취소하지 않으면 두 가지 문제가 생긴다. 검색어를 빠르게 바꾸면 늦게 출발한 요청의 응답이 먼저 오고, 이전 요청의 응답이 나중에 와서 결과를 덮어쓴다. 화면을 떠났는데 요청이 끝나면서 상태를 건드린다.\n- <strong>어떻게:<\/strong>\n  - 순서는 `const ac = new AbortController()` → `fetch(url, { signal: ac.signal })` → `ac.abort()`다. `abort()`를 부르면 fetch는 `name === \"AbortError\"`인 `DOMException`으로 reject된다. `abort(reason)`처럼 이유를 넘기면 그 값으로 reject된다.\n  - 취소는 <strong>클라이언트가 결과를 버리는 것<\/strong>이지, 이미 서버에 도착한 요청의 처리를 되돌리지는 않는다\n  - `addEventListener(type, fn, { signal })`처럼 리스너에도 신호를 넘길 수 있다. 이렇게 하면 리스너 여러 개를 한 번에 해제할 수 있다.\n  - `AbortSignal.timeout(ms)`는 타임아웃 신호를 만든다. 이때 에러 이름은 <strong>`TimeoutError`<\/strong>다. `AbortSignal.any([...])`는 여러 신호를 하나로 합친다(주의: 주요 브라우저 모두 지원은 2024년 3월부터).\n  - TanStack Query는 `queryFn`에 `signal`을 넘겨준다. 이 `signal`을 fetch에 전달해야 요청이 실제로 취소된다 ([5파트 참고](#n05/요청-경쟁과-취소-race-condition-cancellation \"요청 경쟁과 취소\")).\n- <strong>핵심:<\/strong> 경쟁 상태는 디바운스가 아니라 <strong>취소 또는 최신 요청 판별<\/strong>로 막는다. <strong>AbortError는 실패가 아니라 정상 흐름<\/strong>으로 걸러야 한다.\n- <strong>꼬리질문:<\/strong>\n  - \"취소하면 서버 쪽 결제·저장도 취소되나?\" → 아니다. 서버에 이미 도착한 요청은 그대로 처리된다. 결제·저장 같은 변경 요청은 취소에 기대지 않는다. 멱등 키를 붙이고 서버 상태를 다시 조회해서 다룬다.\n  - \"AbortError에도 에러 토스트가 뜬다면?\" → 전역 에러 처리에서 `name === \"AbortError\"`인 에러를 걸러 내야 한다. 이 에러는 사용자가 일으킨 정상 취소다. 반대로 `TimeoutError`는 실패로 보여 줘야 한다. 그래서 둘을 구분한다.\n- <strong>출처:<\/strong> [MDN — AbortController.abort()](https://developer.mozilla.org/en-US/docs/Web/API/AbortController/abort) · [MDN — AbortSignal.timeout()](https://developer.mozilla.org/en-US/docs/Web/API/AbortSignal/timeout_static) · [MDN — AbortSignal.any()](https://developer.mozilla.org/en-US/docs/Web/API/AbortSignal/any_static)\n\n> 한 줄 정리: 비동기는 \"언제 실행되나(마이크로태스크)\", \"어떻게 실패하나(await해야 잡힘)\", \"어떻게 그만두나(AbortController)\" 세 축으로 정리된다.\n\n## 4. 메모리와 모듈\n\n### 가비지 컬렉션과 메모리 누수 (GC, Memory Leaks)\n\n- <strong>뭐야:<\/strong> 가비지 컬렉션(GC)은 더 이상 닿을 수 없는 객체를 엔진이 자동으로 찾아 메모리를 회수하는 것이다. 메모리 누수는 안 쓰는데 아직 누군가 참조하고 있어 회수되지 못하는 객체가 쌓이는 상태다.\n- <strong>왜:<\/strong> 누수는 잠깐 쓰는 화면에서는 안 보이다가 오래 켜 두면 드러난다. 키오스크·대시보드처럼 하루 종일 켜 두는 화면이 몇 시간 뒤 느려지거나 탭이 죽는다. 화면을 오갈수록 같은 요청이 배로 나가기도 한다.\n- <strong>어떻게:<\/strong>\n  - GC는 <strong>도달 가능성(reachability)<\/strong>으로 판정한다. 루트(전역 객체 등)에서 출발해 참조를 따라가도 닿지 않는 객체를 회수한다. 이 방식이 mark-and-sweep이고 엔진은 그 변형을 쓴다. 순환 참조도 회수된다.\n  - 누수는 \"안 쓰는데 <strong>아직 누가 참조<\/strong>하는\" 객체가 쌓이는 것이다. 대표 패턴은 아래와 같다.\n    - <strong>리스너<\/strong>를 `window`·`document`·소켓에 등록하고 해제하지 않는다.\n    - <strong>타이머<\/strong>(`setInterval`·폴링)를 언마운트되거나 요청이 실패한 뒤에도 계속 돌린다. 폴링은 일정 주기로 반복하는 조회다.\n    - <strong>클로저<\/strong>가 큰 데이터를 잡고 있는데, 그 콜백을 전역 캐시·리스너에 보관한다.\n    - <strong>분리된 DOM<\/strong>은 화면에서 지웠지만 JS 변수가 여전히 참조하는 노드다.\n    - `Map` 캐시가 무한히 커진다.\n  - 진단 방법은 세 가지다. DevTools Memory 탭에서 힙 스냅샷(그 순간 메모리에 있는 객체 목록)을 두 장 찍어 비교한다. 스냅샷에서 \"Detached\"를 검색한다. Performance monitor에서 JS heap과 리스너 수의 추이를 본다.\n  - `WeakMap`은 키를, `WeakSet`은 담긴 값을 약하게 참조한다. 그래서 그 객체가 사라지면 항목도 회수된다([아래 Map·WeakMap 참고](#n02/map-set과-weakmap-weakref-keyed-collections-weak-references \"Map·Set과 WeakMap·WeakRef\")).\n- <strong>핵심:<\/strong> 누수는 <strong>도달 가능하지만 안 쓰는 것<\/strong>이다. 등록한 것(<strong>리스너·타이머·구독<\/strong>)은 같은 생명주기에서 <strong>해제<\/strong>한다. React에서는 effect <strong>cleanup<\/strong>이 그 자리.\n- <strong>꼬리질문:<\/strong>\n  - \"실패한 요청 뒤의 폴링은?\" → 실패를 \"다음 주기에 다시\"로만 처리하면 인증이 끊긴 뒤에도 폴링이 영원히 돈다. 복구할 수 없는 실패에서는 폴링을 멈춰야 한다.\n  - \"WeakMap을 캐시로 쓰면 항상 좋은가?\" → 아니다. 키가 객체(또는 등록 안 된 Symbol)여야 한다. 순회와 크기 확인도 안 된다. 문자열 키 캐시라면 크기 상한(LRU, 가장 오래 안 쓴 항목부터 버리는 방식)을 둬야 한다.\n- <strong>출처:<\/strong> [MDN — Memory management](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Memory_management)\n\n### Map·Set과 WeakMap·WeakRef (Keyed Collections, Weak References)\n\n- <strong>뭐야:<\/strong> Map은 키-값 쌍을, Set은 값 모음을 담는 전용 컬렉션이다. 객체를 포함해 아무 값이나 키로 쓸 수 있다. WeakMap은 키를, WeakRef는 대상을 약하게 참조한다. 약한 참조는 GC의 회수를 막지 않는 참조다. 그래서 다른 곳에서 안 쓰이면 GC가 회수할 수 있다.\n- <strong>왜:<\/strong> 일반 객체를 사전처럼 쓰면 `\"__proto__\"` 같은 키가 충돌한다. 일반 Map으로 DOM 노드에 메타데이터(부가 정보)를 붙여 두면 노드가 사라져도 캐시가 안 빈다.\n- <strong>어떻게:<\/strong>\n  - <strong>Map vs 객체<\/strong>에서 Map의 장점은 이렇다. <strong>아무 값이나 키<\/strong>(객체·함수 포함)로 쓸 수 있다. <strong>삽입 순서<\/strong>가 보장되고 `size`로 개수를 바로 안다. 잦은 추가·삭제에 유리하고 프로토타입 키와 충돌하지 않는다. 대신 `JSON.stringify`가 기본으로 지원하지 않는다.\n  - <strong>WeakMap·WeakSet<\/strong>은 키(WeakSet은 담긴 값)를 <strong>약하게<\/strong> 잡는다. 그 객체가 다른 곳에서 안 쓰이면 항목째 회수된다. 키는 <strong>객체 또는 등록 안 된 Symbol<\/strong>만 된다. 등록 안 된 Symbol은 `Symbol.for`로 만들지 않은 Symbol이다. <strong>순회·`size` 불가<\/strong>다. 코드가 GC 시점을 관찰하지 못하게 하려는 것이다.\n  - 쓰이는 곳은 DOM 요소별 상태, 객체별 계산 캐시, 클래스 밖에 두는 비공개 데이터다.\n  - <strong>`WeakRef`<\/strong>(주의: ES2021)는 대상의 수명을 늘리지 않는 참조다. `deref()`가 `undefined`일 수 있다. `FinalizationRegistry` 콜백은 <strong>언제 불릴지·불릴지조차 보장이 없다<\/strong>.\n- <strong>핵심:<\/strong> 키가 <strong>객체이고 그 객체의 수명에 맞춰 사라져야 하면 WeakMap<\/strong>, 순회·크기가 필요하면 Map. WeakRef·Finalization은 <strong>GC 타이밍에 기대는 로직 금지<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"WeakMap에 넣었는데 메모리가 안 줄어든다?\" → 다른 곳(리스너·클로저·일반 Map)이 키를 아직 잡고 있으면 그 키는 여전히 도달 가능하다. 그래서 회수되지 않는다. 회수 시점도 엔진이 정한다.\n  - \"그냥 `Object.create(null)`이면 되지 않나?\" → 키 충돌은 막는다. 하지만 키가 문자열·Symbol로 제한되고 크기·순서를 다루는 API가 없다. 키가 실행 중에 정해지는 사전이라면 Map을 쓰는 쪽이 의도가 분명하다.\n- <strong>출처:<\/strong> [MDN — Map](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map) · [MDN — WeakMap](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/WeakMap) · [MDN — WeakRef](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/WeakRef)\n\n### 모듈: ESM vs CommonJS (ES Modules, CJS)\n\n- <strong>뭐야:<\/strong> JS 파일끼리 코드를 주고받는 두 가지 모듈 방식이다. ESM은 `import`/`export`를 쓰고, 코드를 실행하기 전에 의존 관계가 확정된다. CommonJS는 `require`/`module.exports`를 쓰고, 실행 중에 다른 모듈을 불러온다.\n- <strong>왜:<\/strong> 모르면 번들과 런타임에서 나는 두 가지 문제의 원인을 찾지 못한다. 라이브러리 하나만 import했는데 번들에 통째로 들어온다. 구버전 Node에서 CJS 코드가 ESM 패키지를 `require`해 SSR(서버에서 HTML을 만드는 렌더링)에서 `ERR_REQUIRE_ESM`이 난다.\n- <strong>어떻게:<\/strong>\n\n  | | ESM | CJS |\n  | --- | --- | --- |\n  | 문법 | `import`/`export` | `require`/`module.exports` |\n  | 해석 시점 | <strong>정적<\/strong>(실행 전 의존 그래프 확정) | <strong>동적<\/strong>(실행 중 `require`) |\n  | 바인딩 | <strong>라이브 바인딩<\/strong>(원본 변경이 보임) | 값 <strong>복사<\/strong>(객체면 참조) |\n  | 로딩 | 비동기 가능, top-level `await` | 동기 |\n  | `this`(최상위) | `undefined` | `module.exports` |\n\n  - 실행 중에 불러와야 하면 ESM에서도 `import()`를 쓴다. `import()`는 Promise를 반환한다. 이 지점이 코드 스플리팅(번들을 여러 파일로 나누는 것)의 경계가 된다.\n  - 주의: Node.js에서 ESM이 CJS를 import하는 것은 된다. 반대로 CJS에서 ESM을 `require`하는 것은 <strong>Node 22.12·20.19부터 플래그 없이<\/strong> 된다(25.4에서 실험 딱지 제거). 단 top-level `await`(모듈 최상위에서 쓰는 `await`)가 있는 모듈을 `require`하면 `ERR_REQUIRE_ASYNC_MODULE`이 난다. 이런 모듈은 `import()`를 써야 한다.\n- <strong>핵심:<\/strong> ESM은 <strong>정적 구조<\/strong>라 번들러가 실행 없이 무엇이 쓰이는지 안다. 이게 <strong>tree shaking의 전제<\/strong>다.\n- <strong>꼬리질문:<\/strong>\n  - \"순환 의존이 생기면?\" → ESM은 라이브 바인딩이라 나중에 값이 채워지면 그 값이 보인다. 하지만 아직 평가 전인 `let`·`const`·`class` 바인딩을 최상위에서 즉시 읽으면 TDZ 에러가 난다. 레이어 규칙(상위→하위만 import)을 지키면 레이어 사이의 순환이 구조적으로 생기지 않는다.\n  - \"import 경로를 상대경로로 아무 데나 쓰면?\" → 동작은 한다. 하지만 경계 검사 도구(모듈 사이의 의존 규칙을 검사하는 도구)가 못 잡는다. 슬라이스 밖은 절대경로로 써야 의존 방향이 보인다.\n- <strong>출처:<\/strong> [MDN — JavaScript modules](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules) · [Node.js — require()로 ESM 불러오기](https://nodejs.org/api/modules.html#loading-ecmascript-modules-using-require)\n\n### tree shaking의 전제 (Tree Shaking, sideEffects)\n\n- <strong>뭐야:<\/strong> 번들러가 import/export 관계를 따라가 쓰이지 않는 export를 최종 번들에서 빼는 최적화다. 나무를 흔들어 마른 잎을 털어 내듯 안 쓰는 코드를 떨군다.\n- <strong>왜:<\/strong> 모르면 번들이 커진 이유를 찾지 못한다. 아이콘 하나, 유틸 함수 하나만 쓰는데 번들 분석기에는 라이브러리 전체가 잡힌다. 전제 조건(ESM, 부수효과 없음)이 깨져 안 쓰는 코드가 빠지지 않은 것이다.\n- <strong>어떻게:<\/strong>\n  - 번들러가 ESM의 정적 import/export를 따라가 <strong>쓰이지 않는 export를 제거<\/strong>한다\n  - 제거가 막히는 경우는 세 가지다. CJS 패키지인 경우, `import * as`로 가져온 뒤 동적 키로 접근하는 경우, 모듈 최상위에 <strong>부수효과<\/strong>(전역 등록, polyfill, CSS import)가 있는 경우다. 부수효과는 import하는 것만으로 모듈 밖에 영향을 주는 코드다.\n  - `package.json`의 `\"sideEffects\": false`(또는 부수효과 있는 파일 목록)는 번들러에게 \"안 쓰면 통째로 빼도 된다\"고 하는 <strong>약속<\/strong>이다. 이 선언이 틀리면 필요한 CSS·등록 코드가 빠진다. 그래서 CSS는 `[\"**/*.css\"]`처럼 명시한다.\n  - 배럴 파일은 `index.ts`에서 전부 re-export하는 파일이다. 번들러와 설정에 따라서는 쓰지 않는 모듈까지 평가하게 만들 수 있다.\n- <strong>핵심:<\/strong> tree shaking이 되려면 <strong>ESM + 부수효과 없음(또는 `sideEffects` 선언)<\/strong> 이어야 한다. 확인은 추측 말고 <strong>번들 분석기<\/strong>로.\n- <strong>꼬리질문:<\/strong>\n  - \"배럴 파일을 다 없애야 하나?\" → 무조건 없앨 필요는 없다. 배럴 파일은 공개 API의 경계로서 가치가 있다. 문제가 측정되면 그 패키지만 직접 경로 import로 바꾸거나, 주의: Next.js `experimental.optimizePackageImports`(실험 옵션, `lucide-react`·`date-fns` 등은 기본 적용)를 쓴다.\n- <strong>출처:<\/strong> [webpack — Tree Shaking](https://webpack.js.org/guides/tree-shaking/) · [Next.js — optimizePackageImports](https://nextjs.org/docs/app/api-reference/config/next-config-js/optimizePackageImports)\n\n### 이터러블과 제너레이터 (Iterable, Generator)\n\n- <strong>뭐야:<\/strong> 이터러블은 `for...of`로 값을 하나씩 꺼낼 수 있도록 약속(`Symbol.iterator`)을 지킨 객체다. 제너레이터는 `yield`에서 멈췄다가 다음 요청 때 이어서 실행하는 함수다. 값을 한꺼번에 만들지 않고 필요할 때 하나씩 만든다.\n- <strong>왜:<\/strong> 없으면 \"다음이 있으면 계속 가져오는\" 흐름을 루프로 짤 때 상태 변수가 여기저기 흩어진다. 커서 페이지네이션이 대표적이다. 스트리밍 응답을 조각 단위로 처리해야 할 때도 이 방식이 맞다.\n- <strong>어떻게:<\/strong>\n  - <strong>이터러블 프로토콜<\/strong>은 객체가 지켜야 하는 약속이다. `[Symbol.iterator]()`가 `{ next() → { value, done } }`를 반환하면 그 객체에 `for...of`·스프레드·구조 분해를 쓸 수 있다. 배열·문자열·`Map`·`Set`이 이터러블이다.\n  - <strong>제너레이터<\/strong> `function*`는 `yield`에서 멈추고 `next()`가 불리면 재개한다. 값을 요청받을 때만 계산하는 <strong>지연 평가<\/strong>라 무한 수열도 표현할 수 있다.\n  - <strong>비동기 제너레이터<\/strong> `async function*`는 <strong>`for await...of`<\/strong>와 함께 쓴다. 커서 페이지를 끝까지 따라가거나 `ReadableStream`을 조각 단위로 읽는 데 맞다.\n  - 스트림을 텍스트로 읽을 때는 멀티바이트 문자(여러 바이트로 된 문자)가 청크(스트림이 나눠 보내는 조각) 경계에서 잘릴 수 있다. 그래서 `TextDecoder`에 `{ stream: true }`를 줘서 이어 붙여 디코딩한다.\n- <strong>핵심:<\/strong> 이터러블은 <strong>`Symbol.iterator` 약속<\/strong>, 제너레이터는 <strong>멈췄다 재개하는 함수<\/strong>다. 비동기 흐름은 <strong>`for await`<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"커서를 끝까지 다 받아 합산하는 방식의 위험은?\" → 건수가 많아지면 요청 수와 메모리 사용이 늘어난다. 합계는 서버가 총계로 내려 주는 것이 맞다. 클라이언트가 전부 조회해야 한다면 상한을 두고 진행 상황을 표시한다.\n- <strong>출처:<\/strong> [MDN — Iteration protocols](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Iteration_protocols) · [MDN — function*](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/function*) · [MDN — TextDecoder.decode()](https://developer.mozilla.org/en-US/docs/Web/API/TextDecoder/decode)\n\n> 한 줄 정리: 메모리는 도달 가능성으로 회수되니 등록한 것은 해제하고(객체 수명을 따라야 하면 WeakMap), 모듈은 정적인 ESM이어야 흔들어 털 수 있으며, 흐름을 끊어 읽을 땐 이터러블·제너레이터를 쓴다.\n\n## 핵심 키워드 모음\n\n- <strong>실행 컨텍스트·스코프 체인<\/strong>: 정의 위치로 정해지는 렉시컬 스코프, 안→밖 탐색\n- <strong>호이스팅·TDZ<\/strong>: var는 undefined로 조용히, let·const·class는 TDZ로 에러\n- <strong>클로저<\/strong>: 값 복사가 아니라 환경 참조, 큰 데이터를 잡으면 누수\n- <strong>커링·부분 적용<\/strong>: f(a)(b)(c) vs 일부 인자 고정, 클로저로 기억, fn.length 기반이라 rest 함수엔 안 통함\n- <strong>stale closure<\/strong>: 렌더마다 스냅샷, 콜백은 자기 렌더 값을 봄. 함수형 업데이트·ref·의존성\n- <strong>this<\/strong>: new > 명시적(bind) > 암시적(점 앞) > 기본. 화살표는 바깥 this\n- <strong>call·apply·bind<\/strong>: 쉼표 / 배열 / 고정된 새 함수. bind 재바인딩 불가, new가 우선\n- <strong>프로토타입 체인<\/strong>: 읽기는 체인을 타고, 쓰기는 자기 자신에. class는 그 위의 문법\n- <strong>값/참조·불변성<\/strong>: 객체 대입은 참조 복사, React는 새 참조로 변경 감지\n- <strong>얕은/깊은 복사<\/strong>: 스프레드는 1단계, structuredClone은 함수 불가·프로토타입 소실\n- <strong>동등성<\/strong>: 기본 ===, `x == null`만 예외, React는 Object.is\n- <strong>Promise·async/await<\/strong>: 독립이면 Promise.all, forEach+await는 안 기다림, single-flight\n- <strong>에러 처리<\/strong>: await해야 잡힘, Error 객체로 던짐, 재시도 가능 여부로 분류, 멱등 키는 고정\n- <strong>마이크로태스크 순서<\/strong>: 동기 → 마이크로태스크 → 태스크, async는 첫 await까지 동기\n- <strong>AbortController<\/strong>: 경쟁 상태 취소, AbortError는 정상 흐름(timeout은 TimeoutError), 서버 처리는 안 되돌림\n- <strong>GC·누수<\/strong>: 도달 가능성 기준, 리스너·타이머·클로저·분리 DOM·무한 캐시\n- <strong>Map·WeakMap·WeakRef<\/strong>: Map은 아무 키·순서·size, WeakMap은 객체 키·순회 불가·키 따라 회수, WeakRef는 GC 타이밍 의존 금지\n- <strong>ESM vs CJS<\/strong>: 정적·라이브 바인딩 vs 동적·값 복사\n- <strong>tree shaking<\/strong>: ESM + 부수효과 없음, sideEffects는 약속, 번들 분석기로 확인\n- <strong>이터러블·제너레이터<\/strong>: Symbol.iterator, yield로 멈춤, for await로 비동기 흐름\n"}, {"id": "n03", "num": "3", "title": "React가 화면을 갱신하는 방식", "md": "# 3. React가 화면을 갱신하는 방식\n\n<strong>이 파트는 뭐냐:<\/strong> \"왜 이게 리렌더되지?\", \"왜 effect가 두 번 돌지?\", \"memo 걸었는데 왜 안 빨라지지?\" 같은 질문에 답하려면 React가 화면을 바꾸는 흐름부터 알아야 한다. 이 파트는 상태 변화 → 렌더 → 커밋으로 화면이 바뀌는 흐름을 먼저 잡는다. 그다음 훅·메모이제이션·Context·동시성 기능이 그 흐름의 어디를 건드리는지 정리한다. 한 줄로 줄이면 이렇다. <strong>렌더는 계산, 커밋은 반영, 최적화는 \"계산을 건너뛸 근거\"를 만드는 일.<\/strong>\n\n## 1. 렌더링 파이프라인\n\n### 렌더와 커밋 단계 (Render & Commit Phase)\n\n- <strong>뭐야:<\/strong> React가 화면을 바꾸는 두 단계다. <strong>렌더<\/strong>는 컴포넌트 함수를 불러 새 UI 모습을 계산하고 이전 모습과 비교하는 단계다. 커밋은 달라진 부분만 실제 DOM에 반영하는 단계다. 렌더는 설계도를 다시 그리는 일이고, 커밋은 실제 공사를 하는 일이다\n- <strong>왜:<\/strong> 렌더를 \"화면에 그려지는 일\"로 알고 있으면 컴포넌트 함수 본문에 DOM 읽기나 API 호출을 넣게 된다. 그러면 같은 코드가 두 번 실행되거나, 화면에 반영되지 않은 렌더에서 실행되는 버그를 만난다. 그 이유도 설명하지 못한다\n- <strong>어떻게:<\/strong>\n  - <strong>트리거(Trigger)<\/strong>: 렌더를 시작하게 하는 계기다. 최초 마운트(`createRoot` → `root.render`)와 state 갱신이 있다. 마운트는 컴포넌트가 처음 화면에 올라가는 일이다\n  - <strong>렌더(Render)<\/strong>: 컴포넌트 함수를 호출해 새 엘리먼트 트리를 만들고 이전 트리와 비교한다. 이 비교를 재조정이라고 한다. 순수 계산이라 <strong>중단·폐기·재실행될 수 있다<\/strong>\n  - <strong>커밋(Commit)<\/strong>: 이전 렌더와 달라진 DOM 노드만 건드린다. 한 번 시작하면 <strong>동기적으로 끝까지<\/strong> 간다. 그 뒤로는 ref 연결 → `useLayoutEffect` → 브라우저 페인트(화면에 실제로 그리는 일) → `useEffect` 순으로 진행된다. 단 클릭 같은 상호작용이 일으킨 갱신이면 `useEffect`가 페인트 전에 돌 수도 있다\n  - 컴포넌트 함수 본문에서 DOM을 읽거나 API를 호출하면 개발 모드의 Strict Mode에서 두 번 실행된다. 동시성 렌더링에서는 버려진 렌더에서도 실행된다. 이렇게 계산 바깥을 건드리는 일을 부수효과라고 한다\n- <strong>핵심:<\/strong> 렌더 단계는 <strong>순수(pure)<\/strong>해야 한다. 부수효과(side effect)는 <strong>이벤트 핸들러나 effect<\/strong>로. \"리렌더 = DOM 갱신\"이 아니라 \"리렌더 = 함수 재호출 + 비교\"\n- <strong>꼬리질문:<\/strong>\n  - \"리렌더가 많으면 무조건 느린가요?\" → 아니다. 렌더에 드는 비용은 함수 호출과 비교라서 대부분 싸다. 느려지는 경우는 두 가지다. 큰 리스트나 무거운 계산 때문에 렌더 자체가 무거울 때가 하나다. 커밋에서 레이아웃이 크게 흔들릴 때가 다른 하나다\n  - \"렌더 중에 setState를 부르면요?\" → 무한 루프에 빠질 위험이 있다. 허용되는 패턴은 하나뿐이다. 이전 값과 비교해서 바뀐 경우에만, 렌더 중인 컴포넌트 자신의 set 함수를 부르는 것이다. 대부분은 state를 따로 두지 않고 렌더 중에 계산해서 쓰는 쪽(derived state)이 맞다\n- <strong>출처:<\/strong> [Render and Commit](https://react.dev/learn/render-and-commit) · [useState — 이전 렌더 정보 저장](https://react.dev/reference/react/useState#storing-information-from-previous-renders)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"setState가 렌더 단계와 커밋 단계를 거쳐 페인트되고 그 전후로 useLayoutEffect와 useEffect가 실행되는 순서\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <rect x=\"20\" y=\"60\" width=\"120\" height=\"70\" rx=\"10\" fill=\"none\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <text x=\"80\" y=\"92\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">트리거<\/text>\n  <text x=\"80\" y=\"114\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">setState·마운트<\/text>\n  <rect x=\"170\" y=\"40\" width=\"200\" height=\"110\" rx=\"10\" fill=\"var(--fig-accent)\" fill-opacity=\"0.15\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"270\" y=\"70\" text-anchor=\"middle\" font-size=\"16\" fill=\"currentColor\">렌더 단계<\/text>\n  <text x=\"270\" y=\"94\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">컴포넌트 함수 호출<\/text>\n  <text x=\"270\" y=\"114\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">이전 트리와 비교(재조정)<\/text>\n  <text x=\"270\" y=\"136\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-accent)\">중단·폐기·재실행 가능<\/text>\n  <rect x=\"400\" y=\"40\" width=\"160\" height=\"110\" rx=\"10\" fill=\"var(--fig-accent2)\" fill-opacity=\"0.15\" stroke=\"var(--fig-accent2)\" stroke-width=\"2\"/>\n  <text x=\"480\" y=\"70\" text-anchor=\"middle\" font-size=\"16\" fill=\"currentColor\">커밋 단계<\/text>\n  <text x=\"480\" y=\"94\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">DOM 변경 반영<\/text>\n  <text x=\"480\" y=\"114\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">ref 연결<\/text>\n  <text x=\"480\" y=\"136\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-accent2)\">동기·끝까지 실행<\/text>\n  <rect x=\"590\" y=\"60\" width=\"110\" height=\"70\" rx=\"10\" fill=\"none\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <text x=\"645\" y=\"92\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">브라우저<\/text>\n  <text x=\"645\" y=\"114\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">페인트<\/text>\n  <line x1=\"140\" y1=\"95\" x2=\"168\" y2=\"95\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <polygon points=\"168,90 168,100 176,95\" fill=\"var(--fig-line)\"/>\n  <line x1=\"370\" y1=\"95\" x2=\"398\" y2=\"95\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <polygon points=\"398,90 398,100 406,95\" fill=\"var(--fig-line)\"/>\n  <line x1=\"560\" y1=\"95\" x2=\"588\" y2=\"95\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <polygon points=\"588,90 588,100 596,95\" fill=\"var(--fig-line)\"/>\n  <line x1=\"40\" y1=\"230\" x2=\"700\" y2=\"230\" stroke=\"var(--fig-muted)\" stroke-width=\"2\"/>\n  <text x=\"40\" y=\"215\" font-size=\"13\" fill=\"var(--fig-muted)\">시간 →<\/text>\n  <circle cx=\"575\" cy=\"230\" r=\"7\" fill=\"var(--fig-accent2)\"/>\n  <text x=\"575\" y=\"262\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">useLayoutEffect<\/text>\n  <text x=\"575\" y=\"282\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-muted)\">페인트 전·동기<\/text>\n  <circle cx=\"680\" cy=\"230\" r=\"7\" fill=\"var(--fig-accent)\"/>\n  <text x=\"672\" y=\"314\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">useEffect<\/text>\n  <text x=\"652\" y=\"334\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-muted)\">보통 페인트 후<\/text>\n  <line x1=\"680\" y1=\"238\" x2=\"672\" y2=\"298\" stroke=\"var(--fig-line)\" stroke-width=\"1\"/>\n  <line x1=\"575\" y1=\"150\" x2=\"575\" y2=\"222\" stroke=\"var(--fig-line)\" stroke-dasharray=\"4 4\"/>\n  <line x1=\"680\" y1=\"130\" x2=\"680\" y2=\"222\" stroke=\"var(--fig-line)\" stroke-dasharray=\"4 4\"/>\n<\/svg>\n<figcaption>렌더는 계산이라 버려질 수 있고, 커밋은 한 번에 끝난다. layout effect는 페인트 전, effect는 보통 페인트 후.<\/figcaption>\n<\/figure>\n\n### 리렌더가 일어나는 조건 (Re-render Triggers)\n\n- <strong>뭐야:<\/strong> 리렌더는 React가 컴포넌트 함수를 다시 불러 UI를 새로 계산하는 일이다. 계기는 자기 state 변경, 부모 리렌더, 구독 중인 Context 값 변경 세 가지다\n- <strong>왜:<\/strong> 계기를 모르면 두 상황에서 원인을 못 찾는다. 입력 한 글자마다 페이지 전체가 다시 렌더되는 상황이 하나다. props가 그대로인데 자식이 리렌더된다는 리포트를 받은 상황이 다른 하나다\n- <strong>어떻게:<\/strong>\n  - 기본 계기는 세 가지다. <strong>자기 state 변경<\/strong>, <strong>부모 리렌더<\/strong>, <strong>구독 중인 Context 값 변경<\/strong>이다\n  - \"props가 바뀌어서\"는 원인이 아니다. 부모가 리렌더되면 props가 같아도 자식은 기본적으로 다시 호출된다. props를 비교해 건너뛰게 하려면 `memo`가 필요하다. 같은 엘리먼트 참조가 그대로 들어오는 children 패턴은 별개의 경우다\n  - set 함수에 이전 값과 같은 값을 넣으면 React는 그 컴포넌트와 자식의 리렌더를 건너뛴다. 같은 값인지는 `Object.is`로 판단한다. 단 React가 판단을 위해 해당 컴포넌트만 한 번 호출할 수는 있다\n  - 객체를 직접 변경(mutation)하고 같은 참조로 set하면 React는 \"같은 값\"으로 본다. 그래서 화면이 안 바뀐다\n- <strong>핵심:<\/strong> 리렌더는 <strong>위에서 아래로<\/strong> 전파된다. 상태를 <strong>필요한 곳 가까이 내리거나(state colocation)<\/strong>, 무거운 자식을 <strong>children으로 넘겨<\/strong> 리렌더 경로 밖에 두는 게 memo보다 먼저다\n- <strong>꼬리질문:<\/strong>\n  - \"children으로 넘기면 왜 리렌더가 안 되나요?\" → children 엘리먼트는 바깥 컴포넌트가 만든 것이다. 그래서 상태를 가진 컴포넌트가 리렌더돼도 같은 엘리먼트 참조가 그대로 들어온다. React는 엘리먼트 참조가 같으면 그 서브트리를 건너뛴다\n- <strong>출처:<\/strong> [useState — set 함수 주의점](https://react.dev/reference/react/useState#setstate-caveats) · [memo — props 변화 줄이기](https://react.dev/reference/react/memo#minimizing-props-changes)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"부모 상태 변경이 자식 전체로 전파되고 memo와 children 패턴이 전파를 끊는 지점\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <rect x=\"290\" y=\"20\" width=\"140\" height=\"50\" rx=\"10\" fill=\"var(--fig-accent)\" fill-opacity=\"0.2\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"360\" y=\"42\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">Page<\/text>\n  <text x=\"360\" y=\"60\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-accent)\">setState 발생<\/text>\n  <rect x=\"60\" y=\"130\" width=\"160\" height=\"50\" rx=\"10\" fill=\"var(--fig-accent)\" fill-opacity=\"0.2\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"140\" y=\"152\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">Header<\/text>\n  <text x=\"140\" y=\"170\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">리렌더<\/text>\n  <rect x=\"280\" y=\"130\" width=\"160\" height=\"50\" rx=\"10\" fill=\"none\" stroke=\"var(--fig-muted)\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/>\n  <text x=\"360\" y=\"152\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">memo(List)<\/text>\n  <text x=\"360\" y=\"170\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-muted)\">props 같으면 건너뜀<\/text>\n  <rect x=\"500\" y=\"130\" width=\"170\" height=\"50\" rx=\"10\" fill=\"none\" stroke=\"var(--fig-muted)\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/>\n  <text x=\"585\" y=\"152\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">{children}<\/text>\n  <text x=\"585\" y=\"170\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-muted)\">바깥이 만든 엘리먼트<\/text>\n  <rect x=\"60\" y=\"250\" width=\"160\" height=\"50\" rx=\"10\" fill=\"var(--fig-accent)\" fill-opacity=\"0.2\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <text x=\"140\" y=\"280\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">Logo · 리렌더<\/text>\n  <rect x=\"280\" y=\"250\" width=\"160\" height=\"50\" rx=\"10\" fill=\"none\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <text x=\"360\" y=\"280\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">Row × 1000<\/text>\n  <rect x=\"500\" y=\"250\" width=\"170\" height=\"50\" rx=\"10\" fill=\"var(--fig-accent2)\" fill-opacity=\"0.2\" stroke=\"var(--fig-accent2)\" stroke-width=\"2\"/>\n  <text x=\"585\" y=\"270\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Context 구독자<\/text>\n  <text x=\"585\" y=\"288\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-accent2)\">memo 무시하고 리렌더<\/text>\n  <line x1=\"330\" y1=\"70\" x2=\"160\" y2=\"128\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <line x1=\"360\" y1=\"70\" x2=\"360\" y2=\"128\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <line x1=\"390\" y1=\"70\" x2=\"565\" y2=\"128\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <line x1=\"140\" y1=\"180\" x2=\"140\" y2=\"248\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <line x1=\"360\" y1=\"180\" x2=\"360\" y2=\"248\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <line x1=\"585\" y1=\"180\" x2=\"585\" y2=\"248\" stroke=\"var(--fig-accent2)\" stroke-width=\"2\"/>\n  <text x=\"360\" y=\"335\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fig-muted)\">실선 굵은 색 = 리렌더 전파 · 점선 = 전파가 끊기는 지점<\/text>\n<\/svg>\n<figcaption>리렌더는 부모에서 자식으로 내려간다. memo와 children 패턴이 끊고, Context 변경은 memo를 뚫는다.<\/figcaption>\n<\/figure>\n\n### 재조정과 key (Reconciliation & key)\n\n- <strong>뭐야:<\/strong> 재조정(Reconciliation)은 새 렌더 결과를 이전 트리와 비교해 무엇을 유지하고 무엇을 바꿀지 정하는 과정이다. <strong>key<\/strong>는 형제 항목 중 \"같은 항목\"을 알아보게 붙이는 이름표다. 상태는 컴포넌트가 아니라 트리의 위치에 붙는다\n- <strong>왜:<\/strong> key를 잘못 주면 두 가지 버그가 난다. 배열 순번을 key로 쓰는 인덱스 key가 대표적이다. 리스트 중간 항목을 지웠을 때 항목 내용은 한 칸씩 올라오는데 입력값은 제자리에 남아 엉뚱한 항목에 붙는다. 탭을 바꿨는데 이전 탭의 폼 상태가 그대로 남기도 한다\n- <strong>어떻게:<\/strong>\n  - 두 트리를 일반적인 방법으로 비교하면 O(n³)이 든다. 그래서 React는 두 가지 가정을 두고 O(n)에 끝나는 어림 규칙(휴리스틱)을 쓴다. <strong>타입이 다르면 서브트리를 통째로 교체<\/strong>한다. <strong>형제 사이에선 key로 같은 항목을 식별<\/strong>한다\n  - 같은 위치·같은 타입이면 상태를 유지한다. 상태는 컴포넌트가 아니라 <strong>트리의 위치<\/strong>에 붙어 있다\n  - 인덱스 key를 쓰면 정렬·삽입·삭제가 일어날 때 다른 항목에 같은 key가 붙는다. 그래서 state와 DOM 상태(입력값, 포커스)가 엉뚱한 항목에 남는다\n  - 반대로 key를 일부러 바꾸면 <strong>상태 초기화<\/strong>가 된다. 예: `<Form key={userId} />`\n- <strong>핵심:<\/strong> key는 <strong>형제 사이에서 안정적이고 고유한 id<\/strong>여야 한다. 인덱스 key는 순서가 안 바뀌는 정적 리스트에서만. <strong>key 변경 = 리마운트 = 상태 리셋<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"인덱스 key가 정말 문제 되는 경우는?\" → 두 조건이 겹칠 때다. 항목이 자체 state나 비제어 input(DOM이 값을 들고 있는 input)을 갖고 있다. 그리고 순서가 바뀌거나 중간에 삽입·삭제가 있다\n- <strong>출처:<\/strong> [Preserving and Resetting State](https://react.dev/learn/preserving-and-resetting-state) · [Reconciliation (legacy)](https://legacy.reactjs.org/docs/reconciliation.html)\n\n### Virtual DOM과 Fiber (Virtual DOM & Fiber)\n\n- <strong>뭐야:<\/strong> Virtual DOM은 UI의 \"있어야 할 모습\"을 메모리 객체로 두고 실제 DOM과 맞추는 방식이다. Fiber는 그 비교 작업을 잘게 쪼개 멈추고 재개할 수 있게 만든 React의 재조정 엔진이다\n- <strong>왜:<\/strong> Virtual DOM을 \"빠르게 해 주는 기술\"로만 알면 \"DOM을 직접 조작하는 것보다 빠르냐\"는 질문에 답하지 못한다. Virtual DOM과 Fiber를 구분하지 못하면 동시성 기능이 무엇 위에서 돌아가는지도 설명하지 못한다\n- <strong>어떻게:<\/strong>\n  - <strong>Virtual DOM<\/strong>: UI의 \"있어야 할 모습\"을 메모리에 객체로 두고 실제 DOM과 맞추는(재조정) 패턴이다. 목적은 <strong>선언형 프로그래밍 모델<\/strong>이다. 개발자는 상태만 바꾸고, 어떤 DOM 연산이 필요한지는 React가 계산한다\n  - 비교 계산 자체가 추가 비용이다. 그래서 꼭 필요한 DOM 연산만 하도록 손으로 짠 코드보다 <strong>본질적으로 빠를 수 없다<\/strong>. 얻는 것은 \"충분히 빠르면서 실수 없는 갱신\"이다\n  - <strong>Fiber<\/strong>(React 16의 재조정 엔진): 렌더 작업을 컴포넌트 단위의 작은 작업으로 쪼갠 구조다. 덕분에 렌더를 <strong>멈췄다 재개·폐기·우선순위 지정<\/strong>할 수 있다. Suspense와 React 18의 동시성 렌더링·transition이 이 위에 올라간다\n- <strong>핵심:<\/strong> Virtual DOM의 가치는 속도가 아니라 <strong>선언형 + 충분한 성능<\/strong>. Fiber는 렌더를 <strong>쪼개고 끊을 수 있게<\/strong> 만든 엔진이라 동시성 기능의 토대다\n- <strong>꼬리질문:<\/strong>\n  - \"Virtual DOM 없는 프레임워크(Svelte·Solid)가 더 빠르지 않나요?\" → 이 프레임워크들은 컴파일 시점에 갱신 코드를 만들어 비교 비용을 없앴다. 그래서 벤치마크에선 유리할 수 있다. React는 React Compiler로 불필요한 재계산을 줄이는 쪽을 택했다\n- <strong>출처:<\/strong> [Virtual DOM and Internals (legacy)](https://legacy.reactjs.org/docs/faq-internals.html) · [React v18 — Concurrent React](https://react.dev/blog/2022/03/29/react-v18#what-is-concurrent-react)\n\n> 한 줄 정리: 렌더는 버려질 수 있는 계산, 리렌더는 위에서 아래로, key는 상태의 주소, Fiber는 그 계산을 쪼개는 엔진이다.\n\n## 2. 상태와 훅\n\n### 상태 업데이트 배칭과 함수형 업데이트 (Batching & Updater Function)\n\n- <strong>뭐야:<\/strong> 배칭(batching)은 여러 setState를 모아 한 번만 리렌더하는 것이다. 함수형 업데이트는 `setCount(c => c + 1)`처럼 이전 값을 받아 다음 값을 돌려주는 함수를 넘기는 방식이다. state는 렌더 시점의 <strong>스냅샷<\/strong>이라 같은 핸들러 안에서는 값이 바뀌지 않는다\n- <strong>왜:<\/strong> 이걸 모르면 두 가지를 설명하지 못한다. `setCount(count + 1)`을 세 번 불렀는데 1만 오르는 이유가 하나다. setState 직후에 값을 읽었는데 이전 값이 나오는 이유가 다른 하나다\n- <strong>어떻게:<\/strong>\n  - state는 <strong>렌더 시점의 스냅샷<\/strong>이다. 같은 핸들러 안의 `count`는 끝까지 같은 값이다\n  - 여러 setState는 모아서(batch) 한 번만 리렌더한다. 주의: React 18(`createRoot`)부터는 `setTimeout`·Promise·네이티브 이벤트 안에서도 <strong>자동 배칭(automatic batching)<\/strong>이 된다. 17까지는 React 이벤트 핸들러 안에서만 배칭했다\n  - 이전 값을 바탕으로 갱신할 때는 <strong>함수형 업데이트<\/strong> `setCount(c => c + 1)`를 쓴다. 넘긴 함수는 큐에 쌓여 순서대로 적용된다\n  - 배칭을 끊어야 할 때는 `flushSync`를 쓴다. 갱신 직후에 DOM을 측정해야 하는 경우가 그렇다. 예외적인 경우에만 쓴다\n- <strong>핵심:<\/strong> state는 <strong>스냅샷<\/strong>이고 업데이트는 <strong>큐<\/strong>에 쌓인다. 이전 값 기반이면 <strong>updater 함수<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"함수형 업데이트가 stale closure도 막나요?\" → stale closure는 함수가 옛 렌더의 값을 붙잡고 있는 현상이다. 그중 setState 쪽은 막는다. 콜백이 오래된 클로저여도 updater는 최신 state를 인자로 받는다. 그래서 effect 의존성에서 state를 뺄 수 있다. 하지만 state를 읽어서 다른 일을 하는 코드는 못 막는다\n- <strong>출처:<\/strong> [React v18 — 자동 배칭](https://react.dev/blog/2022/03/29/react-v18#new-feature-automatic-batching) · [useState — 이전 state 기반 갱신](https://react.dev/reference/react/useState#updating-state-based-on-the-previous-state)\n\n### 훅 규칙과 호출 순서 (Rules of Hooks)\n\n- <strong>뭐야:<\/strong> React는 훅을 이름이 아니라 <strong>호출 순서<\/strong>로 구분한다. 그래서 훅은 컴포넌트·커스텀 훅의 최상위에서만, 매 렌더 같은 순서로 불러야 한다는 규칙이 있다\n- <strong>왜:<\/strong> 조건문 안에서 `useState`를 부르면 \"Rendered more hooks than during the previous render\" 에러가 난다. 상태가 다른 변수에 엉뚱하게 들어가는 경우도 있다\n- <strong>어떻게:<\/strong>\n  - React는 훅을 이름이 아니라 <strong>호출 순서<\/strong>로 식별한다. 컴포넌트(Fiber)마다 훅 목록이 있고, n번째로 호출한 훅은 n번째 슬롯을 쓴다\n  - 조건문·반복문 안이나 early return(함수 중간에서 먼저 반환하는 것) 뒤에서 훅을 부르면 렌더마다 호출 순서가 달라진다. 그러면 슬롯이 어긋난다\n  - 규칙은 두 개다. <strong>최상위에서만 호출<\/strong>한다. <strong>React 함수(컴포넌트·커스텀 훅) 안에서만 호출<\/strong>한다. 이벤트 핸들러 안, `useMemo`·`useEffect`에 넘긴 함수 안, `try/catch` 블록 안에서도 부르면 안 된다\n  - 예외: 주의: React 19의 `use`는 조건문·반복문 안에서 호출할 수 있다. 그래도 컴포넌트·훅 안이어야 하고 `try/catch`로 감쌀 수 없다\n- <strong>핵심:<\/strong> 훅의 정체성은 <strong>호출 순서<\/strong>다. 그래서 <strong>조건부 호출 금지<\/strong>. 조건이 필요하면 훅 안쪽에서 분기하거나 컴포넌트를 쪼갠다\n- <strong>꼬리질문:<\/strong>\n  - \"왜 이름(key) 기반으로 안 만들었나요?\" → 이름 기반이면 커스텀 훅을 여러 번 조합할 때 이름이 충돌한다. 순서 기반이라서 같은 커스텀 훅을 두 번 불러도 각각 독립된 상태를 갖는다. 그 대가가 조건부 호출 금지다\n  - \"커스텀 훅은 상태를 공유하나요?\" → 아니다. 커스텀 훅이 공유하는 것은 로직이다. 상태는 호출한 컴포넌트마다 따로 생긴다. 상태를 공유하려면 상위 컴포넌트의 state, Context, 외부 스토어 중 하나를 쓴다\n- <strong>출처:<\/strong> [Rules of Hooks](https://react.dev/reference/rules/rules-of-hooks) · [use](https://react.dev/reference/react/use)\n\n### 로직 재사용: HOC·render props·커스텀 훅 (Logic Reuse Patterns)\n\n- <strong>뭐야:<\/strong> 여러 컴포넌트가 같은 상태 로직을 나눠 쓰는 방법들이다. HOC는 컴포넌트를 감싸는 함수다. render props는 그릴 내용을 함수 prop으로 받는 컴포넌트다. <strong>커스텀 훅<\/strong>은 `use`로 시작하는 함수로 로직만 꺼낸 것이다\n- <strong>왜:<\/strong> 방법을 모르면 여러 화면이 같은 구독·타이머·권한 판정 로직을 복사해 붙여 쓰게 된다. 각 방식의 대가를 모르면 \"HOC와 훅 중 뭘 쓰겠냐\"는 질문에 답하지 못한다\n- <strong>어떻게:<\/strong>\n  - <strong>HOC<\/strong>: 컴포넌트를 받아서 감싼 새 컴포넌트를 돌려주는 함수다(`withAuth(Page)`). 대가는 네 가지다. 래퍼가 겹겹이 쌓인다. props 이름이 충돌한다. ref가 안쪽 컴포넌트까지 전달되지 않는다. 정적 메서드를 따로 복사해야 한다\n  - <strong>render props<\/strong>: \"무엇을 그릴지\"를 함수 prop으로 받는 컴포넌트다. 함수를 인라인으로 넘기므로 `memo` 비교가 매번 깨진다. JSX 중첩도 깊어진다\n  - <strong>커스텀 훅<\/strong>: `use`로 시작하는 함수로 <strong>상태 있는 로직<\/strong>을 꺼낸다. 트리에 래퍼가 추가되지 않는다. 값을 그냥 반환하니 여러 훅을 조합하기도 쉽다. 단 <strong>상태 자체는 공유하지 않고<\/strong> 호출한 컴포넌트마다 따로 생긴다\n  - 문서 권고는 두 가지다. 훅을 부르지 않는 함수에는 `use`를 붙이지 않는다. `useMount`처럼 생명주기를 흉내 내는 훅은 만들지 않는다\n- <strong>핵심:<\/strong> 로직 재사용의 기본은 <strong>커스텀 훅<\/strong>이다. HOC는 <strong>렌더 자체를 가로채야 할 때<\/strong>(권한 가드, 레거시 라이브러리)만. 커스텀 훅은 <strong>로직 공유, 상태 비공유<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"HOC가 아직 필요한 경우는요?\" → 렌더 결정 자체를 감싸야 할 때다. 컴포넌트를 아예 안 그리거나 다른 걸 그리게 하는 가드가 그 예다.\n- <strong>출처:<\/strong> [Reusing Logic with Custom Hooks](https://react.dev/learn/reusing-logic-with-custom-hooks) · [Higher-Order Components (legacy)](https://legacy.reactjs.org/docs/higher-order-components.html) · [Render Props (legacy)](https://legacy.reactjs.org/docs/render-props.html)\n\n### useEffect 의존성·클린업·Strict Mode 이중 실행 (Effect Dependencies & Cleanup)\n\n- <strong>뭐야:<\/strong> useEffect는 컴포넌트를 네트워크·소켓·타이머 같은 외부 시스템과 <strong>동기화<\/strong>하는 도구다. 의존성은 \"언제 다시 맞출지\", 클린업은 \"방금 맞춘 것을 어떻게 되돌릴지\"를 정한다\n- <strong>왜:<\/strong> 의존성·클린업을 틀리면 두 가지 버그가 생긴다. 화면을 나갔는데도 소켓·타이머·구독이 살아서 계속 돈다. id를 빠르게 바꿨을 때 늦게 도착한 이전 응답이 화면을 덮는다(race condition). 개발 모드에서 effect가 두 번 도는 이유도 설명하지 못한다\n- <strong>어떻게:<\/strong>\n  - effect는 <strong>외부 시스템과의 동기화<\/strong> 수단이다. \"마운트할 때 한 번 실행\"이 아니라 \"의존성 값이 이럴 때 외부를 이렇게 맞춘다\"로 읽는다\n  - 의존성에는 effect 안에서 읽는 반응형 값을 <strong>전부<\/strong> 넣는다. 반응형 값은 props, state, 그리고 그 둘에서 파생된 값이다. 하나라도 빼면 effect가 오래된 값을 본다\n  - 렌더 중에 만든 객체·함수를 의존성에 넣으면 매 렌더 새 참조라서 effect가 매번 돈다. 그래서 객체는 effect 안에서 만드는 게 정석이다\n  - 클린업은 <strong>다음 effect 실행 전<\/strong>과 <strong>언마운트 시<\/strong>에 실행된다. 여기서 구독과 타이머를 해제한다. 응답이 뒤바뀌는 race는 `AbortController.abort()`나 `ignore = true` 플래그로 막는다\n  - 주의: React 18부터 <strong>Strict Mode(개발 모드)<\/strong>는 마운트 → 클린업 → 마운트를 한 번 더 돌린다. 클린업이 빠진 effect를 일부러 드러내려는 것이다. 운영 빌드에선 한 번만 실행된다\n- <strong>핵심:<\/strong> effect는 <strong>동기화<\/strong>, 의존성은 <strong>읽는 값 전부<\/strong>, 클린업은 <strong>방금 한 일을 되돌리기<\/strong>다. 이중 실행에서 깨지면 클린업이 틀린 것\n- <strong>꼬리질문:<\/strong>\n  - \"이중 실행이 싫어서 ref로 한 번만 돌게 막으면요?\" → 문서가 직접 금지하는 패턴이다. 증상만 숨길 뿐이라 라우트 이동, Fast Refresh, 주의: React 19.2 `<Activity>`에서 같은 문제가 난다. `<Activity>`는 숨길 때 effect를 정리했다가 다시 보일 때 재실행한다. 고칠 곳은 클린업이다\n  - \"effect에서 데이터 페칭하면 뭐가 아쉽나요?\" → 세 가지가 아쉽다. 서버에서 실행되지 않는다. 부모가 렌더된 뒤에야 자식이 요청을 보내는 워터폴이 생긴다. 캐시·중복 제거·race 처리를 직접 해야 한다. 그래서 TanStack Query 같은 라이브러리나 서버 컴포넌트 페칭([4파트 참고](#n04/데이터-페칭과-캐싱-계층-data-fetching-caching-layers \"데이터 페칭과 캐싱 계층\"))을 쓴다\n- <strong>출처:<\/strong> [Synchronizing with Effects — 개발 모드 이중 실행](https://react.dev/learn/synchronizing-with-effects#how-to-handle-the-effect-firing-twice-in-development) · [React v18 — Strict Mode 변경](https://react.dev/blog/2022/03/29/react-v18#new-strict-mode-behaviors)\n\n### stale closure와 latest ref 패턴 (Stale Closure & Latest Ref)\n\n- <strong>뭐야:<\/strong> stale closure는 함수가 만들어진 렌더의 값을 계속 붙잡고 있어 최신 state·props 대신 옛 값을 보는 현상이다. latest ref 패턴은 ref에 매번 최신 콜백을 넣어 두고 호출할 때 그걸 꺼내 쓰는 해법이다\n- <strong>왜:<\/strong> 모르면 두 가지 버그를 못 잡는다. `setInterval` 콜백에서 state를 읽으면 계속 초기값이 나오는 버그가 하나다. 마운트 때 한 번 등록한 소켓 리스너가 첫 렌더의 props만 보는 버그가 다른 하나다\n- <strong>어떻게:<\/strong>\n  - 함수는 <strong>만들어진 렌더의 값<\/strong>을 클로저로 잡는다. 그래서 값을 의존성에서 빠뜨리면 effect·`useCallback` 안의 함수는 옛 렌더에 갇힌다\n  - 해결 1: 의존성에 제대로 넣는다. 재구독이 괜찮다면 이게 정석이다\n  - 해결 2: setState만 필요하면 함수형 업데이트를 쓴다\n  - 해결 3: <strong>latest ref<\/strong> — 매 커밋마다 `ref.current = callback`으로 최신 함수를 넣어 둔다. 등록은 한 번만 하고, 호출할 때 `ref.current()`를 부른다\n  - 주의: React 19.2부터는 `useEffectEvent`가 공식 해법이다. effect 안의 \"비반응형 로직\"을 꺼내서 최신 props·state를 읽게 해 준다. 비반응형 로직은 값이 바뀌어도 effect를 다시 돌릴 필요가 없는 로직이다. effect(또는 다른 Effect Event) 안에서만 호출한다. 의존성 배열에 넣거나 자식에게 넘기지 않는다\n- <strong>핵심:<\/strong> 클로저는 <strong>렌더 스냅샷<\/strong>을 잡는다. \"등록은 한 번, 값은 최신\"이 필요하면 <strong>ref에 최신 콜백<\/strong> 또는 <strong>useEffectEvent<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"latest ref를 렌더 중에 대입하면요?\" → 렌더는 버려질 수 있다. 그래서 렌더 중에 대입하면 커밋되지 않은 렌더의 값이 ref에 들어갈 수 있다. `useLayoutEffect`(또는 `useEffect`) 안에서 대입하는 게 안전하다\n  - \"그럼 모든 콜백을 ref·useEffectEvent로 감싸면 되지 않나요?\" → 그러면 의존성 추적을 끄는 것과 같다. 값이 바뀌었을 때 다시 동기화해야 하는 로직까지 숨기게 된다. roomId가 바뀌면 재연결해야 하는 로직이 그 예다.\n- <strong>출처:<\/strong> [useEffectEvent](https://react.dev/reference/react/useEffectEvent) · [React 19.2](https://react.dev/blog/2025/10/01/react-19-2)\n\n### 제어 컴포넌트와 비제어 컴포넌트 (Controlled vs Uncontrolled)\n\n- <strong>뭐야:<\/strong> 입력값을 누가 들고 있느냐의 차이다. 제어 컴포넌트는 React state가 값을 갖는다(`value` + `onChange`). 비제어 컴포넌트는 DOM이 값을 갖고 있다가 필요할 때 ref나 `FormData`로 꺼낸다\n- <strong>왜:<\/strong> 둘을 섞으면 \"A component is changing an uncontrolled input to be controlled\" 경고가 난다. 필요 없는 곳까지 제어로 만들면 입력 하나에 폼 전체가 리렌더된다. 폼이 무거우면 타이핑이 버벅인다\n- <strong>어떻게:<\/strong>\n  - <strong>제어(controlled)<\/strong>: `value` + `onChange`로 쓴다. React state가 값의 유일한 출처(single source of truth)다. 입력할 때마다 리렌더된다. 대신 즉시 검증·포맷팅·조건부 UI를 만들기 쉽다\n  - <strong>비제어(uncontrolled)<\/strong>: `defaultValue`를 주고 ref로 읽거나, 제출할 때 `FormData`로 읽는다. 값은 DOM이 가진다. 리렌더가 없다. 대신 값에 따라 실시간으로 바뀌는 UI는 만들기 번거롭다\n  - `value`가 `undefined`·`null`과 문자열 사이를 오가면 제어/비제어가 섞였다는 경고가 난다. 그래서 초기값을 `''`로 둔다. input 하나가 사는 동안 제어와 비제어 사이를 오가면 안 된다\n  - 주의: React 19: `<form action={fn}>`의 액션이 성공하면 폼 안의 비제어 필드가 자동으로 리셋된다. `onSubmit` 핸들러로 처리할 때는 해당하지 않는다\n- <strong>핵심:<\/strong> 제어·비제어는 값을 <strong>누가 소유하나<\/strong>의 문제다. 입력마다 UI가 반응해야 하면 <strong>제어<\/strong>, 제출 시점에만 필요하면 <strong>비제어<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"제어 input을 `useTransition`으로 감싸 입력을 빠르게 할 수 있나요?\" → 안 된다. 문서가 명시한 제약이다. input의 value 갱신은 동기여야 한다. 그래서 입력 state는 즉시 갱신한다. 그 값을 쓰는 무거운 결과 쪽만 transition이나 `useDeferredValue`로 미룬다\n- <strong>출처:<\/strong> [`<input>` — 제어 input](https://react.dev/reference/react-dom/components/input#controlling-an-input-with-a-state-variable) · [`<form>` — action prop](https://react.dev/reference/react-dom/components/form#handle-form-submission-with-an-action-prop)\n\n> 한 줄 정리: state는 렌더 스냅샷이고 훅은 호출 순서로 식별되며, 로직 재사용은 커스텀 훅으로, effect는 클린업까지가 한 세트다.\n\n## 3. 메모이제이션과 Context\n\n### useMemo·useCallback·React.memo가 안 먹히는 경우 (Memoization Pitfalls)\n\n- <strong>뭐야:<\/strong> 셋 다 이전 결과를 기억해 두고 다시 쓰는 메모이제이션 도구다. `useMemo`는 계산 결과를 재사용한다. `useCallback`은 함수 참조를 재사용한다. `React.memo`는 props가 같을 때 컴포넌트 렌더를 재사용한다. 셋 다 비교 대상이 이전과 같을 때만 효과가 있다\n- <strong>왜:<\/strong> 모르면 두 상황에서 막힌다. `memo`로 감쌌는데 Profiler에 렌더가 계속 찍힌다. `useCallback`을 곳곳에 넣었는데 체감 차이가 없다. 둘 다 비교가 한 군데라도 깨지면 메모이제이션이 소용없어서 생기는 일이다\n- <strong>어떻게:<\/strong>\n  - `memo`는 props를 하나씩 <strong>`Object.is`로 얕게 비교<\/strong>한다. 얕은 비교는 객체 안쪽을 보지 않고 참조가 같은지만 본다. 인라인 객체 `style={{}}`, 인라인 함수, `children` JSX가 하나라도 있으면 비교가 매번 실패한다\n  - `useCallback`은 <strong>memo된 자식에 넘기거나 다른 훅의 의존성에 들어갈 때<\/strong>만 의미가 있다. 일반 DOM 요소에 넘기면 참조를 비교할 주체가 없어서 비용만 든다\n  - memo는 <strong>Context 변경<\/strong>과 <strong>자기 state 변경<\/strong>으로 생기는 리렌더는 못 막는다\n  - `useMemo`는 성능 최적화일 뿐, 값이 유지된다는 보장이 아니다. 개발 중 파일 수정이나 최초 마운트 중 suspend 같은 상황에서 React가 캐시를 버릴 수 있다고 문서에 명시돼 있다\n  - 주의: React Compiler 1.0(2025-10-07)은 빌드 시점에 메모이제이션을 자동으로 넣는다(React 17 이상 지원). Next.js 16에서 `reactCompiler` 옵션이 stable이 됐지만 기본값은 꺼짐이다. Babel 기반이라 빌드가 느려진다\n- <strong>핵심:<\/strong> memo는 <strong>사슬<\/strong>이다. 부모가 <strong>참조를 안정화<\/strong>하지 않으면 끊긴다. 먼저 <strong>구조(상태 내리기·children)<\/strong>로 풀고 남은 곳에만 측정 후 적용\n- <strong>꼬리질문:<\/strong>\n  - \"그럼 전부 memo하면 안전한가요?\" → 비교 비용·메모리·코드 복잡도가 늘어난다. 의존성을 하나 빠뜨리면 오래된 값을 쓰는 stale 버그도 난다. 측정해서 비싼 곳에만 쓴다\n  - \"memo에 custom 비교 함수를 넣으면?\" → 함수 props를 무시하도록 비교하면 오래된 콜백을 쓰는 버그가 생긴다. 비교 함수는 함수를 포함한 모든 prop을 봐야 한다. 깊은 비교는 오히려 느려질 수 있다\n  - \"컴파일러가 있으면 memo 지식이 필요 없나요?\" → 여전히 필요하다. 컴파일러는 코드가 Rules of React를 지킨다고 전제하고 분석·검증한다. 그래서 규칙을 어긴 코드는 기대대로 최적화되지 않을 수 있다. 컴파일러가 기본값대로 꺼져 있는 프로젝트도 많다. 왜 리렌더되는지 이해해야 컴파일러의 결과도 검증할 수 있다\n- <strong>출처:<\/strong> [memo](https://react.dev/reference/react/memo) · [useMemo — 주의점](https://react.dev/reference/react/useMemo#caveats) · [React Compiler v1.0](https://react.dev/blog/2025/10/07/react-compiler-1)\n\n### Context 리렌더 범위와 쪼개기 (Context Re-render Scope)\n\n- <strong>뭐야:<\/strong> Context는 props를 여러 단계 거치지 않고 트리 아래 컴포넌트에 값을 바로 전달하는 통로다. Provider는 값을 내려 주는 컴포넌트다. Provider의 value가 바뀌면 그 Context를 읽는 컴포넌트가 전부 리렌더된다\n- <strong>왜:<\/strong> 범위를 모르고 전역 `AppContext` 하나에 user·theme·모달 상태를 다 넣으면 모달 하나를 열 때마다 그 Context를 읽는 곳이 전부 리렌더된다. user·theme만 읽는 컴포넌트도 같이 리렌더된다\n- <strong>어떻게:<\/strong>\n  - Provider의 `value`가 바뀌면 그 Context를 읽는 <strong>모든 컴포넌트가 리렌더<\/strong>된다. 바뀌었는지는 `Object.is`로 판단한다. 중간에 있는 `memo`도 이 리렌더를 막지 못한다\n  - Provider를 가진 컴포넌트가 리렌더될 때 `value={{ a, b }}`를 인라인으로 만들면 매번 새 객체가 된다. 그러면 모든 구독자가 리렌더된다. `useMemo`·`useCallback`으로 참조를 고정해서 막는다\n  - <strong>쪼개기<\/strong>: 자주 바뀌는 값과 드물게 바뀌는 값을 별도 Context로 나눈다. <strong>state와 dispatch(setter)를 분리<\/strong>하면 setter만 쓰는 컴포넌트는 리렌더되지 않는다\n  - Context에는 셀렉터(값의 일부만 골라 구독하는 함수)가 없다. 일부 필드만 구독하려면 `useSyncExternalStore` 기반 외부 스토어를 쓴다(Zustand 등, [5파트 참고](#n05/전역-상태-라이브러리-선택-context-zustand-jotai \"전역 상태 라이브러리 선택\"))\n- <strong>핵심:<\/strong> Context는 <strong>전달 수단<\/strong>이지 상태 관리 최적화 도구가 아니다. <strong>값이 바뀌면 구독자 전부<\/strong>. 빈도별로 <strong>쪼개고<\/strong>, 세밀한 구독은 <strong>외부 스토어<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"그럼 Redux·Zustand는 왜 덜 리렌더되나요?\" → 컴포넌트가 셀렉터로 필요한 조각만 구독하기 때문이다. 그 조각이 바뀔 때만 리렌더된다\n  - \"서버 상태도 Context에 넣어도 되나요?\" → 넣으면 캐시·재검증·로딩 상태를 직접 관리해야 한다. 그래서 TanStack Query 같은 서버 상태 도구에 맡기는 게 낫다\n- <strong>출처:<\/strong> [useContext — 리렌더 최적화](https://react.dev/reference/react/useContext#optimizing-re-renders-when-passing-objects-and-functions) · [React v19 — Context as provider](https://react.dev/blog/2024/12/05/react-19#context-as-a-provider)\n\n> 한 줄 정리: 메모이제이션은 참조 안정성의 사슬이라 구조로 먼저 풀고(컴파일러는 그 사슬을 자동화할 뿐), Context는 바뀌면 구독자 전부를 흔든다.\n\n## 4. DOM과 맞닿는 지점\n\n### useLayoutEffect vs useEffect\n\n- <strong>뭐야:<\/strong> 둘 다 커밋 뒤에 실행되는 effect인데 시점이 다르다. `useLayoutEffect`는 브라우저가 화면을 그리기(페인트) 전에, `useEffect`는 보통 그린 뒤에 실행된다\n- <strong>왜:<\/strong> 잘못 고르면 두 가지 문제가 난다. 툴팁 위치를 effect에서 계산하면 한 프레임 동안 엉뚱한 자리에 보였다가 튄다(flicker). 반대로 layout effect에 무거운 일을 넣으면 화면이 늦게 뜬다\n- <strong>어떻게:<\/strong>\n  - `useLayoutEffect`: 커밋 직후 <strong>페인트 전에<\/strong> 실행된다. 안에서 setState하면 페인트 전에 동기로 다시 렌더한다. 그래서 사용자는 최종 결과만 본다\n  - `useEffect`: 보통 페인트 <strong>후<\/strong>에 실행된다. 화면 그리기를 막지 않는다. 단 클릭 같은 상호작용이 일으킨 effect는 페인트 전에 돌 수 있다\n  - <strong>보이기 전에 끝나야 하는 일<\/strong>만 layout effect에 둔다. 레이아웃을 측정(`getBoundingClientRect`)한 뒤 위치를 보정하는 일이 그 예다. 문서도 \"가능하면 useEffect\"를 권한다\n  - 서버 렌더링에선 둘 다 실행되지 않는다. SSR에서 측정이 필요하면 그 부분을 클라이언트에서만 렌더한다. 아니면 측정 전 상태로 그려도 문제없게 만든다\n- <strong>핵심:<\/strong> <strong>측정 후 보정이면 layout effect<\/strong>, <strong>그 외는 전부 effect<\/strong>다. layout effect는 <strong>페인트를 막는다<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"마운트 시점에 폭이 0으로 나오는 건 왜죠?\" → 부모가 `display:none`이었거나, 아직 레이아웃이 확정되지 않은 탭·애니메이션 안에서 측정했기 때문이다. ResizeObserver(요소 크기가 바뀔 때 알려 주는 브라우저 API)로 다시 잴 수 있다. 측정 자체가 필요 없게 CSS로 푸는 쪽이 더 낫다\n- <strong>출처:<\/strong> [useLayoutEffect](https://react.dev/reference/react/useLayoutEffect)\n\n### 포털 (Portal)\n\n- <strong>뭐야:<\/strong> 포털은 컴포넌트를 DOM상 다른 위치(body 등)에 그리면서 React 트리상 부모 관계는 그대로 두는 기능이다(`createPortal`). 모달의 몸은 바깥에 두고 소속은 원래 부모에 남기는 셈이다\n- <strong>왜:<\/strong> 포털 없이 모달·드롭다운을 부모 안에 그리면 세 가지 문제가 난다. 부모의 `overflow: hidden`에 잘린다. 부모의 `transform` 때문에 `position: fixed`가 뷰포트 기준이 아니게 된다. z-index를 아무리 올려도 다른 스태킹 컨텍스트 아래에 깔리기도 한다\n- <strong>어떻게:<\/strong>\n  - `createPortal(children, domNode)`: <strong>DOM은 다른 곳(body 등)에<\/strong>, <strong>React 트리상 위치는 그대로<\/strong> 둔다\n  - 그래서 Context·state는 원래 부모 것을 그대로 쓴다\n  - 이벤트도 <strong>React 트리 기준으로 전파<\/strong>된다. 포털 안에서 난 클릭은 DOM상 부모가 아니라 React 부모의 `onClick`까지 올라간다. 막으려면 `stopPropagation`을 쓴다\n  - \"바깥 클릭 시 닫기\"를 DOM `contains`로 판정하면 포털 안의 내용이 바깥으로 잘못 판정된다\n  - 접근성도 챙긴다. 포커스 트랩(포커스가 모달 밖으로 나가지 않게 가두는 것)·`aria-modal`·ESC를 WAI-ARIA 모달 패턴대로 구현하거나 라이브러리에 맡긴다\n- <strong>핵심:<\/strong> 포털은 <strong>DOM 위치만 옮기고 React 관계는 유지<\/strong>한다. 이벤트 전파는 <strong>React 트리 기준<\/strong>\n- <strong>꼬리질문:<\/strong>\n  - \"z-index만 올리면 되지 않나요?\" → 스태킹 컨텍스트는 요소들의 앞뒤 순서를 따로 매기는 묶음이다. z-index는 같은 스태킹 컨텍스트 안에서만 비교된다. 그래서 컨텍스트가 다르면 숫자를 올려도 소용없다. 층위를 올려서 해결하면 다른 겹침 문제가 생긴다. 포털로 DOM 위치를 옮기는 게 근본 해법이다\n- <strong>출처:<\/strong> [createPortal](https://react.dev/reference/react-dom/createPortal)\n\n### 합성 이벤트와 이벤트 위임 (SyntheticEvent & Delegation)\n\n- <strong>뭐야:<\/strong> React 핸들러가 받는 `e`는 브라우저 이벤트를 감싸 브라우저 차이를 숨긴 <strong>합성 이벤트<\/strong>다. React는 노드마다 리스너를 달지 않고 루트 한 곳에서 이벤트를 받아 나눠 주는 위임 방식을 쓴다\n- <strong>왜:<\/strong> 이 구조를 모르면 두 상황에서 원인을 못 찾는다. React 핸들러의 `stopPropagation`과 `document`에 건 네이티브 리스너의 실행 순서가 기대와 다를 때가 하나다. 부모 `onScroll`에 자식의 스크롤이 안 잡힐 때가 다른 하나다\n- <strong>어떻게:<\/strong>\n  - 핸들러가 받는 `e`는 브라우저 이벤트를 감싼 <strong>합성 이벤트(SyntheticEvent)<\/strong>다. W3C 이벤트 인터페이스(`target`·`preventDefault()` 등)에 맞춰져 있어 브라우저 차이를 숨긴다. 원본 이벤트는 `e.nativeEvent`에 있다\n  - React는 노드마다 리스너를 달지 않고 <strong>루트에서 위임(delegation)<\/strong>한다. 주의: React 17부터 위임 지점이 `document`에서 <strong>root 컨테이너<\/strong>로 바뀌었다. 여러 React 버전이 공존할 때와 외부 코드와 섞일 때의 충돌을 줄이려는 변경이다\n  - 주의: React 17에서 <strong>이벤트 풀링 제거<\/strong>: 이벤트 풀링은 React가 이벤트 객체를 재사용하던 방식이다. 이제 비동기 콜백에서 `e`를 읽어도 된다. `e.persist()`도 필요 없다\n  - 브라우저와 다른 점: `onFocus`·`onBlur`는 React에선 버블링된다(내부적으로 `focusin`/`focusout`을 쓴다). 반대로 `onScroll`은 React 17부터 브라우저와 똑같이 버블링되지 않는다. 캡처 단계에서 받으려면 `onClickCapture`처럼 `Capture` 접미사를 붙인다\n- <strong>핵심:<\/strong> 합성 이벤트는 <strong>브라우저 차이를 숨긴 래퍼 + 루트 위임<\/strong>이다. 네이티브 리스너와 섞으면 <strong>전파 순서가 엇갈린다<\/strong>는 걸 기억한다\n- <strong>꼬리질문:<\/strong>\n  - \"React에서 stopPropagation하면 document 리스너도 막히나요?\" → React 17+에선 위임 지점이 root다. 그래서 root 바깥(document)에 버블 단계로 단 네이티브 리스너보다 React 처리가 먼저 끝나고, 이벤트는 거기서 멈춘다. `{ capture: true }`로 단 document 리스너는 React보다 먼저 받는다. 반대로 root 안쪽에 직접 단 네이티브 리스너는 React 핸들러보다 먼저 실행된다\n- <strong>출처:<\/strong> [React event object](https://react.dev/reference/react-dom/components/common#react-event-object) · [React v17 RC — 이벤트 위임 변경](https://legacy.reactjs.org/blog/2020/08/10/react-v17-rc.html#changes-to-event-delegation)\n\n> 한 줄 정리: 보이기 전 측정만 layout effect로, 갇힌 레이어는 포털로 옮기고, 이벤트는 루트에 위임된 합성 이벤트라 React 트리 기준으로 흐른다.\n\n## 5. 실패와 대기를 다루는 경계\n\n### 에러 바운더리 (Error Boundary)\n\n- <strong>뭐야:<\/strong> 에러 바운더리는 자식 트리의 렌더 중 에러를 잡아 그 영역만 대체 UI로 바꾸는 컴포넌트다. try/catch를 컴포넌트 트리 단위로 두는 것과 비슷하다\n- <strong>왜:<\/strong> 에러 바운더리가 없으면 컴포넌트 하나가 `undefined.map`으로 터져도 앱 전체가 흰 화면이 된다. 렌더 중 에러를 아무도 잡지 않으면 React가 UI 전체를 화면에서 걷어내기 때문이다\n- <strong>어떻게:<\/strong>\n  - 클래스 컴포넌트로 만든다. `static getDerivedStateFromError`로 대체 UI를 정하고 `componentDidCatch`로 로그를 남긴다. 같은 일을 하는 함수 컴포넌트용 API가 없어서 보통 `react-error-boundary`를 쓴다\n  - 잡는 것: 자식 트리의 <strong>렌더·라이프사이클<\/strong>에서 던진 에러다. `startTransition` 안에서 던진 에러도 잡힌다\n  - 못 잡는 것: <strong>이벤트 핸들러<\/strong>, <strong>비동기 코드<\/strong>(setTimeout, rAF 콜백), SSR, 바운더리 자신의 에러다. 이벤트 핸들러의 에러는 try/catch로 처리한다. 아니면 state에 담아 렌더 중에 던진다\n  - 배치: 라우트·위젯 단위로 두면 에러가 난 한 영역만 대체 UI로 바뀐다. 복구는 `resetKeys`나 key 변경으로 한다\n  - 주의: React 19: `createRoot`·`hydrateRoot`에 옵션 두 개가 생겼다. `onCaughtError`는 바운더리가 잡은 에러를 받는다. `onUncaughtError`는 아무도 못 잡은 에러를 받는다. 렌더 에러를 다시 throw하지 않게 돼서 콘솔에 중복으로 찍히는 일도 줄었다\n- <strong>핵심:<\/strong> 에러 바운더리는 <strong>렌더 중 에러<\/strong>만 잡는다. <strong>이벤트·비동기는 못 잡음<\/strong>. 배치는 <strong>실패를 격리할 단위<\/strong>로\n- <strong>꼬리질문:<\/strong>\n  - \"TanStack Query 에러를 바운더리로 보내려면?\" → `throwOnError`(v5)로 쿼리 에러를 렌더 중에 던지게 한다. `QueryErrorResetBoundary`와 묶어서 재시도할 때 쿼리를 리셋한다([5파트 참고](#n05/전역-onerror와-중복-토스트-global-error-handler \"전역 onError와 중복 토스트\"))\n- <strong>출처:<\/strong> [Component — Error Boundary](https://react.dev/reference/react/Component#catching-rendering-errors-with-an-error-boundary) · [React v19 — 에러 리포팅](https://react.dev/blog/2024/12/05/react-19#error-handling)\n\n### Suspense와 lazy (Suspense & Code Splitting)\n\n- <strong>뭐야:<\/strong> Suspense는 자식이 \"아직 준비 안 됨\"을 알리면 그동안 fallback(대신 보여 줄 로딩 UI)을 보여주는 로딩 경계다. lazy는 컴포넌트 코드를 동적 import로 따로 떼어 필요할 때 불러오는 함수다\n- <strong>왜:<\/strong> 없으면 차트·에디터 같은 무거운 라이브러리가 초기 번들에 다 들어가 첫 화면이 늦어진다. 컴포넌트마다 `isLoading` 분기가 흩어져 로딩 스피너가 여기저기서 따로 깜빡이기도 한다\n- <strong>어떻게:<\/strong>\n  - `<Suspense fallback>`: 자식이 <strong>\"아직 준비 안 됨\"을 알리면(suspend)<\/strong> 가장 가까운 Suspense의 fallback을 대신 보여준다. 로딩 상태를 컴포넌트마다 처리하지 않고 위쪽 경계에 선언해 두는 장치다\n  - `lazy(() => import('./Chart'))`: 동적 import로 청크(따로 내려받는 코드 조각)를 분리한다. 그 코드를 불러오는 동안에는 suspend한다\n  - 데이터로 suspend하려면 Suspense를 지원하는 소스가 필요하다. 프레임워크(Next.js 서버 컴포넌트), TanStack Query `useSuspenseQuery`, 주의: React 19 `use(promise)`가 그런 소스다. effect나 이벤트 핸들러 안에서 하는 페칭은 Suspense를 트리거하지 않는다\n  - 이미 보이던 화면이 transition 안에서 다시 suspend되면 fallback으로 되돌리지 않고 <strong>이전 화면을 유지<\/strong>한다\n  - SSR에선 Suspense 경계가 <strong>스트리밍 단위<\/strong>가 된다([4파트 참고](#n04/스트리밍-loading-tsx-suspense-streaming \"스트리밍·loading.tsx·Suspense\"))\n- <strong>핵심:<\/strong> Suspense는 <strong>\"기다림의 경계\"<\/strong>다. 경계 위치가 곧 <strong>로딩 UX 설계<\/strong>. lazy는 <strong>코드<\/strong>를, use·Suspense 쿼리는 <strong>데이터<\/strong>를 기다린다\n- <strong>꼬리질문:<\/strong>\n  - \"경계를 잘게 쪼개면 좋은가요?\" → 너무 잘게 쪼개면 스피너가 여기저기서 따로 튀는 팝콘 현상이 생긴다. 함께 보여야 하는 영역은 한 경계로 묶는다\n  - \"use(promise)의 promise를 렌더 안에서 만들면?\" → 렌더마다 새 promise가 만들어져서 계속 suspend된다. 서버 컴포넌트에서 만든 promise를 넘기거나 캐시된 promise를 쓴다\n- <strong>출처:<\/strong> [Suspense](https://react.dev/reference/react/Suspense) · [use — promise 주의점](https://react.dev/reference/react/use#promise-caveats)\n\n### 동시성 렌더링: useTransition·useDeferredValue (Concurrent Rendering)\n\n- <strong>뭐야:<\/strong> 동시성 렌더링은 렌더를 중간에 끊을 수 있게 해서, 급한 업데이트(입력)를 급하지 않은 업데이트(결과 목록)보다 먼저 처리하는 방식이다. `useTransition`·`useDeferredValue`는 어떤 업데이트가 덜 급한지 React에 알려 주는 훅이다\n- <strong>왜:<\/strong> 모든 업데이트를 똑같이 급하게 처리하면 두 가지 문제가 난다. 검색어 입력에 따라 수천 행을 필터링할 때 타이핑 자체가 버벅인다. 탭을 전환할 때 무거운 탭이 그려지는 동안 클릭이 먹통이 된다\n- <strong>어떻게:<\/strong>\n  - 주의: React 18부터 렌더가 <strong>중단 가능(interruptible)<\/strong>해졌다. 급한 업데이트(입력)가 급하지 않은 업데이트(결과 목록)를 끊고 먼저 처리된다\n  - `useTransition`: `startTransition(() => setTab(next))`로 <strong>업데이트를 낮은 우선순위로 표시<\/strong>한다. 진행 중인지는 `isPending`으로 알 수 있다. setter를
