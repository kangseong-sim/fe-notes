어 조건을 좁힌다. 추측으로 고치고 테스트를 맞춰 쓰면 회귀 테스트가 아니다.\n- <strong>출처:<\/strong> [Testing Overview — 비욘세 규칙·발견한 문제에 자동 테스트 추가 (Software Engineering at Google, 11장)](https://abseil.io/resources/swe-book/html/ch11.html)\n\n> 한 줄 정리: 순수 로직은 유닛, 핵심 흐름은 e2e, mock은 바깥 경계에만, 버그는 실패 테스트부터.\n\n## 5. 접근성\n\n### 시맨틱 태그·키보드·aria (Semantic HTML, ARIA)\n\n- <strong>뭐야:<\/strong> 시맨틱 태그는 `<button>`·`<nav>`처럼 역할이 담긴 HTML 요소이고, aria는 네이티브 요소로 표현 못 하는 역할·이름·상태를 보조 기술에 알려주는 속성이다.\n- <strong>왜:<\/strong> `<div onClick>`으로 만든 버튼은 Tab으로 못 가고 Enter도 안 먹고 스크린리더는 \"버튼\"이라 읽지 않는다. 이름을 주지 않은 아이콘 버튼은 \"버튼\"이라고만 읽히기도 한다.\n- <strong>어떻게:<\/strong>\n  - <strong>네이티브 요소 우선<\/strong>: `<button>`·`<a href>`·`<label for>`·`<nav>`·`<main>`·`<ul>`. 포커스·키보드·역할이 공짜\n  - 이동은 `<a>`, 동작은 `<button>` — 섞으면 새 탭 열기·뒤로 가기가 깨진다\n  - aria 첫 규칙: <strong>네이티브로 되면 aria를 쓰지 않는다<\/strong>. ARIA 역할은 키보드 동작을 주지 않는 \"약속\"일 뿐이라, 잘못된 aria는 없는 것보다 나쁘다(APG: No ARIA is better than bad ARIA)\n  - 이름: 아이콘 버튼엔 `aria-label`, 상태는 `aria-expanded`·`aria-pressed`·`aria-selected`, 비동기 결과 안내는 `aria-live`\n  - 커스텀 위젯(탭·콤보박스)은 WAI-ARIA 패턴의 키보드 동작(화살표·Esc)까지 구현하거나 검증된 headless 라이브러리(Radix 등) 사용\n- <strong>핵심:<\/strong> <strong>시맨틱 태그가 접근성의 기반<\/strong>. aria는 네이티브로 안 되는 것만 <strong>보충<\/strong>한다.\n- <strong>꼬리질문:<\/strong>\n  - \"공용 Button 컴포넌트를 만들면 접근성은 어떻게 보장하나요?\" → 내부를 `<button>`으로 두고 `type` 기본값을 명시(폼 안 의도치 않은 submit 방지), 아이콘 전용 변형은 `aria-label`을 타입으로 필수화한다.\n  - \"자동 검사 도구로 충분한가요?\" → axe·Lighthouse는 대비·누락 라벨 같은 기계적 위반만 잡는다. 키보드만으로 한 바퀴 도는 수동 확인이 필요하다.\n- <strong>출처:<\/strong> [Read Me First — No ARIA is better than bad ARIA (WAI-ARIA APG)](https://www.w3.org/WAI/ARIA/apg/practices/read-me-first/) · [Using ARIA — Rules of ARIA use (W3C)](https://www.w3.org/TR/using-aria/)\n\n### 포커스 관리와 색 대비 (Focus Management, Color Contrast)\n\n- <strong>뭐야:<\/strong> 포커스 관리는 키보드 포커스가 어디로 가고 어디로 돌아올지 정하는 것이고, 색 대비는 글자·UI 요소와 배경의 상대 휘도 대비율을 기준 이상으로 맞추는 것이다.\n- <strong>왜:<\/strong> 관리하지 않으면 모달을 열었는데 Tab이 뒤 페이지로 새고, 닫으면 포커스가 문서 맨 위로 튄다. 대비가 낮은 연회색 안내 문구는 햇빛 아래 키오스크에서 안 읽힌다.\n- <strong>어떻게:<\/strong>\n  - 모달: 열 때 안쪽으로 포커스 이동(보통 첫 상호작용 요소, 내용이 길면 제목) → Tab이 안에서 <strong>순환<\/strong>(focus trap) → Esc로 닫기 → 닫으면 <strong>연 버튼으로 복귀<\/strong>. 뒤 콘텐츠는 `inert`\n  - SPA 라우트 이동 후 새 화면 제목으로 포커스를 옮기거나 `aria-live`로 알린다\n  - `:focus-visible`로 브라우저가 필요하다고 판단할 때(주로 키보드 이동)만 포커스 링 → `outline: none`만 하고 대체를 안 주는 게 흔한 실수\n  - 색 대비: WCAG AA 기준 일반 텍스트 <strong>4.5:1<\/strong>, 큰 텍스트(18pt 이상, 굵으면 14pt 이상) <strong>3:1<\/strong>(1.4.3), 버튼·입력 경계·포커스 표시 같은 UI 컴포넌트와 의미 있는 그래픽 <strong>3:1<\/strong>(1.4.11). 반올림 금지(4.499:1 탈락)\n  - 정보를 <strong>색만으로<\/strong> 전달하지 않는다: 오류는 빨간색 + 아이콘·문구\n- <strong>핵심:<\/strong> 포커스는 <strong>이동·가두기·복귀<\/strong> 세 단계. 대비는 <strong>4.5:1 / 3:1<\/strong>, 색만으로 의미를 전달하지 않는다.\n- <strong>꼬리질문:<\/strong>\n  - \"`<dialog>` 요소를 쓰면 다 해결되나요?\" → `showModal()`은 뒤를 inert로 만들고 Esc 닫기를 주며, HTML 표준상 닫힐 때 <strong>열기 전 포커스 요소로 되돌린다<\/strong>. 배경 스크롤 잠금·여닫기 애니메이션·연 버튼이 사라진 경우의 대체 포커스는 따로 챙긴다.\n- <strong>출처:<\/strong> [Understanding SC 1.4.3 Contrast (Minimum) (W3C)](https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html) · [Understanding SC 1.4.11 Non-text Contrast (W3C)](https://www.w3.org/WAI/WCAG22/Understanding/non-text-contrast.html) · [Dialog (Modal) Pattern (WAI-ARIA APG)](https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/)\n\n> 한 줄 정리: 네이티브 태그가 먼저, aria는 보충, 포커스는 이동·가두기·복귀, 대비는 4.5:1.\n\n## 6. 에러 처리와 유지보수\n\n### 에러 처리 설계 (User Message vs Developer Log)\n\n- <strong>뭐야:<\/strong> 실패를 사용자에게 보여줄 문구와 개발자가 볼 로그로 나눠 다루는 설계다. 화면엔 할 수 있는 행동을, 로그엔 원인을 남긴다.\n- <strong>왜:<\/strong> 설계가 없으면 조회가 실패했는데 화면엔 \"데이터가 없습니다\"가 뜬다. 사용자는 정말 없는 줄 알고, 개발자는 신고가 안 와서 모른다. 반대로 `[object Object]`나 스택이 사용자에게 그대로 보이기도 한다.\n- <strong>어떻게:<\/strong>\n  - 상태를 셋으로 <strong>반드시 구분<\/strong>: 로딩 / <strong>빈 상태<\/strong>(성공했는데 0건) / <strong>오류<\/strong>(실패 + 다시 시도)\n  - 사용자 문구와 개발자 로그를 분리: 화면엔 <strong>할 수 있는 행동<\/strong>(다시 시도·문의), 로그엔 코드·요청 ID·원본 에러\n  - 에러를 <strong>부류로 분류<\/strong>: 일시적(재시도), 권한·정책(재시도 무의미, 서버 문구 노출), 버그(로그·보고)\n  - 상태코드만으로 부족하면 서버 <strong>커스텀 코드<\/strong>로 가른다(같은 403이라도 토큰 문제 vs 플랜 거절)\n  - 전역 처리(토스트)와 화면 처리(인라인 오류)의 <strong>책임을 한 곳<\/strong>으로 → 이중 노출 방지\n  - React Error Boundary는 렌더 중 에러만 잡는다. 이벤트 핸들러·`setTimeout` 같은 비동기·SSR·경계 자신의 에러는 못 잡는다(예외: `useTransition`의 `startTransition` 안에서 던진 에러는 잡힌다). 함수 컴포넌트로는 못 만들어 클래스나 `react-error-boundary`를 쓴다\n- <strong>핵심:<\/strong> <strong>실패를 빈 상태로 보이지 않는다.<\/strong> 사용자에겐 <strong>행동<\/strong>, 개발자에겐 <strong>원인<\/strong>. 에러는 <strong>부류별로<\/strong> 처리 경로가 다르다.\n- <strong>꼬리질문:<\/strong>\n  - \"모든 실패에 재시도 버튼을 주나요?\" → 권한 거절처럼 재시도로 안 풀리는 실패엔 안 준다. 둘을 나누는 게 설계다.\n  - \"Error Boundary를 어디에 두나요?\" → 앱 최상단 하나면 한 위젯 오류에 전체가 날아간다. 독립적으로 실패해도 되는 영역 단위로 둔다.\n- <strong>출처:<\/strong> [Component — Catching rendering errors with an Error Boundary (react.dev)](https://react.dev/reference/react/Component#catching-rendering-errors-with-an-error-boundary)\n\n### 에러 모니터링과 관측성 (Error Monitoring, Observability)\n\n- <strong>뭐야:<\/strong> 운영 중인 사용자 브라우저에서 난 오류를 모아 개발자가 원인까지 볼 수 있게 하는 체계다. 수집 지점·소스맵·맥락 정보가 그 재료다.\n- <strong>왜:<\/strong> 없으면 운영에서만 나는 오류를 사용자 신고로 처음 알고, 받은 스택도 `a.js:1:48213`처럼 압축된 코드라 읽을 수 없다.\n- <strong>어떻게:<\/strong>\n  - <strong>수집 지점<\/strong>: Error Boundary(렌더), `window`의 `error`(동기적으로 던져진 스크립트 에러. 요소의 리소스 로드 실패는 버블링되지 않아 캡처 단계 리스너로), `unhandledrejection`(처리 안 된 Promise 거부), API 인터셉터\n  - <strong>소스맵<\/strong>: 빌드 때 만들어 모니터링 도구(Sentry 등)에 올린다(Sentry는 빌드 과정 업로드를 권장, 공개 호스팅도 가능). 압축 스택을 원본 줄로 되돌린다\n  - <strong>맥락<\/strong>: 릴리스·사용자 역할·앱 버전(웹뷰)을 태그로 붙여야 \"어느 배포부터, 누구에게\"가 보인다\n- <strong>핵심:<\/strong> 관측성은 <strong>수집 지점 + 소스맵 + 맥락 태그<\/strong>. 사용자 문구와 달리 여기엔 <strong>원인 전부<\/strong>를 남긴다.\n- <strong>꼬리질문:<\/strong>\n  - \"에러가 너무 많이 쌓이면?\" → 확장 프로그램·취소된 요청 같은 소음을 거르고, 새 오류와 급증만 알린다.\n- <strong>출처:<\/strong> [unhandledrejection event (MDN)](https://developer.mozilla.org/en-US/docs/Web/API/Window/unhandledrejection_event) · [Source Maps (Sentry Docs)](https://docs.sentry.io/platforms/javascript/sourcemaps/)\n\n### 레거시 걷어내기 (Dead Code Removal)\n\n- <strong>뭐야:<\/strong> 더 이상 쓰이지 않는 prop·파일·export를 참조가 없음을 확인한 뒤 단계적으로 지우는 작업이다.\n- <strong>왜:<\/strong> 안 걷어내면 아무도 안 쓰는 것 같은 prop·파일이 쌓여 리팩터 때마다 \"이거 지워도 되나\" 조사에 시간이 든다. 감으로 지웠다가는 런타임에 터진다.\n- <strong>어떻게:<\/strong>\n  - <strong>참조 0 확인<\/strong>: grep·IDE \"Find References\"·`knip`(미사용 파일·export·의존성 탐지, Next.js 등 프레임워크 진입 파일을 플러그인으로 인식) 같은 도구. 문자열 경로·동적 import·라우트 파일 규칙(파일명이 곧 진입점)은 grep에 안 걸리니 따로 확인\n  - <strong>단계별 삭제<\/strong>: 호출부 제거 → 타입·prop 제거 → 파일 제거를 각각 커밋. 문제가 생기면 그 단계만 되돌린다\n  - 외부에 노출된 것(URL·딥링크·API 필드)은 바로 지우지 않는다: 리다이렉트·폴백을 남기고 사용량을 본 뒤 제거\n  - 주입 지점이 0인 옵션 prop은 \"언젠가 쓸 것\"이 아니라 <strong>죽은 분기<\/strong>\n- <strong>핵심:<\/strong> <strong>참조 0 확인 → 단계별 삭제 → 외부 노출은 호환 유지<\/strong>. 삭제도 커밋 단위가 작아야 되돌릴 수 있다.\n- <strong>꼬리질문:<\/strong>\n  - \"grep에서 0건이면 지워도 되나요?\" → 프레임워크 규칙 파일(page·layout), 문자열로 조립한 import, 다른 레포·앱이 부르는 경로는 안 잡힌다. 빌드·타입 검사·주요 e2e까지 통과해야 확신한다.\n- <strong>출처:<\/strong> [Knip](https://knip.dev/)\n\n### 리팩터링 안전장치 (Safe Refactoring)\n\n- <strong>뭐야:<\/strong> 리팩터링은 겉으로 보이는 동작은 그대로 두고 코드 구조만 바꾸는 작업이다. 안전장치는 그 \"동작 그대로\"를 테스트와 커밋 분리로 보장하는 방법이다.\n- <strong>왜:<\/strong> 구조를 바꾸면서 동작도 같이 바꾸면 버그가 났을 때 어느 쪽 탓인지 모른다. 큰 PR 하나로 묶이면 리뷰도 형식적이 된다.\n- <strong>어떻게:<\/strong>\n  - <strong>구조 변경과 동작 변경을 분리<\/strong>: 리팩터링은 정의상 \"관찰 가능한 동작을 바꾸지 않는\" 구조 변경이다(Fowler). 먼저 동작 그대로 옮기고(이관), 그다음 고친다 — 기능 추가와는 다른 모자를 쓴다\n  - 옮기기 전에 <strong>테스트로 현재 동작을 고정<\/strong>(characterization test). 이상한 동작도 일단 고정하고 의도인지 따로 판단\n  - 로직을 훅·순수 함수로 <strong>선분리<\/strong>해 두면 화면 교체 때 로직은 무수정으로 이관된다\n  - 흩어진 상수·경계값은 <strong>한 소스<\/strong>로 모으고 다른 곳(CSS·TS)과 어긋나면 테스트가 깨지게 봉인\n  - 타입을 무기로: 시그니처를 바꾸고 컴파일 에러 목록을 작업 목록으로 쓴다(그래서 `as`가 적어야 한다)\n  - 작은 커밋, 단계마다 typecheck·테스트 통과\n- <strong>핵심:<\/strong> <strong>고정(테스트) → 이동(동작 동일) → 변경<\/strong> 순서. 구조와 동작을 한 커밋에 섞지 않는다.\n- <strong>꼬리질문:<\/strong>\n  - \"테스트가 없는 9천 줄 컴포넌트는 어떻게 손대나요?\" → 고칠 부분만 순수 함수로 떼어내 그 함수에 테스트를 붙인다. 전체를 한 번에 테스트하려 하지 않는다.\n  - \"리팩터를 언제 멈추나요?\" → 원래 목적에 필요한 범위까지. 그 밖은 기록만 남기고 별도 작업으로.\n- <strong>출처:<\/strong> [Definition Of Refactoring (Martin Fowler)](https://martinfowler.com/bliki/DefinitionOfRefactoring.html) · [Small CLs — 리팩터링은 별도 변경으로 (Google Engineering Practices)](https://google.github.io/eng-practices/review/developer/small-cls.html)\n\n### 코드 리뷰 관점 (Code Review)\n\n- <strong>뭐야:<\/strong> 다른 사람의 변경을 머지 전에 읽고 문제를 찾는 과정이다. 관점은 사람이 무엇을 우선해서 볼지에 대한 기준이다.\n- <strong>왜:<\/strong> 기준이 없으면 리뷰가 세미콜론·이름 취향에 머물고, 정작 계약 위반·캐시 무효화 누락·경계 위반은 그대로 머지된다.\n- <strong>어떻게:<\/strong>\n  - 포맷·린트·타입·경계는 <strong>도구에 맡긴다<\/strong>. 사람이 볼 것만 남긴다\n  - 우선순위: <strong>정확성<\/strong>(경계값·null·경쟁 상태·중복 요청) → <strong>계약<\/strong>(실제 API 응답과 타입이 맞나, `as`로 덮었나) → <strong>실패 경로<\/strong>(실패가 빈 상태로 보이지 않나, 재시도 안전한가·멱등) → <strong>경계<\/strong>(의존 방향, 도메인 누수) → <strong>테스트<\/strong>(바뀐 분기가 덮였나) → 가독성\n  - 질문형으로 쓰고 <strong>차단(머지 전 필수)과 제안(선택)<\/strong>을 구분해 표시. Google은 선택 사항에 `Nit:` 접두어를 붙인다\n  - PR은 작게. 30분짜리 하나보다 5분짜리 여러 개가 리뷰·되돌리기 모두 쉽다\n- <strong>핵심:<\/strong> 사람은 <strong>정확성·계약·실패 경로<\/strong>를 본다. 스타일은 도구가 본다. <strong>차단과 제안을 구분<\/strong>한다.\n- <strong>꼬리질문:<\/strong>\n  - \"리뷰에서 의견이 갈리면?\" → 컨벤션 문서·실측 근거로 판단하고, 근거가 없는 취향 문제면 작성자 쪽을 따른다. 반복되는 논쟁은 규칙·도구로 올린다.\n  - \"멱등성은 왜 리뷰 체크 항목인가요?\" → 재시도·연타·네트워크 재전송은 반드시 일어난다. 키를 요청 시각으로 만들면 매번 달라져 멱등이 무력화된다 — 대상 선택 시점에 고정해야 한다.\n- <strong>출처:<\/strong> [What to look for in a code review (Google Engineering Practices)](https://google.github.io/eng-practices/review/reviewer/looking-for.html) · [Small CLs (Google Engineering Practices)](https://google.github.io/eng-practices/review/developer/small-cls.html)\n\n> 한 줄 정리: 실패는 오류로 보이게, 운영 오류는 소스맵·맥락까지 수집, 삭제는 참조 0 확인 후 단계별로, 리팩터는 고정→이동→변경, 리뷰는 정확성·계약·실패 경로부터.\n\n## 7. 확장 설계\n\n### 국제화 (Internationalization, i18n)\n\n- <strong>뭐야:<\/strong> 화면 문구와 날짜·숫자 형식을 코드에서 떼어 내 언어·지역마다 바꿔 끼울 수 있게 만드는 것이다. internationalization의 첫 글자 i와 끝 글자 n 사이 18글자를 숫자로 줄여 i18n이라 쓴다.\n- <strong>왜:<\/strong> 문구를 코드에 박아 두면 언어·고객 유형이 늘 때마다 전 파일을 뒤진다. `count + \"개\"`처럼 이어 붙인 문장은 언어마다 어순·복수형이 달라 깨진다.\n- <strong>어떻게:<\/strong>\n  - <strong>문구 분리<\/strong>: 키 → 언어별 메시지 테이블. 문장 조각을 잇지 말고 자리표시자 있는 문장 통째로 둔다\n  - <strong>형식은 `Intl`<\/strong>: 날짜·숫자·통화(`DateTimeFormat`·`NumberFormat`), 상대 시간, 복수형(`PluralRules` — 영어는 one/other 2종, 아랍어는 6종)\n  - <strong>방향·언어 표시<\/strong>: `<html lang>`(스크린리더 발음·하이픈 처리), RTL 대응은 `margin-left` 대신 `margin-inline-start` 같은 논리 속성\n  - 비교·저장은 언어 무관한 키나 서버 원본 값으로, 번역 문구는 표시에만\n- <strong>핵심:<\/strong> i18n은 <strong>문구 분리 + `Intl` 형식 + 비교 키와 표시 분리<\/strong>. 문장을 조각내 잇지 않는다.\n- <strong>꼬리질문:<\/strong>\n  - \"번역 파일이 커지면?\" → 언어·화면별로 쪼개 동적 로드하거나 서버 컴포넌트에서 렌더한다.\n- <strong>출처:<\/strong> [Intl (MDN)](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl) · [Intl.PluralRules (MDN)](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl/PluralRules) · [CSS logical properties and values (MDN)](https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_logical_properties_and_values)\n\n### 프론트엔드 시스템 디자인 접근법 (Front-end System Design, RADIO)\n\n- <strong>뭐야:<\/strong> \"뉴스 피드를 설계해 보세요\" 같은 질문에 답하는 순서다. RADIO는 요구사항·아키텍처·데이터 모델·인터페이스·최적화의 앞 글자를 딴 체크리스트다.\n- <strong>왜:<\/strong> 순서가 없으면 컴포넌트 코드부터 말하다 범위·데이터·API를 못 정하고 끝난다.\n- <strong>어떻게:<\/strong> RADIO 순서(시간 배분은 대략적 권장)\n  - <strong>R 요구사항<\/strong>(~10%): 핵심 기능·비기능(기기·오프라인·접근성·규모)을 질문으로 범위 확정\n  - <strong>A 아키텍처<\/strong>(~20%): 서버·뷰·스토어·데이터 접근 층과 관계를 그림으로\n  - <strong>D 데이터 모델<\/strong>(~10%): 서버 데이터와 클라이언트 전용 상태(입력·UI 상태)를 나눈다\n  - <strong>I 인터페이스<\/strong>(~20%): 서버↔클라이언트 API(HTTP·WebSocket·SSE, 페이지네이션)와 컴포넌트 간 props·이벤트\n  - <strong>O 최적화·심화<\/strong>(~40%): 그 제품에 특화된 성능·접근성·SEO·동시 수정\n- <strong>핵심:<\/strong> <strong>요구사항 → 아키텍처 → 데이터 모델 → 인터페이스 → 최적화<\/strong>. 백엔드 면접과 달리 DB 선택·서버 확장은 보통 범위 밖이다.\n- <strong>꼬리질문:<\/strong>\n  - \"순서대로만 가야 하나요?\" → 체크리스트일 뿐, 상대의 반응에 따라 앞 단계로 돌아간다.\n- <strong>출처:<\/strong> [RADIO Framework (GreatFrontEnd)](https://www.greatfrontend.com/front-end-system-design-playbook/framework) · [Front End System Design (Front End Interview Handbook)](https://www.frontendinterviewhandbook.com/front-end-system-design)\n\n> 한 줄 정리: 문구는 분리하고 형식은 `Intl`로, 설계 면접은 RADIO 순서로 범위부터 고정한다.\n\n## 핵심 키워드 모음\n\n- <strong>unknown vs any<\/strong>: any는 검사를 끄고 전염, unknown은 좁히기 강제. 외부 입력은 unknown.\n- <strong>판별 유니온<\/strong>: 리터럴 판별 필드로 불가능한 상태 제거, `never`로 완전성 검사.\n- <strong>제네릭<\/strong>: 입력·출력 타입 관계 표현, 제약은 최소·추론은 최대.\n- <strong>as 캐스팅<\/strong>: 변환이 아니라 \"믿어\" 선언. 계약 변경이 조용히 통과. `satisfies`로 대체할 자리가 많다.\n- <strong>런타임 검증(zod)<\/strong>: 경계에서 한 번, `z.infer`로 타입 단일화, `safeParse`로 실패를 값으로.\n- <strong>순수 함수 추출<\/strong>: 계산은 순수 함수, 효과는 훅, 표시는 컴포넌트. 계획과 실행 분리.\n- <strong>props 주입·합성·어댑터<\/strong>: 라우터·세션·외부 계약은 밖에서 받는다. boolean prop 대신 합성.\n- <strong>콜백 opt-in<\/strong>: 공용 부품은 최소 동작, 부수효과 책임자는 하나, 콜백 이름은 의도로.\n- <strong>디자인 시스템<\/strong>: 토큰(주의: DTCG 2025.10) + headless → 기본 → 도메인 부품, `variant` 유니온, compound.\n- <strong>FSD<\/strong>: app → (pages) → widgets → features → entities → shared 단방향, 같은 층 슬라이스끼리 금지(entities `@x` 예외), public API, 주의: v2.1에서 processes deprecated.\n- <strong>경계 검사 도구<\/strong>: steiger·boundaries·dependency-cruiser, baseline + 새 위반만 차단, 상대경로 사각지대.\n- <strong>테스트 비율<\/strong>: 피라미드 vs 트로피, 순수 로직 유닛·핵심 흐름 e2e, 사용자 관점으로 테스트.\n- <strong>모킹 경계<\/strong>: 네트워크·시간·플랫폼만 mock, 실측 픽스처로 가짜 모양 방지.\n- <strong>회귀 테스트<\/strong>: 실패 테스트 먼저 → 수정 → 통과, 이름에 증상.\n- <strong>시맨틱·aria<\/strong>: 네이티브 요소 우선, aria는 보충, 링크=이동·버튼=동작.\n- <strong>포커스·대비<\/strong>: 이동·가두기·복귀(`<dialog>`는 복귀 자동), `:focus-visible`, WCAG AA 4.5:1·큰 글자와 UI 3:1, 색만으로 의미 금지.\n- <strong>에러 처리<\/strong>: 로딩·빈·오류 구분, 사용자엔 행동·개발자엔 원인, 부류별 처리, Error Boundary는 렌더 에러만.\n- <strong>에러 모니터링<\/strong>: Boundary·`error`·`unhandledrejection` 수집, 소스맵, 릴리스·앱 버전 태그.\n- <strong>레거시 걷어내기<\/strong>: 참조 0 확인(grep 사각지대 주의) → 단계별 삭제 → 외부 노출은 호환 유지.\n- <strong>리팩터링 안전장치<\/strong>: 고정 → 이동 → 변경, 구조·동작 분리, 상수 단일 소스·드리프트 테스트.\n- <strong>코드 리뷰<\/strong>: 정확성·계약·실패 경로·멱등 우선, 스타일은 도구, 차단과 제안(`Nit:`) 구분, 작은 PR.\n- <strong>국제화<\/strong>: 문구 분리, `Intl`(복수형은 `PluralRules`), `lang`·논리 속성, 비교 키와 표시 분리.\n- <strong>시스템 디자인 면접<\/strong>: RADIO — 요구사항·아키텍처·데이터·인터페이스·최적화(40%).\n"}]</script>
<script>
(function(){
  const NOTES = JSON.parse(document.getElementById('data').textContent);
  const $ = s => document.querySelector(s);
  const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
  const store = {
    get(k,d){ try{ const v = localStorage.getItem('fenote:'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem('fenote:'+k, JSON.stringify(v)); }catch(e){} }
  };
  const conf = store.get('conf', {});
  const slug = s => s.toLowerCase().replace(/<[^>]+>/g,'').replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const ide = $('#ide'), scroller = $('#scroller'), doc = $('#doc'), panel = $('#panel');
  const mobile = () => matchMedia('(max-width:820px)').matches;
  const CONF_GLYPH = {no:'?', mid:'~', ok:'✓'}, CONF_TXT = {no:'모름', mid:'애매', ok:'앎'};
  const MODE_TXT = {off:'끔', core:'핵심 줄만', all:'핵심어 전부'};
  const PART_SLUG = {1:'browser',2:'javascript',3:'react',4:'nextjs',5:'data-state',6:'network-security',7:'performance',8:'design-quality'};

  // 테마 (IDE 버전은 다크 기본, 원본 사이트와 따로 기억)
  const rootEl = document.documentElement;
  if (!rootEl.dataset.theme) rootEl.dataset.theme = 'dark';
  const themeLabel = () => { const dark = rootEl.dataset.theme === 'dark'; ['#themeBtn','#themeBtnM'].forEach(s => { $(s).textContent = dark ? '라이트 테마' : '다크 테마'; $(s).title = dark ? '라이트 테마로 전환' : '다크 테마로 전환'; }); $('#themeBtn').textContent = dark ? '라이트' : '다크'; };
  themeLabel();
  $('#themeBtn').onclick = $('#themeBtnM').onclick = () => {
    const next = rootEl.dataset.theme === 'dark' ? 'light' : 'dark';
    rootEl.dataset.theme = next; store.set('ide-theme', next); themeLabel();
  };

  // 이름 규칙: 파트 = 폴더, 섹션 = 하위 폴더, 개념 = .md
  const partDir = n => n.id==='howto' ? '' : String(n.num).padStart(2,'0')+'-'+(PART_SLUG[n.num] || 'part');
  const fileOf = title => {
    const m = title.match(/\(([^()]*[A-Za-z][^()]*)\)\s*$/);
    const base = slug(m ? m[1] : title);
    return (base || 'concept') + '.md';
  };
  const korTitle = t => t.replace(/\s*\([^()]*\)\s*$/,'').replace(/[`*]/g,'').trim() || t;
  const secName = sec => sec.replace(/^\d+\.\s*/,'').trim();
  const secDir = sec => { const m = sec.match(/^(\d+)\.\s*(.+)/); return m ? m[1].padStart(2,'0')+'-'+m[2].trim().replace(/\s+/g,'-') : sec.replace(/\s+/g,'-'); };

  // 개념 목록(검색·탐색기용) 미리 추출
  const index = [];
  NOTES.forEach(n => {
    n.sections = [];
    let sec = null;
    n.md.split('\n').forEach(line => {
      const h2 = line.match(/^## (.+)/), h3 = line.match(/^### (.+)/);
      if (h2) { sec = h2[1].trim(); n.sections.push(sec); }
      if (h3) index.push({ part:n.id, title:h3[1].trim(), id:slug(h3[1]), sec:sec||'', body:'', n, file:fileOf(h3[1].trim()) });
    });
    n.kw = n.sections.find(s => /핵심 키워드/.test(s)) || null;
  });
  NOTES.forEach(n => {
    const blocks = n.md.split(/^### /m).slice(1);
    blocks.forEach(b => {
      const title = b.split('\n')[0].trim();
      const it = index.find(x => x.part===n.id && x.title===title);
      if (it) { it.body = b.toLowerCase(); it.raw = b; }
    });
  });
  const confKey = (part,id) => part+'/'+id;
  const partItems = n => index.filter(x => x.part===n.id);
  const partKnown = n => { const items = partItems(n); return [items.filter(x => conf[confKey(n.id,x.id)]==='ok').length, items.length]; };
  const partStats = n => { const [k,t] = partKnown(n); return t ? k+'/'+t : ''; };

  // ───── 탐색기 트리 ─────
  const expanded = new Set(store.get('ide-open', []));
  const collapsedSec = new Set(store.get('ide-sec-closed', []));
  const saveTree = () => { store.set('ide-open', [...expanded]); store.set('ide-sec-closed', [...collapsedSec]); };
  function row(o){
    const pad = 10 + o.depth*12 + (o.folder ? 0 : 12);
    const chev = o.folder ? (o.open ? '▾' : '▸') : '';
    const attrs = `data-act="${o.act}" data-p="${o.p}"${o.a!=null?` data-a="${esc(o.a)}"`:''}${o.key?` data-key="${esc(o.key)}"`:''}`;
    const v = o.v || '';
    const right = o.meta!=null ? `<span class="meta">${o.meta}</span>` : (o.memo ? `<span class="mk" title="메모 있음">메모</span>` : '') + (o.deco && v ? `<span class="deco" data-v="${v}" title="${CONF_TXT[v]}"></span>` : '');
    return `<button class="row${o.cls?' '+o.cls:''}" ${attrs} style="padding-left:${pad}px" title="${esc(o.tip||o.name)}"><span class="chev">${chev}</span>${o.num?`<span class="num">${esc(o.num)}</span>`:''}<span class="name">${esc(o.name)}</span>${right}</button>`;
  }
  function renderTree(){
    const side = $('#side'), st = side.scrollTop;
    let h = '';
    NOTES.forEach(n => {
      if (n.id==='howto') { h += row({depth:0, act:'readme', p:n.id, a:'', name:'읽는 법', tip:n.title}); return; }
      const open = expanded.has(n.id);
      h += row({depth:0, act:'part', p:n.id, folder:true, open, num:String(n.num).padStart(2,'0'), name:n.title, cls:'part', meta:partStats(n), tip:n.num+'. '+n.title+' ('+partDir(n)+')'});
      if (!open) return;
      h += `<div class="kids" style="--g:16px">`;
      h += row({depth:1, act:'readme', p:n.id, a:'', name:'개요', tip:'파트 개요 (README.md)'});
      const loose = index.filter(x => x.part===n.id && !x.sec);
      loose.forEach(it => { const v = conf[confKey(n.id,it.id)]; h += row({depth:1, act:'file', p:n.id, a:it.id, name:korTitle(it.title), deco:true, v, memo:hasMemo(n.id,it.id), cls:v==='ok'?'is-ok':'', tip:it.title+' · '+it.file}); });
      n.sections.forEach(sec => {
        if (sec===n.kw) return;
        const items = index.filter(x => x.part===n.id && x.sec===sec);
        const key = n.id+'|'+sec, so = !collapsedSec.has(key);
        const known = items.filter(x => conf[confKey(n.id,x.id)]==='ok').length;

  // ───── 원본 기능: 개념 카드·더 파고들기·빈칸 후보 ─────

  // 더 파고들기 → 하단 패널 그룹(개념별)
  function buildGroup(n, id, title, ivLis){
    const it = index.find(x => x.part===n.id && x.id===id);
    const fname = it ? it.file : fileOf(title);
    const g = document.createElement('details'); g.className = 'pgroup'; g.open = true; g.dataset.c = id;

      const isCase = liLabel(li)==='내 사례';

  function stripLabel(li){

  // ───── IDE 장식: 마크다운 기호·라벨·코드 색·줄 번호 ─────
  const LAB_KIND = {'언제 문제 되나':'when','뭐야':'what','왜':'why','어떻게':'how','핵심':'core','출처':'src','꼬리질문':'iv','내 사례':'iv','한 줄 정리':'tip','주의':'warn'};
  const KW = /^(const|let|var|function|return|if|else|for|while|do|await|async|new|class|extends|import|from|export|default|try|catch|finally|throw|typeof|instanceof|of|in|type|interface|enum|null|undefined|true|false|this|yield|switch|case|break|continue|delete|void|as|satisfies|keyof|readonly|public|private|static|get|set)$/;
  function hl(line){
    const re = /(\/\/.*$|\/\*.*?\*\/|<!--.*?-->|#(?!\w).*$)|('(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*"|`(?:\\.|[^`\\])*`)|(<\/?)([A-Za-z][\w.-]*)|\b(\d+(?:\.\d+)?(?:ms|s|px|kb|KB|MB)?)\b|([A-Za-z_$][\w$]*)(\s*\()?/g;
    let out = '', last = 0, m;
    while ((m = re.exec(line))) {
      out += esc(line.slice(last, m.index)); last = re.lastIndex;
      if (m[1]) out += `<span class="t-cm">${esc(m[1])}</span>`;
      else if (m[2]) out += `<span class="t-str">${esc(m[2])}</span>`;
      else if (m[4]) out += esc(m[3]) + `<span class="t-tag">${esc(m[4])}</span>`;
      else if (m[5]) out += `<span class="t-num">${esc(m[5])}</span>`;
      else if (m[6]) {
        if (KW.test(m[6])) out += `<span class="t-kw">${m[6]}</span>` + esc(m[7]||'');
        else if (m[7]) out += `<span class="t-fn">${m[6]}</span>` + esc(m[7]);
        else out += esc(m[6]);
      }
      if (m[0]==='') re.lastIndex++;
    }
    return out + esc(line.slice(last));
  }
  function decorate(doc, n){
    // 라벨(언제 문제 되나 · 뭐야 · 왜 · 어떻게 · 핵심 · 출처): 글자로 종류를 정하고, 옛 원본의 앞 이모지는 뗀다
    $$('strong:not(.blank)', doc).forEach(s => {
      if (s.closest('.lab, th, h1, h2, h3, h4')) return;
      const prev = s.previousSibling;
      const m = prev && prev.nodeType===3 && prev.textContent.match(/(🧩|🖼️?|❓|🔧|📝|📚|🎯|🏷️?|💡)\s*$/u);
      const lab = document.createElement('span'); lab.className = 'lab';
      lab.dataset.k = LAB_KIND[labelText(s)] || 'lead';
      s.parentNode.insertBefore(lab, s);
      if (m) prev.textContent = prev.textContent.slice(0, m.index);
      s.textContent = s.textContent.replace(/\s*:\s*$/, '');
      lab.appendChild(s);
      const nx = lab.nextSibling;
      if (nx && nx.nodeType===3) nx.textContent = nx.textContent.replace(/^\s*:\s*/, ' ');
      const host = lab.parentNode, li = host.tagName==='LI' ? host : (host.tagName==='P' && host.parentNode.tagName==='LI' && host.parentNode.firstElementChild===host ? host.parentNode : null);
      if (li && !(host.firstChild && host.firstChild!==lab && host.firstChild.textContent.trim())) {
        if (host.firstChild!==lab && host.firstChild.nodeType===3) host.firstChild.remove();
        li.classList.add('has-lab');
        if (nx && nx.nodeType===3) nx.textContent = nx.textContent.replace(/^\s+/, '');
      }
    });
    $$('blockquote', doc).forEach(b => {
      const p = b.firstElementChild; if (!p || !p.firstChild || p.firstChild.nodeType!==3) return;
      const t = p.firstChild.textContent, lead = t.match(LEAD)[0], rest = t.slice(lead.length);
      let tip = false, cut = 0, m;
      if ((m = rest.match(/^한 줄 정리\s*[:：]\s*/))) { tip = true; cut = m[0].length; }
      else if ((m = rest.match(/^주의(\s*[:：]\s*|\s+)/))) cut = m[0].length;
      else if (!lead.includes('⚠')) return;
      p.firstChild.textContent = rest.slice(cut);
      p.insertAdjacentHTML('afterbegin', `<span class="lab" data-k="${tip?'tip':'warn'}">${tip?'한 줄 정리':'주의'}</span>`);
    });
    // 남은 이모지: ⚠️는 "주의", 나머지 라벨 이모지는 뗀다 (코드·도식 제외)

    memoLabel();
    $$('#memoList .mm-item').forEach(b => b.classList.toggle('on', b.dataset.a===a && p===current));
  }
  function memoFollow(){ if (document.activeElement===ta || !current) return; setTarget(current, curConcept); }
  ta.addEventListener('input', () => { memoDirty = true; clearTimeout(memoTimer); memoTimer = setTimeout(memoSave, 400); });
  ta.addEventListener('blur', () => { memoSave(); memoFollow(); });
  function renderMemoList(){
    const n = NOTES.find(x => x.id===current); if (!n) return;
    const items = [{a:'_part', name:'파트 메모'}, ...partItems(n).map(it => ({a:it.id, name:korTitle(it.title)}))]
      .map(x => ({...x, v:memoGet(n.id, x.a)})).filter(x => x.v.trim());
    $('#memoCnt').textContent = items.length;
    const btn = $('#memoListBtn'), list = $('#memoList');
    btn.setAttribute('aria-expanded', String(memoListOpen)); list.hidden = !memoListOpen;
    if (!memoListOpen) return;
    list.innerHTML = items.length ? items.map(x => {
      const prev = x.v.split('\n').map(l => l.trim()).filter(Boolean).slice(0, 2).join('\n');
      return `<button class="mm-item press${memoT.p===n.id && memoT.a===x.a ? ' on' : ''}" data-a="${esc(x.a)}"><b>${esc(x.name)}</b><span>${esc(prev)}</span></button>`;
    }).join('') : '<div class="p-empty">이 파트에는 아직 메모가 없습니다.</div>';
  }
  $('#memoListBtn').onclick = () => { memoListOpen = !memoListOpen; renderMemoList(); };
  $('#memoList').addEventListener('click', e => {
    const b = e.target.closest('.mm-item'); if (!b) return;
    const a = b.dataset.a, p = current;
    go(p, a==='_part' ? '' : a);
    setTarget(p, a);
  });
  function openMemo(id){
    setPanel(true); showPane('memo');
    setTarget(current, id);
    if (!mobile()) ta.focus({ preventScroll: true });
  }
  doc.addEventListener('click', e => {
    const b = e.target.closest('.mbtn'); if (!b) return;
    e.stopPropagation(); openMemo(b.dataset.c);
  });
  $('#memoExport').onclick = () => {
    memoSave();
    const all = {};
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(MEMO)) all[k.slice(MEMO.length)] = localStorage.getItem(k) || ''; } }
    catch(e){ memoState('내보내기 실패(브라우저 저장소 사용 불가)', true); return; }
    const d = new Date(), ymd = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    let out = `# 지식노트 메모\n\n내보낸 날짜: ${ymd}\n`, cnt = 0;
    NOTES.forEach(n => {
      const pre = n.id+'/', keys = Object.keys(all).filter(k => k.startsWith(pre));
      if (!keys.length) return;
      const used = new Set(); let sec = '';
      const add = (k, title) => { const v = all[k]; if (!v || !v.trim() || used.has(k)) return; used.add(k); sec += `\n### ${title}\n\n${v.trim()}\n`; cnt++; };
      add(pre+'_part', '파트 메모');
      partItems(n).forEach(it => add(pre+it.id, it.title));
      keys.forEach(k => add(k, k.slice(pre.length)));
      if (sec) out += `\n## ${n.id==='howto' ? '읽는 법' : n.num+'. '+n.title}\n` + sec;
    });
    if (!cnt) { memoState('내보낼 메모가 없습니다'); return; }
    const url = URL.createObjectURL(new Blob([out], {type:'text/markdown;charset=utf-8'}));
    const a = document.createElement('a'); a.href = url; a.download = `지식노트-메모-${ymd}.md`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    memoState(`메모 ${cnt}개를 내보냈습니다`);
  };
  addEventListener('beforeunload', memoSave);

  // ───── 모바일: 하단 바 · 바텀 시트 · 경로 줄 ─────
  const mbar = $('#mbar'), mpath = $('#mpath'), shGrip = $('#shGrip');
  const SNAPS = [.35, .6, .92];
  let sheetPane = null, sheetSnap = 1, mainSnap = 1;
  const sheetOpen = () => panel.classList.contains('open');
  const barH = () => document.body.classList.contains('kb') ? 0 : (mbar.getBoundingClientRect().height || 56);
  const kbH = () => document.body.classList.contains('kb') ? (parseFloat(rootEl.style.getPropertyValue('--kb')) || 0) : 0;
  const availH = () => innerHeight - barH() - kbH();
  const snapH = i => Math.round(SNAPS[i] * availH());
  function sheetApply(h){
    h = Math.max(0, Math.min(Math.round(h), availH()));
    panel.style.height = h + 'px';
    rootEl.style.setProperty('--shh', (sheetOpen() ? h : 0) + 'px');
  }
  function sheetHead(){
    const t = {problems:'질문', memo:'메모', blank:'빈칸'}[sheetPane] || '';
    $('#shTitle').innerHTML = esc(t) + (sheetPane==='problems' ? `<span class="cnt">${$$('#probs .prob').length}문항</span>` : '');
  }
  function sheetShow(){
    if (!sheetOpen()) { panel.classList.add('open'); sheetApply(snapH(sheetSnap)); }
    syncBar();
  }
  function sheetHide(){
    if (document.activeElement && panel.contains(document.activeElement)) document.activeElement.blur();
    panel.classList.remove('open'); rootEl.style.setProperty('--shh', '0px');
    sheetPane = null; syncBar();
  }
  function syncBar(){
    if (!mbar) return;
    const open = sheetOpen() && mobile();
    const set = (m, on) => mbar.querySelector(`[data-m="${m}"]`).setAttribute('aria-pressed', on ? 'true' : 'false');
    set('toc', document.body.classList.contains('side-open'));
    set('blank', open && sheetPane==='blank');
    mbar.querySelector('[data-m="blank"]').dataset.on = mode!=='off' ? '1' : '0';
    set('problems', open && sheetPane==='problems');
    set('memo', open && sheetPane==='memo');
  }
  function openSheet(p){
    if (sheetOpen() && sheetPane===p) { sheetHide(); return; }
    closeSide();
    if (p==='problems') {
      const g = curConcept && $(`#probs .pgroup[data-c="${CSS.escape(curConcept)}"]`);
      if (g) { focusGroup(curConcept); return; }
      setPanel(true); showPane('problems');
      $$('#probs .pgroup').forEach(x => { x.open = false; x.classList.remove('here'); });
      $('#pBody').scrollTop = 0;
      return;
    }
    setPanel(true); showPane(p);
    $('#pBody').scrollTop = 0;
  }
  function toggleSide(){
    const on = document.body.classList.toggle('side-open');
    if (on) { markTreeActive(); const r = $('#tree .row.on'); if (r) r.scrollIntoView({block:'center', inline:'nearest'}); }
    syncAct();
  }
  // 하단 바: 목차는 서랍, 나머지는 바텀 시트(한 번에 하나)
  mbar.addEventListener('click', e => {
    const b = e.target.closest('button[data-m]'); if (!b) return;
    const m = b.dataset.m;
    if (m==='toc') toggleSide();
    else openSheet(m);
  });
  mpath.onclick = () => toggleSide();
  $('#mBlankSeg').querySelectorAll('button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  $('#mAgain').onclick = () => setMode(mode);
  $('#mWeak').onclick = () => setWeak(!document.body.classList.contains('weak-only'));

  // 시트 끌기: 손잡이·머리줄. 놓으면 35·60·92% 중 가까운 곳(속도 반영), 첫 지점 아래로 내리면 닫힘
  let sd = null;
  function sdDown(e){
    if (!mobile() || !sheetOpen() || e.target.closest('button')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    sd = {id:e.pointerId, y0:e.clientY, h0:panel.getBoundingClientRect().height, y:e.clientY, t:performance.now(), v:0, el:e.currentTarget};
    try { sd.el.setPointerCapture(e.pointerId); } catch(_) {}
    panel.classList.add('dragging');
  }
  function sdMove(e){
    if (!sd || e.pointerId !== sd.id) return;
    const now = performance.now(), dt = Math.max(1, now - sd.t);
    sd.v = .7 * ((e.clientY - sd.y) / dt) + .3 * sd.v; sd.y = e.clientY; sd.t = now;
    let h = sd.h0 + (sd.y0 - e.clientY);
    const max = availH(); if (h > max) h = max + (h - max) * .2;
    panel.style.height = Math.max(0, Math.round(h)) + 'px';
  }
  function sdUp(e){
    if (!sd || e.pointerId !== sd.id) return;
    const d = sd; sd = null;
    try { if (d.el.hasPointerCapture(d.id)) d.el.releasePointerCapture(d.id); } catch(_) {}
    panel.classList.remove('dragging');
    if (e.type === 'pointercancel') { sheetApply(d.h0); return; }
    const h = panel.getBoundingClientRect().height, proj = h - d.v * 120, s = SNAPS.map((_, i) => snapH(i));
    if (proj < s[0] * .55 || (d.v > 1 && h < s[0] + 24)) { sheetHide(); return; }
    let best = 0; s.forEach((x, i) => { if (Math.abs(x - proj) < Math.abs(s[best] - proj)) best = i; });
    sheetSnap = best; if (sheetPane!=='blank') mainSnap = best; sheetApply(s[best]);
  }
  [shGrip, $('.p-head')].forEach(el => {
    el.addEventListener('pointerdown', sdDown);
    el.addEventListener('pointermove', sdMove);
    el.addEventListener('pointerup', sdUp);
    el.addEventListener('pointercancel', sdUp);
  });

  // 경로 줄: 아래로 스크롤하면 숨고 위로 스크롤하면 나타남
  let pathY = 0, pathAcc = 0;
  scroller.addEventListener('scroll', () => {
    if (!mobile()) return;
    const y = scroller.scrollTop, d = y - pathY; pathY = y;
    if (y < 40) { pathAcc = 0; document.body.classList.remove('path-hid'); return; }
    pathAcc = (d > 0) === (pathAcc > 0) ? pathAcc + d : d;
    if (pathAcc > 24) document.body.classList.add('path-hid');
    else if (pathAcc < -16) document.body.classList.remove('path-hid');
  }, {passive:true});

  // 키보드: visualViewport로 가려진 높이를 재서 시트를 키보드 위로 올린다
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const onVV = () => {
      if (!mobile()) return;
      const kb = Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop));
      const on = kb > 80;
      rootEl.style.setProperty('--kb', kb + 'px');
      if (on !== document.body.classList.contains('kb')) document.body.classList.toggle('kb', on);
      if (sheetOpen()) {
        const h = panel.getBoundingClientRect().height, max = availH() - (on ? 48 : 0);
        if (h > max) sheetApply(max);
        else if (!on) sheetApply(snapH(sheetSnap));
        if (on && document.activeElement===ta) ta.scrollIntoView({block:'nearest'});
      }
    };
    vv.addEventListener('resize', onVV); vv.addEventListener('scroll', onVV);
  }
  // 화면 폭이 기준을 넘나들면 시트·서랍·패널 높이를 정리
  let wasMobile = mobile();
  addEventListener('resize', () => {
    const m = mobile();
    if (m !== wasMobile) {
      wasMobile = m;
      panel.classList.remove('open'); panel.style.height = ''; grip.hidden = true; sheetPane = null;
      rootEl.style.setProperty('--shh', '0px');
      document.body.classList.remove('side-open', 'path-hid', 'kb');
      showPane('problems'); syncAct();
    } else if (m && sheetOpen() && !sd) sheetApply(snapH(sheetSnap));
  });

  // ───── 시작 ─────
  setWeak(store.get('weak', false));
  const ivOn = store.get('iv', false);
  $('#ivBtn').setAttribute('aria-pressed', ivOn ? 'true':'false'); ivLabel(ivOn);
  const [hp, ha] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (hp && NOTES.some(n => n.id===hp)) { open(hp, ha); addTab(hp, ha || ''); }
  else {
    open(store.get('last', NOTES[0].id));
    if (!tabs.length) addTab(current, '');
    const y = store.get('scroll:'+current, 0); if (y) requestAnimationFrame(() => { scroller.scrollTop = y; spy(); });
  }
  setMode(store.get('mode','off'));
  if (ivOn && !mobile()) { setPanel(true); showPane('problems'); }
  renderTabs(); syncAct();
})();
</script>
</body>
</html>
