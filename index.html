 라우트 진입 시점으로 앞당겨 둔다([7파트 참고](#n07/코드-스플리팅과-동적-import-code-splitting-dynamic-import \"코드 스플리팅과 동적 import\")).\n  - \"왜 엔드포인트를 안 합치나요?\" → 합치면 효과는 가장 크지만 재사용하기 어려워진다. 그래서 늘 같이 쓰는 조합만 합친다.\n- <strong>출처:<\/strong> [TanStack — Dependent Queries](https://tanstack.com/query/v5/docs/framework/react/guides/dependent-queries) · [TanStack — Request Waterfalls](https://tanstack.com/query/v5/docs/framework/react/guides/request-waterfalls)\n\n### 캐시 정규화 vs 쿼리 단위 캐시 (Normalized Cache)\n\n- <strong>뭐야:<\/strong> 캐시를 저장하는 두 방식이다. 정규화 캐시는 엔티티(회원 한 명 같은 데이터 한 건)를 `타입:id`로 한 번만 저장한다. 목록은 그 엔티티를 가리키는 참조만 든다. 쿼리 단위 캐시는 키 하나에 응답을 통째로 저장한다.\n- <strong>왜:<\/strong> 쿼리 단위 캐시에서는 같은 객체가 쿼리마다 따로 복사돼 있다. 그래서 회원 이름을 바꿨는데 상세만 새 이름이고 목록·선택 창은 옛 이름일 수 있다. 이 차이를 알아야 화면끼리 값을 맞출 방법을 고를 수 있다.\n- <strong>어떻게:<\/strong>\n  - <strong>정규화 캐시<\/strong>(Apollo Client, Redux의 `createEntityAdapter`)는 엔티티를 `타입:id` 키로 한 번만 저장한다. 목록은 <strong>참조<\/strong>만 든다. 그래서 엔티티 하나를 고치면 그것을 참조하는 화면이 모두 바뀐다.\n  - <strong>쿼리 단위 캐시<\/strong>(TanStack Query·SWR·RTK Query)는 키 하나에 응답을 통째로 저장한다. 공식 비교표에 따르면 셋 다 자동 정규화를 지원하지 않는다. 일관성은 <strong>넓은 무효화<\/strong>나 `setQueryData`로 맞춘다.\n  - 정규화의 전제는 <strong>전역 유일 id<\/strong>다. GraphQL은 `__typename`·`id`가 있어 자동화하기 쉽다([6파트 참고](#n06/rest-vs-graphql-over-fetching-under-fetching \"REST vs GraphQL\"))\n- <strong>핵심:<\/strong> 정규화는 <strong>엔티티 하나 = 저장 하나<\/strong>라 수정이 자동 전파되고, 쿼리 단위 캐시는 <strong>단순한 대신 무효화<\/strong>로 일관성을 맞춘다.\n- <strong>꼬리질문:<\/strong>\n  - \"그럼 왜 TanStack Query는 정규화를 안 하나요?\" → (공식 설명 아님) 이유는 두 가지로 볼 수 있다. REST 응답에서는 어디까지가 엔티티 하나인지 라이브러리가 알 수 없다. 정렬·필터·카운트 같은 서버 파생값은 정규화해도 결국 재조회가 필요하다.\n  - \"정규화의 대가는?\" → 항목을 추가·삭제할 때 어느 목록에 넣고 뺄지를 직접 코드로 써야 한다.\n- <strong>출처:<\/strong> [Apollo — Caching overview](https://www.apollographql.com/docs/react/caching/overview) · [TanStack — Comparison](https://tanstack.com/query/v5/docs/framework/react/comparison)\n\n> 한 줄 정리: 왕복은 병렬·prefetch로 줄이고, 같은 엔티티의 일관성은 정규화나 넓은 무효화로 맞춘다.\n\n## 핵심 키워드 모음\n\n- <strong>서버 vs 클라이언트 상태<\/strong>: 서버 상태는 빌린 캐시, 전역 스토어에 복사하면 동기화 책임이 생긴다\n- <strong>단일 원본<\/strong>: 값마다 쓸 수 있는 곳은 하나, 둘이 필요하면 이름을 나눈다\n- <strong>파생 상태<\/strong>: 계산 가능한 값은 저장하지 말고 렌더 중 계산, 재정의는 `null` 오버라이드\n- <strong>staleTime / gcTime<\/strong>: 재조회 여부(기본 0) vs 보관(기본 5분), 독립, v5 cacheTime → gcTime\n- <strong>재조회 트리거<\/strong>: 마운트·포커스·재연결은 stale일 때만 발동, invalidate·refetch·폴링은 신선도 무관\n- <strong>쿼리 키 팩토리<\/strong>: 응답을 결정하는 입력 전부를 계층 키로, 인라인 배열 금지\n- <strong>무효화 범위<\/strong>: 도메인 루트로 넓게, 활성 쿼리만 즉시 재조회(비활성은 다음 진입 때)\n- <strong>낙관적 업데이트<\/strong>: 취소→스냅샷→반영→롤백→무효화\n- <strong>전역 onError<\/strong>: 실패 안내는 전역 한 번, 조회 실패는 화면 오류 상태, v5 useQuery 콜백 제거, mutation은 캐시 → 훅 → mutate 순\n- <strong>요청 경쟁<\/strong>: 응답 순서 ≠ 요청 순서, 취소(`signal`)하거나 입력별 키로 분리\n- <strong>멱등 키<\/strong>: 같은 의도 = 같은 키, 매번 바뀌는 값 금지, 서버는 첫 결과 재응답\n- <strong>offset vs cursor<\/strong>: 점프·총 건수 vs 일관성·깊은 페이지 성능, 정렬 키는 유일\n- <strong>무한 스크롤 vs 페이지 번호<\/strong>: 피드는 무한, 관리·검색은 페이지 번호, 정렬·필터는 서버, v5 `keepPreviousData`·`initialPageParam`\n- <strong>URL 상태<\/strong>: 공유·새로고침·뒤로 가기에서 살아야 하면 URL이 원본, 외부 입력이라 검증\n- <strong>전역 상태 라이브러리<\/strong>: Context는 전달 도구, 잦은 변경엔 selector 스토어(Zustand), 잘게 쪼개면 atom(Jotai)\n- <strong>폼 상태<\/strong>: 클라이언트 검증은 UX·서버가 판정, PATCH는 dirty 필드만, 미변경과 비움 구분\n- <strong>상태 머신<\/strong>: 불리언 대신 status 하나, (상태, 이벤트) → 다음 상태, 나머지 이벤트는 무시\n- <strong>요청 워터폴<\/strong>: 단계 수 × 왕복 지연, 독립은 병렬, 의존은 `enabled`, API 합치기·prefetch\n- <strong>캐시 정규화<\/strong>: 엔티티를 `타입:id`로 한 번 저장(Apollo), TanStack 등은 쿼리 단위라 무효화로 맞춤\n"}, {"id": "n06", "num": "6", "title": "네트워크·인증·보안", "md": "# 6. 네트워크·인증·보안\n\n<strong>이 파트는 뭐냐:<\/strong> 네 가지를 다룬다. 첫째는 브라우저와 서버가 주고받는 통로(HTTP·캐시·API)다. 둘째는 그 통로 위에서 내가 누구인지 증명하는 방법(쿠키·세션·토큰·OAuth)이다. 셋째는 그 신원과 페이지를 노리는 공격(XSS·CSRF)과 방어다. 넷째는 연결이 끊길 때의 대응(실시간·재연결·오프라인·웹뷰 브릿지)이다. 한 줄로 줄이면 이렇다. <strong>네트워크는 실패하고 순서가 섞이며, 인증은 그 와중에도 한 번만 갱신돼야 한다.<\/strong>\n\n## 1. HTTP 기본기\n\n### 메서드의 안전성과 멱등성 (Safe & Idempotent Methods)\n\n- <strong>뭐야:<\/strong> HTTP 메서드가 가진 두 가지 성질이다. 안전은 의미상 읽기 전용이라는 뜻이다. 클라이언트가 서버 상태를 바꿔 달라고 요청하지 않는다는 말이다(로그 기록 같은 부수 효과까지 금지하진 않는다). <strong>멱등<\/strong>은 같은 요청을 여러 번 보내도 서버에 의도된 효과가 한 번 보낸 것과 같다는 뜻이다.\n- <strong>왜:<\/strong> 이 구분을 모르면 두 가지 사고가 난다. 타임아웃 뒤 자동 재시도 때문에 지급이 두 번 된다. 상태를 바꾸는 GET을 만들어 두면 링크 미리보기나 프리페치(브라우저가 미리 받아 두는 요청)가 그 GET을 호출해 버린다.\n- <strong>어떻게:<\/strong>\n  - <strong>안전(safe)<\/strong>한 메서드는 의미상 읽기 전용이다. GET, HEAD, OPTIONS, TRACE가 여기에 든다.\n  - <strong>멱등(idempotent)<\/strong>은 같은 요청을 여러 번 보내도 <strong>의도된 효과<\/strong>가 한 번 보낸 것과 같다는 뜻이다. 안전한 메서드 전부와 PUT, DELETE가 멱등하다.\n  - POST와 PATCH는 멱등이 보장되지 않는다. \"수량 +1\" 패치가 그런 예다.\n  - 멱등하다고 응답까지 같은 것은 아니다. DELETE를 두 번 보내면 두 번째 응답은 404여도 <strong>서버 상태<\/strong>는 같다.\n  - 자동 재시도는 멱등한 요청에만 건다. POST는 <strong>멱등 키<\/strong>(같은 요청임을 서버가 알아보도록 붙이는 고유 값, [5파트 참고](#n05/중복-제출-방지와-멱등-키-idempotency-key \"중복 제출 방지와 멱등 키\"))가 있을 때만 재시도한다.\n- <strong>핵심:<\/strong> 멱등은 <strong>응답이 아니라 서버 상태<\/strong> 기준이다. <strong>자동 재시도는 멱등한 요청에만<\/strong> 건다.\n- <strong>꼬리질문:<\/strong>\n  - \"PUT과 PATCH 차이를 멱등성으로 설명하면?\" → PUT은 \"전체를 이 값으로 바꿔라\"라는 요청이다. 그래서 몇 번 보내도 결과가 같다. PATCH는 변경 연산이다. 그래서 어떤 연산이냐에 따라 멱등할 수도 있고 아닐 수도 있다.\n  - \"GET은 언제 위험한가요?\" → 상태를 바꾸는 GET을 만들었을 때다. 프리페치, 크롤러, CSRF 공격(이미지 태그)이 그 GET을 호출한다.\n- <strong>출처:<\/strong> [RFC 9110 §9.2](https://www.rfc-editor.org/rfc/rfc9110.html#section-9.2.1) · [MDN — Idempotent](https://developer.mozilla.org/en-US/docs/Glossary/Idempotent)\n\n### 상태 코드: 401 vs 403과 그 너머 (Status Codes)\n\n- <strong>뭐야:<\/strong> 서버가 응답 결과를 숫자로 알려 주는 표시다. 401은 \"유효한 인증 정보가 없다\"는 뜻이다. 403은 \"요청은 이해했지만 거절한다\"는 뜻이다. 403은 로그인 여부와 상관없이 쓰일 수 있다. 403을 받은 뒤 자격 증명(토큰·쿠키처럼 내가 누구인지 증명하는 정보)을 다시 보내도 결과가 같다.\n- <strong>왜:<\/strong> 둘을 구분하지 못하면 403을 인증 문제로 착각해 토큰을 갱신한다. 갱신해도 다시 403이 오므로 갱신과 재시도가 끝없이 반복될 수 있다.\n- <strong>어떻게:<\/strong>\n  - <strong>401<\/strong>은 인증이 없거나 무효라는 뜻이다(만료 토큰, 서명 오류). 스펙상 서버는 `WWW-Authenticate` 헤더로 인증 방식을 알린다. 그래서 <strong>갱신·재로그인으로 풀릴 수 있다<\/strong>.\n  - <strong>403<\/strong>은 <strong>허락되지 않음<\/strong>이라는 뜻이다(권한, 플랜, 소유권). RFC 9110은 같은 자격 증명으로 자동 반복하지 말라(SHOULD NOT)고 한다. 자격 증명과 무관한 이유로도 거절될 수 있다고 본다.\n  - 그 밖에 자주 보는 코드가 있다. 404는 리소스가 없다는 뜻이다(존재를 숨기려고 403 대신 쓰기도 한다). 409는 충돌이다(중복, 버전 불일치). 422는 형식은 맞지만 의미상 거절한다는 뜻이다. 429는 요청이 너무 많다는 뜻이다. 429에 붙는 `Retry-After` 헤더는 값이 초 또는 날짜이고, 503에도 붙는다.\n  - 403의 이유가 여러 가지면 <strong>본문의 업무 코드<\/strong>(`customCode` 등)로 구분한다. 상태 코드만 보면 서로 다른 거절을 하나로 뭉개게 된다.\n  - 재시도할지는 세 갈래로 나눈다. 네트워크 오류·일부 5xx·408·429는 재시도 후보다([5섹션 참고](#n06/재시도-정책과-지수-백오프-retry-policy \"재시도 정책과 지수 백오프\")). 401은 갱신한 뒤 1회만 재시도한다. 403과 그 밖의 4xx는 재시도하지 않는다.\n- <strong>핵심:<\/strong> <strong>401은 \"누구냐\", 403은 \"안 돼\"<\/strong>다. 갱신 대상은 <strong>401뿐<\/strong>이고, 403의 이유는 <strong>업무 코드<\/strong>로 가른다.\n- <strong>꼬리질문:<\/strong>\n  - \"서버가 만료 토큰에 403을 주면요?\" → 상태 코드만 믿으면 갱신을 못 한다. 서버와 응답 계약을 맞추거나, 본문 코드를 보고 \"만료\"인 경우만 갱신 대상으로 둔다.\n  - \"갱신 대상이 아닌 에러가 재시도 경로에 들어가면?\" → 실패하고 재시도하는 일이 끝없이 반복된다. 폴링(주기적으로 다시 묻는 요청)이면 주기마다 같은 실패가 되풀이된다.\n- <strong>출처:<\/strong> [RFC 9110 §15.5.4](https://www.rfc-editor.org/rfc/rfc9110.html#section-15.5.4) · [MDN — Retry-After](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Retry-After)\n\n### HTTP 캐시: Cache-Control, ETag, 304\n\n- <strong>뭐야:<\/strong> 브라우저와 CDN이 받은 응답을 저장해 두고 다시 쓰는 규칙이다. `Cache-Control` 헤더는 응답을 얼마나 재사용할지 정한다. `ETag`와 304는 \"그사이 바뀌었나\"만 짧게 확인하는 데 쓴다.\n- <strong>왜:<\/strong> 설정을 모르면 두 가지 문제를 겪는다. 배포를 했는데 브라우저가 옛 JS를 계속 쓴다. 반대로 같은 큰 응답을 매번 다시 받는다.\n- <strong>어떻게:<\/strong>\n  - `max-age=N`은 N초 동안 서버에 묻지 않고 재사용한다는 뜻이다. `no-cache`는 저장은 하되 <strong>쓸 때마다 재검증<\/strong>한다는 뜻이다. `no-store`는 저장 자체를 금지한다. `private`은 브라우저만 저장하게 하고, `public`은 공유 캐시(CDN)도 저장하게 한다.\n  - <strong>재검증<\/strong>은 저장한 응답을 아직 써도 되는지 서버에 묻는 일이다. 응답에서 `ETag`나 `Last-Modified`를 받았으면 다음 요청에 `If-None-Match`/`If-Modified-Since`를 실어 보낸다. 바뀌지 않았으면 서버는 본문 없이 <strong>304<\/strong>를 준다.\n  - 정적 자산은 파일명에 해시를 넣고(`app.3f2a.js`) `max-age=1년, immutable`을 준다. HTML은 `no-cache`로 매번 확인하게 한다. 그러면 새로 확인한 HTML이 새 해시 파일을 가리킨다([7파트 참고](#n07/캐시로-재요청-줄이기-http-cache-query-cache \"캐시로 재요청 줄이기\")).\n  - `stale-while-revalidate`는 낡은 응답을 먼저 쓰고 뒤에서 갱신하는 방식이다. TanStack Query의 stale과 같은 발상이다.\n- <strong>핵심:<\/strong> <strong>no-cache는 \"캐시하지 마\"가 아니라 \"매번 확인\"<\/strong>이고, 금지는 <strong>no-store<\/strong>다. 해시 파일명 + 긴 max-age, HTML은 재검증.\n- <strong>꼬리질문:<\/strong>\n  - \"304면 요청이 안 나간 건가요?\" → 나갔다. 본문을 다시 받지 않았을 뿐이다. 요청 자체가 안 나가려면 max-age가 아직 남은 신선한(fresh) 캐시여야 한다.\n  - \"인증된 API 응답을 CDN이 캐시하면?\" → 내 데이터가 다른 사람에게 간다. `Authorization` 헤더가 붙은 요청의 응답은 기본적으로 공유 캐시가 재사용하지 않는다. 하지만 `public`·`s-maxage`·`must-revalidate`가 붙으면 재사용할 수 있다. 사용자별 응답에는 `private`·`no-store`를 붙인다.\n- <strong>출처:<\/strong> [MDN — Cache-Control](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Cache-Control) · [MDN — HTTP caching](https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching#common_caching_patterns)\n\n### HTTP/1.1 vs HTTP/2 vs HTTP/3\n\n- <strong>뭐야:<\/strong> 같은 HTTP 의미를 실어 나르는 전송 방식의 세대 차이다. 1.1은 연결 하나에서 요청이 줄을 선다. 2는 연결 하나에 여러 요청을 섞어 보낸다. 3은 UDP 기반 QUIC 위에서 스트림(연결 안에서 요청마다 따로 흐르는 통로)을 서로 독립시킨다.\n- <strong>왜:<\/strong> 차이를 모르면 작은 요청 수십 개가 줄 서서 느리게 오는 이유를 설명하지 못한다. \"HTTP/2면 번들을 쪼개도 되나요?\" 같은 질문에도 근거 없이 답하게 된다.\n- <strong>어떻게:<\/strong>\n  - <strong>HTTP/1.1<\/strong>은 한 연결에서 요청을 <strong>순서대로<\/strong> 처리한다. 앞 요청이 느리면 뒤 요청이 막힌다. 이 막힘을 HOL(head-of-line) 블로킹이라고 한다. 브라우저는 도메인당 연결을 약 6개 열어 이 문제를 피해 간다.\n  - <strong>HTTP/2<\/strong>는 연결 하나에 여러 스트림을 <strong>다중화(multiplexing)<\/strong>한다. 데이터를 바이너리 프레임으로 보내고 헤더를 압축한다(HPACK). 다만 TCP 위에서 동작하므로 <strong>패킷 하나 손실이 모든 스트림을 멈춘다<\/strong>(TCP 레벨 HOL). 주의: 서버 푸시는 Chrome 106에서 기본 비활성화돼 사실상 폐기됐다. 대안은 `103 Early Hints`와 preload다.\n  - <strong>HTTP/3<\/strong>는 <strong>QUIC(UDP)<\/strong> 위에서 동작한다. 손실을 스트림별로 복구하므로 TCP HOL이 없다. 전송 핸드셰이크와 TLS 1.3 핸드셰이크를 합쳐 연결이 빠르다. 연결 ID를 쓰므로 IP가 바뀌어도 연결이 유지된다(connection migration).\n- <strong>핵심:<\/strong> 1.1은 <strong>줄 서기<\/strong>, 2는 <strong>다중화(TCP HOL 남음)<\/strong>, 3은 <strong>QUIC 스트림 독립 + 망 전환에 강함<\/strong>으로 요약된다.\n- <strong>꼬리질문:<\/strong>\n  - \"HTTP/2에서 SSE 연결 수 제한은요?\" → 1.1에서는 브라우저가 도메인당 연결을 6개로 제한한다. SSE가 연결을 하나씩 차지하므로 탭이 많으면 막힌다. 2에서는 SSE가 스트림 하나라서 제한이 기본 약 100개로 완화된다.\n  - \"모바일에서 HTTP/3가 좋은 이유는?\" → 무선망은 손실이 잦은데 HTTP/3에는 HOL이 없다. 망이 바뀌어도 재연결하지 않는다.\n- <strong>출처:<\/strong> [MDN — Evolution of HTTP](https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Evolution_of_HTTP) · [Chrome — Removing Push](https://developer.chrome.com/blog/removing-push)\n\n### HTTPS와 TLS 핵심 (TLS Essentials)\n\n- <strong>뭐야:<\/strong> HTTPS는 HTTP를 TLS로 감싼 것이다. TLS는 통신을 암호화하고, 내용이 바뀌지 않았는지 확인하고, 인증서로 상대 서버가 진짜인지 증명한다.\n- <strong>왜:<\/strong> 모르면 카메라나 Service Worker가 http 페이지에서 동작하지 않는 이유를 찾지 못한다. \"HTTPS가 뭘 지켜 주나요?\"라는 질문에 \"암호화\" 하나만 답하게 된다.\n- <strong>어떻게:<\/strong>\n  - TLS가 주는 것은 세 가지다. <strong>기밀성<\/strong>은 내용을 암호화하는 것이다. <strong>무결성<\/strong>은 내용이 변조되면 알아채는 것이다. <strong>인증<\/strong>은 인증서로 서버 신원을 증명하는 것이다.\n  - 먼저 키 교환으로 세션 키를 합의하고, 그 뒤로는 대칭 키로 암호화한다. TLS 1.3은 왕복 한 번(1-RTT)에 연결을 맺는다. 1.2는 왕복 두 번(2-RTT)이 걸린다. 재접속 때 쓰는 0-RTT는 재전송(replay) 위험이 있다.\n  - <strong>HSTS<\/strong>는 \"앞으로 https로만 접속하라\"고 브라우저에 알리는 헤더다. 헤더를 받기 전인 <strong>첫 접속<\/strong>은 지키지 못한다. 이 빈틈은 브라우저에 미리 넣어 두는 preload 목록으로 메운다.\n  - Service Worker 같은 강력한 API는 <strong>보안 컨텍스트<\/strong>에서만 쓸 수 있다. https 페이지와 `localhost` 루프백이 보안 컨텍스트다. `isSecureContext`로 확인한다.\n- <strong>핵심:<\/strong> TLS는 <strong>암호화 + 무결성 + 서버 신원 인증<\/strong>을 준다. 강력한 브라우저 API는 <strong>보안 컨텍스트<\/strong> 필수.\n- <strong>꼬리질문:<\/strong>\n  - \"HTTPS면 XSS도 막나요?\" → 아니다. HTTPS는 전송 구간만 지킨다.\n  - \"실기기에서 로컬 개발 서버로 카메라를 테스트하려면?\" → localhost가 아닌 http 주소에서는 카메라가 막힌다. 그래서 https 터널이 필요하다.\n- <strong>출처:<\/strong> [MDN — Secure contexts](https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Secure_Contexts) · [Cloudflare — TLS 1.3](https://blog.cloudflare.com/rfc-8446-aka-tls-1-3/)\n\n### REST vs GraphQL (Over-fetching / Under-fetching)\n\n- <strong>뭐야:<\/strong> API를 설계하는 두 방식이다. REST는 리소스마다 URL을 두고 서버가 응답 모양을 정한다. GraphQL은 엔드포인트를 하나만 두고 클라이언트가 필요한 필드만 골라 질의한다.\n- <strong>왜:<\/strong> REST를 리소스 단위 엔드포인트로만 쓰면 두 가지 낭비가 생긴다. 목록 카드에 이름 하나만 쓰는데 회원 상세 전체를 받는다(오버페칭). 화면 하나를 그리려고 회원·좌석·이용권을 따로 불러 왕복이 세 번이 된다(언더페칭). 이 비용과 GraphQL이 치르는 대가를 견줘 봐야 둘 중 하나를 고를 수 있다.\n- <strong>어떻게:<\/strong>\n  - <strong>REST<\/strong>는 리소스마다 URL을 두고 응답 모양은 서버가 정한다. URL이 곧 캐시 키라서 <strong>HTTP 캐시·CDN<\/strong>을 그대로 쓸 수 있다.\n  - <strong>GraphQL<\/strong>은 엔드포인트 하나에 <strong>필요한 필드만<\/strong> 질의한다. 여러 리소스를 한 요청으로 받는다. 타입 스키마가 서버와 클라이언트 사이의 계약이다.\n  - 대가도 있다. 요청이 보통 POST라서 HTTP 캐시를 쓰기 어렵다. 그래서 <strong>정규화 캐시<\/strong>(`__typename`+`id`, [5파트 참고](#n05/캐시-정규화-vs-쿼리-단위-캐시-normalized-cache \"캐시 정규화 vs 쿼리 단위 캐시\"))를 쓰거나 GET + persisted query를 쓴다. 서버는 N+1 문제(목록을 한 번 조회한 뒤 항목마다 추가 조회가 나가는 문제)를 DataLoader 배치로 막는다. 지나치게 무거운 질의는 깊이·복잡도 제한으로 막는다.\n- <strong>핵심:<\/strong> GraphQL은 <strong>오버·언더페칭을 없애는<\/strong> 대신 <strong>HTTP 캐시·서버 비용 통제<\/strong>를 직접 챙긴다.\n- <strong>꼬리질문:<\/strong>\n  - \"왜 GraphQL을 안 골랐나요?\" → 응답 모양이 고정돼 있어도 충분하고, 캐시·복잡도 제한을 운영하는 비용이 더 크다면 REST가 낫다. 오버페칭은 화면용 엔드포인트(BFF)로 줄인다.\n- <strong>출처:<\/strong> [GraphQL — Learn](https://graphql.org/learn/) · [GraphQL — Caching](https://graphql.org/learn/caching/) · [GraphQL — Performance](https://graphql.org/learn/performance/)\n\n> 한 줄 정리: 재시도는 멱등성, 갱신은 401만, 캐시는 해시 파일명과 재검증, 프로토콜은 HOL을 어디서 끊나, API 스타일은 누가 응답 모양을 정하나.\n\n## 2. 브라우저 보안 모델\n\n### 동일 출처 정책 (Same-Origin Policy)\n\n- <strong>뭐야:<\/strong> 한 출처의 스크립트가 다른 출처의 응답을 읽지 못하게 브라우저가 막는 기본 규칙이다. 출처는 스킴+호스트+포트의 조합이다. 쓰기와 임베드는 허용하고 <strong>읽기<\/strong>를 막는다.\n- <strong>왜:<\/strong> 이 정책을 모르면 \"CORS가 왜 있나요?\"에 답할 수 없다. CORS는 이 정책의 예외라서 막는 쪽을 먼저 알아야 한다. 다른 도메인 iframe의 DOM을 왜 못 읽는지도 설명하지 못한다. `localStorage`가 서브도메인끼리 왜 공유되지 않는지도 설명하지 못한다.\n- <strong>어떻게:<\/strong>\n  - <strong>출처(origin)<\/strong>는 스킴 + 호스트 + 포트다. 셋 중 하나만 달라도 다른 출처다(`http`↔`https`, `a.` ↔ `b.` 서브도메인).\n  - 막는 것은 두 가지다. 다른 출처의 응답을 <strong>JS가 읽기<\/strong>를 막는다. 다른 출처 iframe의 DOM에 접근하는 것도 막는다(`postMessage` 등만 허용).\n  - 허용하는 것도 두 가지다. <strong>쓰기<\/strong>(폼 제출, 링크, 리다이렉트)와 <strong>임베드<\/strong>(`<img>`·`<script>`·`<link>`·`<iframe>`)다. 쓰기를 허용하기 때문에 CSRF가 가능하다.\n  - 저장소도 출처별로 나뉜다(Web Storage·IndexedDB). 쿠키만 도메인 기준이다.\n- <strong>핵심:<\/strong> SOP는 <strong>읽기를 막고 쓰기·임베드는 허용<\/strong>한다. CORS는 SOP의 <strong>예외 허가<\/strong>다.\n- <strong>꼬리질문:<\/strong>\n  - \"SOP가 있는데 CSRF가 왜 되나요?\" → SOP가 <strong>보내기<\/strong>는 막지 않아서다. 공격자는 응답을 못 읽어도 요청을 보내는 것만으로 목적을 이룬다.\n  - \"site와 origin 차이는?\" → origin은 스킴+호스트+포트다. site는 등록 가능한 도메인(eTLD+1)에 스킴을 더한 것이다. SameSite 쿠키는 site를 기준으로 판단한다.\n- <strong>출처:<\/strong> [MDN — Same-origin policy](https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Same-origin_policy)\n\n### CORS와 preflight\n\n- <strong>뭐야:<\/strong> CORS는 서버가 응답 헤더로 \"이 출처는 읽어도 된다\"고 허락하는 방식이다. preflight는 그 허락을 실제 요청 전에 OPTIONS로 먼저 물어보는 단계다.\n- <strong>왜:<\/strong> 모르면 세 가지를 설명하지 못한다. Postman에선 되는데 브라우저에선 CORS 에러가 나는 이유를 모른다. `Authorization`을 붙이자 OPTIONS가 먼저 나가는 이유를 모른다. 쿠키를 보내려는데 `*`가 거부되는 이유를 모른다.\n- <strong>어떻게:<\/strong>\n  - CORS는 다른 출처의 응답을 JS에 넘길지 <strong>브라우저가<\/strong> 판정하는 규칙이다. 서버끼리의 통신이나 Postman에는 이 규칙이 없다. CORS는 <strong>사용자를 지키는 장치<\/strong>다.\n  - 단순 요청은 바로 보내고, 돌아온 응답 헤더를 보고 판정한다. 단순 요청은 메서드가 GET/HEAD/POST이고, 헤더가 안전 목록 안에 있고, 본문 형식이 `x-www-form-urlencoded`·`multipart/form-data`·`text/plain` 중 하나인 요청이다.\n  - 그 밖의 요청(PUT/DELETE, `application/json`, `Authorization` 등)은 <strong>preflight<\/strong>를 거친다. 실제 요청 전에 OPTIONS로 먼저 묻는다. 그 결과는 `Access-Control-Max-Age`만큼 캐시한다(브라우저가 정한 상한이 우선한다).\n  - 쿠키를 함께 보내려면 세 가지가 필요하다. `credentials: 'include'`, `Access-Control-Allow-Credentials: true`, 그리고 <strong>구체적 오리진<\/strong>이다. 이때는 Allow-Origin·Headers·Methods 어디에도 `*`를 쓸 수 없다.\n  - 피해 가는 방법도 있다. 같은 출처의 프록시(Next.js rewrites, BFF)를 거치면 CORS 자체가 생기지 않는다.\n- <strong>핵심:<\/strong> CORS는 <strong>브라우저의 읽기 허가<\/strong>다. JSON·커스텀 헤더면 <strong>preflight<\/strong>, 쿠키 동반이면 <strong>와일드카드 금지<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"CORS 에러면 요청은 서버에 안 간 건가요?\" → 단순 요청은 서버까지 가서 처리된다. 브라우저가 응답을 JS에 넘기지 않을 뿐이다. 그래서 CORS는 CSRF 방어가 아니다.\n- <strong>출처:<\/strong> [MDN — CORS](https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS#simple_requests)\n\n### 쿠키 속성: HttpOnly, Secure, SameSite\n\n- <strong>뭐야:<\/strong> 쿠키에 붙이는 안전 설정이다. HttpOnly는 JS가 쿠키를 못 읽게 한다. Secure는 https에서만 쿠키를 보내게 한다. SameSite는 다른 사이트에서 시작된 요청에 쿠키를 실을지 정한다.\n- <strong>왜:<\/strong> 설정이 틀리면 두 방향으로 문제가 난다. 로그인 쿠키를 JS가 읽을 수 있으면 XSS 한 번에 세션을 빼앗긴다. 반대로 결제 리다이렉트에서 돌아올 때 쿠키가 실리지 않으면 로그아웃된 것처럼 보인다.\n- <strong>어떻게:<\/strong>\n  - `HttpOnly`를 붙이면 JS(`document.cookie`)가 쿠키를 읽지 못한다. XSS로 쿠키를 <strong>탈취<\/strong>하는 것은 막는다. 하지만 공격 스크립트가 사용자 대신 요청을 보내는 것은 막지 못한다.\n  - `Secure`를 붙이면 https에서만 전송한다.\n  - `SameSite`는 다른 <strong>사이트<\/strong>에서 시작된 요청에 쿠키를 실을지 정한다. `Strict`는 절대 싣지 않는다. `Lax`는 교차 사이트 요청 중 <strong>최상위 이동 + GET 등 안전 메서드<\/strong>에만 싣는다. 최상위 이동은 주소창의 페이지 자체가 바뀌는 이동이다. `None`은 항상 싣지만 `Secure`가 필수다.\n  - 주의: Chrome 80(2020년 2월)부터 SameSite를 지정하지 않은 쿠키를 `Lax`로 취급한다. `None`에는 `Secure`를 요구한다. 이렇게 기본값으로 적용된 Lax는 쿠키 생성 후 2분 안의 최상위 POST를 예외로 허용한다. 브라우저마다 기본값이 다르다.\n  - site와 origin은 다르다. `a.example.com`과 `b.example.com`은 다른 출처지만 <strong>같은 사이트<\/strong>다.\n- <strong>핵심:<\/strong> <strong>HttpOnly는 탈취 방지<\/strong>, <strong>Secure는 평문 전송 방지<\/strong>, <strong>SameSite는 교차 사이트 전송 제어<\/strong>를 맡는다.\n- <strong>꼬리질문:<\/strong>\n  - \"Lax면 CSRF가 완전히 막히나요?\" → 교차 사이트 POST는 막는다(Chrome 기본 Lax의 2분 예외 제외). 하지만 GET 이동에는 쿠키가 실린다. 상태를 바꾸는 GET이 있거나 하위 도메인이 뚫리면 위험하다.\n  - \"로그아웃했는데 쿠키가 남는다면?\" → 쿠키 삭제(`Max-Age=0`)는 설정할 때와 같은 Domain·Path로 보내야 적용된다. 역할별로 쿠키가 따로 있으면 각각 지운다.\n- <strong>출처:<\/strong> [MDN — Set-Cookie](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie) · [web.dev — SameSite cookies](https://web.dev/articles/samesite-cookies-explained)\n\n### XSS와 방어 (Cross-Site Scripting)\n\n- <strong>뭐야:<\/strong> 공격자가 넣은 스크립트가 우리 페이지 안에서 실행되는 공격이다. 사용자 입력이 코드로 해석돼 피해자의 브라우저에서 실행된다.\n- <strong>왜:<\/strong> 게시글이나 마크다운처럼 사용자 입력을 HTML로 그리는 순간부터 위험해진다. 방어가 없으면 공격자의 스크립트가 피해자 권한으로 실행된다.\n- <strong>어떻게:<\/strong>\n  - 유형은 세 가지다. 저장형은 DB에 저장된 입력이 실행된다. 반사형은 URL 파라미터가 그대로 출력돼 실행된다. DOM 기반은 JS가 입력을 `innerHTML` 등에 넣어 실행된다.\n  - React는 JSX 텍스트를 <strong>자동 이스케이프<\/strong>한다. 이스케이프는 태그를 여는 꺾쇠 같은 문자를 코드가 아닌 글자로 바꿔 출력하는 일이다. 구멍은 세 곳이다. `dangerouslySetInnerHTML`, `href`/`src`에 넣는 사용자 URL(`javascript:`), `ref`로 직접 쓰는 `innerHTML`이다. 주의: React 19는 `javascript:` URL을 막는 값으로 바꾼다(18은 경고만).\n  - HTML이 꼭 필요하면 <strong>sanitize<\/strong>(DOMPurify)한 뒤 넣는다. sanitize는 위험한 태그와 속성을 걸러 내는 일이다. URL은 `http`/`https` 등 허용한 스킴만 받는다.\n  - <strong>CSP<\/strong>(`Content-Security-Policy`)는 실행할 수 있는 스크립트를 제한하는 헤더다. 허용 목록 방식보다 nonce·hash 기반의 strict CSP를 권장한다. `unsafe-inline`을 넣으면 CSP가 무력해진다. CSP는 sanitize를 대신하지 않는 <strong>2차 방어선<\/strong>이다.\n  - `localStorage`에 둔 토큰은 XSS 한 번에 탈취된다. HttpOnly 쿠키를 써도 XSS 스크립트가 사용자 대신 요청을 보내는 것은 막지 못한다.\n- <strong>핵심:<\/strong> XSS 방어의 1차는 <strong>이스케이프·sanitize<\/strong>, 2차는 <strong>CSP<\/strong>다. React의 구멍은 <strong>dangerouslySetInnerHTML과 URL 속성<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"CSP를 도입하면 대가는?\" → 인라인 스크립트, `eval`, 외부 스크립트를 전부 찾아 정리해야 한다. 처음에는 `Report-Only` 헤더로 위반만 수집한다.\n  - \"남의 사이트가 우리 페이지를 iframe에 띄워 클릭을 훔치면?\" → 이 공격을 클릭재킹이라고 한다. CSP `frame-ancestors 'none'`이 표준 방어다. `X-Frame-Options: DENY`는 구형 대응용이다. JS로 프레임에서 빠져나오는 방식은 우회된다.\n- <strong>출처:<\/strong> [OWASP — XSS Prevention](https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html) · [MDN — CSP](https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP) · [OWASP — Clickjacking](https://cheatsheetseries.owasp.org/cheatsheets/Clickjacking_Defense_Cheat_Sheet.html)\n\n### CSRF와 SameSite (Cross-Site Request Forgery)\n\n- <strong>뭐야:<\/strong> 사용자가 로그인한 상태를 악용해 다른 사이트가 우리 서버로 요청을 보내게 만드는 공격이다. 브라우저가 쿠키를 알아서 실어 주기 때문에 서버는 본인 요청으로 착각한다.\n- <strong>왜:<\/strong> 막지 않으면 로그인한 채로 악성 사이트를 열기만 해도 피해가 난다. 그 사이트의 폼이 우리 서버로 POST를 보낸다. 쿠키의 SameSite 설정이 허용하는 한 브라우저가 쿠키를 <strong>자동으로<\/strong> 싣는다.\n- <strong>어떻게:<\/strong>\n  - 전제가 있다. 쿠키나 HTTP Basic처럼 <strong>자동 전송되는 자격 증명<\/strong>을 쓸 때만 성립한다. `Bearer` 헤더는 JS가 직접 붙여야 하므로 CSRF 대상이 아니다. 대신 XSS에 노출된다.\n  - 주 방어는 <strong>CSRF 토큰<\/strong>이다. 서버 세션에 둔 토큰이나 서명된 double-submit 쿠키를 쓴다. 이 값을 요청에 함께 보내면 서버가 대조한다. 공격 사이트는 SOP 때문에 그 값을 읽지 못한다.\n  - 다른 주 방어도 있다. 하나는 커스텀 헤더를 요구하는 것이다(교차 출처면 preflight가 걸린다). 다른 하나는 <strong>Fetch Metadata<\/strong>(`Sec-Fetch-Site`) 검사다. Fetch Metadata는 요청이 어디서 시작됐는지 브라우저가 붙여 주는 헤더다. `Origin`/`Referer` 검증을 폴백으로 반드시 함께 둔다.\n  - <strong>SameSite<\/strong>는 OWASP 기준으로 <strong>보조<\/strong> 방어다. 상태를 바꾸는 GET, 하위 도메인, 브라우저별 차이 때문에 이것만으로는 부족하다.\n  - 상태를 바꾸는 동작은 GET에 두지 않는다(1섹션).\n- <strong>핵심:<\/strong> CSRF는 <strong>자동으로 실리는 쿠키<\/strong>를 악용한다. <strong>토큰·Fetch Metadata 검사<\/strong>가 주, <strong>SameSite는 보조<\/strong>. XSS가 있으면 무력하다.\n- <strong>꼬리질문:<\/strong>\n  - \"CORS가 CSRF를 막아 주지 않나요?\" → 막지 않는다. 단순 POST는 서버에서 그대로 처리된다. 오히려 credentials를 허용하는 CORS를 느슨하게 열면 CSRF 통로가 된다.\n  - \"XSS와 CSRF 차이는?\" → XSS는 공격자의 코드가 우리 사이트 안에서 실행되는 공격이다. CSRF는 다른 사이트가 우리 서버로 가는 요청을 위조하는 공격이다.\n- <strong>출처:<\/strong> [OWASP — CSRF Prevention](https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html) · [OWASP — Session Management](https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html)\n\n> 한 줄 정리: SOP는 읽기 차단, CORS는 예외 허가, SameSite는 쿠키 동반, XSS·CSRF 방어는 따로 — 서로를 대신하지 않는다.\n\n## 3. 인증: 세션, 토큰, 갱신\n\n### 세션 vs JWT (Session vs Token)\n\n- <strong>뭐야:<\/strong> 로그인 상태를 유지하는 두 방식이다. 세션은 서버가 상태를 갖고 클라이언트는 세션 ID만 갖는다. JWT는 서명된 정보를 클라이언트가 갖는다. 서버는 저장소를 조회하지 않고 서명과 클레임(만료 시각처럼 토큰에 담긴 정보)을 검증한다.\n- <strong>왜:<\/strong> 장단점을 모르면 \"JWT는 stateless라 좋다\"고 답했다가 \"강제 로그아웃은요?\"에서 막힌다. JWT는 한번 발급하면 회수하기 어렵다.\n- <strong>어떻게:<\/strong>\n  - <strong>세션<\/strong>은 서버가 상태를 갖고 클라이언트는 세션 ID 쿠키만 갖는다. 즉시 무효화하기 쉽다. 서버가 여러 대면 공유 저장소(Redis 등)가 필요하다.\n  - <strong>JWT<\/strong>는 서명된 클레임을 저장소 조회 없이 검증한다. 서버 대수를 늘리는 수평 확장이 쉽지만 <strong>발급 후 회수가 어렵다<\/strong>.\n  - JWT 페이로드는 base64url로 인코딩했을 뿐 <strong>암호화가 아니다<\/strong>. 서명은 위변조를 검증할 뿐 내용을 숨기지 않는다. 내용을 숨겨야 하면 JWE를 쓰거나 서버 쪽 불투명 토큰(그 자체에는 정보가 없는 값)을 쓴다.\n  - 절충안은 <strong>짧은 액세스 + 서버가 관리하는 리프레시<\/strong>다. 회수는 리프레시 쪽에서 한다.\n- <strong>핵심:<\/strong> 세션은 <strong>회수가 쉽고 저장소가 필요<\/strong>, JWT는 <strong>검증이 싸고 회수가 어렵다<\/strong>. JWT는 <strong>서명이지 암호화가 아니다<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"JWT를 즉시 무효화하려면?\" → `jti` 거부 목록이나 토큰 버전을 서버에 두면 된다. 하지만 조회가 생겨 stateless 장점이 줄어든다. 그래서 액세스 토큰 수명을 짧게 둔다.\n- <strong>출처:<\/strong> [OWASP — JWT Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_Cheat_Sheet.html) · [OWASP — Session Management](https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html)\n\n### 액세스 토큰과 리프레시 토큰 (Access / Refresh Token)\n\n- <strong>뭐야:<\/strong> 토큰을 둘로 나눈 구조다. 액세스 토큰은 매 요청에 쓰는 짧은 수명의 출입증이고, 리프레시 토큰은 그 출입증을 새로 받는 데만 쓰는 긴 수명의 토큰이다.\n- <strong>왜:<\/strong> 토큰이 하나뿐이면 수명을 정하기 어렵다. 길게 잡으면 유출됐을 때 피해가 오래간다. 짧게 잡으면 사용자가 자꾸 튕긴다. 또 갱신 실패를 구분하지 않고 바로 로그아웃시키면 지하철 사용자가 로그인 화면을 본다.\n- <strong>어떻게:<\/strong>\n  - 액세스 토큰은 수명을 짧게(분 단위) 두고 매 요청에 쓴다. 리프레시 토큰은 수명을 길게 두고 <strong>갱신에만<\/strong> 쓴다.\n  - 저장 위치도 다르다. 리프레시는 HttpOnly·Secure 쿠키(또는 서버 세션 안)에 둔다. 액세스는 메모리에 둔다. `localStorage`에 두면 XSS에 노출된다. IETF 브라우저 앱 권고는 토큰을 브라우저에 두지 않는 <strong>BFF<\/strong>(프론트 전용 중간 서버) 구조를 가장 안전하게 본다.\n  - <strong>리프레시 토큰 회전(rotation)<\/strong>은 갱신할 때마다 새 리프레시를 주고 옛것을 폐기하는 방식이다. 폐기된 토큰이 다시 쓰이면 탈취로 보고 그 토큰 계열 전체를 무효화한다. RFC 9700은 공개 클라이언트(비밀값을 숨길 수 없는 SPA·앱)에 회전 또는 송신자 제약(DPoP 등)을 MUST로 둔다.\n  - 갱신 실패는 <strong>분류<\/strong>한다. 순간 끊김이나 5xx는 일시적 실패다. 이때는 토큰을 보존하고 재시도한다. 리프레시 만료·폐기는 영구 실패다. 이때는 로그아웃한다.\n  - 만료를 감지하는 경로는 둘이다. 하나는 만료 시각을 보고 미리 갱신하는 선제 갱신이다. 다른 하나는 401을 받은 뒤 복구하는 사후 복구다.\n- <strong>핵심:<\/strong> 액세스 토큰은 <strong>짧게·메모리<\/strong>, 리프레시 토큰은 <strong>길게·HttpOnly<\/strong>로 둔다. 갱신 실패는 <strong>일시적이면 보존, 영구적이면 로그아웃<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"일시적 실패에도 로그아웃시키면 뭐가 문제죠?\" → 잠깐 끊긴 사이에 사용자가 쫓겨난다. 진행 중이던 작업(측정, 입력)도 사라진다.\n  - \"판정이 여러 층에 있으면?\" → 층마다 판정이 어긋난다. 아래층은 토큰을 보존했는데 위층이 오류 플래그만 보고 로그아웃시킨다. 그래서 판정은 함수 하나로 모은다.\n- <strong>출처:<\/strong> [RFC 9700](https://datatracker.ietf.org/doc/html/rfc9700) · [IETF — OAuth 브라우저 앱 초안(RFC 10017)](https://datatracker.ietf.org/doc/html/draft-ietf-oauth-browser-based-apps)\n\n### OAuth 2.0 Authorization Code + PKCE\n\n- <strong>뭐야:<\/strong> 인가 서버(소셜 로그인 제공자 등)에서 인가 코드를 받아 액세스 토큰으로 바꾸는 흐름이다. OAuth 자체는 권한을 위임하는 규약이다. 로그인(신원 확인)은 보통 그 위에 OpenID Connect를 얹어 처리한다. <strong>PKCE<\/strong>는 코드를 요청한 클라이언트만 그 코드를 교환할 수 있게 비밀값 짝을 붙이는 장치다.\n- <strong>왜:<\/strong> SPA와 앱은 client secret(서버가 클라이언트를 확인하는 비밀값)을 숨길 수 없다. PKCE가 없으면 redirect로 돌아온 인가 코드를 다른 앱이 가로채 토큰으로 바꿀 수 있다.\n- <strong>어떻게:<\/strong>\n  - 흐름은 이렇다. 인가 서버로 이동 → 로그인·동의 → <strong>인가 코드<\/strong>를 들고 redirect URI로 복귀 → 코드를 <strong>토큰으로 교환<\/strong>\n  - <strong>PKCE<\/strong>에서는 클라이언트가 무작위 값 `code_verifier`를 만든다. 처음에는 그 해시(`code_challenge`, S256)만 보낸다. 코드를 토큰으로 교환할 때 원본을 낸다. 공격자가 코드를 훔쳐도 verifier가 없으면 토큰으로 바꾸지 못한다.\n  - RFC 9700은 공개 클라이언트에 PKCE를 <strong>필수<\/strong>로 두고, 기밀 클라이언트에도 권장한다. 토큰을 URL로 받는 Implicit 방식은 SHOULD NOT이다.\n  - `state`(또는 PKCE)로 로그인 CSRF를 막는다. 인가 서버는 redirect URI를 미리 등록된 값과 <strong>정확한 문자열 일치<\/strong>로 비교해야 한다(RFC 9700 §2.1 MUST). 네이티브 앱 `localhost` redirect의 포트 번호만 예외다.\n- <strong>핵심:<\/strong> 브라우저·앱의 로그인 흐름은 <strong>Authorization Code + PKCE<\/strong>다. PKCE는 <strong>코드를 요청한 클라이언트만 교환<\/strong>하게 한다.\n- <strong>꼬리질문:<\/strong>\n  - \"PKCE면 client secret이 필요 없나요?\" → PKCE가 client secret을 대신하지는 않는다. 비밀을 지킬 수 있는 서버(BFF)가 있으면 둘 다 쓴다.\n  - \"토큰은 어디 두나요?\" → BFF가 토큰을 갖고 브라우저엔 HttpOnly 세션 쿠키만 주는 구조가 가장 안전하다.\n- <strong>출처:<\/strong> [oauth.net — PKCE](https://oauth.net/2/pkce/) · [RFC 9700 §2.1](https://datatracker.ietf.org/doc/html/rfc9700)\n\n### 토큰 갱신 single-flight\n\n- <strong>뭐야:<\/strong> 동시에 여러 곳에서 토큰 갱신이 필요해도 실제 갱신 요청은 하나만 보내고, 나머지는 그 결과를 함께 기다리게 하는 방식이다.\n- <strong>왜:<\/strong> 없으면 API 5개가 동시에 401을 받았을 때 리프레시 요청이 5번 나간다. 회전을 쓰면 첫 번째만 성공한다. 나머지는 이미 폐기된 토큰을 내밀어 실패한다. 서버가 이 재사용을 탈취로 보면 토큰 계열 전체가 무효화돼 사용자가 로그아웃된다. 플래그+큐 방식(갱신 중이라는 표시를 세우고 나머지 요청을 줄 세워 두는 방식)으로 막으면 선제 갱신과 401 복구가 엇갈릴 때 큐가 영영 비지 않을 수 있다.\n- <strong>어떻게:<\/strong>\n  - 진행 중인 갱신을 <strong>Promise 하나로 공유<\/strong>한다. 뒤에 온 호출은 새 요청을 보내지 않고 <strong>같은 Promise를 await<\/strong>한다.\n  - 성공하든 실패하든 `finally`에서 공유 Promise를 비운다. 실패도 기다리던 모두에게 전달되므로 영원히 대기하는 요청이 없다.\n  - 선제 갱신과 401 복구가 <strong>같은 함수<\/strong>를 쓴다. 경로가 둘로 나뉘면 single-flight도 둘이 된다.\n  - 401을 받은 요청의 재시도는 <strong>1회만<\/strong> 한다. 갱신 요청 자체가 401을 받으면 다시 갱신 경로로 들어가지 않게 한다.\n\n```ts\nlet inflight: Promise<string> | null = null;\n\nexport function refreshOnce() {\n  inflight ??= requestRefresh().finally(() => {\n    inflight = null;\n  });\n  return inflight;\n}\n```\n\n- <strong>핵심:<\/strong> 동시 401은 <strong>갱신 하나에 합류<\/strong>시킨다. 플래그·큐가 아니라 <strong>공유 Promise<\/strong>, 실패도 <strong>같이 실패<\/strong>한다. 재시도는 <strong>1회<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"플래그+큐 방식은 왜 버렸나요?\" → 큐를 비우는 책임이 한 경로에만 있어서다. 다른 경로가 플래그만 세우고 끝나면 큐에 쌓인 요청이 영원히 대기한다.\n  - \"탭이 여러 개면 탭끼리도 겹치지 않나요?\" → 겹친다. 탭 사이에서는 두 방법으로 조율한다. 하나는 서버가 직전 리프레시를 잠깐 더 허용해 주는 유예다. 다른 하나는 BroadcastChannel·락이다.\n  - \"갱신이 실패하면 기다리던 요청들은?\" → 모두 같은 거절을 받는다. 그 뒤에는 일시·영구 분류에 따라 처리한다.\n- <strong>출처:<\/strong> [Go singleflight](https://pkg.go.dev/golang.org/x/sync/singleflight) · [RFC 9700 §4.14](https://datatracker.ietf.org/doc/html/rfc9700)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"요청 A, B, C가 동시에 401을 받으면 A만 갱신 요청을 보내고 B와 C는 같은 Promise를 기다렸다가 새 토큰으로 함께 재시도하는 시퀀스\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <text x=\"90\" y=\"30\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">요청 A·B·C<\/text>\n  <text x=\"330\" y=\"30\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">refreshOnce()<\/text>\n  <text x=\"590\" y=\"30\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">인증 서버<\/text>\n  <line x1=\"90\" y1=\"42\" x2=\"90\" y2=\"340\" stroke=\"var(--fig-line)\" stroke-dasharray=\"4 4\"/>\n  <line x1=\"330\" y1=\"42\" x2=\"330\" y2=\"340\" stroke=\"var(--fig-line)\" stroke-dasharray=\"4 4\"/>\n  <line x1=\"590\" y1=\"42\" x2=\"590\" y2=\"340\" stroke=\"var(--fig-line)\" stroke-dasharray=\"4 4\"/>\n  <rect x=\"40\" y=\"56\" width=\"100\" height=\"26\" rx=\"6\" fill=\"var(--fig-accent2)\" opacity=\"0.25\" stroke=\"var(--fig-accent2)\"/>\n  <text x=\"90\" y=\"74\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">A·B·C 모두 401<\/text>\n  <line x1=\"90\" y1=\"104\" x2=\"322\" y2=\"104\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <polygon points=\"322,99 332,104 322,109\" fill=\"var(--fig-accent)\"/>\n  <text x=\"206\" y=\"98\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">A: inflight 없음 → 생성<\/text>\n  <line x1=\"330\" y1=\"124\" x2=\"582\" y2=\"124\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <polygon points=\"582,119 592,124 582,129\" fill=\"var(--fig-accent)\"/>\n  <text x=\"460\" y=\"118\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">리프레시 요청 1회<\/text>\n  <line x1=\"90\" y1=\"150\" x2=\"322\" y2=\"150\" stroke=\"var(--fig-line)\" stroke-width=\"2\" stroke-dasharray=\"6 3\"/>\n  <polygon points=\"322,145 332,150 322,155\" fill=\"var(--fig-line)\"/>\n  <text x=\"206\" y=\"144\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">B: 같은 Promise await<\/text>\n  <line x1=\"90\" y1=\"178\" x2=\"322\" y2=\"178\" stroke=\"var(--fig-line)\" stroke-width=\"2\" stroke-dasharray=\"6 3\"/>\n  <polygon points=\"322,173 332,178 322,183\" fill=\"var(--fig-line)\"/>\n  <text x=\"206\" y=\"172\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">C: 같은 Promise await<\/text>\n  <rect x=\"300\" y=\"132\" width=\"60\" height=\"70\" rx=\"6\" fill=\"var(--fig-muted)\" opacity=\"0.2\" stroke=\"var(--fig-line)\"/>\n  <line x1=\"590\" y1=\"218\" x2=\"338\" y2=\"218\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <polygon points=\"338,213 328,218 338,223\" fill=\"var(--fig-accent)\"/>\n  <text x=\"460\" y=\"212\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">새 액세스 토큰<\/text>\n  <line x1=\"330\" y1=\"248\" x2=\"98\" y2=\"248\" stroke=\"var(--fig-accent)\" stroke-width=\"2\"/>\n  <polygon points=\"98,243 88,248 98,253\" fill=\"var(--fig-accent)\"/>\n  <text x=\"206\" y=\"242\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">A·B·C 모두 resolve<\/text>\n  <text x=\"330\" y=\"276\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">finally → inflight = null<\/text>\n  <rect x=\"30\" y=\"292\" width=\"120\" height=\"30\" rx=\"6\" fill=\"var(--fig-accent)\" opacity=\"0.2\" stroke=\"var(--fig-accent)\"/>\n  <text x=\"90\" y=\"312\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">각자 1회 재시도<\/text>\n  <text x=\"460\" y=\"312\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">실패해도 셋이 같은 거절을 받는다<\/text>\n<\/svg>\n<figcaption>single-flight: 동시에 터진 401은 갱신 요청 하나에 합류한다<\/figcaption>\n<\/figure>\n\n> 한 줄 정리: 세션은 회수, JWT는 확장, 로그인은 Code + PKCE, 갱신은 공유 Promise 하나로 — 영구 실패일 때만 로그아웃.\n\n## 4. 실시간 통신\n\n### 폴링·롱폴링·SSE·WebSocket 선택 (Realtime Transport)\n\n- <strong>뭐야:<\/strong> 서버의 새 데이터를 화면에 빨리 반영하는 전송 방식들이다. 폴링은 주기적으로 묻는다. 롱폴링은 새 데이터가 생길 때까지 서버가 응답을 붙잡는다. SSE는 서버가 클라이언트 쪽으로만 흘려보낸다. WebSocket은 양방향으로 주고받는다.\n- <strong>왜:<\/strong> 요구사항을 따지지 않고 고르면 두 가지로 손해를 본다. \"실시간이니까 WebSocket\"으로 시작하면 재연결·인증·확장을 전부 직접 짜야 한다. 반대로 짧은 주기의 폴링을 고르면 변화가 없어도 요청만 쌓이고, 표시값이 계단처럼 튄다.\n- <strong>어떻게:<\/strong>\n  - 요구사항에서 출발한다. 따질 것은 <strong>방향<\/strong>, <strong>지연 허용치<\/strong>, <strong>연결 수<\/strong>, 그리고 프록시·웹뷰 환경이다.\n  - <strong>폴링<\/strong>은 가장 단순하다. 지연은 폴링 주기만큼 생기고 빈 요청이 많다. 변화가 드물면 이것으로 충분하다.\n  - <strong>롱폴링<\/strong>은 새 데이터가 생길 때까지 서버가 응답을 붙잡는다. 클라이언트는 응답을 받을 때마다 다시 요청한다. WebSocket이 막힌 환경에서 폴백으로 쓴다.\n  - <strong>SSE<\/strong>(`EventSource`)는 HTTP 위에서 <strong>서버→클라 단방향<\/strong>으로 흐르는 텍스트 스트림이다. 연결이 끊기면 브라우저가 <strong>자동 재연결<\/strong>한다. 이때 마지막으로 받은 `id:` 값을 `Last-Event-ID`로 보내 이어 받는다. 알림과 AI 스트리밍에 적합하다. `EventSource`의 옵션은 `withCredentials`뿐이라서 `Authorization` 헤더를 붙일 수 없다.\n  - <strong>WebSocket<\/strong>은 <strong>양방향<\/strong>이다. 클라이언트에서 서버로 보내는 일도 잦을 때 쓴다. 재연결·하트비트(연결이 살아 있는지 확인하려고 주기적으로 보내는 신호)·재동기화는 직접 짜거나 socket.io에 맡긴다. 서버를 확장하려면 pub/sub 중계가 필요하다. backpressure(받는 쪽이 느릴 때 보내는 속도를 늦추는 장치)가 없다. 열린 연결은 일부 브라우저에서 bfcache(뒤로·앞으로 가기 때 페이지를 통째로 되살리는 캐시)를 막는다(주의: web.dev 기준 Chrome 149+와 Safari는 막지 않는다).\n- <strong>핵심:<\/strong> 실시간 전송 방식은 <strong>방향과 지연 허용치<\/strong>로 고른다. 단방향이면 <strong>SSE<\/strong>(재연결 공짜), 양방향이면 <strong>WebSocket<\/strong>(재연결은 내 몫), 드물면 <strong>폴링<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"AI 답변 스트리밍은 SSE가 정석 아닌가요?\" → 맞다. 다만 양방향 소켓을 이미 쓰고 있다면 사정이 다르다. 스트림만 SSE로 빼면 연결이 둘이 된다. 이럴 때는 기존 소켓에 태우는 것도 합리적이다.\n  - \"WebSocket이 막히는 환경은?\" → 사내 프록시·방화벽·백신이 WebSocket 업그레이드를 막는 환경이다. socket.io가 HTTP 롱폴링으로 먼저 연결한 뒤 업그레이드하는 이유가 이것이다.\n  - \"실시간인데 표시값이 계단처럼 튀면?\" → 폴링 주기마다 값을 통째로 바꾸기 때문이다. 서버가 준 기준값에 클라이언트 보간(라이브 델타)을 더해 그린다.\n- <strong>출처:<\/strong> [MDN — SSE](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events) · [MDN — WebSockets API](https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API) · [Socket.IO — How it works](https://socket.io/docs/v4/how-it-works/)\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"폴링, 롱폴링, SSE, WebSocket의 요청과 응답 흐름을 시간축 네 줄로 비교한 그림\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <text x=\"20\" y=\"30\" font-size=\"14\" fill=\"currentColor\">시간 →<\/text>\n  <line x1=\"150\" y1=\"22\" x2=\"700\" y2=\"22\" stroke=\"var(--fig-line)\"/>\n  <polygon points=\"700,17 710,22 700,27\" fill=\"var(--fig-line)\"/>\n  <text x=\"20\" y=\"80\" font-size=\"15\" fill=\"currentColor\">폴링<\/text>\n  <line x1=\"150\" y1=\"76\" x2=\"700\" y2=\"76\" stroke=\"var(--fig-line)\" stroke-dasharray=\"3 4\"/>\n  <rect x=\"160\" y=\"64\" width=\"24\" height=\"24\" rx=\"4\" fill=\"var(--fig-muted)\" opacity=\"0.4\"/>\n  <rect x=\"270\" y=\"64\" width=\"24\" height=\"24\" rx=\"4\" fill=\"var(--fig-muted)\" opacity=\"0.4\"/>\n  <rect x=\"380\" y=\"64\" width=\"24\" height=\"24\" rx=\"4\" fill=\"var(--fig-accent)\" opacity=\"0.6\"/>\n  <rect x=\"490\" y=\"64\" width=\"24\" height=\"24\" rx=\"4\" fill=\"var(--fig-muted)\" opacity=\"0.4\"/>\n  <rect x=\"600\" y=\"64\" width=\"24\" height=\"24\" rx=\"4\" fill=\"var(--fig-muted)\" opacity=\"0.4\"/>\n  <text x=\"150\" y=\"108\" font-size=\"13\" fill=\"currentColor\">주기마다 요청, 대부분 빈 응답 · 지연 = 주기<\/text>\n  <text x=\"20\" y=\"152\" font-size=\"15\" fill=\"currentColor\">롱폴링<\/text>\n  <rect x=\"160\" y=\"138\" width=\"200\" height=\"24\" rx=\"4\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <rect x=\"340\" y=\"138\" width=\"20\" height=\"24\" rx=\"4\" fill=\"var(--fig-accent)\" opacity=\"0.6\"/>\n  <rect x=\"370\" y=\"138\" width=\"150\" height=\"24\" rx=\"4\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <rect x=\"500\" y=\"138\" width=\"20\" height=\"24\" rx=\"4\" fill=\"var(--fig-accent)\" opacity=\"0.6\"/>\n  <rect x=\"530\" y=\"138\" width=\"160\" height=\"24\" rx=\"4\" fill=\"none\" stroke=\"var(--fig-line)\"/>\n  <text x=\"150\" y=\"182\" font-size=\"13\" fill=\"currentColor\">이벤트까지 응답을 붙잡음 → 받으면 즉시 재요청<\/text>\n  <text x=\"20\" y=\"226\" font-size=\"15\" fill=\"currentColor\">SSE<\/text>\n  <rect x=\"160\" y=\"212\" width=\"530\" height=\"24\" rx=\"4\" fill=\"var(--fig-accent2)\" opacity=\"0.15\" stroke=\"var(--fig-accent2)\"/>\n  <rect x=\"250\" y=\"216\" width=\"14\" height=\"16\" rx=\"3\" fill=\"var(--fig-accent)\"/>\n  <rect x=\"330\" y=\"216\" width=\"14\" height=\"16\" rx=\"3\" fill=\"var(--fig-accent)\"/>\n  <rect x=\"470\" y=\"216\" width=\"14\" height=\"16\" rx=\"3\" fill=\"var(--fig-accent)\"/>\n  <rect x=\"610\" y=\"216\" width=\"14\" height=\"16\" rx=\"3\" fill=\"var(--fig-accent)\"/>\n  <text x=\"150\" y=\"256\" font-size=\"13\" fill=\"currentColor\">연결 하나 유지, 서버 → 클라만 · 자동 재연결 + Last-Event-ID<\/text>\n  <text x=\"20\" y=\"300\" font-size=\"15\" fill=\"currentColor\">WebSocket<\/text>\n  <rect x=\"160\" y=\"286\" width=\"530\" height=\"24\" rx=\"4\" fill=\"var(--fig-accent)\" opacity=\"0.12\" stroke=\"var(--fig-accent)\"/>\n  <polygon points=\"240,290 254,298 240,306\" fill=\"var(--fig-accent)\"/>\n  <polygon points=\"344,290 330,298 344,306\" fill=\"var(--fig-accent2)\"/>\n  <polygon points=\"430,290 444,298 430,306\" fill=\"var(--fig-accent)\"/>\n  <polygon points=\"560,290 546,298 560,306\" fill=\"var(--fig-accent2)\"/>\n  <polygon points=\"620,290 634,298 620,306\" fill=\"var(--fig-accent)\"/>\n  <text x=\"150\" y=\"330\" font-size=\"13\" fill=\"currentColor\">연결 하나로 양방향 · 재연결·하트비트·재동기화는 직접<\/text>\n<\/svg>\n<figcaption>방향과 지연 허용치가 방식을 고른다: 단방향이면 SSE, 양방향이면 WebSocket<\/figcaption>\n<\/figure>\n\n### 재연결: 백오프, jitter, 재동기화 (Reconnect & Resync)\n\n- <strong>뭐야:<\/strong> 끊긴 실시간 연결을 다시 잇는 방법이다. 재시도 간격을 점점 늘리고(백오프) 간격에 무작위 값을 섞는다(jitter). 다시 연결된 뒤에는 놓친 데이터를 메운다(<strong>재동기화<\/strong>).\n- <strong>왜:<\/strong> 없으면 세 가지 문제가 난다. 서버가 살아나는 순간 모든 클라이언트가 동시에 재접속해 서버를 다시 쓰러뜨릴 수 있다. 끊긴 동안의 이벤트가 빠진다. `close`가 오지 않아 재연결이 시작되지도 않는다.\n- <strong>어떻게:<\/strong>\n  - <strong>지수 백오프<\/strong>는 실패할 때마다 간격을 늘리고 상한을 두는 방식이다. 예를 들어 socket.io 기본값은 1초에서 시작해 2배씩 늘고 최대 5초다.\n  - <strong>jitter<\/strong>는 간격에 무작위 값을 섞는 것이다(socket.io 기본 0.5). 없으면 재시도가 한 시각에 몰린다.\n  - <strong>half-open 감지<\/strong>가 필요하다. 연결이 조용히 끊기면 종료 신호가 오지 않는다. 그래서 클라이언트는 연결을 계속 \"열림\"으로 안다. <strong>ping/pong 하트비트<\/strong>로 이 상태를 감지한다. `online`·`visibilitychange` 이벤트가 오면 즉시 확인한다.\n  - <strong>재동기화<\/strong>는 놓친 구간을 메우는 일이다. 방법은 둘이다. <strong>delta<\/strong>는 마지막으로 받은 번호 이후만 받는다(`Last-Event-ID`·seq). <strong>snapshot<\/strong>은 현재 상태를 통째로 받아 교체한다. 받는 쪽은 seq·id로 <strong>중복 제거<\/strong>를 한다.\n  - 재연결 직후에는 구독을 다시 등록한다. socket.io의 연결 상태 복구(기본 2분)도 <strong>항상 성공하진 않아<\/strong> 재동기화가 따로 필요하다.\n- <strong>핵심:<\/strong> 재연결은 <strong>백오프 + jitter<\/strong>로 몰림을, <strong>하트비트<\/strong>로 죽은 연결을 막고, 재연결 뒤엔 <strong>delta·snapshot 재동기화<\/strong>를 한다.\n- <strong>꼬리질문:<\/strong>\n  - \"delta와 snapshot은 누가 고르나요?\" → 밀린 양이 많으면 snapshot이 싸고, 적으면 delta가 싸다. 서버가 판단하거나 채널마다 하나로 고정한다.\n  - \"재연결 중 놓친 메시지를 seq로 걸러도 구멍은요?\" → `seq <= lastSeq`인 메시지를 버리는 것은 중복만 막는다. 빠진 메시지는 잡지 못한다. `seq !== lastSeq + 1`이면 재요청하는 갭 검출이 따로 필요하다.\n  - \"끊긴 동안 클라이언트가 계속 숫자를 세다가 서버 값이 더 작으면?\" → 화면의 숫자가 되감긴다. 서버 값이 기준이다. 되감김을 그대로 보여 줄지 단조 증가로 보여 줄지 같은 표시 정책은 따로 정한다([5파트 참고](#n05/단일-원본-single-source-of-truth \"단일 원본\")).\n- <strong>출처:<\/strong> [AWS — Backoff and Jitter](https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/) · [Socket.IO — State recovery](https://socket.io/docs/v4/connection-state-recovery)\n\n> 한 줄 정리: 방식은 방향과 지연으로 고르고, 끊김은 백오프·jitter·하트비트로 견디고, 재연결 뒤엔 반드시 재동기화한다.\n\n## 5. 불안정한 네트워크와 웹뷰\n\n### 오프라인 감지 (Offline Detection)\n\n- <strong>뭐야:<\/strong> 사용자 기기가 네트워크에 닿지 않는 상태를 알아내는 일이다. `navigator.onLine`은 힌트일 뿐이고, 실제 판정은 요청 결과로 한다.\n- <strong>왜:<\/strong> 제대로 판정하지 않으면 지하철에서 요청이 실패했는데 화면은 \"서버 오류\"라고 알린다. `navigator.onLine`이 true인데 인터넷이 안 되는 경우도 있어서 이 값만 믿을 수 없다.\n- <strong>어떻게:<\/strong>\n  - `navigator.onLine`과 `online`/`offline` 이벤트는 브라우저·OS가 어림짐작(휴리스틱)으로 내는 값이다. LAN에만 연결돼도 true라서 <strong>인터넷을 보장하지 않고<\/strong> 오판도 있다. MDN은 이 값을 기능을 끄는 근거로 쓰지 말고 <strong>힌트<\/strong>로만 쓰라고 한다.\n  - 판정은 <strong>요청 결과<\/strong>로 한다. fetch가 `TypeError`로 거절되면 응답이 없었다는 뜻이므로 네트워크 문제다. 응답이 왔으면 상태 코드 문제다. 주의: CORS 차단도 JS에서는 같은 거절로만 보인다.\n  - 오프라인이면 세 가지를 한다. 쓰기를 막거나 큐에 쌓는다. \"연결 끊김\"을 별도 상태로 보여 준다. 연결이 돌아오면 다시 조회한다. TanStack Query의 기본값 `networkMode: 'online'`은 오프라인이면 요청을 `paused`로 멈췄다가 재연결되면 잇는다.\n  - 끊김을 <strong>로그아웃 사유로 오인하지 않는다<\/strong>. 네트워크 실패와 인증 실패는 서로 다른 분기로 처리한다.\n- <strong>핵심:<\/strong> `onLine`은 <strong>힌트<\/strong>일 뿐이다(true는 특히 의심). 판정은 <strong>실제 요청 결과<\/strong>로. 네트워크 실패는 <strong>인증 실패가 아니다<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"오프라인 중 사용자가 저장을 누르면?\" → 데이터 성격에 따라 다르다. 측정 기록처럼 잃으면 안 되는 것은 로컬에 쌓았다가 다시 보낸다(멱등 키 필수). 결제처럼 즉시 확정이 필요한 것은 막는다.\n  - \"페이지를 닫는 순간 보내야 하는 데이터는?\" → `sendBeacon`이나 `fetch(..., { keepalive: true })`로 보낸다. 응답을 받지 못하므로 되돌릴 수 없는 요청(종료·무효화)을 이렇게 보내면 위험하다([1파트 참고](#n01/페이지-이탈-시-데이터-보내기-visibilitychange-pagehide-sendbeacon \"페이지 이탈 시 데이터 보내기\")).\n- <strong>출처:<\/strong> [MDN — Navigator.onLine](https://developer.mozilla.org/en-US/docs/Web/API/Navigator/onLine) · [TanStack — Network Mode](https://tanstack.com/query/v5/docs/framework/react/guides/network-mode)\n\n### 재시도 정책과 지수 백오프 (Retry Policy)\n\n- <strong>뭐야:<\/strong> 실패한 요청을 다시 보내는 규칙이다. 어떤 실패에, 어떤 요청을, 몇 번, 어떤 간격으로 다시 보낼지를 정한다. <strong>지수 백오프<\/strong>는 실패할 때마다 다음 시도까지 간격을 늘리는 방식이다.\n- <strong>왜:<\/strong> 정책 없이 재시도하면 두 가지 문제가 난다. 400을 세 번 재시도해 사용자가 몇 초 뒤에야 같은 에러를 본다. 결제 POST를 멱등 키 없이 자동 재시도하면 이중 결제가 날 수 있다.\n- <strong>어떻게:<\/strong>\n  - <strong>무엇을<\/strong>: 일시적일 가능성이 큰 실패만 재시도한다. 흔히 네트워크 오류, 408, 429, 502/503/504를 후보로 본다. 근거는 코드마다 다르다. RFC 9110은 408에 재전송을 허용하고 503에 `Retry-After`를 붙일 수 있게 한다. 429의 `Retry-After`는 RFC 6585가 정한다. 502·504에는 재시도 규정이 없고 관례로 재시도한다. 다른 4xx는 다시 보내도 대개 결과가 같다.\n  - <strong>어떤 요청을<\/strong>: 멱등 요청, 또는 멱등 키가 있는 POST만 재시도한다.\n  - <strong>얼마나<\/strong>: 상한을 두고 지수 백오프와 jitter를 적용한다. `Retry-After`가 있으면 그 값을 따른다.\n  - TanStack Query 기본값은 이렇다. 쿼리는 <strong>3회 재시도<\/strong>한다(서버 렌더링에서는 0). 간격은 `min(1000 × 2^n, 30000)`ms다. mutation은 기본이 <strong>재시도 없음<\/strong>이다. `retry`를 함수로 주면 상태 코드별로 재시도를 끌 수 있다.\n- <strong>핵심:<\/strong> 재시도는 <strong>일시적 실패 × 멱등 요청<\/strong>에만 한다. <strong>상한 + 백오프 + jitter<\/strong>, 4xx는 <strong>재시도하지 않는다<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"기본 3회 재시도를 그대로 두면 어떤 문제가?\" → 403·404에도 수 초간 로딩이 이어진다. 그래서 상태 코드별로 재시도를 끈다.\n  - \"재시도가 성공처럼 보이는 함정은?\" → 첫 시도가 일부만 처리된 뒤 재시도가 성공하는 경우다. 화면에는 성공으로 보이지만 데이터는 불완전하다. 응답의 결과 필드(배정 여부 등)로 확인한다.\n- <strong>출처:<\/strong> [TanStack — Query Retries](https://tanstack.com/query/v5/docs/framework/react/guides/query-retries) · [TanStack — Mutations](https://tanstack.com/query/v5/docs/framework/react/guides/mutations)\n\n### 하이브리드 앱 웹뷰 브릿지 (WebView Bridge)\n\n- <strong>뭐야:<\/strong> 앱 안의 웹뷰에서 돌아가는 웹과 네이티브 앱이 메시지를 주고받는 통로다. 웹이 카메라·다운로드 같은 기능을 앱에 부탁할 때 쓴다.\n- <strong>왜:<\/strong> 웹은 바로 배포되지만 앱은 심사와 업데이트를 거친다. 그래서 새 웹이 구버전 앱에 없는 브릿지 메서드를 부르는 일이 생긴다. 이때 응답이 오지 않아 버튼이 로딩 상태로 굳을 수 있다. 또 앱이 보낸 에러 객체를 문자열로 그대로 찍으면 `[object Object]`만 남는다.\n- <strong>어떻게:<\/strong>\n  - <strong>버전 스큐<\/strong>가 전제다. 버전 스큐는 웹과 앱의 버전이 서로 어긋난 상태다. 웹은 최신인데 앱은 여러 버전이 섞여 있다.\n  - 채널은 보통 단방향이다. 예를 들어 Flutter `JavaScriptChannel`의 `postMessage`는 값을 돌려주지 않는다. 그래서 요청과 응답을 요청 ID로 직접 짝짓는다. 이 구조에서는 \"응답이 안 오는\" 경우가 생긴다.\n  - 요청-응답형 브릿지 호출에는 모두 <strong>타임아웃<\/strong>을 건다. `Promise.race`는 진 쪽을 취소하지 않으므로 대기 목록도 직접 정리한다. 시간이 초과되면 <strong>안전한 폴백<\/strong>(거부로 간주)으로 끝낸다.\n  - 기능 탐지를 한다. 앱이 지원하는 메서드와 버전을 알려 준다. 지원하지 않으면 진입점을 숨긴다.\n  - 에러는 <strong>구조화된 계약<\/strong>(코드·분류)으로 받는다. 그래야 일시적 실패, 빌드 결함, 버전 스큐를 구분할 수 있다.\n  - 웹뷰에서 막히는 기능(다운로드, 일부 권한)은 네이티브 브릿지로 폴백한다.\n- <strong>핵심:<\/strong> 웹뷰 브릿지는 <strong>버전 스큐가 기본값<\/strong>이다. 모든 호출에 <strong>타임아웃 + 폴백<\/strong>, 에러는 <strong>분류된 계약<\/strong>으로.\n- <strong>꼬리질문:<\/strong>\n  - \"타임아웃을 몇 초로 잡나요?\" → 호출 성격에 따라 다르다. 권한 팝업처럼 사람이 응답하는 호출은 길게 잡는다. 자동 응답만 있는 호출은 짧게 잡는다. 너무 짧으면 정상인 앱도 실패로 본다.\n  - \"판정 로직은 앱과 웹 중 어디에 두나요?\" → 자주 바뀌는 판정은 웹에 둔다. 앱에 두면 업데이트 전까지 옛 판정이 남는다.\n- <strong>출처:<\/strong> [webview_flutter](https://pub.dev/documentation/webview_flutter/latest/webview_flutter/WebViewController/addJavaScriptChannel.html) · [MDN — Promise.race](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/race)\n\n> 한 줄 정리: 네트워크 실패는 인증 실패가 아니고, 재시도는 일시적·멱등한 것만, 브릿지는 언제나 응답이 안 올 수 있다.\n\n## 핵심 키워드 모음\n\n- <strong>안전·멱등 메서드<\/strong>: GET/HEAD/OPTIONS/TRACE 안전, PUT/DELETE 멱등, POST·PATCH는 보장 안 됨, 기준은 의도된 효과\n- <strong>401 vs 403<\/strong>: 401은 인증 없음(갱신 대상), 403은 거절(갱신 금지), 이유는 업무 코드로\n- <strong>HTTP 캐시<\/strong>: max-age는 안 물음, no-cache는 매번 재검증, no-store는 저장 금지, ETag → 304\n- <strong>HTTP/1.1·2·3<\/strong>: 줄 서기 → 다중화(TCP HOL) → QUIC 스트림 독립·연결 이동, 서버 푸시 폐기\n- <strong>TLS<\/strong>: 암호화·무결성·인증, 1.3은 1-RTT, HSTS, 보안 컨텍스트\n- <strong>REST vs GraphQL<\/strong>: 필드 선택으로 오버·언더페칭 제거, 대가는 HTTP 캐시·N+1·복잡도 제한\n- <strong>SOP<\/strong>: 출처 = 스킴+호스트+포트, 읽기 차단·쓰기와 임베드 허용, CORS는 예외 허가\n- <strong>CORS<\/strong>: JSON·커스텀 헤더면 preflight, 쿠키면 와일드카드 금지, CSRF 방어 아님\n- <strong>쿠키 속성<\/strong>: HttpOnly·Secure·SameSite, None은 Secure 필수, Chrome 80부터 미지정은 Lax\n- <strong>XSS<\/strong>: 이스케이프·sanitize 1차, strict CSP 2차, 클릭재킹은 frame-ancestors\n- <strong>CSRF<\/strong>: 토큰·Fetch Metadata(Origin 폴백)가 주, SameSite는 보조, Bearer 헤더는 대상 아님\n- <strong>세션 vs JWT<\/strong>: 세션은 회수 쉬움, JWT는 검증 싸고 회수 어려움, 서명이지 암호화 아님\n- <strong>액세스/리프레시<\/strong>: 짧은 액세스·HttpOnly 리프레시, 회전(RFC 9700), BFF가 가장 안전\n- <strong>OAuth + PKCE<\/strong>: 인가 코드 + code_verifier, 공개 클라이언트 필수, Implicit 비권장\n- <strong>single-flight 갱신<\/strong>: 공유 Promise에 합류, finally로 비움, 재시도 1회\n- <strong>실시간 방식<\/strong>: 폴링·롱폴링·SSE(단방향·자동 재연결)·WebSocket(양방향)\n- <strong>재연결·재동기화<\/strong>: 백오프 + jitter, 하트비트로 half-open 감지, delta 또는 snapshot\n- <strong>오프라인 감지<\/strong>: onLine은 힌트, 판정은 요청 결과, 끊김 ≠ 인증 실패\n- <strong>재시도 정책<\/strong>: 일시적 실패 × 멱등 요청만, Query 기본 쿼리 3회·mutation 0회\n- <strong>웹뷰 브릿지<\/strong>: 버전 스큐 전제, 요청 ID·타임아웃·폴백\n"}, {"id": "n07", "num": "7", "title": "성능과 측정", "md": "# 7. 성능과 측정\n\n<strong>이 파트는 뭐냐:<\/strong> \"느리다\"는 말을 지표·원인·수단으로 쪼개서 다루는 파트다. 순서는 늘 <strong>측정 → 병목 특정 → 가장 싼 수단 → 재측정<\/strong>이다. 병목은 전체를 느리게 만드는 가장 막힌 구간이다. 측정 없이 고른 최적화는 근거를 댈 수 없다.\n\n## 1. 측정 먼저\n\n### 랩 데이터와 필드 데이터 (Lab vs Field Data)\n\n- <strong>뭐야:<\/strong> 성능 숫자를 얻는 방법은 두 가지다. 랩 데이터는 정해진 기기·네트워크 조건에서 한 번 재는 실험실 값이다. 필드 데이터는 실제 사용자 브라우저에서 모은 값이다.\n- <strong>왜:<\/strong> 둘을 구분하지 않으면 두 상황을 설명하지 못한다. 하나는 내 맥북에서 Lighthouse(Chrome의 성능 점검 도구)는 95점인데 사용자는 느리다고 하는 상황이다. 다른 하나는 점수는 낮은데 실사용 지표는 멀쩡한 상황이다. 둘을 같은 숫자로 착각하면 엉뚱한 곳을 고친다.\n- <strong>어떻게:<\/strong>\n  - <strong>랩(Lab)<\/strong>: Lighthouse·Performance 탭처럼 정해진 기기·네트워크 조건에서 한 번 재는 값이다. 같은 조건으로 다시 잴 수 있어서 <strong>원인 추적·전후 비교<\/strong>에 쓴다.\n  - <strong>필드(Field, RUM)<\/strong>: 실제 사용자 브라우저에서 모은 값이다. RUM은 실제 사용자 측정(Real User Monitoring)을 줄인 말이다. CrUX(Chrome 사용자 통계)에서 보거나 `web-vitals` 라이브러리로 직접 모은다. 여러 기기·네트워크의 값이 섞여 있어서 <strong>판정<\/strong>에 쓴다.\n  - CWV(Core Web Vitals, 구글이 정한 핵심 성능 지표 묶음) 합격 여부는 필드 데이터의 <strong>75번째 백분위(p75)<\/strong> 값으로 본다. p75는 값을 작은 순으로 줄 세웠을 때 75% 지점에 있는 값이다. 모바일과 데스크톱을 나눠서 본다.\n  - 일반 Lighthouse 실행은 페이지를 로드하기만 하고 사용자 상호작용이 없다. 그래서 INP(상호작용 반응 지표)를 못 잰다. 대신 TBT(Total Blocking Time, 긴 작업이 메인 스레드를 막은 시간의 합)를 <strong>랩용 대리 지표<\/strong>로 본다. 다만 TBT가 좋아도 INP가 나쁠 수 있다. 사용자가 언제 누를지 랩은 모르기 때문이다.\n- <strong>핵심:<\/strong> 판정은 <strong>필드 p75<\/strong>로, 원인 추적은 <strong>랩<\/strong>으로 한다. 랩 점수 올리기가 목표가 되면 안 된다.\n- <strong>꼬리질문:<\/strong>\n  - \"Lighthouse 점수가 매번 다른데요?\" → 점수는 CPU 부하·네트워크·확장 프로그램에 따라 흔들린다. 시크릿 창에서 여러 번 실행하고 중앙값으로 비교한다. 절대값보다 <strong>같은 조건의 전후 차이<\/strong>를 본다.\n  - \"필드 데이터가 없는 신규 서비스는요?\" → CrUX에는 공개 페이지이면서 방문자가 일정 수 이상인 페이지만 잡힌다(기준치는 비공개). 잡히지 않으면 `web-vitals`의 `onLCP`·`onINP`·`onCLS`로 값을 직접 보내 수집한다.\n- <strong>출처:<\/strong> [Why lab and field data can be different (web.dev)](https://web.dev/articles/lab-and-field-data-differences) · [Total Blocking Time (web.dev)](https://web.dev/articles/tbt) · [CrUX methodology](https://developer.chrome.com/docs/crux/methodology)\n\n### Performance 탭과 롱 태스크 (Performance Panel, Long Task)\n\n- <strong>뭐야:<\/strong> Chrome DevTools의 Performance 탭은 메인 스레드가 시간을 어디에 썼는지 녹화해 보여주는 도구다. 메인 스레드는 JS 실행과 화면 그리기를 맡는 스레드다. 그 기록에서 50ms 넘게 메인 스레드를 잡은 작업을 <strong>롱 태스크<\/strong>라 부른다.\n- <strong>왜:<\/strong> 이 도구가 없으면 버튼 반응이 굼뜨거나 스크롤이 끊길 때 어느 함수가 느린지 말할 근거가 없다. 결국 감으로 고치게 된다.\n- <strong>어떻게:<\/strong>\n  - 녹화한 뒤 Main 트랙의 플레임 차트에서 <strong>50ms 넘는 태스크<\/strong>를 찾는다. 이것이 롱 태스크다. 플레임 차트는 함수 호출을 가로 막대로 쌓아 보여주는 그림이고, 막대가 넓을수록 오래 걸린 것이다. 롱 태스크에는 빨간 삼각형이 붙고, 50ms를 넘긴 부분이 빨간 빗금으로 칠해진다.\n  - 색의 비율로 JS 문제인지 레이아웃 문제인지 가른다. 노란색은 스크립트 실행(Scripting), 보라색은 렌더링·레이아웃(Rendering/Layout), 초록색은 페인트(Painting)다.\n  - Interactions 트랙에는 클릭·키 입력 하나하나의 입력 지연·처리·표시 지연이 보인다. 200ms를 넘으면 경고가 붙는다.\n  - JS 안에서 보라색 Layout 블록이 반복되면 <strong>강제 동기 레이아웃(레이아웃 스래싱)<\/strong> 문제를 의심한다. 스타일을 바꾼 직후에 크기·위치를 읽어서 브라우저가 레이아웃을 그 자리에서 다시 계산하는 일이 되풀이되는 현상이다. 읽기와 쓰기를 분리해서 푼다.\n  - CPU 4~6배 스로틀링을 걸어 저사양 폰을 흉내 낸다. 스로틀링은 일부러 속도를 늦추는 설정이다.\n- <strong>핵심:<\/strong> 메인 스레드를 <strong>50ms 넘게<\/strong> 잡는 태스크가 입력 반응을 늦춘다. 플레임 차트는 <strong>넓은 블록 → 아래로 내려가며<\/strong> 가장 깊은 자기 시간(Self Time)을 찾는다.\n- <strong>꼬리질문:<\/strong>\n  - \"롱 태스크를 찾았는데 쪼갤 수 없는 계산이면요?\" → 방법은 두 가지다. 중간중간 메인 스레드에 양보해 입력이 끼어들 틈을 준다. 또는 계산을 웹 워커로 뺀다([1파트 참고](#n01/web-worker \"Web Worker\")). `scheduler.yield()`로 양보하면 이어지는 작업이 큐 맨 뒤가 아니라 앞쪽에 다시 들어간다. 주의: 2026-10 MDN 기준 Baseline(주요 브라우저가 모두 지원한다는 표시)이 아니다(Safari 미지원). 그래서 `setTimeout` 폴백(안 될 때 쓰는 대체 수단)을 같이 둔다.\n  - \"DevTools 일시정지는 언제 쓰나요?\" → 화면이 굳어 녹화조차 어려울 때 쓴다. 멈춘 시점의 콜스택이 무한 루프나 이벤트 고리가 도는 위치를 알려 준다.\n- <strong>출처:<\/strong> [Performance features reference (Chrome DevTools)](https://developer.chrome.com/docs/devtools/performance/reference) · [Optimize long tasks (web.dev)](https://web.dev/articles/optimize-long-tasks) · [Scheduler.yield() (MDN)](https://developer.mozilla.org/en-US/docs/Web/API/Scheduler/yield)\n\n### React Profiler\n\n- <strong>뭐야:<\/strong> React DevTools에 들어 있는 렌더 측정 도구다. 어떤 컴포넌트가 얼마나 오래 렌더됐는지를 커밋 단위로 보여준다. 커밋은 React가 렌더 결과를 실제 DOM에 반영하는 한 번의 단위다. 설정을 켜면 왜 다시 렌더됐는지도 기록한다.\n- <strong>왜:<\/strong> 입력 하나에 화면 전체가 버벅일 때 브라우저 Performance 탭만으로는 두 가지에서 막힌다. 호출 스택에 `performWorkUntilDeadline` 같은 React 내부 함수가 섞여 있어서 어느 컴포넌트가 느린지 골라내기 어렵다(프로덕션 빌드는 이름도 압축된다). 그 컴포넌트가 왜 다시 렌더됐는지도 알 수 없다.\n- <strong>어떻게:<\/strong>\n  - React DevTools Profiler로 녹화한다. 커밋별 <strong>Flamegraph·Ranked<\/strong> 차트에서 렌더 시간이 긴 컴포넌트를 확인한다.\n  - Profiler 설정의 \"Record why each component rendered while profiling\"을 켜면 다시 렌더된 이유가 나온다. 이유는 <strong>첫 렌더/props 변경/state 변경/hooks 변경/context 변경/부모 리렌더<\/strong> 중에서 표시된다. 이 설정은 기본으로 꺼져 있고, 켜면 측정에 약간의 부담(오버헤드)이 더해진다. 출처: [React DevTools CHANGELOG 4.0.0 \"Why did this render?\"](https://github.com/facebook/react/blob/main/packages/react-devtools/CHANGELOG.md) · [ProfilerSettings.js](https://github.com/facebook/react/blob/main/packages/react-devtools-shared/src/devtools/views/Settings/ProfilerSettings.js) · [WhatChanged.js](https://github.com/facebook/react/blob/main/packages/react-devtools-shared/src/devtools/views/Profiler/WhatChanged.js)\n  - \"Highlight updates\" 옵션으로 리렌더되는 영역을 눈으로 본다\n  - 코드에서 재고 싶으면 `<Profiler id onRender>` 컴포넌트를 쓴다. `actualDuration`은 이번 렌더에 실제 쓴 시간이고, 메모 효과가 반영된 값이다. `baseDuration`은 메모 없이 전부 다시 그릴 때의 추정치다. 둘을 비교한다.\n  - 주의: React 19.2(2025-10)부터 Chrome Performance 탭에 React 전용 트랙(Scheduler·Components)이 붙었다. 브라우저 타임라인 위에서 어느 우선순위의 렌더였는지까지 같이 볼 수 있다.\n- <strong>핵심:<\/strong> Profiler는 <strong>\"무엇이 왜 다시 렌더됐나\"<\/strong>를, Performance 탭은 <strong>\"메인 스레드 시간이 어디로 갔나\"<\/strong>를 본다. 둘을 같이 본다.\n- <strong>꼬리질문:<\/strong>\n  - \"개발 모드에서 잰 수치를 믿어도 되나요?\" → 개발 빌드는 경고와 이중 렌더(StrictMode) 때문에 느리다. 그래서 개발 모드 수치는 상대 비교에만 쓰고, 절대 수치는 프로덕션 빌드로 잰다. 다만 프로덕션 빌드는 `<Profiler>` 측정이 꺼져 있어서 `react-dom/profiling` 빌드로 바꿔야 한다.\n- <strong>출처:<\/strong> [Profiler (react.dev)](https://react.dev/reference/react/Profiler) · [React Performance Tracks (react.dev)](https://react.dev/reference/dev-tools/react-performance-tracks) · [Introducing the React Profiler (React 블로그, 2018)](https://legacy.reactjs.org/blog/2018/09/10/introducing-the-react-profiler.html)\n\n> 한 줄 정리: 필드로 판정하고 랩으로 원인을 찾고, 메인 스레드는 Performance 탭, 리렌더는 Profiler로 본다.\n\n## 2. Core Web Vitals\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"LCP는 로딩 초반, INP는 페이지 수명 동안의 상호작용, CLS는 전 구간의 레이아웃 이동에 해당함을 보여주는 타임라인\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"360\" fill=\"var(--fig-bg)\"/>\n  <text x=\"24\" y=\"30\" font-size=\"15\" fill=\"currentColor\" font-weight=\"bold\">페이지 수명 타임라인과 Core Web Vitals<\/text>\n  <line x1=\"40\" y1=\"130\" x2=\"690\" y2=\"130\" stroke=\"var(--fig-line)\" stroke-width=\"2\"/>\n  <polygon points=\"690,124 702,130 690,136\" fill=\"var(--fig-line)\"/>\n  <circle cx=\"40\" cy=\"130\" r=\"5\" fill=\"var(--fig-muted)\"/>\n  <text x=\"40\" y=\"152\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">요청<\/text>\n  <circle cx=\"130\" cy=\"130\" r=\"5\" fill=\"var(--fig-muted)\"/>\n  <text x=\"130\" y=\"152\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">TTFB<\/text>\n  <circle cx=\"220\" cy=\"130\" r=\"5\" fill=\"var(--fig-muted)\"/>\n  <text x=\"220\" y=\"152\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">FCP<\/text>\n  <circle cx=\"330\" cy=\"130\" r=\"7\" fill=\"var(--fig-accent)\"/>\n  <text x=\"330\" y=\"152\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">LCP<\/text>\n  <rect x=\"40\" y=\"70\" width=\"290\" height=\"30\" rx=\"6\" fill=\"var(--fig-accent)\" opacity=\"0.25\"/>\n  <text x=\"52\" y=\"90\" font-size=\"13\" fill=\"currentColor\">LCP: 가장 큰 콘텐츠가 그려질 때까지 · 좋음 ≤ 2.5s<\/text>\n  <text x=\"510\" y=\"100\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">사용자 상호작용 (탭·클릭·키 입력)<\/text>\n  <rect x=\"400\" y=\"176\" width=\"20\" height=\"26\" fill=\"var(--fig-muted)\"/>\n  <rect x=\"420\" y=\"176\" width=\"34\" height=\"26\" fill=\"var(--fig-accent2)\"/>\n  <rect x=\"454\" y=\"176\" width=\"14\" height=\"26\" fill=\"var(--fig-accent)\"/>\n  <rect x=\"520\" y=\"176\" width=\"12\" height=\"26\" fill=\"var(--fig-muted)\"/>\n  <rect x=\"532\" y=\"176\" width=\"18\" height=\"26\" fill=\"var(--fig-accent2)\"/>\n  <rect x=\"550\" y=\"176\" width=\"10\" height=\"26\" fill=\"var(--fig-accent)\"/>\n  <rect x=\"610\" y=\"176\" width=\"26\" height=\"26\" fill=\"var(--fig-muted)\"/>\n  <rect x=\"636\" y=\"176\" width=\"22\" height=\"26\" fill=\"var(--fig-accent2)\"/>\n  <rect x=\"658\" y=\"176\" width=\"12\" height=\"26\" fill=\"var(--fig-accent)\"/>\n  <line x1=\"400\" y1=\"130\" x2=\"400\" y2=\"176\" stroke=\"var(--fig-line)\" stroke-dasharray=\"3 3\"/>\n  <line x1=\"520\" y1=\"130\" x2=\"520\" y2=\"176\" stroke=\"var(--fig-line)\" stroke-dasharray=\"3 3\"/>\n  <line x1=\"610\" y1=\"130\" x2=\"610\" y2=\"176\" stroke=\"var(--fig-line)\" stroke-dasharray=\"3 3\"/>\n  <text x=\"400\" y=\"222\" font-size=\"13\" fill=\"currentColor\">입력 지연 → 처리 → 다음 페인트<\/text>\n  <text x=\"400\" y=\"240\" font-size=\"13\" fill=\"currentColor\">INP: 가장 느린 축의 상호작용 · 좋음 ≤ 200ms<\/text>\n  <rect x=\"40\" y=\"270\" width=\"650\" height=\"30\" rx=\"6\" fill=\"var(--fig-accent2)\" opacity=\"0.2\"/>\n  <polygon points=\"180,276 190,294 170,294\" fill=\"var(--fig-accent2)\"/>\n  <polygon points=\"300,276 310,294 290,294\" fill=\"var(--fig-accent2)\"/>\n  <polygon points=\"470,276 480,294 460,294\" fill=\"var(--fig-accent2)\"/>\n  <text x=\"52\" y=\"324\" font-size=\"13\" fill=\"currentColor\">CLS: 전 구간의 예상치 못한 레이아웃 이동, 가장 큰 묶음(세션 창) 점수 · 좋음 ≤ 0.1<\/text>\n<\/svg>\n<figcaption>LCP는 로딩, INP는 반응성, CLS는 시각 안정성 — 세 지표가 재는 구간이 다르다 (주의: 2024-03 기준 지표·임계값)<\/figcaption>\n<\/figure>\n\n### LCP (Largest Contentful Paint)\n\n- <strong>뭐야:<\/strong> 뷰포트 안에서 가장 큰 이미지나 글 덩어리가 화면에 그려지기까지 걸린 시간이다. 뷰포트는 지금 화면에 보이는 영역이다. \"주요 내용이 언제 보였나\"를 재는 로딩 지표다.\n- <strong>왜:<\/strong> 스켈레톤은 금방 뜨는데 정작 메인 이미지·제목은 늦게 나오는 경우가 있다. 첫 화면이 그려진 시점(FCP)만 보면 이 늦음이 안 잡힌다. LCP는 주요 콘텐츠가 로드됐을 가능성이 높은 시점을 표시해서 체감 로딩 속도에 가깝다(web.dev).\n- <strong>어떻게:<\/strong>\n  - 뷰포트 안에서 <strong>가장 큰 이미지·텍스트 블록<\/strong>이 그려진 시점을 잰다. 후보는 `<img>`, SVG 안 `<image>`, `<video>`(포스터 로드와 첫 프레임 중 이른 쪽), CSS `url()` 배경 이미지, 텍스트 블록이다. 주의: web.dev 기준(2026-10 확인) 좋음은 <strong>2.5s<\/strong> 이하, 나쁨은 4s 초과다(p75).\n  - 4구간으로 쪼개 본다: <strong>TTFB → 리소스 로드 지연(발견이 늦음) → 리소스 다운로드 → 렌더 지연<\/strong>. TTFB는 응답의 첫 바이트가 올 때까지의 시간이다.\n  - 발견 지연: LCP 이미지가 CSS `background`나 JS 렌더로만 존재하면 프리로드 스캐너가 찾지 못한다. 프리로드 스캐너는 HTML을 앞질러 훑으며 받을 리소스를 미리 찾는 브라우저 기능이다. 그래서 이미지를 HTML에 `<img>`로 두고 `fetchpriority=\"high\"`를 붙인다.\n  - 렌더 지연: 렌더 차단 CSS·폰트가 있거나, 클라이언트에서 데이터를 받아야만 그리는 구조일 때 생긴다. SSR(서버에서 HTML을 만들어 보내는 방식)·스트리밍으로 푼다.\n  - LCP 요소에 `loading=\"lazy\"`를 걸면 오히려 늦어진다\n- <strong>핵심:<\/strong> LCP는 <strong>TTFB·발견·다운로드·렌더 지연<\/strong> 네 조각의 합이다. LCP가 나쁜 사이트는 이미지 다운로드보다 <strong>TTFB와 발견 지연<\/strong>에 더 오래 쓰는 경우가 많다.\n- <strong>꼬리질문:<\/strong>\n  - \"CSR 앱이라 LCP가 늦습니다. SSR 말고 방법은?\" → LCP 리소스를 `preload`로 미리 받는다. 데이터 요청은 JS 번들 실행 뒤가 아니라 라우트 진입과 병렬로 시작한다. 근본 해결은 서버에서 HTML에 내용을 담는 것이다.\n  - \"스켈레톤도 LCP가 되나요?\" → 단색 블록은 후보 유형이 아니다. 정보량 낮은 자리표시 이미지, 투명 요소, 화면 전체 배경도 후보에서 빠진다. 다만 스켈레톤 안의 텍스트나 실제 이미지는 후보가 될 수 있다. 그래서 실제 LCP 요소는 Performance 탭의 LCP 마커로 확인한다.\n- <strong>출처:<\/strong> [Largest Contentful Paint (web.dev)](https://web.dev/articles/lcp) · [Optimize LCP (web.dev)](https://web.dev/articles/optimize-lcp)\n\n### INP (Interaction to Next Paint)\n\n- <strong>뭐야:<\/strong> 클릭·탭·키 입력 같은 상호작용 뒤 다음 화면이 그려지기까지 걸린 시간을 재는 지표다. 페이지 수명 동안 관찰한 상호작용 중 가장 느린 축의 값을 보고한다. 페이지를 쓰는 동안의 반응성을 잰다.\n- <strong>왜:<\/strong> 첫 로딩은 빠른데 필터 칩을 누르면 0.5초 뒤에야 반응하는 화면이 있다. 이런 굼뜸은 로딩 지표로는 안 잡힌다. INP가 그 빈자리를 잰다.\n- <strong>어떻게:<\/strong>\n  - 주의: <strong>2024-03-12부터 FID를 대체<\/strong>한 CWV다(web.dev 공지). FID(First Input Delay)는 첫 입력의 <strong>대기 시간만<\/strong> 쟀다. INP는 페이지 수명 동안의 <strong>모든<\/strong> 클릭·탭·키 입력을 <strong>다음 페인트까지<\/strong> 잰다. 스크롤·호버·확대는 대상이 아니다.\n  - 상호작용 하나의 시간은 세 구간의 합이다: <strong>입력 지연(앞선 태스크 대기) + 처리 시간(핸들러) + 표시 지연(렌더·페인트)<\/strong>\n  - 값은 대개 가장 느린 상호작용의 시간이다. 상호작용이 많은 페이지는 <strong>50회당 최악 1개<\/strong>를 이상치로 빼고 고른다. 주의: web.dev 기준(2026-10 확인) 좋음은 <strong>200ms<\/strong> 이하, 나쁨은 500ms 초과다(p75).\n  - 개선 방법은 넷이다. 핸들러에서 무거운 일을 뒤로 미룬다(`startTransition`, `yield`). 렌더 범위를 줄인다. 거대한 DOM을 줄인다. 서드파티 스크립트를 정리한다.\n- <strong>핵심:<\/strong> INP는 <strong>입력 지연·처리·표시 지연<\/strong> 셋으로 쪼갠다. 클릭 직후 <strong>보이는 피드백을 먼저 그리고<\/strong> 무거운 일은 뒤로.\n- <strong>꼬리질문:<\/strong>\n  - \"`useTransition`을 쓰면 왜 INP가 좋아지나요?\" → 상태 갱신을 긴급하지 않은 렌더로 표시하게 된다. 그러면 React가 그 렌더 중간에 양보할 수 있다. 입력창 값처럼 입력에 바로 답하는 갱신은 먼저 커밋되고, 무거운 목록 렌더는 뒤로 밀린다.\n  - \"랩에서 INP를 어떻게 재죠?\" → Lighthouse 기본 실행엔 상호작용이 없다. 대신 DevTools Performance 탭에서 실제로 클릭하며 녹화하면 Interactions 트랙에 각 상호작용 시간이 나온다. 로딩이 끝난 뒤만 누르지 말고 <strong>로딩 중에도<\/strong> 눌러 봐야 실제 사용자 상황이 나온다.\n- <strong>출처:<\/strong> [Interaction to Next Paint (web.dev)](https://web.dev/articles/inp) · [INP is officially a Core Web Vital (web.dev, 2024-03-12)](https://web.dev/blog/inp-cwv-launch)\n\n### CLS (Cumulative Layout Shift)\n\n- <strong>뭐야:<\/strong> 이미 보이던 요소가 예상치 못하게 밀려난 정도를 점수로 매긴 지표다. 이동을 묶음(세션 창)으로 나누고, 가장 큰 묶음의 합을 보고한다. 화면이 얼마나 덜컹거렸나를 잰다.\n- <strong>왜:<\/strong> 이미지가 로드되거나 배너가 끼어들어 레이아웃이 밀리면, 누르려던 버튼 대신 엉뚱한 것을 누르게 된다.\n- <strong>어떻게:<\/strong>\n  - 예상치 못한 레이아웃 이동마다 점수를 매긴다. 점수는 영향 비율 × 이동 거리 비율이다. 클릭·탭·키 입력 직후 500ms 안의 이동은 제외한다(스크롤은 입력으로 치지 않는다). 점수를 <strong>세션 창<\/strong>(이동 사이 1초 미만, 최대 5초) 단위로 묶고, 가장 큰 묶음을 쓴다. 주의: web.dev 기준(2026-10 확인) 좋음은 <strong>0.1<\/strong> 이하, 나쁨은 0.25 초과다(p75).\n  - 흔한 원인은 넷이다. 크기를 지정하지 않은 이미지·iframe, 늦게 끼어드는 배너·광고, 웹폰트 교체로 바뀌는 글자 폭, 비동기 데이터로 위쪽에 삽입되는 요소다.\n  - 대응: `width`/`height` 또는 `aspect-ratio`로 <strong>자리 예약<\/strong>을 한다. 삽입 영역에는 `min-height`를 준다. 폰트는 `size-adjust` 등으로 폴백 폰트(웹폰트가 오기 전에 대신 쓰는 폰트)의 크기를 맞춘다.\n  - 애니메이션은 `top`/`height` 대신 `transform`으로 만든다. `transform`은 레이아웃을 건드리지 않아서 CLS에 안 잡힌다.\n  - 클릭·키 입력 직후 0.5초 이내 이동은 제외된다(예: 아코디언 펼침). 스크롤·드래그 같은 연속 입력은 이 예외에 해당하지 않는다\n- <strong>핵심:<\/strong> CLS는 <strong>자리 예약<\/strong>의 문제다. 나중에 올 것의 크기를 <strong>먼저 알려준다<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"스켈레톤이 CLS를 막나요?\" → 스켈레톤 높이가 실제 콘텐츠와 같을 때만 막는다. 다르면 교체하는 순간 이동이 생긴다.\n- <strong>출처:<\/strong> [Cumulative Layout Shift (web.dev)](https://web.dev/articles/cls)\n\n### 보조 지표 TTFB·FCP (Time to First Byte, First Contentful Paint)\n\n- <strong>뭐야:<\/strong> TTFB는 페이지 이동을 시작한 때부터 응답의 첫 바이트가 도착하기 시작할 때까지의 시간이다(리다이렉트·DNS·연결 포함). FCP는 화면에 첫 콘텐츠(텍스트·이미지 등)가 그려진 시점이다. 둘 다 CWV 판정용이 아니라 원인을 가르는 진단용 지표다.\n- <strong>왜:<\/strong> 이 둘을 모르면 LCP가 나쁠 때 원인이 서버 쪽인지 프론트 쪽인지 가르지 못한다. \"CWV 말고 다른 지표도 아세요?\"라는 질문에도 막힌다.\n- <strong>어떻게:<\/strong>\n  - <strong>TTFB<\/strong>: 이동 시작부터 응답 첫 바이트까지의 시간이다. 리다이렉트·서비스 워커 시작·DNS·연결·TLS·서버 처리가 다 들어간다. 주의: web.dev 기준 좋음은 <strong>0.8s<\/strong> 이하, 나쁨은 1.8s 초과다. 대략적인 안내값이고 <strong>CWV가 아니다<\/strong>.\n  - <strong>FCP<\/strong>: 텍스트·이미지·SVG·흰색이 아닌 canvas 중 <strong>무엇이든 처음<\/strong> 그려진 시점이다. 주의: web.dev 기준 좋음은 <strong>1.8s<\/strong> 이하, 나쁨은 3.0s 초과다.\n  - 진단 순서: TTFB가 크면 서버·캐시·리다이렉트를 본다. TTFB는 작은데 FCP가 크면 렌더 차단 CSS·폰트를 본다. FCP는 빠른데 LCP가 늦으면 LCP 리소스의 발견·다운로드를 본다. 내비게이션 단계 자체는 1파트 참고.\n  - CSR(브라우저에서 JS로 화면을 그리는 방식) SPA는 HTML이 비어 있다. 그래서 TTFB가 작아도 FCP·LCP가 JS 실행을 기다린다. 반대로 SSR은 TTFB가 늘어도 FCP·LCP는 나아질 수 있다.\n- <strong>핵심:<\/strong> TTFB·FCP는 <strong>CWV가 아니라 진단용<\/strong>이다. LCP 4구간의 첫 조각이 TTFB이고, FCP와 LCP 사이 간격이 \"주요 콘텐츠가 늦다\"는 신호다.\n- <strong>꼬리질문:<\/strong>\n  - \"TTFB를 꼭 0.8초 안에 맞춰야 하나요?\" → 아니다. 서버 렌더링이라 TTFB가 길어도 LCP·FCP가 좋으면 괜찮다는 게 web.dev 입장이다. 또 103 Early Hints(본 응답 전에 먼저 보내는 힌트 응답)를 쓰면 그 응답이 첫 바이트로 잡혀서 TTFB 비교가 흐려진다.\n- <strong>출처:<\/strong> [Time to First Byte (web.dev)](https://web.dev/articles/ttfb) · [First Contentful Paint (web.dev)](https://web.dev/articles/fcp)\n\n> 한 줄 정리: LCP는 발견을 앞당기고, INP는 메인 스레드를 비우고, CLS는 자리를 예약한다. TTFB·FCP는 LCP가 어디서 늦는지 가르는 진단 지표다.\n\n## 3. 번들과 모듈\n\n### 번들 분석 (Bundle Analysis)\n\n- <strong>뭐야:<\/strong> 빌드 결과물(번들)이 어떤 청크와 모듈로 이루어졌고 각각 얼마나 큰지를 들여다보는 작업이다. 청크는 번들을 나눈 파일 조각이다.\n- <strong>왜:<\/strong> 분석하지 않으면 \"번들 줄여야 한다\"는 말만 나오고 무엇이 큰지 아무도 모른다.\n- <strong>어떻게:<\/strong>\n  - `@next/bundle-analyzer`(webpack)·`webpack-bundle-analyzer`·`source-map-explorer`로 청크별 트리맵을 본다. 트리맵은 크기를 사각형 넓이로 보여주는 그림이다. 주의: Next.js 16.1부터 Turbopack용 `next experimental-analyze`(실험 기능)가 import 경로까지 추적해 준다.\n  - 볼 것은 세 가지다. <strong>첫 화면 공용 청크에 들어간 큰 라이브러리<\/strong>, 같은 라이브러리의 <strong>중복 버전<\/strong>, 날짜·아이콘처럼 일부만 쓰는데 통째로 들어온 패키지다.\n  - 크기는 두 가지를 구분해 본다. parsed는 압축을 푼 뒤의 크기로, 파싱·실행 비용을 보여준다. gzip/brotli는 압축된 크기로, 전송 비용을 보여준다.\n  - 데이터를 UI로 바꾸기만 하는 라이브러리(코드 하이라이트·마크다운 파싱)는 서버 컴포넌트로 옮긴다. 그러면 클라이언트 번들에서 아예 빠진다.\n  - CI(코드를 올릴 때마다 자동으로 도는 검사)에서 `size-limit` 같은 도구로 예산을 걸면 크기가 다시 늘어나는 회귀를 막는다([아래 성능 예산 참고](#n07/성능-예산-performance-budget \"성능 예산\"))\n- <strong>핵심:<\/strong> 번들은 줄이기 전에 <strong>어느 청크에 무엇이<\/strong> 들었는지부터 본다. 전송 크기와 <strong>파싱·실행 비용<\/strong>은 다른 문제.\n- <strong>꼬리질문:<\/strong>\n  - \"gzip 크기만 보면 안 되나요?\" → 전송 비용은 그걸로 알 수 있다. 하지만 저사양 기기에서 비싼 것은 압축을 푼 JS의 파싱·실행 시간이다.\n- <strong>출처:<\/strong> [Optimizing package bundling (Next.js)](https://nextjs.org/docs/app/guides/package-bundling)\n\n### 코드 스플리팅과 동적 import (Code Splitting, Dynamic Import)\n\n- <strong>뭐야:<\/strong> 하나로 뭉친 번들을 여러 조각으로 나눠, 필요한 조각만 필요한 때 받게 하는 방식이다. 동적 `import()`가 그 나눔 지점을 만든다.\n- <strong>왜:<\/strong> 나누지 않으면 관리자 화면에서만 쓰는 에디터·차트가 로그인 화면 번들에도 들어간다. 모든 사용자가 그 비용을 낸다.\n- <strong>어떻게:<\/strong>\n  - 라우트 단위와 서버 컴포넌트는 Next.js App Router가 자동으로 나눈다. 클라이언트 컴포넌트 단위는 `next/dynamic`으로 나눈다. `next/dynamic`은 `React.lazy`와 `Suspense`를 조합한 것이다.\n  - `import()`는 실행 중에 모듈을 불러오고 Promise를 돌려준다. 번들러는 이 지점을 별도 청크로 뗀다. 같은 모듈은 한 번만 평가되고 캐시된다.\n  - 모달·에디터·차트처럼 <strong>조건부로 열리는 것<\/strong>이 1순위다. 클릭 직전의 `onMouseEnter`·`onFocus`에서 미리 import하면 대기 시간을 숨길 수 있다.\n  - `ssr: false`는 브라우저 API에 의존하는 라이브러리를 서버 렌더에서 뺄 때 쓴다. 클라이언트 컴포넌트 안에서만 쓸 수 있고, 서버 컴포넌트에서 쓰면 에러다.\n- <strong>핵심:<\/strong> 스플리팅은 총량을 줄이지 않고 <strong>비용을 내는 사람<\/strong>을 바꾼다. 기준은 \"무겁나\"가 아니라 <strong>\"누가 그 화면에 들어가나\"<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"다 쪼개면 좋은가요?\" → 아니다. 요청 수가 늘고, 쪼갠 조각은 필요한 순간에 받느라 기다려야 한다. 사용자 대부분이 들어가는 화면을 쪼개면 지연을 옮긴 것뿐이다.\n  - \"청크 로드가 실패하면요?\" → 배포로 해시가 바뀌면 옛 청크가 404가 될 수 있다. 이때 `import()` Promise가 reject된다. 그래서 에러 바운더리에 재시도나 새로고침 안내를 둔다.\n- <strong>출처:<\/strong> [Lazy loading (Next.js)](https://nextjs.org/docs/app/guides/lazy-loading) · [import() (MDN)](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/import)\n\n### 트리 셰이킹 (Tree Shaking)\n\n- <strong>뭐야:<\/strong> 빌드 도구가 실제로 쓰이지 않는 export를 번들에서 빼는 최적화다. 이름은 Rollup이 널리 퍼뜨렸고, webpack 문서는 이를 나무를 흔들어 죽은 잎(안 쓰는 코드)을 떨어뜨리는 것에 비유한다. 다만 실제로는 저절로 떨어지지 않고, 아래 조건을 만족해 정적으로 \"안 쓴다\"고 증명된 export만 빠진다.\n- <strong>왜:<\/strong> 아래 조건을 모르고 깨뜨리면 함수 하나만 import했는데 라이브러리 전체가 번들에 들어온다.\n- <strong>어떻게:<\/strong>\n  - 번들러가 <strong>정적 `import`/`export` 그래프<\/strong>를 보고 안 쓰는 export를 제거한다. 정적이라는 말은 코드를 실행하지 않고도 알 수 있다는 뜻이다.\n  - 조건 1: <strong>ESM<\/strong>이어야 한다. ESM은 `import`/`export` 문법을 쓰는 표준 모듈 방식이다. CommonJS `require`는 실행 중에 정해지는 동적 방식이라 정적 분석이 어렵다(주의: webpack 5는 일부 CommonJS 패턴만 추적하고, 분석 못 하는 모듈은 포기한다).\n  - 조건 2: <strong>부수효과 없음<\/strong>을 알려야 한다. 부수효과는 import만 해도 모듈 밖 상태를 바꾸는 동작이다. `package.json`에 `\"sideEffects\": false`를 적거나 `\"*.css\"` 같은 예외 목록을 적는다. CSS를 예외 목록에서 빼먹으면 스타일이 지워진다. 모듈 최상단에서 전역을 건드리는 코드는 지울 수 없다.\n  - 조건 3: 배럴 파일(`index.ts`에서 전부 re-export하는 파일)은 부수효과 판단이 꼬이면 통째로 끌려온다. 그래서 직접 경로로 import하거나 Next.js `optimizePackageImports`를 쓴다(주의: Next.js 16 문서 기준 `experimental` 옵션. `lucide-react`·`date-fns`·`lodash-es` 등은 기본 적용).\n  - `lodash` 대신 `lodash-es`처럼 ESM 배포판을 고른다. 셰이킹은 production 빌드의 최소화 단계에서 완성된다. 그래서 개발 빌드로 판단하지 않는다.\n- <strong>핵심:<\/strong> 트리 셰이킹 조건은 <strong>ESM + 부수효과 없음 + 정적 분석 가능<\/strong>이다. 하나라도 깨지면 통째로 들어오기 쉽다. ESM 원리 자체는 2파트 참고.\n- <strong>꼬리질문:<\/strong>\n  - \"`import * as utils`는 셰이킹이 안 되나요?\" → 되는 경우가 많다. 번들러가 어떤 속성을 쓰는지 정적으로 추적할 수 있으면 안 쓰는 것을 걸러 낸다(번들러마다 다르다). 다만 `utils[name]`처럼 동적으로 접근하면 추적이 끊긴다.\n- <strong>출처:<\/strong> [Tree Shaking (webpack)](https://webpack.js.org/guides/tree-shaking/) · [optimizePackageImports (Next.js)](https://nextjs.org/docs/app/api-reference/config/next-config-js/optimizePackageImports)\n\n### 대형 모듈·WASM 지연 로드\n\n- <strong>뭐야:<\/strong> 얼굴 인식·PDF 생성처럼 수 MB짜리 모듈이나 WASM(WebAssembly, 브라우저에서 도는 바이너리 코드 형식)을 앱 번들에 넣지 않고, 그 기능에 들어가는 순간에 따로 불러오는 방식이다.\n- <strong>왜:<\/strong> 일반 import로 넣으면 그 기능을 안 쓰는 사용자까지 큰 첫 로딩 비용을 낸다. 번들러가 거대한 파일을 처리하지 못해 빌드가 깨지기도 한다.\n- <strong>어떻게:<\/strong>\n  - 번들에 넣지 않고 <strong>기능 진입 시점에 `<script>` 주입·동적 import<\/strong>로 불러온다.\n  - 로더를 <strong>싱글플라이트<\/strong>(공유 Promise)로 만든다. 여러 곳이 동시에 불러도 한 번만 받게 하는 방식이다. `import()`는 모듈 단위로 캐시되지만, `<script>` 주입과 WASM 초기화는 중복을 직접 막아야 한다.\n  - 로딩 중이거나 실패했을 때의 UX 정책을 먼저 정한다. 기다리게 할지, 기능 없이 진행시킬지를 고른다(<strong>fail-open/closed<\/strong>). fail-open은 실패하면 통과시키는 쪽이고, fail-closed는 막는 쪽이다.\n  - 무거운 계산은 웹 워커로 옮겨 메인 스레드를 비운다\n- <strong>핵심:<\/strong> 대형 모듈은 <strong>필요한 사람만, 필요한 순간에, 한 번만<\/strong> 받게 한다. 그리고 <strong>로딩 실패 시 정책<\/strong>까지가 설계다.\n- <strong>꼬리질문:<\/strong>\n  - \"로딩이 끝날 때까지 기능을 막으면 되지 않나요?\" → 저사양 기기나 느린 망에서는 영영 못 쓰는 사용자가 생긴다. 타임아웃 뒤에 우회 경로를 열어 둬야 한다.\n- <strong>출처:<\/strong> [import() (MDN)](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/import) · [Lazy loading — Loading External Libraries (Next.js)](https://nextjs.org/docs/app/guides/lazy-loading#loading-external-libraries)\n\n> 한 줄 정리: 분석으로 범인을 찾고, 조건부 기능은 쪼개고, 셰이킹 조건을 지키고, 대형 모듈은 진입 시점에 한 번만.\n\n## 4. 리소스 로딩\n\n### 이미지 최적화 (Image Optimization)\n\n- <strong>뭐야:<\/strong> 이미지를 알맞은 포맷·크기로, 알맞은 시점에 내려주는 작업이다. 같은 그림이라도 화면에 필요한 만큼만 보낸다.\n- <strong>왜:<\/strong> 이미지를 손보지 않으면 이미지 많은 목록이 느리다. LCP 요소도 대부분 이미지다. 200px 자리에 2000px 원본이 내려오는 일이 흔하다.\n- <strong>어떻게:<\/strong>\n  - <strong>포맷<\/strong>: 사진은 WebP·AVIF, 도형·아이콘은 SVG를 쓴다. `<picture>`로 AVIF → WebP → JPEG 순서의 폴백을 둔다.\n  - <strong>크기<\/strong>: `srcset`에 후보 이미지 목록을, `sizes`에 이 요소가 화면에 표시되는 폭을 적는다. 그러면 브라우저가 DPR까지 보고 알맞은 것을 고른다. DPR은 CSS 1px을 실제 화면 픽셀 몇 개로 그리는지를 나타내는 배율이다. 기준은 <strong>표시 크기 × DPR<\/strong>이다.\n  - <strong>시점<\/strong>: 화면 밖 이미지는 `loading=\"lazy\"`로 늦게 받는다. LCP 이미지는 eager(즉시 로드)로 두고 `fetchpriority=\"high\"`를 붙인다. 처음엔 안 보이는 캐러셀 뒷장은 `fetchpriority=\"low\"`로 낮춘다.\n  - <strong>자리 예약<\/strong>: `width`/`height`·`aspect-ratio`로 CLS를 막는다.\n  - 디코딩도 비용이다. 디코딩은 압축된 이미지 파일을 화면에 그릴 픽셀로 푸는 일이다. `decoding=\"async\"`를 쓰고, 이미지 개수 자체를 줄인다.\n  - `next/image`가 포맷 변환·`srcset`·lazy를 대신 해준다. 외부 이미지는 `remotePatterns`에 등록해야 한다.\n- <strong>핵심:<\/strong> 이미지는 <strong>포맷·크기·시점<\/strong> 세 축 + <strong>자리 예약<\/strong>으로 최적화한다. LCP 이미지에 lazy는 금지.\n- <strong>꼬리질문:<\/strong>\n  - \"전부 `lazy` 걸면 되나요?\" → 안 된다. 첫 화면 이미지가 늦게 뜬다. 뷰포트 위쪽 이미지는 eager로 두고 우선순위를 높인다.\n  - \"사용자 업로드 이미지는요?\" → 원본은 통제할 수 없다. 업로드할 때 리사이즈·변환하거나, 이미지 CDN의 URL 파라미터로 변환해서 받는다.\n- <strong>출처:<\/strong> [Responsive images (web.dev)](https://web.dev/articles/responsive-images) · [Browser-level image lazy loading (web.dev)](https://web.dev/articles/browser-level-image-lazy-loading) · [Fetch Priority API (web.dev)](https://web.dev/articles/fetch-priority)\n\n### 폰트 로딩 (FOIT·FOUT, font-display, Subset)\n\n- <strong>뭐야:<\/strong> 웹폰트를 받는 동안 글자를 어떻게 보여줄지 정하는 일이다. 글자를 안 보이게 두고 기다리는 것이 FOIT다. 기본 폰트로 먼저 보여주고 나중에 바꾸는 것이 FOUT다. 둘 중 무엇으로 할지는 `font-display`로 고른다.\n- <strong>왜:<\/strong> 정하지 않으면 둘 중 하나를 겪는다. 글자가 몇 초간 안 보인다(FOIT). 또는 기본 폰트로 떴다가 웹폰트로 바뀌면서 줄바꿈이 튄다(FOUT, CLS로 이어진다). 한글 폰트는 글자 수가 많아 파일이 커서 더 심하다.\n- <strong>어떻게:<\/strong>\n  - <strong>FOIT<\/strong>(Flash of Invisible Text)는 폰트가 올 때까지 글자를 숨기는 것이다. <strong>FOUT<\/strong>(Unstyled)는 폴백 폰트로 먼저 보여주고 나중에 교체하는 것이다.\n  - `font-display` 값은 네 가지다. `block`은 짧게 숨긴 뒤 교체하고, 교체 기간에 제한이 없다. `swap`은 거의 즉시 폴백을 보여주고, 폰트가 오면 교체한다. `fallback`은 아주 짧게 숨기고, 교체 기간이 짧아서 폰트가 늦으면 폴백을 유지한다. `optional`은 아주 짧게 숨기고 교체 기간이 없다. 그 안에 못 오면 그 페이지에선 폴백을 유지하므로 CLS가 가장 적다.\n  - 파일 형식은 <strong>woff2<\/strong>를 쓴다(WOFF보다 약 30% 더 압축). 한글은 <strong>서브셋<\/strong>(쓰는 글자만)을 만들거나 `unicode-range`로 나눠서 필요한 조각만 받는다.\n  - 첫 화면 폰트는 `preload`한다. 이때 `as=\"font\"`와 `crossorigin`이 필수다(같은 오리진이어도). 오리진은 프로토콜·도메인·포트의 조합이다. 폴백 폰트는 `size-adjust`로 메트릭(글자 폭·높이 값)을 맞춰 교체할 때의 이동을 줄인다. 단 preload는 다른 핵심 리소스의 대역폭을 뺏으니 아껴 쓴다.\n  - `next/font`는 셀프호스팅(폰트 파일을 내 서버에서 직접 내려주는 것)·preload·폴백 메트릭 조정을 자동으로 해준다.\n- <strong>핵심:<\/strong> 폰트 로딩은 빨리 보여주기와 레이아웃 안정성의 교환이다. 본문은 <strong>swap<\/strong>, 레이아웃 민감하면 <strong>optional<\/strong>, 한글은 <strong>서브셋·unicode-range<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"폰트 preload에 crossorigin은 왜 붙이나요?\" → 폰트는 스펙상 익명 CORS 모드로 가져온다. preload 요청의 모드가 이와 다르면 실제 폰트 요청과 맞지 않는다. 그러면 preload가 쓸모없어진다.\n  - \"외부 폰트 CDN 대신 셀프호스팅은 왜?\" → 이유는 셋이다. 첫째, 다른 오리진으로의 연결이 하나 준다. 둘째, 주의: Chrome 86부터 HTTP 캐시가 최상위 사이트별로 나뉘어(cache partitioning) \"다른 사이트에서 이미 받아 둔 CDN 폰트\" 이점이 사라졌다. 셋째, 플랫폼별 폰트 차이도 통제할 수 있다. 대신 CDN·HTTP/2 같은 전송 환경은 직접 갖춰야 한다.\n- <strong>출처:<\/strong> [Best practices for fonts (web.dev)](https://web.dev/articles/font-best-practices) · [font-display (MDN)](https://developer.mozilla.org/en-US/docs/Web/CSS/@font-face/font-display) · [Gaining security and privacy by partitioning the cache (Chrome)](https://developer.chrome.com/blog/http-cache-partitioning)\n\n### 리소스 힌트 (preload·prefetch·preconnect)\n\n- <strong>뭐야:<\/strong> 브라우저에게 \"이 연결·파일이 곧 필요하다\"고 미리 알려주는 `<link>` 힌트다. preconnect는 연결을 앞당긴다. preload는 지금 페이지의 파일을, prefetch는 다음 페이지의 파일을 앞당긴다.\n- <strong>왜:<\/strong> 힌트가 없으면 두 가지가 늦어진다. HTML에 없고 CSS·JS 안에서만 참조되는 LCP 이미지·폰트는 그 파일을 받아 해석한 뒤에야 발견된다. 다음 화면의 리소스는 이동한 뒤에야 받기 시작한다.\n- <strong>어떻게:<\/strong>\n  - `preconnect`: 곧 쓸 <strong>다른 오리진<\/strong>에 DNS·TCP·TLS 연결을 미리 맺는다. 10초 안에 쓰지 않으면 브라우저가 연결을 닫는다. 그래서 <strong>바로 쓸 핵심 오리진 몇 개만<\/strong> 건다. 폰트 오리진에는 `crossorigin`을 붙인다. `dns-prefetch`는 DNS 조회만 미리 한다.\n  - `preload`: <strong>지금 페이지<\/strong>에서 곧 필요한데 늦게 발견되는 리소스를 높은 우선순위로 미리 받는다. 힌트가 아니라 <strong>반드시 받는 요청<\/strong>이다. `as` 속성이 필수다.\n  - `prefetch`: <strong>다음 페이지<\/strong>에 쓸 리소스를 브라우저가 한가할 때 낮은 우선순위로 받아 캐시해 둔다.\n  - `fetchpriority=\"high|low|auto\"`: 발견 시점은 그대로 두고 <strong>우선순위만<\/strong> 올리거나 내린다. 발견을 앞당기는 preload와 짝으로 쓴다. 주의: web.dev 기준 Chrome 102·Safari 17.2·Firefox 132부터 지원한다.\n  - Next.js `<Link>`는 뷰포트에 들어온 링크의 라우트를 프리페치한다. 주의: Next.js 16 문서 기준 <strong>프로덕션에서만<\/strong> 동작한다. 기본값(`auto`)은 정적 라우트면 전체를 받고, 동적 라우트면 가장 가까운 `loading.js` 경계까지만 받는다.\n- <strong>핵심:<\/strong> <strong>preconnect는 연결<\/strong>, <strong>preload는 지금 페이지 발견 앞당김<\/strong>, <strong>prefetch는 다음 페이지 미리 받기<\/strong>다. preload 남발은 진짜 중요한 것과 대역폭을 다툰다.\n- <strong>꼬리질문:<\/strong>\n  - \"다 preload하면 안 되나요?\" → 안 된다. 우선순위가 다 높으면 아무것도 우선이 아니다. LCP·첫 화면 폰트처럼 <strong>늦게 발견되는 핵심 1~2개<\/strong>만 건다.\n  - \"모바일 데이터 사용자에게 prefetch는?\" → 가지 않을 수도 있는 페이지 때문에 사용자의 데이터를 쓰게 된다. 그래서 데이터 절약 모드(`navigator.connection.saveData`)를 확인해서 끄기도 한다.\n  - \"preload와 fetchpriority 차이는?\" → preload는 <strong>발견<\/strong>을 앞당긴다. HTML에 없던 리소스를 일찍 요청하게 한다. fetchpriority는 이미 발견된 리소스의 <strong>순서<\/strong>를 바꾼다. HTML `<img>`에 있는 LCP 이미지는 fetchpriority만으로 충분한 경우가 많다.\n- <strong>출처:<\/strong> [Establish network connections early (web.dev)](https://web.dev/articles/preconnect-and-dns-prefetch) · [Fetch Priority API (web.dev)](https://web.dev/articles/fetch-priority) · [Link — prefetch (Next.js)](https://nextjs.org/docs/app/api-reference/components/link#prefetch)\n\n### 캐시로 재요청 줄이기 (HTTP Cache, Query Cache)\n\n- <strong>뭐야:<\/strong> 한 번 받은 응답을 저장해 두고 다시 쓰는 것이다. 브라우저 HTTP 캐시와 TanStack Query 같은 쿼리 캐시, 이렇게 두 층이 있다.\n- <strong>왜:<\/strong> 캐시를 쓰지 않으면 잘 바뀌지 않는 데이터인데도 탭을 오갈 때마다 같은 목록을 다시 받는다. 그때마다 로딩 스피너가 뜬다.\n- <strong>어떻게:<\/strong>\n  - <strong>HTTP 캐시<\/strong>: 파일 이름에 해시가 들어간 정적 자산은 `Cache-Control: max-age=31536000`으로 길게 캐시한다(`immutable`은 선택, 지원 브라우저 한정). HTML은 `no-cache`로 둔다. `no-cache`는 저장은 하되 매번 재검증하는 값이고, `no-store`와 다르다. 이렇게 하면 배포 즉시 반영과 장기 캐시를 동시에 얻는다(헤더 상세는 [6파트 참고](#n06/http-캐시-cache-control-etag-304 \"HTTP 캐시: Cache-Control, ETag, 304\")).\n  - <strong>클라이언트 캐시(TanStack Query)<\/strong>: `staleTime`은 데이터를 신선하다고 보는 기간이다. 이 동안은 재요청하지 않는다(기본 0). `gcTime`은 안 쓰는 캐시를 보관하는 시간이다(기본 5분). 둘을 <strong>도메인 성격별로<\/strong> 다르게 잡는다([5파트 참고](#n05/staletime과-gctime \"staleTime과 gcTime\")).\n  - 신선도 낮은 화면은 <strong>stale-while-revalidate<\/strong>로 한다. 캐시를 바로 보여주고 뒤에서 갱신하는 방식이다. 재방문 때 로딩 화면이 사라진다.\n  - 서로 독립인 조회는 <strong>병렬로<\/strong> 보내 워터폴을 없앤다. 워터폴은 앞 요청이 끝나야 다음 요청이 시작되는 순차 대기다. 실시간성이 필요한 조회는 예외로 캐시 시간을 짧게 잡는다.\n- <strong>핵심:<\/strong> 캐시 시간은 기술이 아니라 <strong>데이터가 얼마나 자주 바뀌는가<\/strong>로 정한다. `staleTime` 기본값 0은 \"매번 다시 확인\"이다.\n- <strong>꼬리질문:<\/strong>\n  - \"캐시를 길게 잡으면 대가는?\" → 다른 사용자가 바꾼 값을 늦게 본다. 변경 직후에는 mutation에서 <strong>도메인 루트 키 무효화<\/strong>로 보완한다([5파트 참고](#n05/무효화-범위는-넓게-invalidation-scope \"무효화 범위는 넓게\")).\n- <strong>출처:<\/strong> [Prevent unnecessary network requests with the HTTP Cache (web.dev)](https://web.dev/articles/http-cache) · [Important Defaults (TanStack Query)](https://tanstack.com/query/latest/docs/framework/react/guides/important-defaults)\n\n> 한 줄 정리: 이미지는 포맷·크기·시점, 폰트는 swap·서브셋, 힌트는 핵심 1~2개만, 재요청은 도메인별 캐시로.\n\n## 5. 런타임 성능\n\n### 긴 리스트 가상화 (List Virtualization)\n\n- <strong>뭐야:<\/strong> 긴 목록에서 지금 화면에 보이는 행만 DOM으로 그리고, 스크롤에 따라 그 행들을 바꿔 끼우는 기법이다.\n- <strong>왜:<\/strong> 수백~수천 행의 목록·채팅을 전부 그리면 스크롤이 끊기고 입력이 굼뜨다. DOM 노드 수 자체가 레이아웃·페인트 비용이기 때문이다.\n- <strong>어떻게:<\/strong>\n  - 스크롤 위치로 <strong>보이는 인덱스 범위 + overscan<\/strong>만 렌더한다. overscan은 보이는 범위 위아래로 여유 있게 더 그려 두는 행이다. 나머지 높이는 빈 요소(spacer)로 채워 스크롤바 길이를 유지한다.\n  - 라이브러리는 `@tanstack/react-virtual`(마크업을 직접 쥐는 headless 방식)과 `react-window`가 있다. overscan은 빠른 스크롤 때 빈칸이 비치는 것을 막는다. 다만 많이 잡을수록 이득이 줄어든다.\n  - 가변 높이: <strong>추정 높이로 먼저 그리고 측정 후 보정<\/strong>한다. 이미지가 늦게 로드되면 다시 튄다.\n  - 채팅처럼 위쪽에 과거 메시지를 붙일 때는 붙이기 전의 `scrollHeight`를 재 둔다. 붙인 뒤 늘어난 차이만큼 `scrollTop`을 보정한다.\n  - 가상화보다 먼저 할 일이 있다. <strong>한 번에 다 안 받기<\/strong>(커서 페이지네이션)와 <strong>행 리렌더 범위<\/strong> 줄이기다.\n- <strong>핵심:<\/strong> 긴 리스트는 <strong>덜 받기(페이지네이션) → 행 리렌더 줄이기 → 가상화<\/strong> 순서로 푼다. 가상화는 DOM 수 문제의 해법이지 데이터 양 문제의 해법이 아니다.\n- <strong>꼬리질문:<\/strong>\n  - \"가상화의 대가는?\" → 세 가지다. 브라우저 `Ctrl+F` 검색에 화면 밖 항목이 안 걸린다. 스크린리더가 전체 개수를 모른다. 앵커 이동과 가변 높이 처리가 복잡해진다.\n  - \"몇 개부터 가상화하나요?\" → 정해진 숫자는 없다. 저사양 기기에서 측정해 프레임이 떨어질 때 한다. 페이지네이션으로 DOM 수가 관리되면 필요 없을 수 있다.\n- <strong>출처:<\/strong> [Virtualize large lists with react-window (web.dev)](https://web.dev/articles/virtualize-long-lists-react-window) · [TanStack Virtual — Introduction](https://tanstack.com/virtual/latest/docs/introduction)\n\n### 리렌더 줄이기 순서 (Measure → Scope → Memo)\n\n- <strong>뭐야:<\/strong> 불필요한 리렌더를 줄일 때 측정 → 상태 범위 좁히기 → memo 순서로 접근하는 방법이다. memo부터 손대지 않는다는 원칙이다.\n- <strong>왜:<\/strong> 순서 없이 가면 원인을 그대로 둔 채 `useMemo`·`useCallback`만 도배하게 된다. 원인은 상태 위치나 불안정한 props다. 그러면 입력 한 글자에 화면 전체가 리렌더되는 문제가 잘 나아지지 않는다.\n- <strong>어떻게:<\/strong>\n  - 1) <strong>측정<\/strong>: Profiler로 정말 리렌더가 원인인지, 어느 컴포넌트가 비싼지 확인한다.\n  - 2) <strong>범위 줄이기<\/strong>: 방법은 넷이다. 상태를 쓰는 곳 가까이로 <strong>내리기<\/strong>(state colocation). 바뀌는 부분을 자식으로 분리하기. `children`으로 넘겨 리렌더 경계 밖에 두기. Context를 값 단위로 쪼개기.\n  - 3) <strong>구독 좁히기<\/strong>: TanStack Query `select`나 스토어 셀렉터로 필요한 조각만 구독한다.\n  - 4) 그래도 비싸면 <strong>memo<\/strong>: `React.memo`와 안정적인 props(`useCallback`·`useMemo`)를 <strong>같이<\/strong> 쓴다.\n  - 렌더 중에 레이아웃을 측정하면(`getBoundingClientRect`) 리렌더마다 레이아웃 계산을 강제한다. 그래서 레이아웃이 바뀔 때만 잰다.\n  - 주의: React Compiler 1.0(2025-10-07 정식 출시, React 17 이상 지원·19는 별도 런타임 불필요)을 켜면 빌드할 때 자동으로 메모이제이션(계산 결과를 기억해 두고 다시 쓰는 것)이 들어간다. 그만큼 수동 memo가 필요한 곳이 줄어든다. 조건부 return 뒤의 값처럼 `useMemo`로는 못 거는 곳도 메모한다.\n- <strong>핵심:<\/strong> 리렌더는 <strong>측정 → 범위 → memo<\/strong> 순서로 줄인다. memo는 props가 <strong>참조적으로 안정<\/strong>할 때만 효과가 있다.\n- <strong>꼬리질문:<\/strong>\n  - \"`React.memo`가 안 먹는 경우는?\" → 매 렌더마다 새 객체·인라인 함수·`children` JSX가 props로 내려갈 때다. 이때는 얕은 비교가 항상 실패한다.\n  - \"memo를 전부 걸면 대가는?\" → 비교 비용과 메모리가 든다. 의존성 배열을 관리하는 부담도 생긴다. 싼 컴포넌트는 그냥 다시 그리는 게 빠르다.\n- <strong>출처:<\/strong> [React Compiler v1.0 (react.dev, 2025-10-07)](https://react.dev/blog/2025/10/07/react-compiler-1) · [Profiler (react.dev)](https://react.dev/reference/react/Profiler)\n\n### 메모리 누수 찾기 (Heap Snapshot)\n\n- <strong>뭐야:<\/strong> 힙 스냅샷은 특정 순간의 JS 메모리에 무엇이 남아 있는지 찍은 사진이다. 여러 장을 비교해서, 해제돼야 할 객체를 누가 붙잡고 있는지 찾는다. 메모리 누수는 더 안 쓰는 객체가 해제되지 않고 쌓이는 현상이다.\n- <strong>왜:<\/strong> 누수를 못 찾으면 키오스크·대시보드처럼 오래 켜 두는 화면이 몇 시간 뒤 느려지거나 웹뷰가 죽는다. 화면을 오갈수록 메모리가 계단식으로 오른다.\n- <strong>어떻게:<\/strong>\n  - Memory 탭에서 <strong>힙 스냅샷 3장 비교<\/strong>를 한다. 기준 한 장, 동작(화면 열고 닫기)을 한 번 한 뒤 한 장, 같은 동작을 N회 반복하고 GC한 뒤 한 장을 찍는다. GC는 안 쓰는 메모리를 자동으로 치우는 가비지 컬렉션이다. 반복 횟수만큼 늘어난 객체가 범인 후보다.\n  - <strong>Detached DOM<\/strong> 필터로 검색한다. Detached DOM은 문서에서 떨어졌는데 JS가 아직 참조 중인 노드다. Retainers 패널에서 \"누가 붙잡고 있나\"를 추적한다.\n  - Performance 탭의 Memory 체크박스로 JS 힙·노드 수의 추세를 확인한다. GC 뒤에도 시작보다 높게 끝나는 계단 모양이면 누수를 의심한다. 지나치게 잦은 오르내림은 GC가 잦다는 신호다.\n  - 흔한 원인은 셋이다. 해제하지 않은 `addEventListener`·`setInterval`·소켓 구독·`ResizeObserver`, 계속 쌓기만 하는 모듈 전역 캐시·Map, 큰 객체를 붙잡은 클로저다.\n  - React에서는 `useEffect`의 cleanup에서 해제한다. 비동기 작업은 `AbortController`로 언마운트 때 취소한다.\n- <strong>핵심:<\/strong> 누수는 <strong>스냅샷 비교 + Retainers<\/strong>로 붙잡는 참조를 찾는다. 원인 대부분은 <strong>cleanup 누락<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"`WeakMap`을 쓰면 해결되나요?\" → 캐시의 수명을 키 객체의 수명에 묶고 싶을 때만 해결된다. 키로는 객체(또는 등록 안 된 심볼)만 쓸 수 있다. 키 객체를 다른 곳이 계속 참조하면 항목도 남는다. 값이 키를 참조하는 것은 수거를 막지 않는다.\n  - \"언마운트 후 setState 경고가 사라졌던데요?\" → React 18이 그 경고를 지웠다. 정작 문제없는 상황에서 주로 떠서 우회 코드만 늘렸기 때문이다. 경고가 없어졌어도 끊지 않은 구독·타이머는 여전히 누수다.\n- <strong>출처:<\/strong> [Fix memory problems (Chrome DevTools)](https://developer.chrome.com/docs/devtools/memory-problems) · [How to Upgrade to React 18 (react.dev)](https://react.dev/blog/2022/03/08/react-18-upgrade-guide)\n\n### 웹뷰 환경 성능 특이점 (WebView)\n\n- <strong>뭐야:<\/strong> 웹뷰는 네이티브 앱 안에 끼워 넣은 브라우저 화면이다. iOS는 엔진부터 다르다(WebKit). 기기 사양과 앱과의 브릿지도 데스크톱 Chrome과 다르다. 브릿지는 웹과 네이티브 앱이 서로 호출하는 통로다. 그래서 성능 특성이 다르다.\n- <strong>왜:<\/strong> 이 차이를 모르면 두 가지 문제를 놓친다. 하나는 데스크톱 Chrome에선 멀쩡한데 앱 안 웹뷰에서만 느린 문제다. 다른 하나는 브라우저 기능(다운로드·권한)이 조용히 안 되는 문제다.\n- <strong>어떻게:<\/strong>\n  - 엔진이 다르다. iOS는 WKWebView(WebKit)이고 Android는 시스템 WebView(Chromium 계열)다. Safari에서 안 되는 것은 iOS 앱에서도 안 된다.\n  - 저사양 안드로이드 비중이 높아 <strong>CPU 스로틀링 기준<\/strong>으로 측정해야 한다\n  - 앱 콜드 스타트, 웹뷰 초기화, 웹 로딩이 겹친다. 콜드 스타트는 앱을 완전히 꺼진 상태에서 처음 띄우는 것이다. 그래서 첫 화면 리소스를 더 공격적으로 줄인다.\n  - CrUX는 데스크톱·Android Chrome(Custom Tabs 포함) 사용자만 모은다. 주의: CrUX 방법론 문서(2026-10 확인)상 <strong>Android 앱의 WebView와 iOS의 Chrome은 제외<\/strong>다. 그래서 앱 웹뷰 트래픽은 CrUX에 안 잡히고, `web-vitals`로 직접 수집한다. iOS WKWebView에선 `onCLS`가 보고되지 않는 점도 감안한다.\n  - <strong>브릿지 호출은 비동기·실패 가능<\/strong>하다. 구버전 앱이 응답하지 않으면 영원히 기다리게 된다. 그래서 타임아웃과 폴백이 필수다.\n- <strong>핵심:<\/strong> 웹뷰는 <strong>다른 엔진·저사양·브릿지 의존<\/strong> 환경이다. 브릿지 호출엔 항상 <strong>타임아웃과 폴백<\/strong>.\n- <strong>꼬리질문:<\/strong>\n  - \"앱 버전과 웹 버전이 어긋나면?\" → 웹은 즉시 배포되지만 앱은 사용자가 업데이트해야 한다. 그래서 브릿지 기능은 먼저 지원 여부를 확인하고, 실패하면 웹 폴백으로 넘어가게 설계한다.\n- <strong>출처:<\/strong> [CrUX methodology (Chrome)](https://developer.chrome.com/docs/crux/methodology) · [web-vitals 라이브러리 — Browser Support (GitHub)](https://github.com/GoogleChrome/web-vitals)\n\n> 한 줄 정리: 리스트는 덜 받고 덜 그리고, 리렌더는 측정 후 범위부터, 누수는 스냅샷 비교, 웹뷰는 타임아웃·폴백.\n\n## 6. 체감 성능과 성능 유지\n\n### 체감 성능과 스켈레톤 (Perceived Performance)\n\n- <strong>뭐야:<\/strong> 실제 로딩 시간과 별개로 사용자가 느끼는 빠르기다. 스켈레톤은 내용이 올 자리에 같은 크기의 회색 틀을 먼저 그려 두는 자리표시 UI다.\n- <strong>왜:<\/strong> 실제 로딩 시간이 같아도 어떤 화면은 \"빠르다\", 어떤 화면은 \"멈췄다\"는 말을 듣는다. 버튼을 눌러도 아무 표시가 없으면 사용자가 연타한다.\n- <strong>어떻게:<\/strong>\n  - <strong>즉시 피드백<\/strong>: 누른 순간 눌림 상태·스피너·낙관적 갱신([5파트 참고](#n05/낙관적-업데이트와-롤백-optimistic-update \"낙관적 업데이트와 롤백\"))부터 그린다. 낙관적 갱신은 서버 응답을 기다리지 않고 성공한 것처럼 화면을 먼저 바꾸는 것이다. 무거운 일은 그 뒤에 한다([INP 참고](#n07/inp-interaction-to-next-paint \"INP\")).\n  - <strong>점진 표시<\/strong>: 텍스트를 먼저, 이미지를 나중에 보여준다. 스켈레톤은 실제 콘텐츠와 <strong>같은 크기<\/strong>로 자리를 잡아야 교체 때 CLS가 안 생긴다.\n  - <strong>흔들림 제거<\/strong>: 늦게 오는 광고·이미지·폰트의
